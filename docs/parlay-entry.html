<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>html{background:#050505}</style>
<title>Retirement League — Enter Picks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/bigshouldersdisplay/v24/fC1_PZJEZG-e9gHhdI4-NBbfd2ys3SjJCx1czNDu.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* ---------- Enter Picks (site audit II #11) ----------
     Paste the week's note, see every leg with the game ESPN found for it
     (or why it found none), then save it to Auto Parlay Tracker with the
     PIN. The parse and the game lookups run in this page (parlay-note.js);
     the Worker only checks the PIN and starts the Action that writes the
     sheet. */
  .gold-btn{
    background: none; border: 1px solid var(--gold); color: var(--gold);
    font-family: var(--body); font-weight: 600; font-size: 0.8rem;
    border-radius: 999px; padding: 8px 14px; cursor: pointer;
  }
  .gold-btn.solid{ background: var(--gold); color: var(--ctl-on-ink); }
  @media (hover: hover){
    .gold-btn:hover{ background: rgba(212,180,106,0.1); }
    .gold-btn.solid:hover{ background: #E0C47F; }
  }
  .gold-btn:focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }
  .gold-btn:disabled{ opacity: 0.45; cursor: default; }
  @media (hover: hover){ .gold-btn:disabled:hover{ background: none; } .gold-btn.solid:disabled:hover{ background: var(--gold); } }

  /* The page turns text selection off site-wide (theme.css); the fields
     you type into need it back. 16px keeps iPhone Safari from zooming in. */
  .note-box, .pin-box, .fix-time{ user-select: text; -webkit-user-select: text; }
  .note-box{
    display: block; width: 100%; min-height: 200px; resize: vertical;
    background: var(--item); color: var(--text); border: 1px solid var(--item-line); border-radius: 10px;
    padding: 12px 14px; font: 16px/1.45 var(--body);
  }
  .note-box:focus, .pin-box:focus, .fix-time:focus{ outline: none; border-color: var(--gold); }
  .note-acts{ display: flex; gap: 8px; margin-top: 10px; }

  /* The week, Sacko, odds and payout the note gave, plus how many legs are
     ready, as one row of chips under the panel title. */
  .chips{ display: flex; flex-wrap: wrap; gap: 6px; }
  .chip{ display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-size: 0.8rem; color: var(--text); white-space: nowrap; }
  .chip.gold{ color: var(--gold); border-color: var(--lead-line); background: var(--lead-tint); font-weight: 600; }
  .chip.loss{ color: var(--loss); border-color: var(--loss-line); background: var(--loss-tint); font-weight: 600; }
  .chip .dim{ color: var(--text-dim); }

  /* ---------- Legs ----------
     The same row shape as Parlay Results' legs: name and odds on top, the
     bet under them, then the game. A leg the page can't use as it stands
     (no game found, or a line it couldn't split) is ringed red the way a
     lost leg is, and the problem is spelled out on the row. */
  .leg{ background: var(--item); border: 1px solid var(--item-line); border-radius: 10px; padding: 12px 14px 11px; margin-top: 8px; }
  .leg:first-child{ margin-top: 0; }
  .leg.bad{ border-color: var(--loss-line); background: var(--loss-tint); }
  .leg.missing{ color: var(--text-dim); }
  @media (min-width: 900px){
    .legs-grid{ display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: start; }
    .legs-grid .leg{ margin-top: 0; }
  }
  .leg-top{ display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .leg-name{ font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .leg-odds{ font-family: var(--scoreboard); font-weight: 700; font-size: 0.95rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .leg-bet{ color: var(--text-dim); font-size: 0.86rem; margin-top: 3px; }
  .leg-bet b{ color: var(--text); font-weight: 600; }
  .leg-game{ display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; font-size: 0.82rem; }
  .leg-when{ min-width: 0; }
  .leg-when .sport{ color: var(--gold); font-weight: 700; }
  .leg-when .vs{ color: var(--text-dim); }
  .leg-why{ color: var(--loss); font-size: 0.8rem; font-weight: 600; margin-top: 6px; }
  .leg-wait{ color: var(--text-dim); display: inline-flex; align-items: center; gap: 7px; }
  .leg-wait::before{ content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); animation: blink 1s ease-in-out infinite; }
  @keyframes blink{ 50%{ opacity: 0.25; } }
  @media (prefers-reduced-motion: reduce){ .leg-wait::before{ animation: none; } }
  .link-btn{ background: none; border: none; color: var(--gold); font: 600 0.78rem var(--body); cursor: pointer; padding: 0; white-space: nowrap; position: relative; }
  .link-btn::before{ content: ''; position: absolute; inset: -12px -8px; }

  /* Typing a game in by hand: the sheet's Sport list and a kickoff. */
  .fix-cap{ color: var(--text-dim); font-size: 0.76rem; margin-top: 10px; }
  .fix{ display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .fix .parlay-select{ flex: 0 0 auto; }
  .fix-time{
    color-scheme: dark; flex: 1 1 190px; min-width: 0; height: var(--track-h); padding: 0 12px;
    background: var(--ctl-bg); color: var(--text); border: 1px solid var(--ctl-line); border-radius: calc(var(--track-h) / 2);
    font: 16px var(--body);
  }

  .skipped{ margin-top: 12px; font-size: 0.8rem; color: var(--text-dim); }
  .skipped div{ color: var(--text); font-family: ui-monospace, Menlo, monospace; font-size: 0.78rem; margin-top: 4px; overflow-wrap: anywhere; }

  /* ---------- Save ---------- */
  .save-note{ color: var(--text-dim); font-size: 0.82rem; margin: 0 0 12px; }
  .save-note[hidden]{ display: none; }
  .save-note.warn{ color: var(--loss); font-weight: 600; }
  .save-row{ display: flex; gap: 8px; align-items: center; }
  .pin-box{
    width: 120px; height: 40px; padding: 0 14px; background: var(--item); color: var(--text);
    border: 1px solid var(--item-line); border-radius: 999px; font: 16px var(--body); letter-spacing: 0.2em;
  }
  .save-row .gold-btn{ height: 40px; flex: 1 1 auto; font-size: 0.86rem; }
  .steps{ margin-top: 14px; display: grid; gap: 8px; font-size: 0.85rem; }
  .step{ display: flex; gap: 10px; align-items: baseline; color: var(--text-dim); }
  .step i{ font-style: normal; width: 14px; text-align: center; flex: none; }
  .step.done{ color: var(--text); }
  .step.done i{ color: var(--gold); }
  .step.fail{ color: var(--loss); font-weight: 600; }
  .step a{ color: var(--gold); font-weight: 600; }
</style>
</head>
<body>
  <div id="site-nav"></div>
  <div class="wrap">
    <header>
      <div class="header-row">
        <div>
          <div class="eyebrow">Retirement League</div>
          <h1>Enter Picks</h1>
        </div>
      </div>
    </header>

    <section>
      <div class="glass">
        <div class="panel-title">Note</div>
        <div class="panel-body">
          <textarea class="note-box" id="note" spellcheck="false" autocomplete="off" autocapitalize="off"
            aria-label="The week's parlay note" placeholder="2026 Week 7:&#10;Sacko: …&#10;&#10;Brad: Spread: Lions -5.5 vs. Cardinals (-110)&#10;…&#10;&#10;Final Odds: +478887&#10;Final Payout: $95,797.48"></textarea>
          <div class="note-acts">
            <button type="button" class="gold-btn" id="paste-btn">Paste</button>
            <button type="button" class="gold-btn" id="clear-btn">Clear</button>
          </div>
        </div>
      </div>
    </section>

    <section id="preview" hidden>
      <div class="glass">
        <div class="panel-title"><span>Legs</span><span class="chip" id="legs-count"></span></div>
        <div class="panel-body">
          <div class="chips" id="week-chips" style="margin-bottom:12px"></div>
          <div class="legs-grid" id="legs"></div>
          <div class="skipped" id="skipped" hidden></div>
        </div>
      </div>
    </section>

    <section id="save" hidden>
      <div class="glass">
        <div class="panel-title">Save</div>
        <div class="panel-body">
          <p class="save-note" id="save-replace"></p>
          <p class="save-note warn" id="save-warn"></p>
          <form class="save-row" id="save-form" autocomplete="off">
            <input class="pin-box" id="pin" type="password" inputmode="numeric" placeholder="PIN" aria-label="PIN" autocomplete="off">
            <button type="submit" class="gold-btn solid" id="save-btn">Save to the sheet</button>
          </form>
          <div class="steps" id="steps" hidden></div>
        </div>
      </div>
    </section>

    <footer id="site-footer" data-source="Games from ESPN"></footer>
  </div>

<script src="nav.js?v=9"></script>
<script src="page-common.js?v=27"></script>
<script src="parlay-note.js?v=1"></script>
<script>
  const WORKER_URL = 'https://retirement-league-refresh-proxy.bradbutcher321.workers.dev';
  const PIN_KEY = 'rl-parlay-pin';
  const NOTE_KEY = 'rl-parlay-note';
  const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const store = {
    get: k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
    set: (k, v) => { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch { /* private mode */ } },
  };

  const noteEl = document.getElementById('note');
  const preview = document.getElementById('preview');
  const legsEl = document.getElementById('legs');
  const saveSec = document.getElementById('save');
  const saveBtn = document.getElementById('save-btn');
  const pinEl = document.getElementById('pin');
  const stepsEl = document.getElementById('steps');

  let players = [];
  let weeks = [];
  let parsed = null;
  // Lookups by what was looked up, so retyping one line re-checks only that
  // leg, and a re-render never starts the same search twice.
  const lookups = new Map();
  // A game typed in by hand, by player: {sport, gametime}. Kept while the
  // player's line stays the same.
  const manual = new Map();
  const editing = new Set();
  let saving = false;

  const fmtOdds = o => o == null ? '—' : (o > 0 ? '+' : '') + Math.round(o).toLocaleString('en-US');
  const fmtMoney = n => '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  // The sheet's naive Eastern "2026-10-11T16:25:00" -> "Sun 10/11 · 4:25 PM".
  function fmtKick(iso) {
    const [d, t] = iso.split('T');
    const [y, m, day] = d.split('-').map(Number);
    const [h, min] = t.split(':').map(Number);
    const dow = DAYS[new Date(Date.UTC(y, m - 1, day)).getUTCDay()];
    return `${dow} ${m}/${day} · ${h % 12 || 12}:${String(min).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`;
  }
  const lookupKey = p => [p.bet_type, p.team, p.opponent, p.player_prop].join('|');

  // The bet the way the sheet will read it, in place of the raw line.
  function betText(p, g) {
    const team = g && g.team || p.team, opp = g && g.opponent || p.opponent;
    if (p.team || p.opponent) {
      const side = p.side ? `${p.side} ${p.line} ` : '';
      const line = !p.side && p.line ? ` ${p.line}` : '';
      return `<b>${esc(p.bet_type)}</b> · ${esc(side + team + line)} vs. ${esc(opp)}`;
    }
    if (p.player_prop) return `<b>${esc(p.bet_type)}</b> · ${esc(p.player_prop)}${p.side ? ` ${esc(p.side)} ${esc(p.line)}` : ''}`;
    return `<b>${esc(p.bet_type)}</b> · ${esc(p.details)}`;
  }

  function gameFor(name, p) {
    const m = manual.get(name);
    if (m && m.line === p.raw_line && m.gametime) return { state: 'manual', sport: m.sport, gametime: m.gametime };
    const l = lookups.get(lookupKey(p));
    if (!l || !l.result) return { state: 'wait' };
    return l.result.found ? { state: 'found', ...l.result } : { state: 'missing', why: l.result.why };
  }

  function lookUp(p) {
    const key = lookupKey(p);
    if (lookups.has(key)) return;
    const entry = { result: null };
    lookups.set(key, entry);
    ParlayNote.findGame(p).then(r => {
      entry.result = r;
      // ESPN not answering isn't an answer: let the next edit or render retry.
      if (!r.found && /didn't answer/.test(r.why)) setTimeout(() => lookups.delete(key), 0);
      render();
    });
  }

  function weekOf(final) {
    if (final.year && final.week) return { year: Number(final.year), week: Number(final.week), fromNote: true };
    const last = weeks[weeks.length - 1];
    return last ? { year: last.year, week: last.week + 1, fromNote: false } : null;
  }

  // A lookup finishing mid-typing in a leg's kickoff field would rebuild
  // the field out from under you, so the redraw waits until you leave it.
  let renderHeld = false;
  legsEl.addEventListener('focusout', () => setTimeout(() => { if (renderHeld) render(); }, 0));
  function render() {
    renderHeld = legsEl.contains(document.activeElement) && document.activeElement.matches('input, select');
    if (renderHeld) return;
    const text = noteEl.value;
    parsed = text.trim() ? ParlayNote.parse(text, players) : null;
    const has = parsed && (Object.keys(parsed.picks).length || parsed.final.year);
    preview.hidden = saveSec.hidden = !has;
    if (!has) return;
    const { picks, final, unmatched } = parsed;

    const names = players.filter(n => picks[n]);
    names.forEach(n => lookUp(picks[n]));
    const rows = names.map(n => {
      const p = picks[n], g = gameFor(n, p);
      return { n, p, g, bad: !p.ok || g.state === 'missing' };
    });
    // Problems first, then kickoff order like Parlay Results.
    rows.sort((a, b) => (b.bad - a.bad) || (a.g.gametime || '9').localeCompare(b.g.gametime || '9'));

    legsEl.innerHTML = rows.map(({ n, p, g, bad }) => {
      let game;
      if (g.state === 'wait') game = '<span class="leg-wait">Finding the game…</span>';
      else if (g.state === 'missing') game = '<span class="leg-when" style="color:var(--loss);font-weight:600">Game not found</span>';
      else {
        const vs = g.matchup ? `<span class="vs"> · ${esc(g.matchup)}</span>` : g.state === 'manual' ? '<span class="vs"> · typed in</span>' : '';
        game = `<span class="leg-when"><span class="sport">${esc(g.sport)}</span> · ${esc(fmtKick(g.gametime))}${vs}</span>`;
      }
      const canEdit = g.state !== 'wait';
      const open = editing.has(n) || g.state === 'missing';
      const edit = canEdit && !open ? `<button type="button" class="link-btn" data-edit="${esc(n)}">Change</button>` : '';
      const m = manual.get(n) || {};
      const fix = canEdit && open ? `
        <div class="fix-cap">Sport and kickoff (Eastern)</div>
        <div class="fix">
          <select class="parlay-select" data-sport="${esc(n)}" aria-label="Sport for ${esc(n)}">
            ${ParlayNote.SPORTS.map(s => `<option${s === (m.sport || g.sport || 'NFL') ? ' selected' : ''}>${s}</option>`).join('')}
          </select>
          <input class="fix-time" type="datetime-local" step="60" data-time="${esc(n)}" aria-label="Kickoff for ${esc(n)} (Eastern)"
            value="${esc((m.gametime || g.gametime || '').slice(0, 16))}">
        </div>` : '';
      const why = [!p.ok && p.why, g.state === 'missing' && g.why].filter(Boolean);
      return `
        <div class="leg${bad ? ' bad' : ''}">
          <div class="leg-top"><span class="leg-name">${esc(n)}</span><span class="leg-odds">${fmtOdds(p.odds)}</span></div>
          <div class="leg-bet">${betText(p, g)}</div>
          <div class="leg-game">${game}${edit}</div>
          ${why.map(w => `<div class="leg-why">${esc(w)}</div>`).join('')}
          ${fix}
        </div>`;
    }).join('') + players.filter(n => !picks[n]).map(n => `
        <div class="leg missing">
          <div class="leg-top"><span class="leg-name">${esc(n)}</span><span class="leg-odds">—</span></div>
          <div class="leg-bet">No line in the note</div>
        </div>`).join('');

    const ready = rows.filter(r => !r.bad && r.g.state !== 'wait').length;
    const waiting = rows.filter(r => r.g.state === 'wait').length;
    const problems = rows.filter(r => r.bad).length;
    const countEl = document.getElementById('legs-count');
    countEl.className = `chip ${problems || rows.length < players.length ? 'loss' : waiting ? '' : 'gold'}`;
    countEl.textContent = waiting ? `Finding ${waiting} game${waiting === 1 ? '' : 's'}…`
      : `${ready} of ${players.length} ready`;

    const wk = weekOf(final);
    const saved = wk && weeks.some(w => w.year === wk.year && w.week === wk.week);
    document.getElementById('week-chips').innerHTML = [
      wk ? `<span class="chip${wk.fromNote ? '' : ' loss'}">${wk.year} · Week ${wk.week}${wk.fromNote ? '' : ' <span class="dim">(not in the note)</span>'}</span>` : '',
      final.sacko ? `<span class="chip">Sacko · ${esc(final.sacko)}</span>` : '',
      final.odds != null ? `<span class="chip">Odds ${fmtOdds(final.odds)}</span>` : '',
      final.payout != null ? `<span class="chip">Payout ${fmtMoney(final.payout)}</span>` : '',
    ].join('');

    const skipped = document.getElementById('skipped');
    skipped.hidden = !unmatched.length;
    skipped.innerHTML = unmatched.length ? `Lines that aren't a pick, so they won't be saved:${unmatched.map(l => `<div>${esc(l)}</div>`).join('')}` : '';

    // What saving will do, and what it can't fix by itself.
    const noTime = rows.filter(r => r.g.state === 'missing').length;
    const replaceEl = document.getElementById('save-replace'), warnEl = document.getElementById('save-warn');
    replaceEl.hidden = !saved;
    replaceEl.textContent = saved ? `${wk.year} Week ${wk.week} is already saved. Saving replaces it; a pick that didn't change keeps its result.` : '';
    warnEl.hidden = !noTime;
    warnEl.textContent = noTime ? `${noTime} leg${noTime === 1 ? ' has' : 's have'} no game, so ${noTime === 1 ? 'it' : 'they'} won't grade until one is added.` : '';
    if (!saving) {
      saveBtn.disabled = !rows.length || !wk || waiting > 0;
      saveBtn.textContent = waiting ? 'Finding games…' : saved ? `Replace Week ${wk.week}` : 'Save to the sheet';
    }
  }

  // ---------- Typing / editing ----------
  let renderTimer = null;
  noteEl.addEventListener('input', () => {
    store.set(NOTE_KEY, noteEl.value);
    clearTimeout(renderTimer);
    // Parsing is instant, but each keystroke shouldn't start a search for a
    // half-typed team name.
    renderTimer = setTimeout(render, 600);
  });
  document.getElementById('paste-btn').addEventListener('click', async () => {
    try {
      noteEl.value = await navigator.clipboard.readText();
      store.set(NOTE_KEY, noteEl.value);
      render();
    } catch {
      noteEl.focus(); // no clipboard access: paste by hand
    }
  });
  document.getElementById('clear-btn').addEventListener('click', () => {
    noteEl.value = '';
    store.set(NOTE_KEY, '');
    manual.clear();
    editing.clear();
    stepsEl.hidden = true;
    render();
    noteEl.focus();
  });
  legsEl.addEventListener('click', e => {
    const b = e.target.closest('[data-edit]');
    if (!b) return;
    editing.add(b.dataset.edit);
    render();
    const input = legsEl.querySelector(`[data-time="${CSS.escape(b.dataset.edit)}"]`);
    if (input) input.focus();
  });
  legsEl.addEventListener('change', e => {
    const n = e.target.dataset.sport || e.target.dataset.time;
    if (!n || !parsed || !parsed.picks[n]) return;
    const row = e.target.closest('.leg');
    const sport = row.querySelector('[data-sport]').value;
    const time = row.querySelector('[data-time]').value;
    manual.set(n, { line: parsed.picks[n].raw_line, sport, gametime: time ? `${time}:00` : '' });
    if (time) editing.delete(n);
    render();
  });

  // ---------- Save ----------
  function rowsToSave() {
    const out = {};
    for (const n of players) {
      const p = parsed.picks[n];
      if (!p) continue;
      const g = gameFor(n, p);
      const has = g.state === 'found' || g.state === 'manual';
      out[n] = {
        sport: has ? g.sport : '', bet_type: p.bet_type,
        // ESPN's own spelling of the teams (and a ranked team's #), like the desktop tool.
        team: (g.state === 'found' && g.team) || p.team, opponent: (g.state === 'found' && g.opponent) || p.opponent,
        player_prop: p.player_prop, line: p.line, side: p.side, odds: p.odds,
        gametime: has ? g.gametime : '', raw_pick: p.raw_line,
      };
    }
    return out;
  }

  function showSteps(list) {
    stepsEl.hidden = false;
    stepsEl.innerHTML = list.map(([state, html]) =>
      `<div class="step ${state}"><i>${state === 'done' ? '✓' : state === 'fail' ? '!' : '…'}</i><span>${html}</span></div>`).join('');
  }

  const ERRORS = {
    wrong_pin: b => `Wrong PIN. ${b.triesLeft} tr${b.triesLeft === 1 ? 'y' : 'ies'} left before saving locks for an hour.`,
    locked: () => 'Too many wrong PINs. Saving is locked for an hour.',
    cooldown: b => `Just saved. Try again in ${b.retryAfterSeconds}s.`,
    not_configured: () => "Saving isn't set up yet (no PIN on the Worker).",
  };

  document.getElementById('save-form').addEventListener('submit', async e => {
    e.preventDefault();
    if (!parsed || saveBtn.disabled) return;
    const pin = pinEl.value.trim();
    if (!pin) { pinEl.focus(); return; }
    const wk = weekOf(parsed.final);
    const body = {
      pin,
      picks: {
        year: wk.year, week: wk.week, sacko: parsed.final.sacko || '',
        final_odds: parsed.final.odds, final_payout: parsed.final.payout,
        dry_run: new URLSearchParams(location.search).has('dry'),
        rows: rowsToSave(),
      },
    };
    saving = true;
    saveBtn.disabled = true;
    saveBtn.textContent = 'Sending…';
    const sentAt = Date.now();
    let res, out = {};
    try {
      res = await fetch(WORKER_URL + '/parlay-entry', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      out = await res.json().catch(() => ({}));
    } catch {
      res = null;
    }
    if (!res || !res.ok) {
      saving = false;
      const msg = res && ERRORS[out.error] ? ERRORS[out.error](out) : `Couldn't send it (${res ? out.error || res.status : 'no connection'}). Try again.`;
      showSteps([['fail', esc(msg)]]);
      if (out.error === 'wrong_pin') { store.set(PIN_KEY, ''); pinEl.select(); }
      render();
      return;
    }
    store.set(PIN_KEY, pin);
    saveBtn.textContent = 'Sent';
    const label = `${wk.year} Week ${wk.week}`;
    showSteps([['done', `Sent ${label}`], ['', 'Writing it to the sheet, grading and publishing. Usually a minute or two.']]);
    if (body.picks.dry_run) {
      showSteps([['done', `Sent ${label} as a dry run`], ['done', 'Nothing will be written. Check the Enter Parlay Picks Action log.']]);
      saving = false;
      return;
    }
    // Done once Parlay Results' data is newer than the save and has the week.
    const deadline = sentAt + 6 * 60 * 1000;
    const poll = async () => {
      try {
        const data = await fetch(WORKER_URL + '/parlay-stats', { cache: 'no-store' }).then(r => r.json());
        // Newer than the save, and holding these picks: a scheduled refresh
        // can publish the old copy of a week being replaced in between.
        const w = Date.parse(data.generated_at) > sentAt && data.weeks.find(x => x.year === wk.year && x.week === wk.week);
        const sent = Object.entries(body.picks.rows);
        if (w && sent.every(([n, r]) => w.picks[n] && (w.picks[n].odds ?? null) === (r.odds ?? null))) {
          weeks = data.weeks;
          store.set(NOTE_KEY, '');
          showSteps([['done', `Sent ${label}`], ['done', `Saved and published. <a href="parlay-results.html">See it on Parlay Results</a>`]]);
          saving = false;
          saveBtn.textContent = 'Saved';
          return;
        }
      } catch { /* try again next tick */ }
      if (Date.now() < deadline) setTimeout(poll, 10000);
      else {
        saving = false;
        showSteps([['done', `Sent ${label}`], ['fail', `It hasn't shown up after six minutes. Check the <a href="https://github.com/bradbutcher321/RetirementLeague/actions/workflows/enter_parlay.yml" target="_blank" rel="noopener">Enter Parlay Picks</a> Action.`]]);
        render();
      }
    };
    setTimeout(poll, 30000);
  });

  // ---------- Start ----------
  pinEl.value = store.get(PIN_KEY);
  noteEl.value = store.get(NOTE_KEY);
  fetch(WORKER_URL + '/parlay-stats', { cache: 'no-store' })
    .then(r => r.json())
    .then(data => {
      players = data.players || [];
      weeks = data.weeks || [];
      render();
    })
    .catch(() => {
      preview.hidden = false;
      legsEl.innerHTML = '<div class="empty-note" style="color:var(--loss)">Couldn\'t load the league\'s players. Reload to try again.</div>';
    });
</script>
<script src="track.js?v=1" defer></script>
</body>
</html>
