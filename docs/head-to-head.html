<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retirement League — Head to Head</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=3">
<link rel="stylesheet" href="nav.css?v=3">
<link rel="stylesheet" href="league.css?v=2">
<style>
  .vs-head{
    display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: center; gap: 12px;
    padding: 16px; border-bottom: 1px solid var(--line);
  }
  .vs-name{ font-family: var(--scoreboard); font-weight: 800; font-size: clamp(1.5rem, 5vw, 2.2rem); line-height: 1; overflow: hidden; text-overflow: ellipsis; }
  .vs-name.right{ text-align: right; }
  .vs-name.lead{ color: var(--gold); }
  .vs-mid{ color: var(--text-dim); font-size: 0.8rem; font-weight: 700; letter-spacing: 0.08em; }
  .vs-summary{ text-align: center; color: var(--text-dim); font-size: 0.85rem; padding: 12px 16px 4px; }
  .cmp{ padding: 4px 16px 12px; }
  .cmp-row{
    display: grid; grid-template-columns: minmax(0,1fr) minmax(110px, auto) minmax(0,1fr); align-items: center; gap: 12px;
    padding: 9px 0; border-bottom: 1px solid var(--line);
  }
  .cmp-row:last-child{ border-bottom: none; }
  .cmp-label{ text-align: center; color: var(--text-dim); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .cmp-val{ font-family: var(--scoreboard); font-weight: 700; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
  .cmp-val.right{ text-align: right; }
  .cmp-val.win{ color: var(--gold); }
  .game{
    display: grid; grid-template-columns: 86px minmax(0,1fr) auto; gap: 12px; align-items: center;
    background: var(--surface-raised); border: 1px solid var(--line); padding: 9px 12px; margin-top: 6px;
  }
  .game-when{ font-family: var(--scoreboard); font-weight: 700; color: var(--text-dim); font-size: 0.95rem; }
  .game-when small{ display: block; font-family: var(--body); font-size: 0.68rem; font-weight: 400; }
  .game-line{ display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); gap: 10px; align-items: center; font-size: 0.92rem; }
  .game-line .sc{ font-family: var(--scoreboard); font-weight: 700; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
  .game-line .side.right{ text-align: right; }
  .game-line .won{ color: var(--gold); font-weight: 700; }
  .game-margin{ color: var(--text-dim); font-size: 0.78rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
  @media (max-width: 560px){
    .game{ grid-template-columns: 1fr; gap: 4px; }
    .game-margin{ display: none; }
    .cmp-row{ grid-template-columns: minmax(0,1fr) 92px minmax(0,1fr); }
  }
</style>
</head>
<body>
  <div id="site-nav"></div>
  <div class="wrap">
    <header>
      <div class="header-row">
        <div>
          <div class="eyebrow">Retirement League</div>
          <h1>Head to Head</h1>
        </div>
        <div class="updated-block">
          <div class="updated-label">Updated</div>
          <div class="updated-value" id="updated-at">—</div>
        </div>
      </div>
    </header>

    <section>
      <h2>Compare Two Teams</h2>
      <div class="selector-row">
        <select class="lg-select" id="p1" autocomplete="off" aria-label="Team 1"></select>
        <span class="selector-label">vs.</span>
        <select class="lg-select" id="p2" autocomplete="off" aria-label="Team 2"></select>
      </div>
      <div id="compare"><div class="loading-row">Loading…</div></div>
    </section>

    <section id="games-section" hidden>
      <h2 id="games-heading">Every Game</h2>
      <div id="games"></div>
    </section>

    <footer>Data from the league sheet</footer>
  </div>

<script src="nav.js"></script>
<script src="league-common.js?v=1"></script>
<script>
  let DATA;
  const $ = id => document.getElementById(id);

  // Games between the pair, oldest first. Byes have no opponent so never match.
  function pairGames(a, b) {
    return DATA.games
      .filter(g => g.p2 && g.winner !== 'In Progress' && ((g.p1 === a && g.p2 === b) || (g.p1 === b && g.p2 === a)))
      .sort((x, y) => x.year - y.year || x.week - y.week || x.gid - y.gid);
  }
  const scoreOf = (g, p) => (g.p1 === p ? g.s1 : g.s2);
  const oppScoreOf = (g, p) => (g.p1 === p ? g.s2 : g.s1);

  function summarize(games, p) {
    const wins = games.filter(g => g.winner === p);
    const pts = games.reduce((s, g) => s + scoreOf(g, p), 0);
    const oppPts = games.reduce((s, g) => s + oppScoreOf(g, p), 0);
    const scores = games.map(g => scoreOf(g, p));
    const margins = wins.map(g => scoreOf(g, p) - oppScoreOf(g, p));
    let best = 0, run = 0;
    games.forEach(g => { run = g.winner === p ? run + 1 : 0; best = Math.max(best, run); });
    let cur = 0;
    for (let i = games.length - 1; i >= 0 && games[i].winner === p; i--) cur++;
    return {
      games: games.length, wins: wins.length, pct: games.length ? wins.length / games.length : null,
      cur, best, pts, margin: pts - oppPts, avg: games.length ? pts / games.length : null,
      hi: scores.length ? Math.max(...scores) : null, lo: scores.length ? Math.min(...scores) : null,
      bigWin: margins.length ? Math.max(...margins) : null, smallWin: margins.length ? Math.min(...margins) : null,
    };
  }

  function cmpRow(label, l, r, fmt, higherWins = true) {
    let lw = false, rw = false;
    if (higherWins && l !== null && r !== null && l !== r) { lw = l > r; rw = r > l; }
    const s = v => (v === null ? '—' : fmt(v));
    return `<div class="cmp-row"><div class="cmp-val${lw ? ' win' : ''}">${s(l)}</div><div class="cmp-label">${label}</div>` +
      `<div class="cmp-val right${rw ? ' win' : ''}">${s(r)}</div></div>`;
  }

  function render() {
    const a = $('p1').value, b = $('p2').value;
    if (a === b) {
      $('compare').innerHTML = '<div class="loading-row">Pick two different teams.</div>';
      $('games-section').hidden = true;
      return;
    }
    const all = pairGames(a, b);
    if (!all.length) {
      $('compare').innerHTML = `<div class="loading-row">${LG.esc(a)} and ${LG.esc(b)} have never played each other.</div>`;
      $('games-section').hidden = true;
      return;
    }
    const post = all.filter(g => g.type !== 'Reg');
    const A = summarize(all, a), B = summarize(all, b);
    const PA = summarize(post, a), PB = summarize(post, b);
    const int = v => String(v), dec = v => LG.f1(v), pc = v => LG.pct(v), plus = v => (v > 0 ? '+' : '') + LG.f1(v);

    const lead = A.wins === B.wins ? '' : (A.wins > B.wins ? 'l' : 'r');
    const streakText = (A.cur || B.cur)
      ? `${A.cur ? a : b} has won the last ${(A.cur || B.cur) === 1 ? 'meeting' : (A.cur || B.cur) + ' meetings'}` : '';
    const head =
      `<div class="vs-head"><div class="vs-name${lead === 'l' ? ' lead' : ''}">${LG.esc(a)}</div><div class="vs-mid">VS</div>` +
      `<div class="vs-name right${lead === 'r' ? ' lead' : ''}">${LG.esc(b)}</div></div>` +
      `<div class="vs-summary">${A.wins}–${B.wins} all-time${streakText ? ' · ' + LG.esc(streakText) : ''}</div>`;

    const main = '<div class="cmp">' +
      cmpRow('Games Played', A.games, B.games, int, false) +
      cmpRow('Wins', A.wins, B.wins, int) +
      cmpRow('Win %', A.pct, B.pct, pc) +
      cmpRow('Current Streak', A.cur, B.cur, int) +
      cmpRow('Best Win Streak', A.best, B.best, int) +
      cmpRow('Total Points', A.pts, B.pts, dec) +
      cmpRow('Total Margin', A.margin, B.margin, plus) +
      cmpRow('Average Points', A.avg, B.avg, dec) +
      cmpRow('Highest Score', A.hi, B.hi, dec) +
      cmpRow('Lowest Score', A.lo, B.lo, dec) +
      cmpRow('Largest Win', A.bigWin, B.bigWin, dec) +
      cmpRow('Smallest Win', A.smallWin, B.smallWin, dec, false) + '</div>';

    let postCard = '';
    if (post.length) {
      postCard = '<div class="cmp">' +
        cmpRow('Games Played', PA.games, PB.games, int, false) +
        cmpRow('Wins', PA.wins, PB.wins, int) +
        cmpRow('Win %', PA.pct, PB.pct, pc) +
        cmpRow('Total Points', PA.pts, PB.pts, dec) +
        cmpRow('Total Margin', PA.margin, PB.margin, plus) + '</div>';
    }

    $('compare').innerHTML = `<div class="stat-card">${head}${main}</div>` +
      (post.length ? `<div style="height:14px"></div>` + LG.card('Postseason', postCard, 'Playoffs, finals, consolation and every other postseason game') : '');

    const TYPE = { Reg: 'Regular', Play: 'Playoff', Champ: 'Final', Cons: 'Consolation', Sacko: 'Sacko', '3rd': '3rd Place', '5th': '5th Place' };
    $('games-heading').textContent = `Every Game · ${a} vs ${b}`;
    $('games').innerHTML = `<div class="stat-card"><div class="stat-card-body">` + all.slice().reverse().map(g => {
      const s1 = scoreOf(g, a), s2 = scoreOf(g, b);
      return `<div class="game"><div class="game-when">${g.year}<small>Wk ${g.week} · ${TYPE[g.type] || g.type}</small></div>` +
        `<div class="game-line"><div class="side${g.winner === a ? ' won' : ''}">${LG.esc(a)}</div>` +
        `<div class="sc">${LG.f2(s1)} – ${LG.f2(s2)}</div>` +
        `<div class="side right${g.winner === b ? ' won' : ''}">${LG.esc(b)}</div></div>` +
        `<div class="game-margin">${LG.esc(g.winner)} by ${LG.f2(Math.abs(s1 - s2))}</div></div>`;
    }).join('') + `</div></div>`;
    $('games-section').hidden = false;
  }

  LG.load().then(data => {
    DATA = data;
    const names = [...new Set(data.games.flatMap(g => [g.p1, g.p2]).filter(Boolean))].sort();
    const active = names.filter(n => data.active.has(n));
    const former = names.filter(n => !data.active.has(n));
    const opts = `<optgroup label="Current teams">${active.map(n => `<option>${LG.esc(n)}</option>`).join('')}</optgroup>` +
      (former.length ? `<optgroup label="Former teams">${former.map(n => `<option>${LG.esc(n)}</option>`).join('')}</optgroup>` : '');
    $('p1').innerHTML = opts;
    $('p2').innerHTML = opts;
    // Default to the most-played matchup among current teams.
    let bestPair = [active[0], active[1]], bestN = -1;
    for (let i = 0; i < active.length; i++) for (let j = i + 1; j < active.length; j++) {
      const n = pairGames(active[i], active[j]).length;
      if (n > bestN) { bestN = n; bestPair = [active[i], active[j]]; }
    }
    $('p1').value = bestPair[0];
    $('p2').value = bestPair[1];
    $('p1').addEventListener('change', render);
    $('p2').addEventListener('change', render);
    render();
  }).catch(err => LG.showError('compare', err));
</script>
</body>
</html>
