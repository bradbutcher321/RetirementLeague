<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>html{background:#050505}</style>
<title>Retirement League — Head to Head</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The two font-family's woff2 files Google serves for the latin subset
     at the weights this site uses -- one variable-font file per family
     covers every weight declared, confirmed directly by fetching the
     stylesheet below and comparing each @font-face block's url(). Starts
     the actual font downloads immediately, in parallel with that
     stylesheet fetch, instead of waiting to discover these same URLs
     only after the stylesheet loads and is parsed -- avoids the
     fallback-to-webfont swap (FOUT) that otherwise shows on a slow or
     uncached load. If Google ever changes these hashed URLs, this just
     degrades to a wasted (unused) preload, not a correctness issue -- the
     stylesheet's own @font-face still fetches whatever the new URL is. -->
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/bigshouldersdisplay/v24/fC1_PZJEZG-e9gHhdI4-NBbfd2ys3SjJCx1czNDu.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=7">
<link rel="stylesheet" href="nav.css?v=4">
<link rel="stylesheet" href="league.css?v=6">
<style>
  .banner{ display:grid; grid-template-columns:1fr auto 1fr; gap:12px; align-items:center; padding:18px 16px 16px; border-bottom:1px solid var(--line); }
  .side .nm{ font-family:var(--scoreboard); font-weight:800; font-size:2.2rem; line-height:1; margin-bottom:10px; overflow:hidden; text-overflow:ellipsis; }
  .side.r{ text-align:right; }
  .pill{ display:inline-block; font-size:0.8rem; font-weight:700; padding:4px 12px; border-radius:999px; border:1px solid; font-variant-numeric:tabular-nums; }
  .pill.up{ color:var(--turf); border-color:var(--turf-dim); background:rgba(76,154,107,0.12); }
  .pill.down{ color:var(--loss); border-color:var(--loss); background:rgba(192,87,75,0.12); }
  .pill.flat{ color:var(--text-dim); border-color:var(--line); }
  .rec{ text-align:center; }
  .rec b{ font-family:var(--scoreboard); font-weight:800; font-size:3.4rem; line-height:1; display:block; }
  .rec span{ color:var(--text-dim); font-size:0.78rem; }

  .form-wrap{ padding:14px 16px 6px; }
  .form-title{ color:var(--text-dim); font-size:0.7rem; text-transform:uppercase; letter-spacing:0.05em; text-align:center; margin-bottom:10px; }
  .form-scroll{ overflow-x:auto; padding-bottom:2px; display:flex; justify-content:center; }
  .form{ display:flex; gap:6px; min-width:max-content; }
  .chip{ flex:0 0 auto; height:32px; padding:0 12px; display:flex; align-items:center; font-size:0.78rem; font-weight:700; border:1px solid; border-radius:999px; white-space:nowrap; }
  .chip.up{ color:var(--turf); border-color:var(--turf-dim); background:rgba(76,154,107,0.12); }
  .chip.down{ color:var(--loss); border-color:var(--loss); background:rgba(192,87,75,0.12); }

  .callouts{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; padding:14px 10px 12px; }
  .callouts.five{ grid-template-columns:repeat(5,1fr); }
  .co{ background:var(--item); border:1px solid var(--item-line); border-radius:10px; padding:12px 10px; text-align:center; min-width:0; }
  .co-t{ color:var(--text-dim); font-size:0.66rem; text-transform:uppercase; letter-spacing:0.04em; }
  .co-n{ font-family:var(--scoreboard); font-weight:800; font-size:1.5rem; margin:4px 0 2px; }
  .co-n.up{ color:var(--turf); } .co-n.down{ color:var(--loss); } .co-n.flat{ color:var(--text); }
  .co-s{ color:var(--text-dim); font-size:0.72rem; }

  .dom-bar{ display:flex; height:8px; border-radius:999px; overflow:hidden; background:var(--line); margin:0 16px 4px; }
  .dom-seg.up{ background:var(--turf); }
  .dom-seg.down{ background:var(--loss); }
  .dom-seg.tie{ background:var(--text-dim); opacity:0.4; }

  .momentum-wrap{ padding:16px 16px 18px; }
  .momentum{ width:100%; height:140px; display:block; }
  .mo-base{ stroke:var(--line); stroke-width:1; stroke-dasharray:5 4; }
  .mo-fill.up{ fill:var(--turf); opacity:0.32; }
  .mo-fill.down{ fill:var(--loss); opacity:0.32; }
  .mo-line{ fill:none; stroke:var(--text); stroke-width:2; vector-effect:non-scaling-stroke; }
  .momentum-caption{ text-align:center; color:var(--text-dim); font-size:0.82rem; margin-top:12px; line-height:1.4; }

  .arc-wrap{ padding:2px 16px 14px; }
  .arc-scroll{ overflow-x:auto; padding-bottom:4px; }
  .arc{ display:flex; gap:8px; min-width:max-content; }
  .arc-tile{ width:66px; flex-shrink:0; background:var(--item); border:1px solid var(--item-line); border-radius:8px; text-align:center; padding:10px 4px 8px; }
  .arc-tile.a{ border-color:var(--win-line); background:var(--win-tint); }
  .arc-tile.b{ border-color:var(--loss-line); background:var(--loss-tint); }
  :root[data-accent="outline"] .arc-tile.a,
  :root[data-accent="outline"] .arc-tile.b{ background:var(--item); }
  .arc-year{ color:var(--text-dim); font-size:0.62rem; letter-spacing:0.03em; }
  .arc-rec{ font-family:var(--scoreboard); font-weight:800; font-size:1.1rem; margin:3px 0 1px; }
  .arc-tile.a .arc-rec{ color:var(--turf); }
  .arc-tile.b .arc-rec{ color:var(--loss); }
  .arc-who{ color:var(--text-dim); font-size:0.6rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .cmp{ padding:2px 16px 12px; }
  .cmp-legend{ display:flex; justify-content:space-between; gap:8px; padding:0 4px 10px; color:var(--text-dim); font-size:0.78rem; font-weight:700; }
  .cmp-legend span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .cmp-legend span:last-child{ text-align:right; }
  .cmp-group{ color:var(--gold); font-size:0.68rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; padding:16px 4px 6px; }
  .cmp-group:first-child{ padding-top:6px; }
  .stat-pods{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .stat-pod{ background:var(--item); border:1px solid var(--item-line); border-radius:10px; padding:11px 8px; text-align:center; min-width:0; }
  .sp-t{ color:var(--text-dim); font-size:0.62rem; text-transform:uppercase; letter-spacing:0.03em; margin-bottom:7px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sp-row{ display:flex; align-items:center; justify-content:center; gap:8px; }
  .sp-v{ font-family:var(--scoreboard); font-weight:800; font-size:1.15rem; line-height:1; font-variant-numeric:tabular-nums; }
  .sp-v.win{ color:var(--turf); }
  .sp-v.lose{ color:var(--text-dim); }
  .sp-dot{ width:5px; height:5px; border-radius:50%; background:var(--text-dim); flex-shrink:0; }
  
  .game{ display:grid; grid-template-columns:86px minmax(0,1fr); gap:12px; align-items:center; background:var(--item); border:1px solid var(--item-line); border-radius:10px; padding:9px 12px; margin-top:6px; }
  .game.up{ border-color:var(--win-line); background:var(--win-tint); }
  .game.down{ border-color:var(--loss-line); background:var(--loss-tint); }
  :root[data-accent="outline"] .game.up,
  :root[data-accent="outline"] .game.down{ background:var(--item); }
  .game-when{ font-family:var(--scoreboard); font-weight:700; color:var(--text-dim); font-size:0.95rem; }
  .game-when small{ display:block; font-family:var(--body); font-size:0.68rem; font-weight:400; }
  .game-when small.champ{ color:var(--gold); font-weight:700; }
  .game-when small.sacko{ color:var(--loss); font-weight:700; }
  .game-line{ display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:10px; align-items:center; font-size:0.92rem; }
  .game-line .sc{ font-family:var(--scoreboard); font-weight:700; font-size:1.05rem; font-variant-numeric:tabular-nums; }
  .game-line .who.right{ text-align:right; }
  .game-line .won{ font-weight:700; } .game-line .lost{ color:var(--text-dim); }
  .game-bar-wrap{ margin-top:7px; height:4px; border-radius:999px; background:var(--line); overflow:hidden; }
  .game-bar{ height:100%; }
  .game.up .game-bar{ background:var(--turf); }
  .game.down .game-bar{ background:var(--loss); }
  @media (max-width:720px){
    .callouts, .callouts.five{ grid-template-columns:1fr 1fr; }
    .callouts.five .co:last-child{ grid-column:1 / -1; }
  }
  @media (max-width:560px){
    .game{ grid-template-columns:1fr; gap:4px; }
    .stat-pods{ grid-template-columns:1fr 1fr; }
    .side .nm{ font-size:1.6rem; } .rec b{ font-size:2.4rem; }
    .pill{ font-size:0.7rem; padding:3px 9px; }
  }
</style>
</head>
<body>
  <div id="site-nav"></div>
  <div class="wrap">
    <header>
      <div class="header-row">
        <div>
          <div class="eyebrow">Retirement League</div>
          <h1>Head to Head</h1>
        </div>
        <div class="updated-block">
          <div class="updated-label">Updated</div>
          <div class="updated-value" id="updated-at">—</div>
        </div>
      </div>
    </header>

    <section>
      <!-- No section heading: the page is titled Head to Head and the row
           below reads "<team> vs. <team>", which says the same thing while
           also being the control. -->
      <div class="selector-row">
        <select class="lg-select" id="p1" autocomplete="off" aria-label="Team 1"></select>
        <span class="selector-label">vs.</span>
        <select class="lg-select" id="p2" autocomplete="off" aria-label="Team 2"></select>
      </div>
      <div id="compare"><div class="loading-row">Loading…</div></div>
    </section>

    <section id="games-section" hidden>
      <h2 id="games-heading">Every Game</h2>
      <div id="games"></div>
    </section>

    <footer>Data via ESPN Fantasy</footer>
  </div>

<script src="nav.js?v=2"></script>
<script src="page-common.js?v=2"></script>
<script src="league-common.js?v=3"></script>
<script>
  let DATA;
  const $ = id => document.getElementById(id);
  const TYPE = { Reg: 'Regular', Play: 'Playoff', Champ: 'Final', Cons: 'Consolation', Sacko: 'Sacko', '3rd': '3rd Place', '5th': '5th Place' };

  // Games between the pair, oldest first. Byes have no opponent so never match.
  function pairGames(a, b) {
    return DATA.games
      .filter(g => g.p2 && ((g.p1 === a && g.p2 === b) || (g.p1 === b && g.p2 === a)))
      .sort((x, y) => x.year - y.year || x.week - y.week || x.gid - y.gid);
  }
  const scoreOf = (g, p) => (g.p1 === p ? g.s1 : g.s2);
  const oppScoreOf = (g, p) => (g.p1 === p ? g.s2 : g.s1);
  const margin = g => Math.abs(g.s1 - g.s2);

  function summarize(games, p) {
    const wins = games.filter(g => g.winner === p);
    const pts = games.reduce((t, g) => t + scoreOf(g, p), 0);
    const oppPts = games.reduce((t, g) => t + oppScoreOf(g, p), 0);
    const scores = games.map(g => scoreOf(g, p));
    const margins = wins.map(g => scoreOf(g, p) - oppScoreOf(g, p));
    let best = 0, run = 0;
    games.forEach(g => { run = g.winner === p ? run + 1 : 0; best = Math.max(best, run); });
    let cur = 0;
    for (let i = games.length - 1; i >= 0 && games[i].winner === p; i--) cur++;
    return {
      games: games.length, wins: wins.length, pct: games.length ? wins.length / games.length : null,
      cur, best, pts, margin: pts - oppPts, avg: games.length ? pts / games.length : null,
      hi: scores.length ? Math.max(...scores) : null, lo: scores.length ? Math.min(...scores) : null,
      bigWin: margins.length ? Math.max(...margins) : null, smallWin: margins.length ? Math.min(...margins) : null,
    };
  }

  function statPod(label, l, r, fmt, color = true) {
    const f = v => (v === null ? '—' : fmt(v));
    let lc = '', rc = '';
    if (color && l !== null && r !== null && l !== r) { lc = l > r ? ' win' : ' lose'; rc = r > l ? ' win' : ' lose'; }
    return `<div class="stat-pod"><div class="sp-t">${label}</div><div class="sp-row"><span class="sp-v${lc}">${f(l)}</span><span class="sp-dot"></span><span class="sp-v${rc}">${f(r)}</span></div></div>`;
  }
  // Games Played is always identical for both teams (they're each other's opponent), so it gets one
  // centered number instead of the usual "X • X" -- showing the same value twice read as a display bug.
  const statPodSingle = (label, v, fmt) => `<div class="stat-pod"><div class="sp-t">${label}</div><div class="sp-row"><span class="sp-v">${fmt(v)}</span></div></div>`;
  const statGroup = t => `<div class="cmp-group">${t}</div>`;
  const cmpLegend = (a, b) => `<div class="cmp-legend"><span>${esc(a)}</span><span>${esc(b)}</span></div>`;
  const ABBR = { Ben: 'Ben', Brad: 'Brd', Chad: 'Chd', Collin: 'Cln', Flanders: 'Fla', Jared: 'Jar', Jeff: 'Jef', 'Joe G': 'JoG', 'Joe K': 'JoK', Jon: 'Jon', Kris: 'Krs', TJ: 'TJ', Chappy: 'Chp', Corey: 'Cor' };
  const abbr = n => ABBR[n] || n.slice(0, 3);
  const tone = (x, y) => (x > y ? 'up' : x < y ? 'down' : 'flat');
  const callout = (t, n, cls, s) => `<div class="co"><div class="co-t">${t}</div><div class="co-n ${cls}">${n}</div><div class="co-s">${s}</div></div>`;
  const STAKES_CLS = { Champ: 'champ', Sacko: 'sacko' };

  // Win-share bar: how the head-to-head record splits between the two teams, ties (if any) shown as a neutral middle segment.
  function domBar(A, B, total) {
    const tie = total - A.wins - B.wins;
    const seg = (n, cls) => n ? `<div class="dom-seg ${cls}" style="width:${n / total * 100}%"></div>` : '';
    return `<div class="dom-bar">${seg(A.wins, tone(A.pct, B.pct))}${seg(tie, 'tie')}${seg(B.wins, tone(B.pct, A.pct))}</div>`;
  }

  // Running (cumulative wins A) - (cumulative wins B) after each meeting, as a two-tone area chart -- shows
  // who's been on top across the whole history of the pair, and how the lead has swung, rather than just the
  // final tally. Y is clamped to the positive/negative side per point to build the two fills without needing
  // an SVG clip-path; the one visible seam this creates at a sign change (a straight-line interpolation
  // artifact right where the fill briefly touches zero) is too small to read as wrong at this scale.
  function momentumChart(all, a, b) {
    const N = all.length, W = 600, H = 140, PAD = 14;
    let diff = 0;
    const diffs = [0];
    all.forEach(g => { diff += g.winner === a ? 1 : g.winner === b ? -1 : 0; diffs.push(diff); });
    const maxAbs = Math.max(1, ...diffs.map(Math.abs));
    const scale = (H / 2 - PAD) / maxAbs;
    const x = i => (i / N) * (W - 2 * PAD) + PAD;
    const y = v => H / 2 - v * scale;
    const pt = (i, v) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`;
    const posArea = `${x(0)},${H / 2} ` + diffs.map((d, i) => pt(i, Math.max(d, 0))).join(' ') + ` ${x(N)},${H / 2}`;
    const negArea = `${x(0)},${H / 2} ` + diffs.map((d, i) => pt(i, Math.min(d, 0))).join(' ') + ` ${x(N)},${H / 2}`;
    const line = diffs.map((d, i) => pt(i, d)).join(' ');
    const final = diffs[diffs.length - 1];
    const peak = diffs.reduce((m, d) => (Math.abs(d) > Math.abs(m) ? d : m), 0);
    const caption = final === 0
      ? 'Dead even across the all-time series'
      : `${esc(final > 0 ? a : b)} leads the all-time cumulative count by ${Math.abs(final)}` +
        (peak !== final ? ` · peaked at a ${Math.abs(peak)}-win lead for ${esc(peak > 0 ? a : b)}` : '');
    return `<div class="momentum-wrap"><svg class="momentum" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">` +
      `<line x1="${PAD}" y1="${H / 2}" x2="${W - PAD}" y2="${H / 2}" class="mo-base" />` +
      `<polygon points="${posArea}" class="mo-fill up" /><polygon points="${negArea}" class="mo-fill down" />` +
      `<polyline points="${line}" class="mo-line" /></svg><div class="momentum-caption">${caption}</div></div>`;
  }

  // One tile per year the pair has met, so a long rivalry's trend is visible at a glance rather than buried in the full game log.
  function seasonArc(all, a, b) {
    const byYear = {};
    all.forEach(g => (byYear[g.year] || (byYear[g.year] = [])).push(g));
    const years = Object.keys(byYear).map(Number).sort((x, y) => x - y);
    const tiles = years.map(y => {
      const gs = byYear[y], aw = gs.filter(g => g.winner === a).length, bw = gs.filter(g => g.winner === b).length;
      const cls = aw > bw ? 'a' : bw > aw ? 'b' : '';
      const who = aw === bw ? 'Split' : esc(abbr(aw > bw ? a : b));
      return `<div class="arc-tile ${cls}"><div class="arc-year">${y}</div><div class="arc-rec">${aw}-${bw}</div><div class="arc-who">${who}</div></div>`;
    }).join('');
    return `<div class="arc-wrap"><div class="arc-scroll"><div class="arc">${tiles}</div></div></div>`;
  }

  function render() {
    const a = $('p1').value, b = $('p2').value;
    try { localStorage.setItem('h2h-pair', JSON.stringify([a, b])); } catch (e) {}
    if (a === b) {
      $('compare').innerHTML = '<div class="loading-row">Pick two different teams.</div>';
      $('games-section').hidden = true;
      return;
    }
    const all = pairGames(a, b);
    if (!all.length) {
      $('compare').innerHTML = `<div class="loading-row">${esc(a)} and ${esc(b)} have never played each other.</div>`;
      $('games-section').hidden = true;
      return;
    }
    const post = all.filter(g => g.type !== 'Reg');
    const A = summarize(all, a), B = summarize(all, b);
    const PA = summarize(post, a), PB = summarize(post, b);
    const int = v => String(v), dec = v => LG.f1(v), pc = v => LG.pct(v), plus = v => (v > 0 ? '+' : '') + LG.f1(v);
    const ea = esc(a), eb = esc(b);

    const banner = `<div class="banner"><div class="side"><div class="nm">${ea}</div><span class="pill ${tone(A.pct, B.pct)}">${LG.pct(A.pct)}</span></div>` +
      `<div class="rec"><b>${A.wins}–${B.wins}</b><span>${all.length} meetings</span></div>` +
      `<div class="side r"><div class="nm">${eb}</div><span class="pill ${tone(B.pct, A.pct)}">${LG.pct(B.pct)}</span></div></div>`;

    const last = all.slice(-10);
    const form = `<div class="form-wrap"><div class="form-title">Last ${last.length} meetings</div><div class="form-scroll"><div class="form">` +
      last.map(g => `<div class="chip ${g.winner === a ? 'up' : 'down'}" title="${g.year} week ${g.week}">${esc(g.winner)}</div>`).join('') + '</div></div></div>';

    const closest = all.reduce((m, g) => (margin(g) < margin(m) ? g : m));
    const blowout = all.reduce((m, g) => (margin(g) > margin(m) ? g : m));
    const maxMargin = margin(blowout);
    const curTeam = A.cur ? a : b, curN = A.cur || B.cur;
    const bestTeam = A.best >= B.best ? a : b;
    const stakes = all.filter(g => g.type === 'Champ' || g.type === 'Sacko');
    const stakesA = stakes.filter(g => g.winner === a).length, stakesB = stakes.length - stakesA;
    const callouts = `<div class="callouts${stakes.length ? ' five' : ''}">` +
      callout('Current streak', curN + (curN === 1 ? ' win' : ' in a row'), curTeam === a ? 'up' : 'down', `${esc(curTeam)} won the last ${curN === 1 ? 'meeting' : curN}`) +
      callout('Best streak', Math.max(A.best, B.best), bestTeam === a ? 'up' : 'down', `${esc(bestTeam)} · longest run`) +
      callout('Biggest blowout', LG.f1(margin(blowout)), blowout.winner === a ? 'up' : 'down', `${esc(blowout.winner)} · ${blowout.year}`) +
      callout('Closest game', LG.f2(margin(closest)), closest.winner === a ? 'up' : 'down', `${esc(closest.winner)} · ${closest.year}`) +
      (stakes.length ? callout('Title/Sacko clashes', stakes.length, tone(stakesA, stakesB), `${esc(a)} ${stakesA}-${stakesB} ${esc(b)}`) : '') + '</div>';

    const allStats = '<div class="cmp">' + cmpLegend(a, b) +
      statGroup('Series Record') + '<div class="stat-pods">' +
      statPodSingle('Games Played', A.games, int) + statPod('Wins', A.wins, B.wins, int) + statPod('Win %', A.pct, B.pct, pc) +
      statPod('Current Streak', A.cur, B.cur, int) + statPod('Best Win Streak', A.best, B.best, int) + '</div>' +
      statGroup('Scoring') + '<div class="stat-pods">' +
      statPod('Total Points', A.pts, B.pts, dec) + statPod('Total Margin', A.margin, B.margin, plus) + statPod('Average Points', A.avg, B.avg, dec) +
      statPod('Highest Score', A.hi, B.hi, dec) + statPod('Lowest Score', A.lo, B.lo, dec) + '</div>' +
      statGroup('Margins') + '<div class="stat-pods">' +
      statPod('Largest Win', A.bigWin, B.bigWin, dec) + statPod('Smallest Win', A.smallWin, B.smallWin, dec) + '</div></div>';
    const postStats = '<div class="cmp">' + cmpLegend(a, b) +
      statGroup('Series Record') + '<div class="stat-pods">' +
      statPodSingle('Games Played', PA.games, int) + statPod('Wins', PA.wins, PB.wins, int) + statPod('Win %', PA.pct, PB.pct, pc) + '</div>' +
      statGroup('Scoring') + '<div class="stat-pods">' +
      statPod('Total Points', PA.pts, PB.pts, dec) + statPod('Total Margin', PA.margin, PB.margin, plus) + '</div></div>';

    $('compare').innerHTML = `<div class="stat-card">${banner}${domBar(A, B, all.length)}${form}${callouts}</div><div class="gap"></div>` +
      `<div class="stat-card"><div class="stat-card-title">Rivalry Momentum</div>${momentumChart(all, a, b)}</div><div class="gap"></div>` +
      `<div class="stat-card"><div class="stat-card-title">Season by Season</div>${seasonArc(all, a, b)}</div><div class="gap"></div>` +
      `<div class="stat-card"><div class="stat-card-title">All Games</div>${allStats}</div>` +
      (post.length ? `<div class="gap"></div><div class="stat-card"><div class="stat-card-title">Postseason</div><div class="stat-card-note">Playoffs, finals, consolation and every other postseason game</div>${postStats}</div>` : '');

    $('games-heading').textContent = `Every Game · ${a} vs ${b}`;
    $('games').innerHTML = '<div class="stat-card"><div class="stat-card-body">' + all.slice().reverse().map(g => {
      const s1 = scoreOf(g, a), s2 = scoreOf(g, b), aw = g.winner === a;
      const stakesCls = STAKES_CLS[g.type] || '';
      const barPct = maxMargin ? margin(g) / maxMargin * 100 : 0;
      return `<div class="game ${aw ? 'up' : 'down'}"><div class="game-when">${g.year}<small class="${stakesCls}">Wk ${g.week} · ${TYPE[g.type] || g.type}</small></div>` +
        `<div><div class="game-line"><div class="who ${aw ? 'won' : 'lost'}">${ea}</div><div class="sc">${LG.f2(s1)} – ${LG.f2(s2)}</div>` +
        `<div class="who right ${aw ? 'lost' : 'won'}">${eb}</div></div>` +
        `<div class="game-bar-wrap"><div class="game-bar" style="width:${barPct}%"></div></div></div></div>`;
    }).join('') + '</div></div>';
    $('games-section').hidden = false;
  }

  LG.load().then(data => {
    DATA = data;
    const names = [...new Set(data.games.flatMap(g => [g.p1, g.p2]).filter(Boolean))].sort();
    const active = names.filter(n => data.active.has(n));
    const former = names.filter(n => !data.active.has(n));
    const opts = `<optgroup label="Current teams">${active.map(n => `<option>${esc(n)}</option>`).join('')}</optgroup>` +
      (former.length ? `<optgroup label="Former teams">${former.map(n => `<option>${esc(n)}</option>`).join('')}</optgroup>` : '');
    $('p1').innerHTML = opts;
    $('p2').innerHTML = opts;
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem('h2h-pair')); } catch (e) {}
    const ok = n => names.includes(n);
    const pair = saved && ok(saved[0]) && ok(saved[1]) ? saved : ['Joe G', 'Joe K'];
    $('p1').value = ok(pair[0]) ? pair[0] : active[0];
    $('p2').value = ok(pair[1]) ? pair[1] : active[1];
    $('p1').addEventListener('change', render);
    $('p2').addEventListener('change', render);
    render();
  }).catch(err => LG.showError('compare', err));
</script>
<script src="track.js?v=1" defer></script>
</body>
</html>
