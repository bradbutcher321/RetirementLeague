<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>html{background:#050505}</style>
<title>Retirement League — Head to Head</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The two font-family's woff2 files Google serves for the latin subset
     at the weights this site uses -- one variable-font file per family
     covers every weight declared, confirmed directly by fetching the
     stylesheet below and comparing each @font-face block's url(). Starts
     the actual font downloads immediately, in parallel with that
     stylesheet fetch, instead of waiting to discover these same URLs
     only after the stylesheet loads and is parsed -- avoids the
     fallback-to-webfont swap (FOUT) that otherwise shows on a slow or
     uncached load. If Google ever changes these hashed URLs, this just
     degrades to a wasted (unused) preload, not a correctness issue -- the
     stylesheet's own @font-face still fetches whatever the new URL is. -->
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/bigshouldersdisplay/v24/fC1_PZJEZG-e9gHhdI4-NBbfd2ys3SjJCx1czNDu.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=9">
<link rel="stylesheet" href="nav.css?v=4">
<style>
  /* ---------- Head to Head ----------
     Built phone-first around one idea: two sides, each with its own colour
     for the whole page -- gold for the left manager, silver for the right.
     Whoever won a game, a season or a stat is shown in their colour (and
     their monogram), never by spelling out a shortened name, and a stat that
     is just the mirror image of the other side (+158 / -158) is stated once,
     for whoever holds it. Green and red are not used here: in a two-sided
     comparison one side's good is the other's bad, so they'd say nothing. */
  :root{
    --a: var(--gold); --a-line: rgba(212,180,106,0.45); --a-tint: rgba(212,180,106,0.08);
    --b: #BCC0C6;     --b-line: rgba(188,192,198,0.45); --b-tint: rgba(188,192,198,0.08);
  }
  .chip{ font-size:0.68rem; font-weight:700; padding:3px 9px; border-radius:999px; border:1px solid var(--line); color:var(--text-dim); white-space:nowrap; }
  /* Losing figures sit well below silver so the two never blur together. */
  :root{ --lose: #626262; }
  .ca{ color:var(--a); } .cb{ color:var(--b); } .cd{ color:var(--text-dim); }

  /* ---------- Picker: two dropdowns and a swap button ---------- */
  .picker{ display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:8px; align-items:center; margin-bottom:14px; }
  .picker .lg-select{ width:100%; min-width:0; }
  #p1{ border-color:var(--a-line); }
  #p2{ border-color:var(--b-line); }
  .swap{ width:var(--track-h); height:var(--track-h); border-radius:50%; border:1px solid var(--ctl-line); background:var(--ctl-bg-solid); color:var(--text-dim); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .swap:hover{ color:var(--text); }
  .swap:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .swap svg{ width:16px; height:16px; }
  @media (min-width:721px){ .picker{ grid-template-columns:240px auto 240px; justify-content:start; } }

  /* minmax(0,1fr): without it the season strip's full scroll width
     becomes the column's minimum and pushes the page sideways. */
  #compare{ display:grid; grid-template-columns:minmax(0,1fr); gap:12px; }
  .panel{ min-width:0; }

  /* ---------- Panels ---------- */
  .panel{ background:linear-gradient(165deg, var(--surface-2), var(--surface)); border:1px solid var(--line); border-radius:14px; }
  .p-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:14px 16px 0; }
  .p-title{ font-weight:700; font-size:0.95rem; }
  .p-body{ padding:12px; }
  .key{ display:flex; gap:12px; font-size:0.72rem; font-weight:600; color:var(--text-dim); white-space:nowrap; }
  .key i{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:0; }
  .key .ka i{ background:var(--a); } .key .kb i{ background:var(--b); }

  /* ---------- Monogram ---------- */
  .mono{ display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:50%; border:1px solid; font-family:var(--scoreboard); font-weight:800; font-size:0.74rem; letter-spacing:0.02em; flex:none; }
  .mono.a{ color:var(--a); border-color:var(--a-line); background:var(--a-tint); }
  .mono.b{ color:var(--b); border-color:var(--b-line); background:var(--b-tint); }
  .mono.n{ color:var(--text-dim); border-color:var(--line); background:var(--item); }

  /* ---------- Matchup card ---------- */
  .vs-top{ display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:8px; padding:20px 14px 6px; }
  .vs-side{ text-align:center; min-width:0; }
  .vs-logo{ position:relative; width:58px; height:58px; margin:0 auto 8px; border-radius:50%; overflow:hidden; border:2px solid; }
  .vs-side.a .vs-logo{ border-color:var(--a); } .vs-side.b .vs-logo{ border-color:var(--b); }
  .vs-logo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .vs-logo .ph{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; font-family:var(--scoreboard); font-weight:800; font-size:1.2rem; background:var(--item); }
  .vs-side.a .ph{ color:var(--a); } .vs-side.b .ph{ color:var(--b); }
  .vs-name{ font-family:var(--scoreboard); font-weight:800; font-size:clamp(1.5rem, 7vw, 2.2rem); line-height:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .vs-team{ color:var(--text-dim); font-size:0.72rem; margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .vs-score{ display:flex; align-items:baseline; gap:6px; font-family:var(--scoreboard); font-weight:800; font-size:clamp(2.4rem, 11vw, 3.4rem); line-height:1; font-variant-numeric:tabular-nums; }
  .vs-score i{ font-style:normal; color:var(--text-dim); font-size:0.6em; }
  .vs-verdict{ text-align:center; font-size:0.86rem; font-weight:600; padding:6px 14px 0; }
  .vs-verdict span{ color:var(--text-dim); font-weight:500; }
  .vs-verdict span.ca{ color:var(--a); font-weight:700; } .vs-verdict span.cb{ color:var(--b); font-weight:700; }
  .facts{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; padding:14px 12px 4px; }
  @media (min-width:721px){ .facts{ grid-template-columns:repeat(4, minmax(0,1fr)); } }
  .fact{ background:var(--item); border:1px solid var(--item-line); border-radius:10px; padding:10px 6px 9px; text-align:center; min-width:0; }
  .fact.a{ border-color:var(--a-line); background:var(--a-tint); } .fact.b{ border-color:var(--b-line); background:var(--b-tint); }
  .fact-l{ color:var(--text-dim); font-size:0.6rem; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; white-space:nowrap; }
  .fact-v{ font-family:var(--scoreboard); font-weight:800; font-size:1.4rem; line-height:1.15; margin-top:3px; white-space:nowrap; }
  .fact.a .fact-v{ color:var(--a); } .fact.b .fact-v{ color:var(--b); }
  .fact-s{ color:var(--text-dim); font-size:0.68rem; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .form{ padding:10px 12px 16px; }
  .form-l{ color:var(--text-dim); font-size:0.6rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; text-align:center; margin-bottom:8px; }
  .form-row{ display:flex; justify-content:center; gap:5px; flex-wrap:wrap; }
  .form-row .mono.po{ box-shadow:0 0 0 2px var(--surface), 0 0 0 3px var(--gold); }

  /* ---------- Who's been on top ---------- */
  .mo{ position:relative; padding:4px 4px 0; }
  .mo svg{ display:block; width:100%; height:150px; }
  .mo-base{ stroke:rgba(255,255,255,0.18); stroke-width:1; stroke-dasharray:4 4; vector-effect:non-scaling-stroke; }
  .mo-a{ fill:var(--a); opacity:0.28; } .mo-b{ fill:var(--b); opacity:0.28; }
  .mo-line{ fill:none; stroke:var(--text); stroke-width:1.6; vector-effect:non-scaling-stroke; }
  .mo-tag{ position:absolute; left:10px; font-size:0.62rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; }
  .mo-tag.a{ top:8px; color:var(--a); } .mo-tag.b{ bottom:24px; color:var(--b); }
  .mo-x{ position:relative; height:16px; margin:2px 4px 0; }
  .mo-x span{ position:absolute; transform:translateX(-50%); color:var(--text-dim); font-size:0.6rem; }
  .leads{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }

  /* ---------- Season by season ---------- */
  .yrs{ display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding:2px 0; }
  .yrs::-webkit-scrollbar{ display:none; }
  .yr{ flex:none; width:60px; text-align:center; background:var(--item); border:1px solid var(--item-line); border-radius:8px; padding:8px 2px 7px; }
  .yr.a{ border-color:var(--a-line); background:var(--a-tint); } .yr.b{ border-color:var(--b-line); background:var(--b-tint); }
  .yr-y{ color:var(--text-dim); font-size:0.62rem; font-weight:600; }
  .yr-r{ font-family:var(--scoreboard); font-weight:800; font-size:1.2rem; line-height:1.15; margin-top:2px; font-variant-numeric:tabular-nums; }
  .yr-r .lose{ opacity:0.4; }

  /* ---------- The Edge: one holder per stat ---------- */
  .edges{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; }
  @media (min-width:721px){ .edges{ grid-template-columns:repeat(4, minmax(0,1fr)); } }
  .edge{ background:var(--item); border:1px solid var(--item-line); border-radius:10px; padding:10px 10px 9px; min-width:0; }
  .edge.a{ border-color:var(--a-line); background:var(--a-tint); } .edge.b{ border-color:var(--b-line); background:var(--b-tint); }
  .edge-l{ color:var(--text-dim); font-size:0.6rem; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .edge-m{ display:flex; align-items:center; gap:8px; margin-top:6px; }
  .edge-v{ font-family:var(--scoreboard); font-weight:800; font-size:1.4rem; line-height:1; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .edge.a .edge-v{ color:var(--a); } .edge.b .edge-v{ color:var(--b); }
  .edge-s{ color:var(--text-dim); font-size:0.68rem; margin-top:5px; line-height:1.3; }

  /* ---------- Career tale of the tape ----------
     Both careers side by side. The better figure takes its side's colour;
     the other one dims. Nothing mirrored here -- these are two different
     careers, so both numbers carry information. */
  /* One column at every width: split in two, the second column's left
     values sat right next to the first column's right ones and the
     left = gold / right = silver reading fell apart. On desktop it's held to
     a readable width instead. */
  .tape, .tape-head{ max-width:600px; margin-left:auto; margin-right:auto; }
  .tr{ display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:10px; padding:8px 4px; border-top:1px solid var(--line); }
  .tr:first-child{ border-top:none; }
  .tr-l{ color:var(--text-dim); font-size:0.66rem; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; text-align:center; white-space:nowrap; min-width:104px; }
  .tr-v{ font-family:var(--scoreboard); font-weight:800; font-size:1.2rem; font-variant-numeric:tabular-nums; white-space:nowrap; color:var(--lose); }
  .tr-v.l{ text-align:left; } .tr-v.r{ text-align:right; }
  .tr-v.win.l{ color:var(--a); } .tr-v.win.r{ color:var(--b); }
  .tr-v.even{ color:var(--text); }
  .tape-head{ display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:10px; padding:0 4px 6px; font-weight:700; font-size:0.8rem; }
  .tape-head span:first-child{ color:var(--a); } .tape-head span:last-child{ color:var(--b); text-align:right; }
  .tape-head span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ---------- Every game ---------- */
  .glist-head{ display:grid; grid-template-columns:54px minmax(0,1fr) 74px; gap:8px; padding:0 8px 6px; font-size:0.72rem; font-weight:700; }
  /* Left score right-aligned and right score left-aligned around a fixed
     dash column, so the dashes line up down the list and each name sits
     directly over its own scores. */
  .pair2{ display:grid; grid-template-columns:minmax(0,1fr) 16px minmax(0,1fr); align-items:baseline; }
  .pair2 > :first-child{ text-align:right; } .pair2 > :last-child{ text-align:left; } .pair2 > :nth-child(2){ text-align:center; }
  .glist-head .pair2 span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* Held to a readable width on desktop so a score isn't a screen away
     from its year and winner. */
  .glist-head, .g{ max-width:640px; margin-left:auto; margin-right:auto; }
  .g{ display:grid; grid-template-columns:54px minmax(0,1fr) 74px; gap:8px; align-items:center; padding:9px 8px; border-top:1px solid var(--line); }
  .g:first-of-type{ border-top:none; }
  .g.final{ background:var(--lead-tint); border-radius:8px; }
  .g-when b{ display:block; font-family:var(--scoreboard); font-weight:700; font-size:1rem; color:var(--text-dim); line-height:1.1; }
  .g-when span{ display:block; color:var(--text-dim); font-size:0.64rem; white-space:nowrap; }
  .g-when span.tag{ color:var(--gold); font-weight:700; }
  .g-when span.tag.sacko{ color:var(--loss); }
  .g-sc{ font-family:var(--scoreboard); font-weight:700; font-size:1.15rem; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .g-sc i{ font-style:normal; color:var(--text-dim); font-size:0.8em; }
  .g-sc .lose{ color:var(--lose); }
  .g-win{ display:flex; align-items:center; justify-content:flex-end; gap:6px; }
  .g-m{ font-family:var(--scoreboard); font-weight:700; font-size:0.95rem; font-variant-numeric:tabular-nums; min-width:34px; text-align:right; }
</style>
</head>
<body>
  <div id="site-nav"></div>
  <div class="wrap">
    <header>
      <div class="header-row">
        <div>
          <div class="eyebrow">Retirement League</div>
          <h1>Head to Head</h1>
        </div>
        <div class="updated-block">
          <div class="updated-label">Updated</div>
          <div class="updated-value" id="updated-at">—</div>
        </div>
      </div>
    </header>

    <section>
      <!-- No section heading: the page is titled Head to Head and the two
           pickers below say which two. -->
      <div class="picker">
        <select class="lg-select" id="p1" autocomplete="off" aria-label="Left manager"></select>
        <button class="swap" id="swap" type="button" aria-label="Swap sides" title="Swap sides">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4 3 8l4 4"/><path d="M3 8h14"/><path d="m17 20 4-4-4-4"/><path d="M21 16H7"/></svg>
        </button>
        <select class="lg-select" id="p2" autocomplete="off" aria-label="Right manager"></select>
      </div>
      <div id="compare"><div class="loading-row">Loading…</div></div>
    </section>

    <footer>Data via ESPN Fantasy</footer>
  </div>

<script src="nav.js?v=2"></script>
<script src="page-common.js?v=4"></script>
<script src="league-common.js?v=3"></script>
<script>
  let DATA, FR = null;
  const $ = id => document.getElementById(id);
  const TAGS = { Play: 'Playoffs', Champ: 'Final', Sacko: 'Sacko', Cons: 'Consolation', '3rd': '3rd place', '5th': '5th place' };
  const f1 = LG.f1, f2 = LG.f2;
  const CLOSE = 5, BLOWOUT = 30;

  // ---------- Data ----------
  // Decided games between the pair, oldest first. Byes have no opponent.
  function pairGames(a, b) {
    return DATA.games
      .filter(g => g.p2 && ((g.p1 === a && g.p2 === b) || (g.p1 === b && g.p2 === a)) && (g.winner === a || g.winner === b))
      .sort((x, y) => x.year - y.year || x.week - y.week || x.gid - y.gid);
  }
  const sc = (g, p) => (g.p1 === p ? g.s1 : g.s2);
  const mg = g => Math.abs(g.s1 - g.s2);
  const when = g => `${g.year} · Wk ${g.week}`;
  const fr = name => (FR && FR.players.find(x => x.name === name)) || null;

  function side(games, p, o) {
    const wins = games.filter(g => g.winner === p);
    const scores = games.map(g => sc(g, p));
    let best = 0, run = 0;
    games.forEach(g => { run = g.winner === p ? run + 1 : 0; best = Math.max(best, run); });
    const hiG = games.reduce((m, g) => (!m || sc(g, p) > sc(m, p) ? g : m), null);
    const bigW = wins.reduce((m, g) => (!m || mg(g) > mg(m) ? g : m), null);
    return {
      wins: wins.length,
      pts: scores.reduce((t, v) => t + v, 0),
      avg: games.length ? scores.reduce((t, v) => t + v, 0) / games.length : null,
      hiG, bigW, best,
      close: wins.filter(g => mg(g) < CLOSE).length,
      blow: wins.filter(g => mg(g) >= BLOWOUT).length,
      // Beat the league median that same week -- a read on whether the
      // games were good or just good enough.
      aboveMed: games.filter(g => typeof g.median === 'number' && sc(g, p) > g.median).length,
      // Won while scoring under the weekly median: a win the opponent handed over.
      lucky: wins.filter(g => typeof g.median === 'number' && sc(g, p) < g.median).length,
    };
  }

  // ---------- Pieces ----------
  const mono = (name, s) => `<span class="mono ${s || 'n'}">${esc(monogram(name))}</span>`;
  const panel = (title, body, right) => `<div class="panel"><div class="p-head"><div class="p-title">${title}</div>${right || ''}</div><div class="p-body">${body}</div></div>`;
  const key = (a, b) => `<div class="key"><span class="ka"><i></i>${esc(a)}</span><span class="kb"><i></i>${esc(b)}</span></div>`;
  const fact = (label, value, sub, s) => `<div class="fact ${s || ''}"><div class="fact-l">${label}</div><div class="fact-v">${value}</div><div class="fact-s">${sub}</div></div>`;

  function logo(name, s) {
    const p = fr(name);
    const url = esc((p && p.current_team_logo) || '');
    return `<div class="vs-logo">${url ? `<img src="${url}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : ''}<span class="ph" style="${url ? '' : 'display:flex'}">${esc(monogram(name))}</span></div>`;
  }

  // ---------- Matchup card ----------
  function matchup(all, a, b, A, B) {
    const lead = A.wins > B.wins ? 'a' : B.wins > A.wins ? 'b' : '';
    const verdict = lead ? `<span class="c${lead}">${esc(lead === 'a' ? a : b)}</span> <span>leads the series</span>` : '<span>Series dead even</span>';
    const team = name => { const p = fr(name); const t = p ? (p.current_team_name || '') : ''; return `${esc(t)}${DATA.active.has(name) ? '' : `${t ? ' · ' : ''}Former`}`; };

    // Current streak: whoever won the last meeting, and how many in a row.
    const last = all[all.length - 1].winner;
    let n = 0; for (let i = all.length - 1; i >= 0 && all[i].winner === last; i--) n++;
    const ls = last === a ? 'a' : 'b';

    const post = all.filter(g => g.type !== 'Reg');
    const pa = post.filter(g => g.winner === a).length, pb = post.length - pa;
    const postFact = !post.length ? fact('Postseason', '—', 'Never met', '')
      : pa === pb ? fact('Postseason', `${pa}-${pb}`, 'Even', '')
      : fact('Postseason', `${Math.max(pa, pb)}-${Math.min(pa, pb)}`, esc(pa > pb ? a : b), pa > pb ? 'a' : 'b');

    // Finished ahead: completed seasons both played, compared on final rank.
    const done = new Set(DATA.completeYears);
    const rank = (p, y) => { const s = DATA.seasons.find(x => x.player === p && x.year === y); return s && s.final_rank ? s.final_rank : null; };
    let ahA = 0, ahB = 0;
    DATA.completeYears.forEach(y => { const ra = rank(a, y), rb = rank(b, y); if (ra && rb && done.has(y)) { if (ra < rb) ahA++; else if (rb < ra) ahB++; } });
    const shared = ahA + ahB;
    const aheadFact = !shared ? fact('Finished higher', '—', 'No shared seasons', '')
      : ahA === ahB ? fact('Finished higher', `${ahA} of ${shared}`, 'Even', '')
      : fact('Finished higher', `${Math.max(ahA, ahB)} of ${shared}`, esc(ahA > ahB ? a : b), ahA > ahB ? 'a' : 'b');

    const form = all.slice(-10).map(g => {
      const s = g.winner === a ? 'a' : 'b';
      return `<span class="mono ${s}${g.type !== 'Reg' ? ' po' : ''}" title="${when(g)}: ${esc(g.winner)} ${f2(sc(g, g.winner))}-${f2(sc(g, g.winner === a ? b : a))}">${esc(monogram(g.winner))}</span>`;
    }).join('');

    return `<div class="panel">
      <div class="vs-top">
        <div class="vs-side a">${logo(a, 'a')}<div class="vs-name">${esc(a)}</div><div class="vs-team">${team(a)}</div></div>
        <div class="vs-score"><b class="ca">${A.wins}</b><i>–</i><b class="cb">${B.wins}</b></div>
        <div class="vs-side b">${logo(b, 'b')}<div class="vs-name">${esc(b)}</div><div class="vs-team">${team(b)}</div></div>
      </div>
      <div class="vs-verdict">${verdict}</div>
      <div class="facts">
        ${fact('Meetings', all.length, `Since ${all[0].year}`, '')}
        ${fact('Streak', `${n} straight`, esc(last), ls)}
        ${postFact}
        ${aheadFact}
      </div>
      <div class="form"><div class="form-l">Last ${Math.min(10, all.length)} meetings · oldest to newest</div><div class="form-row">${form}</div></div>
    </div>`;
  }

  // ---------- Who's been on top ----------
  // Running (wins A - wins B) after each meeting. A's lead fills up in A's
  // colour, B's down in B's. Year labels sit in HTML under the chart so
  // they don't stretch with the SVG.
  function momentum(all, a, b) {
    const N = all.length, W = 600, H = 150, P = 10;
    let d = 0; const ds = [0];
    all.forEach(g => { d += g.winner === a ? 1 : -1; ds.push(d); });
    // The baseline sits where the data puts it: a series one side has always
    // led spends most of the height on that side, with a sliver left for
    // the other, rather than half the chart sitting empty.
    const hi = Math.max(1, ...ds), lo = Math.min(-1, ...ds);
    const x = i => P + (i / N) * (W - 2 * P), y = v => P + (hi - v) / (hi - lo) * (H - 2 * P);
    const base = y(0);
    const pts = (f) => ds.map((v, i) => `${x(i).toFixed(1)},${y(f(v)).toFixed(1)}`).join(' ');
    const area = f => `${x(0)},${base} ${pts(f)} ${x(N)},${base}`;
    const svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <polygon class="mo-a" points="${area(v => Math.max(v, 0))}"/><polygon class="mo-b" points="${area(v => Math.min(v, 0))}"/>
      <line class="mo-base" x1="${P}" x2="${W - P}" y1="${base}" y2="${base}"/>
      <polyline class="mo-line" points="${pts(v => v)}"/></svg>`;
    // One label per year, at that year's first meeting.
    const seen = new Set(), ticks = [];
    all.forEach((g, i) => { if (!seen.has(g.year)) { seen.add(g.year); ticks.push([g.year, i]); } });
    const step = Math.ceil(ticks.length / 7);
    const xl = ticks.filter((t, i) => i % step === 0).map(([yr, i]) => `<span style="left:${(x(i + 0.5) / W * 100).toFixed(2)}%">'${String(yr).slice(2)}</span>`).join('');

    const peak = sign => {
      let best = 0, at = null;
      ds.forEach((v, i) => { if (sign * v > best) { best = sign * v; at = all[i - 1]; } });
      return best ? { n: best, g: at } : null;
    };
    const pa = peak(1), pb = peak(-1);
    const leadFact = (p, name, s) => p ? fact('Biggest lead', `+${p.n}`, `${esc(name)} · ${p.g.year}`, s) : fact('Biggest lead', '—', `${esc(name)} never led`, '');
    return panel("Who's Been on Top", `<div class="mo"><span class="mo-tag a">${esc(a)} ahead</span><span class="mo-tag b">${esc(b)} ahead</span>${svg}<div class="mo-x">${xl}</div></div>
      <div class="leads">${leadFact(pa, a, 'a')}${leadFact(pb, b, 'b')}</div>`);
  }

  // ---------- Season by season ----------
  function seasons(all, a, b) {
    const by = {};
    all.forEach(g => (by[g.year] = by[g.year] || []).push(g));
    const tiles = Object.keys(by).sort().map(y => {
      const gs = by[y], aw = gs.filter(g => g.winner === a).length, bw = gs.length - aw;
      const s = aw > bw ? 'a' : bw > aw ? 'b' : '';
      return `<div class="yr ${s}"><div class="yr-y">${y}</div><div class="yr-r"><span class="ca${aw < bw ? ' lose' : ''}">${aw}</span><span class="cd">-</span><span class="cb${bw < aw ? ' lose' : ''}">${bw}</span></div></div>`;
    }).join('');
    return panel('Season by Season', `<div class="yrs edge-fade">${tiles}</div>`, key(a, b));
  }

  // ---------- The Edge ----------
  // Each card names who holds it and by how much. A stat that's just the
  // other side's number with the sign flipped is stated once.
  function edges(all, a, b, A, B) {
    const card = (label, s, value, sub) => `<div class="edge ${s}"><div class="edge-l">${label}</div><div class="edge-m">${s ? mono(s === 'a' ? a : b, s) : ''}<span class="edge-v">${value}</span></div><div class="edge-s">${sub}</div></div>`;
    const who = (x, y) => (x > y ? 'a' : y > x ? 'b' : '');
    const nm = s => esc(s === 'a' ? a : b);
    const out = [];

    // Average score
    { const s = who(A.avg, B.avg); out.push(card('Average score', s, f1(s === 'b' ? B.avg : A.avg), s ? `vs ${f1(s === 'a' ? B.avg : A.avg)}` : 'Dead even')); }
    // Total margin -- once, for whoever is up
    { const m = A.pts - B.pts, s = m > 0 ? 'a' : m < 0 ? 'b' : ''; out.push(card('Points edge', s, s ? `+${f1(Math.abs(m))}` : '0', s ? `over ${all.length} games` : 'Dead even')); }
    // Highest score
    { const ha = sc(A.hiG, a), hb = sc(B.hiG, b), s = who(ha, hb), g = s === 'b' ? B.hiG : A.hiG; out.push(card('Highest score', s || 'a', f2(Math.max(ha, hb)), when(g))); }
    // Biggest win
    { const ma = A.bigW ? mg(A.bigW) : -1, mb = B.bigW ? mg(B.bigW) : -1, s = who(ma, mb) || 'a', g = s === 'a' ? A.bigW : B.bigW;
      out.push(card('Biggest win', s, `+${f1(mg(g))}`, `${f2(sc(g, g.winner))}-${f2(sc(g, g.winner === a ? b : a))} · ${g.year}`)); }
    // Close games and blowouts as records, from the leader's side
    const rec = (label, x, y, what) => { const s = who(x, y); return card(label, s, x + y ? `${Math.max(x, y)}-${Math.min(x, y)}` : '—', x + y ? (s ? what : `${what} · even`) : `None ${what}`); };
    out.push(rec('Close games', A.close, B.close, `under ${CLOSE} pts`));
    out.push(rec('Blowouts', A.blow, B.blow, `by ${BLOWOUT}+ pts`));
    // Beat the league median in these games
    { const s = who(A.aboveMed, B.aboveMed); out.push(card('Beat the median', s, `${Math.max(A.aboveMed, B.aboveMed)}`, s ? `of ${all.length} · vs ${Math.min(A.aboveMed, B.aboveMed)}` : `of ${all.length} each`)); }
    // Best win streak
    { const s = who(A.best, B.best); out.push(card('Longest streak', s, `${Math.max(A.best, B.best)} straight`, s ? `vs ${Math.min(A.best, B.best)}` : 'Even')); }
    return panel('The Edge', `<div class="edges">${out.join('')}</div>`);
  }

  // ---------- Career tale of the tape ----------
  function tape(a, b) {
    const pa = fr(a), pb = fr(b);
    if (!pa || !pb) return '';
    const yrs = p => p.seasons;
    const rows = [
      ['Seasons', yrs, String, 1],
      ['Titles', p => p.career.standings.championships, String, 1],
      ['Finals', p => p.career.standings.champ_appearances, String, 1],
      ['Playoff trips', p => p.career.standings.playoff_appearances, String, 1],
      ['Win %', p => p.career.win_rates.reg_pct, v => f1(v) + '%', 1],
      ['Power ranking', p => p.all_play && p.all_play.pct, v => f1(v) + '%', 1],
      ['Avg points', p => p.career.points.avg_pf, f1, 1],
      ['Lineup eff.', p => p.efficiency && p.efficiency.career_pct, v => f1(v) + '%', 1],
      ['Sackos', p => p.career.standings.sackos, String, -1],
      ['Net money', p => p.money && p.money.net_result, LG.money, 1],
    ];
    const html = rows.map(([label, get, fmt, dir]) => {
      const va = get(pa), vb = get(pb);
      const has = v => v !== null && v !== undefined;
      let ca = '', cb = '';
      if (has(va) && has(vb)) {
        if (va === vb) { ca = cb = ' even'; }
        else if ((va - vb) * dir > 0) ca = ' win'; else cb = ' win';
      }
      return `<div class="tr"><div class="tr-v l${ca}">${has(va) ? fmt(va) : '—'}</div><div class="tr-l">${label}</div><div class="tr-v r${cb}">${has(vb) ? fmt(vb) : '—'}</div></div>`;
    }).join('');
    return panel('Careers', `<div class="tape-head"><span>${esc(a)}</span><span></span><span>${esc(b)}</span></div><div class="tape">${html}</div>`);
  }

  // ---------- Every game ----------
  function gameLog(all, a, b) {
    const rows = all.slice().reverse().map(g => {
      const aw = g.winner === a, s = aw ? 'a' : 'b';
      const tag = TAGS[g.type];
      return `<div class="g${g.type === 'Champ' ? ' final' : ''}">
        <div class="g-when"><b>${g.year}</b><span${tag ? ` class="tag${g.type === 'Sacko' ? ' sacko' : ''}"` : ''}>${tag || `Week ${g.week}`}</span></div>
        <div class="g-sc pair2"><span class="${aw ? 'ca' : 'lose'}">${f2(sc(g, a))}</span><i>–</i><span class="${aw ? 'lose' : 'cb'}">${f2(sc(g, b))}</span></div>
        <div class="g-win">${mono(g.winner, s)}<span class="g-m c${s}">+${f1(mg(g))}</span></div>
      </div>`;
    }).join('');
    return panel('Every Game', `<div class="glist-head"><div></div><div class="pair2"><span class="ca">${esc(a)}</span><span></span><span class="cb">${esc(b)}</span></div><div style="text-align:right" class="cd">Winner</div></div>${rows}`, `<span class="chip">${all.length} games</span>`);
  }

  function render() {
    const a = $('p1').value, b = $('p2').value;
    try { localStorage.setItem('h2h-pair', JSON.stringify([a, b])); } catch (e) {}
    if (a === b) { $('compare').innerHTML = '<div class="loading-row">Pick two different managers.</div>'; return; }
    const all = pairGames(a, b);
    if (!all.length) { $('compare').innerHTML = `<div class="loading-row">${esc(a)} and ${esc(b)} have never played each other.</div>`; return; }
    const A = side(all, a, b), B = side(all, b, a);
    $('compare').innerHTML = matchup(all, a, b, A, B) + momentum(all, a, b) + seasons(all, a, b) + edges(all, a, b, A, B) + tape(a, b) + gameLog(all, a, b);
    const yrs = document.querySelector('.yrs');
    if (yrs) yrs.scrollLeft = yrs.scrollWidth;
  }

  Promise.all([
    LG.load(),
    fetch('data/franchise.json', { cache: 'no-store' }).then(r => r.json()).catch(() => null),
  ]).then(([data, franchise]) => {
    DATA = data; FR = franchise;
    const names = [...new Set(data.games.flatMap(g => [g.p1, g.p2]).filter(Boolean))].sort();
    const active = names.filter(n => data.active.has(n));
    const former = names.filter(n => !data.active.has(n));
    const opts = `<optgroup label="Current teams">${active.map(n => `<option>${esc(n)}</option>`).join('')}</optgroup>` +
      (former.length ? `<optgroup label="Former teams">${former.map(n => `<option>${esc(n)}</option>`).join('')}</optgroup>` : '');
    $('p1').innerHTML = opts;
    $('p2').innerHTML = opts;
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem('h2h-pair')); } catch (e) {}
    const ok = n => names.includes(n);
    const pair = saved && ok(saved[0]) && ok(saved[1]) ? saved : ['Joe G', 'Joe K'];
    $('p1').value = ok(pair[0]) ? pair[0] : active[0];
    $('p2').value = ok(pair[1]) ? pair[1] : active[1];
    $('p1').addEventListener('change', render);
    $('p2').addEventListener('change', render);
    $('swap').addEventListener('click', () => { const t = $('p1').value; $('p1').value = $('p2').value; $('p2').value = t; render(); });
    render();
  }).catch(err => LG.showError('compare', err));
</script>
<script src="track.js?v=1" defer></script>
</body>
</html>
