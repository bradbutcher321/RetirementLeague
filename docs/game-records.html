     at the weights this site uses -- one variable-font file per family
     covers every weight declared, confirmed directly by fetching the
     stylesheet below and comparing each @font-face block's url(). Starts
     the actual font downloads immediately, in parallel with that
     stylesheet fetch, instead of waiting to discover these same URLs
     only after the stylesheet loads and is parsed -- avoids the
     fallback-to-webfont swap (FOUT) that otherwise shows on a slow or
     uncached load. If Google ever changes these hashed URLs, this just
     degrades to a wasted (unused) preload, not a correctness issue -- the
     stylesheet's own @font-face still fetches whatever the new URL is. -->
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/bigshouldersdisplay/v24/fC1_PZJEZG-e9gHhdI4-NBbfd2ys3SjJCx1czNDu.woff2">

<style>
  /* ---------- Game Records: one card per pair of records ----------
     Built phone-first. Each card holds a high-end and a low-end record as
     two rows. A gold monogram anchors who holds each record, the record type
     is a small dim caption, and every value is gold -- a low-end record is
     still a record, so neither side of a pair outranks the other. The
     holder's name is the one bright line of text in a row. Tapping a record
     opens its top 10: a bottom sheet on a phone, a popover under the whole
     card on desktop. */
  .sections{ display:grid; grid-template-columns:1fr; gap:12px; align-items:start; }
  @media (min-width:721px){ .sections{ grid-template-columns:1fr 1fr; gap:14px; } }
  /* margin-bottom:0 -- theme.css gives every <section> 44px of bottom
     margin for page-level spacing, which pushed these cards far apart. */
  .section{ padding:12px 6px 6px; overflow:visible; margin-bottom:0; }
  .section.has-pop{ border-color:var(--lead-line); }
  .section-title{ font-weight:700; font-size:0.95rem; padding:2px 10px 6px; }

  .rec{ display:grid; grid-template-columns:36px minmax(0,1fr) auto 12px; gap:12px; align-items:center; width:100%; padding:10px;
        font:inherit; color:inherit; text-align:left; background:none; border:1px solid transparent; border-radius:10px; cursor:pointer; position:relative; }
  .rec + .rec::before{ content:''; position:absolute; left:10px; right:10px; top:-1px; height:1px; background:var(--line); }
  .rec:hover{ background:var(--item-hover); }
  .rec:focus-visible{ outline:2px solid var(--gold); outline-offset:-2px; }
  .rec.open{ background:var(--lead-tint); border-color:var(--lead-line); }
  .rec.open::before, .rec.open + .rec::before{ display:none; }
  .rec.empty{ cursor:default; }
  .mono{ width:36px; height:36px; border-radius:50%; border:1px solid rgba(212,180,106,0.4); background:rgba(212,180,106,0.07); color:var(--gold);
         display:flex; align-items:center; justify-content:center; font-family:var(--scoreboard); font-weight:800; font-size:0.95rem; letter-spacing:0.02em; }
  .mono.many{ font-family:var(--body); font-size:0.66rem; font-weight:700; }
  .cap{ display:block; color:var(--text-dim); font-size:0.6rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; }
  .holder{ display:block; font-weight:600; font-size:0.88rem; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .own{ color:var(--text-dim); font-weight:500; }
  /* Wraps rather than truncating: on a phone "· Champ" was cut to "· Cha…". */
  .ctx{ display:block; color:var(--text-dim); font-size:0.72rem; line-height:1.4; }
  .rec-val{ font-family:var(--scoreboard); font-weight:800; font-size:1.5rem; color:var(--gold); font-variant-numeric:tabular-nums; line-height:1; white-space:nowrap; }
  .chev{ color:var(--text-dim); font-size:1.1rem; line-height:1; }
  .rec.open .chev{ color:var(--gold); }

  /* ---------- The top 10 (sheet and popover share it) ---------- */
  .list-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; }
  .list-title{ font-weight:700; font-size:1.05rem; }
  .list-switch{ margin-bottom:6px; }
  /* Separators are drawn as a pseudo-line rather than a border-top, so an
     open row's gold outline isn't interrupted by the line above it. */
  .crow{ display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:10px; align-items:center; padding:9px 4px; position:relative; border:1px solid transparent; border-radius:10px; }
  .crow + .crow::before, .lineup + .crow::before{ content:''; position:absolute; left:4px; right:4px; top:-1px; height:1px; background:var(--line); }
  /* A list of single games gets a chevron column, on every row so the
     values stay aligned even where a game has no lineup (before 2019). */
  .crow.g{ grid-template-columns:22px minmax(0,1fr) auto 12px; }
  button.crow{ width:100%; font:inherit; color:inherit; text-align:left; background:none; cursor:pointer; }
  button.crow:hover{ background:var(--item-hover); }
  button.crow:focus-visible{ outline:2px solid var(--gold); outline-offset:-2px; }
  .crow.open{ background:var(--lead-tint); border-color:var(--lead-line); }
  .crow.open::before, .crow.open + .lineup + .crow::before{ display:none; }
  .crow .go{ color:var(--text-dim); font-size:1rem; line-height:1; text-align:center; transition:transform .25s; }
  .crow.open .go{ transform:rotate(90deg); color:var(--gold); }
  .crow .rk{ font-family:var(--scoreboard); font-weight:700; font-size:1rem; color:var(--text-dim); text-align:center; }
  .crow .nm{ font-weight:600; font-size:0.86rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .crow .mt{ color:var(--text-dim); font-size:0.71rem; margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .crow .vl{ font-family:var(--scoreboard); font-weight:700; font-size:1.1rem; font-variant-numeric:tabular-nums; text-align:right; }
  .crow.top .rk, .crow.top .vl{ color:var(--gold); }

  /* ---------- A game's full lineups, opened under its row ----------
     The Dashboard's matchup roster rows (index.html, .mu-*), minus the
     live-game states: the record holder on the left, the opponent mirrored
     on the right, the lineup slot between them. Starters, then the bench.
     Opens with the same 0fr -> 1fr height glide. */
  .lineup{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .4s cubic-bezier(.2,.8,.2,1); }
  .lineup.on{ grid-template-rows:1fr; }
  .lineup > div{ overflow:hidden; min-height:0; visibility:hidden; transition:visibility 0s .4s; }
  .lineup.on > div{ visibility:visible; transition-delay:0s; }
  .lu-body{ background:rgba(0,0,0,0.22); border:1px solid var(--line); border-radius:10px; padding:4px; margin:6px 0 8px; }
  .lu-note{ color:var(--text-dim); font-size:0.78rem; padding:12px 8px; text-align:center; }
  /* Who is on which side: each manager over their score, the winner's in
     gold, and the result read from the left (record holder's) side. */
  .lu-head{ display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:end; gap:10px; padding:10px 10px 10px; border-bottom:1px solid var(--line); }
  .lu-side{ min-width:0; }
  .lu-side.r{ text-align:right; }
  .lu-mgr{ font-weight:600; font-size:0.8rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lu-score{ font-family:var(--scoreboard); font-weight:700; font-size:1.7rem; line-height:1; margin-top:3px; font-variant-numeric:tabular-nums; }
  .lu-score.won{ color:var(--gold); }
  .lu-res{ align-self:center; color:var(--text-dim); font-size:0.6rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; white-space:nowrap; }
  .mu-row{ display:grid; grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr); align-items:stretch; padding:1px 0; }
  .mu-row + .mu-row{ border-top:1px solid rgba(255,255,255,0.04); }
  .mu-slot{ align-self:center; justify-self:center; font-size:0.6rem; font-weight:700; letter-spacing:0.04em; color:var(--text-dim); }
  .mu-pc{ min-width:0; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px; align-items:center; padding:7px 6px; }
  .mu-pc.r{ grid-template-columns:auto minmax(0,1fr); }
  .mu-pc.r .mu-pinfo{ order:2; text-align:right; }
  .mu-pc.r .mu-pscore{ order:1; text-align:left; }
  .mu-pinfo{ min-width:0; }
  /* Flex row so the team badge always stays whole and the name hard-clips
     where it meets it; only names that actually overflow fade out. */
  .player-name{ display:flex; align-items:center; gap:4px; min-width:0; font-weight:600; font-size:0.8rem; }
  .mu-pc.r .player-name{ justify-content:flex-end; }
  .name-text{ min-width:0; overflow:hidden; white-space:nowrap; }
  .name-text.clipped{ -webkit-mask-image:linear-gradient(to right, #000 calc(100% - 12px), transparent); mask-image:linear-gradient(to right, #000 calc(100% - 12px), transparent); }
  .team-tag{ flex-shrink:0; font-size:0.58rem; font-weight:700; color:var(--text-dim); background:var(--surface-raised); border:1px solid var(--line); border-radius:4px; padding:1px 4px; }
  .mu-pscore{ text-align:right; font-variant-numeric:tabular-nums; }
  .mu-pts{ font-family:var(--scoreboard); font-weight:700; font-size:1.05rem; line-height:1; }
  .mu-sub{ font-size:0.64rem; color:var(--text-dim); margin-top:3px; white-space:nowrap; font-weight:500; }
  .mu-sub.up{ color:var(--turf); font-weight:700; }
  .mu-sub.down{ color:var(--loss); font-weight:700; }
  .mu-row.bench .player-name{ color:rgba(245,245,243,0.6); }
  .mu-row.bench .mu-pts{ color:var(--text-dim); }
  .lu-div{ display:flex; align-items:center; gap:8px; padding:8px 6px 4px; color:var(--text-dim); font-size:0.6rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; }
  .lu-div::before, .lu-div::after{ content:''; flex:1; height:1px; background:var(--line); }
  @media (prefers-reduced-motion:reduce){ .lineup, .lineup > div, .crow .go{ transition:none; } }

  /* The list opens in a bottom sheet on a phone and a popover under the
     whole card on desktop -- the same spot for either of its records, so
     flipping the switch swaps the list without it moving. Both surfaces,
     and their × button, are shared with the Dashboard's Median Watch: see
     "Detail panels" in theme.css. */
</style>

<script>
  // esc() is a global from page-common.js, not part of LG.
  const { f2 } = LG;
  let D;

  const when = g => `${g.year} · Week ${g.week}${g.type === 'Reg' ? '' : ' · ' + g.type}`;
  const by = (list, fn, desc) => list.slice().sort((a, b) => (desc ? fn(b) - fn(a) : fn(a) - fn(b)));

  function categories(sel) {
    // Consolation-bracket games ('Cons') don't count toward any record:
    // nothing rides on them, so a benched-out lineup there isn't a real low
    // score. The Sacko, 3rd and 5th place games still count.
    const games = D.games.filter(g => g.type !== 'Bye' && g.type !== 'Cons' && g.p2 && g.s1 > 0 && g.s2 > 0 &&
      g.winner !== 'In Progress' && (sel === 'all' || g.year === Number(sel)));
    const decided = games.filter(g => g.winner === g.p1 || g.winner === g.p2);
    const scores = games.flatMap(g => [{ team: g.p1, s: g.s1, opp: g.p2, os: g.s2, g }, { team: g.p2, s: g.s2, opp: g.p1, os: g.s1, g }]);
    const margin = g => Math.abs(g.s1 - g.s2), total = g => g.s1 + g.s2;
    const wS = g => (g.winner === g.p1 ? g.s1 : g.s2), lS = g => (g.winner === g.p1 ? g.s2 : g.s1);
    const lt = g => (g.winner === g.p1 ? g.p2 : g.p1);
    const winFirst = g => ({ a: g.winner, as: wS(g), b: lt(g), bs: lS(g) });
    const loseFirst = g => ({ a: lt(g), as: lS(g), b: g.winner, bs: wS(g) });

    // ownScore: the record's value IS the named manager's own score, so their
    // name stands alone -- printing the score beside it would repeat it.
    const team = (title, desc) => ({
      title, ownScore: true,
      items: by(scores, x => x.s, desc).slice(0, 10).map(x => ({ v: x.s, m: { a: x.team, as: x.s, b: x.opp, bs: x.os }, meta: when(x.g), g: x.g })),
    });
    const match = (title, list, fn, desc, side = winFirst, ownScore = false) => ({
      title, ownScore,
      items: by(list, fn, desc).slice(0, 10).map(g => ({ v: fn(g), m: side(g), meta: when(g), g })),
    });
    // ----- Luck: how many of that week's other scores you beat, regular
    // season only (the only weeks where every team plays). A share rather
    // than a count, since the league has been 8, 10 and 12 teams.
    const weeks = new Map();
    scores.filter(x => x.g.type === 'Reg').forEach(x => {
      const k = `${x.g.year}:${x.g.week}`;
      if (!weeks.has(k)) weeks.set(k, []);
      weeks.get(k).push(x);
    });
    const allPlay = [...weeks.values()].flatMap(wk => wk.map(x => ({
      ...x, beat: wk.filter(y => y.s < x.s).length, others: wk.length - 1, won: x.g.winner === x.team,
    })));
    const share = x => x.beat / x.others;
    const luckItem = x => ({
      v: x.s, tk: `${x.beat}/${x.others}/${x.s}`,
      m: { a: x.team, as: x.s, b: x.opp, bs: x.os }, meta: `Beat ${x.beat} of ${x.others} · ${when(x.g)}`, g: x.g,
    });
    const unlucky = allPlay.filter(x => !x.won).sort((a, b) => share(b) - share(a) || b.s - a.s);
    const lucky = allPlay.filter(x => x.won).sort((a, b) => share(a) - share(b) || a.s - b.s);

    // ----- Title games -----
    const finals = games.filter(g => g.type === 'Champ');
    const finalScores = scores.filter(x => x.g.type === 'Champ');

    // ----- Against the weekly median (every game type carries one) -----
    const vsMedian = scores.filter(x => typeof x.g.median === 'number').map(x => ({ ...x, d: x.s - x.g.median }));
    const signed = d => (d >= 0 ? '+' : '−') + f2(Math.abs(d));
    const medianItem = x => ({ v: x.d, label: signed(x.d), m: { a: x.team, as: x.s, b: x.opp, bs: x.os }, meta: when(x.g), g: x.g });

    // ----- Weekly high and low scores, counted per manager (regular season) -----
    const tally = pick => {
      const n = new Map();
      [...weeks.values()].forEach(wk => { const x = pick(wk); n.set(x.team, (n.get(x.team) || 0) + 1); });
      return [...n].sort((a, b) => b[1] - a[1]).slice(0, 10)
        .map(([name, count]) => ({ v: count, label: String(count), m: { a: name }, meta: `of ${weeks.size} weeks` }));
    };
    const highest = wk => wk.reduce((a, b) => (b.s > a.s ? b : a));
    const lowest = wk => wk.reduce((a, b) => (b.s < a.s ? b : a));

    return {
      topS: team('Top Scores', true), lowS: team('Lowest Scores', false),
      hiM: match('Highest Victory Margins', decided, margin, true),
      loM: match('Lowest Victory Margins', decided, margin, false),
      hiC: match('Most Combined Points', games, total, true), loC: match('Least Combined Points', games, total, false),
      hiL: match('Highest Score in a Loss', decided, lS, true, loseFirst, true), loW: match('Lowest Score in a Win', decided, wS, false, winFirst, true),
      unl: { title: 'Unluckiest Losses', ownScore: true, items: unlucky.slice(0, 10).map(luckItem) },
      lck: { title: 'Luckiest Wins', ownScore: true, items: lucky.slice(0, 10).map(luckItem) },
      hiF: { title: 'Title Game Scores', ownScore: true, items: by(finalScores, x => x.s, true).slice(0, 10).map(x => ({ v: x.s, m: { a: x.team, as: x.s, b: x.opp, bs: x.os }, meta: when(x.g), g: x.g })) },
      loF: match('Closest Title Games', finals, margin, false),
      upMed: { title: 'Furthest Above the Median', ownScore: true, items: by(vsMedian, x => x.d, true).slice(0, 10).map(medianItem) },
      dnMed: { title: 'Furthest Below the Median', ownScore: true, items: by(vsMedian, x => x.d, false).slice(0, 10).map(medianItem) },
      hiWk: { title: 'Most Weekly High Scores', ownScore: true, ties: true, items: tally(highest) },
      loWk: { title: 'Most Weekly Low Scores', ownScore: true, ties: true, items: tally(lowest) },
    };
  }

  const versus = i => (i.m.b ? `vs ${esc(i.m.b)} ${f2(i.m.bs)}` : '');
  const shown = i => i.label || f2(i.v);
  const nameList = n => n.length < 3 ? n.join(' and ') : `${n.slice(0, -1).join(', ')}, and ${n[n.length - 1]}`;
  // The holder's own score always sits next to their name -- on the card and
  // in the top 10 alike -- even where it's also the record's value. A count
  // (weekly highs/lows) has no score of its own to show.
  const withScore = (c, i) => `${esc(i.m.a)}${!c.ties && i.m.as != null ? ` <span class="own">${f2(i.m.as)}</span>` : ''}`;

  // Each card pairs a high-end and a low-end record.
  const LEDGER = [
    { title: 'Scores', hi: ['topS', 'Highest'], lo: ['lowS', 'Lowest'] },
    { title: 'Victory Margins', hi: ['hiM', 'Biggest'], lo: ['loM', 'Closest'] },
    { title: 'Combined Points', hi: ['hiC', 'Most'], lo: ['loC', 'Least'] },
    // Both records are a score that didn't match the result.
    { title: 'Scores vs. Results', hi: ['hiL', 'Highest in a loss'], lo: ['loW', 'Lowest in a win'] },
    { title: 'Luck', hi: ['unl', 'Unluckiest loss'], lo: ['lck', 'Luckiest win'] },
    { title: 'Title Games', hi: ['hiF', 'Highest score'], lo: ['loF', 'Closest finish'] },
    { title: 'Against the Weekly Median', hi: ['upMed', 'Furthest above'], lo: ['dnMed', 'Furthest below'] },
    { title: 'Weekly High & Low Scores', hi: ['hiWk', 'Most weekly highs'], lo: ['loWk', 'Most weekly lows'] },
  ];

  // monogram() comes from page-common.js, shared with Franchise.

  // Rank by displayed value, so managers tied on a count share a rank (and
  // the record) instead of the sort order quietly picking one of them.
  function rankOf(items) {
    const key = i => i.tk || shown(i);
    const out = [];
    items.forEach((i, k) => out.push(k > 0 && key(i) === key(items[k - 1]) ? out[k - 1] : k + 1));
    return out;
  }

  let C = null;
  let open = null; // { panel, side }
  // One column means a phone-shaped screen: the top 10 opens as a sheet.
  const oneColumn = matchMedia('(max-width:720px)');

  function recHtml(c, kind, panel, side) {
    const i = c.items[0];
    if (!i) return `<div class="rec empty"><span></span><span><span class="cap">${kind}</span><span class="ctx">No games yet</span></span><span class="rec-val">—</span><span></span></div>`;
    const lead = c.ties ? c.items.filter(x => shown(x) === shown(i)) : [i];
    const many = lead.length > 1;
    const holder = c.ties ? esc(nameList(lead.map(x => x.m.a))) : withScore(c, i);
    const ctx = [versus(i), many ? 'Tied' : '', i.meta.replace(/ · Week (\d+)/, ' Wk $1')].filter(Boolean).join(' · ');
    const isOpen = open && open.panel === panel && open.side === side;
    return `<button type="button" class="rec${isOpen ? ' open' : ''}" data-panel="${panel}" data-side="${side}" aria-haspopup="dialog" aria-expanded="${!!isOpen}">` +
      (many ? `<span class="mono many">${lead.length}&times;</span>` : `<span class="mono">${esc(monogram(i.m.a))}</span>`) +
      `<span style="min-width:0"><span class="cap">${kind}</span><span class="holder">${holder}</span><span class="ctx">${ctx}</span></span>` +
      `<span class="rec-val">${shown(i)}</span><span class="chev" aria-hidden="true">&#8250;</span></button>`;
  }

  // The card's own title heads the list, with its two records as the switch
  // -- "Lowest Scores" above a Highest/Lowest switch under "Scores" only
  // said the same thing again.
  function listParts() {
    const p = LEDGER[open.panel], c = C[p[open.side][0]];
    const r = rankOf(c.items);
    // A count's meta ("of 153 weeks") is the same on every row, so the list drops it.
    // A row that is one game opens that game's lineups underneath it.
    const games = c.items.some(i => i.g);
    const rows = c.items.length
      ? c.items.map((i, k) => {
        const cls = `crow${games ? ' g' : ''}${r[k] === 1 ? ' top' : ''}`;
        const inner = `<div class="rk">${r[k]}</div><div style="min-width:0"><div class="nm">${withScore(c, i)}</div>${c.ties ? '' : `<div class="mt">${[versus(i), i.meta].filter(Boolean).join(' · ')}</div>`}</div><div class="vl">${shown(i)}</div>`;
        if (!hasLineup(i)) return `<div class="${cls}">${inner}${games ? '<div></div>' : ''}</div>`;
        const g = i.g;
        return `<button type="button" class="${cls}" data-lu="${g.year}|${g.week}|${esc(i.m.a)}|${esc(i.m.b)}|${i.m.as}|${i.m.bs}" aria-expanded="false">${inner}<div class="go" aria-hidden="true">&#8250;</div></button><div class="lineup"><div></div></div>`;
      }).join('')
      : '<div class="empty-note">No games yet for this season.</div>';
    const head = `<div class="list-head"><div class="list-title">${p.title}</div><button type="button" class="x" data-close aria-label="Close">&times;</button></div>
      <div class="seg list-switch"><button class="${open.side === 'hi' ? 'on' : ''}" data-switch="hi">${p.hi[1]}</button><button class="${open.side === 'lo' ? 'on' : ''}" data-switch="lo">${p.lo[1]}</button></div>`;
    return { head, rows, label: c.title };
  }

  // ---------- A game's lineups ----------
  // data/lineups/<year>.json, written by generate_lineup_data_d1.py (2019 on)
  // and generate_old_lineup_data.py (2017-2018). ESPN kept no usable
  // lineups before 2017, so those games don't open.
  const LINEUP_FROM = 2017;
  const hasLineup = i => i.g && i.g.year >= LINEUP_FROM && i.m.b;
  const lineupYears = new Map();
  const lineupYear = y => {
    if (!lineupYears.has(y)) {
      lineupYears.set(y, fetch(`data/lineups/${y}.json`, { cache: 'no-cache' })
        .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
        .catch(err => { lineupYears.delete(y); throw err; }));
    }
    return lineupYears.get(y);
  };
  const SLOT_LABEL = { 'RB/WR/TE': 'FLEX', BE: 'BN' };
  const BENCH = new Set(['BE', 'IR']);
  // "J. Allen", as on the Dashboard: two players to a row on a phone. A
  // D/ST keeps its whole name, since its first word is what identifies it.
  const shortName = n => { const parts = n.split(' '); return parts.length < 2 || /D\/ST/.test(n) ? n : `${parts[0][0]}. ${parts.slice(1).join(' ')}`; };

  function playerCell(p, side) {
    if (!p) return `<div class="mu-pc ${side}"></div>`;
    const [name, team, slot, pts, proj] = p;
    // A starter's result against his projection goes green or red; a
    // bench player's stays grey, since it didn't count.
    const d = proj > 0 ? pts - proj : null;
    const tone = BENCH.has(slot) || d === null ? '' : d > 0.05 ? ' up' : d < -0.05 ? ' down' : '';
    const sub = d === null ? '' : `<div class="mu-sub${tone}" title="Projected ${f2(proj)}">${d >= 0 ? '▲' : '▼'} ${f2(Math.abs(d))}</div>`;
    return `<div class="mu-pc ${side}"><div class="mu-pinfo"><div class="player-name"><span class="name-text">${esc(shortName(name))}</span>${team ? `<span class="team-tag">${esc(team)}</span>` : ''}</div></div>` +
      `<div class="mu-pscore"><div class="mu-pts">${f2(pts)}</div>${sub}</div></div>`;
  }
  function lineupRows(a, b, bench) {
    const out = [];
    for (let k = 0; k < Math.max(a.length, b.length); k++) {
      const slot = (a[k] || b[k])[2];
      out.push(`<div class="mu-row${bench ? ' bench' : ''}">${playerCell(a[k], '')}<span class="mu-slot">${SLOT_LABEL[slot] || slot}</span>${playerCell(b[k], 'r')}</div>`);
    }
    return out.join('');
  }
  // The two managers over their scores, heading the lineups so each column
  // says whose it is.
  function lineupHead(a, b, as, bs) {
    const res = as > bs ? 'def.' : as < bs ? 'lost to' : 'tied';
    const sideHtml = (name, mine, theirs, cls) => `<div class="lu-side${cls}"><div class="lu-mgr">${esc(name)}</div><div class="lu-score${mine > theirs ? ' won' : ''}">${f2(mine)}</div></div>`;
    return `<div class="lu-head">${sideHtml(a, as, bs, '')}<div class="lu-res">${res}</div>${sideHtml(b, bs, as, ' r')}</div>`;
  }
  // The record holder's team on the left, as the row above it reads.
  function lineupHtml(data, week, a, b, as, bs) {
    const wk = data.weeks[week] || {};
    if (!wk[a] || !wk[b]) return '<div class="lu-body"><div class="lu-note">No lineups for this game.</div></div>';
    const starters = l => l.filter(p => !BENCH.has(p[2])), bench = l => l.filter(p => BENCH.has(p[2]));
    const ba = bench(wk[a]), bb = bench(wk[b]);
    return `<div class="lu-body">${lineupHead(a, b, as, bs)}${lineupRows(starters(wk[a]), starters(wk[b]), false)}` +
      (ba.length || bb.length ? `<div class="lu-div">Bench</div>${lineupRows(ba, bb, true)}` : '') + '</div>';
  }
  // Names hard-clip at the team badge; only the ones that actually do fade out.
  const markClipped = root => root.querySelectorAll('.name-text').forEach(n => n.classList.toggle('clipped', n.scrollWidth > n.clientWidth + 1));

  // Several games can be open at once, to compare them.
  function toggleLineup(row) {
    const on = !row.classList.contains('open');
    const box = row.nextElementSibling;
    row.classList.toggle('open', on);
    row.setAttribute('aria-expanded', on);
    box.classList.toggle('on', on);
    if (!on || box.dataset.filled) return;
    const [year, week, a, b, as, bs] = row.dataset.lu.split('|');
    const inner = box.firstElementChild;
    inner.innerHTML = '<div class="lu-body"><div class="lu-note">Loading lineups…</div></div>';
    lineupYear(year).then(data => {
      inner.innerHTML = lineupHtml(data, week, a, b, Number(as), Number(bs));
      box.dataset.filled = '1';
      markClipped(inner);
    }).catch(() => { inner.innerHTML = `<div class="lu-body"><div class="lu-note">Couldn't load the lineups.</div></div>`; });
  }

  // The cards are built once per year. Opening, closing and switching a list
  // never rebuild them -- that would replay the sheet's slide-up on every
  // switch and lose the reader's scroll position.
  function render() {
    C = categories(document.getElementById('year-select').value);
    document.getElementById('records').innerHTML = `<div class="sections">${LEDGER.map((p, n) =>
      `<section class="glass section" data-section="${n}"><div class="section-title">${p.title}</div>${recHtml(C[p.hi[0]], p.hi[1], n, 'hi')}${recHtml(C[p.lo[0]], p.lo[1], n, 'lo')}</section>`).join('')}</div>`;
    if (open) showList(false);
  }

  function markRecs() {
    document.querySelectorAll('.rec[data-panel]').forEach(r => {
      const on = !!open && Number(r.dataset.panel) === open.panel && r.dataset.side === open.side;
      r.classList.toggle('open', on);
      r.setAttribute('aria-expanded', on);
    });
  }

  // Opens the list, or -- if one is already up -- swaps its contents in place.
  function showList(animate) {
    markRecs();
    const l = listParts();
    const existing = document.getElementById('gr-sheet') || document.getElementById('gr-pop');
    if (existing) {
      existing.querySelector('[data-head]').innerHTML = l.head;
      const body = existing.querySelector('[data-body]');
      body.innerHTML = l.rows;
      body.scrollTop = 0;
      existing.setAttribute('aria-label', l.label);
      placePop();
      return;
    }
    if (!oneColumn.matches) {
      document.body.insertAdjacentHTML('beforeend', `<div class="pop" id="gr-pop" role="dialog" aria-label="${l.label}"><div data-head>${l.head}</div><div data-body>${l.rows}</div></div>`);
      placePop();
      return;
    }
    const still = animate ? '' : ' style="animation:none"';
    document.body.insertAdjacentHTML('beforeend', `<div class="scrim" data-close${still}></div><div class="sheet" id="gr-sheet" role="dialog" aria-modal="true" aria-label="${l.label}"${still}>
      <div class="sheet-grab" data-grab><span></span></div>
      <div class="sheet-head" data-grab data-head>${l.head}</div>
      <div class="sheet-body" data-body>${l.rows}</div></div>`);
    wireSwipe();
  }

  function hideList() {
    open = null;
    markRecs();
    document.querySelectorAll('#gr-sheet, #gr-pop, .scrim').forEach(el => el.remove());
    document.querySelectorAll('.section.has-pop').forEach(s => s.classList.remove('has-pop'));
  }

  // Anchors the popover under the whole card, the card's width. Two passes:
  // placing it can lengthen the page enough to add a scrollbar, which shifts
  // the card, and the second pass lands on the final spot.
  function placePop() {
    const pop = document.getElementById('gr-pop');
    document.querySelectorAll('.section.has-pop').forEach(s => s.classList.remove('has-pop'));
    if (!pop || !open) return;
    const card = document.querySelector(`.section[data-section="${open.panel}"]`);
    if (!card) return;
    card.classList.add('has-pop');
    for (let pass = 0; pass < 2; pass++) {
      const r = card.getBoundingClientRect();
      pop.style.width = r.width + 'px';
      pop.style.left = (r.left + scrollX) + 'px';
      pop.style.top = (r.bottom + scrollY + 10) + 'px';
    }
  }

  // Drag the sheet down past 90px to dismiss it, like a native sheet.
  function wireSwipe() {
    const sheet = document.getElementById('gr-sheet');
    if (!sheet) return;
    let y0 = null, dy = 0;
    sheet.querySelectorAll('[data-grab]').forEach(el => {
      el.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; y0 = e.clientY; dy = 0; sheet.style.animation = 'none'; el.setPointerCapture(e.pointerId); });
      el.addEventListener('pointermove', e => { if (y0 === null) return; dy = Math.max(0, e.clientY - y0); sheet.style.transform = `translateY(${dy}px)`; });
      el.addEventListener('pointerup', () => { if (y0 === null) return; y0 = null; if (dy > 90) hideList(); else sheet.style.transform = ''; });
    });
  }

  document.addEventListener('click', e => {
    if (e.target.closest('[data-close]')) { hideList(); return; }
    const lu = e.target.closest('button.crow[data-lu]');
    if (lu) { toggleLineup(lu); return; }
    const sw = e.target.closest('[data-switch]');
    if (sw && open) { if (sw.dataset.switch !== open.side) { open = { ...open, side: sw.dataset.switch }; showList(false); } return; }
    const b = e.target.closest('button.rec[data-panel]');
    if (b) {
      const next = { panel: Number(b.dataset.panel), side: b.dataset.side };
      if (open && open.panel === next.panel && open.side === next.side) { hideList(); return; }
      open = next;
      showList(true);
      return;
    }
    if (open && !oneColumn.matches && !e.target.closest('#gr-pop') && !e.target.closest('select')) hideList();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && open) hideList(); });
  addEventListener('resize', placePop);
  // Crossing between one and two columns swaps sheet for popover: close it.
  oneColumn.addEventListener('change', hideList);

  LG.load().then(data => {
    D = data;
    const sel = document.getElementById('year-select');
    sel.innerHTML = '<option value="all">All-Time</option>' + data.years.slice().reverse().map(y => `<option value="${y}">${y}</option>`).join('');
    sel.addEventListener('change', render);
    render();
    riseIn(document.querySelectorAll('#records .section'));
  }).catch(err => LG.showError('records', err));
</script>
<script src="track.js?v=1" defer></script>
</body>
</html>
