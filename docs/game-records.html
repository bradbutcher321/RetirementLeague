<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>html{background:#050505}</style>
<title>Retirement League — Game Records</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The two font-family's woff2 files Google serves for the latin subset
     at the weights this site uses -- one variable-font file per family
     covers every weight declared, confirmed directly by fetching the
     stylesheet below and comparing each @font-face block's url(). Starts
     the actual font downloads immediately, in parallel with that
     stylesheet fetch, instead of waiting to discover these same URLs
     only after the stylesheet loads and is parsed -- avoids the
     fallback-to-webfont swap (FOUT) that otherwise shows on a slow or
     uncached load. If Google ever changes these hashed URLs, this just
     degrades to a wasted (unused) preload, not a correctness issue -- the
     stylesheet's own @font-face still fetches whatever the new URL is. -->
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/bigshouldersdisplay/v24/fC1_PZJEZG-e9gHhdI4-NBbfd2ys3SjJCx1czNDu.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=6">
<link rel="stylesheet" href="nav.css?v=4">
<link rel="stylesheet" href="league.css?v=6">
<style>
  /* ---------- Records tab: the paired ledger ----------
     The eight records grouped into the same four pairs the tabs use, one
     panel each, a high-end and a low-end row per panel. No green or red: most
     of these records are embarrassing ones, which used to turn half the page
     red. The high-end value is gold and the low-end one white, so the two
     still read apart. Panel shape matches the dashboard's cards: white title,
     bordered item rows. */
  .ledger{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:640px){ .ledger{ grid-template-columns:1fr; } }
  .ledger-panel{ padding:16px 18px 18px; display:flex; flex-direction:column; gap:10px; }
  .rec-title{ font-weight:700; font-size:0.92rem; margin-bottom:2px; }
  .lrow{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 14px; align-items:center; background:var(--item); border:1px solid var(--item-line); border-radius:10px; padding:11px 14px; }
  .lrow-kind{ grid-column:1 / -1; color:var(--text-dim); font-size:0.6rem; font-weight:700; letter-spacing:0.07em; text-transform:uppercase; }
  .lrow-name{ font-weight:700; font-size:0.9rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lrow-meta{ color:var(--text-dim); font-size:0.74rem; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lrow-val{ font-family:var(--scoreboard); font-weight:800; font-size:1.6rem; font-variant-numeric:tabular-nums; line-height:1; text-align:right; color:var(--text); }
  .lrow-val.hi{ color:var(--gold); }

  /* ---------- The other tabs: one ranked list ---------- */
  .rank-panel{ padding:16px 18px 18px; }
  .rank-head{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .rank-cols{ display:grid; grid-template-columns:1fr 1fr; gap:8px 12px; }
  @media (max-width:720px){ .rank-cols{ grid-template-columns:1fr; } }
  .rank-col{ display:flex; flex-direction:column; gap:8px; }
  .rrow{ display:grid; grid-template-columns:24px minmax(0,1fr) auto; gap:12px; align-items:center; background:var(--item); border:1px solid var(--item-line); border-radius:10px; padding:10px 12px; }
  .rrow .rk{ font-family:var(--scoreboard); font-weight:700; font-size:1.05rem; color:var(--text-dim); text-align:center; }
  .rrow .nm{ font-weight:600; font-size:0.88rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rrow .mt{ color:var(--text-dim); font-size:0.72rem; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rrow .vl{ font-family:var(--scoreboard); font-weight:700; font-size:1.1rem; font-variant-numeric:tabular-nums; text-align:right; }
  /* The record holder gets the site's gold "lead" outline rather than green
     or red: being #1 is the state worth marking, and the panel's title
     already says whether it's a good record or an embarrassing one. */
  .rrow.top{ border-color:var(--lead-line); background:var(--lead-tint); }
  .rrow.top .rk, .rrow.top .vl{ color:var(--gold); }
  :root[data-accent="outline"] .rrow.top{ background:var(--item); }
</style>
</head>
<body>
  <div id="site-nav"></div>
  <div class="wrap">
    <header>
      <div class="header-row">
        <div>
          <div class="eyebrow">Retirement League</div>
          <h1>Game Records</h1>
        </div>
        <div class="updated-block">
          <div class="updated-label">Updated</div>
          <div class="updated-value" id="updated-at">—</div>
        </div>
      </div>
    </header>

    <section>
      <!-- No section heading: the page title already says "Game Records" and
           the Year control on the right says which year, so a second line
           reading "2025 Records" only repeated both. -->
      <div class="controls-row">
        <div class="tabs" id="tabs"></div>
        <div class="selector-row">
          <label class="selector-label" for="year-select">Year</label>
          <select class="lg-select" id="year-select" autocomplete="off"></select>
        </div>
      </div>
      <div id="records"><div class="loading-row">Loading records…</div></div>
    </section>

    <footer>Data via ESPN Fantasy</footer>
  </div>

<script src="nav.js?v=2"></script>
<script src="page-common.js?v=2"></script>
<script src="league-common.js?v=3"></script>
<script>
  // esc() is a global from page-common.js, not part of LG.
  const { f2 } = LG;
  let D, tab = 0;
  const pickState = {};

  const when = g => `${g.year} · Week ${g.week}${g.type === 'Reg' ? '' : ' · ' + g.type}`;
  const by = (list, fn, desc) => list.slice().sort((a, b) => (desc ? fn(b) - fn(a) : fn(a) - fn(b)));

  function categories(sel) {
    const games = D.games.filter(g => g.type !== 'Bye' && g.p2 && g.s1 > 0 && g.s2 > 0 &&
      g.winner !== 'In Progress' && (sel === 'all' || g.year === Number(sel)));
    const decided = games.filter(g => g.winner === g.p1 || g.winner === g.p2);
    const scores = games.flatMap(g => [{ team: g.p1, s: g.s1, opp: g.p2, os: g.s2, g }, { team: g.p2, s: g.s2, opp: g.p1, os: g.s1, g }]);
    const margin = g => Math.abs(g.s1 - g.s2), total = g => g.s1 + g.s2;
    const wS = g => (g.winner === g.p1 ? g.s1 : g.s2), lS = g => (g.winner === g.p1 ? g.s2 : g.s1);
    const lt = g => (g.winner === g.p1 ? g.p2 : g.p1);
    const winFirst = g => ({ a: g.winner, as: wS(g), b: lt(g), bs: lS(g) });
    const loseFirst = g => ({ a: lt(g), as: lS(g), b: g.winner, bs: wS(g) });

    // ownScore: the record's value IS the named manager's own score, so their
    // name stands alone -- printing the score beside it would repeat it.
    const team = (title, desc) => ({
      title, ownScore: true,
      items: by(scores, x => x.s, desc).slice(0, 10).map(x => ({ v: x.s, m: { a: x.team, as: x.s, b: x.opp, bs: x.os }, meta: when(x.g) })),
    });
    const match = (title, list, fn, desc, side = winFirst, ownScore = false) => ({
      title, ownScore,
      items: by(list, fn, desc).slice(0, 10).map(g => ({ v: fn(g), m: side(g), meta: when(g) })),
    });
    // ----- Luck: how many of that week's other scores you beat, regular
    // season only (the only weeks where every team plays). A share rather
    // than a count, since the league has been 8, 10 and 12 teams.
    const weeks = new Map();
    scores.filter(x => x.g.type === 'Reg').forEach(x => {
      const k = `${x.g.year}:${x.g.week}`;
      if (!weeks.has(k)) weeks.set(k, []);
      weeks.get(k).push(x);
    });
    const allPlay = [...weeks.values()].flatMap(wk => wk.map(x => ({
      ...x, beat: wk.filter(y => y.s < x.s).length, others: wk.length - 1, won: x.g.winner === x.team,
    })));
    const share = x => x.beat / x.others;
    const luckItem = x => ({
      v: x.s, tk: `${x.beat}/${x.others}/${x.s}`,
      m: { a: x.team, as: x.s, b: x.opp, bs: x.os }, meta: `Beat ${x.beat} of ${x.others} · ${when(x.g)}`,
    });
    const unlucky = allPlay.filter(x => !x.won).sort((a, b) => share(b) - share(a) || b.s - a.s);
    const lucky = allPlay.filter(x => x.won).sort((a, b) => share(a) - share(b) || a.s - b.s);

    // ----- Title games -----
    const finals = games.filter(g => g.type === 'Champ');
    const finalScores = scores.filter(x => x.g.type === 'Champ');

    // ----- Against the weekly median (every game type carries one) -----
    const vsMedian = scores.filter(x => typeof x.g.median === 'number').map(x => ({ ...x, d: x.s - x.g.median }));
    const signed = d => (d >= 0 ? '+' : '−') + f2(Math.abs(d));
    const medianItem = x => ({ v: x.d, label: signed(x.d), m: { a: x.team, as: x.s, b: x.opp, bs: x.os }, meta: `Scored ${f2(x.s)} · ${when(x.g)}` });

    // ----- Weekly high and low scores, counted per manager (regular season) -----
    const tally = pick => {
      const n = new Map();
      [...weeks.values()].forEach(wk => { const x = pick(wk); n.set(x.team, (n.get(x.team) || 0) + 1); });
      return [...n].sort((a, b) => b[1] - a[1]).slice(0, 10)
        .map(([name, count]) => ({ v: count, label: String(count), m: { a: name }, meta: `of ${weeks.size} weeks` }));
    };
    const highest = wk => wk.reduce((a, b) => (b.s > a.s ? b : a));
    const lowest = wk => wk.reduce((a, b) => (b.s < a.s ? b : a));

    return {
      topS: team('Top Scores', true), lowS: team('Lowest Scores', false),
      hiM: match('Highest Victory Margins', decided, margin, true),
      loM: match('Lowest Victory Margins', decided, margin, false),
      hiC: match('Most Combined Points', games, total, true), loC: match('Least Combined Points', games, total, false),
      hiL: match('Highest Score in a Loss', decided, lS, true, loseFirst, true), loW: match('Lowest Score in a Win', decided, wS, false, winFirst, true),
      unl: { title: 'Unluckiest Losses', ownScore: true, items: unlucky.slice(0, 10).map(luckItem) },
      lck: { title: 'Luckiest Wins', ownScore: true, items: lucky.slice(0, 10).map(luckItem) },
      hiF: { title: 'Title Game Scores', ownScore: true, items: by(finalScores, x => x.s, true).slice(0, 10).map(x => ({ v: x.s, m: { a: x.team, as: x.s, b: x.opp, bs: x.os }, meta: when(x.g) })) },
      loF: match('Closest Title Games', finals, margin, false),
      upMed: { title: 'Furthest Above the Median', ownScore: true, items: by(vsMedian, x => x.d, true).slice(0, 10).map(medianItem) },
      dnMed: { title: 'Furthest Below the Median', ownScore: true, items: by(vsMedian, x => x.d, false).slice(0, 10).map(medianItem) },
      hiWk: { title: 'Most Weekly High Scores', ownScore: true, ties: true, items: tally(highest) },
      loWk: { title: 'Most Weekly Low Scores', ownScore: true, ties: true, items: tally(lowest) },
    };
  }

  const who = (c, i) => (c.ownScore ? esc(i.m.a) : `${esc(i.m.a)} ${f2(i.m.as)}`);
  const versus = i => (i.m.b ? `vs ${esc(i.m.b)} ${f2(i.m.bs)}` : '');
  const shown = i => i.label || f2(i.v);
  const detail = i => [versus(i), i.meta].filter(Boolean).join(' · ');

  // One table drives both the Records tab (each panel pairs a high-end and a
  // low-end record) and the tabs after it (the same pair, as ranked lists,
  // with the panel's own row labels on the switch).
  const LEDGER = [
    { tab: 'Scores', title: 'Scores', hi: ['topS', 'Highest'], lo: ['lowS', 'Lowest'] },
    { tab: 'Margins', title: 'Victory Margins', hi: ['hiM', 'Biggest'], lo: ['loM', 'Closest'] },
    { tab: 'Combined', title: 'Combined Points', hi: ['hiC', 'Most'], lo: ['loC', 'Least'] },
    { tab: 'Loss & Win', title: 'Loss & Win', hi: ['hiL', 'Highest in a loss'], lo: ['loW', 'Lowest in a win'] },
    { tab: 'Luck', title: 'Luck', hi: ['unl', 'Unluckiest loss'], lo: ['lck', 'Luckiest win'] },
    { tab: 'Title Games', title: 'Title Games', hi: ['hiF', 'Highest score'], lo: ['loF', 'Closest finish'] },
    { tab: 'Median', title: 'Against the Weekly Median', hi: ['upMed', 'Furthest above'], lo: ['dnMed', 'Furthest below'] },
    { tab: 'Weekly', title: 'Weekly High & Low Scores', hi: ['hiWk', 'Most weekly highs'], lo: ['loWk', 'Most weekly lows'] },
  ];
  const TABS = ['Records', ...LEDGER.map(p => p.tab)];

  // Rank by displayed value, so managers tied on a count share a rank (and
  // the record) instead of the sort order quietly picking one of them.
  function rankOf(items) {
    const key = i => i.tk || shown(i);
    const out = [];
    items.forEach((i, k) => out.push(k > 0 && key(i) === key(items[k - 1]) ? out[k - 1] : k + 1));
    return out;
  }

  function ledgerRow(c, kind, high) {
    const i = c.items[0];
    if (!i) return `<div class="lrow"><div class="lrow-kind">${kind}</div><div class="lrow-meta">No games yet</div><div class="lrow-val">—</div></div>`;
    // A count can be shared: name everyone tied at the top.
    const leaders = c.ties ? c.items.filter(x => shown(x) === shown(i)) : [i];
    const names = leaders.map(x => esc(x.m.a));
    const name = names.length < 3 ? names.join(' and ') : `${names.slice(0, -1).join(', ')}, and ${names[names.length - 1]}`;
    const line = c.ties ? name : `${who(c, i)} ${versus(i)}`;
    return `<div class="lrow"><div class="lrow-kind">${kind}${leaders.length > 1 ? ' · tied' : ''}</div>` +
      `<div style="min-width:0"><div class="lrow-name">${line}</div><div class="lrow-meta">${i.meta}</div></div>` +
      `<div class="lrow-val${high ? ' hi' : ''}">${shown(i)}</div></div>`;
  }

  // No tone on the buttons: a selected control is gold site-wide. The
  // high/low distinction is carried by the rows it reveals.
  const seg = (p, w) => `<div class="seg"><button class="${w === 'hi' ? 'on' : ''}" data-seg="hi">${p.hi[1]}</button><button class="${w === 'lo' ? 'on' : ''}" data-seg="lo">${p.lo[1]}</button></div>`;
  // A count's meta ("of 153 weeks") is the same on every row, so the list
  // drops it -- the Records tab's panel still says it once.
  const row = (c, i, rank) => `<div class="rrow${rank === 1 ? ' top' : ''}"><div class="rk">${rank}</div><div style="min-width:0"><div class="nm">${who(c, i)}</div>${c.ties ? '' : `<div class="mt">${detail(i)}</div>`}</div><div class="vl">${shown(i)}</div></div>`;

  function listCard(C, p, which) {
    const c = C[(which === 'lo' ? p.lo : p.hi)[0]];
    const r = rankOf(c.items);
    const rows = c.items.map((i, k) => row(c, i, r[k]));
    const body = rows.length
      ? `<div class="rank-cols"><div class="rank-col">${rows.slice(0, 5).join('')}</div><div class="rank-col">${rows.slice(5).join('')}</div></div>`
      : '<div class="empty-note">No games yet for this season.</div>';
    return `<div class="glass rank-panel"><div class="rank-head"><div class="rec-title">${c.title}</div>${seg(p, which)}</div>${body}</div>`;
  }

  function render() {
    const sel = document.getElementById('year-select').value;
    document.getElementById('tabs').innerHTML = TABS.map((t, i) => `<button class="tab ${i === tab ? 'on' : ''}" data-i="${i}">${t}</button>`).join('');
    const C = categories(sel);
    const el = document.getElementById('records');
    if (tab === 0) {
      el.innerHTML = `<div class="ledger">${LEDGER.map(p =>
        `<div class="glass ledger-panel"><div class="rec-title">${p.title}</div>${ledgerRow(C[p.hi[0]], p.hi[1], true)}${ledgerRow(C[p.lo[0]], p.lo[1], false)}</div>`).join('')}</div>`;
      return;
    }
    el.innerHTML = listCard(C, LEDGER[tab - 1], pickState[tab] || 'hi');
  }

  document.addEventListener('click', e => {
    const t = e.target.closest('.tab');
    if (t) { tab = Number(t.dataset.i); render(); return; }
    const s = e.target.closest('[data-seg]');
    if (s) { pickState[tab] = s.dataset.seg; render(); }
  });

  LG.load().then(data => {
    D = data;
    const sel = document.getElementById('year-select');
    sel.innerHTML = '<option value="all">All-Time</option>' + data.years.slice().reverse().map(y => `<option value="${y}">${y}</option>`).join('');
    sel.addEventListener('change', render);
    render();
  }).catch(err => LG.showError('records', err));
</script>
<script src="track.js?v=1" defer></script>
</body>
</html>
