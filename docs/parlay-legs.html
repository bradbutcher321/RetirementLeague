    const h = ed.hint[n];
    return `<div class="edit-form">${typed}
      <div class="fill-row"><label class="field"><span>Type it like the note (optional)</span>
        <input class="in" data-q="${esc(n)}" value="${esc(ed.q[n] || '')}" placeholder="Spread: Bills -5 vs. Raiders (-110)" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
        <button type="button" class="gold-btn quiet" data-act="fill" data-p="${esc(n)}">Fill</button></div>
      ${h ? `<div class="hint${h.bad ? ' bad' : ''}">${esc(h.t)}</div>` : ''}
      <div class="two">
        ${fld('Bet type', sel('bet_type', ['', ...BET_TYPES]))}
        ${fld('Sport', sel('sport', ['', ...ParlayNote.SPORTS]))}
        ${fields.map(f => f === 'side' ? fld('Side', sel('side', ['', 'Over', 'Under']))
          : fld(LABELS[f], inp(f, f === 'line' ? 'inputmode="numbers-and-punctuation"' : ''), f === 'player_prop' ? 'full' : '')).join('')}
        ${fld('Odds', inp('odds', 'inputmode="numbers-and-punctuation" placeholder="-110"'))}
        ${fld('Kickoff (Eastern)', inp('gametime', 'type="datetime-local" step="60"'), 'full')}
      </div></div>`;
  }

  function cmRow(n){
    const r = ed.cur.rows[n], has = !!r.bet_type, open = ed.open.has(n);
    const why = rowWhy(n);
    const bad = has && why.length > 0;
    let game = '';
    if (has) {
      if (ed.finding.has(n)) game = '<span class="leg-wait">Finding the game…</span>';
      else if (r.gametime) game = `<span><span class="sport">${esc(r.sport || '—')}</span> · ${esc(kick(r.gametime + ':00'))}</span>`;
      else game = '<span style="color:var(--loss);font-weight:600">No game time</span>';
      if (ed.orig.rows[n].bet_type === 'Other' && r.bet_type === 'Other') game = '<span class="badge gold">Typed in</span>' + (r.gametime ? game : '');
    }
    const results = has && !(onBoardWeek() && board.open)
      ? `<div class="seg" data-res="${esc(n)}">${RESULTS.map(x => `<button type="button" data-v="${x}" class="${(r.result || 'Pending') === x ? 'on' : ''}">${x}</button>`).join('')}</div>` : '<span></span>';
    const btns = (canPick() ? act('pick', n, has ? 'Re-pick' : 'Pick') : '') + act('edit', n, open ? 'Done' : has ? 'Edit pick' : 'Edit');
    const l = { ...r, odds: parseOdds(r.odds) };
    return `<div class="pl-leg${has ? '' : ' out'}${isChanged(n) ? ' changed' : ''}${bad ? ' bad' : ''}${n === me() ? ' me' : ''}">
      <div class="pl-leg-top"><span class="pl-leg-name">${esc(n)}</span><span class="pl-leg-odds">${has ? fmtRowOdds(r) : 'Not in yet'}</span></div>
      ${has ? `<div class="pl-leg-bet">${betHtml(l)}</div>` : ''}
      ${game ? `<div class="pl-leg-game">${game}</div>` : ''}
      ${has ? why.map(w => `<div class="leg-why">${esc(w)}</div>`).join('') : ''}
      <div class="res-row">${results}<span class="btns">${btns}</span></div>
      ${open ? editForm(n) : ''}</div>`;
  }

  function stepperHtml(){
    const list = weekList(), i = list.findIndex(w => w.year === ed.year && w.week === ed.week);
    const prev = list[i + 1], next = list[i - 1];
    return `<span class="stepper">
      <button type="button" class="pick" data-step="${i + 1}"${prev ? '' : ' disabled'} aria-label="Previous week">‹ ${prev ? prev.week : ''}</button>
      <select class="in" id="wk-select" aria-label="Week">${list.map((w, k) => `<option value="${k}"${k === i ? ' selected' : ''}>${w.year} · Week ${w.week}</option>`).join('')}</select>
      <button type="button" class="pick" data-step="${i - 1}"${next ? '' : ' disabled'} aria-label="Next week">${next ? next.week : ''} ›</button></span>`;
  }

  function weekCardHtml(){
    const c = ed.cur;
    const body = !c ? `<p class="empty${/Couldn/.test(ed.status) ? ' bad' : ''}">${esc(ed.status || 'Loading…')}</p>`
      : `<div class="meta-grid">
        <label class="field"><span>Sacko</span><select class="in" data-w="sacko">${['', ...roster()].map(p => `<option value="${esc(p)}"${p === c.sacko ? ' selected' : ''}>${esc(p || '—')}</option>`).join('')}</select></label>
        <label class="field"><span>Final odds</span><input class="in" data-w="final_odds" value="${esc(c.final_odds)}" inputmode="numbers-and-punctuation" autocomplete="off" placeholder="+478887"></label>
        <label class="field"><span>Final payout</span><input class="in" data-w="final_payout" value="${esc(c.final_payout)}" inputmode="decimal" autocomplete="off" placeholder="95797.48"></label>
      </div>${onBoardWeek() && board.open ? `<div class="acts"><button type="button" class="gold-btn" id="m-lock"${cmSaving ? ' disabled' : ''}>${cmSaving === 'lock' ? 'Pulling Hard Rock odds…' : board.locked ? 'Unlock legs' : 'Lock legs'}</button></div>` : ''}
      ${lockMsg ? `<p class="fine">${esc(lockMsg)}</p>` : ''}${onBoardWeek() ? pricedHtml() : ''}`;
    return [`<span>Week numbers</span>${stepperHtml()}`, body];
  }

  // What Lock legs found on Hard Rock: the legs it repriced, and the ones it
  // left as entered, to check against the bet slip by hand.
  function pricedHtml(){
    const p = board.locked && board.priced;
    if (!p || !p.legs || !p.legs.length) return '';
    const found = p.legs.filter(x => x.how === 'updated' || x.how === 'same');
    const changed = p.legs.filter(x => x.how === 'updated'), check = p.legs.filter(x => x.how === 'moved' || x.how === 'kept');
    const row = (x, odds) => `<div class="pr-row"><span>${esc(x.player)}<small>${esc(x.why || x.pick)}</small></span><span class="pr-odds">${odds}</span></div>`;
    return `<div class="priced"><p class="fine" style="margin-top:0">Hard Rock odds pulled ${esc(etWhen(p.at))}: <b>${found.length} of ${p.legs.length}</b> legs found, ${changed.length ? `${changed.length} changed` : 'none changed'}.</p>
      ${changed.length ? `<h4>Changed</h4>${changed.map(x => row(x, `<s>${fmtOdds(x.was)}</s><b>${fmtOdds(x.odds)}</b>`)).join('')}` : ''}
      ${check.length ? `<h4>Check by hand</h4>${check.map(x => row(x, fmtOdds(x.was) || '—')).join('')}` : ''}</div>`;
  }

  function pasteHtml(){
    if (!pasteOpen) return '<button type="button" class="gold-btn quiet" data-act="paste-open" style="width:100%">Paste a whole week from the note</button>';
    const m = pasteMsg;
    const info = !m ? '' : m.bad ? `<p class="msg bad">${esc(m.bad)}</p>` : `<div class="chips" style="margin:14px 0 0">
        <span class="chip">${m.year} · Week ${m.week}</span><span class="chip gold">${m.got} leg${m.got === 1 ? '' : 's'} filled</span>
        ${m.missing ? `<span class="chip loss">${m.missing} not in the note</span>` : ''}</div>
      ${m.skipped.length ? `<div class="skipped">Lines that aren't a pick, so they were skipped:${m.skipped.map(x => `<div>${esc(x)}</div>`).join('')}</div>` : ''}
      <p class="fine">Check the rows, then Save to the sheet. Saving replaces the week; a pick that didn't change keeps its result.</p>`;
    return `<section class="glass"><div class="panel-title">Paste a whole week</div><div class="panel-body">
      <textarea class="note-box" id="note-box" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="The week's parlay note"
        placeholder="2026 Week 7:&#10;Sacko: …&#10;&#10;Brad: Spread: Lions -5.5 vs. Cardinals (-110)&#10;…&#10;&#10;Final Odds: +478887&#10;Final Payout: $95,797.48">${esc(noteText)}</textarea>
      <div class="acts"><button type="button" class="gold-btn" data-act="note-paste">Paste</button><button type="button" class="gold-btn solid" data-act="note-fill">Fill the week</button><button type="button" class="gold-btn quiet" data-act="note-clear">Clear</button></div>
      ${info}</div></section>`;
  }

  const weekCardEl = document.getElementById('week-body'), weekTitleEl = document.getElementById('week-title');
  const boardEl = document.getElementById('board'), pasteEl = document.getElementById('paste-sec'), barEl = document.getElementById('savebar');
  const inField = el => el.contains(document.activeElement) && document.activeElement.matches('input, select, textarea');
  let cmHeld = false;
  function renderCm(){
    if (!isCm()) return;
    barHtml();
    // No redraw out from under a field you're typing in; it waits for you to leave.
    cmHeld = [weekCardEl, boardEl, pasteEl].some(inField);
    if (cmHeld) return;
    const [title, body] = weekCardHtml();
    weekTitleEl.innerHTML = title;
    weekCardEl.innerHTML = body;
    const n = changeCount();
    document.getElementById('board-title').innerHTML = `<span>Week ${ed.week || board.week}</span>${ed.cur ? `<span class="chip${n ? ' gold' : ''}">${n ? `${n} change${n === 1 ? '' : 's'}` : 'No changes'}</span>` : ''}`;
    if (!ed.cur) boardEl.innerHTML = `<p class="empty${/Couldn/.test(ed.status) ? ' bad' : ''}">${esc(ed.status || 'Loading…')}</p>`;
    else {
      const o = ed.orig.rows;
      const order = roster().slice().sort((a, b) => (!!o[b].bet_type - !!o[a].bet_type) || (o[a].gametime || '9').localeCompare(o[b].gametime || '9') || a.localeCompare(b));
      boardEl.innerHTML = order.map(cmRow).join('') + (ed.steps ? `<div class="steps">${ed.steps.map(([s, t]) => `<p class="msg${s === 'fail' ? ' bad' : s === 'done' ? ' ok' : ''}">${t}</p>`).join('')}</div>` : '');
    }
    pasteEl.innerHTML = pasteHtml();
  }
  function barHtml(){
    const n = changeCount();
    barEl.hidden = !ed.cur || !(n || cmSaving);
    if (barEl.hidden) return;
    const mode = weekSaved(ed.year, ed.week) ? 'edit' : 'new';
    const label = cmSaving ? 'Saving…' : ed.finding.size ? 'Finding games…' : mode === 'new' ? `Save Week ${ed.week}` : 'Save to the sheet';
    barEl.innerHTML = `<span>${n} change${n === 1 ? '' : 's'}<small>Nothing is saved until you tap.</small></span>
      <button type="button" class="gold-btn solid" data-act="save"${cmSaving || ed.finding.size || !stats ? ' disabled' : ''}>${label}</button>`;
  }
  for (const el of [weekCardEl, boardEl, pasteEl]) el.addEventListener('focusout', () => setTimeout(() => { if (cmHeld) renderCm(); }, 0));
  addEventListener('beforeunload', e => { if (isCm() && ed.cur && changeCount() && !cmSaving) e.preventDefault(); });

  // ---------- Week and numbers ----------
  async function goToWeek(year, week){
    if (ed.cur && changeCount() && !confirm(`Drop your unsaved changes to ${ed.year} Week ${ed.week}?`)) { renderCm(); return false; }
    await loadWeek(year, week);
    return true;
  }
  document.getElementById('week-card').addEventListener('click', async e => {
    const step = e.target.closest('[data-step]');
    if (step && !step.disabled) { const w = weekList()[Number(step.dataset.step)]; if (w) goToWeek(w.year, w.week); return; }
    if (!e.target.closest('#m-lock') || cmSaving) return;
    cmSaving = board.locked ? true : 'lock'; lockMsg = ''; renderCm();
    let res = null, out = {};
    try {
      res = await fetch(WORKER_URL + '/legs/lock', { method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders() }, body: JSON.stringify({ locked: !board.locked }) });
      out = await res.json().catch(() => ({}));
    } catch { /* no connection */ }
    cmSaving = false;
    if (out.legs) board = { ...board, ...out };
    lockMsg = res && res.ok ? (board.locked ? 'Legs locked. Only commissioners can change them now.' : 'Legs unlocked.')
      : `Couldn't change the lock (${res ? out.error || res.status : 'no connection'}).`;
    render();
    // Repriced legs land in the rows you haven't touched.
    if (out.legs) refreshFromBoard();
  });
  document.getElementById('week-card').addEventListener('change', e => {
    if (e.target.id === 'wk-select') {
      const w = weekList()[Number(e.target.value)];
      if (w && !(w.year === ed.year && w.week === ed.week)) goToWeek(w.year, w.week); else renderCm();
      return;
    }
    const k = e.target.dataset.w;
    if (!k || !ed.cur) return;
    ed.cur[k] = e.target.value;
    if (e.target.matches('select')) e.target.blur();
    renderCm();
  });
  document.getElementById('week-card').addEventListener('input', e => {
    const k = e.target.dataset.w;
    if (k && ed.cur) { ed.cur[k] = e.target.value; barHtml(); }
  });

  // ---------- The rows ----------
  boardEl.addEventListener('click', e => {
    const seg = e.target.closest('[data-res] button');
    if (seg && ed.cur) { ed.cur.rows[seg.parentElement.dataset.res].result = seg.dataset.v; renderCm(); return; }
    const b = e.target.closest('[data-act]');
    if (!b || !ed.cur) return;
    const n = b.dataset.p;
    if (b.dataset.act === 'edit') { if (ed.open.has(n)) ed.open.delete(n); else ed.open.add(n); renderCm(); }
    else if (b.dataset.act === 'pick' && !saving) enterFor(n);
    else if (b.dataset.act === 'fill') fillFromText(n);
  });
  boardEl.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.q != null && 'q' in t.dataset) ed.q[t.dataset.q] = t.value;
    else if (t.dataset.f && ed.cur) { ed.cur.rows[t.dataset.p][t.dataset.f] = t.value; delete ed.parseWhy[t.dataset.p]; barHtml(); }
  });
  boardEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && 'q' in e.target.dataset) { e.preventDefault(); const n = e.target.dataset.q; e.target.blur(); fillFromText(n); }
  });
  boardEl.addEventListener('change', e => {
    const t = e.target, n = t.dataset.p;
    if (!ed.cur || !t.dataset.f) return;
    const r = ed.cur.rows[n];
    if (t.dataset.f === 'bet_type') {
      // Clear the boxes the new bet type doesn't use.
      const keep = FIELDS_FOR[t.value] || ALL_FIELDS;
      ALL_FIELDS.forEach(f => { if (!keep.includes(f)) r[f] = ''; });
      if (!t.value) { Object.assign(r, { ...blankRow(), raw_pick: r.raw_pick }); delete ed.gameWhy[n]; }
    }
    r[t.dataset.f] = t.value;
    delete ed.parseWhy[n];
    if (['bet_type', 'team', 'opponent', 'player_prop'].includes(t.dataset.f)) lookRow(n);
    if (t.matches('select')) t.blur();   // a pick from a list is finished; redraw now
    renderCm();
  });

  // ---------- Paste a whole week ----------
  const WEEK_LINE = /^\s*\d{4}\s+week\s+\d+:?\s*$/i;
  // The league's note keeps every week, newest on top. Only the top week is
  // wanted: from the first "2026 Week 7:" line to the next one.
  function topWeek(text){
    const lines = String(text).replace(/\u00a0/g, ' ').split(/\r\n|\r|\n|\u2028|\u2029/);
    const heads = lines.map((l, i) => WEEK_LINE.test(l) ? i : -1).filter(i => i >= 0);
    if (!heads.length) return lines.join('\n').trim();
    const before = lines.slice(0, heads[0]);
    if (before.some(l => /^[^:]+:\s*[^:]+:\s*\S/.test(l))) return before.join('\n').trim();
    return lines.slice(heads[0], heads[1] ?? lines.length).join('\n').trim();
  }
  async function applyNote(){
    noteText = topWeek(noteText);
    store.set(NOTE_KEY, noteText);
    const { picks, final, unmatched } = ParlayNote.parse(noteText, roster());
    const got = Object.keys(picks).length;
    pasteOpen = true;
    if (!got && !final.year) { pasteMsg = { bad: 'Nothing in that looks like a week of picks.' }; renderCm(); return; }
    // The note names its week; otherwise it is the week the board is on.
    const wk = final.year && final.week ? { year: Number(final.year), week: Number(final.week) } : { year: board.year, week: board.week };
    if (wk.year !== ed.year || wk.week !== ed.week) { if (!(await goToWeek(wk.year, wk.week))) return; }
    if (!ed.cur) return;
    for (const n of roster()) {
      const p = picks[n], was = ed.orig.rows[n];
      delete ed.parseWhy[n]; delete ed.gameWhy[n]; delete ed.hint[n];
      if (!p) { ed.cur.rows[n] = blankRow(); delete ed.keys[n]; continue; }
      if (was.bet_type && was.raw_pick && was.raw_pick === p.raw_line) { ed.cur.rows[n] = clone(was); continue; }   // unchanged
      ed.cur.rows[n] = { ...blankRow(), bet_type: p.bet_type, team: p.team, opponent: p.opponent, player_prop: p.player_prop,
        line: p.line, side: p.side, odds: oddsText(p.odds), raw_pick: p.raw_line };
      delete ed.keys[n];
      if (!p.ok) ed.parseWhy[n] = p.why;
      lookRow(n, true);
    }
    if (final.sacko && roster().includes(final.sacko)) ed.cur.sacko = final.sacko;
    if (final.odds != null) ed.cur.final_odds = oddsText(final.odds);
    if (final.payout != null) ed.cur.final_payout = String(final.payout);
    pasteMsg = { year: ed.year, week: ed.week, got, missing: roster().filter(n => !picks[n]).length, skipped: unmatched };
    renderCm();
  }
  pasteEl.addEventListener('input', e => { if (e.target.id === 'note-box') { noteText = e.target.value; store.set(NOTE_KEY, noteText); } });
  pasteEl.addEventListener('paste', e => { if (e.target.id === 'note-box') setTimeout(() => { noteText = e.target.value; applyNote(); }, 0); });
  pasteEl.addEventListener('click', async e => {
    const a = e.target.closest('[data-act]');
    if (!a) return;
    const k = a.dataset.act;
    if (k === 'paste-open') { pasteOpen = true; renderCm(); const box = document.getElementById('note-box'); if (box) box.focus(); }
    else if (k === 'note-fill') { const box = document.getElementById('note-box'); if (box) noteText = box.value; await applyNote(); }
    else if (k === 'note-clear') { noteText = ''; store.set(NOTE_KEY, ''); pasteMsg = null; renderCm(); const box = document.getElementById('note-box'); if (box) box.focus(); }
    else if (k === 'note-paste') {
      try { noteText = await navigator.clipboard.readText(); await applyNote(); }
      catch { const box = document.getElementById('note-box'); if (box) box.focus(); }   // no clipboard access: paste by hand
    }
  });

  // ---------- Save ----------
  // A row's Raw Pick, when it has none yet, reads the way the note writes it.
  const rawFor = r => r.raw_pick || (r.bet_type ? `${pickText({ ...r, odds: parseOdds(r.odds) })} (${fmtRowOdds(r)})` : '');
  function editPayload(){
    const rows = {};
    for (const n of roster()) {
      const r = ed.cur.rows[n];
      rows[n] = { ...r, odds: parseOdds(r.odds), gametime: r.gametime ? `${r.gametime}:00` : '', raw_pick: rawFor(r),
        result: r.bet_type ? (r.result || 'Pending') : '' };
    }
    const payout = parseFloat(String(ed.cur.final_payout).replace(/[$,\s]/g, ''));
    return { sacko: ed.cur.sacko, final_odds: parseOdds(ed.cur.final_odds), final_payout: Number.isNaN(payout) ? null : payout, rows };
  }
  const SAVE_ERRORS = {
    wrong_pin: () => 'Your sign-in has run out. Tap You and sign in again.',
    not_configured: () => 'Your sign-in has run out. Tap You and sign in again.',
    cooldown: b => `Just saved. Try again in ${b.retryAfterSeconds}s.`,
  };
  const steps = list => { ed.steps = list; renderCm(); };

  async function saveWeek(){
    if (cmSaving || !ed.cur || !changeCount() || ed.finding.size || !stats) return;
    const year = ed.year, week = ed.week, mode = weekSaved(year, week) ? 'edit' : 'new';
    const sent = clone(ed.cur);
    const body = { picks: { year, week, mode, loaded_at: ed.asOf, dry_run: dryQ !== '', ...editPayload() } };
    cmSaving = true;
    steps([['', 'Sending…']]);
    const sentAt = Date.now();
    let res = null, out = {};
    try {
      res = await fetch(WORKER_URL + '/parlay-entry', { method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders() }, body: JSON.stringify(body) });
      out = await res.json().catch(() => ({}));
    } catch { /* no connection */ }
    if (!res || !res.ok) {
      cmSaving = false;
      steps([['fail', esc(res && SAVE_ERRORS[out.error] ? SAVE_ERRORS[out.error](out) : `Couldn't send it (${res ? out.error || res.status : 'no connection'}). Try again.`)]]);
      return;
    }
    const label = `${year} Week ${week}`;
    if (body.picks.dry_run) { cmSaving = false; steps([['done', `Sent ${label} as a dry run. Nothing will be written; check the Enter Parlay Picks Action log.`]]); return; }
    steps([['done', `Sent ${label}`], ['', 'Writing it to the sheet, grading and publishing. Usually a minute or two.']]);
    loadBoard();   // the Worker already moved the board's copy
    // Done once Parlay Results' data is newer than the save and has the week.
    const deadline = sentAt + 6 * 60 * 1000;
    const poll = async () => {
      try {
        const data = await fetch(WORKER_URL + '/parlay-stats', { cache: 'no-store' }).then(r => r.json());
        // Newer than the save, and holding these picks: a scheduled refresh
        // can publish the old copy of a week being replaced in between.
        const w = Date.parse(data.generated_at) > sentAt && data.weeks.find(x => x.year === year && x.week === week);
        const same = ([n, r]) => !r.bet_type || (w.picks[n] && (w.picks[n].odds ?? null) === (r.odds ?? null) && (mode === 'new' || w.picks[n].result === r.result));
        if (w && Object.entries(body.picks.rows).every(same)) {
          stats = data;
          cmSaving = false;
          if (ed.year === year && ed.week === week && ed.orig) ed.orig = sent;   // later edits stay changes
          if (pasteMsg) { noteText = ''; store.set(NOTE_KEY, ''); pasteMsg = null; pasteOpen = false; }
          steps([['done', `Saved and published. <a href="parlay-results.html" style="color:var(--gold);font-weight:600">See it on Parlay Results</a>`]]);
          return;
        }
      } catch { /* try again next tick */ }
      if (Date.now() < deadline) setTimeout(poll, 10000);
      else {
        cmSaving = false;
        steps([['done', `Sent ${label}`], ['fail', `It hasn't shown up after six minutes. Check the <a href="https://github.com/bradbutcher321/RetirementLeague/actions/workflows/enter_parlay.yml" target="_blank" rel="noopener" style="color:var(--gold);font-weight:600">Enter Parlay Picks</a> Action.`]]);
      }
    };
    setTimeout(poll, 30000);
  }
  barEl.addEventListener('click', e => { if (e.target.closest('[data-act="save"]')) saveWeek(); });

  function enterFor(p){
    target = p === me() ? null : p;
    // A Re-pick on someone who has a leg goes straight to the board.
    editing = target !== null && !!mine(); saveMsg = ''; st = { ...blank(), sport: st.sport };
    render();
    document.getElementById('mine-title').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  document.getElementById('mine-title').addEventListener('click', e => { if (e.target.closest('#back-mine') && !saving) enterFor(me()); });

  // ---------- Start ----------
  // From the iPhone Shortcut (the old Enter Picks link): parlay-legs.html#note=<the note, URL-encoded>.
  // It waits in the paste box, and a signed-in commissioner gets it filled into the week.
  if (location.hash.startsWith('#note=')) {
    try {
      noteText = topWeek(decodeURIComponent(location.hash.slice(6)));
      store.set(NOTE_KEY, noteText);
      pasteOpen = noteFromLink = true;
    } catch { /* a mangled link: keep what was there */ }
    history.replaceState(null, '', location.pathname + location.search);
  }
  addEventListener('rl-auth', loadBoard);
  // Everyone else's legs land while you look: every 45 seconds, and on return.
  setInterval(() => { if (document.visibilityState === 'visible' && !saving) loadBoard(); }, 45000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') loadBoard(); });
  loadBoard();
</script>
<script src="track.js?v=2" defer></script>
</body>
</html>
