<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retirement League — Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=3">
<link rel="stylesheet" href="nav.css?v=3">
<link rel="stylesheet" href="league.css?v=3">
</head>
<body>
  <div id="site-nav"></div>
  <div class="wrap">
    <header>
      <div class="header-row">
        <div>
          <div class="eyebrow">Retirement League</div>
          <h1>Overview</h1>
        </div>
        <div class="updated-block">
          <div class="updated-label">Updated</div>
          <div class="updated-value" id="updated-at">—</div>
        </div>
      </div>
    </header>

    <div id="overview"><div class="loading-row">Loading league history…</div></div>

    <footer>Data from the league sheet</footer>
  </div>

<script src="nav.js"></script>
<script src="league-common.js?v=2"></script>
<script>
  const { esc, f1, f2, money, card, ranked, rowHtml } = LG;

  const section = (title, cards) =>
    `<section><h2>${title}</h2><div class="card-grid stretch">${cards.join('')}</div></section>`;

  // Latest year per team for "last won" style sub-lines.
  function countCard(title, seasons, key, lastLabel) {
    const by = {};
    seasons.filter(s => s[key] > 0).forEach(s => {
      const e = by[s.player] || (by[s.player] = { n: 0, last: 0 });
      e.n += 1; e.last = Math.max(e.last, s.year);
    });
    const items = Object.entries(by)
      .sort((a, b) => b[1].n - a[1].n || b[1].last - a[1].last)
      .map(([name, e]) => ({ name, val: e.n, sub: `${lastLabel} ${e.last}` }));
    return card(title, ranked(items));
  }

  function build(D, F) {
    const complete = new Set(D.completeYears);
    const seasons = D.seasons;
    const done = seasons.filter(s => complete.has(s.year));
    const draftPos = (p, y) => (D.draft_order[p] || {})[y];
    const totalWins = s => s.tot_w + s.med_w;
    const regWins = s => s.reg_w + s.med_w;
    const noBye = D.games.filter(g => g.type !== 'Bye' && g.p2);
    const out = [];

    // ----- Champions & Sackos -----
    const champs = done.filter(s => s.champ > 0).sort((a, b) => a.year - b.year);
    const sackos = done.filter(s => s.sacko > 0).sort((a, b) => a.year - b.year);
    const yearRows = (list, winsFn) => list.map(s => ({
      name: s.player, wide: true, rank: s.year,
      sub: `Draft position ${draftPos(s.player, s.year) ?? '—'}`,
      val: winsFn(s), tone: '',
    }));
    out.push(section('Champions & Sackos', [
      card('Champions', ranked(yearRows(champs, totalWins).reverse(), { podium: false })),
      card('Sackos', ranked(yearRows(sackos, regWins).reverse(), { podium: false })),
      countCard('Championship Count', done, 'champ', 'Last won'),
      countCard('Sacko Count', done, 'sacko', 'Last received'),
    ]));

    const finalGame = (year, type) => noBye.find(g => g.year === year && g.type === type && g.winner !== 'In Progress');
    const gameRow = (year, type, winnerFirst) => {
      const g = finalGame(year, type);
      if (!g) return null;
      const hi = g.s1 >= g.s2 ? [g.p1, g.s1, g.p2, g.s2] : [g.p2, g.s2, g.p1, g.s1];
      const first = winnerFirst ? hi : [hi[2], hi[3], hi[0], hi[1]];
      return { name: `${first[0]} ${f2(first[1])} vs ${first[2]} ${f2(first[3])}`, wide: true, rank: year, wrap: true, val: f2(Math.abs(g.s1 - g.s2)), sub: 'Margin of victory' };
    };
    const gameCard = (title, type, winnerFirst) =>
      card(title, ranked(D.completeYears.slice().reverse().map(y => gameRow(y, type, winnerFirst)).filter(Boolean), { podium: false }));
    out.push(section('Title Games', [
      gameCard('Championship Games', 'Champ', true),
      gameCard('Sacko Games', 'Sacko', false),
    ]));

    // ----- Scoring records -----
    const seasonPts = (pick) => card(pick.title, ranked(D.completeYears.slice().reverse().map(y => {
      const rows = done.filter(s => s.year === y);
      const best = rows.reduce((a, b) => (pick.max ? b.tot_pf > a.tot_pf : b.tot_pf < a.tot_pf) ? b : a);
      return { name: best.player, wide: true, rank: y, sub: `${totalWins(best)} wins`, val: f2(best.tot_pf), tone: pick.max ? 'gold' : '' };
    }), { podium: false }));
    out.push(section('Scoring Records', [
      seasonPts({ title: 'Most Full Season Points', max: true }),
      seasonPts({ title: 'Least Full Season Points', max: false }),
    ]));

    const weekly = (max) => card(max ? 'Highest Weekly Score' : 'Lowest Weekly Score', ranked(D.years.slice().reverse().map(y => {
      let best = null;
      noBye.filter(g => g.year === y && g.winner !== 'In Progress').forEach(g => {
        [[g.p1, g.s1], [g.p2, g.s2]].forEach(([p, s]) => {
          if (s === null || s <= 0) return;
          if (!best || (max ? s > best.s : s < best.s)) best = { p, s, t: g.type, w: g.week };
        });
      });
      return best && { name: best.p, wide: true, rank: y, sub: `Week ${best.w} · ${best.t}`, val: f2(best.s), tone: max ? 'gold' : '' };
    }).filter(Boolean), { podium: false }));
    const avgMedian = card('Yearly Average Median', ranked(D.years.slice().reverse().map(y => {
      const m = D.games.filter(g => g.year === y && g.type === 'Reg' && g.median !== null).map(g => g.median);
      return m.length && { name: 'Average median', wide: true, rank: y, val: f2(m.reduce((a, b) => a + b, 0) / m.length) };
    }).filter(Boolean), { podium: false }), 'The score that beats half the league in a typical week');
    out.push(section('Weekly Scores', [weekly(true), weekly(false)]));

    // ----- Records & rankings -----
    const seasonWins = (high) => {
      const list = done.slice().sort((a, b) => (high ? b.reg_w - a.reg_w : a.reg_w - b.reg_w) || a.year - b.year).slice(0, 12);
      return card(high ? 'Highest Win Seasons' : 'Lowest Win Seasons',
        ranked(list.map(s => ({ name: s.player, wide: true, rank: s.year, val: `${s.reg_w}-${s.reg_l}`, tone: high ? 'up' : 'down' })), { podium: false }),
        'Regular season record, before the weekly median');
    };
    const activeDone = (p) => done.filter(s => s.player === p);
    const players = [...D.active];
    const rate = ranked(players.map(p => {
      const ss = activeDone(p);
      return { name: p, n: ss.length, r: ss.length ? ss.filter(s => s.playoff > 0).length / ss.length : 0, made: ss.filter(s => s.playoff > 0).length };
    }).sort((a, b) => b.r - a.r).map(x => ({ name: x.name, val: Math.round(x.r * 100) + '%', sub: `${x.made} of ${x.n} seasons` })));
    const place = ranked(players.map(p => {
      const ss = activeDone(p).filter(s => s.final_rank);
      return { name: p, avg: ss.length ? ss.reduce((a, s) => a + s.final_rank, 0) / ss.length : 99, n: ss.length };
    }).sort((a, b) => a.avg - b.avg).map(x => ({ name: x.name, val: x.avg.toFixed(1), sub: `${x.n} seasons` })));
    const earn = Object.entries(D.earnings).filter(([, v]) => v !== null && v !== undefined).sort((a, b) => b[1] - a[1])
      .map(([name, v]) => ({ name, val: money(v), tone: v > 0 ? 'up' : v < 0 ? 'down' : '' }));
    out.push(section('Records & Rankings', [
      seasonWins(true), seasonWins(false),
      card('Playoff Appearance Rate', rate, 'Current teams, completed seasons'),
      card('Average Finish', place, 'Average final placement (lower is better)'),
      card('Estimated Earnings', ranked(earn), 'Net after dues and parlays'), avgMedian,
    ]));

    // ----- Streaks -----
    if (F) {
      const cur = n => (n > 0 ? `<span style="color:var(--turf)">W${n}</span>` : n < 0 ? `<span style="color:var(--loss)">L${-n}</span>` : '—');
      const streakCard = (title, key, note) => {
        const list = F.players.filter(p => p.streaks && p.streaks[key])
          .sort((a, b) => b.streaks[key].current - a.streaks[key].current || b.streaks[key].longest_win - a.streaks[key].longest_win);
        return card(title, list.map(p => {
          const s = p.streaks[key];
          return rowHtml({ name: p.name, stats: [[s.longest_win, 'Best W'], [s.longest_loss, 'Best L'], [cur(s.current), 'Now']] }, null);
        }).join(''), note);
      };
      out.push(section('Streaks', [
        streakCard('Longest Streaks', 'head_to_head', 'Head-to-head games only'),
        streakCard('Longest Streaks with Median', 'combined', 'Includes the weekly median game (2025 onward)'),
      ]));
    }
    return out.join('');
  }

  Promise.all([LG.load(), fetch('data/franchise.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null)])
    .then(([D, F]) => { document.getElementById('overview').innerHTML = build(D, F); })
    .catch(err => LG.showError('overview', err));
</script>
</body>
</html>
