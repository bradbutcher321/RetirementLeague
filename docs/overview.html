<!-- The two font-family's woff2 files Google serves for the latin subset
     at the weights this site uses -- one variable-font file per family
     covers every weight declared, confirmed directly by fetching the
     stylesheet below and comparing each @font-face block's url(). Starts
     the actual font downloads immediately, in parallel with that
     stylesheet fetch, instead of waiting to discover these same URLs
     only after the stylesheet loads and is parsed -- avoids the
     fallback-to-webfont swap (FOUT) that otherwise shows on a slow or
     uncached load. If Google ever changes these hashed URLs, this just
     degrades to a wasted (unused) preload, not a correctness issue -- the
     stylesheet's own @font-face still fetches whatever the new URL is. -->
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/bigshouldersdisplay/v24/fC1_PZJEZG-e9gHhdI4-NBbfd2ys3SjJCx1czNDu.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* ---------- League History ----------
     Same building blocks as Franchise and Game Records: one panel per
     section (white title top-left, chip top-right), record rows with a
     record-type tile and a gold value, and lists as divided rows inside one box.
     A row only gets an outline + tint when it means something (the leader,
     a Sacko). Colours come from theme.css's tokens, never one-off rgba. */
  #overview{ display:grid; grid-template-columns:minmax(0,1fr); gap:12px; }
  .panel{ background:linear-gradient(165deg, var(--surface-2), var(--surface)); border:1px solid var(--line); border-radius:14px; min-width:0; }
  .p-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:14px 16px 0; }
  .p-title{ font-weight:700; font-size:0.95rem; }
  .p-body{ padding:12px; }
  .chip{ font-size:0.68rem; font-weight:700; padding:3px 9px; border-radius:999px; border:1px solid var(--line); color:var(--text-dim); white-space:nowrap; }

  /* ---------- Summary ---------- */
  .reign{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .reign-c{ border:1px solid; border-radius:10px; padding:14px 10px 12px; text-align:center; min-width:0; }
  .reign-c.champ{ border-color:var(--lead-line); background:var(--lead-tint); }
  .reign-c.sacko{ border-color:var(--loss-line); background:var(--loss-tint); }
  .reign-l{ font-size:0.62rem; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; }
  .reign-c.champ .reign-l{ color:var(--gold); } .reign-c.sacko .reign-l{ color:var(--loss); }
  .reign-n{ font-family:var(--scoreboard); font-weight:800; font-size:clamp(1.7rem, 8vw, 2.3rem); line-height:1.05; margin-top:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .reign-s{ color:var(--text-dim); font-size:0.74rem; margin-top:3px; }

  .tiles{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; }
  @media (min-width:721px){ .tiles{ grid-template-columns:repeat(4, minmax(0,1fr)); } }
  .tile{ background:var(--item); border:1px solid var(--item-line); border-radius:10px; padding:10px 6px 9px; text-align:center; min-width:0; }
  .tile-l{ color:var(--text-dim); font-size:0.6rem; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; white-space:nowrap; }
  .tile-v{ font-family:var(--scoreboard); font-weight:800; font-size:1.5rem; line-height:1.15; margin-top:3px; }
  .tile-s{ color:var(--text-dim); font-size:0.66rem; margin-top:1px; }

  /* Record rows: Game Records' shape -- type tile, caption, holder, value. */
  .recs{ display:grid; grid-template-columns:1fr; }
  @media (min-width:721px){ .recs{ grid-template-columns:1fr 1fr; column-gap:24px; } }
  .rec-row{ display:grid; grid-template-columns:36px minmax(0,1fr) auto; gap:12px; align-items:center; padding:10px 6px; border-top:1px solid var(--line); }
  .rec-row:first-child{ border-top:none; }
  @media (min-width:721px){ .rec-row:nth-child(2){ border-top:none; } }
  .cap{ display:block; color:var(--text-dim); font-size:0.6rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; }
  .holder{ display:block; font-weight:600; font-size:0.88rem; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ctx{ display:block; color:var(--text-dim); font-size:0.7rem; margin-top:1px; }
  .rec-v{ font-family:var(--scoreboard); font-weight:800; font-size:1.4rem; color:var(--gold); font-variant-numeric:tabular-nums; white-space:nowrap; }

  /* ---------- Timeline: one card per season (audit II #7) ----------
     Every row has a fixed height, so every card is the same size and each
     piece sits in the same place every year: year + Sacko on top, the
     1st/2nd/3rd podium, the rest of the final standings (3x3, blank slots
     in 8- and 10-team years), then the two superlatives. */
  .seasons{ display:grid; grid-template-columns:1fr; gap:8px; }
  @media (min-width:721px){ .seasons{ grid-template-columns:1fr 1fr; } }
  .yr{ background:var(--item); border:1px solid var(--item-line); border-radius:12px; padding:12px; min-width:0; display:grid; gap:10px; }
  .yr.live{ border-style:dashed; }
  .yr-h{ display:flex; justify-content:space-between; align-items:center; gap:10px; height:26px; }
  .yr-hl{ display:flex; align-items:center; gap:8px; min-width:0; }
  .yr-y{ font-family:var(--scoreboard); font-weight:800; font-size:1.4rem; line-height:1; }
  .yr-sk{ display:inline-flex; align-items:center; gap:7px; height:26px; padding:0 11px; border-radius:999px; border:1px solid var(--loss-line); background:var(--loss-tint); min-width:0; }
  .yr-sk span{ color:var(--loss); font-size:0.58rem; font-weight:700; letter-spacing:0.07em; text-transform:uppercase; white-space:nowrap; }
  .yr-sk b{ font-size:0.78rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .podium{ display:grid; grid-template-columns:1.12fr 1fr 1fr; gap:6px; align-items:end; height:116px; }
  .pd{ border-radius:9px 9px 4px 4px; text-align:center; padding:0 5px 7px; min-width:0; border:1px solid var(--item-line); background:var(--item); display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:1px; }
  .pd.p1{ height:116px; border-color:var(--gold); background:var(--lead-tint); }
  .pd.p2{ height:102px; } .pd.p3{ height:90px; }
  .pd-lg{ position:relative; width:30px; height:30px; border-radius:50%; overflow:hidden; margin-bottom:4px; flex:none; background:var(--item); }
  .pd.p1 .pd-lg{ width:36px; height:36px; box-shadow:0 0 0 2px var(--gold); }
  .pd-lg img{ width:100%; height:100%; object-fit:cover; display:block; }
  .pd-lg .ph{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; font-family:var(--scoreboard); font-weight:800; font-size:0.8rem; color:var(--text-dim); }
  .pd-r{ font-family:var(--scoreboard); font-weight:800; font-size:0.84rem; color:var(--text-dim); line-height:1.1; }
  .pd.p1 .pd-r{ color:var(--gold); }
  .pd-n{ font-weight:700; font-size:0.86rem; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pd.p1 .pd-n{ color:var(--gold); font-size:0.95rem; }
  .pd-a{ color:var(--text-dim); font-size:0.66rem; font-variant-numeric:tabular-nums; height:1.2em; }

  .yr-sec > .cap{ margin-bottom:5px; }
  .slots{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:5px; }
  .slot{ display:flex; align-items:center; gap:6px; height:26px; padding:0 9px; border-radius:999px; border:1px solid var(--item-line); font-size:0.74rem; min-width:0; }
  .slot b{ font-weight:700; font-size:0.7rem; font-variant-numeric:tabular-nums; flex:none; }
  .slot span{ font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .slot.playoffs{ border-color:var(--win-line); background:var(--win-tint); } .slot.playoffs b{ color:var(--turf); }
  .slot.missed{ border-color:var(--loss-line); background:var(--loss-tint); } .slot.missed b{ color:var(--loss); }
  .slot.sacko{ border-color:var(--loss); background:color-mix(in srgb, var(--loss) 20%, transparent); } .slot.sacko b{ color:var(--loss); }
  .slot.empty{ visibility:hidden; }

  /* Superlatives: name only, so both fit one row on a phone. The points
     show on hover, or on a tap (the pill is a button). */
  .sups{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .sup{ position:relative; display:flex; align-items:center; gap:8px; height:30px; padding:0 12px; border-radius:999px; border:1px solid var(--item-line); background:var(--item); color:var(--text); font:inherit; font-size:0.78rem; min-width:0; cursor:pointer; text-align:left; }
  .sup .cap{ flex:none; margin:0; line-height:1; }
  .sup b{ line-height:1; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sup:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .sup::after{ content:attr(data-pts); position:absolute; left:50%; bottom:calc(100% + 6px); transform:translateX(-50%); padding:5px 10px; border-radius:8px; background:var(--ctl-bg-solid); border:1px solid var(--ctl-line); color:var(--gold); font-weight:700; font-size:0.78rem; white-space:nowrap; font-variant-numeric:tabular-nums; opacity:0; pointer-events:none; transition:opacity .12s; z-index:2; }
  .sup.show::after{ opacity:1; }
  @media (hover:hover){ .sup:hover::after{ opacity:1; } }

  /* ---------- Dynasty heatmap ----------
     Current members only, sorted by average finish. Columns share the
     width, so all the seasons fit a phone without scrolling. States are
     the same ones the Franchise page uses for a season. */
  .heat{ display:grid; gap:3px; align-items:center; }
  .heat-n{ font-weight:600; font-size:0.78rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding-right:4px; }
  .heat-y{ text-align:center; color:var(--text-dim); font-size:0.58rem; }
  .heat-c{ height:28px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-family:var(--scoreboard); font-weight:700; font-size:0.78rem; color:var(--text-dim); background:var(--item); border:1px solid var(--item-line); min-width:0; }
  .heat-ast{ font-family:var(--body); font-weight:700; font-size:0.95em; line-height:1; margin-left:1px; align-self:flex-start; margin-top:5px; }
  .heat-c.none{ background:none; border-color:transparent; color:rgba(255,255,255,0.15); }
  .heat-c.champion{ border-color:var(--gold); background:color-mix(in srgb, var(--gold) 20%, transparent); color:var(--text); box-shadow:0 0 7px color-mix(in srgb, var(--gold) 55%, transparent); }
  .heat-c.runner-up{ border-color:var(--lead-line); color:var(--gold); }
  .heat-c.playoffs{ border-color:var(--win-line); background:var(--win-tint); color:var(--turf); }
  /* Red mirrors gold: champion is the full gold ring and runner-up the
     softer line, so a Sacko (like a title) is the full ring with a glow and a missed
     playoff year the softer red line. Glow and fill are mixed from --loss. */
  .heat-c.missed{ border-color:var(--loss-line); background:var(--loss-tint); color:var(--loss); }
  .heat-c.sacko{ border-color:var(--loss); background:color-mix(in srgb, var(--loss) 22%, transparent); color:var(--text); box-shadow:0 0 7px color-mix(in srgb, var(--loss) 55%, transparent); }
  .legend{ display:flex; flex-wrap:wrap; gap:6px 14px; color:var(--text-dim); font-size:0.68rem; padding:12px 2px 0; }
  .legend i{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; border:1px solid var(--item-line); background:var(--item); }
  .legend .champion{ border-color:var(--gold); background:color-mix(in srgb, var(--gold) 20%, transparent); box-shadow:0 0 5px color-mix(in srgb, var(--gold) 55%, transparent); }
  .legend .runner-up{ border-color:var(--lead-line); background:none; }
  .legend .playoffs{ border-color:var(--win-line); background:var(--win-tint); }
  .legend .missed{ border-color:var(--loss-line); background:var(--loss-tint); }
  .legend .sacko{ border-color:var(--loss); background:color-mix(in srgb, var(--loss) 22%, transparent); box-shadow:0 0 5px color-mix(in srgb, var(--loss) 55%, transparent); }

  /* ---------- Leaderboards (audit II #8) ----------
     Every ranked list is a small card showing its top three, grouped in
     one panel per subject. Tapping a card opens the whole list: a bottom
     sheet on a phone, a popover under the card on desktop (the surfaces
     are theme.css's "Detail panels", shared with Game Records). */
  .lbg{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; }
  @media (min-width:721px){ .lbg{ grid-template-columns:repeat(4, minmax(0,1fr)); } }
  .lb{ display:flex; flex-direction:column; min-width:0; width:100%; padding:10px 10px 8px; border-radius:10px; border:1px solid var(--item-line); background:var(--item); color:inherit; font:inherit; text-align:left; cursor:pointer; }
  @media (hover:hover){ .lb:hover{ background:var(--item-hover); } }
  .lb:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .lb.open{ background:var(--lead-tint); border-color:var(--lead-line); }
  .lb-t{ font-weight:700; font-size:0.78rem; margin-bottom:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lb-r{ display:grid; grid-template-columns:14px minmax(0,1fr) auto; gap:6px; align-items:baseline; padding:2px 0; font-size:0.76rem; }
  .lb.years .lb-r{ grid-template-columns:20px minmax(0,1fr) auto; }
  .lb-r i{ font-style:normal; font-family:var(--scoreboard); font-weight:700; font-size:0.76rem; color:var(--text-dim); }
  .lb-r span{ font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lb-r b{ font-family:var(--scoreboard); font-weight:700; font-size:0.92rem; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .lb-r.lead i, .lb-r.lead b{ color:var(--gold); } .lb-r.low i, .lb-r.low b{ color:var(--loss); }
  .lb-r b.up{ color:var(--turf); } .lb-r b.down{ color:var(--loss); }
  .lb-f{ display:flex; justify-content:space-between; align-items:center; gap:6px; margin-top:auto; padding-top:5px; color:var(--text-dim); font-size:0.64rem; }
  .lb.open .lb-f .chev{ color:var(--gold); }
  .lb-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:6px; }
  .lb-title{ font-weight:700; font-size:1.05rem; }

  /* ---------- A whole list, in the sheet or popover ----------
     The leader (or, on a "worst" list, the bottom) gets the outline + tint;
     every other row is plain. Signed figures keep green/red by sign. */
  .lr{ display:grid; grid-template-columns:38px minmax(0,1fr) auto; gap:10px; align-items:center; padding:10px 8px; border-top:1px solid var(--line); }
  .lr:first-child{ border-top-color:transparent; }
  .lr.lead, .lr.low{ border-radius:8px; border-top-color:transparent; }
  .lr.lead + .lr, .lr.low + .lr{ border-top-color:transparent; }
  .lr.lead{ background:var(--lead-tint); box-shadow:inset 0 0 0 1px var(--lead-line); }
  .lr.low{ background:var(--loss-tint); box-shadow:inset 0 0 0 1px var(--loss-line); }
  .lr-rk{ font-family:var(--scoreboard); font-weight:700; font-size:0.98rem; color:var(--text-dim); text-align:center; }
  .lr.lead .lr-rk{ color:var(--gold); } .lr.low .lr-rk{ color:var(--loss); }
  .lr-nm{ font-weight:600; font-size:0.88rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lr-sub{ color:var(--text-dim); font-size:0.7rem; margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lr-v{ font-family:var(--scoreboard); font-weight:800; font-size:1.2rem; font-variant-numeric:tabular-nums; white-space:nowrap; text-align:right; }
  .lr.lead .lr-v{ color:var(--gold); } .lr.low .lr-v{ color:var(--loss); }
  .lr .lr-v.up{ color:var(--turf); } .lr .lr-v.down{ color:var(--loss); }
</style>
</head>

<script>
  // esc() and typeTile() are globals from page-common.js, not part of LG.
  const { f1, f2, money } = LG;
  let TABS = [], LB = [], LISTS = [], tab = 0;
  const panel = (title, body, chip) => `<div class="panel">${title ? `<div class="p-head"><div class="p-title">${title}</div>${chip ? `<span class="chip">${chip}</span>` : ''}</div>` : ''}<div class="p-body">${body}</div></div>`;
  const nameList = names => names.length < 3 ? names.join(' and ') : `${names.slice(0, -1).join(', ')}, and ${names[names.length - 1]}`;

  function build(D, F, R) {
    // Payouts are stored as sparse "effective from this year on" snapshots
    // (see rule-changes.json) rather than one row per season -- resolve to
    // whichever snapshot was in force as of a given year, same as
    // rule-changes.html does for its own settings-by-year lookups.
    const payoutsFor = year => {
      if (!R || !R.snapshots) return {};
      const snap = [...R.snapshots].filter(s => s.year <= year).sort((a, b) => b.year - a.year)[0];
      if (!snap) return {};
      return Object.fromEntries((snap.payouts || []).map(p => [p.label, p.amount]));
    };
    const complete = new Set(D.completeYears);
    const done = D.seasons.filter(s => complete.has(s.year));
    const noBye = D.games.filter(g => g.type !== 'Bye' && g.p2 && g.winner !== 'In Progress');
    const yearsDesc = D.completeYears.slice().reverse();
    const champs = done.filter(s => s.champ > 0).sort((a, b) => b.year - a.year);
    const sackos = done.filter(s => s.sacko > 0).sort((a, b) => b.year - a.year);
    const rec = s => `${s.tot_w + s.med_w}-${s.tot_l + s.med_l}`;
    const regRec = s => `${s.reg_w + s.med_w}-${s.reg_l + s.med_l}`;
    const players = [...D.active];

    const counts = (list, key, label) => {
      const by = {};
      list.filter(s => s[key] > 0).forEach(s => { const e = by[s.player] || (by[s.player] = { n: 0, years: [] }); e.n++; e.years.push(s.year); });
      return Object.entries(by).sort((a, b) => b[1].n - a[1].n || Math.max(...b[1].years) - Math.max(...a[1].years))
        .map(([name, e]) => ({ name, sub: e.years.sort((x, y) => y - x).map(y => `'${String(y).slice(2)}`).join(', '), val: e.n }));
    };
    // Title and Sacko games: who it was about first (the champion, or the
    // manager who took the Sacko), then the score, then the margin.
    const titleGames = (type, winnerFirst) => yearsDesc.map(y => {
      const g = noBye.find(x => x.year === y && x.type === type); if (!g) return null;
      const [w, ws, l, ls] = g.s1 >= g.s2 ? [g.p1, g.s1, g.p2, g.s2] : [g.p2, g.s2, g.p1, g.s1];
      return winnerFirst
        ? { rank: y, name: `${w} def. ${l}`, short: w, sub: `${f2(ws)} – ${f2(ls)}`, val: '+' + f2(ws - ls) }
        : { rank: y, name: `${l} lost to ${w}`, short: l, sub: `${f2(ls)} – ${f2(ws)}`, val: '−' + f2(ws - ls) };
    }).filter(Boolean);

    const seasonPts = max => yearsDesc.map(y => {
      const rows = done.filter(s => s.year === y);
      const b = rows.reduce((a, c) => ((max ? c.tot_pf > a.tot_pf : c.tot_pf < a.tot_pf) ? c : a));
      return { rank: y, name: b.player, sub: `${rec(b)} record`, val: f2(b.tot_pf) };
    });
    // Consolation games count for the weekly high (the prize counts every
    // game) but not the low: a lineup nobody set there isn't a real low.
    const weekly = max => D.years.slice().reverse().map(y => {
      let best = null;
      noBye.filter(g => g.year === y && (max || g.type !== 'Cons')).forEach(g => [[g.p1, g.s1], [g.p2, g.s2]].forEach(([p, s]) => {
        if (!s || s <= 0) return;
        if (!best || (max ? s > best.s : s < best.s)) best = { p, s, t: g.type, w: g.week };
      }));
      return best && { rank: y, name: best.p, sub: `Week ${best.w}${best.t === 'Reg' ? '' : ' · ' + best.t}`, val: f2(best.s) };
    }).filter(Boolean);
    const avgMedian = D.years.slice().reverse().map(y => {
      // One median per week (every game row that week carries the same one).
      const byWeek = new Map(D.games.filter(g => g.year === y && g.type === 'Reg' && g.median !== null).map(g => [g.week, g.median]));
      const m = [...byWeek.values()];
      return m.length && { rank: y, val: f2(m.reduce((a, b) => a + b, 0) / m.length), sub: `${m.length} weeks` };
    }).filter(Boolean);

    // How often each current member's score topped the week, finished last,
    // or landed on the median bubble (regular season, every year), from the
    // same weeklyFinishes() tally as Franchise's Weekly tab and Game Records.
    const wf = weeklyFinishes(D.games);
    const weeklyCount = key => [...wf.by].filter(([n]) => D.active.has(n))
      .sort((a, b) => b[1][key] - a[1][key] || a[1].weeks - b[1].weeks)
      .map(([name, t]) => ({ name, sub: `of ${t.weeks} weeks`, val: t[key] }));

    const winSeasons = high => done.slice().sort((a, b) => (high ? b.reg_w - a.reg_w : a.reg_w - b.reg_w) || a.year - b.year).slice(0, 12)
      .map(s => ({ name: s.player, sub: `${s.year} · finished ${s.final_rank || '—'}${s.champ ? ' · Champion' : s.sacko ? ' · Sacko' : ''}`, val: `${s.reg_w}-${s.reg_l}` }));
    const doneOf = p => done.filter(s => s.player === p);
    const rate = players.map(p => { const ss = doneOf(p), made = ss.filter(s => s.playoff > 0).length; return { name: p, r: ss.length ? made / ss.length : 0, sub: `${made} of ${ss.length} seasons` }; })
      .sort((a, b) => b.r - a.r).map(x => ({ name: x.name, sub: x.sub, val: Math.round(x.r * 100) + '%' }));
    const finish = players.map(p => { const ss = doneOf(p).filter(s => s.final_rank); return { name: p, avg: ss.length ? ss.reduce((a, s) => a + s.final_rank, 0) / ss.length : 99, n: ss.length }; })
      .sort((a, b) => a.avg - b.avg).map(x => ({ name: x.name, sub: `${x.n} seasons`, val: x.avg.toFixed(1), avg: x.avg }));
    const earn = Object.entries(D.earnings).filter(([n, v]) => v != null && D.active.has(n)).sort((a, b) => b[1] - a[1])
      .map(([name, v]) => ({ name, sub: 'After dues and parlays', val: money(v), tone: v > 0 ? 'up' : v < 0 ? 'down' : '', raw: v }));

    // Every ranked list covers current members only -- a manager who left
    // years ago can't hold or lose a spot anyone still playing competes for.
    const activeF = () => !F ? [] : F.players.filter(p => D.active.has(p.name));
    const effView = () => activeF().filter(p => p.efficiency && p.efficiency.career_pct != null)
      .map(p => ({ name: p.name, sub: `${p.efficiency.games_analyzed} games`, val: f1(p.efficiency.career_pct) + '%' }))
      .sort((a, b) => parseFloat(b.val) - parseFloat(a.val));
    const benchView = () => activeF().filter(p => p.efficiency && p.efficiency.avg_points_left != null)
      .map(p => ({ name: p.name, sub: `${f2(p.efficiency.points_left_on_bench)} total`, val: f2(p.efficiency.avg_points_left) }))
      .sort((a, b) => parseFloat(a.val) - parseFloat(b.val));
    const extraWinsView = () => activeF().filter(p => p.efficiency && p.efficiency.optimal_record)
      .map(p => ({ name: p.name, sub: `${p.efficiency.optimal_record.games} regular season games`, val: (p.efficiency.optimal_record.extra_wins > 0 ? '+' : '') + p.efficiency.optimal_record.extra_wins }))
      .sort((a, b) => parseFloat(b.val) - parseFloat(a.val));
    // Schedule luck: actual regular-season win rate minus all-play win rate
    // (the record you'd have playing every team every week). Positive means
    // the schedule handed you wins your scoring didn't earn. Same figure the
    // Franchise page shows.
    const scheduleLuck = p => (p.all_play && p.all_play.pct != null && p.career && p.career.win_rates.reg_pct != null)
      ? Math.round((p.career.win_rates.reg_pct - p.all_play.pct) * 10) / 10 : null;
    const medianLuckView = () => activeF().filter(p => scheduleLuck(p) !== null)
      .map(p => { const l = scheduleLuck(p); return { name: p.name, sub: `Won ${f1(p.career.win_rates.reg_pct)}% · all-play ${f1(p.all_play.pct)}%`, val: (l > 0 ? '+' : '') + f1(l) + '%', tone: l > 0 ? 'up' : l < 0 ? 'down' : '' }; })
      .sort((a, b) => parseFloat(b.val) - parseFloat(a.val));
    // Record against the weekly median game alone (2025 on). Same career
    // figure as the Franchise page's Versus the Median card, so it includes
    // the season in progress just as that card does.
    const vsMedianView = () => activeF().filter(p => p.career.median && p.career.median.pct != null)
      .map(p => ({ name: p.name, sub: `${p.career.median.wins}-${p.career.median.losses}`, val: f1(p.career.median.pct) + '%', pct: p.career.median.pct, w: p.career.median.wins }))
      .sort((a, b) => b.pct - a.pct || b.w - a.w);
    // The same median game, played back over every regular-season week since
    // 2015. Every game row carries that week's median score (it matches the
    // official 2025-on records exactly); a score equal to the median counts
    // as neither, as it does in the official game.
    const vsMedianAllTimeView = () => {
      const r = {};
      D.games.filter(g => g.type === 'Reg' && typeof g.median === 'number').forEach(g => [[g.p1, g.s1], [g.p2, g.s2]].forEach(([p, s]) => {
        if (!D.active.has(p) || typeof s !== 'number' || s === g.median) return;
        const x = r[p] || (r[p] = { w: 0, l: 0, since: g.year });
        if (s > g.median) x.w++; else x.l++;
        x.since = Math.min(x.since, g.year);
      }));
      return Object.entries(r).map(([name, x]) => ({ name, sub: `${x.w}-${x.l} · since ${x.since}`, val: f1(x.w / (x.w + x.l) * 100) + '%', pct: x.w / (x.w + x.l), w: x.w }))
        .sort((a, b) => b.pct - a.pct || b.w - a.w);
    };
    const draftPosView = () => activeF().filter(p => p.draft && p.draft.avg_position != null)
      .map(p => ({ name: p.name, sub: `Earliest ${p.draft.best_position} · latest ${p.draft.worst_position}`, val: f1(p.draft.avg_position) }))
      .sort((a, b) => parseFloat(a.val) - parseFloat(b.val));

    // Reuses the exact badge set the Franchise page's Achievements tab unlocks against, so the
    // two pages never drift -- see docs/achievements.js.
    const achievementsView = () => {
      if (!F) return [];
      const ctx = { foundingYear: ACHIEVEMENTS_LIB.foundingYear(F.players) };
      const total = ACHIEVEMENTS_LIB.ACHIEVEMENTS.length;
      return activeF().map(p => {
        const n = ACHIEVEMENTS_LIB.unlockedCount(p, ctx);
        return { name: p.name, sub: `of ${total}`, val: n };
      }).sort((a, b) => b.val - a.val);
    };

    // "If you'd played every team, every week" -- a Reg-season-only
    // all-play record (see compute_all_play in generate_franchise_data_d1.py),
    // not the Power Index below (a blended composite of several different
    // stats) -- this is purely schedule-independent scoring strength.
    const powerRankingView = () => !F ? [] : F.players.filter(p => p.all_play && p.all_play.pct != null && D.active.has(p.name))
      .map(p => ({ name: p.name, val: f1(p.all_play.pct) + '%', sub: `${p.all_play.w}-${p.all_play.l}${p.all_play.t ? '-' + p.all_play.t : ''} all-play` }))
      .sort((a, b) => parseFloat(b.val) - parseFloat(a.val));

    // Same formula as franchise.html's clutchDelta: playoff win% minus
    // regular-season win%, only for managers with at least one playoff
    // game (otherwise the "delta" is really just noise from a 0-0 sample).
    const clutchDeltaView = () => !F ? [] : F.players
      .map(p => {
        const r = p.career.record, wr = p.career.win_rates;
        if (!D.active.has(p.name) || (r.playoff_w || 0) + (r.playoff_l || 0) === 0 || wr.reg_pct == null || wr.playoff_pct == null) return null;
        const delta = wr.playoff_pct - wr.reg_pct;
        return { name: p.name, tone: delta > 0 ? 'up' : delta < 0 ? 'down' : '', val: (delta > 0 ? '+' : '') + f1(delta) + '%', sub: `Playoffs ${f1(wr.playoff_pct)}% · reg ${f1(wr.reg_pct)}%` };
      })
      .filter(Boolean)
      .sort((a, b) => parseFloat(b.val) - parseFloat(a.val));

    // Composite all-time score blending titles/win%/scoring/efficiency/earnings. Weighted
    // 35/25/15/15/10; a manager missing a component (e.g. no efficiency data) has it skipped
    // and the rest reweighted rather than being zeroed out for it.
    const powerIndexView = () => {
      if (!F) return [];
      const base = activeF().map(p => ({
        name: p.name,
        titles: p.career.standings.championships || 0,
        win: p.career.win_rates.reg_pct ?? null,
        ppg: p.career.points.avg_pf ?? null,
        eff: (p.efficiency && p.efficiency.career_pct != null) ? p.efficiency.career_pct : null,
        earn: (p.money && p.money.net_result != null) ? p.money.net_result : null,
      }));
      const WEIGHTS = { titles: 35, win: 25, ppg: 15, eff: 15, earn: 10 };
      const LABELS = { titles: 'Titles', win: 'Win%', ppg: 'PPG', eff: 'Eff', earn: '$' };
      const normFns = {};
      Object.keys(WEIGHTS).forEach(key => {
        const vals = base.map(r => r[key]).filter(v => v != null);
        const lo = Math.min(...vals), hi = Math.max(...vals);
        normFns[key] = v => (v == null ? null : (hi === lo ? 100 : (v - lo) / (hi - lo) * 100));
      });
      return base.map(r => {
        const parts = Object.keys(WEIGHTS).map(key => [key, normFns[key](r[key])]).filter(([, v]) => v != null);
        const totalW = parts.reduce((a, [key]) => a + WEIGHTS[key], 0);
        const score = totalW ? parts.reduce((a, [key, v]) => a + v * WEIGHTS[key], 0) / totalW : 0;
        const sub = parts.map(([key, v]) => `${LABELS[key]} ${Math.round(v * WEIGHTS[key] / 100)}`).join(' · ');
        return { name: r.name, sub, val: score.toFixed(1) };
      }).sort((a, b) => parseFloat(b.val) - parseFloat(a.val));
    };

    // Streaks rank by head-to-head games and show the "with median" figure
    // (which also counts the weekly median game, 2025 on) beside each one,
    // so both rules the league uses stay on the page.
    const streakFmt = n => n > 0 ? `W${n}` : n < 0 ? `L${-n}` : '—';
    const streakList = (get, sub, fmt = n => n) => activeF().filter(p => p.streaks && p.streaks.head_to_head)
      .map(p => { const n = get(p.streaks.head_to_head); return { name: p.name, n, val: fmt(n), sub: sub(p.streaks) }; })
      .sort((a, b) => b.n - a.n);
    const medianStreakView = () => activeF().filter(p => p.streaks && p.streaks.median)
      .map(p => ({ name: p.name, n: p.streaks.median.longest_win, val: p.streaks.median.longest_win, sub: `Median games only · now ${streakFmt(p.streaks.median.current)}` }))
      .sort((a, b) => b.n - a.n);

    // All-time lists the per-year ones (now on the Timeline) don't give.
    const TYPE = { Cons: 'Consolation', Play: 'Playoffs', Champ: 'Final', Sacko: 'Sacko', '3rd': '3rd place', '5th': '5th place' };
    const bestSeasons = () => done.slice().sort((a, b) => b.tot_pf - a.tot_pf).slice(0, 12)
      .map(s => ({ name: s.player, sub: `${s.year} · ${rec(s)}`, val: f2(s.tot_pf) }));
    // Consolation games count for a high but never a low (the prize rule).
    const weekScores = high => noBye.filter(g => high || g.type !== 'Cons')
      .flatMap(g => [[g.p1, g.s1], [g.p2, g.s2]].map(([p, s]) => ({ p, s, g })))
      .filter(x => x.s > 0).sort((a, b) => high ? b.s - a.s : a.s - b.s).slice(0, 10)
      .map(x => ({ name: x.p, sub: `${x.g.year} · Week ${x.g.week}${x.g.type === 'Reg' ? '' : ' · ' + (TYPE[x.g.type] || x.g.type)}`, val: f2(x.s) }));
    const avgPointsView = () => activeF().filter(p => p.career.points.avg_pf != null)
      .map(p => ({ name: p.name, n: p.career.points.avg_pf, sub: `${f2(p.career.points.total_pf)} total`, val: f2(p.career.points.avg_pf) }))
      .sort((a, b) => b.n - a.n);
    const perfectView = () => activeF().filter(p => p.efficiency && p.efficiency.perfect_lineups != null)
      .map(p => ({ name: p.name, n: p.efficiency.perfect_lineups, sub: `of ${p.efficiency.games_analyzed} games`, val: p.efficiency.perfect_lineups }))
      .sort((a, b) => b.n - a.n);
    const wonView = () => activeF().filter(p => p.money && p.money.total_earnings != null)
      .map(p => ({ name: p.name, n: p.money.total_earnings, sub: `Paid in ${money(p.money.total_dues)}`, val: money(p.money.total_earnings) }))
      .sort((a, b) => b.n - a.n);
    const movesView = () => activeF().filter(p => p.moves)
      .map(p => ({ name: p.name, n: p.moves.total, sub: `${p.moves.avg_per_season} a season`, val: p.moves.total }))
      .sort((a, b) => b.n - a.n);

    // o.year: the left column is a year, not a rank. o.lead: which row takes
    // the gold outline ('first', 'max', 'min', 'none'; default first). o.low:
    // which row (if any) takes the red one. o.bad: a list of bad things
    // (Sackos, lows), where the leader is marked red instead of gold. A row's
    // n, when set, is its number (a streak's "L3" is -3).
    const V = (label, items, o = {}) => {
      const nums = items.map(it => it.n ?? parseFloat(String(it.val).replace(/[^0-9.\-]/g, '')));
      const idx = how => how === 'max' ? nums.indexOf(Math.max(...nums)) : how === 'min' ? nums.indexOf(Math.min(...nums)) : how === 'first' ? 0 : -1;
      const li = items.length ? idx(o.lead || 'first') : -1;
      // Everyone tied with the leader shares the mark, and the rank.
      const leads = new Set(li < 0 ? [] : nums.map((n, i) => (n === nums[li] ? i : -1)).filter(i => i >= 0));
      const ranks = [];
      items.forEach((it, k) => ranks.push(k > 0 && String(it.val) === String(items[k - 1].val) ? ranks[k - 1] : k + 1));
      return { label, items, year: o.year, leads, low: idx(o.low), bad: o.bad, ranks };
    };

    // ----- Summary -----
    const topTied = (list, get, dir = 1) => {
      const vals = list.map(get).filter(v => v != null);
      if (!vals.length) return { value: null, items: [] };
      const value = dir > 0 ? Math.max(...vals) : Math.min(...vals);
      return { value, items: list.filter(x => get(x) === value) };
    };
    const champC = counts(done, 'champ'), sackC = counts(done, 'sacko');

    function summaryHtml() {
      const c = champs[0], sk = sackos[0];
      const reign = `<div class="reign">
        <div class="reign-c champ"><div class="reign-l">Reigning Champion</div><div class="reign-n">${esc(c.player)}</div><div class="reign-s">${c.year} · ${rec(c)}</div></div>
        <div class="reign-c sacko"><div class="reign-l">Reigning Sacko</div><div class="reign-n">${esc(sk.player)}</div><div class="reign-s">${sk.year} · ${regRec(sk)}</div></div>
      </div>`;

      const managers = new Set(D.seasons.map(s => s.player));
      const distinctChamps = new Set(champs.map(s => s.player));
      const glance = `<div class="tiles">
        <div class="tile"><div class="tile-l">Seasons</div><div class="tile-v">${D.years.length}</div><div class="tile-s">Since ${D.years[0]}</div></div>
        <div class="tile"><div class="tile-l">Managers</div><div class="tile-v">${managers.size}</div><div class="tile-s">${D.active.size} active</div></div>
        <div class="tile"><div class="tile-l">Games</div><div class="tile-v">${noBye.length.toLocaleString()}</div><div class="tile-s">${noBye.filter(g => g.type !== 'Reg').length} postseason</div></div>
        <div class="tile"><div class="tile-l">Champions</div><div class="tile-v">${distinctChamps.size}</div><div class="tile-s">in ${champs.length} seasons</div></div>
      </div>`;

      // Every record names everyone tied at the top.
      const row = (icon, cap, names, ctx, value, cls) => `<div class="rec-row">${typeTile(icon, cls)}<div style="min-width:0"><span class="cap">${cap}</span><span class="holder">${esc(nameList(names))}</span>${ctx ? `<span class="ctx">${ctx}</span>` : ''}</div><span class="rec-v${cls ? ' ' + cls : ''}">${value}</span></div>`;
      const yrs = list => list.map(s => s.year).sort((a, b) => b - a).map(y => `'${String(y).slice(2)}`).join(', ');
      const rows = [];
      { const t = topTied(champC, x => x.val); rows.push(row('trophy', 'Most titles', t.items.map(x => x.name), t.items.length === 1 ? t.items[0].sub : '', t.value)); }
      { const t = topTied(sackC, x => x.val); rows.push(row('sacko', 'Most Sackos', t.items.map(x => x.name), t.items.length === 1 ? t.items[0].sub : '', t.value, 'loss')); }
      { const t = topTied(done, s => s.tot_pf); rows.push(row('points', 'Best season, points', t.items.map(s => s.player), yrs(t.items), f2(t.value))); }
      { const t = topTied(done, s => s.reg_w); const tt = topTied(t.items, s => -s.reg_l); rows.push(row('record', 'Best regular season', tt.items.map(s => s.player), yrs(tt.items), `${tt.items[0].reg_w}-${tt.items[0].reg_l}`)); }
      { let best = null; noBye.forEach(g => [[g.p1, g.s1], [g.p2, g.s2]].forEach(([p, s]) => { if (!best || s > best.s) best = { p, s, g }; }));
        rows.push(row('hi', 'Highest single week', [best.p], `${best.g.year} · Week ${best.g.week}`, f2(best.s))); }
      if (F) { const act = F.players.filter(p => D.active.has(p.name)); const t = topTied(act, p => p.streaks.head_to_head.longest_win); rows.push(row('streak', 'Longest win streak', t.items.map(p => p.name), '', `${t.value} straight`)); }
      { const t = topTied(players.map(p => ({ p, n: doneOf(p).filter(s => s.playoff > 0).length })), x => x.n); rows.push(row('playoffs', 'Most playoff trips', t.items.map(x => x.p), '', t.value)); }
      { const t = topTied(finish, x => x.avg, -1); rows.push(row('finish', 'Best average finish', t.items.map(x => x.name), t.items.length === 1 ? t.items[0].sub : '', f1(t.value))); }
      { const t = topTied(earn, x => x.raw); rows.push(row('money', 'Most money won', t.items.map(x => x.name), 'After dues and parlays', money(t.value))); }

      return panel('', reign) + panel('All-Time Records', `<div class="recs">${rows.join('')}</div>`) + panel('The League', glance);
    }

    // ----- Season Timeline -----
    // Audit II #7: one fixed-size card per season -- year and Sacko on top,
    // a 1st/2nd/3rd podium with logos and payouts, the rest of the final
    // standings, then the two superlatives (points on hover/tap).
    function timelineHtml() {
      const gameBy = type => { const o = {}; noBye.filter(g => g.type === type).forEach(g => o[g.year] = g); return o; };
      const champG = gameBy('Champ'), sackoG = gameBy('Sacko'), thirdG = gameBy('3rd');
      const weeklyHighByYear = {}; weekly(true).forEach(w => weeklyHighByYear[w.rank] = w);
      const seasonHighByYear = {}; seasonPts(true).forEach(w => seasonHighByYear[w.rank] = w);
      const wl = g => g.s1 >= g.s2 ? [g.p1, g.p2] : [g.p2, g.p1];
      const logoUrl = name => { const p = F && F.players.find(x => x.name === name); return (p && p.current_team_logo) || ''; };
      const ord = r => r + (r === 1 ? 'st' : r === 2 ? 'nd' : r === 3 ? 'rd' : 'th');

      const head = (y, sackoLabel, sackoName, chip) => `<div class="yr-h"><div class="yr-hl"><div class="yr-y">${y}</div>${chip || ''}</div>${sackoName ? `<span class="yr-sk"><span>${sackoLabel}</span><b>${esc(sackoName)}</b></span>` : ''}</div>`;
      const podium = places => `<div class="podium">${places.map((x, i) => {
        const url = x.name ? esc(logoUrl(x.name)) : '';
        const lg = x.name ? `<div class="pd-lg">${url ? `<img src="${url}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : ''}<span class="ph" style="${url ? '' : 'display:flex'}">${esc(monogram(x.name))}</span></div>` : '';
        return `<div class="pd p${i + 1}">${lg}<div class="pd-r">${ord(i + 1)}</div><div class="pd-n">${x.name ? esc(x.name) : '—'}</div><div class="pd-a">${x.sub || ''}</div></div>`;
      }).join('')}</div>`;
      // Nine slots (4th-12th) always, so an 8- or 10-team year is the same size.
      const standings = (label, rest) => `<div class="yr-sec"><span class="cap">${label}</span><div class="slots">${[...Array(9)].map((_, i) => {
        const x = rest[i];
        return x ? `<div class="slot ${x.st}"><b>${x.r}</b><span>${esc(x.name)}</span></div>` : '<div class="slot empty"></div>';
      }).join('')}</div></div>`;
      // The title carries the prize: "$200 ea" when both pay the same, both
      // amounts when they don't, nothing for the years before they paid.
      const supTitle = pay => {
        const w = pay['Highest Points (Week)'], s = pay['Highest Points (Season)'];
        return 'Superlatives' + (w && w === s ? ` · ${money(w)} ea` : w || s ? ` · ${[w, s].map(n => money(n || 0)).join(' / ')}` : '');
      };
      const sup = (label, name, pts) => `<button type="button" class="sup" data-pts="${esc(pts)}" aria-label="${label}: ${esc(name)}, ${esc(pts)}"><span class="cap">${label}</span><b>${esc(name)}</b></button>`;
      const sups = (pay, a, b) => `<div class="yr-sec"><span class="cap">${supTitle(pay)}</span><div class="sups">${a}${b}</div></div>`;

      // The season in progress: the same card, filled with where things
      // stand. Every manager tied at a top value is named.
      function liveYearHtml(y) {
        const rows = D.seasons.filter(s => s.year === y);
        const games = noBye.filter(g => g.year === y && g.type === 'Reg');
        const weeks = games.length ? Math.max(...games.map(g => g.week)) : 0;
        if (!rows.length || !weeks) {
          return `<div class="yr live">${head(y, '', '', '<span class="chip">In progress</span>')}</div>`;
        }
        const ranked = rows.slice().sort((a, b) => a.reg_rank - b.reg_rank);
        const spots = (D.settings && D.settings[y] && D.settings[y].playoff_teams) || 0;
        const scores = games.flatMap(g => [{ name: g.p1, s: g.s1, week: g.week }, { name: g.p2, s: g.s2, week: g.week }]);
        const tied = (list, f) => { const v = Math.max(...list.map(f)); return list.filter(x => f(x) === v); };
        const names = list => [...new Set(list.map(x => x.name || x.player))].join(' & ');
        const hiW = tied(scores, x => x.s), pf = tied(rows, s => s.reg_pf);
        const rest = ranked.slice(3).map((s, i) => ({ r: i + 4, name: s.player, st: i + 4 <= spots ? 'playoffs' : i + 4 === ranked.length ? 'sacko' : 'missed' }));
        return `<div class="yr live">
          ${head(y, 'Sacko watch', ranked[ranked.length - 1].player, `<span class="chip">Through Week ${weeks}</span>`)}
          ${podium(ranked.slice(0, 3).map(s => ({ name: s.player, sub: regRec(s) })))}
          ${standings('Standings', rest)}
          ${sups(payoutsFor(y), sup('Top week', names(hiW), f2(hiW[0].s) + (hiW.length === 1 ? ` · Week ${hiW[0].week}` : '')), sup('Points', names(pf), f2(pf[0].reg_pf)))}
        </div>`;
      }

      const cards = D.years.slice().reverse().map(y => {
        if (!complete.has(y)) return liveYearHtml(y);
        const pay = payoutsFor(y);
        const rows = done.filter(s => s.year === y && s.final_rank).sort((a, b) => a.final_rank - b.final_rank);
        const last = rows.length ? rows[rows.length - 1].final_rank : 0;
        const cg = champG[y], tg = thirdG[y], sg = sackoG[y], wh = weeklyHighByYear[y], sh = seasonHighByYear[y];
        const at = r => (rows.find(s => s.final_rank === r) || {}).player;
        const places = [
          { name: cg ? wl(cg)[0] : at(1), sub: pay['1st Place'] && money(pay['1st Place']) },
          { name: cg ? wl(cg)[1] : at(2), sub: pay['2nd Place'] && money(pay['2nd Place']) },
          { name: tg ? wl(tg)[0] : at(3), sub: pay['3rd Place'] && money(pay['3rd Place']) },
        ];
        const rest = rows.filter(s => s.final_rank > 3).map(s => ({ r: s.final_rank, name: s.player,
          st: s.sacko > 0 || s.final_rank === last ? 'sacko' : s.playoff > 0 ? 'playoffs' : 'missed' }));
        return `<div class="yr">
          ${head(y, 'Sacko', sg ? wl(sg)[1] : at(last))}
          ${podium(places)}
          ${standings('Final standings', rest)}
          ${sups(pay, wh ? sup('Top week', wh.name, `${wh.val} · ${wh.sub}`) : '', sh ? sup('Top season', sh.name, sh.val) : '')}
        </div>`;
      }).join('');
      return panel('Season Timeline', `<div class="seasons">${cards}</div>`, `${D.years.length} seasons`);
    }

    // ----- Dynasty Heatmap -----
    // Current members only (former members had no say in the current
    // dynasty picture and padded the grid with empty columns), longest-
    // tenured first, then best average finish.
    function dynastyHtml() {
      const years = D.completeYears;
      const last = {}; done.forEach(s => { last[s.year] = Math.max(last[s.year] || 0, s.final_rank || 0); });
      // Seniority first (earliest completed season), so every manager's
      // "not in the league yet" dots stack into one block at the bottom
      // left; ties keep finish's best-average-first order (stable sort).
      const firstYear = name => Math.min(...doneOf(name).map(s => s.year));
      const list = [...finish].sort((a, b) => firstYear(a.name) - firstYear(b.name)).map(x => x.name);
      const state = s => {
        if (!s || !s.final_rank) return 'none';
        if (s.final_rank === 1) return 'champion';
        if (s.final_rank === 2) return 'runner-up';
        if (s.sacko > 0 || s.final_rank === last[s.year]) return 'sacko';
        if (s.playoff > 0) return 'playoffs';
        return 'missed';
      };
      const head = `<div></div>${years.map(y => `<div class="heat-y">'${String(y).slice(2)}</div>`).join('')}`;
      // League joke (same one as the dashboard's "3*" easter egg): Flanders's
      // first title gets an asterisk.
      const flandersFirst = Math.min(...done.filter(s => s.player === 'Flanders' && s.final_rank === 1).map(s => s.year));
      const body = list.map(name => `<div class="heat-n">${esc(name)}</div>` + years.map(y => {
        const s = done.find(x => x.player === name && x.year === y);
        const st = state(s);
        const ast = name === 'Flanders' && y === flandersFirst;
        return `<div class="heat-c ${st}" title="${y}${s && s.final_rank ? ` — ${s.final_rank} of ${last[y]}` : ''}${ast ? ' (we all know this one doesn’t count)' : ''}">${st === 'none' ? '·' : s.final_rank}${ast ? '<span class="heat-ast">*</span>' : ''}</div>`;
      }).join('')).join('');
      const legend = `<div class="legend"><span><i class="champion"></i>Champion</span><span><i class="runner-up"></i>Runner-up</span><span><i class="playoffs"></i>Playoffs</span><span><i class="missed"></i>Missed</span><span><i class="sacko"></i>Sacko</span></div>`;
      return panel('Dynasty', `<div class="heat" style="grid-template-columns:62px repeat(${years.length}, minmax(0,1fr))">${head}${body}</div>${legend}`, 'Final finish');
    }

    // Audit II #8: the six list tabs (Champions, Sackos, Scoring, Rankings,
    // Efficiency, Streaks) and their pill rows became one Leaderboards tab.
    // The champion, Sacko, top week and top season of each year are on the
    // Timeline, so they aren't repeated here.
    const curStreaks = streakList(s => s.current, s => `With median ${s.combined ? streakFmt(s.combined.current) : '—'}`, streakFmt);
    LB = [
      { sec: 'Titles & Sackos', lists: [
        V('Titles', champC),
        V('Sackos', sackC, { bad: true }),
        V('Title games', titleGames('Champ', true), { year: true, lead: 'max' }),
        V('Sacko games', titleGames('Sacko', false), { year: true, lead: 'none' }),
        V('Playoff rate', rate),
        V('Average finish', finish),
      ] },
      { sec: 'Winning', lists: [
        V('Best regular seasons', winSeasons(true)),
        V('Worst regular seasons', winSeasons(false), { bad: true }),
        V('Power ranking', powerRankingView()),
        V('Power index', powerIndexView()),
        V('Clutch factor', clutchDeltaView()),
        V('Achievements', achievementsView()),
      ] },
      { sec: 'Scoring', lists: [
        V('Best seasons', bestSeasons()),
        V('Top weeks', weekScores(true)),
        V('Lowest weeks', weekScores(false), { bad: true }),
        V('Average points', avgPointsView()),
        V('Weekly highs', weeklyCount('high')),
        V('Weekly lows', weeklyCount('low'), { bad: true }),
        V('Season low by year', seasonPts(false), { year: true, lead: 'none', low: 'min' }),
        V('Weekly low by year', weekly(false), { year: true, lead: 'none', low: 'min' }),
        V('Median by year', avgMedian, { year: true, lead: 'max', low: 'min' }),
      ] },
      { sec: 'Luck & the median', lists: [
        V('Schedule luck', medianLuckView()),
        V('Vs median', vsMedianView()),
        V('Vs median, all-time', vsMedianAllTimeView()),
        V('Bubble wins', weeklyCount('bubW')),
        V('Bubble losses', weeklyCount('bubL'), { bad: true }),
      ] },
      { sec: 'Lineups', lists: [
        V('Career efficiency', effView()),
        V('Bench points a game', benchView()),
        V('Wins left on the bench', extraWinsView(), { bad: true }),
        V('Perfect lineups', perfectView()),
      ] },
      { sec: 'Money & draft', lists: [
        V('Net earnings', earn),
        V('Won before dues', wonView()),
        V('Draft position', draftPosView()),
        V('Roster moves', movesView()),
      ] },
      { sec: 'Streaks', lists: [
        V('Longest win streak', streakList(s => s.longest_win, s => `With median ${s.combined ? s.combined.longest_win : '—'}`)),
        V('Longest losing streak', streakList(s => s.longest_loss, s => `With median ${s.combined ? s.combined.longest_loss : '—'}`), { bad: true }),
        V('Current streak', curStreaks, { lead: curStreaks.length && curStreaks[0].n > 0 ? 'first' : 'none', low: curStreaks.length && curStreaks[curStreaks.length - 1].n < 0 ? 'min' : undefined }),
        V('Median streak', medianStreakView()),
      ] },
    ].map(g => ({ ...g, lists: g.lists.filter(l => l.items.length) })).filter(g => g.lists.length);
    LISTS = LB.flatMap(g => g.lists);
    LISTS.forEach((l, i) => { l.id = i; });

    const leaderboardsHtml = () => LB.map(g => panel(g.sec, `<div class="lbg">${g.lists.map(cardHtml).join('')}</div>`)).join('');

    TABS = [
      { label: 'Summary', html: summaryHtml() },
      { label: 'Timeline', html: timelineHtml() },
      { label: 'Dynasty', html: dynastyHtml() },
      { label: 'Leaderboards', html: leaderboardsHtml() },
    ];
  }

  // A row's state: gold for the leader (and anyone tied with them), red for
  // the leader of a bad list or the marked low row.
  const rowState = (v, k) => v.leads.has(k) ? (v.bad ? 'low' : 'lead') : k === v.low ? 'low' : '';
  const leftCol = (v, i, k) => v.year ? `'${String(i.rank).slice(2)}` : v.ranks[k];

  // A card: the list's top three (the latest three years on a by-year list).
  function cardHtml(v) {
    const rows = v.items.slice(0, 3).map((i, k) => {
      const st = rowState(v, k);
      return `<span class="lb-r${st ? ' ' + st : ''}"><i>${leftCol(v, i, k)}</i><span>${esc(i.short || i.name || i.sub)}</span><b${i.tone ? ` class="${i.tone}"` : ''}>${esc(i.val)}</b></span>`;
    }).join('');
    const more = v.items.length > 3 ? `+${v.items.length - 3} more` : '';
    return `<button type="button" class="lb${v.year ? ' years' : ''}" data-lb="${v.id}" aria-haspopup="dialog" aria-expanded="false">` +
      `<span class="lb-t">${esc(v.label)}</span>${rows}<span class="lb-f"><span>${more}</span><span class="chev" aria-hidden="true"></span></span></button>`;
  }

  // One row of a whole list. Year lists show the year in the left column,
  // ranked lists the rank (managers tied on a value share it).
  function rowHtml(i, k, v) {
    const state = rowState(v, k);
    return `<div class="lr${state ? ' ' + state : ''}"><div class="lr-rk">${leftCol(v, i, k)}</div><div style="min-width:0">${i.name ? `<div class="lr-nm">${esc(i.name)}</div>` : ''}${i.sub ? `<div class="lr-sub">${esc(i.sub)}</div>` : ''}</div><div class="lr-v${i.tone ? ' ' + i.tone : ''}">${esc(i.val)}</div></div>`;
  }

  function render() {
    lbHide();
    document.getElementById('tabs').innerHTML = TABS.map((t, i) => `<button class="tab ${i === tab ? 'on' : ''}" data-i="${i}">${t.label}</button>`).join('');
    document.getElementById('overview').innerHTML = TABS[tab].html;
    keepSelectedInView(document.getElementById('tabs'));
  }

  // ---------- A whole list: bottom sheet on a phone, popover on desktop ----------
  // Same surfaces and behaviour as Game Records' top 10s and the Dashboard's
  // Median Watch (theme.css "Detail panels").
  let lbOpen = null;
  const lbOneColumn = matchMedia('(max-width:720px)');

  function lbParts(v) {
    const head = `<div class="lb-head"><div class="lb-title">${esc(v.label)}</div><button type="button" class="x" data-close aria-label="Close">&times;</button></div>`;
    return { head, rows: v.items.map((i, k) => rowHtml(i, k, v)).join('') };
  }

  function lbMark() {
    document.querySelectorAll('.lb[data-lb]').forEach(c => {
      const on = lbOpen !== null && Number(c.dataset.lb) === lbOpen;
      c.classList.toggle('open', on);
      c.setAttribute('aria-expanded', on);
    });
  }

  // Opens the list, or -- if one is already up -- swaps its contents in place.
  function lbShow(id) {
    lbOpen = id;
    lbMark();
    const v = LISTS[id], l = lbParts(v);
    const existing = document.getElementById('lb-sheet') || document.getElementById('lb-pop');
    if (existing) {
      existing.querySelector('[data-head]').innerHTML = l.head;
      const body = existing.querySelector('[data-body]');
      body.innerHTML = l.rows;
      body.scrollTop = 0;
      existing.setAttribute('aria-label', v.label);
      lbPlace();
      return;
    }
    if (!lbOneColumn.matches) {
      document.body.insertAdjacentHTML('beforeend', `<div class="pop" id="lb-pop" role="dialog" aria-label="${esc(v.label)}"><div data-head>${l.head}</div><div data-body>${l.rows}</div></div>`);
      lbPlace();
      return;
    }
    document.body.insertAdjacentHTML('beforeend', `<div class="scrim" data-close></div><div class="sheet" id="lb-sheet" role="dialog" aria-modal="true" aria-label="${esc(v.label)}">
      <div class="sheet-grab" data-grab><span></span></div>
      <div class="sheet-head" data-grab data-head>${l.head}</div>
      <div class="sheet-body" data-body>${l.rows}</div></div>`);
    lbWireSwipe();
  }

  function lbHide() {
    lbOpen = null;
    lbMark();
    document.querySelectorAll('#lb-sheet, #lb-pop, .scrim').forEach(el => el.remove());
  }

  // Under the card, at least 360px wide and never off the side of the
  // screen, with the arrow on the card's center. Two passes: placing it can
  // add a scrollbar, which shifts the card.
  function lbPlace() {
    const pop = document.getElementById('lb-pop');
    if (!pop) return;
    const card = lbOpen !== null && document.querySelector(`.lb[data-lb="${lbOpen}"]`);
    if (!card) { lbHide(); return; }
    for (let pass = 0; pass < 2; pass++) {
      const r = card.getBoundingClientRect(), vw = document.documentElement.clientWidth;
      const w = Math.min(Math.max(r.width, 360), vw - 24);
      const left = Math.min(Math.max(r.left, 12), vw - w - 12);
      pop.style.width = w + 'px';
      pop.style.left = (left + scrollX) + 'px';
      pop.style.top = (r.bottom + scrollY + 10) + 'px';
      pop.style.setProperty('--arrow-x', (r.left + r.width / 2 - left) + 'px');
    }
  }

  // Drag the sheet down past 90px to dismiss it, like a native sheet.
  function lbWireSwipe() {
    const sheet = document.getElementById('lb-sheet');
    if (!sheet) return;
    let y0 = null, dy = 0;
    sheet.querySelectorAll('[data-grab]').forEach(el => {
      el.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; y0 = e.clientY; dy = 0; sheet.style.animation = 'none'; el.setPointerCapture(e.pointerId); });
      el.addEventListener('pointermove', e => { if (y0 === null) return; dy = Math.max(0, e.clientY - y0); sheet.style.transform = `translateY(${dy}px)`; });
      el.addEventListener('pointerup', () => { if (y0 === null) return; y0 = null; if (dy > 90) lbHide(); else sheet.style.transform = ''; });
    });
  }

  document.addEventListener('click', e => {
    // Timeline superlatives: a tap shows that pill's points and closes any other.
    const sp = e.target.closest('.sup');
    document.querySelectorAll('.sup.show').forEach(x => { if (x !== sp) x.classList.remove('show'); });
    if (sp) { sp.classList.toggle('show'); return; }
    const t = e.target.closest('.tab');
    if (t) { tab = Number(t.dataset.i); render(); return; }
    if (e.target.closest('[data-close]')) { lbHide(); return; }
    const c = e.target.closest('.lb[data-lb]');
    if (c) { const id = Number(c.dataset.lb); if (lbOpen === id) lbHide(); else lbShow(id); return; }
    if (lbOpen !== null && !lbOneColumn.matches && !e.target.closest('#lb-pop')) lbHide();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && lbOpen !== null) lbHide(); });
  addEventListener('resize', lbPlace);
  // Crossing between one and two columns swaps sheet for popover: close it.
  lbOneColumn.addEventListener('change', lbHide);


  Promise.all([
    LG.load(),
    fetch('data/franchise.json', { cache: 'no-store' }).then(r => (r.ok ? r.json() : null)).catch(() => null),
    fetch('data/rule-changes.json', { cache: 'no-store' }).then(r => (r.ok ? r.json() : null)).catch(() => null),
  ])
    .then(([D, F, R]) => { build(D, F, R); render(); riseIn(document.getElementById('overview').children); })
    .catch(err => LG.showError('overview', err));
</script>
<script src="track.js?v=1" defer></script>
