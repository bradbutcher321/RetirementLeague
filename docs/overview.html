<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retirement League — Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=4">
<link rel="stylesheet" href="nav.css?v=3">
<link rel="stylesheet" href="league.css?v=5">
<style>
  .tabs{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .tab{ background:none; border:1px solid var(--line); color:var(--text-dim); font-family:var(--body); font-size:0.82rem; font-weight:600; padding:8px 14px; border-radius:999px; cursor:pointer; }
  .tab.on{ border-color:var(--gold); color:var(--gold); background:rgba(212,180,106,0.10); }
  .seg{ display:flex; flex-wrap:wrap; border:1px solid var(--line); border-radius:10px; overflow:hidden; margin:4px 24px 14px; width:fit-content; max-width:calc(100% - 48px); }
  .seg button{ background:none; border:none; color:var(--text-dim); font-family:var(--body); font-weight:600; font-size:0.78rem; padding:8px 15px; cursor:pointer; }
  .seg button.on{ background:rgba(212,180,106,0.14); color:var(--gold); }
  .seg button.on.good{ background:rgba(79,174,122,0.14); color:var(--turf); }
  .seg button.on.bad{ background:rgba(214,98,79,0.14); color:var(--loss); }

  .cols{ display:grid; grid-template-columns:1fr 1fr; gap:0 14px; padding:0 18px 20px; }
  @media (max-width:720px){ .cols{ grid-template-columns:1fr; } }

  /* ---------- Season Timeline: one small chip per fact instead of a
     single line of plain text ---------- */
  .yr-chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .yr-chip{ display:inline-flex; align-items:baseline; gap:5px; background:rgba(255,255,255,0.03); border:1px solid var(--line); border-radius:999px; padding:5px 10px; font-size:0.74rem; color:var(--text); white-space:nowrap; }
  .yr-chip .l{ color:var(--text-dim); font-size:0.64rem; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; }
  .yr-chip .m{ font-family:var(--scoreboard); font-weight:700; font-size:0.68rem; color:var(--text-dim); }
  .yr-chip.gold{ border-color:rgba(212,180,106,0.35); background:rgba(212,180,106,0.07); }
  .yr-chip.gold .l{ color:var(--gold); }
  .yr-chip.loss{ border-color:rgba(214,98,79,0.35); background:rgba(214,98,79,0.07); }
  .yr-chip.loss .l{ color:var(--loss); }
  .yr-chip.bronze{ border-color:rgba(205,127,50,0.4); background:rgba(205,127,50,0.08); }
  .yr-chip.bronze .l{ color:#D9A066; }

  /* ---------- Streaks: ring the current W/L streak leaders ---------- */
  .qrow.streak-w{ border-color:var(--gold); box-shadow:0 0 0 1.5px var(--gold) inset; }
  .qrow.streak-l{ border-color:var(--loss); box-shadow:0 0 0 1.5px var(--loss) inset; }

  /* ---------- Dynasty Heatmap ---------- */
  .heat-scroll{ overflow-x:auto; padding:22px 24px; }
  .heat-grid{ display:grid; width:max-content; }
  .heat-name{ position:sticky; left:0; background:var(--surface); font-weight:700; font-size:0.82rem; display:flex; align-items:center; padding-right:8px; border-right:1px solid var(--line); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .heat-yr{ text-align:center; color:var(--text-dim); font-size:0.62rem; padding:4px 0; }
  .heat-cell{ margin:1.5px; border-radius:4px; display:flex; align-items:center; justify-content:center; font-family:var(--scoreboard); font-weight:700; font-size:0.78rem; color:var(--text-dim); min-height:28px; border:1px solid var(--line); }
  .heat-cell.champ{ background:rgba(212,180,106,0.22); color:var(--gold); border-color:var(--gold); }
  .heat-legend{ display:flex; flex-wrap:wrap; gap:14px; margin:0 24px 20px; }
  .heat-legend-item{ display:flex; align-items:center; gap:6px; color:var(--text-dim); font-size:0.74rem; }
  .heat-swatch{ width:12px; height:12px; border-radius:3px; border:1px solid var(--line); flex-shrink:0; }

  /* ---------- Scoring Trends ---------- */
  .sc-wrap{ padding:22px 24px; }
  .sc-chart{ width:100%; height:200px; display:block; }
  .sc-grid-line{ stroke:var(--line); stroke-width:1; }
  .sc-band{ fill:var(--gold); opacity:0.1; }
  .sc-line{ fill:none; stroke:var(--gold); stroke-width:2; vector-effect:non-scaling-stroke; }
  .sc-dot{ fill:var(--gold); stroke:var(--surface); stroke-width:1.5; vector-effect:non-scaling-stroke; }
  .sc-axis-label{ fill:var(--text-dim); font-size:9px; font-family:'Big Shoulders Display',sans-serif; font-weight:600; }
  .sc-end-label{ fill:var(--text); font-weight:800; font-size:13px; font-family:'Big Shoulders Display',sans-serif; }
  .sc-annot-line{ stroke:var(--text-dim); stroke-width:1; stroke-dasharray:3 3; }
  .sc-annot-text{ fill:var(--text-dim); font-size:9px; font-family:'Inter',sans-serif; }
  .sc-caption{ text-align:center; color:var(--text-dim); font-size:0.76rem; margin-top:6px; }
  .sc-caption b{ color:var(--text); }
</style>
</head>
<body>
  <div id="site-nav"></div>
  <div class="wrap">
    <header>
      <div class="header-row">
        <div>
          <div class="eyebrow">Retirement League</div>
          <h1>Overview</h1>
        </div>
        <div class="updated-block">
          <div class="updated-label">Updated</div>
          <div class="updated-value" id="updated-at">—</div>
        </div>
      </div>
    </header>

    <section>
      <h2>League History</h2>
      <div class="tabs" id="tabs"></div>
      <div id="overview"><div class="loading-row">Loading league history…</div></div>
    </section>

    <footer>Data via ESPN Fantasy (Earnings from the league sheet)</footer>
  </div>

<script src="nav.js"></script>
<script src="league-common.js?v=2"></script>
<script src="achievements.js"></script>
<script>
  const { f1, f2, money, esc } = LG;
  let TABS = [], tab = 0;
  const viewPick = {};
  const toneCls = t => (t === 'good' || t === 'up' ? 'turf' : t === 'bad' || t === 'down' ? 'loss' : '');
  const glassCard = (title, body, note) => `<div class="glass"><div style="padding:20px 24px ${note ? '4px' : '16px'}"><div style="font-weight:700;font-size:1rem">${title}</div>${note ? `<div style="color:var(--text-dim);font-size:0.78rem;margin-top:4px">${note}</div>` : ''}</div>${body}</div>`;

  function build(D, F, R) {
    // Payouts are stored as sparse "effective from this year on" snapshots
    // (see rule-changes.json) rather than one row per season -- resolve to
    // whichever snapshot was in force as of a given year, same as
    // rule-changes.html does for its own settings-by-year lookups.
    const payoutsFor = year => {
      if (!R || !R.snapshots) return {};
      const snap = [...R.snapshots].filter(s => s.year <= year).sort((a, b) => b.year - a.year)[0];
      if (!snap) return {};
      return Object.fromEntries((snap.payouts || []).map(p => [p.label, p.amount]));
    };
    const complete = new Set(D.completeYears);
    const done = D.seasons.filter(s => complete.has(s.year));
    const draftPos = (p, y) => (D.draft_order[p] || {})[y];
    const noBye = D.games.filter(g => g.type !== 'Bye' && g.p2 && g.winner !== 'In Progress');
    const yearsDesc = D.completeYears.slice().reverse();
    const champs = done.filter(s => s.champ > 0).sort((a, b) => b.year - a.year);
    const sackos = done.filter(s => s.sacko > 0).sort((a, b) => b.year - a.year);
    const rec = s => `${s.tot_w + s.med_w}-${s.tot_l + s.med_l}`;
    const regRec = s => `${s.reg_w + s.med_w}-${s.reg_l + s.med_l}`;

    const byYear = (list, recFn) => list.map(s => ({ rank: s.year, name: s.player, sub: `Draft position ${draftPos(s.player, s.year) ?? '—'}`, val: recFn(s) }));
    const counts = (list, key, label) => {
      const by = {};
      list.filter(s => s[key] > 0).forEach(s => { const e = by[s.player] || (by[s.player] = { n: 0, last: 0 }); e.n++; e.last = Math.max(e.last, s.year); });
      return Object.entries(by).sort((a, b) => b[1].n - a[1].n || b[1].last - a[1].last).map(([name, e]) => ({ name, sub: `${label} ${e.last}`, val: e.n, hl: true }));
    };
    const titleGames = (type, winnerFirst) => yearsDesc.map(y => {
      const g = noBye.find(x => x.year === y && x.type === type); if (!g) return null;
      const hi = g.s1 >= g.s2 ? [g.p1, g.s1, g.p2, g.s2] : [g.p2, g.s2, g.p1, g.s1];
      const f = winnerFirst ? hi : [hi[2], hi[3], hi[0], hi[1]];
      return { rank: y, name: `${f[0]} ${f2(f[1])} vs ${f[2]} ${f2(f[3])}`, sub: 'Margin of victory', val: f2(Math.abs(g.s1 - g.s2)) };
    }).filter(Boolean);

    const seasonPts = max => yearsDesc.map(y => {
      const rows = done.filter(s => s.year === y);
      const b = rows.reduce((a, c) => ((max ? c.tot_pf > a.tot_pf : c.tot_pf < a.tot_pf) ? c : a));
      return { rank: y, name: b.player, sub: `${rec(b)} record`, val: f2(b.tot_pf) };
    });
    const weekly = max => D.years.slice().reverse().map(y => {
      let best = null;
      noBye.filter(g => g.year === y).forEach(g => [[g.p1, g.s1], [g.p2, g.s2]].forEach(([p, s]) => {
        if (!s || s <= 0) return;
        if (!best || (max ? s > best.s : s < best.s)) best = { p, s, t: g.type, w: g.week };
      }));
      return best && { rank: y, name: best.p, sub: `Week ${best.w}${best.t === 'Reg' ? '' : ' · ' + best.t}`, val: f2(best.s) };
    }).filter(Boolean);
    const avgMedian = D.years.slice().reverse().map(y => {
      const m = D.games.filter(g => g.year === y && g.type === 'Reg' && g.median !== null).map(g => g.median);
      return m.length && { rank: y, val: f2(m.reduce((a, b) => a + b, 0) / m.length) };
    }).filter(Boolean);

    const winSeasons = high => done.slice().sort((a, b) => (high ? b.reg_w - a.reg_w : a.reg_w - b.reg_w) || a.year - b.year).slice(0, 12)
      .map(s => ({ rank: s.year, name: s.player, sub: 'Regular season', val: `${s.reg_w}-${s.reg_l}` }));
    const players = [...D.active];
    const doneOf = p => done.filter(s => s.player === p);
    const rate = players.map(p => { const ss = doneOf(p), made = ss.filter(s => s.playoff > 0).length; return { name: p, r: ss.length ? made / ss.length : 0, sub: `${made} of ${ss.length} seasons` }; })
      .sort((a, b) => b.r - a.r).map(x => ({ name: x.name, sub: x.sub, val: Math.round(x.r * 100) + '%', hl: true }));
    const finish = players.map(p => { const ss = doneOf(p).filter(s => s.final_rank); return { name: p, avg: ss.length ? ss.reduce((a, s) => a + s.final_rank, 0) / ss.length : 99, n: ss.length }; })
      .sort((a, b) => a.avg - b.avg).map(x => ({ name: x.name, sub: `${x.n} seasons`, val: x.avg.toFixed(1), hl: true }));
    const earn = Object.entries(D.earnings).filter(([, v]) => v != null).sort((a, b) => b[1] - a[1])
      .map(([name, v]) => ({ name, sub: 'Net after dues and parlays', val: money(v), tone: v > 0 ? 'up' : v < 0 ? 'down' : '', hl: true }));

    const effView = () => !F ? [] : F.players.filter(p => p.efficiency && p.efficiency.career_pct != null)
      .map(p => ({ name: p.name, sub: `${p.efficiency.games_analyzed} games analyzed`, val: f1(p.efficiency.career_pct) + '%' }))
      .sort((a, b) => parseFloat(b.val) - parseFloat(a.val));
    const benchView = () => !F ? [] : F.players.filter(p => p.efficiency && p.efficiency.avg_points_left != null)
      .map(p => ({ name: p.name, sub: `${f1(p.efficiency.points_left_on_bench)} total over ${p.efficiency.games_analyzed} games`, val: f2(p.efficiency.avg_points_left) }))
      .sort((a, b) => parseFloat(a.val) - parseFloat(b.val));
    const extraWinsView = () => !F ? [] : F.players.filter(p => p.efficiency && p.efficiency.optimal_record)
      .map(p => ({ name: p.name, sub: `${p.efficiency.optimal_record.games} regular season games`, val: (p.efficiency.optimal_record.extra_wins > 0 ? '+' : '') + p.efficiency.optimal_record.extra_wins }))
      .sort((a, b) => parseFloat(b.val) - parseFloat(a.val));
    const consistencyView = () => !F ? [] : F.players.filter(p => p.extremes && p.extremes.score_stdev != null)
      .map(p => ({ name: p.name, sub: 'Weekly score, standard deviation', val: f2(p.extremes.score_stdev) }))
      .sort((a, b) => parseFloat(a.val) - parseFloat(b.val));
    const medianLuckView = () => !F ? [] : F.players.filter(p => p.median_luck !== null && p.median_luck !== undefined)
      .map(p => ({ name: p.name, sub: 'Actual vs. median-implied win rate', val: (p.median_luck > 0 ? '+' : '') + f1(p.median_luck) + '%', tone: p.median_luck > 0 ? 'up' : p.median_luck < 0 ? 'down' : '' }))
      .sort((a, b) => parseFloat(b.val) - parseFloat(a.val));
    const draftPosView = () => !F ? [] : F.players.filter(p => p.draft && p.draft.avg_position != null)
      .map(p => ({ name: p.name, sub: `Best ${p.draft.best_position} · Worst ${p.draft.worst_position}`, val: f1(p.draft.avg_position) }))
      .sort((a, b) => parseFloat(a.val) - parseFloat(b.val));

    // Reuses the exact badge set the Franchise page's Achievements tab unlocks against, so the
    // two pages never drift -- see docs/achievements.js.
    const achievementsView = () => {
      if (!F) return [];
      const ctx = { foundingYear: ACHIEVEMENTS_LIB.foundingYear(F.players) };
      const total = ACHIEVEMENTS_LIB.ACHIEVEMENTS.length;
      return F.players.map(p => {
        const n = ACHIEVEMENTS_LIB.unlockedCount(p, ctx);
        return { name: p.name, sub: `${total - n} locked`, val: n, hl: true };
      }).sort((a, b) => b.val - a.val);
    };

    // Composite all-time score blending titles/win%/scoring/efficiency/earnings. Weighted
    // 35/25/15/15/10; a manager missing a component (e.g. no efficiency data) has it skipped
    // and the rest reweighted rather than being zeroed out for it.
    const powerIndexView = () => {
      if (!F) return [];
      const base = F.players.map(p => ({
        name: p.name,
        titles: p.career.standings.championships || 0,
        win: p.career.win_rates.reg_pct ?? null,
        ppg: p.career.points.avg_pf ?? null,
        eff: (p.efficiency && p.efficiency.career_pct != null) ? p.efficiency.career_pct : null,
        earn: (p.money && p.money.net_result != null) ? p.money.net_result : null,
      }));
      const WEIGHTS = { titles: 35, win: 25, ppg: 15, eff: 15, earn: 10 };
      const LABELS = { titles: 'Titles', win: 'Win%', ppg: 'PPG', eff: 'Eff', earn: '$' };
      const normFns = {};
      Object.keys(WEIGHTS).forEach(key => {
        const vals = base.map(r => r[key]).filter(v => v != null);
        const lo = Math.min(...vals), hi = Math.max(...vals);
        normFns[key] = v => (v == null ? null : (hi === lo ? 100 : (v - lo) / (hi - lo) * 100));
      });
      return base.map(r => {
        const parts = Object.keys(WEIGHTS).map(key => [key, normFns[key](r[key])]).filter(([, v]) => v != null);
        const totalW = parts.reduce((a, [key]) => a + WEIGHTS[key], 0);
        const score = totalW ? parts.reduce((a, [key, v]) => a + v * WEIGHTS[key], 0) / totalW : 0;
        const sub = parts.map(([key, v]) => `${LABELS[key]} ${Math.round(v * WEIGHTS[key] / 100)}`).join(' · ');
        return { name: r.name, sub, val: score.toFixed(1), hl: true };
      }).sort((a, b) => parseFloat(b.val) - parseFloat(a.val));
    };

    const streakView = key => {
      if (!F) return [];
      const cur = n => (n > 0 ? `<em style="color:var(--turf)">W${n}</em>` : n < 0 ? `<em style="color:var(--loss)">L${-n}</em>` : '—');
      const rows = F.players.filter(p => p.streaks && p.streaks[key] && D.active.has(p.name))
        .sort((a, b) => b.streaks[key].current - a.streaks[key].current || b.streaks[key].longest_win - a.streaks[key].longest_win);
      if (!rows.length) return [];
      const maxWin = Math.max(...rows.map(p => p.streaks[key].longest_win));
      const maxLoss = Math.max(...rows.map(p => p.streaks[key].longest_loss));
      const curBest = Math.max(...rows.map(p => p.streaks[key].current));
      const curWorst = Math.min(...rows.map(p => p.streaks[key].current));
      return rows.map(p => {
        const s = p.streaks[key];
        const winNum = s.longest_win === maxWin ? `<span style="color:var(--turf)">${s.longest_win}</span>` : s.longest_win;
        const lossNum = s.longest_loss === maxLoss ? `<span style="color:var(--loss)">${s.longest_loss}</span>` : s.longest_loss;
        const ring = curBest > 0 && s.current === curBest ? 'streak-w' : (curWorst < 0 && s.current === curWorst ? 'streak-l' : '');
        return { name: p.name, ring, stats: [[winNum, 'Best W'], [lossNum, 'Best L'], [cur(s.current), 'Now']] };
      });
    };

    const V = (label, items, o = {}) => {
      let best = -1;
      if (o.pick === 'first') best = 0;
      else if (o.pick) items.forEach((it, i) => { const n = parseFloat(it.val); if (best < 0 || (o.pick === 'max' ? n > parseFloat(items[best].val) : n < parseFloat(items[best].val))) best = i; });
      const marks = {};
      if (o.marks) {
        const nums = items.map(it => parseFloat(it.val));
        marks[nums.indexOf(Math.max(...nums))] = 'good';
        marks[nums.indexOf(Math.min(...nums))] = 'bad';
      }
      return { label, items, tone: o.tone || 'neutral', note: o.note, year: o.year, hl: o.hl, best, marks };
    };
    const first = (a, fallback = '—') => a[0] || { name: fallback, sub: '', val: '—' };

    // ----- summary tiles -----
    const t = (title, item, val, tone, sub, name) => ({ title, val: val ?? item.val, tone, name: name ?? item.name, sub: sub ?? item.sub });
    const champC = counts(done, 'champ', 'Last won'), sackC = counts(done, 'sacko', 'Last received');
    const topPts = seasonPts(true).sort((a, b) => parseFloat(b.val) - parseFloat(a.val))[0];
    const bestWin = winSeasons(true)[0];
    const tiles = [
      t('Reigning Champion', champs[0], champs[0].year, '', `${rec(champs[0])} record`, champs[0].player),
      t('Reigning Sacko', sackos[0], sackos[0].year, 'bad', `${regRec(sackos[0])} record`, sackos[0].player),
      t('Most Titles', champC[0], champC[0].val, '', champC[0].sub, champC.filter(c => c.val === champC[0].val).map(c => c.name).join(' · ')),
      t('Most Sackos', sackC[0], sackC[0].val, 'bad', sackC[0].sub, sackC.filter(c => c.val === sackC[0].val).slice(0, 3).map(c => c.name).join(' · ')),
      t('Best Season Points', topPts, topPts.val, 'good', `${topPts.rank}`, topPts.name),
      t('Best Regular Season', bestWin, bestWin.val, 'good', `${bestWin.rank}`, bestWin.name),
      t('Top Earner', earn[0], earn[0].val, 'good', 'Net all-time', earn[0].name),
      t('Best Average Finish', finish[0], finish[0].val, 'good', finish[0].sub, finish[0].name),
    ];

    // ----- Season Timeline -----
    function timelineHtml() {
      const champGameByYear = {}; noBye.filter(g => g.type === 'Champ').forEach(g => champGameByYear[g.year] = g);
      const sackoGameByYear = {}; noBye.filter(g => g.type === 'Sacko').forEach(g => sackoGameByYear[g.year] = g);
      const thirdGameByYear = {}; noBye.filter(g => g.type === '3rd').forEach(g => thirdGameByYear[g.year] = g);
      const secondByYear = {}; done.filter(s => s.final_rank === 2).forEach(s => secondByYear[s.year] = s);
      const weeklyHighByYear = {}; weekly(true).forEach(w => weeklyHighByYear[w.rank] = w);
      const seasonHighByYear = {}; seasonPts(true).forEach(w => seasonHighByYear[w.rank] = w);

      const chip = (cls, label, text, amount) =>
        `<span class="yr-chip${cls ? ' ' + cls : ''}"><span class="l">${label}</span> ${text}${amount ? ` <span class="m">${money(amount)}</span>` : ''}</span>`;

      const items = D.years.slice().reverse().map(y => {
        const isDone = complete.has(y);
        if (!isDone) {
          return `<div class="rail-item"><div class="rail-dot"></div><div class="rail-yr">${y}</div><div class="rail-chg">In progress</div></div>`;
        }
        const payouts = payoutsFor(y);
        const chips = [];
        const cg = champGameByYear[y];
        if (cg) {
          const winner = cg.s1 >= cg.s2 ? cg.p1 : cg.p2, loser = cg.s1 >= cg.s2 ? cg.p2 : cg.p1;
          chips.push(chip('gold', '\u{1F3C6}', `${esc(winner)} def. ${esc(loser)}`, payouts['1st Place']));
        }
        if (secondByYear[y]) chips.push(chip('', '2nd', esc(secondByYear[y].player), payouts['2nd Place']));
        const tg = thirdGameByYear[y];
        if (tg) {
          const winner = tg.s1 >= tg.s2 ? tg.p1 : tg.p2, loser = tg.s1 >= tg.s2 ? tg.p2 : tg.p1;
          chips.push(chip('bronze', '3rd', `${esc(winner)} def. ${esc(loser)}`, payouts['3rd Place']));
        }
        const sg = sackoGameByYear[y];
        if (sg) {
          const winner = sg.s1 >= sg.s2 ? sg.p1 : sg.p2, loser = sg.s1 >= sg.s2 ? sg.p2 : sg.p1;
          chips.push(chip('loss', 'Sacko', `${esc(loser)} loses to ${esc(winner)}`));
        }
        const wh = weeklyHighByYear[y];
        if (wh) chips.push(chip('gold', 'Wk High', `${esc(wh.name)} ${wh.val}`, payouts['Highest Points (Week)']));
        const sh = seasonHighByYear[y];
        if (sh) chips.push(chip('gold', 'Szn High', `${esc(sh.name)} ${sh.val}`, payouts['Highest Points (Season)']));
        return `<div class="rail-item"><div class="rail-dot"></div><div class="rail-yr">${y}</div><div class="yr-chips">${chips.join('')}</div></div>`;
      }).join('');
      return glassCard('Season Timeline', `<div style="padding:4px 24px 20px"><div class="rail">${items}</div></div>`,
        'Championship, runner-up, Sacko and the weekly/season high scores, one year per row');
    }

    // ----- Dynasty Heatmap -----
    function dynastyHtml() {
      const teamsByYear = {};
      done.forEach(s => { teamsByYear[s.year] = (teamsByYear[s.year] || 0) + 1; });
      const byPlayer = {};
      done.forEach(s => { (byPlayer[s.player] || (byPlayer[s.player] = [])).push(s); });
      const playerList = Object.keys(byPlayer).sort((a, b) => byPlayer[b].length - byPlayer[a].length || a.localeCompare(b));
      const years = D.completeYears;
      const cell = s => {
        if (!s || s.final_rank == null) return `<div class="heat-cell">—</div>`;
        const r = s.final_rank, teamsN = teamsByYear[s.year] || r;
        if (r === 1) return `<div class="heat-cell champ" title="${s.year} — Champion">1</div>`;
        const frac = r / teamsN;
        let bg = 'transparent', borderStyle = '';
        if (frac <= 0.3) bg = `rgba(76,154,107,${(0.5 - (frac / 0.3) * 0.3).toFixed(2)})`;
        else if (frac >= 0.8) bg = `rgba(192,87,75,${(0.16 + ((frac - 0.8) / 0.2) * 0.34).toFixed(2)})`;
        if (s.sacko > 0) borderStyle = 'border-color:var(--loss);';
        return `<div class="heat-cell" style="background:${bg};${borderStyle}" title="${s.year} — ${r} of ${teamsN}${s.sacko > 0 ? ' (Sacko)' : ''}">${r}</div>`;
      };
      const grid = `<div class="heat-name"></div>${years.map(y => `<div class="heat-yr">${y}</div>`).join('')}` +
        playerList.map(name => `<div class="heat-name">${esc(name)}</div>${years.map(y => cell(byPlayer[name].find(s => s.year === y))).join('')}`).join('');
      const legend = `<div class="heat-legend">
        <div class="heat-legend-item"><span class="heat-swatch" style="background:var(--gold);border-color:var(--gold)"></span>Champion</div>
        <div class="heat-legend-item"><span class="heat-swatch" style="background:rgba(76,154,107,0.45)"></span>Top tier</div>
        <div class="heat-legend-item"><span class="heat-swatch"></span>Mid-table</div>
        <div class="heat-legend-item"><span class="heat-swatch" style="background:rgba(192,87,75,0.4)"></span>Bottom tier</div>
        <div class="heat-legend-item"><span class="heat-swatch" style="border-color:var(--loss)"></span>Sacko</div></div>`;
      return glassCard('Dynasty Heatmap',
        `<div class="heat-scroll"><div class="heat-grid" style="grid-template-columns:118px repeat(${years.length},32px)">${grid}</div></div>${legend}`,
        'Final standing every season — a run of green is a dynasty, a run of red is a rut');
    }

    // ----- Scoring Trends -----
    function scoringTrendHtml() {
      const rows = D.years.map(y => {
        const scores = [];
        D.games.filter(g => g.year === y && g.type !== 'Bye' && g.p2 && g.winner !== 'In Progress').forEach(g => {
          if (g.s1 > 0) scores.push(g.s1);
          if (g.s2 > 0) scores.push(g.s2);
        });
        return scores.length ? { year: y, avg: scores.reduce((a, b) => a + b, 0) / scores.length, lo: Math.min(...scores), hi: Math.max(...scores) } : null;
      }).filter(Boolean);
      if (rows.length < 2) return glassCard('Scoring Trends', '<div class="empty-note" style="padding:22px 24px">Not enough seasons yet.</div>');
      const W = 640, H = 200, PAD_L = 34, PAD_R = 14, PAD_T = 14, PAD_B = 22;
      const n = rows.length;
      const minV = Math.min(...rows.map(r => r.lo)), maxV = Math.max(...rows.map(r => r.hi));
      const x = i => PAD_L + (i / (n - 1)) * (W - PAD_L - PAD_R);
      const y = v => H - PAD_B - ((v - minV) / (maxV - minV)) * (H - PAD_T - PAD_B);
      const bandTop = rows.map((r, i) => `${x(i).toFixed(1)},${y(r.hi).toFixed(1)}`).join(' ');
      const bandBot = rows.map((r, i) => `${x(i).toFixed(1)},${y(r.lo).toFixed(1)}`).reverse().join(' ');
      const line = rows.map((r, i) => `${x(i).toFixed(1)},${y(r.avg).toFixed(1)}`).join(' ');
      const gridLines = [minV, (minV + maxV) / 2, maxV].map(v =>
        `<line x1="${PAD_L}" y1="${y(v).toFixed(1)}" x2="${W - PAD_R}" y2="${y(v).toFixed(1)}" class="sc-grid-line" /><text x="2" y="${(y(v) + 3).toFixed(1)}" class="sc-axis-label">${Math.round(v)}</text>`).join('');
      const yearLabels = rows.map((r, i) => (n <= 8 || i % 2 === 0 ? `<text x="${x(i).toFixed(1)}" y="${H - 5}" class="sc-axis-label" text-anchor="middle">${r.year}</text>` : '')).join('');
      const medianIdx = rows.findIndex(r => r.year === 2025);
      const annot = medianIdx >= 0 ? `<line x1="${x(medianIdx).toFixed(1)}" y1="${PAD_T}" x2="${x(medianIdx).toFixed(1)}" y2="${H - PAD_B}" class="sc-annot-line" />` +
        `<text x="${(x(medianIdx) - 4).toFixed(1)}" y="${PAD_T + 9}" class="sc-annot-text" text-anchor="end">Median rule</text>` : '';
      const last = rows[n - 1];
      const svg = `<svg class="sc-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${gridLines}` +
        `<polygon points="${bandTop} ${bandBot}" class="sc-band" />${annot}<polyline points="${line}" class="sc-line" />` +
        `${rows.map((r, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(r.avg).toFixed(1)}" r="${i === n - 1 ? 4 : 2}" class="sc-dot" />`).join('')}` +
        `<text x="${(x(n - 1) + 8).toFixed(1)}" y="${(y(last.avg) + 4).toFixed(1)}" class="sc-end-label">${last.avg.toFixed(1)}</text>${yearLabels}</svg>`;
      const delta = last.avg - rows[0].avg;
      const caption = `League average score is ${delta >= 0 ? 'up' : 'down'} <b>${delta >= 0 ? '+' : ''}${delta.toFixed(1)} pts</b> since ${rows[0].year} · shaded band is each season's low-to-high range`;
      return glassCard('Scoring Trends', `<div class="sc-wrap">${svg}<div class="sc-caption">${caption}</div></div>`);
    }

    TABS = [
      { label: 'Summary', tiles },
      { label: 'Timeline', html: timelineHtml() },
      { label: 'Dynasty', html: dynastyHtml() },
      { label: 'Trends', html: scoringTrendHtml() },
      { label: 'Champions', views: [V('By Year', byYear(champs, rec), { year: true }), V('Title Count', champC, { hl: true }), V('Title Games', titleGames('Champ', true), { year: true })] },
      { label: 'Sackos', views: [V('By Year', byYear(sackos, regRec), { year: true, tone: 'bad' }), V('Sacko Count', sackC, { hl: true, tone: 'bad' }), V('Sacko Games', titleGames('Sacko', false), { year: true, tone: 'bad' })] },
      { label: 'Scoring', views: [V('Season High', seasonPts(true), { year: true, tone: 'good', pick: 'max' }), V('Season Low', seasonPts(false), { year: true, tone: 'bad', pick: 'min' }), V('Weekly High', weekly(true), { year: true, tone: 'good', pick: 'max' }), V('Weekly Low', weekly(false), { year: true, tone: 'bad', pick: 'min' }), V('Average Median', avgMedian, { year: true, marks: true }), V('Consistency', consistencyView(), { hl: true, note: 'Standard deviation of weekly score — lower is steadier' })] },
      { label: 'Rankings', views: [V('Playoff Rate', rate, { hl: true }), V('Average Finish', finish, { hl: true }), V('Best Win Seasons', winSeasons(true), { year: true, tone: 'good', pick: 'first' }), V('Worst Win Seasons', winSeasons(false), { year: true, tone: 'bad', pick: 'first' }), V('Earnings', earn, { hl: true }), V('Draft Position', draftPosView(), { hl: true, note: 'Average first-round draft slot' }), V('Median Luck', medianLuckView(), { hl: true, note: 'How much better or worse a manager\'s record is than their scoring vs. the weekly median alone would suggest' }), V('Achievements', achievementsView(), { hl: true, note: `Ranked by badges unlocked out of ${ACHIEVEMENTS_LIB.ACHIEVEMENTS.length} on the Franchise page` }), V('Power Index', powerIndexView(), { hl: true, note: 'Composite score blending titles, win%, scoring, lineup efficiency and earnings, weighted 35/25/15/15/10 — a component is skipped and the rest reweighted when a manager has no data for it' })] },
      { label: 'Efficiency', views: [V('Career Efficiency', effView(), { hl: true, tone: 'good', note: 'Actual points scored as a share of the best possible lineup, since ' + (F ? F.efficiency_start_year : '') }), V('Points Left on Bench', benchView(), { hl: true, note: 'Average points left unstarted per game — lower is more efficient' }), V('Extra Wins Available', extraWinsView(), { hl: true, note: 'Regular season wins an optimal lineup would have added' })] },
      { label: 'Streaks', views: [V('Head-to-Head', streakView('head_to_head'), { note: 'Head-to-head games only' }), V('With Median', streakView('combined'), { note: 'Includes the weekly median game (2025 onward)' })] },
    ];
  }

  // One hero (the headline number, glowing) + the rest as quiet side stats and a tile strip
  // below -- the whole point of the redesign is that not every number gets equal weight.
  function tilesHtml(tiles) {
    const hero = tiles[0], side = tiles.slice(1, 4), rest = tiles.slice(4);
    const glow = hero.tone === 'bad' ? 'glow-loss' : 'glow';
    const heroHtml = `<div class="glass hero2"><div class="hero2-main ${glow}"><div class="hero2-eyebrow">${esc(hero.title)}</div>` +
      `<div class="hero2-v">${esc(hero.val)}</div><div class="hero2-sub">${esc(hero.name)}${hero.sub ? ' · ' + esc(hero.sub) : ''}</div></div>` +
      `<div class="hero2-side">${side.map(x => `<div class="hs"><div class="hs-l">${esc(x.title)}</div><div class="hs-r">` +
        `<div class="hs-v ${toneCls(x.tone)}">${esc(x.val)}</div><div class="hs-n">${esc(x.name)}</div></div></div>`).join('')}</div></div>`;
    const tilesRow = `<div class="glass qtiles">${rest.map(x => `<div><div class="qtile-v ${toneCls(x.tone)}">${esc(x.val)}</div><div class="qtile-t">${esc(x.title)}</div>` +
      `<div class="qtile-n">${esc(x.name)}</div>${x.sub ? `<div class="qtile-s">${esc(x.sub)}</div>` : ''}</div>`).join('')}</div>`;
    return heroHtml + '<div class="gap"></div>' + tilesRow;
  }

  function rowHtml(i, k, v) {
    const mark = v.marks[k];
    const isLead = !!mark || (v.hl ? k === 0 : k === v.best);
    const tone = mark || v.tone;
    const cls = ['qrow', isLead ? 'lead' : '', i.ring || ''].filter(Boolean).join(' ');
    const right = i.stats
      ? `<div class="stats">${i.stats.map(s => `<div><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}</div>`
      : `<div class="rec ${toneCls(i.tone || tone)}">${esc(i.val)}</div>`;
    const rank = v.year ? i.rank : (i.stats ? '' : k + 1);
    return `<div class="${cls}" ${i.stats ? 'style="grid-template-columns:minmax(0,1fr) auto"' : ''}>` + (i.stats ? '' : `<div class="rk">${rank}</div>`) +
      `<div style="min-width:0">${i.name ? `<div class="nm">${esc(i.name)}</div>` : ''}${i.sub ? `<div class="meta">${esc(i.sub)}</div>` : ''}</div>${right}</div>`;
  }

  function render() {
    document.getElementById('tabs').innerHTML = TABS.map((t, i) => `<button class="tab ${i === tab ? 'on' : ''}" data-i="${i}">${t.label}</button>`).join('');
    const T = TABS[tab], el = document.getElementById('overview');
    if (T.html) { el.innerHTML = T.html; return; }
    if (T.tiles) { el.innerHTML = tilesHtml(T.tiles); return; }
    const vi = viewPick[tab] || 0, v = T.views[vi];
    const seg = `<div class="seg">${T.views.map((x, i) => `<button class="${i === vi ? 'on' + (x.tone === 'good' ? ' good' : x.tone === 'bad' ? ' bad' : '') : ''}" data-v="${i}">${x.label}</button>`).join('')}</div>`;
    const half = Math.ceil(v.items.length / 2);
    const cols = `<div class="cols"><div>${v.items.slice(0, half).map((i, k) => rowHtml(i, k, v)).join('')}</div><div>${v.items.slice(half).map((i, k) => rowHtml(i, k + half, v)).join('')}</div></div>`;
    el.innerHTML = glassCard(v.label, seg + cols, v.note);
  }

  document.addEventListener('click', e => {
    const t = e.target.closest('.tab');
    if (t) { tab = Number(t.dataset.i); render(); return; }
    const s = e.target.closest('[data-v]');
    if (s) { viewPick[tab] = Number(s.dataset.v); render(); }
  });

  Promise.all([
    LG.load(),
    fetch('data/franchise.json', { cache: 'no-store' }).then(r => (r.ok ? r.json() : null)).catch(() => null),
    fetch('data/rule-changes.json', { cache: 'no-store' }).then(r => (r.ok ? r.json() : null)).catch(() => null),
  ])
    .then(([D, F, R]) => { build(D, F, R); render(); })
    .catch(err => LG.showError('overview', err));
</script>
<script src="track.js?v=1" defer></script>
</body>
