<body>
  <div id="site-nav"></div>
  <div class="wrap">
    <header>
      <div class="header-row">
        <div>
          <div class="eyebrow">Retirement League</div>
          <h1>The Column</h1>
        </div>
        <div class="updated-block">
          <div class="updated-label">Updated</div>
          <div class="updated-value" id="updated-at">—</div>
        </div>
      </div>
    </header>

    <!-- No heading above the article or the picker: the page title names the
         subject, the picker names which column, and the chip in the article
         says its week and kind. -->
    <div class="ft-ctl" id="picker" hidden></div>
    <div id="view"><span class="sr-only">Loading…</span></div>
    <footer id="site-footer"></footer>
  </div>
<script src="nav.js?v=36"></script>
<script src="page-common.js?v=40"></script>
<script src="league-common.js?v=6"></script>
<script>
  // The Column (site audit III #3). Reads data/column.json, written by the
  // Tuesday recap and Thursday preview routines through tools/column_add.py,
  // which has already checked every number in the text against the week's
  // data. Paragraphs carry <b> around figures and nothing else; they are
  // escaped here first and only the <b> tags put back.
  const $ = id => document.getElementById(id);
  let C = [], cur = null, GAMES = [];
  const f2 = n => Number(n).toFixed(2);

  const safe = s => esc(s).replace(/&lt;(\/?)b&gt;/g, '<$1b>');
  const day = iso => new Date(iso).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'America/New_York' });
  const kindLabel = c => c.kind === 'preview' ? 'Preview' : 'Recap';
  const chipText = c => `Week ${c.week} · ${kindLabel(c)}`;

  function standingsHtml(c) {
    return `<div class="glass ft-sec"><div class="panel-title">${esc(c.standings_title || 'Where everyone stands')}</div>
      <div class="ft-body"><div class="ft-lines">${c.standings.map(s => {
        const mv = s.move > 0 ? `<span class="turf">▲${s.move}</span>` : s.move < 0 ? `<span class="lossc">▼${-s.move}</span>` : '<span class="dimt">–</span>';
        return `<div class="ft-line col-row"><div class="ft-rk">${s.rank}</div><div class="col-mv">${mv}</div>
          <div class="ft-main"><div class="ft-n">${esc(s.manager)} <span class="dimt">${esc(s.record)}</span></div><div class="ft-s">${esc(s.note)}</div></div></div>`;
      }).join('')}</div></div></div>`;
  }

  // Audit IV #20: in a recap, a final score ("<b>155.24</b> to <b>68.26</b>")
  // goes gold and gets a scoreline above its paragraph, names from league.json.
  // Every other figure stays plain bold. No league data, no scorelines.
  function bodyHtml(c) {
    const wk = GAMES.filter(g => g[0] === c.season && g[1] === c.week);
    const near = (a, b) => Math.abs(a - b) < 0.006;
    return c.body.map(p => {
      const lines = [];
      if (c.kind === 'preview') return `<p class="col-p">${safe(p)}</p>`;
      const q = p.replace(/<b>(\d+\.\d\d)<\/b> to <b>(\d+\.\d\d)<\/b>/g, (all, x, y) => {
        const g = wk.find(g => (near(g[5], +x) && near(g[6], +y)) || (near(g[5], +y) && near(g[6], +x)));
        if (g) {
          const aw = g[5] > g[6];
          lines.push(`<div class="col-sl"><span class="nm">${esc(g[3])}</span><span class="s ${aw ? 'w' : ''}">${f2(g[5])}</span><span class="dimt">–</span><span class="s ${aw ? '' : 'w'}">${f2(g[6])}</span><span class="nm">${esc(g[4])}</span><span class="mg">by ${f2(Math.abs(g[5] - g[6]))}</span></div>`);
        }
        return `<b>${x}</b> to <b>${y}</b>`;
      });
      const html = safe(q).replace(/<b>(\d+\.\d\d)<\/b> to <b>(\d+\.\d\d)<\/b>/g, (all, x, y) => wk.some(g => (near(g[5], +x) && near(g[6], +y)) || (near(g[5], +y) && near(g[6], +x))) ? `<b class="sc">${x}</b> to <b class="sc">${y}</b>` : all);
      return lines.join('') + `<p class="col-p">${html}</p>`;
    }).join('');
  }

  function gamesHtml(c) {
    return `<div class="glass ft-sec"><div class="panel-title">The matchups</div>
      <div class="ft-body"><div class="ft-lines">${c.games.map(g => `<div class="ft-line col-row"><div class="ft-main">
        <div class="ft-n">${esc(g.a)} <span class="dimt">vs</span> ${esc(g.b)}</div><div class="ft-s">${esc(g.note)}</div></div></div>`).join('')}</div></div></div>`;
  }

  function render() {
    const c = cur;
    $('view').innerHTML = `<div class="col-wrap${c.kind === 'preview' ? '' : ' rail'}"><div class="glass col-art">
        <div class="col-top"><span class="ft-chip gold">${chipText(c)}</span><span class="dimt col-date">${esc(day(c.published_at))}</span></div>
        <h2 class="col-hl">${esc(c.headline)}</h2>
        <p class="col-d">${esc(c.dek)}</p>
        ${bodyHtml(c)}
      </div>${c.kind === 'preview' ? gamesHtml(c) : standingsHtml(c)}</div>`;
    $('picker').innerHTML = C.length > 1
      ? `<select class="lg-select" id="pick" aria-label="Column">${C.map(x => `<option value="${esc(x.id)}"${x.id === c.id ? ' selected' : ''}>${esc(x.season === C[0].season ? chipText(x) : x.season + ' · ' + chipText(x))}</option>`).join('')}</select>` : '';
    $('picker').hidden = C.length < 2;
    setUrlParams({ id: c.id === C[0].id ? null : c.id });
  }
  document.addEventListener('change', e => {
    if (e.target.id !== 'pick') return;
    cur = C.find(x => x.id === e.target.value) || C[0];
    render();
    window.scrollTo({ top: 0 });
  });

  const gamesP = fetch('data/league.json').then(r => r.ok ? r.json() : null).then(d => { GAMES = (d && d.games) || []; }).catch(() => {});
  fetch('data/column.json', { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }).then(async d => {
    await gamesP;
    C = d.columns || [];
    if (d.generated_at) setPageStatus(throughLabel(d.generated_at));
    if (!C.length) { $('view').innerHTML = '<div class="glass"><div class="ft-empty">The first column goes up Tuesday, after Monday Night Football.</div></div>'; return; }
    cur = C.find(x => x.id === urlParam('id')) || C[0];
    render();
    riseIn(document.querySelectorAll('#view .glass'));
  }).catch(err => { $('view').innerHTML = `<div class="glass"><div class="ft-empty">Couldn't load the column (${esc(err.message)}).</div></div>`; });
</script>
<script src="track.js?v=2" defer></script>
</body>
