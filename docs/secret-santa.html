<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-title" content="Retirement League">
<style>html{background:#050505}</style>
<title>Retirement League — Secret Santa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/bigshouldersdisplay/v24/fC1_PZJEZG-e9gHhdI4-NBbfd2ys3SjJCx1czNDu.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=37">
<link rel="stylesheet" href="nav.css?v=30">
<style>
  /* ---------- Secret Santa sign-ups ----------
     Who's in, the rules, and (once sign-ups open) your own card. The card is
     saved by worker/src/santa.js. One column on a phone; with the card
     showing, desktop puts it beside Who's in and the rules. */
  .wrap.narrow{ max-width: 640px; }
  .wrap{ position: relative; z-index: 1; }

  /* Snow and tiny shirts drifting down behind the page, like the card on Live. */
  .snowbg{ position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  /* The flakes drift in front of the cards (too small to hide anything); the shirts stay behind. */
  .snowbg.snow-top{ z-index: 2; }
  .snowbg .flakes{ position: absolute; inset: 0; opacity: 0.75; animation: snowfall 11s linear infinite;
    background-size: 230px 190px;
    background-image: radial-gradient(1.8px 1.8px at 20% 30%, rgba(214,230,242,0.7), transparent), radial-gradient(1.1px 1.1px at 62% 72%, rgba(214,230,242,0.6), transparent), radial-gradient(1.5px 1.5px at 82% 18%, rgba(214,230,242,0.6), transparent), radial-gradient(1.1px 1.1px at 40% 88%, rgba(214,230,242,0.5), transparent), radial-gradient(1.3px 1.3px at 8% 62%, rgba(214,230,242,0.5), transparent); }
  .snowbg .flakes.b{ background-size: 310px 260px; animation-duration: 17s; opacity: 0.55;
    background-image: radial-gradient(2.2px 2.2px at 70% 40%, rgba(214,230,242,0.6), transparent), radial-gradient(1.4px 1.4px at 28% 12%, rgba(214,230,242,0.5), transparent), radial-gradient(1.2px 1.2px at 50% 66%, rgba(214,230,242,0.6), transparent), radial-gradient(1.6px 1.6px at 90% 90%, rgba(214,230,242,0.5), transparent); }
  @keyframes snowfall{ to{ background-position: 30px 190px; } }
  .snowbg img{ position: absolute; top: 0; opacity: 0.18; height: auto; }
  .cols{ display: grid; gap: 14px; align-items: start; }
  .cols > *, .col{ min-width: 0; }
  .col{ display: grid; gap: 14px; }
  .col > section, .cols > section{ margin: 0; }
  @media (min-width: 900px){ .cols.two{ grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr); } }
  .panel-body{ padding: 12px 18px 18px; }
  .sub{ color: var(--text-dim); font-size: 0.8rem; font-weight: 500; }
  .tiny{ color: var(--text-dim); font-size: 0.78rem; line-height: 1.4; }
  .cap{ display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--text-dim); font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
  .cap .ok{ color: var(--turf); letter-spacing: 0.04em; }
  .sec{ margin-top: 20px; }
  .sec:first-child{ margin-top: 0; }

  /* Who's in: the twelve seats around a ring. */
  .ring{ position: relative; width: min(100%, 360px); aspect-ratio: 1; margin: 6px auto 4px; }
  .seat{ position: absolute; width: 17%; aspect-ratio: 1; transform: translate(-50%, -50%); }
  .seat .lg{ display: grid; place-items: center; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: #1a1a1a; box-shadow: 0 0 0 1px rgba(255,255,255,0.18); font: 700 0.8rem var(--scoreboard); color: var(--text-dim); transition: filter .5s, opacity .5s, box-shadow .5s; }
  .seat .lg img{ width: 100%; height: 100%; object-fit: cover; display: block; }
  .seat.off .lg{ filter: grayscale(1) brightness(0.5); opacity: 0.55; }
  .seat.on .lg{ box-shadow: 0 0 0 1.5px var(--lead-line), 0 0 14px rgba(212,180,106,0.3); }
  .seat .nm{ position: absolute; left: 50%; top: 100%; transform: translateX(-50%); margin-top: 4px; font-size: 0.66rem; font-weight: 600; color: var(--text-dim); white-space: nowrap; }
  .seat.on .nm{ color: #E8E6DF; }
  .seat.pop{ animation: seatpop .8s cubic-bezier(.2,1.6,.4,1); }
  @keyframes seatpop{ 0%{ transform: translate(-50%, -50%) scale(.6); } 100%{ transform: translate(-50%, -50%) scale(1); } }
  .core{ position: absolute; inset: 24%; border-radius: 50%; display: grid; place-content: center; text-align: center; border: 1px solid var(--lead-line); background: radial-gradient(circle at 50% 40%, rgba(212,180,106,0.10), rgba(0,0,0,0) 70%); }
  .core .num{ font: 800 4rem/0.85 var(--scoreboard); color: var(--gold); }
  .core .num span{ color: #5C5C5A; font-size: 0.5em; }
  .core .tiny{ margin-top: 6px; }

  .out-list{ display: grid; gap: 6px; }
  .out-row{ display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 8px 7px 8px; }
  .out-row .who{ display: flex; align-items: center; gap: 10px; min-width: 0; font-weight: 600; }
  .out-row .av{ flex: none; width: 30px; height: 30px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: #1a1a1a; filter: grayscale(1) brightness(0.6); font: 700 0.7rem var(--scoreboard); color: var(--text-dim); }
  .out-row .av img{ width: 100%; height: 100%; object-fit: cover; }
  .out-row .who span:last-child{ overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .rules{ list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
  .rules li{ display: flex; gap: 10px; align-items: flex-start; font-size: 0.9rem; }
  .rules svg{ flex: none; margin-top: 3px; color: var(--gold); }
  .rules a{ color: var(--gold); font-weight: 600; text-decoration: none; }
  .dates{ display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 16px; }
  .dates .d{ padding: 10px 4px; text-align: center; min-width: 0; }
  .dates .d b{ display: block; font: 700 1.25rem/1 var(--scoreboard); letter-spacing: 0.02em; }
  .dates .d small{ display: block; margin-top: 5px; font-size: 0.66rem; line-height: 1.2; color: var(--text-dim); }
  .dates .d.now{ border-color: var(--lead-line); background: var(--lead-tint); }
  .dates .d.now b{ color: var(--gold); }
  .dates .d.tbd b{ color: var(--text-dim); }

  /* Your card */
  .meter{ height: 6px; border-radius: 3px; background: rgba(255,255,255,0.07); overflow: hidden; margin-top: 8px; }
  .meter i{ display: block; height: 100%; width: var(--w, 0%); border-radius: 3px; background: linear-gradient(90deg, var(--gold-dim), var(--gold)); transition: width .5s; }
  .field{ display: grid; gap: 4px; min-width: 0; }
  .field > span{ color: var(--text-dim); font-size: 0.74rem; font-weight: 500; }
  .fgrid{ display: grid; gap: 8px; grid-template-columns: repeat(6, minmax(0, 1fr)); margin-top: 10px; }
  .fgrid > *{ grid-column: span 6; }
  .fgrid .c4{ grid-column: span 4; } .fgrid .c3{ grid-column: span 3; } .fgrid .c2{ grid-column: span 2; } .fgrid .c1{ grid-column: span 1; }
  .in{ width: 100%; min-width: 0; height: 44px; padding: 0 12px; background: var(--ctl-bg-solid); color: var(--text); border: 1px solid var(--ctl-line); border-radius: 10px; font: 16px var(--body); user-select: text; -webkit-user-select: text; }
  .in:focus{ outline: none; border-color: var(--gold); }
  .in:disabled{ opacity: 0.6; }
  .pills{ display: flex; flex-wrap: wrap; gap: 6px; }
  .pill{ display: inline-flex; align-items: center; gap: 7px; height: 44px; padding: 0 15px; border-radius: 22px; border: 1px solid var(--ctl-line); background: var(--ctl-bg); color: var(--text); font: 600 0.86rem var(--body); cursor: pointer; white-space: nowrap; }
  .pill[aria-pressed="true"]{ background: var(--gold); border-color: var(--gold); color: var(--ctl-on-ink); font-weight: 700; }
  .pill:disabled{ opacity: 0.5; cursor: default; }
  .pill .sw{ width: 13px; height: 13px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(255,255,255,0.35); flex: none; }
  .pills.sizes .pill{ min-width: 52px; justify-content: center; padding: 0 12px; }
  button:focus-visible, a:focus-visible, .in:focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }

  /* December: tap the days you could meet up. */
  .cal{ margin-top: 10px; }
  .cal-grid{ display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .cal .dow{ text-align: center; color: var(--text-dim); font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding-bottom: 2px; }
  .day{ position: relative; height: 48px; padding: 0; border-radius: 10px; border: 1px solid var(--item-line); background: var(--item); color: var(--text); cursor: pointer; display: grid; align-content: center; justify-items: center; gap: 1px; font-family: var(--body); min-width: 0; }
  .day b{ font-size: 0.92rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .day small{ font-size: 0.6rem; line-height: 1; color: var(--text-dim); font-weight: 600; min-height: 0.6rem; font-variant-numeric: tabular-nums; }
  .day.we b{ color: var(--gold); }
  .day[aria-pressed="true"]{ background: var(--gold); border-color: var(--gold); color: var(--ctl-on-ink); }
  .day[aria-pressed="true"] b, .day[aria-pressed="true"] small{ color: var(--ctl-on-ink); }
  .day:disabled{ cursor: default; opacity: 0.6; }
  .day.pad{ visibility: hidden; pointer-events: none; }
  .cal-foot{ display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 8px; }
  .link-btn{ background: none; border: 0; color: var(--gold); font: 600 0.82rem var(--body); cursor: pointer; padding: 10px 0; min-height: 44px; }
  .link-btn:disabled{ opacity: 0.4; cursor: default; }

  .priv{ margin-top: 20px; padding: 11px 12px; border-radius: 10px; border: 1px solid rgba(122,174,219,0.25); background: rgba(122,174,219,0.05); font-size: 0.8rem; color: #C9D9E6; line-height: 1.4; }
  .gold-btn{ display: block; width: 100%; margin-top: 14px; height: 48px; border-radius: 999px; border: 0; background: var(--gold); color: var(--ctl-on-ink); font: 700 0.95rem var(--body); cursor: pointer; }
  .gold-btn.line{ background: none; border: 1px solid var(--gold); color: var(--gold); }
  .gold-btn:disabled{ opacity: 0.45; cursor: default; }
  .sm-btn{ flex: none; height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--lead-line); background: none; color: var(--gold); font: 600 0.8rem var(--body); cursor: pointer; }
  .sm-btn:disabled{ color: var(--text-dim); border-color: var(--ctl-line); cursor: default; }
  .msg{ font-size: 0.84rem; margin-top: 10px; color: var(--text-dim); }
  .msg.bad{ color: var(--loss); font-weight: 600; }
  .msg.ok{ color: var(--text); }
  .msg.ok::before{ content: '✓ '; color: var(--gold); font-weight: 700; }
  @media (prefers-reduced-motion: reduce){ .snowbg .flakes{ animation: none; } .seat.pop{ animation: none; } .meter i{ transition: none; } }
</style>
</head>
<body>
  <div class="snowbg" id="snowbg" aria-hidden="true"></div>
  <div class="snowbg snow-top" aria-hidden="true"><span class="flakes"></span><span class="flakes b"></span></div>
  <div id="site-nav"></div>
  <div class="wrap narrow" id="wrap">
    <header>
      <div class="header-row">
        <div>
          <div class="eyebrow">Retirement League</div>
          <h1>Secret Santa</h1>
        </div>
      </div>
    </header>
    <div class="cols" id="cols">
      <div class="col" id="left">
        <section class="glass"><div class="panel-title">Who's in<span class="sub" id="closes"></span></div><div class="panel-body" id="who"><p class="tiny">Loading…</p></div></section>
        <section class="glass"><div class="panel-title">The rules<span class="sub">Same every year</span></div><div class="panel-body" id="rules"></div></section>
      </div>
      <section class="glass" id="card-sec" hidden><div class="panel-title">Your card<span class="sub" id="card-saved"></span></div><div class="panel-body" id="card"></div></section>
    </div>
    <footer id="site-footer" data-source="Shirts from thegoodshirts.com"></footer>
  </div>

<script src="nav.js?v=40"></script>
<script src="page-common.js?v=41"></script>
<script>
  const WORKER_URL = 'https://retirement-league-refresh-proxy.bradbutcher321.workers.dev';
  // Sign-ups open 12 AM Sun, Nov 1 and close 12 AM Sun, Nov 15 (Eastern), so
  // Sat, Nov 14 is the last day. The Worker enforces the same window.
  const OPENS = new Date('2026-11-01T00:00:00-04:00'), CLOSES = new Date('2026-11-15T00:00:00-05:00');
  // ?santa=signup shows the card before Nov 1 (the Worker still says no to a save, except to Brad and Jon).
  const PREVIEW = urlParam('santa') === 'signup';
  const SIZES = ['S', 'M', 'L', 'XL', '2XL', '3XL'];
  const COLORS = [['Black', '#111111'], ['White', '#F4F4F0'], ['Navy', '#1F2A44'], ['Light Blue', '#9CC7E8'], ['Light Pink', '#F2C4CE'], ['Natural', '#E9DFC8'], ['Sport Grey', '#A7A9AC'], ['Yellow Haze', '#F1D98A'], ['Forest Green', '#2E4A36']];
  const CHECK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
  const $ = id => document.getElementById(id);

  let names = [], logos = {}, signed = new Set(), counts = {}, mine = null, loaded = false, loadFailed = false;
  // The card as it's being filled in; `saved` is what the Worker has.
  let draft = blank(), saved = null, popFor = '';

  function blank() { return { name: '', street: '', apt: '', city: '', state: '', zip: '', size: '', colors: [], dates: [] }; }
  const phase = () => { const now = new Date(); return now < OPENS ? 'before' : now < CLOSES ? 'open' : 'closed'; };
  const stage = () => (PREVIEW && phase() === 'before' ? 'open' : phase());
  const auth = () => getAuth();
  const initials = n => monogram(n);

  // ---------- Who's in ----------
  function closesText() {
    const p = stage();
    if (p === 'before') return 'Opens Nov 1';
    if (p === 'closed') return 'Closed';
    const ms = CLOSES - new Date();
    const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5), m = Math.floor(ms % 36e5 / 6e4);
    return 'Closes in ' + (d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${Math.max(m, 1)}m`);
  }
  const logoHtml = n => logos[n] ? `<img src="${esc(logos[n])}" alt="">` : esc(initials(n));
  function renderWho() {
    $('closes').textContent = closesText();
    if (!loaded) { $('who').innerHTML = loadFailed ? '<p class="tiny">Couldn\'t load who\'s in. Try again in a minute.</p>' : '<p class="tiny">Loading…</p>'; return; }
    const meName = auth() && auth().manager;
    const n = names.filter(x => signed.has(x)).length, total = names.length;
    const p = stage();
    const seats = names.map((nm, i) => {
      const a = (i / total) * 2 * Math.PI - Math.PI / 2;
      return `<div class="seat ${signed.has(nm) ? 'on' : 'off'}${nm === popFor ? ' pop' : ''}" style="left:${(50 + 41 * Math.cos(a)).toFixed(2)}%;top:${(50 + 41 * Math.sin(a)).toFixed(2)}%"><div class="lg">${logoHtml(nm)}</div><span class="nm">${esc(nm)}</span></div>`;
    }).join('');
    const core = p === 'before'
      ? '<div class="num">Nov 1</div><div class="tiny">sign-ups open</div>'
      : `<div class="num">${n}<span>/${total}</span></div><div class="tiny">signed up</div>`;
    const out = names.filter(x => !signed.has(x) && x !== meName);
    let outHtml = '';
    if (p === 'open') {
      outHtml = `<div class="sec"><div class="cap"><span>Still out</span><span>${out.length ? out.length + ' left' : ''}</span></div><div class="out-list">${
        out.length ? out.map(x => `<div class="item out-row"><span class="who"><span class="av">${logoHtml(x)}</span><span>${esc(x)}</span></span>${auth() ? `<button type="button" class="sm-btn" data-nudge="${esc(x)}">Nudge</button>` : ''}</div>`).join('')
          : `<div class="item out-row"><span class="who">${CHECK}<span>${total && n >= total ? `All ${total} are in.` : 'Everyone else is in.'}</span></span></div>`}</div></div>`;
    }
    $('who').innerHTML = `<div class="ring">${seats}<div class="core">${core}</div></div>${outHtml}`;
    popFor = '';
  }
  $('who').addEventListener('click', async e => {
    const b = e.target.closest('[data-nudge]');
    if (!b || b.disabled) return;
    b.disabled = true; b.textContent = 'Sending…';
    try {
      const r = await fetch(WORKER_URL + '/santa/nudge', { method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders() }, body: JSON.stringify({ manager: b.dataset.nudge }) });
      const j = await r.json().catch(() => ({}));
      b.textContent = r.ok ? 'Nudged' : j.error === 'nudged_today' ? 'Nudged today' : j.error === 'already_in' ? 'Already in' : 'Try again';
      if (!r.ok && j.error !== 'nudged_today' && j.error !== 'already_in') b.disabled = false;
    } catch (err) { b.textContent = 'Try again'; b.disabled = false; }
  });

  // ---------- The rules ----------
  function renderRules() {
    const p = stage();
    $('rules').innerHTML = `
      <ul class="rules">
        <li>${CHECK}<span>One shirt from <a href="https://thegoodshirts.com/" target="_blank" rel="noopener">thegoodshirts.com</a>.</span></li>
        <li>${CHECK}<span>Order it in their size, wrap it and bring it to event night.</span></li>
      </ul>
      <div class="dates">
        <div class="item d${p === 'open' || p === 'before' ? ' now' : ''}"><b>NOV 14</b><small>Sign-ups close</small></div>
        <div class="item d tbd"><b>TBD</b><small>Reveal night</small></div>
        <div class="item d tbd"><b>TBD</b><small>Purchase by</small></div>
        <div class="item d tbd"><b>TBD</b><small>Event night</small></div>
      </div>`;
  }

  // ---------- Your card ----------
  const addressDone = d => !!(d.name.trim() && d.street.trim() && d.city.trim() && /^[A-Za-z]{2}$/.test(d.state.trim()) && /^\d{5}(-\d{4})?$/.test(d.zip.trim()));
  const done = d => [addressDone(d), !!d.size, d.colors.length > 0, d.dates.length > 0];
  const tick = ok => `<span class="ok">${ok ? '✓' : ''}</span>`;

  function renderCard() {
    const sec = $('card-sec'), p = stage();
    const show = p !== 'before';
    sec.hidden = !show;
    $('cols').classList.toggle('two', show);
    $('wrap').classList.toggle('narrow', !show);
    if (!show) return;
    const a = auth();
    if (!a) {
      $('card-saved').textContent = '';
      $('card').innerHTML = `<p class="tiny" style="font-size:.88rem">Sign in to sign up. Open the link the commissioner texted you, or tap You and sign in with your code.</p>
        <button type="button" class="gold-btn line" id="signin">Sign in</button>`;
      $('signin').onclick = () => { if (window.openYou) window.openYou(); };
      return;
    }
    const closed = p === 'closed', off = closed ? ' disabled' : '';
    const d = draft, ok = done(d), got = ok.filter(Boolean).length;
    $('card-saved').textContent = saved ? 'Saved ' + new Date(saved.updated).toLocaleDateString([], { month: 'short', day: 'numeric' }) : '';
    $('card').innerHTML = `
      <div class="tiny"><span id="prog">${got} of 4 done</span></div>
      <div class="meter"><i id="meter" style="--w:${got * 25}%"></i></div>
      <div class="sec"><div class="cap"><span>Ship to</span><span id="t-addr">${tick(ok[0])}</span></div>
        <div class="tiny">Provide your address in case an in-person event isn't possible.</div>
        <div class="fgrid">
          <label class="field"><span>Name on the box</span><input class="in" data-f="name" value="${esc(d.name)}" autocomplete="name" maxlength="60"${off}></label>
          <label class="field c4"><span>Street</span><input class="in" data-f="street" value="${esc(d.street)}" autocomplete="address-line1" maxlength="80"${off}></label>
          <label class="field c2"><span>Apt</span><input class="in" data-f="apt" value="${esc(d.apt)}" autocomplete="address-line2" maxlength="20"${off}></label>
          <label class="field c3"><span>City</span><input class="in" data-f="city" value="${esc(d.city)}" autocomplete="address-level2" maxlength="50"${off}></label>
          <label class="field c1"><span>State</span><input class="in" data-f="state" value="${esc(d.state)}" autocomplete="address-level1" maxlength="2" autocapitalize="characters"${off}></label>
          <label class="field c2"><span>ZIP</span><input class="in" data-f="zip" value="${esc(d.zip)}" autocomplete="postal-code" inputmode="numeric" maxlength="10"${off}></label>
        </div>
      </div>
      <div class="sec"><div class="cap"><span>Shirt size</span><span id="t-size">${tick(ok[1])}</span></div>
        <div class="pills sizes" data-group="size">${SIZES.map(x => `<button type="button" class="pill" data-size="${x}" aria-pressed="${d.size === x}"${off}>${x}</button>`).join('')}</div>
      </div>
      <div class="sec"><div class="cap"><span>Colors you prefer</span><span id="t-colors">${tick(ok[2])}</span></div>
        <div class="pills">${COLORS.map(([c, hex]) => `<button type="button" class="pill" data-color="${c}" aria-pressed="${d.colors.includes(c)}"${off}><i class="sw" style="background:${hex}"></i>${c}</button>`).join('')}</div>
      </div>
      <div class="sec"><div class="cap"><span>Dates in December</span><span id="t-dates">${tick(ok[3])}</span></div>
        <div class="tiny">Tap every day you could meet up for the event. The small numbers are how many others can make it.</div>
        <div class="cal">${calendarHtml(closed)}</div>
        <div class="cal-foot"><span class="tiny" id="datecount"></span><button type="button" class="link-btn" id="cleardates"${off}>Clear</button></div>
      </div>
      <div class="priv">Only your Santa sees your size and colors, and only after the reveal. You can change your card until sign-ups close.</div>
      ${closed ? '<p class="msg">Sign-ups are closed.</p>' : `<button type="button" class="gold-btn" id="save">${saved ? 'Update my card' : 'Save my card'}</button><p class="msg" id="msg" role="status"></p>`}`;
    updateDateCount();
  }
  function calendarHtml(closed) {
    // December 2026 starts on a Tuesday.
    const first = new Date(2026, 11, 1).getDay();
    const others = date => Math.max(0, (counts[date] || 0) - (saved && saved.dates.includes(date) ? 1 : 0));
    let h = '<div class="cal-grid">' + ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(x => `<span class="dow">${x}</span>`).join('');
    for (let i = 0; i < first; i++) h += '<span class="day pad"></span>';
    for (let n = 1; n <= 31; n++) {
      const date = `2026-12-${String(n).padStart(2, '0')}`, dow = (first + n - 1) % 7, c = others(date);
      h += `<button type="button" class="day${dow === 0 || dow === 6 ? ' we' : ''}" data-date="${date}" aria-pressed="${draft.dates.includes(date)}" aria-label="December ${n}${c ? `, ${c} others can make it` : ''}"${closed ? ' disabled' : ''}><b>${n}</b><small>${c || ''}</small></button>`;
    }
    return h + '</div>';
  }
  function updateDateCount() {
    const n = draft.dates.length, el = $('datecount'), clr = $('cleardates');
    if (el) el.textContent = n ? `${n} day${n === 1 ? '' : 's'} picked` : 'No days picked yet';
    if (clr && stage() !== 'closed') clr.disabled = !n;
  }
  // Refreshes the checkmarks and the meter without redrawing the fields (a redraw would drop the keyboard).
  function updateTicks() {
    const ok = done(draft), got = ok.filter(Boolean).length;
    ['addr', 'size', 'colors', 'dates'].forEach((k, i) => { const el = $('t-' + k); if (el) el.innerHTML = tick(ok[i]); });
    const prog = $('prog'), meter = $('meter');
    if (prog) prog.textContent = `${got} of 4 done`;
    if (meter) meter.style.setProperty('--w', got * 25 + '%');
  }
  function say(text, cls) { const m = $('msg'); if (m) { m.textContent = text; m.className = 'msg' + (cls ? ' ' + cls : ''); } }

  $('card').addEventListener('input', e => {
    const f = e.target.dataset && e.target.dataset.f;
    if (!f) return;
    draft[f] = f === 'state' ? e.target.value.toUpperCase() : e.target.value;
    if (f === 'state') e.target.value = draft.state;
    updateTicks();
  });
  $('card').addEventListener('click', e => {
    const t = e.target;
    const size = t.closest('[data-size]'), color = t.closest('[data-color]'), day = t.closest('[data-date]');
    if (size && !size.disabled) {
      draft.size = size.dataset.size;
      document.querySelectorAll('[data-size]').forEach(b => b.setAttribute('aria-pressed', b === size));
    } else if (color && !color.disabled) {
      const c = color.dataset.color, i = draft.colors.indexOf(c);
      if (i < 0) draft.colors.push(c); else draft.colors.splice(i, 1);
      color.setAttribute('aria-pressed', i < 0);
    } else if (day && !day.disabled) {
      const dt = day.dataset.date, i = draft.dates.indexOf(dt);
      if (i < 0) draft.dates.push(dt); else draft.dates.splice(i, 1);
      draft.dates.sort();
      day.setAttribute('aria-pressed', i < 0);
      updateDateCount();
    } else if (t.closest('#cleardates')) {
      draft.dates = [];
      document.querySelectorAll('[data-date]').forEach(b => b.setAttribute('aria-pressed', 'false'));
      updateDateCount();
    } else if (t.closest('#save')) { save(); return; }
    else return;
    updateTicks();
  });

  const WHY = {
    not_open: 'Sign-ups open Nov 1.', closed: 'Sign-ups are closed.', signed_out: 'Your sign-in has run out. Tap You and sign in again.',
    no_size: 'Pick your shirt size first.', no_address: 'Add your name, street, city, state and ZIP first.',
  };
  async function save() {
    const btn = $('save');
    if (!draft.size) { say(WHY.no_size, 'bad'); return; }
    if (!addressDone(draft)) { say(WHY.no_address, 'bad'); return; }
    btn.disabled = true; say('Saving…');
    try {
      const r = await fetch(WORKER_URL + '/santa', { method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders() }, body: JSON.stringify(draft) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { say(WHY[j.error] || "Couldn't save. Try again.", 'bad'); btn.disabled = false; return; }
      const firstTime = !saved;
      saved = j.mine; mine = j.mine;
      const me = auth().manager;
      if (!signed.has(me)) popFor = me;
      signed.add(me);
      renderWho();
      $('card-saved').textContent = 'Saved ' + new Date(saved.updated).toLocaleDateString([], { month: 'short', day: 'numeric' });
      btn.textContent = 'Update my card'; btn.disabled = false;
      say(firstTime ? "You're in." : 'Saved.', 'ok');
    } catch (err) { say("Couldn't save. Check your connection and try again.", 'bad'); btn.disabled = false; }
  }

  // ---------- Loading ----------
  async function loadSantaState() {
    const r = await fetch(WORKER_URL + '/santa', { headers: authHeaders(), cache: 'no-store' });
    if (!r.ok) throw new Error('santa ' + r.status);
    const j = await r.json();
    signed = new Set(j.signed); counts = j.dates || {}; mine = j.mine; saved = j.mine;
    draft = j.mine ? { ...blank(), ...j.mine, colors: [...j.mine.colors], dates: [...j.mine.dates] } : blank();
  }
  async function loadRoster() {
    const [lg, fr] = await Promise.all([
      fetch('data/league.json').then(r => r.json()),
      fetch('data/franchise.json').then(r => r.json()).catch(() => ({ players: [] })),
    ]);
    const year = Math.max(...lg.seasons.map(s => s.year));
    names = [...new Set(lg.seasons.filter(s => s.year === year).map(s => s.player))].sort((a, b) => a.localeCompare(b));
    logos = {};
    for (const p of fr.players || []) if (p.current_team_logo) logos[p.name] = p.current_team_logo;
  }
  function drawAll() { renderWho(); renderRules(); renderCard(); }
  async function init() {
    renderRules(); renderCard();
    try { await Promise.all([loadRoster(), loadSantaState()]); loaded = true; } catch (err) { loadFailed = true; console.error(err); }
    drawAll();
  }
  // Signing in or out on this page changes whose card this is.
  addEventListener('rl-auth', async () => { try { await loadSantaState(); } catch (e) {} drawAll(); });
  setInterval(() => { $('closes').textContent = closesText(); }, 60 * 1000);
  init();

  // ---------- Shirts drifting down with the snow ----------
  // Any of the shirt designs on thegoodshirts.com (icons/santa/shirts/NNN.webp).
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const bg = $('snowbg'), SHIRTS = 957;
    setInterval(() => {
      if (document.hidden) return;
      const im = new Image(), w = 22 + Math.random() * 22, H = innerHeight;
      im.src = `icons/santa/shirts/${String(Math.floor(Math.random() * SHIRTS)).padStart(3, '0')}.webp`;
      im.alt = '';
      im.style.left = (Math.random() * 96).toFixed(1) + '%';
      im.style.width = w.toFixed(0) + 'px';
      bg.appendChild(im);
      im.animate([{ transform: `translateY(-60px) rotate(${Math.random() * 60 - 30}deg)` }, { transform: `translate(${Math.random() * 40 - 20}px,${H + 20}px) rotate(${Math.random() * 120 - 60}deg)` }],
        { duration: 11000 + Math.random() * 6000, easing: 'linear' }).finished.then(() => im.remove(), () => im.remove());
    }, 1100);
  }
</script>
</body>
</html>
