<head>

<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2">

<style>
  /* ---------- Secret Santa ----------
     One page for the whole thing, following the clock (worker/src/santa.js
     keeps the same dates): Sign-ups (Nov 1 to 12), Countdown (to 9:00 PM
     Nov 13), the Room (everyone opens together), your own reveal, Gifting
     (your giftee, their shirt, your gift tracker, the mailbox, your guess)
     and Unwrap night (the loop, the haul, the detectives). Commissioners get
     their tools at the bottom. ?santa=signup|countdown|room|reveal|gifting|unwrap
     previews a stage with example data (nothing is saved). */
  :root{ --gold-hi: #F3E2B3; --wax: #7A1D22; --wax-hi: #B23A3A; }
  [hidden]{ display: none !important; }
  .wrap.narrow{ max-width: 640px; }
  .wrap{ position: relative; z-index: 1; }

  /* Snow and tiny shirts drifting down behind the page, like the card on Live. */
  .snowbg{ position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  /* The flakes drift in front of the cards (too small to hide anything); the shirts stay behind. */
  .snowbg.snow-top{ z-index: 2; }
  .snowbg .flakes{ position: absolute; inset: 0; opacity: 0.75; animation: snowfall 11s linear infinite;
    background-size: 230px 190px;
    background-image: radial-gradient(1.8px 1.8px at 20% 30%, rgba(214,230,242,0.7), transparent), radial-gradient(1.1px 1.1px at 62% 72%, rgba(214,230,242,0.6), transparent), radial-gradient(1.5px 1.5px at 82% 18%, rgba(214,230,242,0.6), transparent), radial-gradient(1.1px 1.1px at 40% 88%, rgba(214,230,242,0.5), transparent), radial-gradient(1.3px 1.3px at 8% 62%, rgba(214,230,242,0.5), transparent); }
  .snowbg .flakes.b{ background-size: 310px 260px; animation-duration: 17s; opacity: 0.55;
    background-image: radial-gradient(2.2px 2.2px at 70% 40%, rgba(214,230,242,0.6), transparent), radial-gradient(1.4px 1.4px at 28% 12%, rgba(214,230,242,0.5), transparent), radial-gradient(1.2px 1.2px at 50% 66%, rgba(214,230,242,0.6), transparent), radial-gradient(1.6px 1.6px at 90% 90%, rgba(214,230,242,0.5), transparent); }
  @keyframes snowfall{ to{ background-position: 30px 190px; } }
  .snowbg img{ position: absolute; top: 0; opacity: 0.18; height: auto; }
  .cols{ display: grid; gap: 14px; align-items: start; }
  .cols > *, .col{ min-width: 0; }
  .col{ display: grid; gap: 14px; }
  .col > section, .cols > section{ margin: 0; }
  @media (min-width: 900px){ .cols.two{ grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr); } }
  .stage-view{ display: grid; gap: 14px; }
  .stage-view > section{ margin: 0; }
  .panel-body{ padding: 12px 18px 18px; }
  .sub{ color: var(--text-dim); font-size: 0.8rem; font-weight: 500; }
  .tiny{ color: var(--text-dim); font-size: 0.78rem; line-height: 1.4; }
  .cap{ display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--text-dim); font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
  .cap .ok{ color: var(--turf); letter-spacing: 0.04em; }
  .sec{ margin-top: 20px; }
  .sec:first-child{ margin-top: 0; }
  .center{ text-align: center; }

  /* The ring: the same on every stage (only the middle and the lit names change). */
  .ring{ position: relative; width: min(100%, 430px); aspect-ratio: 1; margin: 4px auto 22px; }
  .who-ring > .tiny{ text-align: center; }
  .seat{ position: absolute; width: 17%; aspect-ratio: 1; transform: translate(-50%, -50%); transition: transform .5s; }
  .seat .lg{ display: grid; place-items: center; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: #1a1a1a; box-shadow: 0 0 0 1px rgba(255,255,255,0.18); font: 700 0.8rem var(--scoreboard); color: var(--text-dim); transition: filter .5s, opacity .5s, box-shadow .5s; }
  .seat .lg img{ width: 100%; height: 100%; object-fit: cover; display: block; }
  .seat.off .lg{ filter: grayscale(1) brightness(0.5); opacity: 0.55; }
  .seat.on .lg{ box-shadow: 0 0 0 1.5px var(--lead-line), 0 0 14px rgba(212,180,106,0.3); }
  .seat .nm{ position: absolute; left: 50%; top: 100%; transform: translateX(-50%); margin-top: 4px; font-size: 0.66rem; font-weight: 600; color: var(--text-dim); white-space: nowrap; }
  .seat.on .nm{ color: #E8E6DF; }
  .seat.arrive{ animation: seatpop .8s cubic-bezier(.2,1.6,.4,1); }
  @keyframes seatpop{ 0%{ transform: translate(-50%, -50%) scale(.6); } 100%{ transform: translate(-50%, -50%) scale(1); } }
  .seat .bub{ position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); font-size: 20px; pointer-events: none; animation: bub 2.2s ease-out forwards; }
  @keyframes bub{ 0%{ opacity: 0; transform: translate(-50%, 8px) scale(.5); } 15%{ opacity: 1; transform: translate(-50%, 0) scale(1.15); } 100%{ opacity: 0; transform: translate(-50%, -70px) scale(1); } }
  .core{ position: absolute; inset: 24%; border-radius: 50%; display: grid; place-content: center; text-align: center; border: 1px solid var(--lead-line); background: radial-gradient(circle at 50% 40%, rgba(212,180,106,0.10), rgba(0,0,0,0) 70%); transition: box-shadow .6s, border-color .6s; }
  .core .num{ font: 800 5rem/0.85 var(--scoreboard); color: var(--gold); }
  .core .num span{ color: #5C5C5A; font-size: 0.5em; }
  .core .tiny{ margin-top: 8px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; }
  .core .until{ margin-top: 4px; color: var(--text-dim); font-size: 0.7rem; opacity: 0.8; }
  .ring.go .core{ border-color: rgba(212,180,106,.6); box-shadow: 0 0 80px rgba(212,180,106,.25), inset 0 0 40px rgba(212,180,106,.12); }
  .ring.go .core .num{ color: var(--gold-hi); }
  /* Unwrap night draws the loop over the same ring. */
  .ring svg.links{ position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .ring svg.links path{ fill: none; stroke: var(--gold); stroke-width: .55; stroke-linecap: round; filter: drop-shadow(0 0 1.2px rgba(243,226,179,.9)); }
  .ring svg.links path.old{ stroke: rgba(212,180,106,.5); filter: none; }
  .ring.fin svg.links path{ stroke-dasharray: 1.2 2.2; animation: march 1.4s linear infinite; }
  @keyframes march{ to{ stroke-dashoffset: -3.4; } }
  .ring .seat.dimd .lg{ filter: grayscale(.8) brightness(.55); }
  .ring .seat.hot{ transform: translate(-50%, -50%) scale(1.15); }
  .ring .seat.hot .lg{ box-shadow: 0 0 0 2px var(--gold), 0 0 22px rgba(212,180,106,.7); filter: none; opacity: 1; }

  .out-list{ display: grid; gap: 6px; }
  .out-row{ display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 8px 7px 8px; }
  .out-row .who{ display: flex; align-items: center; gap: 10px; min-width: 0; font-weight: 600; }
  .av{ flex: none; width: 30px; height: 30px; border-radius: 50%; overflow: hidden; display: inline-grid; place-items: center; background: #1a1a1a; font: 700 0.7rem var(--scoreboard); color: var(--text-dim); box-shadow: 0 0 0 1px rgba(255,255,255,0.12); vertical-align: middle; }
  .av img{ width: 100%; height: 100%; object-fit: cover; }
  .av.off{ filter: grayscale(1) brightness(0.6); }
  .out-row .who span:last-child{ overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .out-row .who small{ color: var(--text-dim); font-weight: 500; font-size: 0.74rem; }
  .stackav{ display: flex; flex-wrap: wrap; row-gap: 6px; }
  .stackav .av{ margin-left: -7px; box-shadow: 0 0 0 2px #121212; }
  .stackav .av:first-child{ margin-left: 0; }

  .rules{ list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
  .rules li{ display: flex; gap: 10px; align-items: flex-start; font-size: 0.9rem; }
  .rules svg{ flex: none; margin-top: 3px; color: var(--gold); }
  .rules a{ color: var(--gold); font-weight: 600; text-decoration: none; }
  .dates{ display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 16px; }
  .dates .d{ padding: 10px 4px; text-align: center; min-width: 0; }
  .dates .d b{ display: block; font: 700 1.25rem/1 var(--scoreboard); letter-spacing: 0.02em; }
  .dates .d small{ display: block; margin-top: 5px; font-size: 0.66rem; line-height: 1.2; color: var(--text-dim); }
  .dates .d.now{ border-color: var(--lead-line); background: var(--lead-tint); }
  .dates .d.now b{ color: var(--gold); }
  .dates .d.tbd b{ color: var(--text-dim); }
  .stage-view > .dates{ margin-top: 0; }

  /* Your card */
  .meter{ height: 6px; border-radius: 3px; background: rgba(255,255,255,0.07); overflow: hidden; margin-top: 8px; }
  .meter i{ display: block; height: 100%; width: var(--w, 0%); border-radius: 3px; background: linear-gradient(90deg, var(--gold-dim), var(--gold)); transition: width .5s; }
  .field{ display: grid; gap: 4px; min-width: 0; }
  .field > span{ color: var(--text-dim); font-size: 0.74rem; font-weight: 500; }
  .fgrid{ display: grid; gap: 8px; grid-template-columns: repeat(6, minmax(0, 1fr)); margin-top: 10px; }
  .fgrid > *{ grid-column: span 6; }
  .fgrid .c4{ grid-column: span 4; } .fgrid .c3{ grid-column: span 3; } .fgrid .c2{ grid-column: span 2; } .fgrid .c1{ grid-column: span 1; }
  .in{ width: 100%; min-width: 0; height: 44px; padding: 0 12px; background: var(--ctl-bg-solid); color: var(--text); border: 1px solid var(--ctl-line); border-radius: 10px; font: 16px var(--body); user-select: text; -webkit-user-select: text; }
  .in:focus{ outline: none; border-color: var(--gold); }
  .in:disabled{ opacity: 0.6; }
  input[type="date"].in, input[type="datetime-local"].in{ -webkit-appearance: none; appearance: none; color-scheme: dark; }
  .pills{ display: flex; flex-wrap: wrap; gap: 6px; }
  .pill{ display: inline-flex; align-items: center; gap: 7px; height: 44px; padding: 0 15px; border-radius: 22px; border: 1px solid var(--ctl-line); background: var(--ctl-bg); color: var(--text); font: 600 0.86rem var(--body); cursor: pointer; white-space: nowrap; }
  .pill[aria-pressed="true"]{ background: var(--gold); border-color: var(--gold); color: var(--ctl-on-ink); font-weight: 700; }
  .pill:disabled{ opacity: 0.5; cursor: default; }
  .pill.sm{ height: 34px; padding: 0 12px; font-size: 0.8rem; }
  .sw{ display: inline-block; width: 13px; height: 13px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(255,255,255,0.35); flex: none; }
  .pills.sizes .pill{ min-width: 52px; justify-content: center; padding: 0 12px; }
  button:focus-visible, a:focus-visible, .in:focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }

  /* December: tap the days you could meet up. */
  .cal{ margin-top: 10px; }
  .cal-grid{ display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .cal .dow{ text-align: center; color: var(--text-dim); font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding-bottom: 2px; }
  .day{ position: relative; height: 48px; padding: 0; border-radius: 10px; border: 1px solid var(--item-line); background: var(--item); color: var(--text); cursor: pointer; display: grid; align-content: center; justify-items: center; gap: 1px; font-family: var(--body); min-width: 0; }
  .day b{ font-size: 0.92rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .day small{ font-size: 0.6rem; line-height: 1; color: var(--text-dim); font-weight: 600; min-height: 0.6rem; font-variant-numeric: tabular-nums; }
  .day.we b{ color: var(--gold); }
  .day[aria-pressed="true"]{ background: var(--gold); border-color: var(--gold); color: var(--ctl-on-ink); }
  .day[aria-pressed="true"] b, .day[aria-pressed="true"] small{ color: var(--ctl-on-ink); }
  .day:disabled{ cursor: default; opacity: 0.6; }
  .day.pad{ visibility: hidden; pointer-events: none; }
  .cal-foot{ display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 8px; }
  .link-btn{ background: none; border: 0; color: var(--gold); font: 600 0.82rem var(--body); cursor: pointer; padding: 10px 0; min-height: 44px; }
  .link-btn:disabled{ opacity: 0.4; cursor: default; }

  .priv{ margin-top: 20px; padding: 11px 12px; border-radius: 10px; border: 1px solid rgba(122,174,219,0.25); background: rgba(122,174,219,0.05); font-size: 0.8rem; color: #C9D9E6; line-height: 1.4; }
  .gold-btn{ display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 14px; height: 48px; padding: 0 18px; border-radius: 999px; border: 0; background: var(--gold); color: var(--ctl-on-ink); font: 700 0.95rem var(--body); cursor: pointer; text-decoration: none; }
  .gold-btn.line{ background: none; border: 1px solid var(--gold); color: var(--gold); }
  .gold-btn.ghost{ background: var(--ctl-bg); border: 1px solid var(--ctl-line); color: var(--text); }
  .gold-btn.auto{ width: auto; display: inline-flex; }
  .gold-btn:disabled{ opacity: 0.45; cursor: default; }
  .sm-btn{ flex: none; height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--lead-line); background: none; color: var(--gold); font: 600 0.8rem var(--body); cursor: pointer; white-space: nowrap; }
  .sm-btn:disabled{ color: var(--text-dim); border-color: var(--ctl-line); cursor: default; }
  .btn-row{ display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-row > *{ flex: 1 1 150px; margin-top: 0; }
  .msg{ font-size: 0.84rem; margin-top: 10px; color: var(--text-dim); }
  .msg.bad{ color: var(--loss); font-weight: 600; }
  .msg.ok{ color: var(--text); }
  .msg.ok::before{ content: '✓ '; color: var(--gold); font-weight: 700; }
  .chip{ display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 12px; font-size: 0.72rem; font-weight: 600; white-space: nowrap; border: 1px solid var(--lead-line); color: var(--gold); background: var(--lead-tint); }
  .chip.mute{ border-color: var(--ctl-line); color: var(--text-dim); background: var(--item); }
  .chip.live{ border-color: rgba(214,98,79,.55); color: #F0A091; background: rgba(214,98,79,.08); }
  .chip.live i{ width: 7px; height: 7px; border-radius: 50%; background: var(--loss); animation: ping 1.6s infinite; }
  @keyframes ping{ 0%{ box-shadow: 0 0 0 0 rgba(214,98,79,.6); } 70%, 100%{ box-shadow: 0 0 0 7px rgba(214,98,79,0); } }
  .preview-btn{ display: block; margin: 4px auto 0; height: 36px; padding: 0 16px; border-radius: 18px; border: 1px dashed rgba(122,174,219,.5); background: none; color: #9CC7E8; font: 600 0.8rem var(--body); cursor: pointer; }
  .preview-note{ text-align: center; color: #9CC7E8; font-size: 0.74rem; margin: -4px 0 4px; }

  /* Switches (Remind me, Ship instead) */
  .trow{ display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .trow + .trow{ margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--item-line); }
  .trow > span{ font-size: 0.9rem; font-weight: 500; }
  .switch{ position: relative; width: 50px; height: 30px; border-radius: 15px; border: 0; background: rgba(255,255,255,.14); flex: none; transition: background .25s; cursor: pointer; }
  .switch::after{ content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .3s cubic-bezier(.3,1.4,.5,1); box-shadow: 0 1px 3px rgba(0,0,0,.4); }
  .switch[aria-checked="true"]{ background: var(--gold); }
  .switch[aria-checked="true"]::after{ transform: translateX(20px); }
  .switch:disabled{ opacity: .5; cursor: default; }

  /* ---------- Countdown ---------- */
  .cd{ text-align: center; padding: 0 0 4px; }
  .envmini{ position: relative; width: min(62%, 260px); aspect-ratio: 1.5; margin: 6px auto 0; animation: floaty 6s ease-in-out infinite; }
  @keyframes floaty{ 50%{ transform: translateY(-8px) rotate(-.6deg); } }
  .menv{ position: absolute; inset: 0; border-radius: 10px; background: linear-gradient(160deg, #2a241a, #15120d 70%); border: 1px solid rgba(212,180,106,.35); box-shadow: 0 30px 60px -20px rgba(0,0,0,.9), 0 0 60px -10px rgba(212,180,106,.25); overflow: hidden; }
  .menv::before{ content: ""; position: absolute; inset: 0 0 auto 0; height: 58%; clip-path: polygon(0 0, 100% 0, 50% 100%); background: linear-gradient(#332b1f, #1f1a12); }
  .menv::after{ content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255,240,200,.12) 48%, transparent 60%); background-size: 250% 100%; animation: sheen 5s ease-in-out infinite; }
  @keyframes sheen{ 0%{ background-position: 120% 0; } 60%, 100%{ background-position: -60% 0; } }
  .menv .to{ position: absolute; left: 0; right: 0; bottom: 12%; font: 700 15px/1 var(--scoreboard); letter-spacing: .2em; text-transform: uppercase; color: rgba(243,226,179,.8); }
  .mseal{ position: absolute; left: 50%; top: 58%; width: 22%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 47% 53% 50% 50% / 52% 46% 54% 48%; background: radial-gradient(circle at 35% 30%, var(--wax-hi), var(--wax) 55%, #4a0f13); box-shadow: inset 0 -3px 6px rgba(0,0,0,.45), inset 0 2px 3px rgba(255,160,160,.25), 0 4px 10px rgba(0,0,0,.5); display: grid; place-items: center; font: 800 13px/1 var(--scoreboard); color: rgba(255,215,190,.75); z-index: 2; }
  /* The shirts circle below the envelope, like a ring lying at its feet. */
  .carousel{ position: relative; height: clamp(120px, 36vw, 170px); max-width: 560px; margin: 0 auto 4px; }
  .carousel .csh{ position: absolute; left: 0; top: 0; width: clamp(56px, 17vw, 96px); height: auto; pointer-events: none; will-change: transform, opacity; filter: drop-shadow(0 8px 12px rgba(0,0,0,.6)); }
  .digits{ display: flex; justify-content: center; align-items: flex-start; gap: min(2.2vw, 14px); }
  .digits .u{ display: grid; justify-items: center; gap: 8px; }
  .digits .v{ font: 800 min(15vw, 104px)/.9 var(--scoreboard); font-variant-numeric: tabular-nums; color: var(--text); text-shadow: 0 0 40px rgba(212,180,106,.18); display: flex; }
  .digits .u:first-child .v{ color: var(--gold); }
  .digits .colon{ font: 700 min(9vw, 62px)/1 var(--scoreboard); color: #5C5C5A; padding-top: .12em; }
  .digits .lb{ font: 600 10px/1 var(--body); letter-spacing: .2em; color: var(--text-dim); }
  .dg{ position: relative; display: inline-block; width: .56em; height: .92em; overflow: hidden; }
  .dg b{ position: absolute; inset: 0; text-align: center; font-weight: inherit; }
  .dg b.enter{ animation: dgin .5s cubic-bezier(.2,.9,.2,1) both; }
  .dg b.leave{ animation: dgout .5s cubic-bezier(.5,0,.8,.4) both; }
  @keyframes dgin{ from{ transform: translateY(-90%); opacity: 0; filter: blur(4px); } }
  @keyframes dgout{ to{ transform: translateY(90%); opacity: 0; filter: blur(4px); } }
  .when{ margin-top: 16px; font-weight: 600; }
  .when span{ color: var(--text-dim); font-weight: 500; }

  /* ---------- The Room ---------- */
  .feed{ display: grid; gap: 6px; max-height: 170px; overflow: hidden; -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent); margin-top: 12px; }
  .feed .ln{ display: flex; gap: 8px; align-items: center; font-size: 0.82rem; animation: fin .4s ease-out; }
  .feed .ln .av{ width: 22px; height: 22px; }
  .feed .ln span{ color: var(--text-dim); }
  @keyframes fin{ from{ opacity: 0; transform: translateY(-6px); } }
  .react{ display: flex; justify-content: center; gap: 8px; }
  .react button{ width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--ctl-line); background: var(--item); font-size: 22px; transition: transform .15s; cursor: pointer; }
  .react button:active{ transform: scale(.88); }
  .dimmer{ position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 150; transition: opacity 1s; }

  /* ---------- The reveal (full screen) ---------- */
  .cine{ position: fixed; inset: 0; z-index: 200; background: #000; overflow: hidden; opacity: 0; transition: opacity .6s; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; container-type: inline-size; color: var(--text); font-family: var(--body); }
  .cine.on{ opacity: 1; }
  .cine canvas{ position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
  .cine .vig{ position: absolute; inset: 0; z-index: 3; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 35%, rgba(0,0,0,.85) 100%); }
  .cine .bars i{ position: absolute; left: 0; right: 0; height: 9%; background: #000; z-index: 20; transform: scaleY(0); transition: transform 1.1s cubic-bezier(.7,0,.2,1); }

  .seal{ position: absolute; left: 50%; top: 56%; width: 27%; aspect-ratio: 1; transform: translate(-50%, -50%); z-index: 6; border: 0; padding: 0; background: none; touch-action: none; cursor: pointer; }

  @media (min-width: 560px){ .guess{ grid-template-columns: repeat(6, minmax(0, 1fr)); } .sgrid{ grid-template-columns: repeat(4, minmax(0, 1fr)); } }

  /* ---------- Unwrap night ---------- */
  .capt{ min-height: 120px; display: grid; align-content: center; margin: 0 0 12px; }
  .capt .pair{ display: flex; align-items: center; justify-content: center; gap: 10px; animation: fin .5s ease-out; flex-wrap: wrap; }

  .capt .gs.y{ color: var(--turf); }
  .haul{ display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  @media (min-width: 560px){ .haul{ grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .htile{ border-radius: 14px; border: 1px solid var(--item-line); background: var(--item); padding: 8px; display: grid; gap: 4px; min-width: 0; color: var(--text); text-decoration: none; }
  .htile .ph{ aspect-ratio: 1; display: grid; place-items: center; color: var(--text-dim); }
  .htile .ph img{ width: 92%; height: 92%; object-fit: contain; }
  .htile .ph svg{ width: 40%; height: 40%; opacity: .4; }
  .htile b{ font-size: 0.72rem; }

  .dets .item{ display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 10px 7px 8px; }

  .dets .r.y{ color: var(--turf); }

  /* ---------- Commissioner ---------- */
  .commish-view{ margin-top: 14px; }
  .commish-view > .cap{ margin: 6px 2px 10px; }
  .drawgrid{ position: relative; height: 150px; margin: 4px 0 12px; }
  .drawgrid .slip{ position: absolute; width: 15%; aspect-ratio: 1; transition: left .55s cubic-bezier(.5,0,.3,1), top .55s cubic-bezier(.5,0,.3,1); }
  .drawgrid.init .slip{ transition: none; }
  .drawgrid .slip .av{ width: 100%; height: 100%; }
  .drawgrid .slip .sealbox{ position: absolute; inset: -6%; border-radius: 12px; background: linear-gradient(160deg, #2b2419, #141109); border: 1px solid rgba(212,180,106,.4); display: grid; place-items: center; opacity: 0; transform: rotateY(90deg); transition: opacity .3s, transform .5s; }
  .drawgrid .slip .sealbox i{ width: 36%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--wax-hi), var(--wax)); }
  .drawgrid.sealed .slip .sealbox{ opacity: 1; transform: none; }
  .mrow{ display: flex; align-items: center; gap: 10px; padding: 7px 8px; }

  .ss-toast{ position: fixed; z-index: 260; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; padding: 10px 16px; border-radius: 20px; background: rgba(30,30,30,.94); border: 1px solid var(--ctl-line); font: 600 0.84rem var(--body); color: var(--text); white-space: nowrap; transition: all .35s cubic-bezier(.3,1.3,.5,1); }
  .ss-toast.on{ opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce){ .snowbg .flakes, .envmini, .menv::after{ animation: none; } .seat.arrive{ animation: none; } .meter i{ transition: none; } }

<body>
  <div class="snowbg" id="snowbg" aria-hidden="true"></div>

      <div class="header-row">

        </div>
      </div>
    </header>

      <div class="col" id="left">
        <div id="who" class="who-ring"><p class="tiny">Loading…</p></div>
        <section class="glass" id="out-sec" hidden><div class="panel-title">Still out<span class="sub" id="out-n"></span></div><div class="panel-body" id="out"></div></section>
        <section class="glass"><div class="panel-title">The rules<span class="sub">Same every year</span></div><div class="panel-body" id="rules"></div></section>
      </div>
      <section class="glass" id="card-sec" hidden><div class="panel-title">Your card<span class="sub" id="card-saved"></span></div><div class="panel-body" id="card"></div></section>
    </div>
    <div class="stage-view" id="stage" hidden></div>

  </div>
  <div class="dimmer" id="dimmer"></div>
  <div class="cine" id="cine" hidden></div>
  <div class="ss-toast" id="toast" role="status"></div>

<script src="nav.js?v=41"></script>
<script src="page-common.js?v=41"></script>
<script>
  const WORKER_URL = 'https://retirement-league-refresh-proxy.bradbutcher321.workers.dev';
  // The same dates as worker/src/santa.js. Sign-ups open 12 AM Sun, Nov 1 and
  // close 12 AM Fri, Nov 13 (Eastern), so Thu, Nov 12 is the last day. The
  // Room opens at 9:00 PM that Friday; from 9:30 a commissioner can start it.
  const OPENS = new Date('2026-11-01T00:00:00-04:00'), CLOSES = new Date('2026-11-13T00:00:00-05:00');
  const REVEAL = new Date('2026-11-13T21:00:00-05:00'), FORCE_AT = new Date(REVEAL.getTime() + 30 * 60 * 1000);
  // ?santa=signup shows the card before Nov 1 (the Worker still says no to a
  // save, except to commissioners). Any other stage is an example with made-up
  // data that never saves.
  const PV = urlParam('santa');
  const PREVIEW = PV === 'signup';
  const DEMO_STAGES = ['countdown', 'room', 'reveal', 'gifting', 'unwrap'];
  const DEMO = DEMO_STAGES.includes(PV);
  let demoStage = DEMO ? PV : null;
  const SIZES = ['S', 'M', 'L', 'XL', '2XL', '3XL'];
  const COLORS = [['Black', '#111111'], ['White', '#F4F4F0'], ['Navy', '#1F2A44'], ['Light Blue', '#9CC7E8'], ['Light Pink', '#F2C4CE'], ['Natural', '#E9DFC8'], ['Sport Grey', '#A7A9AC'], ['Yellow Haze', '#F1D98A'], ['Forest Green', '#2E4A36']];
  const EMOJI = ['🎁', '🔥', '😂', '👀', '🎄'];
  const SHIRTS = 957;
  const CHECK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
  const LOCK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
  const GIFT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="8" width="18" height="5" rx="1"/><path d="M5 13v7h14v-7M12 8v12M12 8c-2-4-6-4-6-1.5S12 8 12 8zm0 0c2-4 6-4 6-1.5S12 8 12 8z"/></svg>';
  const SEND = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = id => document.getElementById(id);
  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const shirtImg = i => `icons/santa/shirts/${String(i).padStart(3, '0')}.webp`;
  const hex = c => (COLORS.find(x => x[0] === c) || [, '#888'])[1];
  const swatch = c => `<i class="sw" style="background:${hex(c)}"></i>`;

  let names = [], logos = {}, teams = {}, signed = new Set(), counts = {}, mine = null, loaded = false, loadFailed = false;
  // The whole status from the Worker (GET /santa), or the example one.
  let S = null;
  // The card as it's being filled in; `saved` is what the Worker has.
  let draft = blank(), saved = null, popFor = '';

  function blank() { return { name: '', street: '', apt: '', city: '', state: '', zip: '', size: '', colors: [], dates: [] }; }
  const phase = () => { const now = new Date(); return now < OPENS ? 'before' : now < CLOSES ? 'open' : now < REVEAL ? 'countdown' : 'after'; };
  const auth = () => getAuth();
  const meName = () => (auth() && auth().manager) || (DEMO ? names[0] : null);
  const inDraw = () => !!(S && S.crew && meName() && S.crew.includes(meName()));
  const isCommish = () => isCommissioner(auth());
  const initials = n => monogram(n);
  let openedHere = false;
  // Which stage the page is showing.
  function stage() {
    if (DEMO) return demoStage;
    const p = phase();
    if (PREVIEW && p === 'before') return 'open';
    if (p !== 'after') return p;
    if (!S) return 'room';
    if (S.unmasked) return 'unwrap';
    if (!S.started) return 'room';
    if (S.you && !S.you.opened && !openedHere) return 'reveal';
    return 'gifting';
  }

  function toast(text) {
    const t = $('toast'); t.textContent = text; t.classList.add('on');
    clearTimeout(toast.id); toast.id = setTimeout(() => t.classList.remove('on'), 2400);
  }
  async function post(path, body) {
    if (DEMO) { toast('Preview: nothing is saved'); return { ok: true, j: { ok: true } }; }
    const r = await fetch(WORKER_URL + path, { method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders() }, body: JSON.stringify(body || {}) });
    const j = await r.json().catch(() => ({}));
    return { ok: r.ok, j };
  }

  // ---------- Dates ----------
  const fmtDay = d => new Date(d + 'T12:00:00').toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
  const fmtMd = d => new Date(d + 'T12:00:00').toLocaleDateString([], { month: 'short', day: 'numeric' });
  const fmtShort = d => new Date(d + 'T12:00:00').toLocaleDateString([], { month: 'short', day: 'numeric' }).toUpperCase();
  const fmtAt = ms => new Date(ms).toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const ymd = t => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const today = () => ymd(Date.now());
  function datesHtml() {
    const st = stage(), pb = S && S.purchaseBy, ev = S && S.eventAt;
    const at = ['before', 'open'].includes(st) ? 0 : ['countdown', 'room'].includes(st) ? 1 : st === 'unwrap' || (pb && today() > pb) ? 3 : 2;
    const tile = (i, b, small, tbd) => `<div class="item d${i === at ? ' now' : ''}${tbd ? ' tbd' : ''}"><b>${b}</b><small>${small}</small></div>`;
    return `<div class="dates">
      ${tile(0, 'NOV 12', 'Sign-ups close')}${tile(1, 'NOV 13', 'Reveal night')}
      ${tile(2, pb ? fmtShort(pb) : 'TBD', 'Purchase by', !pb)}${tile(3, ev ? fmtShort(ymd(ev)) : 'TBD', 'Event night', !ev)}</div>`;
  }

  // ---------- The ring ----------
  // Twelve seats on a circle: names centered under each logo, never outside the ring.
  const logoHtml = n => logos[n] ? `<img src="${esc(logos[n])}" alt="">` : esc(initials(n));
  const avHtml = (n, cls = '') => `<span class="av ${cls}">${logoHtml(n)}</span>`;
  function seatPos(i, total) { const a = (i / total) * 2 * Math.PI - Math.PI / 2; return [50 + 41 * Math.cos(a), 50 + 41 * Math.sin(a)]; }
  function ringHtml(lit, core, id = '') {
    const total = names.length;
    const seats = names.map((nm, i) => {
      const [x, y] = seatPos(i, total);
      return `<div class="seat ${lit.has(nm) ? 'on' : 'off'}${nm === popFor ? ' arrive' : ''}" data-seat="${esc(nm)}" style="left:${x.toFixed(2)}%;top:${y.toFixed(2)}%"><div class="lg">${logoHtml(nm)}</div><span class="nm">${esc(nm)}</span></div>`;
    }).join('');
    return `<div class="ring"${id ? ` id="${id}"` : ''}>${seats}<div class="core">${core}</div></div>`;
  }

  // ---------- Who's in ----------
  function closesText() {
    const p = stage();
    if (p === 'before') return 'Opens Nov 1';
    if (p !== 'open') return 'Closed';
    const ms = CLOSES - new Date();
    const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5), m = Math.floor(ms % 36e5 / 6e4);
    return 'Closes in ' + (d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${Math.max(m, 1)}m`);
  }
  function renderWho() {
    if (!loaded) { $('who').innerHTML = loadFailed ? "<p class=\"tiny\">Couldn't load who's in. Try again in a minute.</p>" : '<p class="tiny">Loading…</p>'; return; }
    const me = auth() && auth().manager;
    const n = names.filter(x => signed.has(x)).length, total = names.length;
    const p = stage();
    const core = p === 'before'
      ? '<div class="num">Nov 1</div><div class="tiny">sign-ups open</div>'
      : `<div class="num">${n}<span>/${total}</span></div><div class="tiny">signed up</div><div class="until" id="closes-in">${closesText()}</div>`;
    $('who').innerHTML = ringHtml(signed, core);
    popFor = '';
    const out = names.filter(x => !signed.has(x) && x !== me);
    $('out-sec').hidden = p !== 'open';
    if (p !== 'open') return;
    $('out-n').textContent = out.length ? out.length + ' left' : '';
    $('out').innerHTML = `<div class="out-list">${
      out.length ? out.map(x => `<div class="item out-row"><span class="who">${avHtml(x, 'off')}<span>${esc(x)}</span></span>${auth() ? `<button type="button" class="sm-btn" data-nudge="${esc(x)}">Nudge</button>` : ''}</div>`).join('')
        : `<div class="item out-row"><span class="who">${CHECK}<span>${total && n >= total ? `All ${total} are in.` : 'Everyone else is in.'}</span></span></div>`}</div>`;
  }
  // Nudge buttons anywhere on the page: data-nudge="name", data-kind for the reason.
  document.addEventListener('click', async e => {
    const b = e.target.closest('[data-nudge]');
    if (!b || b.disabled) return;
    b.disabled = true; b.textContent = 'Sending…';
    try {
      const { ok, j } = await post('/santa/nudge', { manager: b.dataset.nudge, kind: b.dataset.kind || 'signup' });
      b.textContent = ok ? 'Nudged' : j.error === 'nudged_today' ? 'Nudged' : j.error === 'already_in' ? 'Already in' : j.error === 'already_bought' ? 'Bought' : 'Try again';
      if (!ok && !['nudged_today', 'already_in', 'already_bought'].includes(j.error)) b.disabled = false;
    } catch (err) { b.textContent = 'Try again'; b.disabled = false; }
  });

  // ---------- The rules ----------
  function renderRules() {
    $('rules').innerHTML = `
      <ul class="rules">
        <li>${CHECK}<span>Pick one shirt from <a href="https://thegoodshirts.com/" target="_blank" rel="noopener">thegoodshirts.com</a>.</span></li>
        <li>${CHECK}<span>Order it in their chosen size before the deadline.</span></li>
        <li>${CHECK}<span>Wrap the shirt and bring it to event night.</span></li>
      </ul>
      ${datesHtml()}`;
  }

  // ---------- Your card ----------
  const addressDone = d => !!(d.name.trim() && d.street.trim() && d.city.trim() && /^[A-Za-z]{2}$/.test(d.state.trim()) && /^\d{5}(-\d{4})?$/.test(d.zip.trim()));
  const done = d => [addressDone(d), !!d.size, d.colors.length > 0, d.dates.length > 0];
  const tick = ok => `<span class="ok">${ok ? '✓' : ''}</span>`;

  function renderCard() {
    const sec = $('card-sec'), p = stage();
    const show = p !== 'before';
    sec.hidden = !show;
    $('cols').classList.toggle('two', show);
    $('wrap').classList.toggle('narrow', !show);
    if (!show) return;
    const a = auth();
    if (!a) {
      $('card-saved').textContent = '';
      $('card').innerHTML = `<p class="tiny" style="font-size:.88rem">Sign in to sign up. Open the link the commissioner texted you, or tap You and sign in with your code.</p>
        <button type="button" class="gold-btn line" data-signin>Sign in</button>`;
      return;
    }
    const closed = p !== 'open', off = closed ? ' disabled' : '';
    const d = draft, ok = done(d), got = ok.filter(Boolean).length;
    $('card-saved').textContent = saved ? 'Saved ' + new Date(saved.updated).toLocaleDateString([], { month: 'short', day: 'numeric' }) : '';
    $('card').innerHTML = `
      <div class="tiny"><span id="prog">${got} of 4 done</span></div>
      <div class="meter"><i id="meter" style="--w:${got * 25}%"></i></div>
      <div class="sec"><div class="cap"><span>Ship to</span><span id="t-addr">${tick(ok[0])}</span></div>
        <div class="tiny">Provide your address in case an in-person event isn't possible.</div>
        <div class="fgrid">
          <label class="field"><span>Name on the box</span><input class="in" data-f="name" value="${esc(d.name)}" autocomplete="name" maxlength="60"${off}></label>

    const lines = R.demoLines || (R.demoLines = [[names[3], 'joined'], [names[7], '🔥'], [names[1], '👀']]);
    const events = [];
    if (!R.after) lines.forEach(([n, t], k) => events.push({ id: k + 1, manager: n, kind: t === 'joined' ? 'join' : 'react', emoji: t }));
    else if (Math.random() < 0.5) { const here = [...R.demoHere].filter(n => n !== meName()); events.push({ id: R.after + 1, manager: here[Math.floor(Math.random() * here.length)], kind: 'react', emoji: EMOJI[Math.floor(Math.random() * 5)] }); }
    return { present: [...R.demoHere], holding: [], start: R.start, events };
  }
  function demoArrive() {
    names.filter(n => !R.demoHere.has(n)).forEach((n, i) => later(() => {
      R.demoHere.add(n);
      const ev = { id: R.after + 1, manager: n, kind: 'join' };
      const all = names.every(x => R.demoHere.has(x));
      applyRoom({ present: [...R.demoHere], holding: [], start: all ? { at: Date.now() + 10000, crew: [...names] } : null, events: [ev] });
    }, 600 + i * 1000));
  }

  // ---------- Drawing the page ----------
  function renderStage(keep) {
    cleanups.forEach(f => f()); cleanups = [];
    const st = stage(), signup = st === 'before' || st === 'open';
    $('cols').hidden = !signup;
    $('stage').hidden = signup;
    $('wrap').classList.toggle('narrow', signup ? st === 'before' : !['countdown', 'room', 'gifting', 'unwrap'].includes(st));
    if (signup) { renderWho(); renderRules(); renderCard(); }
    else if (!loaded) $('stage').innerHTML = loadFailed ? '<p class="tiny">Couldn\'t load Secret Santa. Try again in a minute.</p>' : '<p class="tiny">Loading…</p>';
    else {
      $('stage').innerHTML = (DEMO ? `<p class="preview-note">Preview with example data. Nothing here is saved.</p>` : '') + V[st]();
      if (INIT[st]) INIT[st]();
    }
    renderCommish();
    if (!keep) document.body.dataset.stage = st;
  }
  async function loadState() {
    const r = await fetch(WORKER_URL + '/santa', { headers: authHeaders(), cache: 'no-store' });
    if (!r.ok) throw new Error('santa ' + r.status);
    S = await r.json();
    signed = new Set(S.signed); counts = S.dates || {}; mine = S.mine; saved = S.mine;
    draft = S.mine ? { ...blank(), ...S.mine, colors: [...S.mine.colors], dates: [...S.mine.dates] } : blank();
  }
  async function loadRoster() {
    const [lg, fr] = await Promise.all([
      fetch('data/league.json').then(r => r.json()),
      fetch('data/franchise.json').then(r => r.json()).catch(() => ({ players: [] })),
    ]);
    const year = Math.max(...lg.seasons.map(s => s.year));
    names = [...new Set(lg.seasons.filter(s => s.year === year).map(s => s.player))].sort((a, b) => a.localeCompare(b));
    logos = {}; teams = {};
    for (const p of fr.players || []) { if (p.current_team_logo) logos[p.name] = p.current_team_logo; if (p.current_team_name) teams[p.name] = p.current_team_name; }
  }
  // Loads again and redraws if the stage moved on (or `force`).
  async function refresh(force) {
    const before = stage();
    if (!DEMO) { try { await loadState(); } catch (e) { return; } }
    if (force || stage() !== before) renderStage();
  }
  async function init() {
    renderStage();
    try {
      await Promise.all([loadRoster(), DEMO ? null : loadState()]);
      if (DEMO) demoState();
      loaded = true;
    } catch (err) { loadFailed = true; console.error(err); }
    renderStage();
  }
  // Signing in or out on this page changes whose page this is.
  addEventListener('rl-auth', async () => { try { if (!DEMO) await loadState(); } catch (e) {} renderStage(); });
  setInterval(() => {
    const el = $('closes-in'); if (el) el.textContent = closesText();
    // The clock moves the page on: sign-ups close, the Room opens.
    if (!DEMO && loaded && !R.holdPhase && $('cine').hidden) {
      const want = stage();
      if (want !== document.body.dataset.stage) refresh(true);
      else if (want === 'room' && S && !S.started && !R.counting) { /* the Room's heartbeat keeps itself fresh */ }
    }
  }, 30 * 1000);
  addEventListener('resize', () => { if ($('drawgrid')) slipLayout([...Array(crew().length).keys()]); });
  init();

  // ---------- Shirts drifting down with the snow ----------
  // Any of the shirt designs on thegoodshirts.com (icons/santa/shirts/NNN.webp).
  if (!REDUCED) {
    const bg = $('snowbg');
    setInterval(() => {
      if (document.hidden) return;
      const im = new Image(), w = 22 + Math.random() * 22, H = innerHeight;
      im.src = shirtImg(Math.floor(Math.random() * SHIRTS));
      im.alt = '';
      im.style.left = (Math.random() * 96).toFixed(1) + '%';
      im.style.width = w.toFixed(0) + 'px';
      bg.appendChild(im);
      im.animate([{ transform: `translateY(-60px) rotate(${Math.random() * 60 - 30}deg)` }, { transform: `translate(${Math.random() * 40 - 20}px,${H + 20}px) rotate(${Math.random() * 120 - 60}deg)` }],
        { duration: 11000 + Math.random() * 6000, easing: 'linear' }).finished.then(() => im.remove(), () => im.remove());
    }, 1100);
  }
</script>
</body>
</html>
