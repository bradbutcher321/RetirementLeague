<body>
  <div class="snowbg" id="snowbg" aria-hidden="true"></div>
  <div class="snowbg snow-top" aria-hidden="true"><span class="flakes"></span><span class="flakes b"></span></div>
  <div id="site-nav"></div>
  <div class="wrap narrow" id="wrap">
    <header>
      <div class="header-row">
        <div>
          <div class="eyebrow">Retirement League</div>
          <h1>Secret Santa</h1>
        </div>
      </div>
    </header>
    <div class="cols" id="cols">
      <div class="col" id="left">
        <div id="who" class="who-ring"><p class="tiny">Loading…</p></div>
        <section class="glass" id="out-sec" hidden><div class="panel-title">Still out<span class="sub" id="out-n"></span></div><div class="panel-body" id="out"></div></section>
        <section class="glass"><div class="panel-title">The rules<span class="sub">Same every year</span></div><div class="panel-body" id="rules"></div></section>
      </div>
      <section class="glass" id="card-sec" hidden><div class="panel-title">Your card<span class="sub" id="card-saved"></span></div><div class="panel-body" id="card"></div></section>
    </div>
    <div class="stage-view" id="stage" hidden></div>
    <div class="commish-view" id="commish" hidden></div>
    <footer id="site-footer" data-source="Shirts from thegoodshirts.com"></footer>
  </div>
  <div class="dimmer" id="dimmer"></div>
  <div class="cine" id="cine" hidden></div>
  <div class="ss-toast" id="toast" role="status"></div>

<script src="nav.js?v=44"></script>
<script src="page-common.js?v=42"></script>
<script src="santa-sound.js?v=3"></script>
<script src="santa-drones.js?v=3"></script>
<script>
  const WORKER_URL = 'https://retirement-league-refresh-proxy.bradbutcher321.workers.dev';
  // The same dates as worker/src/santa.js. Sign-ups open 12 AM Sun, Nov 1 and
  // close 12 AM Fri, Nov 13 (Eastern), so Thu, Nov 12 is the last day. The
  // Room opens at 9:00 PM that Friday; from 9:30 a commissioner can start it.
  const OPENS = new Date('2026-11-01T00:00:00-04:00'), CLOSES = new Date('2026-11-13T00:00:00-05:00');
  const REVEAL = new Date('2026-11-13T21:00:00-05:00'), FORCE_AT = new Date(REVEAL.getTime() + 30 * 60 * 1000);
  // ?santa=signup shows the card before Nov 1 (the Worker still says no to a
  // save, except to commissioners). Any other stage is an example with made-up
  // data that never saves.
  const PV = urlParam('santa');
  const PREVIEW = PV === 'signup';
  const DEMO_STAGES = ['countdown', 'room', 'reveal', 'gifting', 'unwrap'];
  const DEMO = DEMO_STAGES.includes(PV);
  // ?rehearsal=1: the rehearsal Room. The real page and the real Worker, but its own
  // seats, start and break time, and a stand-in giftee, so the real draw is never touched.
  const RH = !DEMO && !!urlParam('rehearsal');
  let demoStage = DEMO ? PV : null;
  const SIZES = ['S', 'M', 'L', 'XL', '2XL', '3XL'];
  const COLORS = [['Black', '#111111'], ['White', '#F4F4F0'], ['Navy', '#1F2A44'], ['Light Blue', '#9CC7E8'], ['Light Pink', '#F2C4CE'], ['Natural', '#E9DFC8'], ['Sport Grey', '#A7A9AC'], ['Yellow Haze', '#F1D98A'], ['Forest Green', '#2E4A36']];
  const EMOJI = ['🎁', '🔥', '😂', '👀', '🗑️'];
  const SHIRTS = 957;
  const CHECK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
  const LOCK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
  const GIFT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="8" width="18" height="5" rx="1"/><path d="M5 13v7h14v-7M12 8v12M12 8c-2-4-6-4-6-1.5S12 8 12 8zm0 0c2-4 6-4 6-1.5S12 8 12 8z"/></svg>';
  const SEND = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  const SPEAKER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>';
  const TROPHY = '<svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="tg" x1="0" x2="1"><stop offset="0" stop-color="#8A7342"/><stop offset=".45" stop-color="#F3E2B3"/><stop offset="1" stop-color="#B8954A"/></linearGradient></defs><path d="M18 8h28v12c0 9-6 16-14 16S18 29 18 20z" fill="url(#tg)"/><path d="M18 12H9c0 8 4 12 10 12M46 12h9c0 8-4 12-10 12" stroke="url(#tg)" stroke-width="3" fill="none"/><rect x="29" y="36" width="6" height="10" fill="url(#tg)"/><rect x="20" y="46" width="24" height="8" rx="2" fill="url(#tg)"/></svg>';
  // How far a Santa has gotten (the sleigh race): 0 is nothing yet, 5 is wrapped. Same as the Worker's stageOf.
  const STEPS = ['Picked', 'Ordered', 'Shipped', 'Delivered', 'Wrapped'];
  const stageOf = g => (!g ? 0 : g.wrapped ? 5 : g.delivered ? 4 : g.shipped ? 3 : g.ordered ? 2 : g.shirt != null || g.title || g.url ? 1 : 0);
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = id => document.getElementById(id);
  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const shirtImg = i => `icons/santa/shirts/${String(i).padStart(3, '0')}.webp`;
  const hex = c => (COLORS.find(x => x[0] === c) || [, '#888'])[1];
  const swatch = c => `<i class="sw" style="background:${hex(c)}"></i>`;

  // names: this year's managers; FR: each manager's Franchise record (data/franchise.json), for the scouting report.
  let names = [], logos = {}, teams = {}, FR = {}, signed = new Set(), counts = {}, mine = null, loaded = false, loadFailed = false;
  // The whole status from the Worker (GET /santa), or the example one.
  let S = null;
  // The card as it's being filled in; `saved` is what the Worker has.
  let draft = blank(), saved = null, popFor = '';

  function blank() { return { name: '', street: '', apt: '', city: '', state: '', zip: '', size: '', colors: [], dates: [] }; }
  const phase = () => { const now = new Date(); return now < OPENS ? 'before' : now < CLOSES ? 'open' : now < REVEAL ? 'countdown' : 'after'; };
  const auth = () => getAuth();
  const meName = () => (auth() && auth().manager) || (DEMO ? names[0] : null);
  const inDraw = () => !!(S && S.crew && meName() && S.crew.includes(meName()));
  const isCommish = () => isCommissioner(auth());
  const initials = n => monogram(n);
  let openedHere = false;
  // Which stage the page is showing.
  function stage() {
    if (DEMO) return demoStage;
    if (RH) return 'room';
    const p = phase();
    if (PREVIEW && p === 'before') return 'open';
    if (p !== 'after') return p;
    if (!S) return 'room';
    if (S.unmasked) return 'unwrap';
    if (!S.started) return 'room';
    if (S.you && !S.you.opened && !openedHere) return 'reveal';
    return 'gifting';
  }

  function toast(text) {
    const t = $('toast'); t.textContent = text; t.classList.add('on');
    clearTimeout(toast.id); toast.id = setTimeout(() => t.classList.remove('on'), 2400);
  }
  async function post(path, body) {
    if (DEMO) { toast('Preview: nothing is saved'); return { ok: true, j: { ok: true } }; }
    const r = await fetch(WORKER_URL + path, { method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders() }, body: JSON.stringify(body || {}) });
    const j = await r.json().catch(() => ({}));
    return { ok: r.ok, j };
  }

  // ---------- Dates ----------
  const fmtDay = d => new Date(d + 'T12:00:00').toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
  const fmtMd = d => new Date(d + 'T12:00:00').toLocaleDateString([], { month: 'short', day: 'numeric' });
  const fmtShort = d => new Date(d + 'T12:00:00').toLocaleDateString([], { month: 'short', day: 'numeric' }).toUpperCase();
  const fmtAt = ms => new Date(ms).toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const ymd = t => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const today = () => ymd(Date.now());
  function datesHtml() {
    const st = stage(), pb = S && S.purchaseBy, ev = S && S.eventAt;
    const at = ['before', 'open'].includes(st) ? 0 : ['countdown', 'room'].includes(st) ? 1 : st === 'unwrap' || (pb && today() > pb) ? 3 : 2;
    const tile = (i, b, small, tbd) => `<div class="item d${i === at ? ' now' : ''}${tbd ? ' tbd' : ''}"><b>${b}</b><small>${small}</small></div>`;
    return `<div class="dates">
      ${tile(0, 'NOV 12', 'Sign-ups close')}${tile(1, 'NOV 13', 'Reveal night')}
      ${tile(2, pb ? fmtShort(pb) : 'TBD', 'Purchase by', !pb)}${tile(3, ev ? fmtShort(ymd(ev)) : 'TBD', 'Event night', !ev)}</div>`;
  }

  // ---------- The ring ----------
  // Twelve seats on a circle: names centered under each logo, never outside the ring.
  const logoHtml = n => logos[n] ? `<img src="${esc(logos[n])}" alt="">` : esc(initials(n));
  const avHtml = (n, cls = '') => `<span class="av ${cls}">${logoHtml(n)}</span>`;
  function seatPos(i, total) { const a = (i / total) * 2 * Math.PI - Math.PI / 2; return [50 + 41 * Math.cos(a), 50 + 41 * Math.sin(a)]; }
  function ringHtml(lit, core, id = '') {
    const total = names.length;
    const seats = names.map((nm, i) => {
      const [x, y] = seatPos(i, total);
      return `<div class="seat ${lit.has(nm) ? 'on' : 'off'}${nm === popFor ? ' arrive' : ''}" data-seat="${esc(nm)}" style="left:${x.toFixed(2)}%;top:${y.toFixed(2)}%"><div class="lg">${logoHtml(nm)}</div><span class="nm">${esc(nm)}</span></div>`;
    }).join('');
    return `<div class="ring"${id ? ` id="${id}"` : ''}>${seats}<div class="core">${core}</div></div>`;
  }

  // ---------- Who's in ----------
  function closesText() {
    const p = stage();
    if (p === 'before') return 'Opens Nov 1';
    if (p !== 'open') return 'Closed';
    const ms = CLOSES - new Date();
    const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5), m = Math.floor(ms % 36e5 / 6e4);
    return 'Closes in ' + (d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${Math.max(m, 1)}m`);
  }
  function renderWho() {
    if (!loaded) { $('who').innerHTML = loadFailed ? "<p class=\"tiny\">Couldn't load who's in. Try again in a minute.</p>" : '<p class="tiny">Loading…</p>'; return; }
    const me = auth() && auth().manager;
    const n = names.filter(x => signed.has(x)).length, total = names.length;
    const p = stage();
    const core = p === 'before'
      ? '<div class="num">Nov 1</div><div class="tiny">sign-ups open</div>'
      : `<div class="num">${n}<span>/${total}</span></div><div class="tiny">signed up</div><div class="until" id="closes-in">${closesText()}</div>`;
    $('who').innerHTML = ringHtml(signed, core);
    popFor = '';
    const out = names.filter(x => !signed.has(x) && x !== me);
    $('out-sec').hidden = p !== 'open';
    if (p !== 'open') return;
    $('out-n').textContent = out.length ? out.length + ' left' : '';
    $('out').innerHTML = `<div class="out-list">${
      out.length ? out.map(x => `<div class="item out-row"><span class="who">${avHtml(x, 'off')}<span>${esc(x)}</span></span>${auth() ? `<button type="button" class="sm-btn" data-nudge="${esc(x)}">Nudge</button>` : ''}</div>`).join('')
        : `<div class="item out-row"><span class="who">${CHECK}<span>${total && n >= total ? `All ${total} are in.` : 'Everyone else is in.'}</span></span></div>`}</div>`;
  }
  // Nudge buttons anywhere on the page: data-nudge="name", data-kind for the reason.
  // In the Room a dim seat on the ring is a nudge too.
  document.addEventListener('click', async e => {
    const seat = e.target.closest('#room-ring .seat.off');
    const b = e.target.closest('[data-nudge]') || (seat && stage() === 'room' && seated() && !RH ? seat : null);
    if (!b || b.disabled) return;
    const who = b.dataset.nudge || b.dataset.seat, kind = b.dataset.kind || (b === seat ? 'room' : 'signup'), lab = b.querySelector('em') || (b.dataset.nudge ? b : null);
    if (kind === 'room' && R.nudged.has(who)) { toast(`${who} was just nudged`); return; }
    if (b.dataset.nudge) b.disabled = true;
    if (lab) lab.textContent = 'Sending\u2026';
    let word = 'Try again';
    try {
      const { ok, j } = await post('/santa/nudge', { manager: who, kind });
      word = ok || j.error === 'nudged_today' ? 'Nudged' : j.error === 'already_in' ? 'Already in' : j.error === 'already_bought' ? 'Bought' : 'Try again';
    } catch (err) {}
    if (lab) lab.textContent = word;
    if (word === 'Try again') { if (b.dataset.nudge) b.disabled = false; if (b === seat) toast('Couldn\u2019t nudge. Try again.'); }
    else if (kind === 'room') { R.nudged.add(who); toast(`Nudged ${who}`); }
  });

  // ---------- The rules ----------
  function renderRules() {
    $('rules').innerHTML = `
      <ul class="rules">
        <li>${CHECK}<span>Pick one shirt from <a href="https://thegoodshirts.com/" target="_blank" rel="noopener">thegoodshirts.com</a>.</span></li>
        <li>${CHECK}<span>Order it in their chosen size before the deadline.</span></li>
        <li>${CHECK}<span>Wrap the shirt and bring it to event night.</span></li>
      </ul>
      ${datesHtml()}`;
  }

  // ---------- Your card ----------
  const addressDone = d => !!(d.name.trim() && d.street.trim() && d.city.trim() && /^[A-Za-z]{2}$/.test(d.state.trim()) && /^\d{5}(-\d{4})?$/.test(d.zip.trim()));
  const done = d => [addressDone(d), !!d.size, d.colors.length > 0, d.dates.length > 0];
  const tick = ok => `<span class="ok">${ok ? '✓' : ''}</span>`;

  function renderCard() {
    const sec = $('card-sec'), p = stage();
    const show = p !== 'before';
    sec.hidden = !show;
    $('cols').classList.toggle('two', show);
    $('wrap').classList.toggle('narrow', !show);
    if (!show) return;
    const a = auth();
    if (!a) {
      $('card-saved').textContent = '';
      $('card').innerHTML = `<p class="tiny" style="font-size:.88rem">Sign in to sign up. Open the link the commissioner texted you, or tap You and sign in with your code.</p>
        <button type="button" class="gold-btn line" data-signin>Sign in</button>`;
      return;
    }
    const closed = p !== 'open', off = closed ? ' disabled' : '';
    const d = draft, ok = done(d), got = ok.filter(Boolean).length;
    $('card-saved').textContent = saved ? 'Saved ' + new Date(saved.updated).toLocaleDateString([], { month: 'short', day: 'numeric' }) : '';
    $('card').innerHTML = `
      <div class="tiny"><span id="prog">${got} of 4 done</span></div>
      <div class="meter"><i id="meter" style="--w:${got * 25}%"></i></div>
      <div class="sec"><div class="cap"><span>Ship to</span><span id="t-addr">${tick(ok[0])}</span></div>
        <div class="tiny">Provide your address in case an in-person event isn't possible.</div>
        <div class="fgrid">
          <label class="field"><span>Name on the box</span><input class="in" data-f="name" value="${esc(d.name)}" autocomplete="name" maxlength="60"${off}></label>
          <label class="field c4"><span>Street</span><input class="in" data-f="street" value="${esc(d.street)}" autocomplete="address-line1" maxlength="80"${off}></label>
          <label class="field c2"><span>Apt</span><input class="in" data-f="apt" value="${esc(d.apt)}" autocomplete="address-line2" maxlength="20"${off}></label>
          <label class="field c3"><span>City</span><input class="in" data-f="city" value="${esc(d.city)}" autocomplete="address-level2" maxlength="50"${off}></label>
          <label class="field c1"><span>State</span><input class="in" data-f="state" value="${esc(d.state)}" autocomplete="address-level1" maxlength="2" autocapitalize="characters"${off}></label>
          <label class="field c2"><span>ZIP</span><input class="in" data-f="zip" value="${esc(d.zip)}" autocomplete="postal-code" inputmode="numeric" maxlength="10"${off}></label>
        </div>
      </div>
      <div class="sec"><div class="cap"><span>Shirt size</span><span id="t-size">${tick(ok[1])}</span></div>
        <div class="pills sizes" data-group="size">${SIZES.map(x => `<button type="button" class="pill" data-size="${x}" aria-pressed="${d.size === x}"${off}>${x}</button>`).join('')}</div>
      </div>
      <div class="sec"><div class="cap"><span>Colors you prefer</span><span id="t-colors">${tick(ok[2])}</span></div>
        <div class="pills">${COLORS.map(([c, h]) => `<button type="button" class="pill" data-color="${c}" aria-pressed="${d.colors.includes(c)}"${off}><i class="sw" style="background:${h}"></i>${c}</button>`).join('')}</div>
      </div>
      <div class="sec"><div class="cap"><span>Dates in December</span><span id="t-dates">${tick(ok[3])}</span></div>
        <div class="tiny">Tap every day you could meet up for the event. The small numbers are how many others can make it.</div>
        <div class="cal">${calendarHtml(closed)}</div>
        <div class="cal-foot"><span class="tiny" id="datecount"></span><button type="button" class="link-btn" id="cleardates"${off}>Clear</button></div>
      </div>
      <div class="priv">Only your Santa sees your size and colors, and only after the reveal. You can change your card until sign-ups close.</div>
      ${closed ? '<p class="msg">Sign-ups are closed.</p>' : `<button type="button" class="gold-btn" id="save">${saved ? 'Update my card' : 'Save my card'}</button><p class="msg" id="msg" role="status"></p>`}`;
    updateDateCount();
  }
  function calendarHtml(closed) {
    // December 2026 starts on a Tuesday.
    const first = new Date(2026, 11, 1).getDay();
    const others = date => Math.max(0, (counts[date] || 0) - (saved && saved.dates.includes(date) ? 1 : 0));
    let h = '<div class="cal-grid">' + ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(x => `<span class="dow">${x}</span>`).join('');
    for (let i = 0; i < first; i++) h += '<span class="day pad"></span>';
    for (let n = 1; n <= 31; n++) {
      const date = `2026-12-${String(n).padStart(2, '0')}`, dow = (first + n - 1) % 7, c = others(date);
      h += `<button type="button" class="day${dow === 0 || dow === 6 ? ' we' : ''}" data-date="${date}" aria-pressed="${draft.dates.includes(date)}" aria-label="December ${n}${c ? `, ${c} others can make it` : ''}"${closed ? ' disabled' : ''}><b>${n}</b><small>${c || ''}</small></button>`;
    }
    return h + '</div>';
  }
  function updateDateCount() {
    const n = draft.dates.length, el = $('datecount'), clr = $('cleardates');
    if (el) el.textContent = n ? `${n} day${n === 1 ? '' : 's'} picked` : 'No days picked yet';
    if (clr && stage() === 'open') clr.disabled = !n;
  }
  // Refreshes the checkmarks and the meter without redrawing the fields (a redraw would drop the keyboard).
  function updateTicks() {
    const ok = done(draft), got = ok.filter(Boolean).length;
    ['addr', 'size', 'colors', 'dates'].forEach((k, i) => { const el = $('t-' + k); if (el) el.innerHTML = tick(ok[i]); });
    const prog = $('prog'), meter = $('meter');
    if (prog) prog.textContent = `${got} of 4 done`;
    if (meter) meter.style.setProperty('--w', got * 25 + '%');
  }
  function say(text, cls) { const m = $('msg'); if (m) { m.textContent = text; m.className = 'msg' + (cls ? ' ' + cls : ''); } }

  $('card').addEventListener('input', e => {
    const f = e.target.dataset && e.target.dataset.f;
    if (!f) return;
    draft[f] = f === 'state' ? e.target.value.toUpperCase() : e.target.value;
    if (f === 'state') e.target.value = draft.state;
    updateTicks();
  });
  $('card').addEventListener('click', e => {
    const t = e.target;
    const size = t.closest('[data-size]'), color = t.closest('[data-color]'), day = t.closest('[data-date]');
    if (size && !size.disabled) {
      draft.size = size.dataset.size;
      $$('[data-size]').forEach(b => b.setAttribute('aria-pressed', b === size));
    } else if (color && !color.disabled) {
      const c = color.dataset.color, i = draft.colors.indexOf(c);
      if (i < 0) draft.colors.push(c); else draft.colors.splice(i, 1);
      color.setAttribute('aria-pressed', i < 0);
    } else if (day && !day.disabled) {
      const dt = day.dataset.date, i = draft.dates.indexOf(dt);
      if (i < 0) draft.dates.push(dt); else draft.dates.splice(i, 1);
      draft.dates.sort();
      day.setAttribute('aria-pressed', i < 0);
      updateDateCount();

    return {
      who, pics, pic,

      box: D.giftBox({ a: 0.5 }),

      // The giant shirt after the tree: Making My Way Downtown, turning in place.
      tee: D.move(D.shirtPrint(tee, { w: Math.min(hw * 1.95, 2.4), max: N - 20 }), 0, -0.05),
      feat: D.text(['FEATURING'], { ...T, maxW, lineH: 0.5, colors: ['#F3E2B3'] }),

      who2: D.text(['WHO GOT', 'YOU?'], { ...T, maxW, lineH: 0.58, colors: ['#FFFFFF', '#E8424F'] }),
      clusters: D.clusters(who.length, { R: Math.min(0.94, hw * 0.92), cy: 0.12, r: 0.062 }),
      // Each manager: their real logo (a picture over the sky, see skyLogo) inside a ring of
      // drones in the logo's two main colors, with the name under it. No logo: initials in drones.
      hasPic: pics.map(im => !!(im && im.naturalWidth)),
      logos: who.map((n, i) => {
        const ok = pics[i] && pics[i].naturalWidth;
        const lp = ok ? halo(0.7, D.colorsOf(D.image(pics[i], { d: 1.3, grid: 24, max: 420 }))) : pic(pics[i], n, 1.24, desk ? 32 : 27, N - 220);
        const t = D.text([showName(n).toUpperCase()], { maxW: 1.7, lineH: 0.4, weight: 800, track: 0.1, colors: ['#F3E2B3'], pitch: 0.036, max: 220 });
        return D.merge(D.move(lp, 0, -0.36), D.move(t, 0, 0.78));

    };
  }

  // A ring of drones, two deep, alternating two colors.
  function halo(R, cols) {
    const pts = [], n = 132;
    for (let i = 0; i < n; i++) { const a = i / n * 2 * Math.PI, r = R + (i % 2 ? 0.04 : 0); pts.push({ x: Math.cos(a) * r, y: Math.sin(a) * r, z: 0, c: cols[i % 2] || cols[0], b: 1 }); }
    return pts;
  }

  function skyLogo(name, xU = 0, yU = 0, dU = 1.3) {

    el.style.left = (sky.cx + xU * sky.s) + 'px'; el.style.top = (sky.cy + yU * sky.s) + 'px'; el.style.width = el.style.height = (dU * sky.s) + 'px';
    el.classList.add('on');

  // One line about a manager, from the Franchise data: the first of these that fits.
  // Seasons in progress don't count, and nothing here claims a record someone else shares.
  function tagLine(n) {
    const p = FR[n]; if (!p || !p.career) return '';
    const all = Object.values(FR), doneOf = q => (q.season_history || []).filter(h => h.final_standing);
    const lastY = Math.max(0, ...all.flatMap(q => doneOf(q).map(h => h.year)));
    const size = Math.max(0, ...all.map(q => (doneOf(q).find(h => h.year === lastY) || {}).final_standing || 0));
    const hist = doneOf(p), last = hist.find(h => h.year === lastY), titles = hist.filter(h => h.champion).map(h => h.year);
    const st = p.career.standings || {}, r = p.career.record || {};
    const w = (r.reg_w || 0) + (r.playoff_w || 0), l = (r.reg_l || 0) + (r.playoff_l || 0);
    const nNames = new Set([p.current_team_name, ...(p.previous_team_names || [])].filter(Boolean).map(x => String(x).trim().toLowerCase())).size;
    const extra = nNames >= 10 ? ` \u00b7 ${nNames} team names` : '';
    const hiTop = Math.max(...all.filter(q => names.includes(q.name)).map(q => (q.extremes && q.extremes.highest_score) || 0));
    const ls = p.streaks && p.streaks.head_to_head && p.streaks.head_to_head.longest_loss;
    if (titles.includes(lastY) && titles.includes(lastY - 1)) return 'Back-to-back champion';
    if (titles.includes(lastY)) return 'Defending champion';
    if (last && size > 1 && last.final_standing === size) return `Last place, ${lastY}`;
    if (titles.length >= 2) return `${titles.length} titles` + (extra || ` \u00b7 ${st.playoff_appearances} playoff trips`);
    if (titles.length === 1) return (titles[0] === p.founded_year ? `Won it as a rookie, ${titles[0]}` : `${titles[0]} champion`) + extra;
    if (ls >= 12) return `Once lost ${ls} straight`;
    if (st.playoff_appearances >= 6) return `${st.playoff_appearances} playoff trips, no title`;
    if (p.extremes && hiTop && p.extremes.highest_score === hiTop) return `High score: ${Number(hiTop).toFixed(2)}`;
    if (p.weekly_sackos === 0) return 'Zero weekly Sackos';
    if (w === l && w) return `Career record: ${w}-${l}`;
    return `${w}-${l} all-time`;
  }

  // ---------- The news crawl: real league jokes ----------
  const nameList = list => (list.length < 3 ? list.join(' and ') : `${list.slice(0, -1).join(', ')}, and ${list[list.length - 1]}`);
  const ordinal = n => n + (['th', 'st', 'nd', 'rd'][(n % 100 - 20) % 10] || ['th', 'st', 'nd', 'rd'][n % 100] || 'th');
  function crawlText() {
    const all = Object.values(FR), cur = all.filter(p => names.includes(p.name)), n = crew().length;
    // The top value of f and everyone tied at it.
    const top = (list, f) => { const v = list.map(f).filter(x => typeof x === 'number' && isFinite(x)); if (!v.length) return null; const m = Math.max(...v); return { v: m, who: list.filter(p => f(p) === m).map(p => p.name) }; };
    const facts = [`${n} envelopes, zero leaks`, 'Commissioner confirms: nobody drew themselves', 'Shirt budget: one shirt from Good Shirts', `${meName() || 'A manager'} has a giftee. Reaction: stunned`];
    const ws = top(cur, p => p.weekly_sackos); if (ws && ws.v > 0) facts.push(`${nameList(ws.who)} ${ws.who.length > 1 ? 'share' : 'leads'} the league in weekly Sackos: ${ws.v}`);
    const hi = top(all, p => p.extremes && p.extremes.highest_score); if (hi) facts.push(`${nameList(hi.who)} ${hi.who.length > 1 ? 'share' : 'holds'} the league's highest score: ${hi.v.toFixed(2)}`);
    const ls = top(cur, p => p.streaks && p.streaks.head_to_head && p.streaks.head_to_head.longest_loss); if (ls) facts.push(`${nameList(ls.who)} once lost ${ls.v} straight head-to-head games`);
    const nm = top(cur, p => new Set([p.current_team_name, ...(p.previous_team_names || [])].filter(Boolean).map(s => String(s).trim().toLowerCase())).size);
    if (nm && nm.v > 1) facts.push(`${nameList(nm.who)} ${nm.who.length > 1 ? 'have each' : 'has'} had ${nm.v} team names`);
    const ch = top(cur, p => p.career && p.career.standings.championships); if (ch && ch.v) facts.push(`Most titles: ${nameList(ch.who)}, with ${ch.v}`);
    const champ = all.flatMap(p => (p.season_history || []).filter(h => h.champion).map(h => ({ name: p.name, year: h.year }))).sort((a, b) => b.year - a.year)[0];
    if (champ) facts.push(`${champ.name}: defending champion, now accepting shirts`);
    for (let i = facts.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [facts[i], facts[j]] = [facts[j], facts[i]]; }
    return facts.slice(0, 6).join('   ·   ') + '   ·   ';
  }

  // ---------- The scouting report (the reveal's last card; Gifting's panel uses its stats) ----------
  function scoutStats(n) {
    const p = FR[n]; if (!p || !p.career) return null;
    const r = p.career.record, st = p.career.standings, hist = p.season_history || [];
    const done = hist.filter(h => h.final_standing), now = hist.find(h => h.year === SS_YEAR && !h.final_standing);
    // Their nemesis among this year's managers, the way the Franchise page picks it.
    const pool = ((p.rivalries && p.rivalries.all) || []).filter(x => names.includes(x.opponent));
    const nem = pool.length ? pool.reduce((a, b) => (b.win_pct < a.win_pct || (b.win_pct === a.win_pct && b.wins + b.losses > a.wins + a.losses) ? b : a)) : null;
    const titles = done.filter(h => h.champion).map(h => String(h.year));
    const notes = [titles.length ? `Won it all in ${nameList(titles)}.` : `${st.playoff_appearances} playoff trip${st.playoff_appearances === 1 ? '' : 's'}, no title yet.`];
    if (nem && nem.win_pct < 50) notes.push(`Can't beat ${nem.opponent}: ${nem.wins}-${nem.losses} all-time.`);
    if (p.weekly_sackos >= 3) notes.push(`${p.weekly_sackos} weekly Sackos. Dress for it.`);
    else if (now && now.reg_standing) notes.push(`${now.reg_record} this season, ${ordinal(now.reg_standing)} place.`);
    return {
      tiles: [['Record', `${(r.reg_w || 0) + (r.playoff_w || 0)}-${(r.reg_l || 0) + (r.playoff_l || 0)}`], ['Titles', st.championships], ['Playoffs', st.playoff_appearances],

      notes,

  }
  const scoutTiles = st => `<div class="scr-grid">${st.tiles.map(([k, v]) => `<div class="scr-t"><small>${esc(k)}</small><b>${esc(String(v))}</b></div>`).join('')}</div>`;

      <p class="scr-due">${S && S.purchaseBy ? `Buy by ${fmtDay(S.purchaseBy)}. ` : ''}Good Shirts takes about 3 weeks to deliver${S && S.purchaseBy ? '.' : ', so order early.'}</p>

  function lower(a, b) { $('sh-l1').textContent = a || ''; $('sh-l2').textContent = b || ''; $('cine').classList.toggle('low', !!(a || b)); }
  // The beat bounces the stage (and the sound button keeps saying whether sound is on).

  async function playReveal(mode, { live = false, short = false } = {}) {
    A.init(); wake(true);
    // The shirt list is nice to have (the scouting report's three shirts), never worth waiting on.
    if (!catalog) await Promise.race([loadCatalog().catch(() => {}), new Promise(r => setTimeout(r, 1500))]);
    run++; const me = run;
    stopShow();
    const cine = $('cine'); cine.hidden = false; cine.className = 'cine black'; cine.dataset.mode = mode; cine.innerHTML = cineHTML(mode);
    document.documentElement.style.overflow = 'hidden';

    SH.sky.place(SH.sky.groundPts()); SH.sky.start();

    const v = VO(); [v.gentlemen, v.welcome, v.pickin, v.draft].forEach(u => AE.loadVoice(u).catch(() => {}));
    Object.assign(SH, { mode: 'off', layer: 0, allIn: false, bounce: false, lit: new Set(), riser: null, anchor: null, synced: false });

    SH.formsP = buildForms(SH.sky).catch(e => { console.error(e); return null; });
    requestAnimationFrame(() => cine.classList.add('on'));

  // 1. Lights out.

    const cine = $('cine');

    lower('Welcome to', `Secret Santa ${SS_YEAR}`);

  // 2. The drone show: 22 bars of bells (the last 4 for the shirt), then the
  // riff for FEATURING and the lineup, a bar per manager.
  async function droneShow() {
    const F = await SH.formsP, sky = SH.sky;
    if (!F) return;
    const BAR = AE.BELLS.step * 6, SB = AE.STAD.step * 16, n = F.logos.length;
    // The bells start a fixed 9.2 seconds after the Room's start on every phone
    // (lights out takes about 8), so the sky and the beat match from phone to
    // phone. A phone that is running late starts as soon as it can.
    const shared = SH.anchor != null ? SH.anchor + 9.2 : 0;
    SH.synced = shared >= wnow() + 0.3;
    const T0 = SH.synced ? shared : wnow() + 0.3, T1 = T0 + BELL_BARS * BAR;
    SH.Tb = T0; SH.Ts = T1; SH.mode = 'lineup'; syncMusic();
    await untilW(T0 + BAR); sky.form(F.grid, { dur: 2.4, stagger: 1.2, order: 'y' });
    await untilW(T0 + 3 * BAR); sky.form(F.rl, { dur: 1.7, stagger: 0.7 });
    await untilW(T0 + 6 * BAR); sky.form(F.crest, { dur: 1.6, stagger: 0.6 });
    await untilW(T0 + 9 * BAR); sky.form(F.santa, { dur: 1.6, stagger: 0.6 });
    await untilW(T0 + 12 * BAR); sky.form(F.box, { dur: 1.5, stagger: 0.5, spin: 0.9 });
    await untilW(T0 + 15 * BAR); sky.form(F.tree, { dur: 1.5, stagger: 0.6, spin: 0.75 });
    // The shirt forms facing you, then turns all the way around and lands facing you on the riff.
    await untilW(T0 + 18 * BAR); sky.form(F.tee, { dur: 1.3, stagger: 0.5 });
    await untilW(T0 + 18 * BAR + 1.9); sky.turn(1, 4 * BAR - 2.1);
    await untilW(T1); sfx((ch, t) => ch.impact(t, 0.8)); sky.form(F.feat, { dur: 0.7, stagger: 0.25 });
    for (let k = 0; k < n; k++) {
      await untilW(T1 + SB * (1 + k)); sky.form(F.logos[k], { dur: 0.5, stagger: 0.18, order: 'random' });
      // The real logo pops into the ring, and the tag line slides in under the name.
      skyLogo(null); skyTag('');
      const who = F.who[k];

      case 'react': A.init(); A.tone(1200, 'sine', 0.03, 0.15); bubble(meName(), el.dataset.e); feedLine(meName(), el.dataset.e); if (!DEMO) roomBeat({ react: el.dataset.e }).catch(() => {}); break;
      case 'creact': floatEmoji($('cine'), el.dataset.e, 0.5); if (!DEMO) post('/santa/room', { react: el.dataset.e }).catch(() => {}); break;
      case 'force': {
        const gone = crew().filter(n => !R.present.has(n));
        if (!confirm(RH ? 'Start the rehearsal with whoever is here?' : allHere() ? 'Start the countdown for everyone?' : `Start without ${nameList(gone)}? Anyone missing opens theirs later on their own.`)) return;
        if (DEMO) { R.start = { at: Date.now() + 10000, crew: crew().filter(n => R.present.has(n)) }; roomGo(); return; }
        const { ok, j } = await post('/santa/admin', { action: 'start', force: true, ...(RH ? { rehearsal: true } : {}) });
        if (!ok) { toast(j.error === 'too_early' ? 'From 9:00 PM.' : j.error === 'nobody_here' ? 'Nobody is in the Room yet.' : 'Couldn\u2019t start it.'); return; }
        roomBeat().catch(() => {});
        break;
      }
      case 'rhreset': {
        if (!confirm('Reset the rehearsal? Everyone in it goes back to an empty Room.')) return;
        const { ok } = await post('/santa/admin', { action: 'rehearsal_reset' });
        if (!ok) { toast('Couldn\u2019t reset it.'); return; }
        Object.assign(R, { start: null, drop: null, opened: false, counting: false, stale: false, holdPhase: false, after: 0 });
        closeReveal(); renderStage(); toast('Rehearsal reset');
        break;
      }
      case 'play': playReveal('solo'); break;
      case 'replay-solo': playReveal('solo'); break;
      case 'replay': playReveal($('cine').dataset.mode || 'solo'); break;
      case 'replaypick': playReveal($('cine').dataset.mode || 'solo', { short: true }); break;
      case 'replaypick-solo': playReveal('solo', { short: true }); break;
      case 'sharepick': sharePick(); break;
      case 'tocard': GS.peekUntil = Date.now() + 15000; afterReveal(); scrollTo(0, 0); break;
      // While the phone hasn't started sound yet, the button's tap is what starts it.
      case 'mute': if (A.on && !AE.running()) { A.init(); setTimeout(syncMusic, 60); } else A.on = !A.on; el.textContent = soundLabel(); break;
      case 'sound': A.init(); if (!A.on) A.on = true; setTimeout(sndChip, 150); setTimeout(sndChip, 800); break;
      // The sound check: the horn, out loud. If you heard it, your seat gets its speaker.
      case 'sndcheck': A.init(); if (!A.on) A.on = true; setTimeout(() => { A.fx((ch, t) => ch.airhorn(t, 0.6, 0.26)); R.snd = AE.running(); preflight(); if (R.snd) { toast('Hear that? You\u2019re good.'); if (!DEMO) roomBeat().catch(() => {}); } else toast('No sound yet. Tap again.'); }, 180); break;
      case 'awake': await wake(true); preflight(); if (!WL.lock) toast('This phone won\u2019t hold the screen on. Keep tapping it now and then.'); break;
      case 'rtab': RM.tab = el.dataset.t; $$('#rtabs button').forEach(b => b.setAttribute('aria-pressed', b === el)); $('rpane-room').hidden = RM.tab !== 'room'; if ($('rpane-props')) $('rpane-props').hidden = RM.tab !== 'props'; break;
      case 'rally': {
        const c = crew(), here = c.filter(n => R.present.has(n)).length, url = location.origin + location.pathname;
        const text = stage() === 'room' ? `${here} of ${c.length} are in the Room for Secret Santa. Get in here.` : 'Secret Santa reveal night is Friday at 9:00 PM ET. Be in the Room.';
        try { if (navigator.share) { navigator.share({ text, url }).catch(() => {}); break; } } catch (err) {}
        if (navigator.clipboard) navigator.clipboard.writeText(`${text} ${url}`).then(() => toast('Copied. Paste it in the group chat.'), () => toast('Couldn\u2019t copy it.'));
        break;
      }
      case 'cam': {
        const on = el.getAttribute('aria-checked') !== 'true';
        if (on) { el.disabled = true; const ok = await camOn(); el.disabled = false; if (!ok) return; }
        else camOff();
        const row = $('camrow'); if (row) row.innerHTML = camRowHtml();
        preflight(); if (!DEMO && stage() === 'room') roomBeat().catch(() => {});
        break;
      }
      case 'peek': GS.peekUntil = Date.now() < GS.peekUntil ? 0 : Date.now() + 15000; refreshPeek(); break;
      case 'copyaddr': { const a = giftee().address; const t = `${a.name}\n${a.street}${a.apt ? ' ' + a.apt : ''}\n${a.city}, ${a.state} ${a.zip}`; navigator.clipboard && navigator.clipboard.writeText(t).then(() => toast('Address copied'), () => toast('Couldn\'t copy')); break; }
      case 'theircolors': GS.theirColors = !GS.theirColors; GS.shown = 9; renderPicker(); break;
      case 'shuffle': GS.seed = Math.floor(Math.random() * SHIRTS); GS.shown = 9; renderPicker(); break;
      case 'more': GS.shown += 9; renderPicker(); break;
      case 'closeshirt': closeShirt(); break;
      // The big board.
      case 'board': {
        const i = +el.dataset.i, k = GS.board.indexOf(i);
        if (k >= 0) GS.board.splice(k, 1); else if (GS.board.length < 3) GS.board.push(i);
        saveBoard(); closeShirt(); renderPicker(); A.fx((ch, t) => ch.clack(t, 0.15));
        break;
      }
      case 'bdup': { const k = +el.dataset.k; [GS.board[k - 1], GS.board[k]] = [GS.board[k], GS.board[k - 1]]; saveBoard(); renderPicker(); break; }
      case 'bdx': GS.board.splice(+el.dataset.k, 1); saveBoard(); renderPicker(); break;
      case 'makepick': makePick(); break;
      // Your gift's next step.
      case 'gtab': gtab(el.dataset.t); break;
      case 'gtab-shop': gtab('shop'); $('picker') && $('picker').scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
      case 'bought': gtab('gift'); GS.form = { ...giftForm(), ordered: today() }; renderGift(); $('giftsec').scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
      case 'shipped': saveGift({ ...S.you.gift, shipped: today() }); break;
      case 'arrived': saveGift({ ...S.you.gift, shipped: S.you.gift.shipped || today(), delivered: today() }); break;
      case 'wrapped': A.init(); A.fx((ch, t) => ch.sleigh(t, 1.2, 0.25)); saveGift({ ...S.you.gift, wrapped: today() }); break;
      case 'addgift': gtab('gift'); GS.form = giftForm(); GS.form.ordered = GS.form.ordered || today(); renderGift(); break;
      case 'editgift': gtab('gift'); GS.form = giftForm(); renderGift(); $('giftsec').scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
      case 'cancelgift': GS.form = null; renderGift(); break;
      case 'clearshirt': GS.form.shirt = null; GS.form.title = ''; GS.form.url = ''; renderGift(); break;
      case 'savegift': saveGift(GS.form, 'gmsg', { form: true }); break;
      case 'removegift': {
        if (!confirm('Remove your gift?')) return;
        const { ok } = await post('/santa/gift', { clear: true });
        if (!ok) { toast('Couldn\'t remove it.'); return; }
        const was = S.you.gift; S.you.gift = null; GS.form = null;
        if (S.totals && was) { if (was.ordered) S.totals.bought--; if (was.delivered) S.totals.delivered--; }
        if (S.race && meName()) S.race[meName()] = 0;
        renderStage(true); break;
      }
      // Your reaction photo.
      case 'retake': A.init(); openCam(); break;
      case 'snap': snapNow(); break;
      case 'closecam': closeCam(); break;
      case 'delphoto': {
        if (!confirm('Delete your reaction photo?')) return;
        if (!DEMO) { const { ok } = await post('/santa/photo', { clear: true }); if (!ok) { toast('Couldn\'t delete it.'); return; } }
        S.you.photo = null; PHOTOS.delete(meName()); renderPhoto(); break;
      }
      // The Shirtys.
      case 'syopen': openEnvelope(); break;
      case 'syseal': case 'syreopen': {
        const c = SHIRTYS.find(x => x[0] === SY.cat), open = act === 'syreopen';
        if (!confirm(open ? `Reopen the ${c[1]} vote? The envelope's result goes away until you seal it again.` : `Seal the ${c[1]} envelope? ${c[2] ? 'Voting closes and ' : ''}the winner goes to everyone.`)) return;
        let result = null;
        if (DEMO) result = open ? null : demoShirty(SY.cat);
        else {
          const { ok, j } = await post('/santa/admin', { action: 'shirty', cat: SY.cat, open });
          if (!ok) { toast('Couldn\'t do that.'); return; }
          result = j.result;
        }
        S.shirtys[SY.cat].result = result; SY.seen.delete(SY.cat); renderShirtys(); break;
      }
      case 'tab': GS.tab = el.dataset.t; renderMail(); break;
      case 'unmask': if (unAuto) break; A.init(); unmaskPlay(); el.textContent = 'Playing…'; el.disabled = true; break;
      case 'unstep': A.init(); unAuto = false; { const bt = $('unbtn'); if (bt) { bt.disabled = false; bt.textContent = 'Play the unmask'; } } unmaskStep(); break;
      case 'redraw': runDraw(); break;
      case 'savedates': {
        const buy = $('c-buy').value, ev = $('c-event').value, place = $('c-place').value.trim(), notes = $('c-notes').value.trim();
        const { ok, j } = await post('/santa/admin', { action: 'dates', purchaseBy: buy || null, eventAt: ev ? new Date(ev).getTime() : null, place, notes });
        if (!ok) { cmsg(j.error === 'bad_date' ? 'That date doesn\'t look right.' : 'Couldn\'t save.', 'bad'); return; }
        S.purchaseBy = buy || null; S.eventAt = ev ? new Date(ev).getTime() : null; S.place = place; S.notes = notes;
        renderStage(true); cmsg('Saved. Everyone sees the new dates.', 'ok');
        break;
      }
      case 'ship': {
        const on = el.getAttribute('aria-checked') !== 'true';
        if (!confirm(on ? 'Ship instead? Each Santa will see their giftee\'s address.' : 'Back to the in-person event? Addresses are hidden again.')) return;
        const { ok } = await post('/santa/admin', { action: 'ship', on });
        if (!ok) { cmsg('Couldn\'t change it.', 'bad'); return; }
        S.ship = on; el.setAttribute('aria-checked', on);
        if (!DEMO) refresh(true);
        break;
      }
      case 'remindall': {
        if (!confirm('Send everyone in the draw a reminder?')) return;
        const { ok, j } = await post('/santa/admin', { action: 'remind' });
        cmsg(ok ? `Sent to ${j.devices || 0} device${j.devices === 1 ? '' : 's'}.` : 'Couldn\'t send.', ok ? 'ok' : 'bad');
        break;
      }
      case 'unmaskall': {
        const on = !S.unmasked;
        if (!confirm(on ? 'Unmask everyone? The whole loop, every shirt and every guess go to everyone.' : 'Hide the loop again?')) return;
        const { ok } = await post('/santa/admin', { action: 'unmask', on });
        if (!ok) { cmsg('Couldn\'t do that.', 'bad'); return; }
        if (DEMO) { if (on) { buildDemoUnwrap(); demoStage = 'unwrap'; } else { S.unmasked = null; demoStage = 'gifting'; } renderStage(); } else refresh(true);
        break;
      }
    }
  });

  // ---------- Example data (?santa=countdown|room|reveal|gifting|unwrap) ----------
  function demoState() {
    const me = meName(), chain = [...names].sort((a, b) => ((a.charCodeAt(0) * 7 + a.length * 13) % 17) - ((b.charCodeAt(0) * 7 + b.length * 13) % 17) || a.localeCompare(b));
    const g = chain[(chain.indexOf(me) + 1) % chain.length];
    const now = Date.now();
    S = {
      signed: [...names], dates: {}, mine: null, drawn: CLOSES.getTime() + 4000, crew: [...names],
      start: null, started: null, unmasked: null, purchaseBy: '2026-12-05', eventAt: new Date('2026-12-12T19:00:00-05:00').getTime(), ship: false,
      opened: names.filter((_, i) => i % 3 !== 2), seen: names.filter((_, i) => i % 3 !== 1),
      totals: { bought: 7, delivered: 4, total: names.length }, remind: true, props: { mine: {}, cards: 7 }, rsvp: { in: names.slice(0, 7), out: [names[9]], mine: null }, place: '', notes: '',
      // The sleigh race: everyone but you somewhere on the track.
      race: Object.fromEntries(names.map((n, i) => [n, n === me ? 0 : [3, 2, 4, 1, 5, 0, 2, 3, 1, 4, 2, 3][i % 12]])),
      you: {
        giftee: { name: g, size: 'XL', colors: ['Black', 'Navy', 'Sport Grey'] }, gift: null, guess: null, opened: demoStage !== 'reveal',
        board: [(now % 300) + 17, (now % 300) + 211], photo: null,
        msgs: { giftee: [{ mine: true, text: 'Is XL right, or do you size up?', at: now }, { mine: false, text: 'XL is perfect. They run true.', at: now }],
          santa: [{ mine: false, text: 'Black or navy? Same shirt comes in both.', at: now }, { mine: true, text: 'Black, always.', at: now }] },
      },
      commish: names.map((n, i) => ({ manager: n, card: true, opened: i % 3 !== 2 ? now : null, ordered: i < 7 ? '2026-11-20' : null, eta: i < 7 ? '2026-11-26' : null, delivered: i < 4 ? '2026-11-25' : null })),
      _chain: chain,
    };
    if (demoStage !== 'countdown' && demoStage !== 'room') { S.start = REVEAL.getTime() + 120000; S.started = S.start; }
    if (demoStage === 'unwrap') buildDemoUnwrap();
    R.giftee = S.you.giftee;
  }
  function buildDemoUnwrap() {
    const chain = S._chain, gifts = {}, guesses = {};
    chain.forEach((n, i) => { const santa = chain[(i + chain.length - 1) % chain.length]; gifts[n] = i === 5 ? null : { shirt: (i * 263 + 41) % SHIRTS, title: '', url: '' }; guesses[n] = i % 3 === 0 ? santa : chain[(i + 4) % chain.length] === n ? null : chain[(i + 4) % chain.length]; });
    // No real photos in the preview; yours shows if you took one this visit.
    S.unwrap = { chain, gifts, guesses, photos: PHOTOS.has(meName()) ? { [meName()]: Date.now() } : {} }; S.unmasked = Date.now();
    S.race = Object.fromEntries(chain.map(n => [n, 5]));
    S.shirtys = Object.fromEntries(SHIRTYS.map(([k], i) => [k, { voters: [9, 7, 8, 0, 0][i], mine: null, result: null }]));
  }
  function demoRoomSetup() { R.demoHere = new Set(names.filter((_, i) => i % 4 !== 1)); R.demoHere.add(meName()); }
  function demoBeat() {
    if (!R.demoHere) demoRoomSetup();
    const lines = R.demoLines || (R.demoLines = [[names[3], 'joined'], [names[7], '🔥'], [names[1], '👀']]);
    const events = [];
    if (!R.after) lines.forEach(([n, t], k) => events.push({ id: k + 1, manager: n, kind: t === 'joined' ? 'join' : 'react', emoji: t }));
    else if (Math.random() < 0.5) { const here = [...R.demoHere].filter(n => n !== meName()); events.push({ id: R.after + 1, manager: here[Math.floor(Math.random() * here.length)], kind: 'react', emoji: EMOJI[Math.floor(Math.random() * 5)] }); }
    return { present: [...R.demoHere], holding: [], start: R.start, events, flags: Object.fromEntries([...R.demoHere].map((n, i) => [n, n === meName() ? { snd: R.snd, cam: !!CAM.stream } : { snd: i % 3 !== 0, cam: i % 4 === 0 }])) };
  }
  function demoArrive() {
    names.filter(n => !R.demoHere.has(n)).forEach((n, i) => later(() => {
      R.demoHere.add(n);
      const ev = { id: R.after + 1, manager: n, kind: 'join' };
      applyRoom({ ...demoBeat(), events: [ev] });
    }, 600 + i * 1000));
  }

  // ---------- Drawing the page ----------
  function renderStage(keep) {
    cleanups.forEach(f => f()); cleanups = [];
    const st = stage(), signup = st === 'before' || st === 'open';
    $('cols').hidden = !signup;
    $('stage').hidden = signup;
    $('wrap').classList.toggle('narrow', signup ? st === 'before' : !['countdown', 'room', 'gifting', 'unwrap'].includes(st));
    if (signup) { renderWho(); renderRules(); renderCard(); }
    else if (!loaded) $('stage').innerHTML = loadFailed ? '<p class="tiny">Couldn\'t load Secret Santa. Try again in a minute.</p>' : '<p class="tiny">Loading…</p>';
    else {
      $('stage').innerHTML = (DEMO ? `<p class="preview-note">Preview with example data. Nothing here is saved.</p>` : '') + V[st]();
      if (INIT[st]) INIT[st]();
    }
    renderCommish();
    if (!['room', 'countdown'].includes(st) && $('cine').hidden) wake(false);
    if (!keep) document.body.dataset.stage = st;
  }
  async function loadState() {
    const r = await fetch(WORKER_URL + '/santa', { headers: authHeaders(), cache: 'no-store' });
    if (!r.ok) throw new Error('santa ' + r.status);
    S = await r.json();
    signed = new Set(S.signed); counts = S.dates || {}; mine = S.mine; saved = S.mine;
    draft = S.mine ? { ...blank(), ...S.mine, colors: [...S.mine.colors], dates: [...S.mine.dates] } : blank();
  }
  async function loadRoster() {
    const [lg, fr] = await Promise.all([
      fetch('data/league.json').then(r => r.json()),
      fetch('data/franchise.json').then(r => r.json()).catch(() => ({ players: [] })),
    ]);
    const year = Math.max(...lg.seasons.map(s => s.year));
    names = [...new Set(lg.seasons.filter(s => s.year === year).map(s => s.player))].sort((a, b) => a.localeCompare(b));
    logos = {}; teams = {}; FR = {};
    for (const p of fr.players || []) { FR[p.name] = p; if (p.current_team_logo) logos[p.name] = p.current_team_logo; if (p.current_team_name) teams[p.name] = p.current_team_name; }
  }
  // Loads again and redraws if the stage moved on (or `force`).
  async function refresh(force) {
    const before = stage();
    if (!DEMO) { try { await loadState(); } catch (e) { return; } }
    if (force || stage() !== before) renderStage();
  }
  async function init() {
    renderStage();
    try {
      await Promise.all([loadRoster(), DEMO ? null : loadState()]);
      if (DEMO) demoState();
      loaded = true;
    } catch (err) { loadFailed = true; console.error(err); }
    renderStage();
  }
  // Signing in or out on this page changes whose page this is.
  addEventListener('rl-auth', async () => { try { if (!DEMO) await loadState(); } catch (e) {} renderStage(); });
  setInterval(() => {
    const el = $('closes-in'); if (el) el.textContent = closesText();
    // The clock moves the page on: sign-ups close, the Room opens.
    if (!DEMO && loaded && !R.holdPhase && $('cine').hidden) {
      const want = stage();
      if (want !== document.body.dataset.stage) refresh(true);
      else if (want === 'room' && S && !S.started && !R.counting) { /* the Room's heartbeat keeps itself fresh */ }
    }
  }, 30 * 1000);
  addEventListener('resize', () => { if ($('drawgrid')) slipLayout([...Array(crew().length).keys()]); });
  init();

  // ---------- Shirts drifting down with the snow ----------
  // Any of the shirt designs on thegoodshirts.com (icons/santa/shirts/NNN.webp).
  if (!REDUCED) {
    const bg = $('snowbg');
    setInterval(() => {
      if (document.hidden) return;
      const im = new Image(), w = 22 + Math.random() * 22, H = innerHeight;
      im.src = shirtImg(Math.floor(Math.random() * SHIRTS));
      im.alt = '';
      im.style.left = (Math.random() * 96).toFixed(1) + '%';
      im.style.width = w.toFixed(0) + 'px';
      bg.appendChild(im);
      im.animate([{ transform: `translateY(-60px) rotate(${Math.random() * 60 - 30}deg)` }, { transform: `translate(${Math.random() * 40 - 20}px,${H + 20}px) rotate(${Math.random() * 120 - 60}deg)` }],
        { duration: 11000 + Math.random() * 6000, easing: 'linear' }).finished.then(() => im.remove(), () => im.remove());
    }, 1100);
  }
</script>
