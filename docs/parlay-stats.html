<!-- The two font-family's woff2 files Google serves for the latin subset
     at the weights this site uses -- one variable-font file per family
     covers every weight declared, confirmed directly by fetching the
     stylesheet below and comparing each @font-face block's url(). Starts
     the actual font downloads immediately, in parallel with that
     stylesheet fetch, instead of waiting to discover these same URLs
     only after the stylesheet loads and is parsed -- avoids the
     fallback-to-webfont swap (FOUT) that otherwise shows on a slow or
     uncached load. If Google ever changes these hashed URLs, this just
     degrades to a wasted (unused) preload, not a correctness issue -- the
     stylesheet's own @font-face still fetches whatever the new URL is. -->
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/bigshouldersdisplay/v24/fC1_PZJEZG-e9gHhdI4-NBbfd2ys3SjJCx1czNDu.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* Four tabs and the Year on one row (redesign 2026-10-22): Parlays (the
     parlay itself), Leaders (every manager ranking, one card a stat),
     Bets (what kinds of bets win) and Managers (one manager at a time).
     A little less padding than the shared tab so all four fit beside the
     Year on an iPhone without the track scrolling. */
  #category-tab-row .tab{ padding: 0 8px; }
  /* The Year only ever holds All-Time or a year, so it needn't keep the
     shared 140px floor (sized for manager names). Fixed rather than
     shrink-to-fit, so it doesn't change size between options either. */
  @media (max-width: 600px){ #scope-select{ min-width: 0; width: 102px; padding: 0 10px 0 12px; white-space: nowrap; } }
  .stats-cards{ margin-top: 4px; }
  .tab-view{ display: grid; gap: 14px; }
  .stat-card{ overflow: hidden; }
  .stat-card-title.split{ display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .pm-cap{ display: block; color: var(--text-dim); font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }

  /* ---------- Parlays ---------- */
  .ph-big{ font-family: var(--scoreboard); font-weight: 800; font-size: 3.4rem; line-height: 0.95; color: var(--gold); font-variant-numeric: tabular-nums; }
  .ph-big small{ font-size: 0.5em; color: var(--text-dim); font-weight: 700; margin-left: 4px; }
  .ph-sub{ color: var(--text-dim); font-size: 0.84rem; margin-top: 8px; line-height: 1.45; }
  .ph-sub b{ color: var(--text); font-weight: 600; }

  /* Every parlay: a row per week, a square per leg in kickoff order, the
     first loss crossed and everything after it faded. */
  .pg-yr{ display: flex; justify-content: space-between; color: var(--text-dim); font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin: 12px 4px 4px; }
  .pg-yr:first-child{ margin-top: 0; }
  .pg-yr .r{ font-variant-numeric: tabular-nums; }
  .pg-row{ display: grid; grid-template-columns: 38px minmax(0, 1fr) 40px; gap: 8px; align-items: center; width: 100%; padding: 3px 4px; margin: 1px 0; border: 1px solid transparent; border-radius: 8px; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .pg-row.sel{ background: rgba(255,255,255,0.04); border-color: var(--ctl-line); }
  @media (hover: hover){ .pg-row:hover{ background: rgba(255,255,255,0.04); } }
  .pg-wk{ font-family: var(--scoreboard); font-weight: 700; font-size: 0.95rem; color: var(--text-dim); }
  .pg-cells{ display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 3px; }
  .pc{ height: 18px; border-radius: 4px; border: 1px solid var(--ctl-line); position: relative; }
  .pc.Win{ background: var(--turf); border-color: var(--turf); }
  .pc.Loss{ background: var(--loss); border-color: var(--loss); }
  .pc.after{ opacity: 0.28; }
  .pc.Pending{ border-style: dashed; }
  .pc.kill::after{ content: "✕"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; font-weight: 800; line-height: 1; color: #1A0A07; }
  .pg-n{ font-family: var(--scoreboard); font-weight: 700; font-size: 1rem; text-align: right; font-variant-numeric: tabular-nums; }
  .pg-n small{ color: var(--text-dim); font-size: 0.75em; }
  .pg-key{ display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--text-dim); font-size: 0.72rem; margin-top: 12px; }
  .pg-key span{ display: inline-flex; align-items: center; gap: 6px; }
  .pg-key .pc{ width: 14px; height: 14px; }
  .pg-key .pc.kill::after{ font-size: 9px; }
  .pg-detail{ margin-top: 12px; padding: 10px 12px; font-size: 0.84rem; line-height: 1.5; }
  .pg-detail .dim{ color: var(--text-dim); }
  .pg-detail a{ color: var(--gold); font-weight: 600; text-decoration: none; }
  @media (min-width: 721px){
    .pg-cells{ grid-template-columns: repeat(12, minmax(0, 40px)); gap: 5px; }
    .pg-row{ grid-template-columns: 44px auto minmax(0, 1fr); }
  }

  /* How far they got: one dot per finished parlay over its legs-hit count. */
  .uc{ display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 4px; align-items: end; }
  .uc-col{ display: flex; flex-direction: column-reverse; gap: 3px; align-items: center; }
  .uc-dot{ width: 100%; max-width: 22px; aspect-ratio: 1; border-radius: 50%; background: rgba(212,180,106,0.35); }
  .uc-dot.most{ background: var(--gold); }
  .uc-ax{ display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 4px; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 5px; }
  .uc-ax span{ text-align: center; color: var(--text-dim); font-size: 0.66rem; font-variant-numeric: tabular-nums; }
  .uc-cap{ display: flex; justify-content: space-between; gap: 10px; color: var(--text-dim); font-size: 0.72rem; margin-top: 8px; }
  .uc-cap b{ color: var(--gold); }
  .stat-card-title .scope-row{ margin: 0; }

  .wk-list{ display: grid; gap: 6px; }
  a.wk{ display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 12px; align-items: center; color: inherit; text-decoration: none; }
  @media (hover: hover){ a.wk:hover{ background: var(--item-hover); } }
  .wk-t{ font-weight: 700; font-size: 0.9rem; }
  .wk-s{ color: var(--text-dim); font-size: 0.76rem; grid-column: 1; }
  .wk-v{ grid-column: 2; grid-row: 1 / span 2; text-align: right; }
  .wk-v b{ display: block; font-family: var(--scoreboard); font-weight: 700; font-size: 1.35rem; color: var(--gold); line-height: 1; font-variant-numeric: tabular-nums; }
  .wk-v span{ display: block; margin-top: 3px; color: var(--text-dim); font-size: 0.58rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }

  /* ---------- Leaders: a card per stat ----------
     The leader big (every tied name), #2 and #3 under it, the full 12 in a
     sheet (phone) or a popover under the card (desktop), as Game Records
     opens a record's top 10. Any name opens that manager's tab. */
  .lgrid{ display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  /* Ten stats: two columns on a phone, five on a desktop (two full rows). */
  @media (min-width: 900px){ .lgrid{ grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; } }
  .lc{ display: flex; flex-direction: column; min-width: 0; }
  .lc-t{ padding: 13px 14px 0; font-weight: 700; font-size: 0.84rem; }
  .lc-lead{ padding: 8px 14px 0; }
  .lc-lead .v{ font-family: var(--scoreboard); font-weight: 800; font-size: 2rem; line-height: 1; color: var(--gold); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .lc.bad .lc-lead .v{ color: var(--loss); }
  .lc-lead .n{ font-weight: 700; font-size: 0.9rem; margin-top: 4px; overflow-wrap: anywhere; }
  .lc-lead .s{ color: var(--text-dim); font-size: 0.7rem; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lc-next{ margin: 10px 10px 0; display: grid; gap: 2px; }
  .lc-next > div{ display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 6px; font-size: 0.76rem; padding: 3px 4px; }
  .lc-next .rk{ color: var(--text-dim); font-family: var(--scoreboard); font-weight: 700; }
  .lc-next .n{ overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lc-next .v{ font-family: var(--scoreboard); font-weight: 700; font-variant-numeric: tabular-nums; }
  .lc-all{ margin: auto 10px 10px; padding-top: 10px; }
  .lc-all button{ width: 100%; height: 32px; border-radius: 16px; border: 1px solid var(--ctl-line); background: none; color: var(--text-dim); font: inherit; font-size: 0.76rem; font-weight: 600; cursor: pointer; }
  .lc-all button.on{ color: var(--gold); border-color: var(--lead-line); }
  @media (hover: hover){ .lc-all button:hover{ color: var(--text); background: rgba(255,255,255,0.05); } }
  .lc .mgr-tap{ background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; }
  .lc.has-pop{ border-color: var(--lead-line); }

  .ls-head{ display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .ls-title{ font-weight: 700; font-size: 1rem; }
  .ls-note{ color: var(--text-dim); font-size: 0.76rem; line-height: 1.4; margin: 4px 0 10px; }
  .ls-rows{ display: grid; gap: 4px; padding-bottom: 6px; }
  .ls-row{ display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 12px; min-height: 44px; width: 100%; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  @media (hover: hover){ .ls-row:hover{ background: var(--item-hover); } }
  .ls-row.top{ border-color: var(--lead-line); background: var(--lead-tint); }
  .ls-row.top.bad{ border-color: var(--loss-line); background: var(--loss-tint); }
  .ls-row .rk{ font-family: var(--scoreboard); font-weight: 700; color: var(--text-dim); text-align: center; font-size: 1.05rem; }
  .ls-row .n{ font-weight: 700; font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ls-row .s{ color: var(--text-dim); font-size: 0.72rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ls-row .v{ font-family: var(--scoreboard); font-weight: 700; font-size: 1.15rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ls-row .v.up{ color: var(--turf); } .ls-row .v.down{ color: var(--loss); }
  #ls-pop{ max-height: 70vh; overflow-y: auto; }

  /* ---------- Bets ---------- */
  .bets-head{ display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  @media (min-width: 721px){ .bets-head{ grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .bh{ padding: 12px; min-width: 0; }
  .bh .v{ font-family: var(--scoreboard); font-weight: 800; font-size: 1.5rem; line-height: 1.05; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bh .v.up{ color: var(--turf); } .bh .v.down{ color: var(--loss); }
  .bh .s{ color: var(--text-dim); font-size: 0.74rem; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .pm-tile.thin b{ color: var(--text-dim); }
  /* ---------- Managers tab ----------
     One manager's parlay franchise (mockup option A, 2026-10-22): the
     shared .fhero up top, then Overview / Splits / Legs. Everything is
     worked out here from the Worker's `weeks`, so the Year scope applies
     to all of it. Legs use the shared leg card from theme.css. */
  .mgr-row{ margin: -2px 0 14px; }
  .mgr-view{ display: grid; gap: 14px; }
  .mgr-view > .tabs{ margin: 0; justify-self: start; max-width: 100%; }
  .pm-avatar{ position: relative; width: 56px; height: 56px; border-radius: 50%; overflow: hidden; flex-shrink: 0; border: 2px solid var(--gold); }
  .pm-avatar img{ width: 100%; height: 100%; object-fit: cover; display: block; }
  .pm-ph{ position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--scoreboard); font-weight: 800; font-size: 1.3rem; color: #fff; }
  .pm-avatar img + .pm-ph{ display: none; }

  /* $100 on every leg: one gold line, the ground above $0 green and below
     it red, a dot per graded leg in its result's colour. */
  .pm-chart{ position: relative; padding: 4px 0 0; }
  .pm-chart svg{ display: block; width: 100%; overflow: visible; }
  .pm-chart .ax{ fill: var(--text-dim); font-size: 10px; font-family: var(--body); font-variant-numeric: tabular-nums; }
  .pm-chart .grid{ stroke: rgba(255,255,255,0.06); }
  .pm-chart .zero{ stroke: rgba(255,255,255,0.28); stroke-dasharray: 3 3; }
  .pm-chart .yr{ stroke: rgba(255,255,255,0.14); }
  .pm-chart .gain{ fill: rgba(79,174,122,0.16); }
  .pm-chart .lose{ fill: rgba(214,98,79,0.13); }
  .pm-chart .line{ fill: none; stroke: var(--gold); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .pm-chart .dot{ stroke: #121212; stroke-width: 1; }
  .pm-chart .dot.Win{ fill: var(--turf); }
  .pm-chart .dot.Loss{ fill: var(--loss); }
  .pm-chart .end{ fill: var(--gold); stroke: #121212; stroke-width: 2; }
  .pm-chart .xh{ stroke: rgba(255,255,255,0.35); }
  .pm-chart .xd{ fill: none; stroke: var(--text); stroke-width: 2; }
  .pm-tip{ position: absolute; top: 0; width: 200px; pointer-events: none; z-index: 2; background: #1C1C1B; border: 1px solid var(--ctl-line); border-radius: 10px; padding: 7px 9px; font-size: 0.74rem; line-height: 1.35; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
  .pm-tip .t1{ color: var(--text-dim); font-size: 0.64rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
  .pm-tip .t2{ font-weight: 600; margin: 2px 0; }
  .pm-tip .t3{ color: var(--text-dim); font-size: 0.72rem; }
  .pm-tip .t4{ margin-top: 4px; font-variant-numeric: tabular-nums; }
  .pm-tip .up{ color: var(--turf); } .pm-tip .down{ color: var(--loss); }

  /* Last 8 legs, oldest on the left, and the three runs under them. */
  .pm-form{ display: flex; gap: 5px; }
  .pm-form > div{ flex: 1; min-width: 0; text-align: center; }
  .pm-form i{ display: grid; place-items: center; height: 30px; border-radius: 8px; border: 1px solid var(--ctl-line); font-style: normal; font-family: var(--scoreboard); font-weight: 700; font-size: 0.95rem; color: var(--text-dim); }
  .pm-form i.Win{ color: var(--turf); border-color: var(--win-line); background: var(--win-tint); }
  .pm-form i.Loss{ color: var(--loss); border-color: var(--loss-line); background: var(--loss-tint); }
  .pm-form span{ display: block; color: var(--text-dim); font-size: 0.6rem; margin-top: 4px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .pm-pods{ display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
  .pm-pod{ padding: 10px 6px; text-align: center; min-width: 0; }
  .pm-pod b{ display: block; font-family: var(--scoreboard); font-weight: 700; font-size: 1.6rem; line-height: 1.05; color: var(--gold); font-variant-numeric: tabular-nums; }
  .pm-pod b.up{ color: var(--turf); } .pm-pod b.down{ color: var(--loss); }
  .pm-pod small{ display: block; color: var(--text-dim); font-size: 0.7rem; margin-top: 3px; }

  /* Longest odds hit / safest miss. */
  .pm-pair{ display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  @media (min-width: 721px){ .pm-pair{ grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
  .pm-pick{ padding: 11px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 12px; align-items: center; border-radius: 10px; }
  .pm-pick .pm-cap{ grid-column: 1 / -1; margin: 0; }
  .pm-pick .what{ font-size: 0.88rem; color: var(--text-dim); min-width: 0; overflow-wrap: anywhere; }
  .pm-pick .what b{ color: var(--text); font-weight: 600; }
  .pm-pick .when{ color: var(--text-dim); font-size: 0.74rem; }
  .pm-pick .odds{ grid-column: 2; grid-row: 2 / span 2; font-family: var(--scoreboard); font-weight: 700; font-size: 1.5rem; color: var(--gold); font-variant-numeric: tabular-nums; }

  /* Splits: a tile per sport / bet type / odds range / side, W-L big. */
  .pm-tiles{ display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
  .pm-tile{ padding: 9px 10px 10px; min-width: 0; }
  .pm-tile .tl{ color: var(--text-dim); font-size: 0.72rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pm-tile .tr{ color: var(--text-dim); opacity: 0.75; font-size: 0.62rem; font-weight: 600; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; margin-top: 1px; }
  .pm-tile b{ display: block; font-family: var(--scoreboard); font-weight: 700; font-size: 1.55rem; line-height: 1.1; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .pm-tile b.up{ color: var(--turf); } .pm-tile b.down{ color: var(--loss); }
  .pm-tile small{ display: block; color: var(--text-dim); font-size: 0.68rem; font-variant-numeric: tabular-nums; }

  /* Every leg: the shared leg card, with the bet type where Parlay Results
     puts the manager, and a third row for "Killed it" / "Sacko week". */
  .pm-legs .scope-row{ margin: 0 0 12px; }
  .pm-legs .leg-day{ display: flex; justify-content: space-between; margin-top: 8px; }
  .pm-legs .leg-day:first-child{ margin-top: 0; }
  .pm-legs .leg-day .r{ font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
  .leg-body.tagged{ grid-template-areas: "name odds score status" "bet bet bet bet" "tags tags tags tags"; }
  .leg-tags{ grid-area: tags; display: flex; flex-wrap: wrap; gap: 5px; }
  .leg-tags .badge.dim{ border-color: var(--ctl-line); }
  @media (min-width: 900px){
    .leg-body.tagged{ grid-template-areas: "name bet odds score status" "name tags odds score status"; }
  }

</style>
</head>
<body>
  <div id="site-nav"></div>
  <div class="wrap">
    <header>
      <div class="header-row">
        <div>
          <div class="eyebrow">Retirement League</div>
          <h1>Parlay Stats</h1>
        </div>
        <div class="updated-block">
          <div class="updated-label">Updated</div>
          <div class="updated-value" id="updated-at">—</div>
        </div>
      </div>
    </header>

    <section>
      <!-- No section heading and no second row of tabs: the title says what
           this is, the tabs say which group, and the Year says which years.
           Each group's cards come in pairs, so they sit in the grid as they
           always did, all of them at once. -->
      <div class="controls-row">
        <div class="tabs scroll" id="category-tab-row" data-glide-panel="stats-container"></div>
        <div class="selector-group">
          <label class="selector-label" for="scope-select">Year</label>
          <select class="parlay-select" id="scope-select" autocomplete="off"></select>
        </div>
      </div>
      <!-- Managers tab only. No caption: the names say what it picks. -->
      <div class="mgr-row" id="mgr-row" hidden>
        <label class="sr-only" for="mgr-select">Manager</label>
        <select class="parlay-select" id="mgr-select" autocomplete="off"></select>
      </div>
      <div class="card-grid stats-cards" id="stats-container"><div class="loading-row">Loading stats…</div></div>
    </section>

    <footer id="site-footer" data-source="Data from the league sheet"></footer>
  </div>

<script src="nav.js?v=44"></script>
<script src="page-common.js?v=42"></script>
<script src="parlay-common.js?v=1"></script>
<script>
  const WORKER_URL = 'https://retirement-league-refresh-proxy.bradbutcher321.workers.dev';

  function fmtOdds(o) {
    if (o === null || o === undefined) return '—';
    const n = Math.round(o);
    return (n > 0 ? '+' : '') + n.toLocaleString();
  }
  function fmtMoney(n) {
    if (n === null || n === undefined) return '—';
    return '$' + Number(n).toLocaleString(undefined, { maximumFractionDigits: 0 });
  }
  function fmtPct(n) {
    return n === null || n === undefined ? '—' : Number(n).toFixed(1) + '%';
  }
  // ---------- Stat cards ----------
  const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
  const pill = (text, up) => `<span class="pill ${up ? 'up' : 'down'}">${text}</span>`;
  const short$ = n => {
    const a = Math.abs(n);
    const t = a >= 1e6 ? (a / 1e6).toFixed(2).replace(/\.?0+$/, '') + 'M' : a >= 1e3 ? Math.round(a / 1e3) + 'K' : String(Math.round(a));
    return (n < 0 ? '−' : '') + '$' + t;
  };
  const nameHtml = n => `<span class="${isMe(n) ? 'me-name' : ''}">${esc(n)}</span>`;
  const scoped = (data, scope) => data.weeks.filter(w => scope === 'all' || String(w.year) === scope);
  // A week's legs in kickoff order (the sheet's manager order breaks ties),
  // the way Parlay Results lists them.
  const legsOf = (w, players) => players.filter(p => w.picks[p]).map(p => ({ who: p, ...w.picks[p] }))
    .sort((a, b) => (a.gametime || '9999').localeCompare(b.gametime || '9999'));
  const weekHref = w => pageLink('parlay-results.html', { year: w.year, week: w.week });

  // ---------- Parlays ----------
  const PS = { pick: null, uc: 'all' };

  function parlaysView(data, scope) {
    const ws = scoped(data, scope), st = data.stats[scope];
    const done = ws.filter(w => w.final.result !== 'Pending');
    const hit = done.filter(w => w.final.result === 'Win').length;
    const legs = ws.flatMap(w => Object.values(w.picks)).filter(p => p.result === 'Win' || p.result === 'Loss');
    const lw = legs.filter(p => p.result === 'Win').length, ll = legs.length - lw;
    const close = st.closest_calls[0], miss = st.biggest_misses[0];
    const wins = w => Object.values(w.picks).filter(p => p.result === 'Win').length;
    const avgHit = done.length ? done.reduce((a, w) => a + wins(w), 0) / done.length : null;
    const live = ws.find(w => w.final.result === 'Pending');
    const sub = [
      close ? `Closest: <b>${close.legs_hit} of 12</b> legs, ${close.year} Week ${close.week}.` : '',
      live ? `Week ${live.week} is still alive.` : '',
    ].filter(Boolean).join(' ');
    const side = [
      ['Legs', `${lw}-${ll}`], ['Leg Win %', fmtPct(lw + ll ? lw / (lw + ll) * 100 : null)],
      ['Avg Legs Hit', avgHit === null ? '—' : avgHit.toFixed(1)], ['Biggest Miss', miss ? short$(miss.payout) : '—'],
    ].map(([l, v]) => `<div class="fs"><div class="fs-v">${v}</div><div class="fs-l">${l}</div></div>`).join('');
    const hero = `<div class="fhero"><div class="fhero-main"><span class="pm-cap">Parlays hit</span><div class="ph-big">${hit}<small>of ${done.length}</small></div>${sub ? `<div class="ph-sub">${sub}</div>` : ''}</div><div class="fhero-stats">${side}</div></div>`;

    const years = [...new Set(ws.map(w => w.year))].sort((a, b) => b - a);
    const grid = years.map(yr => {
      const yw = ws.filter(w => w.year === yr).sort((a, b) => b.week - a.week);
      const rows = yw.map(w => {
        const L = legsOf(w, data.players), killers = new Set(w.killed_by || []);
        const killed = L.find(x => killers.has(x.who));
        const cells = L.map(x => {
          const after = killed && x.result !== 'Pending' && (x.gametime || '') > (killed.gametime || '');
          return `<span class="pc ${x.result}${killers.has(x.who) ? ' kill' : ''}${after ? ' after' : ''}"></span>`;
        }).join('');
        const id = `${w.year}-${w.week}`;
        return `<button type="button" class="pg-row${PS.pick === id ? ' sel' : ''}" data-wk="${id}" aria-label="${w.year} Week ${w.week}: ${wins(w)} of ${L.length} legs hit"><span class="pg-wk">Wk ${w.week}</span><span class="pg-cells">${cells}</span><span class="pg-n">${wins(w)}<small>/${L.length}</small></span></button>`;
      }).join('');
      const rec = `${yw.filter(w => w.final.result === 'Win').length}-${yw.filter(w => w.final.result === 'Loss').length}`;
      return `<div class="pg-yr"><span>${yr}</span><span class="r">${rec}</span></div>${rows}`;
    }).join('');
    const picked = PS.pick && ws.find(w => `${w.year}-${w.week}` === PS.pick);
    const detail = picked ? weekDetail(picked, data.players)
      : '<span class="dim">Tap a week for who killed it and what it would have paid.</span>';

    const notable = (title, rows, val, sub2) => `<div class="stat-card"><div class="stat-card-title">${title}</div><div class="stat-card-body"><div class="wk-list">${rows.map(r =>
      `<a class="item wk" href="${esc(weekHref(r))}"><div class="wk-t">${r.year} · Week ${r.week}</div><div class="wk-s">${sub2(r)}</div><div class="wk-v">${val(r)}</div></a>`).join('') || '<div class="empty-note">None yet.</div>'}</div></div></div>`;
    const ucSeg = `<div class="scope-row" id="uc-mode">${[['all', 'Legs hit'], ['first', 'Before first loss']].map(([k, l]) => `<button type="button" class="scope-btn${PS.uc === k ? ' on' : ''}" data-uc="${k}">${l}</button>`).join('')}</div>`;
    return `<div class="tab-view">${hero}
      <div class="stat-card"><div class="stat-card-title">Every parlay</div><div class="stat-card-note">A square per leg in kickoff order. ✕ is the first loss; the legs after it are faded.</div>
        <div class="stat-card-body">${grid || '<div class="empty-note">No parlays yet.</div>'}
          <div class="pg-key"><span><i class="pc Win"></i>Win</span><span><i class="pc Loss"></i>Loss</span><span><i class="pc Loss kill"></i>Killed it</span><span><i class="pc Win after"></i>After it died</span><span><i class="pc Pending"></i>Pending</span></div>
          <div class="item pg-detail" aria-live="polite">${detail}</div></div></div>
      <div class="stat-card"><div class="stat-card-title split">How far they got ${ucSeg}</div><div class="stat-card-body">${unitChart(done, data.players)}</div></div>
      <div class="card-grid">
        ${notable('Biggest Misses', st.biggest_misses, r => `<b>${short$(r.payout)}</b><span>Payout</span>`, r => `Killed by ${r.killed_by.map(nameHtml).join(' & ')} · ${r.legs_hit}/12 hit`)}
        ${notable('Closest Calls', st.closest_calls, r => `<b>${r.legs_hit}/12</b><span>Legs hit</span>`, r => `Missed: ${r.lost_by.map(nameHtml).join(', ')}`)}
      </div></div>`;
  }

  function weekDetail(w, players) {
    const L = legsOf(w, players), killers = w.killed_by || [];
    const hitN = L.filter(x => x.result === 'Win').length;
    const k = L.filter(x => killers.includes(x.who)).map(x =>
      `${nameHtml(x.who)} · ${esc(x.pick)} ${esc(fmtOdds(x.odds))}${x.detail ? ` <span class="dim">(${esc(x.detail)})</span>` : ''}`).join('<br>');
    const head = `<span class="pm-cap">${w.year} · Week ${w.week} · ${hitN}/${L.length} hit · would have paid ${short$(w.final.payout || 0)}</span>`;
    const body = k ? `<span class="dim">Killed by</span> ${k}` : `<span class="dim">${w.final.result === 'Pending' ? 'Still alive.' : 'Nobody lost a leg.'}</span>`;
    return `${head}${body}<br><a href="${esc(weekHref(w))}">Open the week ›</a>`;
  }

  // Legs hit, or legs hit before the first loss (generate_parlay_data.py's
  // before_loss: won before the earliest losing kickoff), one dot a week.
  function unitChart(done, players) {
    const cols = Array.from({ length: 13 }, () => []);
    done.forEach(w => {
      const L = legsOf(w, players);
      const losses = L.filter(x => x.result === 'Loss' && x.gametime).map(x => x.gametime).sort();
      const n = L.filter(x => x.result === 'Win' && (PS.uc === 'all' || !losses.length || (x.gametime && x.gametime < losses[0]))).length;
      cols[Math.min(12, n)].push(w);
    });
    if (!done.length) return '<div class="empty-note">No finished parlays yet.</div>';
    const most = Math.max(...cols.map(c => c.length));
    const avg = cols.reduce((a, c, i) => a + c.length * i, 0) / done.length;
    return `<div class="uc">${cols.map((c, i) => `<div class="uc-col">${c.map(w => `<span class="uc-dot${c.length === most ? ' most' : ''}" title="${w.year} Week ${w.week}: ${i}"></span>`).join('')}</div>`).join('')}</div>
      <div class="uc-ax">${cols.map((_, i) => `<span>${i}</span>`).join('')}</div>
      <div class="uc-cap"><span>One dot per parlay</span><span>Average <b>${avg.toFixed(1)}</b></span></div>`;
  }

  // ---------- Leaders ----------
  // One card a stat. `val` ranks (high first), `tb` orders within a tie
  // without breaking it; `v` is what shows, `s` the line under a name (an
  // array is one short line each, so neither half gets cut off).
  const BOARDS = [
    { k: 'winpct', title: 'Leg Win %', note: 'Share of their legs that won.', rows: s => s.individual_wl.map(r => ({ n: r.player, val: r.win_pct, v: fmtPct(r.win_pct), s: `${r.w}-${r.l}` })) },
    { k: 'flat', title: 'Flat Bet Profit', note: 'What $100 on every one of their legs would have made.', rows: s => s.flat_bet_profit.map(r => ({ n: r.player, val: Math.round(r.profit), v: flatTxt(r.profit), s: plural(r.bets, 'leg'), t: r.profit >= 0 ? 'up' : 'down' })) },
    { k: 'odds', title: 'Average Odds', note: 'How long their legs are on average. Higher is riskier.', rows: s => s.average_odds.map(r => ({ n: r.player, val: r.avg_odds, v: fmtOdds(r.avg_odds), s: '' })) },
    { k: 'wstreak', title: 'Longest Win Streak', note: 'Most legs won in a row. "Now" is a run still going.', rows: s => s.streaks.map(r => ({ n: r.player, val: r.longest_win, tb: Math.max(r.current, 0), v: r.longest_win, s: r.current > 0 ? `Now W${r.current}` : '' })) },
    { k: 'hit', title: 'Biggest Hit', note: 'Their longest-odds leg that won.', rows: s => s.biggest_hits.map(r => ({ n: r.player, val: -impliedProb(r.odds), v: fmtOdds(r.odds), s: r.pick })) },
    { k: 'potential', title: 'Potential Earnings', note: 'Payouts of the weeks their leg won, minus the weeks it lost. High means they came through when the parlay was worth the most.', rows: s => s.potential_earnings.map(r => ({ n: r.player, val: Math.round(r.winnings - r.losses), v: short$(r.winnings - r.losses), s: '', t: r.winnings >= r.losses ? 'up' : 'down' })) },
    { k: 'lstreak', bad: true, title: 'Longest Losing Streak', note: 'Most legs lost in a row. "Now" is a run still going.', rows: s => s.streaks.map(r => ({ n: r.player, val: r.longest_loss, tb: Math.max(-r.current, 0), v: r.longest_loss, s: r.current < 0 ? `Now L${-r.current}` : '' })) },
    { k: 'kills', bad: true, title: 'Parlays Killed', note: 'Times their leg was the first loss of the week; legs that lose at the same kickoff each get a full kill. "Plays" is where their leg usually falls in kickoff order. A kill chance is a week the parlay was still alive when their game ended: a win kept it going, a loss killed it.', rows: s => s.parlays_killed.map(r => ({ n: r.player, val: Math.round(r.kills), v: Math.round(r.kills), s: [r.avg_bet_position === null ? '' : `Plays ${r.avg_bet_position.toFixed(1)} of 12`, plural(r.kill_chances, 'kill chance')].filter(Boolean) })) },
    { k: 'safe', bad: true, title: 'Safest Loss', note: 'Their heaviest favorite that still lost.', rows: s => s.safest_losses.map(r => ({ n: r.player, val: impliedProb(r.odds), v: fmtOdds(r.odds), s: r.pick })) },
    { k: 'sackos', bad: true, title: 'Weekly Sackos', note: 'Weeks they finished last in fantasy and bought the parlay.', rows: s => s.weekly_sackos.map(r => ({ n: r.player, val: r.sackos, v: r.sackos, s: `${fmtMoney(r.cost)} spent` })) },
  ];
  // High to low; ties share a rank (Franchise's rule: the number of rows strictly ahead, plus one).
  function ranked(b, st) {
    const rows = b.rows(st).slice().sort((x, y) => y.val - x.val || (y.tb || 0) - (x.tb || 0));
    rows.forEach(r => { r.r = rows.filter(o => o.val > r.val).length + 1; r.tie = rows.filter(o => o.val === r.val).length > 1; });
    return rows;
  }
  const rkTxt = r => (r.tie ? 'T' : '') + r.r;
  const LS = { open: null };

  function leadersView(data, scope) {
    const st = data.stats[scope];
    return `<div class="lgrid">${BOARDS.map(b => {
      const rows = ranked(b, st);
      if (!rows.length) return '';
      const top = rows.filter(r => r.r === 1), next = rows.filter(r => r.r > 1).slice(0, 2);
      const names = top.map(r => `<button type="button" class="mgr-tap" data-mgr="${esc(r.n)}">${nameHtml(r.n)}</button>`).join(' & ');
      const sub = top.length > 1 ? ['Tied'] : [].concat(top[0].s || []);
      return `<div class="stat-card lc${b.bad ? ' bad' : ''}${LS.open === b.k ? ' has-pop' : ''}" data-board="${b.k}">
        <div class="lc-t">${b.title}</div>
        <div class="lc-lead"><div class="v">${esc(top[0].v)}</div><div class="n">${names}</div>${sub.map(t => `<div class="s" title="${esc(t)}">${esc(t)}</div>`).join('')}</div>
        <div class="lc-next">${next.map(r => `<div><span class="rk">${rkTxt(r)}</span><button type="button" class="mgr-tap n" data-mgr="${esc(r.n)}">${nameHtml(r.n)}</button><span class="v">${esc(r.v)}</span></div>`).join('')}</div>
        <div class="lc-all"><button type="button" class="${LS.open === b.k ? 'on' : ''}" data-list="${b.k}" aria-expanded="${LS.open === b.k}">All ${rows.length}</button></div>
      </div>`;
    }).join('')}</div>`;
  }

  function listHtml(b, st) {
    const rows = ranked(b, st).map(r => `
      <button type="button" class="item ls-row${r.r === 1 ? ' top' : ''}${b.bad ? ' bad' : ''}${isMe(r.n) ? ' me' : ''}" data-mgr="${esc(r.n)}">
        <span class="rk">${rkTxt(r)}</span>
        <span style="min-width:0"><span class="n" style="display:block">${esc(r.n)}</span>${r.s && r.s.length ? `<span class="s" style="display:block">${esc([].concat(r.s).join(' · '))}</span>` : ''}</span>
        <span class="v ${r.t || ''}">${esc(r.v)}</span>
      </button>`).join('');
    return {
      head: `<div class="ls-head"><div class="ls-title">${b.title}</div><button type="button" class="x" data-close aria-label="Close">&times;</button></div><div class="ls-note">${b.note}</div>`,
      rows: `<div class="ls-rows">${rows}</div>`,
    };
  }
  const oneColumn = matchMedia('(max-width:720px)');
  function closeList() {
    LS.open = null;
    document.querySelectorAll('#ls-sheet, #ls-pop, .scrim').forEach(el => el.remove());
    document.querySelectorAll('.lc.has-pop').forEach(c => c.classList.remove('has-pop'));
    document.querySelectorAll('[data-list]').forEach(b => { b.classList.remove('on'); b.setAttribute('aria-expanded', 'false'); });
  }
  // Phone: a bottom sheet (page-common.js lets it swipe down). Desktop: a
  // popover under the card, its width, the way Game Records does it.
  function openList(k, st) {
    closeList();
    const b = BOARDS.find(x => x.k === k);
    LS.open = k;
    const l = listHtml(b, st);
    const card = document.querySelector(`.lc[data-board="${k}"]`);
    card.classList.add('has-pop');
    const btn = card.querySelector('[data-list]');
    btn.classList.add('on'); btn.setAttribute('aria-expanded', 'true');
    if (oneColumn.matches) {
      document.body.insertAdjacentHTML('beforeend', `<div class="scrim" data-close></div><div class="sheet" id="ls-sheet" role="dialog" aria-modal="true" aria-label="${esc(b.title)}">
        <div class="sheet-grab"><span></span></div><div class="sheet-head">${l.head}</div><div class="sheet-body">${l.rows}</div></div>`);
      return;
    }
    document.body.insertAdjacentHTML('beforeend', `<div class="pop" id="ls-pop" role="dialog" aria-label="${esc(b.title)}">${l.head}${l.rows}</div>`);
    const pop = document.getElementById('ls-pop'), r = card.getBoundingClientRect();
    const w = Math.max(r.width, 360), left = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8);
    pop.style.width = w + 'px';
    pop.style.left = (left + scrollX) + 'px';
    pop.style.top = (r.bottom + scrollY + 10) + 'px';
    pop.style.setProperty('--arrow-x', (r.left + r.width / 2 - left) + 'px');
    const below = pop.getBoundingClientRect().bottom - innerHeight + 16;
    if (below > 0) scrollBy({ top: Math.min(below, r.top - 80), behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  }

  // ---------- Bets ----------
  function betsView(data, scope) {
    const s = data.stats[scope];
    const FEW = 5, ENOUGH = 8;
    const byVolume = rows => rows.slice().sort((a, b) => (b.w + b.l) - (a.w + a.l) || b.win_pct - a.win_pct);
    // The most-bet `keep`, then everything else folded into one tile.
    const fold = (rows, key, keep) => {
      const v = byVolume(rows);
      if (v.length <= keep + 1) return v;
      const rest = v.slice(keep), w = rest.reduce((a, r) => a + r.w, 0), l = rest.reduce((a, r) => a + r.l, 0);
      return [...v.slice(0, keep), { [key]: `${rest.length} others`, w, l, win_pct: w + l ? w / (w + l) * 100 : null }];
    };
    const tiles = (rows, key) => rows.map(r => {
      const n = r.w + r.l, thin = n < FEW;
      return `<div class="item pm-tile${thin ? ' thin' : ''}"><div class="tl" title="${esc(r[key])}">${esc(r[key])}</div>${key === 'range' ? oddsRangeHtml(r[key]) : ''}<b class="${thin ? '' : wlTone(r.w, r.l)}">${r.w}-${r.l}</b><small>${fmtPct(r.win_pct)}${thin ? ' · few' : ''}</small></div>`;
    }).join('');
    const card = (title, rows, key, note) => rows.length ? `<div class="stat-card"><div class="stat-card-title">${title}</div>${note ? `<div class="stat-card-note">${note}</div>` : ''}<div class="stat-card-body"><div class="pm-tiles">${tiles(rows, key)}</div></div></div>` : '';
    const pool = [...s.sport_wl.map(r => ({ ...r, k: r.sport })), ...s.bet_type_wl.map(r => ({ ...r, k: r.bet_type }))].filter(r => r.w + r.l >= ENOUGH);
    const best = pool.slice().sort((a, b) => b.win_pct - a.win_pct)[0], worst = pool.slice().sort((a, b) => a.win_pct - b.win_pct)[0];
    const fav = s.odds_type_wl.find(r => r.odds_type === 'Favorite'), dog = s.odds_type_wl.find(r => r.odds_type === 'Underdog');
    // A best/worst names the bet, so its record goes underneath; favorites and
    // underdogs already show the record big, so only the % goes there.
    const head = (cap, r, label, cls) => `<div class="item bh"><span class="pm-cap">${cap}</span><div class="v ${cls || ''}">${r ? esc(label(r)) : '—'}</div><div class="s">${r ? (r.k ? `${r.w}-${r.l} · ` : '') + fmtPct(r.win_pct) : ''}</div></div>`;
    return `<div class="tab-view">
      <div class="stat-card"><div class="stat-card-body" style="padding:14px">
        <div class="bets-head">${head('Best bet', best, r => r.k, 'up')}${head('Worst bet', worst, r => r.k, 'down')}${head('Favorites', fav, r => `${r.w}-${r.l}`)}${head('Underdogs', dog, r => `${r.w}-${r.l}`)}</div>
        <div class="stat-card-note" style="padding:10px 2px 0">Best and worst count only sports and bet types with ${ENOUGH}+ legs.</div>
      </div></div>
      <div class="card-grid">
        ${card('Sport', fold(s.sport_wl, 'sport', 5), 'sport', `Most-bet first. Grey is under ${FEW} legs.`)}
        ${card('Bet Type', fold(s.bet_type_wl, 'bet_type', 8), 'bet_type')}
        ${card('Odds', s.odds_range_wl, 'range')}
        ${card('Day', s.day_of_week_wl, 'day')}
        ${card('Over / Under', s.over_under_wl, 'side')}
      </div></div>`;
  }
  // ---------- Managers tab ----------
  // One manager's parlay franchise, worked out from the Worker's `weeks`
  // (every pick ever placed) so it agrees with the cards on the other tabs:
  // "Flat $100" is the same $100-a-leg sum as Flat Bet Profit, and a shared
  // kill is a full kill for each, as on Parlays Killed.
  const MGR = { sub: 0, res: 'all', teams: null, teamsAsked: false };
  const MGR_SUBS = ['Overview', 'Splits', 'Legs'];
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const legWin = odds => (odds > 0 ? odds : 10000 / -odds);
  const impliedProb = odds => (odds > 0 ? 100 / (odds + 100) : -odds / (-odds + 100));
  const flatTxt = n => { const r = Math.round(n); return (r < 0 ? '−' : r > 0 ? '+' : '') + fmtMoney(Math.abs(r)); };
  const wlTone = (w, l) => (w > l ? 'up' : w < l ? 'down' : '');
  const hashColor = name => { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0; return `hsl(${h % 360}, 45%, 32%)`; };
  const pickRest = p => { const t = String(p.pick || ''), i = t.indexOf(':'); return i > 0 ? t.slice(i + 1).trim() : ''; };
  const ODDS_BUCKETS = ['Heavy Favorite', 'Favorite', 'Toss-Up', 'Underdog', 'Longshot'];
  // The line each bucket covers, printed small under its name on the tiles.
  const ODDS_RANGE = { 'Heavy Favorite': '≤ −250', 'Favorite': '−249 to −150', 'Toss-Up': '−149 to +124', 'Underdog': '+125 to +199', 'Longshot': '≥ +200' };
  const oddsRangeHtml = k => (ODDS_RANGE[k] ? `<div class="tr">${ODDS_RANGE[k]}</div>` : '');
  // generate_parlay_data.py's odds_bucket and over_under_side.
  const oddsBucket = o => (o <= -250 ? 'Heavy Favorite' : o <= -150 ? 'Favorite' : o < 125 ? 'Toss-Up' : o < 200 ? 'Underdog' : 'Longshot');
  const overUnder = p => { const m = /\b(Over|Under)\b/i.exec(pickRest(p)); return m ? m[1][0].toUpperCase() + m[1].slice(1).toLowerCase() : null; };

  // Every leg one manager placed in the scope, oldest first: what $100 on it
  // won or lost (net) and the running total after it (run).
  function mgrLegs(weeks, name, scope) {
    let run = 0;
    const out = [];
    weeks.forEach(w => {
      if (scope !== 'all' && String(w.year) !== scope) return;
      const p = w.picks[name];
      if (!p) return;
      const graded = p.result === 'Win' || p.result === 'Loss';
      const net = graded && p.odds ? (p.result === 'Win' ? legWin(p.odds) : -100) : null;
      if (net !== null) run += net;
      const killers = w.killed_by || [];
      out.push({ ...p, year: w.year, week: w.week, graded, net, run: net === null ? null : run,
        kill: killers.includes(name) ? 1 : 0, shared: killers.length > 1, sacko: w.sacko === name });
    });
    return out;
  }

  function mgrSummary(data, name, scope) {
    const legs = mgrLegs(data.weeks, name, scope);
    const g = legs.filter(x => x.graded);
    const w = g.filter(x => x.result === 'Win').length, l = g.length - w;
    let cur = 0, longW = 0, longL = 0;
    g.forEach(x => {
      if (x.result === 'Win') { cur = cur > 0 ? cur + 1 : 1; longW = Math.max(longW, cur); }
      else { cur = cur < 0 ? cur - 1 : -1; longL = Math.max(longL, -cur); }
    });
    const s = data.stats[scope] || {};
    const avg = (s.average_odds || []).find(r => r.player === name);
    const sk = (s.weekly_sackos || []).find(r => r.player === name);
    const byProb = (a, b) => impliedProb(a.odds) - impliedProb(b.odds);
    return {
      name, legs, w, l, pct: w + l ? w / (w + l) * 100 : null, cur, longW, longL,
      kills: legs.reduce((a, x) => a + x.kill, 0),
      flat: g.reduce((a, x) => a + (x.net || 0), 0),
      avg: avg ? avg.avg_odds : null, sackos: sk ? sk.sackos : 0,
      best: g.filter(x => x.result === 'Win' && x.odds).sort(byProb)[0] || null,
      worst: g.filter(x => x.result === 'Loss' && x.odds).sort(byProb).pop() || null,
    };
  }

  // Franchise's "#N in X" pills: top 3 only, ties sharing a rank, gold for
  // the good end and red for the bad.
  function mgrRanks(all, s) {
    const out = [];
    const add = (get, higher, ok, label, bad) => {
      const v = get(s);
      if (!ok || v === null || v === undefined) return;
      const r = all.filter(o => { const x = get(o); return x !== null && x !== undefined && (higher ? x > v : x < v); }).length + 1;
      if (r <= 3) out.push({ label: `#${r} in ${label}`, bad });
    };
    add(o => o.pct, true, s.pct !== null, 'Win %', false);
    add(o => Math.round(o.flat), true, s.flat > 0, 'Flat Bet Profit', false);
    add(o => o.longW, true, s.longW > 0, 'Win Streak', false);
    add(o => o.pct, false, s.pct !== null, 'Lowest Win %', true);
    add(o => Math.round(o.flat), false, s.flat < 0, 'Flat Bet Losses', true);
    add(o => o.kills, true, s.kills > 0, 'Parlays Killed', true);
    add(o => o.longL, true, s.longL > 0, 'Losing Streak', true);
    return out.sort((a, b) => a.bad - b.bad);
  }

  // The shared .fhero, as on Franchise: team logo and name (the dropdown
  // above already names the manager), the rank pills, then the stat strip.
  function mgrHero(s, all) {
    const team = (MGR.teams || {})[s.name] || {};
    const years = [...new Set(s.legs.map(x => x.year))];
    const span = years.length > 1 ? `${years[0]}–${years[years.length - 1]}` : String(years[0] || '');
    const sub = [plural(s.legs.length, 'leg'), span].filter(Boolean).join(' · ');
    const ranks = mgrRanks(all, s).map(b => `<span class="rank-badge${b.bad ? ' bad' : ''}">${esc(b.label)}</span>`).join('');
    const logo = team.logo ? `<img src="${esc(team.logo)}" alt="" onerror="this.remove()">` : '';
    const side = [
      ['Record', `${s.w}-${s.l}`],
      ['Win %', fmtPct(s.pct)],
      ['Avg Odds', fmtOdds(s.avg)],
      ['Flat $100', flatTxt(s.flat)],
      ['Kills', s.kills],
      [s.sackos === 1 ? 'Sacko' : 'Sackos', s.sackos],
    ].map(([label, v]) => `<div class="fs"><div class="fs-v">${esc(v)}</div><div class="fs-l">${label}</div></div>`).join('');
    return `
      <div class="fhero">
        <div class="fhero-main">
          <div class="fhero-id">
            <span class="pm-avatar">${logo}<span class="pm-ph" style="background:${hashColor(s.name)}">${esc(monogram(s.name))}</span></span>
            <div style="min-width:0">
              <div class="fhero-name">${esc(team.team || s.name)}</div>
              <div class="fhero-sub">${esc(sub)}</div>
            </div>
          </div>
          ${ranks ? `<div class="hero-pills scroll">${ranks}</div>` : ''}
        </div>
        <div class="fhero-stats">${side}</div>
      </div>`;
  }

  function mgrOverview(s) {
    const graded = s.legs.filter(x => x.net !== null).length;
    const last = s.legs.slice(-8);
    const cur = s.cur > 0 ? `<b class="up">W${s.cur}</b>` : s.cur < 0 ? `<b class="down">L${-s.cur}</b>` : '<b>—</b>';
    const form = last.map(x => `<div><i class="${x.result}">${x.result === 'Win' ? 'W' : x.result === 'Loss' ? 'L' : '·'}</i><span>'${String(x.year).slice(2)} Wk ${x.week}</span></div>`).join('');
    const pickPod = (x, label) => x ? `
      <div class="item pm-pick ${x.result === 'Win' ? 'is-win' : 'is-loss'}">
        <span class="pm-cap">${label}</span>
        <div class="what"><b>${esc(betTypeOf(x))}</b> · ${esc(pickRest(x))}</div>
        <div class="odds">${esc(fmtOdds(x.odds))}</div>
        <div class="when">${x.year} · Week ${x.week}${x.sport ? ' · ' + esc(x.sport) : ''}</div>
      </div>` : '';
    const pair = pickPod(s.best, 'Longest odds hit') + pickPod(s.worst, 'Safest miss');
    return `
      <div class="card-grid">
        <div class="stat-card">
          <div class="stat-card-title split">$100 on every leg ${graded ? pill(flatTxt(s.flat), s.flat >= 0) : ''}</div>
          <div class="stat-card-body">${graded ? '<div class="pm-chart" id="pm-chart"></div>' : '<div class="empty-note">No legs graded yet.</div>'}</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-title">Last ${plural(last.length, 'leg')}</div>
          <div class="stat-card-body">
            <div class="pm-form">${form}</div>
            <div class="pm-pods">
              <div class="item pm-pod"><span class="pm-cap">Current</span>${cur}<small>in a row</small></div>
              <div class="item pm-pod"><span class="pm-cap">Best run</span><b>${s.longW}</b><small>straight wins</small></div>
              <div class="item pm-pod"><span class="pm-cap">Worst run</span><b>${s.longL}</b><small>straight losses</small></div>
            </div>
          </div>
        </div>
      </div>
      ${pair ? `<div class="stat-card"><div class="stat-card-title">Best and worst</div><div class="stat-card-body"><div class="pm-pair">${pair}</div></div></div>` : ''}`;
  }

  function mgrSplits(s) {
    const g = s.legs.filter(x => x.graded);
    const tally = (keyOf, order) => {
      const m = new Map();
      g.forEach(x => {
        const k = keyOf(x);
        if (!k) return;
        const t = m.get(k) || { k, w: 0, l: 0 };
        if (x.result === 'Win') t.w++; else t.l++;
        m.set(k, t);
      });
      return order ? order.map(k => m.get(k)).filter(Boolean) : [...m.values()].sort((a, b) => (b.w + b.l) - (a.w + a.l) || b.w - a.w);
    };
    const groups = [
      ['Sport', tally(x => x.sport)],
      ['Bet Type', tally(x => betTypeOf(x) || null)],
      ['Odds', tally(x => (x.odds ? oddsBucket(x.odds) : null), ODDS_BUCKETS)],
      ['Over / Under', tally(overUnder, ['Over', 'Under'])],
    ].filter(([, rows]) => rows.length);
    if (!groups.length) return '<div class="stat-card"><div class="empty-note">No legs graded yet.</div></div>';
    const tile = r => `<div class="item pm-tile"><div class="tl">${esc(r.k)}</div>${oddsRangeHtml(r.k)}<b class="${wlTone(r.w, r.l)}">${r.w}-${r.l}</b><small>${fmtPct(r.w / (r.w + r.l) * 100)}</small></div>`;
    return `<div class="card-grid">${groups.map(([title, rows]) => `
      <div class="stat-card"><div class="stat-card-title">${title}</div><div class="stat-card-body"><div class="pm-tiles">${rows.map(tile).join('')}</div></div></div>`).join('')}</div>`;
  }

  // The leg card from Parlay Results, with the bet type where that page
  // puts the manager and the week where it puts the kickoff.
  function mgrLegRow(x) {
    const d = x.gametime ? new Date(x.gametime) : null;
    const status = x.result === 'Win' ? '<span class="badge turf">Win</span>'
      : x.result === 'Loss' ? '<span class="badge loss">Loss</span>' : '<span class="badge dim">Pending</span>';
    const tags = (x.kill ? `<span class="badge loss">${x.shared ? 'Shared kill' : 'Killed it'}</span>` : '')
      + (x.sacko ? '<span class="badge dim">Sacko week</span>' : '');
    const rest = pickRest(x);
    return `
      <div class="leg ${x.result}">
        <div class="leg-rail">${x.sport ? `<span class="sp">${esc(x.sport)}</span>` : ''}<span class="t">Wk ${x.week}</span>${d && !Number.isNaN(d.getTime()) ? `<span class="p">${MONTHS[d.getMonth()]} ${d.getDate()}</span>` : ''}</div>
        <div class="leg-body${tags ? ' tagged' : ''}">
          <span class="leg-name">${esc(betTypeOf(x) || x.pick)}</span>
          <span class="leg-odds">${esc(fmtOdds(x.odds))}</span>
          <div class="leg-bet">${esc(rest)}${x.matchup ? `${rest ? ' · ' : ''}${esc(x.matchup)}` : ''}</div>
          <span class="leg-score">${finalChipHtml(x)}</span>
          <span class="leg-status">${status}</span>
          ${tags ? `<div class="leg-tags">${tags}</div>` : ''}
        </div>
      </div>`;
  }

  function mgrLegList(s) {
    const n = r => s.legs.filter(x => x.result === r).length;
    const opts = [['all', 'All', s.legs.length], ['Win', 'Wins', n('Win')], ['Loss', 'Losses', n('Loss')]];
    const seg = `<div class="scope-row" id="pm-res">${opts.map(([k, label, c]) => `<button type="button" class="scope-btn${MGR.res === k ? ' on' : ''}" data-res="${k}">${label} ${c}</button>`).join('')}</div>`;
    const rows = s.legs.filter(x => MGR.res === 'all' || x.result === MGR.res).reverse();
    const years = [...new Set(rows.map(x => x.year))];
    const list = years.map(y => {
      const ys = s.legs.filter(x => x.year === y);
      const rec = `${ys.filter(x => x.result === 'Win').length}-${ys.filter(x => x.result === 'Loss').length}`;
      return `<div class="leg-day"><span>${y}</span><span class="r">${rec}</span></div>${rows.filter(x => x.year === y).map(mgrLegRow).join('')}`;
    }).join('');
    return `<div class="stat-card pm-legs"><div class="stat-card-body">${seg}<div class="legs-list">${list || '<div class="empty-note">No legs here.</div>'}</div></div></div>`;
  }

  function renderManager(data, scope, name) {
    const all = data.players.map(p => mgrSummary(data, p, scope));
    const s = all.find(x => x.name === name);
    const body = !s.legs.length ? '<div class="stat-card"><div class="empty-note">No legs this season.</div></div>'
      : [mgrOverview, mgrSplits, mgrLegList][MGR.sub](s);
    const tabs = MGR_SUBS.map((t, i) => `<button type="button" class="tab${i === MGR.sub ? ' on' : ''}" data-sub="${i}">${t}</button>`).join('');
    return { html: `${mgrHero(s, all)}<div class="tabs" id="mgr-tabs" data-glide-panel="mgr-body">${tabs}</div><div id="mgr-body">${body}</div>`, s };
  }

  // The running total, one point per graded leg, a season's first leg
  // marked with a line. Hover or touch for the leg under the finger.
  function drawMgrChart(s) {
    const el = document.getElementById('pm-chart');
    if (!el) return;
    const g = s.legs.filter(x => x.net !== null);
    const W = el.clientWidth || 360, H = 160, padL = 46, padR = 10, padT = 10, padB = 22;
    const vals = [0, ...g.map(x => x.run)];
    let lo = Math.min(...vals), hi = Math.max(...vals);
    const raw = (hi - lo || 100) / 4, mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map(f => f * mag).find(v => v >= raw);
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    const x = i => padL + (i + 1) / g.length * (W - padL - padR);
    const y = v => padT + (hi - v) / (hi - lo) * (H - padT - padB);
    let grid = '';
    for (let v = lo; v <= hi + step / 2; v += step) {
      grid += `<line class="${Math.abs(v) < step / 2 ? 'zero' : 'grid'}" x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}"/>`
        + `<text class="ax" x="${padL - 7}" y="${y(v) + 3.5}" text-anchor="end">${Math.abs(v) < step / 2 ? '$0' : flatTxt(v)}</text>`;
    }
    [...new Set(g.map(p => p.year))].forEach((yr, k) => {
      const first = g.findIndex(p => p.year === yr);
      const at = k === 0 ? padL : (x(first - 1) + x(first)) / 2;
      if (k) grid += `<line class="yr" x1="${at}" x2="${at}" y1="${padT}" y2="${H - padB}"/>`;
      grid += `<text class="ax" x="${at + (k ? 5 : 0)}" y="${H - 6}">${yr}</text>`;
    });
    const line = `M${padL},${y(0)}` + g.map((p, i) => `L${x(i).toFixed(1)},${y(p.run).toFixed(1)}`).join('');
    const area = `${line}L${x(g.length - 1).toFixed(1)},${y(0)}Z`;
    const end = g[g.length - 1];
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Running total of $100 on every leg: ${esc(flatTxt(end.run))}">
      <defs><clipPath id="pm-up"><rect x="0" y="0" width="${W}" height="${y(0)}"/></clipPath><clipPath id="pm-dn"><rect x="0" y="${y(0)}" width="${W}" height="${H}"/></clipPath></defs>
      ${grid}
      <path class="gain" d="${area}" clip-path="url(#pm-up)"/><path class="lose" d="${area}" clip-path="url(#pm-dn)"/>
      <path class="line" d="${line}"/>
      ${g.map((p, i) => `<circle class="dot ${p.result}" cx="${x(i)}" cy="${y(p.run)}" r="2.6"/>`).join('')}
      <circle class="end" cx="${x(g.length - 1)}" cy="${y(end.run)}" r="5"/>
      <line class="xh" x1="0" x2="0" y1="${padT}" y2="${H - padB}" visibility="hidden"/>
      <circle class="xd" r="5" visibility="hidden"/>
    </svg><div class="pm-tip" hidden></div>`;
    const svg = el.querySelector('svg'), tip = el.querySelector('.pm-tip');
    const xh = svg.querySelector('.xh'), xd = svg.querySelector('.xd');
    const show = ev => {
      const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * (W / r.width);
      const i = Math.max(0, Math.min(g.length - 1, Math.round((px - padL) / (W - padL - padR) * g.length - 1)));
      const p = g[i], cx = x(i), cy = y(p.run);
      xh.setAttribute('x1', cx); xh.setAttribute('x2', cx); xh.setAttribute('visibility', 'visible');
      xd.setAttribute('cx', cx); xd.setAttribute('cy', cy); xd.setAttribute('visibility', 'visible');
      tip.innerHTML = `<div class="t1">${p.year} · Week ${p.week}${p.sport ? ' · ' + esc(p.sport) : ''}</div>`
        + `<div class="t2">${esc(betTypeOf(p))} ${esc(fmtOdds(p.odds))}</div><div class="t3">${esc(pickRest(p))}</div>`
        + `<div class="t4"><span class="${p.net >= 0 ? 'up' : 'down'}">${p.result} ${flatTxt(p.net)}</span> · Total ${flatTxt(p.run)}</div>`;
      tip.hidden = false;
      const sx = r.width / W, sy = r.height / H;
      tip.style.left = Math.max(0, Math.min(r.width - tip.offsetWidth, cx * sx - tip.offsetWidth / 2)) + 'px';
      tip.style.top = (cy * sy < r.height / 2 ? cy * sy + 14 : cy * sy - tip.offsetHeight - 14) + 'px';
    };
    svg.addEventListener('pointermove', show);
    svg.addEventListener('pointerdown', show);
    const hide = () => { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); xd.setAttribute('visibility', 'hidden'); };
    // A finger lifting is a pointerleave too, so on a phone the leg stays
    // up until the next tap somewhere else.
    svg.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hide(); });
    el.hideTip = hide;
  }
  document.addEventListener('pointerdown', e => {
    const el = document.getElementById('pm-chart');
    if (el && el.hideTip && !el.contains(e.target)) el.hideTip();
  });

  // ---------- Tabs ----------
  // The tab's name in the address (#leaders) so a link or Back lands on it.
  // The old tabs' names still land on where their stats went.
  const TABS = [
    { key: 'parlays', label: 'Parlays', view: parlaysView },
    { key: 'leaders', label: 'Leaders', view: leadersView },
    { key: 'bets', label: 'Bets', view: betsView },
    { key: 'managers', label: 'Managers', managers: true },
  ];
  const OLD_TABS = { legs: 'parlays', betting: 'leaders', misc: 'leaders', breakdowns: 'bets' };

  fetch(WORKER_URL + '/parlay-stats', { cache: 'no-store' })
    .then(res => res.json())
    .then(data => {
      const { stats } = data;
      data.weeks = [...(data.weeks || [])].sort((a, b) => a.year - b.year || a.week - b.week);
      // A link with a manager in it (?m=Brad) opens on that manager.
      const hash = location.hash.slice(1);
      const linkedTab = OLD_TABS[hash] || hash || (urlParam('m') ? 'managers' : '');
      let activeCategory = Math.max(0, TABS.findIndex(t => t.key === linkedTab));
      let activeScope = 'all';
      if (OLD_TABS[hash]) history.replaceState(null, '', '#' + TABS[activeCategory].key);

      const scopeSelect = document.getElementById('scope-select');
      const categoryTabRow = document.getElementById('category-tab-row');
      const statsContainer = document.getElementById('stats-container');
      const mgrRow = document.getElementById('mgr-row');
      const mgrSelect = document.getElementById('mgr-select');
      const names = [...data.players].sort((a, b) => a.localeCompare(b));
      mgrSelect.innerHTML = names.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
      // A link (?m=) first, then you, then the first name.
      mgrSelect.value = matchName(names, urlParam('m')) || matchName(names, getMe()) || names[0];

      // Team names and logos come from franchise.json, asked for the first
      // time the tab opens; until then (or if it fails) the hero shows the
      // manager's name and monogram.
      function loadTeams() {
        if (MGR.teamsAsked) return;
        MGR.teamsAsked = true;
        fetch('data/franchise.json', { cache: 'no-cache' }).then(r => r.json()).then(d => {
          MGR.teams = Object.fromEntries((d.players || []).map(p => [p.name, { team: p.current_team_name, logo: p.current_team_logo }]));
          if (TABS[activeCategory].managers) renderStats();
        }).catch(() => {});
      }

      const scopes = ['all', ...[...(data.years || [])].sort((a, b) => b - a).map(String)];
      scopeSelect.innerHTML = scopes.map(s => `<option value="${s}">${s === 'all' ? 'All-Time' : s}</option>`).join('');
      scopeSelect.value = activeScope;
      categoryTabRow.innerHTML = TABS.map((c, i) => `<button type="button" class="tab${i === activeCategory ? ' on' : ''}" data-i="${i}">${c.label}</button>`).join('');

      function renderStats() {
        const s = stats[activeScope];
        if (!s) return;
        const managers = !!TABS[activeCategory].managers;
        closeList();
        mgrRow.hidden = !managers;
        statsContainer.className = managers ? 'stats-cards mgr-view' : 'stats-cards';
        if (managers) {
          loadTeams();
          const view = renderManager(data, activeScope, mgrSelect.value);
          statsContainer.innerHTML = view.html;
          drawMgrChart(view.s);
          keepSelectedInView(document.getElementById('mgr-tabs'));
        } else {
          statsContainer.innerHTML = TABS[activeCategory].view(data, activeScope);
        }
        keepSelectedInView(categoryTabRow);
      }
      mgrSelect.addEventListener('change', () => {
        setUrlParams({ m: mgrSelect.value });
        renderStats();
      });
      // A name on Leaders (or in its list) opens that manager's tab.
      function showManager(name) {
        mgrSelect.value = name;
        activeCategory = TABS.findIndex(t => t.managers);
        MGR.sub = 0;
        [...categoryTabRow.children].forEach((b, i) => b.classList.toggle('on', i === activeCategory));
        history.replaceState(null, '', '#managers');
        setUrlParams({ m: name });
        renderStats();
        scrollTo({ top: 0 });
      }
      // Overview / Splits / Legs and All / Wins / Losses (Managers); a week
      // and Legs hit / Before first loss (Parlays); All 12 (Leaders).
      statsContainer.addEventListener('click', e => {
        const t = e.target;
        const mgr = t.closest('[data-mgr]');
        if (mgr) { showManager(mgr.dataset.mgr); return; }
        const list = t.closest('[data-list]');
        if (list) { if (LS.open === list.dataset.list) closeList(); else openList(list.dataset.list, stats[activeScope]); return; }
        const wk = t.closest('[data-wk]');
        const uc = t.closest('[data-uc]');
        const sub = t.closest('[data-sub]');
        const res = t.closest('[data-res]');
        if (wk) PS.pick = PS.pick === wk.dataset.wk ? null : wk.dataset.wk;
        else if (uc) PS.uc = uc.dataset.uc;
        else if (sub) MGR.sub = Number(sub.dataset.sub);
        else if (res) MGR.res = res.dataset.res;
        else return;
        renderStats();
      });
      // The All 12 list lives outside the panel: its names, its close button,
      // a tap anywhere else (desktop popover) and Escape.
      document.addEventListener('click', e => {
        if (!LS.open || e.target.closest('[data-list]')) return;
        const inList = e.target.closest('#ls-sheet, #ls-pop');
        const mgr = inList && e.target.closest('[data-mgr]');
        if (mgr) { closeList(); showManager(mgr.dataset.mgr); return; }
        if (e.target.closest('[data-close]') || !inList) closeList();
      });
      document.addEventListener('keydown', e => { if (e.key === 'Escape' && LS.open) closeList(); });
      oneColumn.addEventListener('change', closeList);
      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (TABS[activeCategory].managers && MGR.sub === 0) drawMgrChart(mgrSummary(data, mgrSelect.value, activeScope));
          if (LS.open && !oneColumn.matches) openList(LS.open, stats[activeScope]);
        }, 150);
      });
      scopeSelect.addEventListener('change', () => {
        activeScope = scopeSelect.value;
        PS.pick = null;
        renderStats();
      });
      categoryTabRow.addEventListener('click', e => {
        const btn = e.target.closest('.tab');
        if (!btn) return;
        activeCategory = Number(btn.dataset.i);
        [...categoryTabRow.children].forEach((b, i) => b.classList.toggle('on', i === activeCategory));
        history.replaceState(null, '', '#' + TABS[activeCategory].key);
        setUrlParams({ m: TABS[activeCategory].managers ? mgrSelect.value : null });
        renderStats();
      });
      renderStats();

      setPageStatus(throughLabel(data.generated_at));
    })
    .catch(err => {
      console.error('Parlay stats error:', err);
      document.getElementById('stats-container').innerHTML = '<div class="loading-row" style="color:var(--loss);">Error loading parlay stats.</div>';
    });
</script>
<script src="track.js?v=2" defer></script>
</body>
</html>
