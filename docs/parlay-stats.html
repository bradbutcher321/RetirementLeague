<!-- The two font-family's woff2 files Google serves for the latin subset
     at the weights this site uses -- one variable-font file per family
     covers every weight declared, confirmed directly by fetching the
     stylesheet below and comparing each @font-face block's url(). Starts
     the actual font downloads immediately, in parallel with that
     stylesheet fetch, instead of waiting to discover these same URLs
     only after the stylesheet loads and is parsed -- avoids the
     fallback-to-webfont swap (FOUT) that otherwise shows on a slow or
     uncached load. If Google ever changes these hashed URLs, this just
     degrades to a wasted (unused) preload, not a correctness issue -- the
     stylesheet's own @font-face still fetches whatever the new URL is. -->
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/bigshouldersdisplay/v24/fC1_PZJEZG-e9gHhdI4-NBbfd2ys3SjJCx1czNDu.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2">

<style>
  /* One tab row (the four groups of stats) with the Year beside it. Each group's
     cards sit in pairs in the grid below, so no second row of tabs is needed. */
  .stats-cards{ margin-top: 4px; }

  /* ---------- Stat cards ----------
     .card-grid, the .stat-card family and .pill all live in theme.css; what
     stays here is this page's two departures from them. */
  .stat-card{ overflow: hidden; }
  .pill.flat{ color: var(--text-dim); border-color: var(--line); }

  /* Ranked rows: Game Records' .cols/.ln pattern -- a plain two-column list,
     the record holder picked out with the shared outline accent. */
  .cols{ display: flex; flex-direction: column; }
  .ln{
    display: grid; grid-template-columns: 30px minmax(0,1fr) auto; align-items: center; gap: 12px;
    background: var(--item); border: 1px solid var(--item-line); border-radius: 10px;
    padding: 9px 12px; margin-top: 6px; min-height: 58px;
  }
  .ln.norank{ grid-template-columns: minmax(0,1fr) auto; }
  .ln .rk{ font-family: var(--scoreboard); font-weight: 700; color: var(--text-dim); text-align: center; font-size: 1.2rem; }
  .ln .tm{ font-weight: 700; font-size: 0.92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ln .meta{ color: var(--text-dim); font-size: 0.72rem; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ln.rec.up{ border-color: var(--win-line); background: var(--win-tint); }
  .ln.rec.up .rk{ color: var(--turf); }
  .ln.rec.down{ border-color: var(--loss-line); background: var(--loss-tint); }
  .ln.rec.down .rk{ color: var(--loss); }
  .row-stats{ display: flex; gap: 14px; }
  .row-stat{ text-align: center; min-width: 34px; }
  .row-stat b.up{ color: var(--turf); }
  .row-stat b.down{ color: var(--loss); }
  .ln-val{ font-family: var(--scoreboard); font-weight: 700; font-size: 1.1rem; font-variant-numeric: tabular-nums; }

  /* ---------- Histograms ---------- */
  .hist-row{ display: grid; grid-template-columns: 26px 1fr 30px; align-items: center; gap: 10px; padding: 5px 16px; font-size: 0.82rem; font-variant-numeric: tabular-nums; }
    .hist-row:last-child{ padding-bottom: 12px; }
  .hist-label{ color: var(--text-dim); text-align: right; }
  .hist-track{ height: 10px; }
  .hist-bar{ height: 100%; border-radius: 0 4px 4px 0; min-width: 0; }
  .hist-bar.low{ background: var(--loss); }
  .hist-bar.mid{ background: var(--turf); }
  .hist-bar.full{ background: var(--gold); }
  .hist-count{ text-align: right; font-weight: 600; }
  .hist-count.zero{ color: var(--text-dim); font-weight: 400; }

  /* ---------- Managers tab ----------
     One manager's parlay franchise (mockup option A, 2026-10-22): the
     shared .fhero up top, then Overview / Splits / Legs. Everything is
     worked out here from the Worker's `weeks`, so the Year scope applies
     to all of it. Legs use the shared leg card from theme.css. */
  .mgr-row{ margin: -2px 0 14px; }
  .mgr-view{ display: grid; gap: 14px; }
  .mgr-view > .tabs{ margin: 0; justify-self: start; max-width: 100%; }
  .pm-avatar{ position: relative; width: 56px; height: 56px; border-radius: 50%; overflow: hidden; flex-shrink: 0; border: 2px solid var(--gold); }
  .pm-avatar img{ width: 100%; height: 100%; object-fit: cover; display: block; }
  .pm-ph{ position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--scoreboard); font-weight: 800; font-size: 1.3rem; color: #fff; }
  .pm-avatar img + .pm-ph{ display: none; }
  .stat-card-title.split{ display: flex; justify-content: space-between; align-items: center; gap: 10px; }

  /* $100 on every leg: one gold line, the ground above $0 green and below
     it red, a dot per graded leg in its result's colour. */
  .pm-chart{ position: relative; padding: 4px 0 0; }
  .pm-chart svg{ display: block; width: 100%; overflow: visible; }
  .pm-chart .ax{ fill: var(--text-dim); font-size: 10px; font-family: var(--body); font-variant-numeric: tabular-nums; }
  .pm-chart .grid{ stroke: rgba(255,255,255,0.06); }
  .pm-chart .zero{ stroke: rgba(255,255,255,0.28); stroke-dasharray: 3 3; }
  .pm-chart .yr{ stroke: rgba(255,255,255,0.14); }
  .pm-chart .gain{ fill: rgba(79,174,122,0.16); }
  .pm-chart .lose{ fill: rgba(214,98,79,0.13); }
  .pm-chart .line{ fill: none; stroke: var(--gold); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .pm-chart .dot{ stroke: #121212; stroke-width: 1; }
  .pm-chart .dot.Win{ fill: var(--turf); }
  .pm-chart .dot.Loss{ fill: var(--loss); }
  .pm-chart .end{ fill: var(--gold); stroke: #121212; stroke-width: 2; }
  .pm-chart .xh{ stroke: rgba(255,255,255,0.35); }
  .pm-chart .xd{ fill: none; stroke: var(--text); stroke-width: 2; }
  .pm-tip{ position: absolute; top: 0; width: 200px; pointer-events: none; z-index: 2; background: #1C1C1B; border: 1px solid var(--ctl-line); border-radius: 10px; padding: 7px 9px; font-size: 0.74rem; line-height: 1.35; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
  .pm-tip .t1{ color: var(--text-dim); font-size: 0.64rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
  .pm-tip .t2{ font-weight: 600; margin: 2px 0; }
  .pm-tip .t3{ color: var(--text-dim); font-size: 0.72rem; }
  .pm-tip .t4{ margin-top: 4px; font-variant-numeric: tabular-nums; }
  .pm-tip .up{ color: var(--turf); } .pm-tip .down{ color: var(--loss); }

  /* Last 8 legs, oldest on the left, and the three runs under them. */
  .pm-form{ display: flex; gap: 5px; }
  .pm-form > div{ flex: 1; min-width: 0; text-align: center; }
  .pm-form i{ display: grid; place-items: center; height: 30px; border-radius: 8px; border: 1px solid var(--ctl-line); font-style: normal; font-family: var(--scoreboard); font-weight: 700; font-size: 0.95rem; color: var(--text-dim); }
  .pm-form i.Win{ color: var(--turf); border-color: var(--win-line); background: var(--win-tint); }
  .pm-form i.Loss{ color: var(--loss); border-color: var(--loss-line); background: var(--loss-tint); }
  .pm-form span{ display: block; color: var(--text-dim); font-size: 0.6rem; margin-top: 4px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .pm-pods{ display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
  .pm-pod{ padding: 10px 6px; text-align: center; min-width: 0; }
  .pm-pod b{ display: block; font-family: var(--scoreboard); font-weight: 700; font-size: 1.6rem; line-height: 1.05; color: var(--gold); font-variant-numeric: tabular-nums; }
  .pm-pod b.up{ color: var(--turf); } .pm-pod b.down{ color: var(--loss); }
  .pm-pod small{ display: block; color: var(--text-dim); font-size: 0.7rem; margin-top: 3px; }
  .pm-cap{ display: block; color: var(--text-dim); font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }

  /* Longest odds hit / safest miss. */
  .pm-pair{ display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  @media (min-width: 721px){ .pm-pair{ grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
  .pm-pick{ padding: 11px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 12px; align-items: center; border-radius: 10px; }
  .pm-pick .pm-cap{ grid-column: 1 / -1; margin: 0; }
  .pm-pick .what{ font-size: 0.88rem; color: var(--text-dim); min-width: 0; overflow-wrap: anywhere; }
  .pm-pick .what b{ color: var(--text); font-weight: 600; }
  .pm-pick .when{ color: var(--text-dim); font-size: 0.74rem; }
  .pm-pick .odds{ grid-column: 2; grid-row: 2 / span 2; font-family: var(--scoreboard); font-weight: 700; font-size: 1.5rem; color: var(--gold); font-variant-numeric: tabular-nums; }

  /* Splits: a tile per sport / bet type / odds range / side, W-L big. */
  .pm-tiles{ display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
  .pm-tile{ padding: 9px 10px 10px; min-width: 0; }
  .pm-tile .tl{ color: var(--text-dim); font-size: 0.72rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pm-tile b{ display: block; font-family: var(--scoreboard); font-weight: 700; font-size: 1.55rem; line-height: 1.1; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .pm-tile b.up{ color: var(--turf); } .pm-tile b.down{ color: var(--loss); }
  .pm-tile small{ display: block; color: var(--text-dim); font-size: 0.68rem; font-variant-numeric: tabular-nums; }

  /* Every leg: the shared leg card, with the bet type where Parlay Results
     puts the manager, and a third row for "Killed it" / "Sacko week". */
  .pm-legs .scope-row{ margin: 0 0 12px; }
  .pm-legs .leg-day{ display: flex; justify-content: space-between; margin-top: 8px; }
  .pm-legs .leg-day:first-child{ margin-top: 0; }
  .pm-legs .leg-day .r{ font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
  .leg-body.tagged{ grid-template-areas: "name odds score status" "bet bet bet bet" "tags tags tags tags"; }
  .leg-tags{ grid-area: tags; display: flex; flex-wrap: wrap; gap: 5px; }
  .leg-tags .badge.dim{ border-color: var(--ctl-line); }
  @media (min-width: 900px){
    .leg-body.tagged{ grid-template-areas: "name bet odds score status" "name tags odds score status"; }
  }

</style>

<body>
  <div id="site-nav"></div>
  <div class="wrap">
    <header>

          <div class="updated-label">Updated</div>
          <div class="updated-value" id="updated-at">—</div>
        </div>
      </div>
    </header>

    <section>
      <!-- No section heading and no second row of tabs: the title says what

           Each group's cards come in pairs, so they sit in the grid as they
           always did, all of them at once. -->
      <div class="controls-row">
        <div class="tabs scroll" id="category-tab-row" data-glide-panel="stats-container"></div>
        <div class="selector-group">
          <label class="selector-label" for="scope-select">Year</label>
          <select class="parlay-select" id="scope-select" autocomplete="off"></select>

<script src="nav.js?v=37"></script>
<script src="page-common.js?v=41"></script>
<script src="parlay-common.js?v=1"></script>
<script>
  const WORKER_URL = 'https://retirement-league-refresh-proxy.bradbutcher321.workers.dev';

  function fmtOdds(o) {
    if (o === null || o === undefined) return '—';
    const n = Math.round(o);
    return (n > 0 ? '+' : '') + n.toLocaleString();
  }
  function fmtMoney(n) {
    if (n === null || n === undefined) return '—';
    return '$' + Number(n).toLocaleString(undefined, { maximumFractionDigits: 0 });
  }
  function fmtPct(n) {
    return n === null || n === undefined ? '—' : Number(n).toFixed(1) + '%';
  }
  // ---------- Stat cards ----------
  const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
  const pill = (text, up) => `<span class="pill ${up ? 'up' : 'down'}">${text}</span>`;
  const winPill = pct => pct === null || pct === undefined ? '<span class="pill flat">—</span>' : pill(fmtPct(pct), pct >= 50);
  const signedMoney = n => (n < 0 ? '-' : '') + fmtMoney(Math.abs(n));
  // list entries are [value, label, tone?] -- tone 'up'/'down' colors just that number.
  const stats = list => `<div class="row-stats">${list.map(([v, l, tone]) => `<div class="row-stat"><b class="${tone || ''}">${v}</b><span>${l}</span></div>`).join('')}</div>`;
  // Highlights every item tied for the max (or min) of valueFn's result, by
  // setting item.highlight to the given tone -- used so "tied for the lead"
  // (or "tied for last") picks out every row that qualifies, not just one.
  function highlightExtreme(items, valueFn, which, tone) {
    if (!items.length) return;
    const vals = items.map(valueFn);
    const target = which === 'max' ? Math.max(...vals) : Math.min(...vals);
    items.forEach((it, i) => { if (vals[i] === target) it.highlight = tone; });
  }

  // items: { name, sub/detail, right, unranked, highlight }. Ranked lists
  // (the default) number every row; unless an item sets `highlight`
  // ('up'/'down') explicitly, #1 is picked out the way Game Records does --
  // a colored left border, no separate "top 3" tile treatment. Pass
  // podium: false for lists that are buckets, not rankings (e.g. Favorite
  // vs. Underdog), which renders as a plain unnumbered list instead.
  function rankedCard(title, items, opts = {}) {
    const ranked = opts.podium !== false;
    let rank = 0;
    const rows = items.map(it => {
      const body = `<div style="min-width:0"><div class="tm">${esc(it.name)}</div>${it.detail || it.sub ? `<div class="meta">${esc(it.detail || it.sub)}</div>` : ''}</div>${it.right || '<span></span>'}`;
      if (!ranked) return `<div class="ln norank">${body}</div>`;
      if (!it.unranked) rank++;
      const auto = rank === 1 && !it.unranked ? 'up' : null;
      const tone = it.highlight !== undefined ? it.highlight : auto;
      return `<div class="ln${tone ? ` rec ${tone}` : ''}"><div class="rk">${it.unranked ? '–' : rank}</div>${body}</div>`;
    });
    const cols = `<div class="cols">${rows.join('')}</div>`;
    return `
      <div class="stat-card">
        <div class="stat-card-title">${title}</div>
        ${opts.note ? `<div class="stat-card-note">${opts.note}</div>` : ''}
        <div class="stat-card-body">${cols}</div>
      </div>`;
  }

  // Keeps the 10 most-bet categories (ordered by win %) and folds the rest
  // into a single "All Others" row so the card can't grow without bound.
  function condensedWlItems(rows, key, limit = 10) {
    if (rows.length <= limit) return wlItems(rows, key);
    const byVolume = [...rows].sort((a, b) => (b.w + b.l) - (a.w + a.l));
    const kept = new Set(byVolume.slice(0, limit));
    const others = rows.filter(r => !kept.has(r));
    const w = others.reduce((a, r) => a + r.w, 0);
    const l = others.reduce((a, r) => a + r.l, 0);
    const items = wlItems(rows.filter(r => kept.has(r)), key);
    items.push({
      name: 'All Others', unranked: true, sub: `${w}-${l} · ${others.length} more`, big: fmtPct(w + l ? w / (w + l) * 100 : null),
      right: winPill(w + l ? w / (w + l) * 100 : 0),
    });
    return items;
  }

  function wlItems(rows, key) {
    return rows.map(r => ({ name: r[key], sub: `${r.w}-${r.l}`, big: fmtPct(r.win_pct), right: winPill(r.win_pct) }));
  }

  function histCard(title, rows, note) {
    const max = Math.max(1, ...rows.map(r => r.occurrences));
    const body = rows.map(r => `
      <div class="hist-row">
        <div class="hist-label">${r.legs}</div>
        <div class="hist-track"><div class="hist-bar ${r.legs < 6 ? 'low' : r.legs < 12 ? 'mid' : 'full'}" style="width:${r.occurrences / max * 100}%"></div></div>
        <div class="hist-count${r.occurrences ? '' : ' zero'}">${r.occurrences}</div>
      </div>`).join('');
    return `<div class="stat-card"><div class="stat-card-title">${title}</div><div class="stat-card-note">${note}</div><div class="stat-card-body">${body}</div></div>`;
  }

  function withTotal(rows, key) {
    const tw = rows.reduce((a, r) => a + r.w, 0);
    const tl = rows.reduce((a, r) => a + r.l, 0);
    const items = wlItems(rows, key);
    items.push({ name: 'Total', sub: `${tw}-${tl}`, right: winPill(tw + tl ? tw / (tw + tl) * 100 : null) });
    return items;
  }

  function weekLabel(r) {
    return `${r.year} · Week ${r.week}`;
  }

  // ---------- Individual cards, one function per card, keyed by name ----------
  const CARD = {
    legsPerParlay: s => histCard('Legs Won per Parlay', s.legs_won_per_parlay, 'Weeks by how many of the legs hit, once every leg was graded.'),
    legsBeforeLoss: s => histCard('Legs Won Before First Loss', s.legs_won_before_loss, 'Weeks by how many legs won, in game-time order, before the first loss.'),

    individualWL: s => rankedCard('Individual W/L', wlItems(s.individual_wl, 'player')),
    averageOdds: s => rankedCard('Average Odds', s.average_odds.map(r => ({
      name: r.player, right: `<span class="ln-val">${fmtOdds(r.avg_odds)}</span>`,
    }))),
    winStreaks: s => {
      const rows = [...s.streaks].sort((a, b) => b.longest_win - a.longest_win || b.current - a.current)
        .map(r => ({ player: r.player, longest_win: r.longest_win, curWin: Math.max(r.current, 0) }));
      const maxLongest = Math.max(...rows.map(r => r.longest_win));
      const maxCurrent = Math.max(...rows.map(r => r.curWin));
      return rankedCard('Win Streaks', rows.map(r => {
        const longestTie = r.longest_win === maxLongest;
        const currentTie = maxCurrent > 0 && r.curWin === maxCurrent;
        return {
          name: r.player, sub: `Current ${r.curWin}`,
          right: stats([[r.longest_win, 'Longest', longestTie ? 'up' : null], [r.curWin, 'Current', currentTie ? 'up' : null]]),
          highlight: (longestTie || currentTie) ? 'up' : null,
        };
      }));
    },
    lossStreaks: s => {
      const rows = [...s.streaks].sort((a, b) => b.longest_loss - a.longest_loss || a.current - b.current)
        .map(r => ({ player: r.player, longest_loss: r.longest_loss, curLoss: Math.max(-r.current, 0) }));
      const maxLongest = Math.max(...rows.map(r => r.longest_loss));
      const maxCurrent = Math.max(...rows.map(r => r.curLoss));
      return rankedCard('Losing Streaks', rows.map(r => {
        const longestTie = r.longest_loss === maxLongest;
        const currentTie = maxCurrent > 0 && r.curLoss === maxCurrent;
        return {
          name: r.player, sub: `Current ${r.curLoss}`,
          right: stats([[r.longest_loss, 'Longest', longestTie ? 'down' : null], [r.curLoss, 'Current', currentTie ? 'down' : null]]),
          highlight: (longestTie || currentTie) ? 'down' : null,
        };
      }));
    },

    potentialEarnings: s => {
      const earnings = s.potential_earnings.map(r => ({ player: r.player, net: r.winnings - r.losses })).sort((a, b) => b.net - a.net);
      const items = earnings.map(r => ({ name: r.player, right: pill(signedMoney(r.net), r.net >= 0), net: r.net }));
      highlightExtreme(items, it => it.net, 'min', 'down');
      return rankedCard('Potential Earnings', items);
    },
    flatBetProfit: s => {
      const items = s.flat_bet_profit.map(r => ({ name: r.player, sub: plural(r.bets, 'bet'), right: pill(signedMoney(r.profit), r.profit >= 0), profit: r.profit }));
      highlightExtreme(items, it => it.profit, 'min', 'down');
      return rankedCard('Flat Bet Profit', items);
    },

    biggestHit: s => {
      const items = s.biggest_hits.map(r => ({ name: r.player, sub: r.sport || '', right: stats([[fmtOdds(r.odds), 'Odds']]), detail: r.pick, odds: r.odds }));
      highlightExtreme(items, it => it.odds, 'max', 'up');
      return rankedCard('Biggest Hit', items);
    },
    safestLoss: s => {
      const items = s.safest_losses.map(r => ({ name: r.player, sub: r.sport || '', right: stats([[fmtOdds(r.odds), 'Odds']]), detail: r.pick, odds: r.odds }));
      highlightExtreme(items, it => it.odds, 'min', 'down');
      return rankedCard('Safest Loss', items);
    },

    weeklySackos: s => {
      const items = s.weekly_sackos.map(r => ({ name: r.player, sub: fmtMoney(r.cost), right: stats([[r.sackos, r.sackos === 1 ? 'Sacko' : 'Sackos']]), sackos: r.sackos }));
      highlightExtreme(items, it => it.sackos, 'max', 'down');
      highlightExtreme(items, it => it.sackos, 'min', 'up');
      return rankedCard('Weekly Sacko Count', items);
    },
    parlaysKilled: s => {
      const items = s.parlays_killed.map(r => ({
        name: r.player, sub: plural(r.kill_chances, 'chance'),
        right: stats([[r.kills.toFixed(1), 'Kills'], [r.avg_bet_position === null ? '—' : r.avg_bet_position.toFixed(1), 'Avg Pos']]),
        kills: r.kills,
      }));
      highlightExtreme(items, it => it.kills, 'max', 'down');
      highlightExtreme(items, it => it.kills, 'min', 'up');
      return rankedCard('Parlays Killed', items);
    },

    sportWL: s => rankedCard('Sport W/L', condensedWlItems(s.sport_wl, 'sport')),
    betTypeWL: s => rankedCard('Bet Type W/L', condensedWlItems(s.bet_type_wl, 'bet_type')),
    favoriteUnderdog: s => rankedCard('Favorite vs. Underdog', withTotal(s.odds_type_wl, 'odds_type'), { podium: false }),
    oddsRange: s => rankedCard('Odds Range', wlItems(s.odds_range_wl, 'range'), { podium: false }),
    overUnder: s => rankedCard('Over vs. Under', withTotal(s.over_under_wl, 'side'), { podium: false }),
    dayOfWeek: s => rankedCard('Day of Week', wlItems(s.day_of_week_wl, 'day'), { podium: false }),
    biggestMisses: s => rankedCard('Biggest Misses', s.biggest_misses.map(r => ({
      name: weekLabel(r), sub: `Killed by ${r.killed_by.join(' & ')}`,
      right: stats([[fmtMoney(r.payout), 'Payout']]),
    })), { podium: false }),
    closestCalls: s => rankedCard('Closest Calls', s.closest_calls.map(r => ({
      name: weekLabel(r), sub: `Missed by ${r.lost_by.join(', ')}`,
      right: stats([[`${r.legs_hit}/12`, 'Legs Hit']]),
    })), { podium: false }),
  };

  // ---------- Managers tab ----------
  // One manager's parlay franchise, worked out from the Worker's `weeks`
  // (every pick ever placed) so it agrees with the cards on the other tabs:
  // "Flat $100" is the same $100-a-leg sum as Flat Bet Profit, and a shared
  // kill is split the way Parlays Killed splits it.
  const MGR = { sub: 0, res: 'all', teams: null, teamsAsked: false };
  const MGR_SUBS = ['Overview', 'Splits', 'Legs'];
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const legWin = odds => (odds > 0 ? odds : 10000 / -odds);
  const impliedProb = odds => (odds > 0 ? 100 / (odds + 100) : -odds / (-odds + 100));
  const flatTxt = n => { const r = Math.round(n); return (r < 0 ? '−' : r > 0 ? '+' : '') + fmtMoney(Math.abs(r)); };
  const wlTone = (w, l) => (w > l ? 'up' : w < l ? 'down' : '');
  const hashColor = name => { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0; return `hsl(${h % 360}, 45%, 32%)`; };
  const pickRest = p => { const t = String(p.pick || ''), i = t.indexOf(':'); return i > 0 ? t.slice(i + 1).trim() : ''; };
  const ODDS_BUCKETS = ['Heavy Favorite', 'Favorite', 'Toss-Up', 'Underdog', 'Longshot'];
  // generate_parlay_data.py's odds_bucket and over_under_side.
  const oddsBucket = o => (o <= -250 ? 'Heavy Favorite' : o <= -150 ? 'Favorite' : o < 125 ? 'Toss-Up' : o < 200 ? 'Underdog' : 'Longshot');
  const overUnder = p => { const m = /\b(Over|Under)\b/i.exec(pickRest(p)); return m ? m[1][0].toUpperCase() + m[1].slice(1).toLowerCase() : null; };

  // Every leg one manager placed in the scope, oldest first: what $100 on it
  // won or lost (net) and the running total after it (run).
  function mgrLegs(weeks, name, scope) {
    let run = 0;
    const out = [];
    weeks.forEach(w => {
      if (scope !== 'all' && String(w.year) !== scope) return;
      const p = w.picks[name];
      if (!p) return;
      const graded = p.result === 'Win' || p.result === 'Loss';
      const net = graded && p.odds ? (p.result === 'Win' ? legWin(p.odds) : -100) : null;
      if (net !== null) run += net;
      const killers = w.killed_by || [];
      out.push({ ...p, year: w.year, week: w.week, graded, net, run: net === null ? null : run,
        kill: killers.includes(name) ? 1 / killers.length : 0, shared: killers.length > 1, sacko: w.sacko === name });
    });
    return out;
  }

  function mgrSummary(data, name, scope) {
    const legs = mgrLegs(data.weeks, name, scope);
    const g = legs.filter(x => x.graded);
    const w = g.filter(x => x.result === 'Win').length, l = g.length - w;
    let cur = 0, longW = 0, longL = 0;
    g.forEach(x => {
      if (x.result === 'Win') { cur = cur > 0 ? cur + 1 : 1; longW = Math.max(longW, cur); }
      else { cur = cur < 0 ? cur - 1 : -1; longL = Math.max(longL, -cur); }
    });
    const s = data.stats[scope] || {};
    const avg = (s.average_odds || []).find(r => r.player === name);
    const sk = (s.weekly_sackos || []).find(r => r.player === name);
    const byProb = (a, b) => impliedProb(a.odds) - impliedProb(b.odds);
    return {
      name, legs, w, l, pct: w + l ? w / (w + l) * 100 : null, cur, longW, longL,
      kills: Math.round(legs.reduce((a, x) => a + x.kill, 0) * 100) / 100,
      flat: g.reduce((a, x) => a + (x.net || 0), 0),
      avg: avg ? avg.avg_odds : null, sackos: sk ? sk.sackos : 0,
      best: g.filter(x => x.result === 'Win' && x.odds).sort(byProb)[0] || null,
      worst: g.filter(x => x.result === 'Loss' && x.odds).sort(byProb).pop() || null,
    };
  }

  // Franchise's "#N in X" pills: top 3 only, ties sharing a rank, gold for
  // the good end and red for the bad.
  function mgrRanks(all, s) {
    const out = [];
    const add = (get, higher, ok, label, bad) => {
      const v = get(s);
      if (!ok || v === null || v === undefined) return;
      const r = all.filter(o => { const x = get(o); return x !== null && x !== undefined && (higher ? x > v : x < v); }).length + 1;
      if (r <= 3) out.push({ label: `#${r} in ${label}`, bad });
    };
    add(o => o.pct, true, s.pct !== null, 'Win %', false);
    add(o => Math.round(o.flat), true, s.flat > 0, 'Flat Bet Profit', false);
    add(o => o.longW, true, s.longW > 0, 'Win Streak', false);
    add(o => o.pct, false, s.pct !== null, 'Lowest Win %', true);
    add(o => Math.round(o.flat), false, s.flat < 0, 'Flat Bet Losses', true);
    add(o => o.kills, true, s.kills > 0, 'Parlays Killed', true);
    add(o => o.longL, true, s.longL > 0, 'Losing Streak', true);
    return out.sort((a, b) => a.bad - b.bad);
  }

  // The shared .fhero, as on Franchise: team logo and name (the dropdown
  // above already names the manager), the rank pills, then the stat strip.
  function mgrHero(s, all) {
    const team = (MGR.teams || {})[s.name] || {};
    const years = [...new Set(s.legs.map(x => x.year))];
    const span = years.length > 1 ? `${years[0]}–${years[years.length - 1]}` : String(years[0] || '');
    const sub = [plural(s.legs.length, 'leg'), span].filter(Boolean).join(' · ');
    const ranks = mgrRanks(all, s).map(b => `<span class="rank-badge${b.bad ? ' bad' : ''}">${esc(b.label)}</span>`).join('');
    const logo = team.logo ? `<img src="${esc(team.logo)}" alt="" onerror="this.remove()">` : '';
    const side = [
      ['Record', `${s.w}-${s.l}`],
      ['Win %', fmtPct(s.pct)],
      ['Avg Odds', fmtOdds(s.avg)],
      ['Flat $100', flatTxt(s.flat)],
      ['Kills', s.kills.toFixed(1)],
      [s.sackos === 1 ? 'Sacko' : 'Sackos', s.sackos],
    ].map(([label, v]) => `<div class="fs"><div class="fs-v">${esc(v)}</div><div class="fs-l">${label}</div></div>`).join('');
    return `
      <div class="fhero">
        <div class="fhero-main">
          <div class="fhero-id">
            <span class="pm-avatar">${logo}<span class="pm-ph" style="background:${hashColor(s.name)}">${esc(monogram(s.name))}</span></span>
            <div style="min-width:0">
              <div class="fhero-name">${esc(team.team || s.name)}</div>
              <div class="fhero-sub">${esc(sub)}</div>
            </div>
          </div>
          ${ranks ? `<div class="hero-pills scroll">${ranks}</div>` : ''}
        </div>
        <div class="fhero-stats">${side}</div>
      </div>`;
  }

  function mgrOverview(s) {
    const graded = s.legs.filter(x => x.net !== null).length;
    const last = s.legs.slice(-8);
    const cur = s.cur > 0 ? `<b class="up">W${s.cur}</b>` : s.cur < 0 ? `<b class="down">L${-s.cur}</b>` : '<b>—</b>';
    const form = last.map(x => `<div><i class="${x.result}">${x.result === 'Win' ? 'W' : x.result === 'Loss' ? 'L' : '·'}</i><span>'${String(x.year).slice(2)} Wk ${x.week}</span></div>`).join('');
    const pickPod = (x, label) => x ? `
      <div class="item pm-pick ${x.result === 'Win' ? 'is-win' : 'is-loss'}">
        <span class="pm-cap">${label}</span>
        <div class="what"><b>${esc(betTypeOf(x))}</b> · ${esc(pickRest(x))}</div>
        <div class="odds">${esc(fmtOdds(x.odds))}</div>
        <div class="when">${x.year} · Week ${x.week}${x.sport ? ' · ' + esc(x.sport) : ''}</div>
      </div>` : '';
    const pair = pickPod(s.best, 'Longest odds hit') + pickPod(s.worst, 'Safest miss');
    return `
      <div class="card-grid">
        <div class="stat-card">
          <div class="stat-card-title split">$100 on every leg ${graded ? pill(flatTxt(s.flat), s.flat >= 0) : ''}</div>
          <div class="stat-card-body">${graded ? '<div class="pm-chart" id="pm-chart"></div>' : '<div class="empty-note">No legs graded yet.</div>'}</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-title">Last ${plural(last.length, 'leg')}</div>
          <div class="stat-card-body">
            <div class="pm-form">${form}</div>
            <div class="pm-pods">
              <div class="item pm-pod"><span class="pm-cap">Current</span>${cur}<small>in a row</small></div>
              <div class="item pm-pod"><span class="pm-cap">Best run</span><b>${s.longW}</b><small>straight wins</small></div>
              <div class="item pm-pod"><span class="pm-cap">Worst run</span><b>${s.longL}</b><small>straight losses</small></div>
            </div>
          </div>
        </div>
      </div>
      ${pair ? `<div class="stat-card"><div class="stat-card-title">Best and worst</div><div class="stat-card-body"><div class="pm-pair">${pair}</div></div></div>` : ''}`;
  }

  function mgrSplits(s) {
    const g = s.legs.filter(x => x.graded);
    const tally = (keyOf, order) => {
      const m = new Map();
      g.forEach(x => {
        const k = keyOf(x);
        if (!k) return;
        const t = m.get(k) || { k, w: 0, l: 0 };
        if (x.result === 'Win') t.w++; else t.l++;
        m.set(k, t);
      });
      return order ? order.map(k => m.get(k)).filter(Boolean) : [...m.values()].sort((a, b) => (b.w + b.l) - (a.w + a.l) || b.w - a.w);
    };
    const groups = [
      ['Sport', tally(x => x.sport)],
      ['Bet Type', tally(x => betTypeOf(x) || null)],
      ['Odds', tally(x => (x.odds ? oddsBucket(x.odds) : null), ODDS_BUCKETS)],
      ['Over / Under', tally(overUnder, ['Over', 'Under'])],
    ].filter(([, rows]) => rows.length);
    if (!groups.length) return '<div class="stat-card"><div class="empty-note">No legs graded yet.</div></div>';
    const tile = r => `<div class="item pm-tile"><div class="tl">${esc(r.k)}</div><b class="${wlTone(r.w, r.l)}">${r.w}-${r.l}</b><small>${fmtPct(r.w / (r.w + r.l) * 100)}</small></div>`;
    return `<div class="card-grid">${groups.map(([title, rows]) => `
      <div class="stat-card"><div class="stat-card-title">${title}</div><div class="stat-card-body"><div class="pm-tiles">${rows.map(tile).join('')}</div></div></div>`).join('')}</div>`;
  }

  // The leg card from Parlay Results, with the bet type where that page
  // puts the manager and the week where it puts the kickoff.
  function mgrLegRow(x) {
    const d = x.gametime ? new Date(x.gametime) : null;
    const status = x.result === 'Win' ? '<span class="badge turf">Win</span>'
      : x.result === 'Loss' ? '<span class="badge loss">Loss</span>' : '<span class="badge dim">Pending</span>';
    const tags = (x.kill ? `<span class="badge loss">${x.shared ? 'Shared kill' : 'Killed it'}</span>` : '')
      + (x.sacko ? '<span class="badge dim">Sacko week</span>' : '');
    const rest = pickRest(x);
    return `
      <div class="leg ${x.result}">
        <div class="leg-rail">${x.sport ? `<span class="sp">${esc(x.sport)}</span>` : ''}<span class="t">Wk ${x.week}</span>${d && !Number.isNaN(d.getTime()) ? `<span class="p">${MONTHS[d.getMonth()]} ${d.getDate()}</span>` : ''}</div>
        <div class="leg-body${tags ? ' tagged' : ''}">
          <span class="leg-name">${esc(betTypeOf(x) || x.pick)}</span>
          <span class="leg-odds">${esc(fmtOdds(x.odds))}</span>
          <div class="leg-bet">${esc(rest)}${x.matchup ? `${rest ? ' · ' : ''}${esc(x.matchup)}` : ''}</div>
          <span class="leg-score">${finalChipHtml(x)}</span>
          <span class="leg-status">${status}</span>
          ${tags ? `<div class="leg-tags">${tags}</div>` : ''}
        </div>
      </div>`;
  }

  function mgrLegList(s) {
    const n = r => s.legs.filter(x => x.result === r).length;
    const opts = [['all', 'All', s.legs.length], ['Win', 'Wins', n('Win')], ['Loss', 'Losses', n('Loss')]];
    const seg = `<div class="scope-row" id="pm-res">${opts.map(([k, label, c]) => `<button type="button" class="scope-btn${MGR.res === k ? ' on' : ''}" data-res="${k}">${label} ${c}</button>`).join('')}</div>`;
    const rows = s.legs.filter(x => MGR.res === 'all' || x.result === MGR.res).reverse();
    const years = [...new Set(rows.map(x => x.year))];
    const list = years.map(y => {
      const ys = s.legs.filter(x => x.year === y);
      const rec = `${ys.filter(x => x.result === 'Win').length}-${ys.filter(x => x.result === 'Loss').length}`;
      return `<div class="leg-day"><span>${y}</span><span class="r">${rec}</span></div>${rows.filter(x => x.year === y).map(mgrLegRow).join('')}`;
    }).join('');
    return `<div class="stat-card pm-legs"><div class="stat-card-body">${seg}<div class="legs-list">${list || '<div class="empty-note">No legs here.</div>'}</div></div></div>`;
  }

  function renderManager(data, scope, name) {
    const all = data.players.map(p => mgrSummary(data, p, scope));
    const s = all.find(x => x.name === name);
    const body = !s.legs.length ? '<div class="stat-card"><div class="empty-note">No legs this season.</div></div>'
      : [mgrOverview, mgrSplits, mgrLegList][MGR.sub](s);
    const tabs = MGR_SUBS.map((t, i) => `<button type="button" class="tab${i === MGR.sub ? ' on' : ''}" data-sub="${i}">${t}</button>`).join('');
    return { html: `${mgrHero(s, all)}<div class="tabs" id="mgr-tabs" data-glide-panel="mgr-body">${tabs}</div><div id="mgr-body">${body}</div>`, s };
  }

  // The running total, one point per graded leg, a season's first leg
  // marked with a line. Hover or touch for the leg under the finger.
  function drawMgrChart(s) {
    const el = document.getElementById('pm-chart');
    if (!el) return;
    const g = s.legs.filter(x => x.net !== null);
    const W = el.clientWidth || 360, H = 160, padL = 46, padR = 10, padT = 10, padB = 22;
    const vals = [0, ...g.map(x => x.run)];
    let lo = Math.min(...vals), hi = Math.max(...vals);
    const raw = (hi - lo || 100) / 4, mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map(f => f * mag).find(v => v >= raw);
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    const x = i => padL + (i + 1) / g.length * (W - padL - padR);
    const y = v => padT + (hi - v) / (hi - lo) * (H - padT - padB);
    let grid = '';
    for (let v = lo; v <= hi + step / 2; v += step) {
      grid += `<line class="${Math.abs(v) < step / 2 ? 'zero' : 'grid'}" x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}"/>`
        + `<text class="ax" x="${padL - 7}" y="${y(v) + 3.5}" text-anchor="end">${Math.abs(v) < step / 2 ? '$0' : flatTxt(v)}</text>`;
    }
    [...new Set(g.map(p => p.year))].forEach((yr, k) => {
      const first = g.findIndex(p => p.year === yr);
      const at = k === 0 ? padL : (x(first - 1) + x(first)) / 2;
      if (k) grid += `<line class="yr" x1="${at}" x2="${at}" y1="${padT}" y2="${H - padB}"/>`;
      grid += `<text class="ax" x="${at + (k ? 5 : 0)}" y="${H - 6}">${yr}</text>`;
    });
    const line = `M${padL},${y(0)}` + g.map((p, i) => `L${x(i).toFixed(1)},${y(p.run).toFixed(1)}`).join('');
    const area = `${line}L${x(g.length - 1).toFixed(1)},${y(0)}Z`;
    const end = g[g.length - 1];
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Running total of $100 on every leg: ${esc(flatTxt(end.run))}">
      <defs><clipPath id="pm-up"><rect x="0" y="0" width="${W}" height="${y(0)}"/></clipPath><clipPath id="pm-dn"><rect x="0" y="${y(0)}" width="${W}" height="${H}"/></clipPath></defs>
      ${grid}
      <path class="gain" d="${area}" clip-path="url(#pm-up)"/><path class="lose" d="${area}" clip-path="url(#pm-dn)"/>
      <path class="line" d="${line}"/>
      ${g.map((p, i) => `<circle class="dot ${p.result}" cx="${x(i)}" cy="${y(p.run)}" r="2.6"/>`).join('')}
      <circle class="end" cx="${x(g.length - 1)}" cy="${y(end.run)}" r="5"/>
      <line class="xh" x1="0" x2="0" y1="${padT}" y2="${H - padB}" visibility="hidden"/>
      <circle class="xd" r="5" visibility="hidden"/>
    </svg><div class="pm-tip" hidden></div>`;
    const svg = el.querySelector('svg'), tip = el.querySelector('.pm-tip');
    const xh = svg.querySelector('.xh'), xd = svg.querySelector('.xd');
    const show = ev => {
      const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * (W / r.width);
      const i = Math.max(0, Math.min(g.length - 1, Math.round((px - padL) / (W - padL - padR) * g.length - 1)));
      const p = g[i], cx = x(i), cy = y(p.run);
      xh.setAttribute('x1', cx); xh.setAttribute('x2', cx); xh.setAttribute('visibility', 'visible');
      xd.setAttribute('cx', cx); xd.setAttribute('cy', cy); xd.setAttribute('visibility', 'visible');
      tip.innerHTML = `<div class="t1">${p.year} · Week ${p.week}${p.sport ? ' · ' + esc(p.sport) : ''}</div>`
        + `<div class="t2">${esc(betTypeOf(p))} ${esc(fmtOdds(p.odds))}</div><div class="t3">${esc(pickRest(p))}</div>`
        + `<div class="t4"><span class="${p.net >= 0 ? 'up' : 'down'}">${p.result} ${flatTxt(p.net)}</span> · Total ${flatTxt(p.run)}</div>`;
      tip.hidden = false;
      const sx = r.width / W, sy = r.height / H;
      tip.style.left = Math.max(0, Math.min(r.width - tip.offsetWidth, cx * sx - tip.offsetWidth / 2)) + 'px';
      tip.style.top = (cy * sy < r.height / 2 ? cy * sy + 14 : cy * sy - tip.offsetHeight - 14) + 'px';
    };
    svg.addEventListener('pointermove', show);
    svg.addEventListener('pointerdown', show);
    const hide = () => { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); xd.setAttribute('visibility', 'hidden'); };
    // A finger lifting is a pointerleave too, so on a phone the leg stays
    // up until the next tap somewhere else.
    svg.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hide(); });
    el.hideTip = hide;
  }
  document.addEventListener('pointerdown', e => {
    const el = document.getElementById('pm-chart');
    if (el && el.hideTip && !el.contains(e.target)) el.hideTip();
  });

  // ---------- Category > subsection structure ----------
  const CATEGORIES = [
    {
      label: 'Legs',
      subsections: [
        { label: 'Per Parlay', cards: ['legsPerParlay'] },
        { label: 'Before First Loss', cards: ['legsBeforeLoss'] },
      ],
    },
    {
      label: 'Betting',
      subsections: [
        { label: 'Record', cards: ['individualWL', 'averageOdds'] },
        { label: 'Streaks', cards: ['winStreaks', 'lossStreaks'] },
        { label: 'Picks', cards: ['biggestHit', 'safestLoss'] },
        { label: 'Sacko & Kills', cards: ['weeklySackos', 'parlaysKilled'] },
      ],
    },
    {
      label: 'Breakdowns',
      subsections: [
        { label: 'Bet Type', cards: ['sportWL', 'betTypeWL'] },
        { label: 'Odds', cards: ['favoriteUnderdog', 'overUnder', 'dayOfWeek', 'oddsRange'] },
      ],
    },
    {
      label: 'Misc',
      subsections: [
        { label: 'Money', cards: ['potentialEarnings', 'flatBetProfit'] },
        { label: 'Notable Weeks', cards: ['biggestMisses', 'closestCalls'] },
      ],
    },
    // One manager at a time, with the manager dropdown under the tabs.
    { label: 'Managers', managers: true },
  ];

  // ---------- Wiring ----------
  // The tab names in the address (#betting) so a link or Back lands on the same group.
  const TAB_KEYS = ['legs', 'betting', 'breakdowns', 'misc', 'managers'];

  fetch(WORKER_URL + '/parlay-stats', { cache: 'no-store' })
    .then(res => res.json())
    .then(data => {
      const { stats } = data;
      data.weeks = [...(data.weeks || [])].sort((a, b) => a.year - b.year || a.week - b.week);
      // A link with a manager in it (?m=Brad) opens on that manager.
      const linkedTab = location.hash ? location.hash.slice(1) : (urlParam('m') ? 'managers' : '');
      let activeCategory = Math.max(0, TAB_KEYS.indexOf(linkedTab));
      let activeScope = 'all';

      const scopeSelect = document.getElementById('scope-select');
      const categoryTabRow = document.getElementById('category-tab-row');
      const statsContainer = document.getElementById('stats-container');
      const mgrRow = document.getElementById('mgr-row');
      const mgrSelect = document.getElementById('mgr-select');
      const names = [...data.players].sort((a, b) => a.localeCompare(b));
      mgrSelect.innerHTML = names.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
      // A link (?m=) first, then you, then the first name.
      mgrSelect.value = matchName(names, urlParam('m')) || matchName(names, getMe()) || names[0];

      // Team names and logos come from franchise.json, asked for the first
      // time the tab opens; until then (or if it fails) the hero shows the
      // manager's name and monogram.
      function loadTeams() {
        if (MGR.teamsAsked) return;
        MGR.teamsAsked = true;
        fetch('data/franchise.json', { cache: 'no-cache' }).then(r => r.json()).then(d => {
          MGR.teams = Object.fromEntries((d.players || []).map(p => [p.name, { team: p.current_team_name, logo: p.current_team_logo }]));
          if (CATEGORIES[activeCategory].managers) renderStats();
        }).catch(() => {});
      }

      const scopes = ['all', ...[...(data.years || [])].sort((a, b) => b - a).map(String)];
      scopeSelect.innerHTML = scopes.map(s => `<option value="${s}">${s === 'all' ? 'All-Time' : s}</option>`).join('');
      scopeSelect.value = activeScope;
      categoryTabRow.innerHTML = CATEGORIES.map((c, i) => `<button type="button" class="tab${i === activeCategory ? ' on' : ''}" data-i="${i}">${c.label}</button>`).join('');

      function renderStats() {
        const s = stats[activeScope];
        if (!s) return;
        const managers = !!CATEGORIES[activeCategory].managers;
        mgrRow.hidden = !managers;
        statsContainer.className = managers ? 'stats-cards mgr-view' : 'card-grid stats-cards';
        if (managers) {
          loadTeams();
          const view = renderManager(data, activeScope, mgrSelect.value);
          statsContainer.innerHTML = view.html;
          drawMgrChart(view.s);
          keepSelectedInView(document.getElementById('mgr-tabs'));
        } else {
          const keys = CATEGORIES[activeCategory].subsections.flatMap(sub => sub.cards);
          statsContainer.innerHTML = keys.map(key => CARD[key](s)).join('');
        }
        keepSelectedInView(categoryTabRow);
      }
      mgrSelect.addEventListener('change', () => {
        setUrlParams({ m: mgrSelect.value });
        renderStats();
      });
      // Overview / Splits / Legs, and the All / Wins / Losses filter.
      statsContainer.addEventListener('click', e => {
        const sub = e.target.closest('[data-sub]');
        const res = e.target.closest('[data-res]');
        if (sub) MGR.sub = Number(sub.dataset.sub);
        else if (res) MGR.res = res.dataset.res;
        else return;
        renderStats();
      });
      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (CATEGORIES[activeCategory].managers && MGR.sub === 0) drawMgrChart(mgrSummary(data, mgrSelect.value, activeScope));
        }, 150);
      });
      scopeSelect.addEventListener('change', () => {
        activeScope = scopeSelect.value;
        renderStats();
      });
      categoryTabRow.addEventListener('click', e => {
        const btn = e.target.closest('.tab');
        if (!btn) return;
        activeCategory = Number(btn.dataset.i);
        [...categoryTabRow.children].forEach((b, i) => b.classList.toggle('on', i === activeCategory));
        history.replaceState(null, '', '#' + TAB_KEYS[activeCategory]);
        setUrlParams({ m: CATEGORIES[activeCategory].managers ? mgrSelect.value : null });
        renderStats();
      });
      renderStats();

      setPageStatus(throughLabel(data.generated_at));
    })
    .catch(err => {
      console.error('Parlay stats error:', err);
      document.getElementById('stats-container').innerHTML = '<div class="loading-row" style="color:var(--loss);">Error loading parlay stats.</div>';
    });
</script>
<script src="track.js?v=2" defer></script>
</body>
</html>
