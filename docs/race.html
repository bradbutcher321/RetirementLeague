<body>
  <div id="site-nav"></div>
  <div class="wrap">
    <header>
      <div class="header-row">
        <div>
          <div class="eyebrow">Retirement League</div>
          <h1>Playoff Race</h1>
        </div>

          <div class="updated-label">Updated</div>
          <div class="updated-value" id="updated-at">—</div>
        </div>
      </div>

    <div id="view"><span class="sr-only">Loading…</span></div>
    <footer id="site-footer"></footer>
  </div>
<script src="nav.js?v=35"></script>
<script src="page-common.js?v=39"></script>
<script src="race-sim.js?v=2"></script>
<script>
  // Playoff Race (site audit III #2, IV #2). The simulation is the site's
  // one, in race-sim.js, so these odds match every other page. Pick this
  // week's winners and the rest of the season is replayed 6,000 times.
  const WORKER_URL = 'https://retirement-league-refresh-proxy.bradbutcher321.workers.dev';
  const $ = id => document.getElementById(id);
  const pct = n => n == null ? '—' : Math.round(n) + '%';
  const RUNS = RaceSim.RUNS;
  let INP, TEAMS, base, sched, PICK_WEEK, DONE, SPOTS, BYES, N, BASELINE;
  const picks = {};              // "a|b" -> winner, for PICK_WEEK only

  function setup(live) {
    INP = RaceSim.inputs(live);
    if (!INP) return false;
    ({ teams: TEAMS, base, sched, pickWeek: PICK_WEEK, done: DONE, spots: SPOTS, byes: BYES } = INP);
    N = TEAMS.length;
    return true;
  }
  const simulate = (n, force) => RaceSim.simulate(INP, n, picks, force);

  function render() {
    const n = Object.keys(picks).length;
    const res = n ? simulate(RUNS) : BASELINE;
    const order = TEAMS.slice().sort((a, b) => (res[b].po - res[a].po) || (res[a].sacko - res[b].sacko));
    const pk = sched[0];
    const swing = TEAMS.map(t => ({ t, d: (BASELINE[t].ifWin ?? 0) - (BASELINE[t].ifLoss ?? 0) })).filter(x => BASELINE[x.t].ifWin != null && BASELINE[x.t].ifLoss != null).sort((a, b) => b.d - a.d).slice(0, 3);
    const rec = t => `${base[t].w}-${base[t].l}`;
    // Your path (audit IV #12): the records your season ends on most often, and how often each one makes it.
    const meT = TEAMS.find(t => isMe(t));
    let pathCard = '';
    if (meT && res[meT].fw) {
      const total = INP.reg * 2, fw = res[meT].fw;
      const share = k => fw[k][0] / RUNS;
      const common = Object.keys(fw).map(Number).sort((a, b) => share(b) - share(a)).slice(0, 6).sort((a, b) => b - a);
      pathCard = `<div class="glass ft-sec"><div class="panel-title">Your path <span class="ft-chip">${rec(meT)} now</span></div>
        <div class="ft-note">Your playoff odds for each record you could finish with, and how often the season ends there.</div>
        <div class="ft-body"><div class="ft-tiles rc-path">${common.map(k => {
          const p = fw[k][1] * 100 / fw[k][0], tone = p >= 90 ? ' good' : p <= 10 ? ' bad' : '';
          return `<div class="ft-tile${tone}"><div class="ft-tl">${k}-${total - k}</div><div class="ft-tv">${pct(p)}</div><div class="ft-ts">${Math.max(1, Math.round(share(k) * 100))}% of seasons</div></div>`;
        }).join('')}</div></div></div>`;
    }
    $('view').innerHTML = `<div class="rc-intro">Pick this week’s winners, or leave a game open. Each change replays the rest of the season ${RUNS.toLocaleString('en-US')} times. Through Week ${DONE}.</div>
      <div class="rc-grid"><div>
        <div class="glass"><div class="panel-title">Week ${PICK_WEEK} <button type="button" class="ft-btn sm" data-reset${n ? '' : ' disabled'}>Reset</button></div>
          <div class="ft-body">${pk.pairs.map(([a, b]) => {
            const k = a + '|' + b, v = picks[k] || '';
            return `<div class="rc-pick">${[[a, a], ['', 'Open'], [b, b]].map(([val, l]) => `<button type="button" data-k="${esc(k)}" data-v="${esc(val)}" class="${val === v ? 'on' : ''}${val === '' ? ' mid' : ''}">${esc(l)}</button>`).join('')}</div>`;
          }).join('')}</div></div>
        ${swing.length ? `<div class="glass ft-sec"><div class="panel-title">Most riding on Week ${PICK_WEEK}</div>
          <div class="ft-note">Each team’s playoff odds with a win and with a loss.</div>
          <div class="ft-body">${swing.map(({ t, d }) => `<div class="ft-item rc-sw"><b>${esc(t)}</b>
            <div class="rc-sw-r"><span>Win <b class="turf">${pct(BASELINE[t].ifWin)}</b></span><span>Lose <b class="lossc">${pct(BASELINE[t].ifLoss)}</b></span><span>${Math.round(d)} pts</span></div></div>`).join('')}</div></div>` : ''}
        ${pathCard}
      </div><div>
        <div class="glass"><div class="panel-title">Odds <span class="ft-chip">${RUNS.toLocaleString('en-US')} seasons</span></div>
          <div class="ft-body"><div class="rc-head"><span></span><span>Playoffs</span><span>Bye</span><span>Sacko</span></div>
          <div class="rc-list">${order.map((t, i) => {
            const r = res[t], d = r.po - BASELINE[t].po;
            return `<a class="ft-item rc-tr${isMe(t) ? ' me' : ''}" href="${esc(pageLink('franchise.html', { m: t }))}">
              <div><b>${esc(t)}</b><span class="sub">${rec(t)}</span></div>
              <div class="rc-v"><span class="oddp ${r.po >= 50 ? 'good' : 'bad'}">${pct(r.po)}</span>${Math.abs(d) >= 0.5 && n ? `<em class="${d > 0 ? 'up' : 'dn'}">${d > 0 ? '+' : '−'}${Math.round(Math.abs(d))}</em>` : ''}</div>
              <div class="rc-v sm">${BYES ? pct(r.bye) : '—'}</div>
              <div class="rc-v sm${r.sacko >= 25 ? ' red' : ''}">${pct(r.sacko)}</div></a>${i === SPOTS - 1 ? PLAYOFF_LINE : ''}`;
          }).join('')}</div></div></div>
      </div></div>
      <div class="rc-foot">Each team scores like its average so far, pulled toward the league’s. Ties go to points scored, the league’s rule. The Sacko column is the chance of finishing ${N - 1}th or ${N}th, which since 2025 means playing in the Sacko game. These are the same odds the dashboard and Standings show.</div>`;
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-k]');
    if (b) { if (b.dataset.v) picks[b.dataset.k] = b.dataset.v; else delete picks[b.dataset.k]; render(); return; }
    if (e.target.closest('[data-reset]')) { Object.keys(picks).forEach(k => delete picks[k]); render(); }
  });
  window.addEventListener('rl-me', () => { if (BASELINE) render(); });

  fetch(WORKER_URL, { cache: 'no-store' }).then(r => r.json()).then(live => {
    // Audit V #17: the Updated stamp was never written.
    if (live.updatedAt) $('updated-at').textContent = formatUpdated(live.updatedAt);
    if (!setup(live) || !sched.length || !sched[0].pairs.length) {
      $('view').innerHTML = `<div class="glass"><div class="ft-empty">The regular season is over, so there’s nothing left to pick. See the Bracket tab on Standings.</div></div>`;
      return;
    }
    BASELINE = simulate(RUNS, true);
    render();
    riseIn(document.querySelectorAll('#view .glass'));
  }).catch(err => { $('view').innerHTML = `<div class="loading-row">Couldn’t load the league (${esc(err.message)}).</div>`; });
</script>
<script src="track.js?v=2" defer></script>
</body>
</html>
