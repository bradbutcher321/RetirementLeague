<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>html{background:#050505}</style>
<title>Retirement League — Franchise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The two font-family's woff2 files Google serves for the latin subset
     at the weights this site uses -- one variable-font file per family
     covers every weight declared, confirmed directly by fetching the
     stylesheet below and comparing each @font-face block's url(). Starts
     the actual font downloads immediately, in parallel with that
     stylesheet fetch, instead of waiting to discover these same URLs
     only after the stylesheet loads and is parsed -- avoids the
     fallback-to-webfont swap (FOUT) that otherwise shows on a slow or
     uncached load. If Google ever changes these hashed URLs, this just
     degrades to a wasted (unused) preload, not a correctness issue -- the
     stylesheet's own @font-face still fetches whatever the new URL is. -->
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/bigshouldersdisplay/v24/fC1_PZJEZG-e9gHhdI4-NBbfd2ys3SjJCx1czNDu.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=5">
<link rel="stylesheet" href="nav.css?v=4">
<style>
  /* Selector and stat-card styling live in theme.css -- only this page's own
     spacing and variants here. */
  .selector-row{ margin-bottom: 26px; }
  #tab-content > * + *{ margin-top: 14px; }

  /* ---------- Cards ---------- */
  /* A third column for the sections that have three cards, and the same
     stack-on-narrow fallback theme.css gives the two-column default. */
  .card-grid.three{ grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 720px){ .card-grid.three{ grid-template-columns: 1fr; } }
  /* Clipped, unlike the shared default, so a card's rounded corners cut its
     own content (the rivalry bars run edge to edge). */
  .stat-card{ overflow: hidden; }

  /* ---------- Hero ----------
     The column split is theme.css's shared content-sized rule now; this
     page used to override it and no longer needs to.

     theme.css clips .hero2-main so the blurred glow behind the headline
     can't bleed into the stats column. That also clipped the logo hover
     previews, which are absolutely positioned and deliberately overhang
     the tile. Moving the clip onto the glow itself keeps the bleed
     contained while letting the previews out.

     The glow's box is inset:-40%, so it measures 180% of the main area on
     each axis. Trimming 40/180 = 22.23% off every edge lands it exactly on
     the main area's bounds -- the same rectangle overflow:hidden gave us.
     clip-path applies after filter, so the blur is clipped too. */
  .hero2-main{ overflow: visible; }
  .hero2-main::before{ clip-path: inset(22.23%); }

  .hero-pills{ display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .aka{ background: var(--item); border: 1px solid var(--item-line); color: var(--text-dim); font-size: 0.74rem; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .rank-badge{ background: rgba(212,180,106,0.14); border: 1px solid var(--gold); color: var(--gold); font-size: 0.74rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .rank-badge.bad{ background: rgba(214,98,79,0.14); border-color: var(--loss); color: var(--loss); }

  /* ---------- Team logos -- current team gets one next to its headline
     name, past teams get the framed hover-tile list below (a polaroid grid
     was tried alongside it and dropped; the scratch page the two were
     prototyped on is long gone). logo_url comes straight from ESPN, which never validates or
     hosts it, so a good chunk of historical ones are genuinely dead
     links. Every <img> below has an onerror fallback to a colored
     initials avatar for that case, not just the ones that happen to
     still load. ---------- */
  .logo-ph{ display: none; align-items: center; justify-content: center; font-family: var(--scoreboard); font-weight: 800; color: #fff; }
  .current-logo-tile{ position: relative; display: inline-flex; }
  .current-logo-avatar{ position: relative; width: 56px; height: 56px; border-radius: 50%; overflow: hidden; flex-shrink: 0; border: 2px solid var(--gold); box-shadow: 0 0 14px rgba(212,180,106,0.35); }
  .current-logo-avatar img{ width: 100%; height: 100%; object-fit: cover; display: block; }
  .current-logo-preview{
    position: absolute; top: calc(100% + 8px); left: 0;
    width: 140px; height: 140px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line);
    box-shadow: 0 14px 30px rgba(0,0,0,0.55); opacity: 0; pointer-events: none; transition: opacity 0.15s; z-index: 6;
  }
  .current-logo-preview img{ width: 100%; height: 100%; object-fit: cover; display: block; }
  .current-logo-tile:hover .current-logo-preview, .current-logo-tile:focus .current-logo-preview{ opacity: 1; }
  .past-logos-label{ position: relative; color: var(--text-dim); font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.06em; margin: 18px 0 8px; }

  .aka-logo-tile{ position: relative; display: inline-flex; align-items: center; gap: 7px; background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px 4px 4px; cursor: default; }
  .aka-logo-avatar{ position: relative; width: 22px; height: 22px; border-radius: 50%; overflow: hidden; flex-shrink: 0; }
  .aka-logo-avatar img{ width: 100%; height: 100%; object-fit: cover; display: block; }
  .aka-logo-text{ font-size: 0.74rem; color: var(--text-dim); }
  .aka-logo-text .yr{ opacity: 0.6; }
  .aka-logo-preview{
    position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
    width: 120px; height: 120px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line);
    box-shadow: 0 14px 30px rgba(0,0,0,0.55); opacity: 0; pointer-events: none; transition: opacity 0.15s; z-index: 6;
  }
  .aka-logo-preview img{ width: 100%; height: 100%; object-fit: cover; display: block; }
  .aka-logo-tile:hover .aka-logo-preview, .aka-logo-tile:focus .aka-logo-preview{ opacity: 1; }

  /* ---------- Letting the previews out of the card ----------
     Absolutely-positioned previews are clipped by every ancestor that hides
     its overflow, and there are three: .hero2-main (the glow), .hero2 and
     .glass (the card's rounded corners). Un-hiding all of them would let the
     glow bleed and square off the card, so instead the previews switch to
     position: fixed, which no ancestor's overflow can clip, and CSS anchor
     positioning pins them back to their own tile. position-try-fallbacks
     flips a preview above its tile when there's no room below, which is what
     the past-team rows near the card's bottom edge need.

     Each element's position-anchor is set inline where it's rendered, since
     the names have to be unique per tile. Browsers without anchor support
     skip this block and keep the absolute version. */
  @supports (anchor-name: --x){
    .current-logo-tile{ anchor-name: --logo-current; }
    .current-logo-preview, .aka-logo-preview{
      position: fixed;
      inset: auto;
      transform: none;
      top: calc(anchor(bottom) + 8px);
      justify-self: anchor-center;
      position-try-fallbacks: flip-block;
      z-index: 50;
    }
  }

  /* ---------- Headline stat cards (.podium/.pod live in theme.css) ---------- */
  .pod.hl{ border-color: var(--lead-line); background: var(--lead-tint); }
  .pod.tone-win{ border-color: var(--win-line); background: var(--win-tint); }
  .pod.tone-loss{ border-color: var(--loss-line); background: var(--loss-tint); }
  :root[data-accent="outline"] .pod.hl,
  :root[data-accent="outline"] .pod.tone-win,
  :root[data-accent="outline"] .pod.tone-loss{ background: var(--item); }
  .pod-label{ color: var(--text-dim); font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
  .pod-val{ font-family: var(--scoreboard); font-weight: 800; font-size: 1.6rem; height: 2rem; line-height: 2rem; margin-top: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pod.hl .pod-val{ color: var(--gold); }
  .pod-val.win{ color: var(--turf); }
  .pod-val.loss{ color: var(--loss); }
  .pod-sub{ color: var(--text-dim); font-size: 0.7rem; min-height: 1em; margin-top: 2px; }

  /* ---------- Rows ---------- */
  .row{
    display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 12px;
    background: var(--item); border: 1px solid var(--item-line); border-radius: 10px; padding: 9px 12px; margin-top: 6px; min-height: 58px;
  }
  .row-name{ font-weight: 700; font-size: 0.92rem; }
  .row-sub{ color: var(--text-dim); font-size: 0.74rem; margin-top: 1px; }
  .row-stats{ display: flex; gap: 16px; }
  .row-stat{ text-align: center; min-width: 52px; }
  .row-stat b.win{ color: var(--turf); }
  .row-stat b.loss{ color: var(--loss); }

  /* ---------- Rivalry / luck ---------- */
  .feature{ text-align: center; padding: 16px 8px 8px; }
  .feature-sub{ color: var(--text-dim); font-size: 0.85rem; margin-top: 4px; }
  .luck-val{ font-family: var(--scoreboard); font-weight: 800; font-size: 2rem; }
  .luck-val.lucky{ color: var(--turf); }
  .luck-val.unlucky{ color: var(--loss); }

  /* ---------- Rivalries ---------- */
  /* The card surface itself comes from theme.css's shared rule. */
  .rivalry-card{ position: relative; padding: 22px 20px; text-align: center; }
  /* Nemesis/favorite IS a state, so it keeps an accent -- but as the shared
     outline treatment, not a top bar. */
  .rivalry-card.nemesis{ border-color: var(--loss-line); }
  .rivalry-card.favorite{ border-color: var(--win-line); }
  .rivalry-eyebrow{
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .rivalry-card.nemesis .rivalry-eyebrow{ color: var(--loss); }
  .rivalry-card.favorite .rivalry-eyebrow{ color: var(--turf); }
  .rivalry-opponent{
    font-family: var(--scoreboard);
    font-weight: 800;
    font-size: 1.6rem;
  }
  .rivalry-record{
    margin-top: 6px;
    color: var(--text-dim);
    font-size: 0.9rem;
  }
  /* Side-by-side layout for the "But Also" case. "But Also" itself is the
     divider (vertically centered via align-items, same trick the matchup
     cards use to center "VS") rather than a label sitting above just the
     second name — that pushed the two names out of alignment with each
     other. */
  .rivalry-split{
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 4px;
  }
  .rivalry-half{ flex: 1; min-width: 0; }
  .rivalry-split-label{
    flex-shrink: 0;
    color: var(--text-dim);
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    text-align: center;
    line-height: 1.3;
  }

  /* ---------- Season history ---------- */
  .hist-row{ display: grid; grid-template-columns: 56px minmax(0,1fr) auto; align-items: center; gap: 12px; background: var(--item); border: 1px solid var(--item-line); border-radius: 10px; padding: 10px 12px; margin-top: 6px; min-height: 58px; }
  .hist-row.champion{ border-color: var(--lead-line); background: var(--lead-tint); }
  :root[data-accent="outline"] .hist-row.champion{ background: var(--item); }
  .hist-year{ font-family: var(--scoreboard); font-weight: 700; font-size: 1.25rem; color: var(--text-dim); text-align: center; }
  .hist-team{ font-weight: 700; font-size: 0.95rem; }
  .badge{ font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; padding: 5px 10px; border-radius: 999px; white-space: nowrap; border: 1px solid var(--line); color: var(--text-dim); }
  .badge.champion{ background: rgba(212,180,106,0.14); color: var(--gold); border-color: var(--gold); }
  .badge.runner-up{ color: var(--gold); border-color: var(--gold); }
  .badge.playoffs{ background: rgba(76,154,107,0.12); color: var(--turf); border-color: var(--turf-dim); }
  .badge.progress{ border-style: dashed; }
  .badge.missed{ background: rgba(192,87,75,0.12); color: var(--loss); border-color: var(--loss); }

  /* ---------- Achievement shelf ---------- */
  .shelf{ display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .shelf:empty{ display: none; }
  .ach{ position: relative; background: var(--item); border: 1px solid var(--item-line); border-radius: 10px; min-height: 76px; overflow: hidden; }
  .ach.flippable{ cursor: pointer; perspective: 800px; }
  .ach-face-static, .ach-face{ padding: 14px 12px; display: flex; gap: 11px; align-items: flex-start; }
  .ach-face-static{ height: 100%; }
  .ach-flip-inner{ position: relative; width: 100%; height: 100%; min-height: 76px; transition: transform 0.5s; transform-style: preserve-3d; }
  .ach.flipped .ach-flip-inner{ transform: rotateY(180deg); }
  .ach-face{ position: absolute; inset: 0; backface-visibility: hidden; }
  .ach-back{ transform: rotateY(180deg); }
  .ach-icon{ flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .ach-icon svg{ width: 18px; height: 18px; }
  .ach.good .ach-icon{ background: rgba(212,180,106,0.14); color: var(--gold); }
  .ach.bad .ach-icon{ background: rgba(192,87,75,0.14); color: var(--loss); }
  .ach.locked .ach-icon{ background: rgba(255,255,255,0.03); color: var(--text-dim); }
  .ach-name{ font-weight: 700; font-size: 0.9rem; }
  .ach.locked .ach-name{ color: var(--text-dim); }
  .ach-sub{ color: var(--text-dim); font-size: 0.74rem; margin-top: 2px; line-height: 1.4; }
  .ach-divider{ color: var(--text-dim); font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin: 18px 0 12px; padding-top: 14px; border-top: 1px solid var(--line); }

  /* ---------- Season arc ---------- */
  .arc-scroll{ overflow-x: auto; padding-bottom: 6px; }
  .arc{ display: flex; gap: 8px; min-width: max-content; }
  .arc-tile{ width: 64px; flex-shrink: 0; background: var(--item); border: 1px solid var(--item-line); border-radius: 8px; text-align: center; padding: 10px 4px 8px; }
  .arc-tile.champion{ border-color: var(--gold); background: var(--lead-tint); }
  .arc-tile.runner-up{ border-color: var(--lead-line); background: var(--lead-tint); }
  .arc-tile.playoffs{ border-color: var(--win-line); background: var(--win-tint); }
  .arc-tile.missed{ border-color: var(--loss-line); background: var(--loss-tint); }
  .arc-tile.progress{ border-style: dashed; }
  :root[data-accent="outline"] .arc-tile.champion,
  :root[data-accent="outline"] .arc-tile.runner-up,
  :root[data-accent="outline"] .arc-tile.playoffs,
  :root[data-accent="outline"] .arc-tile.missed{ background: var(--item); }
  .arc-year{ color: var(--text-dim); font-size: 0.62rem; letter-spacing: 0.03em; }
  .arc-standing{ font-family: var(--scoreboard); font-weight: 800; font-size: 1.25rem; margin: 3px 0 1px; }
  .arc-tile.champion .arc-standing, .arc-tile.runner-up .arc-standing{ color: var(--gold); }
  .arc-tile.playoffs .arc-standing{ color: var(--turf); }
  .arc-tile.missed .arc-standing{ color: var(--loss); }
  .arc-tile.progress .arc-standing{ color: var(--text-dim); }
  .arc-rec{ color: var(--text-dim); font-size: 0.62rem; font-variant-numeric: tabular-nums; }
  .arc-legend{ display: flex; flex-wrap: wrap; gap: 16px; margin-top: 16px; }
  .arc-legend-item{ display: flex; align-items: center; gap: 7px; color: var(--text-dim); font-size: 0.76rem; }
  .arc-swatch{ width: 11px; height: 11px; border-radius: 2px; flex-shrink: 0; }

  /* ---------- Rival grid ---------- */
  .grid-scroll{ overflow-x: auto; }
  table.rivals{ border-collapse: collapse; width: 100%; min-width: 460px; font-size: 0.86rem; }
  table.rivals th{ text-align: left; color: var(--text-dim); font-weight: 600; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.03em; padding: 0 10px 10px; }
  table.rivals td{ padding: 9px 10px; border-top: 1px solid var(--line); }
  table.rivals tr:hover td{ background: rgba(255,255,255,0.02); }
  .rv-name{ font-weight: 700; }
  .rv-name .tag{ color: var(--text-dim); font-weight: 500; font-size: 0.72rem; margin-left: 6px; }
  .rv-bar-wrap{ display: flex; align-items: center; gap: 10px; }
  .rv-bar{ flex: 1; height: 7px; border-radius: 999px; background: var(--line); overflow: hidden; min-width: 70px; }
  .rv-bar-fill{ height: 100%; border-radius: 999px; }
  .rv-pct{ font-family: var(--scoreboard); font-weight: 700; font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
</style>
</head>
<body>
  <div id="site-nav"></div>
  <div class="wrap">
    <header>
      <div class="header-row">
        <div>
          <div class="eyebrow">Retirement League</div>
          <h1>Franchise</h1>
        </div>
        <div class="updated-block">
          <div class="updated-label">Updated</div>
          <div class="updated-value" id="updated-at">—</div>
        </div>
      </div>
    </header>

    <div class="selector-row">
      <!-- "Franchise", not "Franchise Selection:" -- every other page labels
           its dropdown with a single word and no colon (Season, Year, Week),
           and this page is already titled Franchise. -->

    <section><div id="hero-container"><div class="loading-row">Loading franchise…</div></div></section>

      <div class="tabs" id="tabs"></div>

<script src="nav.js?v=2"></script>
<script src="page-common.js?v=2"></script>
<script src="achievements.js"></script>
<script>
  const { seasonState, bestChampionshipStreak, everHitPlayoffRate, EFFICIENCY_EXPERT_PCT, ACHIEVEMENTS } = ACHIEVEMENTS_LIB;
  const fmt = (n, d = 0) => (n === null || n === undefined || Number.isNaN(n)) ? '—' : Number(n).toFixed(d);
  const fmtPct = n => (n === null || n === undefined) ? '—' : `${Number(n).toFixed(1)}%`;
  const fmtMoney = n => (n === null || n === undefined) ? '—' : `${n < 0 ? '-' : ''}$${Math.abs(Number(n)).toLocaleString()}`;
  const fmtOrdinal = n => {
    if (n === null || n === undefined) return '—';
    const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  };

  // pods: [label, value, { cls, hl, sub }]
  const pods = list => `<div class="podium">${list.map(([label, value, o = {}]) => `
    <div class="pod${o.tone ? ' tone-' + o.tone : o.hl ? ' hl' : ''}">
      <div class="pod-label">${label}</div>
      <div class="pod-val${o.tone || o.cls ? ' ' + (o.tone || o.cls) : ''}${String(value).length > 6 ? ' long' : ''}">${value}</div>
      <div class="pod-sub">${o.sub || '&nbsp;'}</div>
    </div>`).join('')}</div>`;

  // rows: [name, [[value, label, cls?], ...]]
  const rows = list => list.map(([name, stats, sub]) => `
    <div class="row">
      <div><div class="row-name">${name}</div>${sub ? `<div class="row-sub">${sub}</div>` : ''}</div>
      <div class="row-stats">${stats.map(([v, l, c]) => `<div class="row-stat"><b${c ? ` class="${c}"` : ''}>${v}</b><span>${l}</span></div>`).join('')}</div>
    </div>`).join('');

  const rateTone = v => v === null || v === undefined ? { hl: true } : { tone: v >= 50 ? 'win' : 'loss' };
  const signTone = v => v > 0 ? { tone: 'win' } : v < 0 ? { tone: 'loss' } : { hl: true };
  const card = (title, body, cls, note) => `<div class="stat-card${cls ? ' ' + cls : ''}">${title ? `<div class="stat-card-title">${title}</div>` : ''}${note ? `<div class="stat-card-note">${note}</div>` : ''}<div class="stat-card-body">${body}</div></div>`;

  function clutchDelta(x) {
    const r = x.career.record, wr = x.career.win_rates;
    if ((r.playoff_w || 0) + (r.playoff_l || 0) === 0 || wr.reg_pct == null || wr.playoff_pct == null) return null;
    return wr.playoff_pct - wr.reg_pct;
  }

  function leagueCurrentYear(all) {
    let max = -Infinity;
    all.forEach(x => x.season_history.forEach(s => { if (s.year > max) max = s.year; }));
    return max;
  }

  function isActivePlayer(p, currentYear) {
    return p.season_history.length > 0 && p.season_history[p.season_history.length - 1].year === currentYear;
  }

  // Shared by the rank badges and the scouting-report radar -- "how does
  // this one number compare to the same field across a pool of players."
  function computeRank(mine, pool, getter, higherBetter = true) {
    if (mine === null || mine === undefined) return null;
    const better = pool.filter(x => {
      const v = getter(x);
      return v !== null && v !== undefined && (higherBetter ? v > mine : v < mine);
    }).length;
    return better + 1;
  }

  function leagueRankBadges(p, all) {
    // Retired managers neither compete for these badges nor count toward
    // anyone else's ranking -- otherwise someone who left the league years
    // ago could permanently "hold" a bad-stat badge nobody currently
    // playing can ever take from them.
    const currentYear = leagueCurrentYear(all);
    if (!isActivePlayer(p, currentYear)) return [];
    const pool = all.filter(x => isActivePlayer(x, currentYear));

    const rank = (getter, higherBetter = true) => computeRank(getter(p), pool, getter, higherBetter);
    const badges = [];
    const add = (r, ok, label, bad) => { if (r && r <= 3 && ok) badges.push({ label: `#${r} in ${label}`, bad }); };

    // Good (gold)
    add(rank(x => x.career.standings.championships), p.career.standings.championships > 0, 'Championships', false);
    add(rank(x => x.efficiency && x.efficiency.career_pct), !!(p.efficiency && p.efficiency.career_pct != null), 'Career Efficiency', false);
    add(rank(x => x.career.points.avg_pf), true, 'Average Points', false);
    add(rank(x => x.money && x.money.net_result), !!(p.money && p.money.net_result > 0), 'Net Money Won', false);
    add(rank(x => clutchDelta(x)), clutchDelta(p) > 0, 'Clutch Factor', false);
    add(rank(x => x.all_play && x.all_play.pct), !!(p.all_play && p.all_play.pct != null), 'Power Ranking', false);

    // Bad (red) -- same stats, ranked from the other end, plus a few that are only ever bad
    add(rank(x => x.money && x.money.net_result, false), !!(p.money && p.money.net_result < 0), 'Net Money Lost', true);
    add(rank(x => clutchDelta(x), false), clutchDelta(p) < 0, 'Choke Factor', true);
    add(rank(x => x.efficiency && x.efficiency.career_pct, false), !!(p.efficiency && p.efficiency.career_pct != null), 'Worst Efficiency', true);
    add(rank(x => x.career.standings.sackos), p.career.standings.sackos > 0, 'Most Sackos', true);
    add(rank(x => x.weekly_sackos), p.weekly_sackos > 0, 'Most Weekly Sackos', true);
    add(rank(x => x.efficiency && x.efficiency.avg_points_left), !!(p.efficiency && p.efficiency.avg_points_left != null), 'Points Left on Bench', true);
    add(rank(x => x.career.win_rates.reg_pct, false), p.career.win_rates.reg_pct != null, 'Lowest Win %', true);

    return badges;
  }

  // ---------- Achievements ----------
  // Fixed list, same for every manager, unlike the rank badges above --
  // these are absolute personal milestones (permanent once earned) rather
  // than "top-3 in the league right now" (which can be lost to someone
  // else's better season). Locked ones render greyed out on purpose: the
  // point is seeing what you haven't done yet.
  const ICONS = {
    trophy: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4h10v3a5 5 0 0 1-10 0V4z"/><rect x="10.4" y="12" width="3.2" height="4"/><rect x="7.5" y="17" width="9" height="2" rx="0.6"/><path d="M7 5H3.2v2a4 4 0 0 0 3.8 4" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M17 5h3.8v2a4 4 0 0 1-3.8 4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>',
    shield: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8 19 5.6v5.1c0 5.2-3.5 8.5-7 9.5-3.5-1-7-4.3-7-9.5V5.6l7-2.8z"/></svg>',
    flame: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3c2.2 3.6-2.6 4.6-2.6 8.3a2.7 2.7 0 0 0 5.4 0c0-.9-.4-1.6-.8-2 .2 1.4-.7 2.3-1.6 2.3-1.1 0-1.8-.9-1.5-2.1C9.7 10.4 9 12 9 13.6a3.6 3.6 0 0 0 7.2 0c0-4.3-2.7-6.3-4.2-10.6z"/></svg>',
    snow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><line x1="12" y1="3" x2="12" y2="21"/><line x1="5.5" y1="7" x2="18.5" y2="17"/><line x1="18.5" y1="7" x2="5.5" y2="17"/></svg>',
    target: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg>',
    dollar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3v18M16.5 7.5c0-1.9-2-3-4.5-3s-4.5 1.1-4.5 3 2 2.6 4.5 3 4.5 1.1 4.5 3-2 3-4.5 3-4.5-1.1-4.5-3"/></svg>',
  };

  function achCard(a, unlocked, ctx, p) {
    const cls = !unlocked ? 'locked' : (a.bad ? 'bad' : 'good');
    const icon = `<div class="ach-icon">${ICONS[a.icon]}</div>`;
    const name = `<div class="ach-name">${esc(a.name)}</div>`;
    if (!unlocked) {
      return `<div class="ach ${cls}"><div class="ach-face-static">${icon}<div>${name}<div class="ach-sub">${esc(a.desc)}</div></div></div></div>`;
    }
    return `<div class="ach ${cls} flippable" title="Click to see how you earned this">
      <div class="ach-flip-inner">
        <div class="ach-face ach-front">${icon}<div>${name}<div class="ach-sub">${esc(a.desc)}</div></div></div>
        <div class="ach-face ach-back">${icon}<div>${name}<div class="ach-sub">${esc(a.sub(p, ctx))}</div></div></div>
      </div>
    </div>`;
  }

  function renderAchievements(p, ctx) {
    const unlocked = [], locked = [];
    ACHIEVEMENTS.forEach(a => (a.test(p, ctx) ? unlocked : locked).push(a));
    const divider = locked.length ? `<div class="ach-divider">Locked — ${locked.length}</div>` : '';
    const body = `<div class="shelf">${unlocked.map(a => achCard(a, true, ctx, p)).join('')}</div>`
      + divider
      + `<div class="shelf">${locked.map(a => achCard(a, false, ctx, p)).join('')}</div>`;
    return card(`Achievements <span style="color:var(--text-dim);font-weight:600;font-size:0.8rem">${unlocked.length} / ${ACHIEVEMENTS.length} unlocked</span>`, body);
  }

  // ---------- Season arc ----------
  function renderSeasonArc(p) {
    const tiles = p.season_history.map(s => {
      const state = seasonState(s);
      const standing = state === 'progress' ? '—' : fmtOrdinal(s.final_standing);
      return `<div class="arc-tile ${state}"><div class="arc-year">${s.year}</div><div class="arc-standing">${standing}</div><div class="arc-rec">${esc(s.reg_record)}</div></div>`;
    }).join('');
    const legend = [
      ['var(--gold)', 'solid', 'Champion'], ['var(--gold)', 'outline', 'Runner-up'], ['var(--turf)', 'solid', 'Playoffs'],
      ['var(--loss)', 'solid', 'Missed playoffs'], ['var(--text-dim)', 'dashed', 'In progress'],
    ].map(([color, style, label]) => {
      const swatch = style === 'solid' ? `background:${color}` : style === 'outline' ? `background:transparent;border:2px solid ${color}` : `background:transparent;border:2px dashed ${color}`;
      return `<div class="arc-legend-item"><span class="arc-swatch" style="${swatch}"></span>${label}</div>`;
    }).join('');
    return card('Season Arc', `<div class="arc-scroll"><div class="arc">${tiles}</div></div><div class="arc-legend">${legend}</div>`);
  }

  // ---------- Rival grid ----------
  function renderRivalGrid(p) {
    const all = (p.rivalries && p.rivalries.all) || [];
    if (all.length < 3) {
      return card('Head-to-Head Records', '<div class="empty-note">Not enough opponents with 3+ meetings yet.</div>');
    }
    const rowsHtml = all.map(r => {
      const tone = r.win_pct >= 50 ? 'var(--turf)' : 'var(--loss)';
      const tag = p.rivalries.nemesis && p.rivalries.nemesis.opponent === r.opponent ? '<span class="tag">nemesis</span>'
        : (p.rivalries.favorite_opponent && p.rivalries.favorite_opponent.opponent === r.opponent ? '<span class="tag">favorite</span>' : '');
      return `<tr><td class="rv-name">${esc(r.opponent)} ${tag}</td><td>${r.wins}-${r.losses}</td>
        <td><div class="rv-bar-wrap"><div class="rv-bar"><div class="rv-bar-fill" style="width:${r.win_pct}%;background:${tone}"></div></div>
        <span class="rv-pct" style="color:${tone}">${fmtPct(r.win_pct)}</span></div></td></tr>`;
    }).join('');
    return card('Head-to-Head Records', `<div class="grid-scroll"><table class="rivals">
      <tr><th>Opponent</th><th>Record</th><th style="width:200px">Win rate</th></tr>${rowsHtml}</table></div>`);
  }

  // Deterministic "no photo" fallback -- a colored initials avatar, since
  // logo_url is whatever a manager pasted into ESPN years ago with no
  // validation or hosting of its own, and a real chunk of historical ones
  // are dead links today (confirmed directly for several real examples).
  const initials = name => name.replace(/[^A-Za-z ]/g, '').trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase() || '?';
  const hashColor = name => { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0; return `hsl(${h % 360}, 45%, 32%)`; };
  const logoPh = (name, size) => `<span class="logo-ph" style="position:absolute;inset:0;font-size:${size};background:${hashColor(name)}">${esc(initials(name))}</span>`;
  function onImgError(img) {
    img.style.display = 'none';
    const ph = img.nextElementSibling;
    if (ph) ph.style.display = 'flex';
  }

  // Framed tile per past team, hover (or focus) for a bigger preview --
  // the shape picked over a polaroid grid when the two were compared on
  // the real page rather than in isolation.
  function pastLogosHtml(p) {
    const names = p.previous_team_names || [];
    if (!names.length) return '';
    const logos = p.previous_team_logos || {};
    // Each tile gets its own anchor name so its preview can be positioned
    // against it from outside the card (see the anchor-positioning block in
    // the stylesheet). Anchor names have to be unique -- share one across
    // the list and every preview would latch onto the last tile.
    const tiles = names.map((n, i) => {
      const meta = logos[n] || {};
      const url = esc(meta.logo_url || '');
      return `
        <span class="aka-logo-tile" tabindex="0" style="anchor-name:--logo-past-${i}">
          <span class="aka-logo-avatar"><img src="${url}" onerror="onImgError(this)">${logoPh(n, '0.58rem')}</span>
          <span class="aka-logo-text">${esc(n)} <span class="yr">· ${meta.year || ''}</span></span>
          <span class="aka-logo-preview" style="position-anchor:--logo-past-${i}"><img src="${url}" onerror="onImgError(this)">${logoPh(n, '2rem')}</span>
        </span>`;
    }).join('');
    return `
      <div class="past-logos-label">Past Teams</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">${tiles}</div>`;
  }

  function renderHero(p) {
    const rec = p.career.record;
    const w = (rec.reg_w || 0) + (rec.playoff_w || 0), l = (rec.reg_l || 0) + (rec.playoff_l || 0);
    const pct = w + l ? w / (w + l) * 100 : null;
    const ranks = leagueRankBadges(p, data.players).map(b => `<span class="rank-badge${b.bad ? ' bad' : ''}">${esc(b.label)}</span>`).join('');
    const tenure = p.founded_year ? `Founded ${p.founded_year} · ${p.seasons} season${p.seasons === 1 ? '' : 's'}` : '';
    const currentName = p.current_team_name || p.name;
    const currentLogoUrl = esc(p.current_team_logo || '');
    // Career stats sit in the hero's right-hand well above 700px (same
    // .hero2 split Overview and Parlay already use) instead of a full-width
    // strip under the name, which left the right half of a desktop screen
    // empty and made the card ~70px taller than it needed to be.
    // All gold, no per-stat tones: these are this franchise's headline
    // career figures, and colouring some of them good/bad made the column
    // read as a scorecard rather than a summary.
    const side = [
      ['Record', `${w}-${l}`],
      ['Win %', fmtPct(pct)],
      ['Ships', fmt(p.career.standings.championships)],
      ['Playoff Apps.', fmt(p.career.standings.playoff_appearances)],
      ['Weekly Sackos', fmt(p.weekly_sackos)],
    ].map(([l2, v]) =>
      `<div class="hs"><div class="hs-l">${l2}</div><div class="hs-r"><div class="hs-v">${v}</div></div></div>`
    ).join('');
    return `
      <div class="glass hero2">
        <div class="hero2-main glow" style="padding:30px 32px 26px">
          <div class="hero2-eyebrow">Franchise</div>
          <div style="display:flex; align-items:center; gap:16px;">
            <div class="hero2-v" style="font-size:clamp(2rem,5vw,2.8rem); margin:9px 0 6px;">${esc(currentName)}</div>
            <span class="current-logo-tile" tabindex="0">
              <span class="current-logo-avatar">
                <img src="${currentLogoUrl}" onerror="onImgError(this)">${logoPh(currentName, '1.3rem')}
              </span>
              <span class="current-logo-preview" style="position-anchor:--logo-current"><img src="${currentLogoUrl}" onerror="onImgError(this)">${logoPh(currentName, '2.5rem')}</span>
            </span>
          </div>
          <div class="hero2-sub">${esc(p.name)} · ${tenure}</div>
          ${ranks ? `<div class="hero-pills" style="position:relative">${ranks}</div>` : ''}
          ${pastLogosHtml(p)}
        </div>
        <div class="hero2-side">${side}</div>
      </div>`;
  }

  function renderStreaks(p) {
    return [['Versus Opponent', p.streaks.head_to_head], ['Versus Median', p.streaks.median], ['Versus Both', p.streaks.combined]].map(([title, s]) => {
      const cur = s.current === 0 ? '—' : `${s.current > 0 ? 'W' : 'L'}${Math.abs(s.current)}`;
      const cls = s.current > 0 ? 'win' : s.current < 0 ? 'loss' : '';
      return card(title, pods([['Current', cur, s.current === 0 ? { hl: true } : { tone: s.current > 0 ? 'win' : 'loss' }], ['Longest W', fmt(s.longest_win)], ['Longest L', fmt(s.longest_loss)]]));
    }).join('');
  }

  function renderPerformance(p) {
    const r = p.career.record, s = p.career.standings, wr = p.career.win_rates;
    const regRows = [['Finish', [[fmt(s.best_regular_finish), 'Best'], [fmt(s.worst_regular_finish), 'Worst']]], ['Sackos', [[fmt(s.sackos), 'Total']]]];
    // Both ranks below are only meaningful against the active-manager pool,
    // and only for a player who's themselves active -- a retired manager
    // isn't IN that pool, so ranking them against it produces nonsense
    // like "13th of 12".
    const currentYear = leagueCurrentYear(data.players);
    const isActive = isActivePlayer(p, currentYear);
    const activePool = data.players.filter(x => isActivePlayer(x, currentYear));
    const ap = p.all_play;
    if (ap && ap.pct != null) {
      // "If you'd played every team, every week, instead of just your
      // actual schedule" -- a Reg-season-only all-play record, so it
      // lives in this card rather than a separate one.
      const powerRank = isActive ? computeRank(ap.pct, activePool, x => x.all_play && x.all_play.pct, true) : null;
      const stat = [`${fmt(ap.pct, 1)}%`, `${ap.w}-${ap.l}${ap.t ? '-' + ap.t : ''} all-play`, rateTone(ap.pct).tone];
      regRows.push(['Power Ranking', powerRank ? [stat, [fmtOrdinal(powerRank), `of ${activePool.length}`]] : [stat]]);
    }
    const reg = card('Regular Season',
      pods([['Win Rate', fmtPct(wr.reg_pct), rateTone(wr.reg_pct)], ['Record', `${fmt(r.reg_w)}-${fmt(r.reg_l)}${r.reg_t ? '-' + r.reg_t : ''}`], ['Reg Szn Champ', fmt(s.reg_season_champs)]]) +
      rows(regRows));

    const extraRows = [];
    const delta = clutchDelta(p);
    if (delta !== null) {
      const stat = [`${delta > 0 ? '+' : ''}${fmt(delta, 1)}%`, 'Playoff vs Reg %', delta > 0 ? 'win' : delta < 0 ? 'loss' : ''];
      // Ranked against active managers only, same pool leagueRankBadges
      // uses -- so this number and a "#1 in Clutch Factor" hero badge
      // (if this manager has one) always agree with each other.
      const clutchRank = isActive ? computeRank(delta, activePool, x => clutchDelta(x), true) : null;
      const stats = clutchRank ? [stat, [fmtOrdinal(clutchRank), `of ${activePool.length}`]] : [stat];
      extraRows.push(['Clutch Factor', stats]);
    }
    if (s.champ_appearances > 0) {
      extraRows.push(['Title Games', [[`${fmt(s.championships)}-${fmt(s.champ_appearances - s.championships)}`, 'Record']]]);
    }
    if ((r.consolation_w || 0) + (r.consolation_l || 0) > 0) {
      extraRows.push(['Consolation', [[`${fmt(r.consolation_w)}-${fmt(r.consolation_l)}`, 'Record']]]);
    }
    const po = card('Playoffs',
      pods([['Win Rate', fmtPct(wr.playoff_pct), rateTone(wr.playoff_pct)], ['Record', `${fmt(r.playoff_w)}-${fmt(r.playoff_l)}`], ['Ships', fmt(s.championships)]]) +
      rows([['Appearances', [[fmt(s.playoff_appearances), 'Playoffs'], [fmt(s.champ_appearances), 'Finals']]], ['Byes', [[fmt(s.byes), 'Total']]], ...extraRows]));
    return reg + po;
  }

  // Scoring is now strictly about points put up: how many, and how they
  // were distributed. Margin-shaped stats (what the points added up to)
  // split into their own card, Median moved to Performance next to the
  // Versus Median streak it explains, and Money got its own tab -- dues
  // and earnings were never a scoring stat.
  function renderScoring(p) {
    const pts = p.career.points, ex = p.extremes;
    const scoring = card('Scoring', rows([
      ['Total Points', [[fmt(pts.total_pf, 2), 'For'], [fmt(pts.total_pa, 2), 'Against']]],
      ['Average', [[fmt(pts.avg_pf, 2), 'For'], [fmt(pts.avg_pa, 2), 'Against']]],
      ['Single Game', [[fmt(ex.highest_score, 2), 'High'], [fmt(ex.lowest_score, 2), 'Low']]],
      ['Consistency', [[fmt(ex.score_stdev, 2), 'Std Dev']], 'Lower means steadier week-to-week scoring'],
    ]));
    const margins = card('Margins', rows([
      ['Win Margin', [[fmt(ex.biggest_win_margin, 2), 'Largest'], [fmt(ex.lowest_win_margin, 2), 'Smallest']]],
      ['Loss Margin', [[fmt(ex.biggest_loss_margin, 2), 'Largest'], [fmt(ex.lowest_loss_margin, 2), 'Smallest']]],
      ['Close Games', [[fmt(ex.close_wins), 'Wins'], [fmt(ex.close_losses), 'Losses']], 'Decided by under 5 points'],
      ['Blowouts', [[fmt(ex.blowout_wins), 'Wins'], [fmt(ex.blowout_losses), 'Losses']], 'Decided by 50+ points'],
    ]), null, 'How those points landed against the week’s opponent');
    return scoring + margins;
  }

  function renderMedian(p) {
    const med = p.career.median || {};
    // Titled "Median Record" rather than "Versus Median" so it doesn't
    // collide with the Versus Median streak card sitting above it.
    return card('Median Record', pods([['Win Rate', fmtPct(med.pct), rateTone(med.pct)], ['Wins', fmt(med.wins)], ['Losses', fmt(med.losses)]]),
      null, 'The second win or loss each week, scored against the league median');
  }

  function renderMoney(p) {
    if (!p.money) return card('Money', '<div class="empty-note">Not tracked for this franchise.</div>');
    return card('Money', pods([['Net Result', fmtMoney(p.money.net_result), signTone(p.money.net_result)], ['Dues', fmtMoney(p.money.total_dues)], ['Earnings', fmtMoney(p.money.total_earnings)]]) +
      rows([['Parlays Purchased', [[fmtMoney(p.money.parlays_purchased), 'Total']]]]));
  }

  const RIVALRY_LABELS = { nemesis: "Who's Your Daddy", favorite: "Who's Your Bitch" };

  function rivalryCard(kind, data) {
    const label = RIVALRY_LABELS[kind];
    if (!data) {
      return `<div class="rivalry-card ${kind}"><div class="rivalry-eyebrow">${label}</div><div class="empty-note">Not enough head-to-head history yet.</div></div>`;
    }
    // "also" only shows up when the top pick has left the league — surface
    // the best-qualifying opponent who's still active this season too,
    // side by side, since needling someone who's gone isn't much of a
    // rivalry.
    if (!data.also) {
      return `
        <div class="rivalry-card ${kind}">
          <div class="rivalry-eyebrow">${label}</div>
          <div class="rivalry-opponent">${data.opponent}</div>
          <div class="rivalry-record">${data.wins}-${data.losses} · ${fmtPct(data.win_pct)}</div>
        </div>`;
    }
    return `
      <div class="rivalry-card ${kind}">
        <div class="rivalry-eyebrow">${label}</div>
        <div class="rivalry-split">
          <div class="rivalry-half">
            <div class="rivalry-opponent">${data.opponent}</div>
            <div class="rivalry-record">${data.wins}-${data.losses} · ${fmtPct(data.win_pct)}</div>
          </div>
          <div class="rivalry-split-label">But<br>Also</div>
          <div class="rivalry-half">
            <div class="rivalry-opponent">${data.also.opponent}</div>
            <div class="rivalry-record">${data.also.wins}-${data.also.losses} · ${fmtPct(data.also.win_pct)}</div>
          </div>
        </div>
      </div>`;
  }

  function renderRivalries(p) {
    return rivalryCard('nemesis', p.rivalries.nemesis) + rivalryCard('favorite', p.rivalries.favorite_opponent);
  }

  // Lives next to Versus Median on Performance, not on Rivalries -- it's a
  // read on this franchise's own schedule luck, not on any opponent.
  function renderLuck(p) {
    if (p.median_luck === null || p.median_luck === undefined) return card('Schedule Luck', '<div class="empty-note">Not enough median-era data yet.</div>');
    const cls = p.median_luck === 0 ? '' : p.median_luck > 0 ? 'lucky' : 'unlucky';
    const word = p.median_luck === 0 ? 'dead even' : p.median_luck > 0 ? 'luckier' : 'unluckier';
    return card('Schedule Luck', `<div class="feature"><div class="luck-val ${cls}">${p.median_luck > 0 ? '+' : ''}${fmt(p.median_luck, 1)}%</div>
      <div class="feature-sub">${word} than your scoring against the median alone would suggest, compared to your actual win rate.</div></div>`);
  }

  function renderDraft(p) {
    const b = p.moves.busiest_season;
    return card('Draft Position', pods([['Avg Draft Pos.', fmt(p.draft.avg_position, 1), { hl: true }], ['Highest Pick', fmt(p.draft.best_position)], ['Lowest Pick', fmt(p.draft.worst_position)]])) +
      card('Roster Moves', pods([['Total Moves', fmt(p.moves.total), { hl: true }], ['Avg / Season', fmt(p.moves.avg_per_season, 1)], ['Busiest Season', b ? `'${String(b.year).slice(2)}` : '—', { sub: b ? `${b.moves} moves` : '' }]]));
  }

  const BRACKET_LABELS = { NONE: 'Regular Season', WINNERS_BRACKET: 'Playoffs', WINNERS_CONSOLATION_LADDER: 'Playoffs (Consolation)', LOSERS_CONSOLATION_LADDER: 'Consolation' };
  const bracketLabel = bt => BRACKET_LABELS[bt] || bt;
  const weekLabel = r => `${bracketLabel(r.bracket_type)} · ${r.year} Week ${r.week}`;

  function renderEfficiency(p) {
    const e = p.efficiency;
    if (!e) {
      return card('Lineup Efficiency', `<div class="empty-note">No box-score data for this franchise since ${data.efficiency_start_year} -- ESPN doesn't retain per-week rosters further back.</div>`);
    }
    const headline = card('Lineup Efficiency', pods([
      ['Career Efficiency', fmtPct(e.career_pct), { hl: true }],
      ['Left on Bench', fmt(e.points_left_on_bench, 1), { hl: true, sub: `${fmt(e.avg_points_left, 1)} / game avg` }],
      ['Perfect Lineups', fmt(e.perfect_lineups), { hl: true, sub: `of ${e.games_analyzed} games` }],
    ]) + `<div class="row-sub" style="text-align:center;padding:2px 4px 6px">Since ${data.efficiency_start_year} -- the earliest year ESPN retains full weekly rosters</div>`);

    const rec = e.optimal_record;
    const fmtRec = r => `${r.w}-${r.l}${r.t ? '-' + r.t : ''}`;
    const recordCard = card('Optimal Record', pods([
      ['Actual', fmtRec(rec.actual)],
      ['Optimal', fmtRec(rec.optimal), { hl: true }],
      ['Extra Wins', rec.extra_wins > 0 ? `+${rec.extra_wins}` : fmt(rec.extra_wins), rec.extra_wins > 0 ? { tone: 'win' } : { hl: true }],
    ]) + `<div class="row-sub" style="text-align:center;padding:2px 4px 6px">Regular season only · vs. each week's real opponent score · ${rec.games} games</div>`);

    const wg = e.worst_game;
    const worstGameCard = card('Worst Lineup-Setting Week', wg
      ? `<div class="feature"><div class="luck-val unlucky">-${fmt(wg.diff, 1)}</div>
          <div class="feature-sub">Scored ${fmt(wg.actual, 1)}, best possible lineup was ${fmt(wg.optimal, 1)}<br>${weekLabel(wg)}</div></div>`
      : '<div class="empty-note">Every week was optimal, or close to it.</div>');

    const wb = e.worst_bench_miss;
    const worstBenchCard = card('Worst Bench Miss', wb
      ? `<div class="feature"><div class="luck-val unlucky">${fmt(wb.points, 1)}</div>
          <div class="feature-sub">${esc(wb.player_name)} put up ${fmt(wb.points, 1)} pts on your bench<br>${weekLabel(wb)}</div></div>`
      : '<div class="empty-note">No bench data yet.</div>');

    const seasonCard = card('By Season', rows(e.by_season.map(s => [String(s.year), [[fmtPct(s.pct), 'Efficiency'], [fmt(s.games), 'Games']]])));

    return `<div class="card-grid">${headline}${recordCard}</div>` +
      `<div class="card-grid">${worstGameCard}${worstBenchCard}</div>` +
      seasonCard;
  }

  const BADGE_LABELS = { progress: 'In Progress', champion: 'Champion', 'runner-up': 'Runner-Up', playoffs: 'Playoffs', missed: 'Missed Playoffs' };
  function badge(season) {
    const s = seasonState(season);
    return `<span class="badge ${s}">${BADGE_LABELS[s]}</span>`;
  }
  function renderHistory(p) {
    const list = [...p.season_history].reverse().map(s => `
      <div class="hist-row${s.champion ? ' champion' : ''}">
        <div class="hist-year">${s.year}</div>
        <div><div class="hist-team">${esc(s.team_name || p.current_team_name || '')}</div>
          <div class="row-sub">Reg ${s.reg_record} (${fmtOrdinal(s.reg_standing)})${s.playoff_record ? ' · Playoffs ' + s.playoff_record : ''}</div></div>
        ${badge(s)}
      </div>`).join('');
    return `<div class="stat-card"><div class="stat-card-body">${list || '<div class="empty-note">No seasons on record yet.</div>'}</div></div>`;
  }

  const TABS = [
    { label: 'Performance', render: p => `<div class="card-grid three">${renderStreaks(p)}</div><div class="card-grid">${renderPerformance(p)}</div><div class="card-grid">${renderMedian(p)}${renderLuck(p)}</div>` },
    { label: 'Scoring', render: p => `<div class="card-grid">${renderScoring(p)}</div>` },
    { label: 'Money', render: p => renderMoney(p) },
    { label: 'Efficiency', render: p => renderEfficiency(p) },
    { label: 'Rivalries', render: p => `<div class="card-grid">${renderRivalries(p)}</div>${renderRivalGrid(p)}` },
    { label: 'Draft & Roster', render: p => `<div class="card-grid">${renderDraft(p)}</div>` },
    { label: 'History', render: p => `${renderSeasonArc(p)}${renderHistory(p)}` },
    { label: 'Achievements', render: p => renderAchievements(p, CTX) },
  ];

  let data = null, tab = 0, CTX = null;
  function show(name) {
    const p = data.players.find(x => x.name === name);
    if (!p) return;
    document.getElementById('hero-container').innerHTML = renderHero(p);
    document.getElementById('tabs').innerHTML = TABS.map((t, i) => `<button class="tab ${i === tab ? 'on' : ''}" data-i="${i}">${t.label}</button>`).join('');
    document.getElementById('tab-content').innerHTML = TABS[tab].render(p);
  }

  document.addEventListener('click', e => {
    const t = e.target.closest('.tab');
    if (t) { tab = Number(t.dataset.i); show(document.getElementById('franchise-select').value); return; }
    const ach = e.target.closest('.ach.flippable');
    if (ach) ach.classList.toggle('flipped');
  });

  fetch('data/franchise.json', { cache: 'no-store' }).then(r => r.json()).then(d => {
    data = d;
    const currentYear = leagueCurrentYear(d.players);
    CTX = {
      currentYear,
      foundingYear: Math.min(...d.players.map(x => x.founded_year).filter(y => y != null)),
    };
    document.getElementById('updated-at').textContent = formatUpdated(d.generated_at);
    const sel = document.getElementById('franchise-select');
    sel.innerHTML = d.players.map(p => `<option value="${esc(p.name)}">${esc(p.name)}</option>`).join('');
    const saved = (() => { try { return localStorage.getItem('franchise-selected'); } catch (e) { return null; } })();
    sel.value = d.players.some(p => p.name === saved) ? saved : d.players[0].name;
    show(sel.value);
    sel.addEventListener('change', () => {
      show(sel.value);
      try { localStorage.setItem('franchise-selected', sel.value); } catch (e) {}
    });
  }).catch(err => {
    console.error(err);
    document.getElementById('hero-container').innerHTML = '<div class="loading-row" style="color:var(--loss);">Error loading franchise data.</div>';
  });
</script>
<script src="track.js?v=1" defer></script>
</body>
</html>
