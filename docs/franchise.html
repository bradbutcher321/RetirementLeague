<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retirement League — Franchise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=3">
<link rel="stylesheet" href="nav.css?v=3">
<style>
  .selector-row{ display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 26px; }
  .selector-label{ color: var(--text-dim); font-size: 0.82rem; }
  .franchise-select{ width: 190px; background: var(--surface); border: 1px solid var(--line); color: var(--text); font-family: var(--body); font-size: 1rem; font-weight: 600; padding: 10px 14px; border-radius: 4px; }
  .franchise-select:focus{ outline: 1px solid var(--gold); }

  .tabs{ display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .tab{ background: none; border: 1px solid var(--line); color: var(--text-dim); font-family: var(--body); font-size: 0.82rem; font-weight: 600; padding: 8px 14px; border-radius: 999px; cursor: pointer; }
  .tab.on{ border-color: var(--gold); color: var(--gold); background: rgba(186,155,55,0.10); }
  .tab-group + .tab-group{ margin-top: 14px; }

  /* ---------- Cards ---------- */
  .card-grid{ display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: stretch; }
  .card-grid.three{ grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 720px){ .card-grid, .card-grid.three{ grid-template-columns: 1fr; } }
  .stat-card{ background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--gold); }
  .stat-card-title{ padding: 12px 16px 4px; font-weight: 700; font-size: 0.95rem; }
  .stat-card-body{ padding: 6px 10px 12px; }
  .stack-col{ display: flex; flex-direction: column; gap: 14px; }
  .stack-col .stat-card{ flex: 1; }

  /* ---------- Hero ---------- */
  .hero-head{ padding: 18px 20px 14px; border-bottom: 1px solid var(--line); }
  .hero-team-name{ font-family: var(--scoreboard); font-weight: 800; font-size: clamp(1.6rem, 4vw, 2.3rem); line-height: 1.1; }
  .hero-meta{ margin-top: 4px; color: var(--text-dim); font-size: 0.88rem; }
  .hero-pills{ display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .aka{ background: var(--surface-raised); border: 1px solid var(--line); color: var(--text-dim); font-size: 0.74rem; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .tiles{ display: flex; flex-wrap: wrap; gap: 1px; background: var(--line); }
  .tile{ flex: 1 1 110px; background: var(--surface); padding: 14px 10px; text-align: center; }
  .tile-label{ color: var(--text-dim); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 5px; white-space: nowrap; }
  .tile-value{ font-family: var(--scoreboard); font-weight: 700; font-size: 1.4rem; font-variant-numeric: tabular-nums; }

  /* ---------- Headline stat cards ---------- */
  .podium{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
  .pod{ background: var(--surface-raised); border: 1px solid var(--line); padding: 12px 6px; text-align: center; min-width: 0; }
  .pod.hl{ border-color: var(--gold); }
  .pod.tone-win{ border-color: var(--turf); }
  .pod.tone-loss{ border-color: var(--loss); }
  .pod-label{ color: var(--text-dim); font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
  .pod-val{ font-family: var(--scoreboard); font-weight: 800; font-size: 1.6rem; height: 2rem; line-height: 2rem; margin-top: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pod.hl .pod-val{ color: var(--gold); }
  .pod-val.win{ color: var(--turf); }
  .pod-val.loss{ color: var(--loss); }
  .pod-val.long{ font-size: 1.25rem; }
  .pod-sub{ color: var(--text-dim); font-size: 0.7rem; min-height: 1em; margin-top: 2px; }

  /* ---------- Rows ---------- */
  .row{
    display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 12px;
    background: var(--surface-raised); border: 1px solid var(--line); padding: 9px 12px; margin-top: 6px; min-height: 58px;
  }
  .row-name{ font-weight: 700; font-size: 0.92rem; }
  .row-sub{ color: var(--text-dim); font-size: 0.74rem; margin-top: 1px; }
  .row-stats{ display: flex; gap: 16px; }
  .row-stat{ text-align: center; min-width: 52px; }
  .row-stat b{ display: block; font-family: var(--scoreboard); font-size: 1.15rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .row-stat span{ font-size: 0.6rem; color: var(--text-dim); letter-spacing: 0.04em; text-transform: uppercase; }
  .row-stat b.win{ color: var(--turf); }
  .row-stat b.loss{ color: var(--loss); }

  .pill{ font-size: 0.78rem; font-weight: 700; padding: 4px 11px; border-radius: 999px; border: 1px solid; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .pill.up{ color: var(--turf); border-color: var(--turf-dim); background: rgba(76,154,107,0.10); }
  .pill.down{ color: var(--loss); border-color: var(--loss); background: rgba(192,87,75,0.10); }

  /* ---------- Rivalry / luck ---------- */
  .feature{ text-align: center; padding: 16px 8px 8px; }
  .feature-name{ font-family: var(--scoreboard); font-weight: 800; font-size: 1.7rem; }
  .feature-sub{ color: var(--text-dim); font-size: 0.85rem; margin-top: 4px; }
  .luck-val{ font-family: var(--scoreboard); font-weight: 800; font-size: 2rem; }
  .luck-val.lucky{ color: var(--turf); }
  .luck-val.unlucky{ color: var(--loss); }

  /* ---------- Rivalries ---------- */
  .rivalry-card{
    position: relative;
    background: linear-gradient(165deg, var(--surface-raised), var(--surface));
    border: 1px solid var(--line);
    padding: 22px 20px;
    text-align: center;
  }
  .rivalry-card.nemesis{ border-top: 3px solid var(--loss); }
  .rivalry-card.favorite{ border-top: 3px solid var(--turf); }
  .rivalry-eyebrow{
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .rivalry-card.nemesis .rivalry-eyebrow{ color: var(--loss); }
  .rivalry-card.favorite .rivalry-eyebrow{ color: var(--turf); }
  .rivalry-opponent{
    font-family: var(--scoreboard);
    font-weight: 800;
    font-size: 1.6rem;
  }
  .rivalry-record{
    margin-top: 6px;
    color: var(--text-dim);
    font-size: 0.9rem;
  }
  /* Side-by-side layout for the "But Also" case. "But Also" itself is the
     divider (vertically centered via align-items, same trick the matchup
     cards use to center "VS") rather than a label sitting above just the
     second name — that pushed the two names out of alignment with each
     other. */
  .rivalry-split{
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 4px;
  }
  .rivalry-half{ flex: 1; min-width: 0; }
  .rivalry-split-label{
    flex-shrink: 0;
    color: var(--text-dim);
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    text-align: center;
    line-height: 1.3;
  }

  /* ---------- Season history ---------- */
  .hist-row{ display: grid; grid-template-columns: 56px minmax(0,1fr) auto; align-items: center; gap: 12px; background: var(--surface-raised); border: 1px solid var(--line); border-left: 3px solid transparent; padding: 10px 12px; margin-top: 6px; min-height: 58px; }
  .hist-row.champion{ border-left-color: var(--gold); }
  .hist-year{ font-family: var(--scoreboard); font-weight: 700; font-size: 1.25rem; color: var(--text-dim); text-align: center; }
  .hist-team{ font-weight: 700; font-size: 0.95rem; }
  .badge{ font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; padding: 5px 10px; border-radius: 999px; white-space: nowrap; border: 1px solid var(--line); color: var(--text-dim); }
  .badge.champion{ background: rgba(186,155,55,0.14); color: var(--gold); border-color: var(--gold); }
  .badge.runner-up{ color: var(--gold); border-color: var(--gold); }
  .badge.playoffs{ background: rgba(76,154,107,0.12); color: var(--turf); border-color: var(--turf-dim); }
  .badge.progress{ border-style: dashed; }
  .badge.missed{ background: rgba(192,87,75,0.12); color: var(--loss); border-color: var(--loss); }
  .empty-note{ padding: 22px 10px; color: var(--text-dim); font-size: 0.85rem; text-align: center; }
</style>
</head>
<body>
  <div id="site-nav"></div>
  <div class="wrap">
    <header>
      <div class="header-row">
        <div>
          <div class="eyebrow">Retirement League</div>
          <h1>Franchise</h1>
        </div>
        <div class="updated-block">
          <div class="updated-label">Updated</div>
          <div class="updated-value" id="updated-at">—</div>
        </div>
      </div>
    </header>

    <div class="selector-row">
      <label class="selector-label" for="franchise-select">Franchise Selection:</label>
      <select class="franchise-select" id="franchise-select"></select>
    </div>

    <section><div id="hero-container"><div class="loading-row">Loading franchise…</div></div></section>
    <section>
      <div class="tabs" id="tabs"></div>
      <div id="tab-content"></div>
    </section>

    <footer>Data via ESPN Fantasy (Money Tracker from the league sheet) · Updates Tuesday &amp; Thursday mornings</footer>
  </div>

<script src="nav.js"></script>
<script src="page-common.js"></script>
<script>
  const fmt = (n, d = 0) => (n === null || n === undefined || Number.isNaN(n)) ? '—' : Number(n).toFixed(d);
  const fmtPct = n => (n === null || n === undefined) ? '—' : `${Number(n).toFixed(1)}%`;
  const fmtMoney = n => (n === null || n === undefined) ? '—' : `${n < 0 ? '-' : ''}$${Math.abs(Number(n)).toLocaleString()}`;
  const fmtOrdinal = n => {
    if (n === null || n === undefined) return '—';
    const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  };

  // pods: [label, value, { cls, hl, sub }]
  const pods = list => `<div class="podium">${list.map(([label, value, o = {}]) => `
    <div class="pod${o.tone ? ' tone-' + o.tone : o.hl ? ' hl' : ''}">
      <div class="pod-label">${label}</div>
      <div class="pod-val${o.tone || o.cls ? ' ' + (o.tone || o.cls) : ''}${String(value).length > 6 ? ' long' : ''}">${value}</div>
      <div class="pod-sub">${o.sub || '&nbsp;'}</div>
    </div>`).join('')}</div>`;

  // rows: [name, [[value, label, cls?], ...]]
  const rows = list => list.map(([name, stats, sub]) => `
    <div class="row">
      <div><div class="row-name">${name}</div>${sub ? `<div class="row-sub">${sub}</div>` : ''}</div>
      <div class="row-stats">${stats.map(([v, l, c]) => `<div class="row-stat"><b${c ? ` class="${c}"` : ''}>${v}</b><span>${l}</span></div>`).join('')}</div>
    </div>`).join('');

  const rateTone = v => v === null || v === undefined ? { hl: true } : { tone: v >= 50 ? 'win' : 'loss' };
  const signTone = v => v > 0 ? { tone: 'win' } : v < 0 ? { tone: 'loss' } : { hl: true };
  const card = (title, body, cls) => `<div class="stat-card${cls ? ' ' + cls : ''}">${title ? `<div class="stat-card-title">${title}</div>` : ''}<div class="stat-card-body">${body}</div></div>`;
  const tile = (label, value) => `<div class="tile"><div class="tile-label">${label}</div><div class="tile-value">${value}</div></div>`;

  function renderHero(p) {
    const rec = p.career.record;
    const w = (rec.reg_w || 0) + (rec.playoff_w || 0), l = (rec.reg_l || 0) + (rec.playoff_l || 0);
    const pct = w + l ? w / (w + l) * 100 : null;
    const akas = (p.previous_team_names || []).map(n => `<span class="aka">aka ${esc(n)}</span>`).join('');
    const tenure = p.founded_year ? `Founded ${p.founded_year} · ${p.seasons} season${p.seasons === 1 ? '' : 's'}` : '';
    return `
      <div class="stat-card">
        <div class="hero-head">
          <div class="hero-team-name">${esc(p.current_team_name || p.name)}</div>
          <div class="hero-meta">${esc(p.name)} · ${tenure}</div>
          ${akas ? `<div class="hero-pills">${akas}</div>` : ''}
        </div>
        <div class="tiles">
          ${tile('Record', `${w}-${l}`)}${tile('Win %', fmtPct(pct))}${tile('Ships', fmt(p.career.standings.championships))}
          ${tile('Playoff Apps.', fmt(p.career.standings.playoff_appearances))}${tile('Weekly Sackos', fmt(p.weekly_sackos))}
        </div>
      </div>`;
  }

  function renderStreaks(p) {
    return [['Versus Opponent', p.streaks.head_to_head], ['Versus Median', p.streaks.median], ['Versus Both', p.streaks.combined]].map(([title, s]) => {
      const cur = s.current === 0 ? '—' : `${s.current > 0 ? 'W' : 'L'}${Math.abs(s.current)}`;
      const cls = s.current > 0 ? 'win' : s.current < 0 ? 'loss' : '';
      return card(title, pods([['Current', cur, s.current === 0 ? { hl: true } : { tone: s.current > 0 ? 'win' : 'loss' }], ['Longest W', fmt(s.longest_win)], ['Longest L', fmt(s.longest_loss)]]));
    }).join('');
  }

  function renderPerformance(p) {
    const r = p.career.record, s = p.career.standings, wr = p.career.win_rates;
    const reg = card('Regular Season',
      pods([['Win Rate', fmtPct(wr.reg_pct), rateTone(wr.reg_pct)], ['Record', `${fmt(r.reg_w)}-${fmt(r.reg_l)}${r.reg_t ? '-' + r.reg_t : ''}`], ['Reg Szn Champ', fmt(s.reg_season_champs)]]) +
      rows([['Finish', [[fmt(s.best_regular_finish), 'Best'], [fmt(s.worst_regular_finish), 'Worst']]], ['Sackos', [[fmt(s.sackos), 'Total']]]]));
    const po = card('Playoffs',
      pods([['Win Rate', fmtPct(wr.playoff_pct), rateTone(wr.playoff_pct)], ['Record', `${fmt(r.playoff_w)}-${fmt(r.playoff_l)}`], ['Ships', fmt(s.championships)]]) +
      rows([['Appearances', [[fmt(s.playoff_appearances), 'Playoffs'], [fmt(s.champ_appearances), 'Finals']]], ['Byes', [[fmt(s.byes), 'Total']]]]));
    return reg + po;
  }

  function renderScoring(p) {
    const pts = p.career.points, ex = p.extremes, med = p.career.median || {};
    const scoring = card('Scoring', rows([
      ['Total Points', [[fmt(pts.total_pf, 2), 'For'], [fmt(pts.total_pa, 2), 'Against']]],
      ['Average', [[fmt(pts.avg_pf, 2), 'For'], [fmt(pts.avg_pa, 2), 'Against']]],
      ['Single Game', [[fmt(ex.highest_score, 2), 'High'], [fmt(ex.lowest_score, 2), 'Low']]],
      ['Win Margin', [[fmt(ex.biggest_win_margin, 2), 'Largest'], [fmt(ex.lowest_win_margin, 2), 'Smallest']]],
      ['Loss Margin', [[fmt(ex.biggest_loss_margin, 2), 'Largest'], [fmt(ex.lowest_loss_margin, 2), 'Smallest']]],
    ]));
    const median = card('Median', pods([['Win Rate', fmtPct(med.pct), rateTone(med.pct)], ['Wins', fmt(med.wins)], ['Losses', fmt(med.losses)]]));
    const money = p.money
      ? card('Money', pods([['Net Result', fmtMoney(p.money.net_result), signTone(p.money.net_result)], ['Dues', fmtMoney(p.money.total_dues)], ['Earnings', fmtMoney(p.money.total_earnings)]]) +
          rows([['Parlays Purchased', [[fmtMoney(p.money.parlays_purchased), 'Total']]]]))
      : card('Money', '<div class="empty-note">Not tracked for this franchise.</div>');
    return scoring + `<div class="stack-col">${median}${money}</div>`;
  }

  const RIVALRY_LABELS = { nemesis: "Who's Your Daddy", favorite: "Who's Your Bitch" };

  function rivalryCard(kind, data) {
    const label = RIVALRY_LABELS[kind];
    if (!data) {
      return `<div class="rivalry-card ${kind}"><div class="rivalry-eyebrow">${label}</div><div class="empty-note">Not enough head-to-head history yet.</div></div>`;
    }
    // "also" only shows up when the top pick has left the league — surface
    // the best-qualifying opponent who's still active this season too,
    // side by side, since needling someone who's gone isn't much of a
    // rivalry.
    if (!data.also) {
      return `
        <div class="rivalry-card ${kind}">
          <div class="rivalry-eyebrow">${label}</div>
          <div class="rivalry-opponent">${data.opponent}</div>
          <div class="rivalry-record">${data.wins}-${data.losses} · ${fmtPct(data.win_pct)}</div>
        </div>`;
    }
    return `
      <div class="rivalry-card ${kind}">
        <div class="rivalry-eyebrow">${label}</div>
        <div class="rivalry-split">
          <div class="rivalry-half">
            <div class="rivalry-opponent">${data.opponent}</div>
            <div class="rivalry-record">${data.wins}-${data.losses} · ${fmtPct(data.win_pct)}</div>
          </div>
          <div class="rivalry-split-label">But<br>Also</div>
          <div class="rivalry-half">
            <div class="rivalry-opponent">${data.also.opponent}</div>
            <div class="rivalry-record">${data.also.wins}-${data.also.losses} · ${fmtPct(data.also.win_pct)}</div>
          </div>
        </div>
      </div>`;
  }

  function renderRivalries(p) {
    return rivalryCard('nemesis', p.rivalries.nemesis) + rivalryCard('favorite', p.rivalries.favorite_opponent);
  }

  function renderLuck(p) {
    if (p.median_luck === null || p.median_luck === undefined) return card('', '<div class="empty-note">Not enough median-era data yet.</div>');
    const cls = p.median_luck === 0 ? '' : p.median_luck > 0 ? 'lucky' : 'unlucky';
    const word = p.median_luck === 0 ? 'dead even' : p.median_luck > 0 ? 'luckier' : 'unluckier';
    return card('', `<div class="feature"><div class="luck-val ${cls}">${p.median_luck > 0 ? '+' : ''}${fmt(p.median_luck, 1)}%</div>
      <div class="feature-sub">${word} than your scoring against the median alone would suggest, compared to your actual win rate.</div></div>`);
  }

  function renderDraft(p) {
    const b = p.moves.busiest_season;
    return card('Draft Position', pods([['Avg Draft Pos.', fmt(p.draft.avg_position, 1), { hl: true }], ['Highest Pick', fmt(p.draft.best_position)], ['Lowest Pick', fmt(p.draft.worst_position)]])) +
      card('Roster Moves', pods([['Total Moves', fmt(p.moves.total), { hl: true }], ['Avg / Season', fmt(p.moves.avg_per_season, 1)], ['Busiest Season', b ? `'${String(b.year).slice(2)}` : '—', { sub: b ? `${b.moves} moves` : '' }]]));
  }

  const BRACKET_LABELS = { NONE: 'Regular Season', WINNERS_BRACKET: 'Playoffs', WINNERS_CONSOLATION_LADDER: 'Playoffs (Consolation)', LOSERS_CONSOLATION_LADDER: 'Consolation' };
  const bracketLabel = bt => BRACKET_LABELS[bt] || bt;
  const weekLabel = r => `${bracketLabel(r.bracket_type)} · ${r.year} Week ${r.week}`;

  function renderEfficiency(p) {
    const e = p.efficiency;
    if (!e) {
      return card('Lineup Efficiency', `<div class="empty-note">No box-score data for this franchise since ${data.efficiency_start_year} -- ESPN doesn't retain per-week rosters further back.</div>`);
    }
    const headline = card('Lineup Efficiency', pods([
      ['Career Efficiency', fmtPct(e.career_pct), { hl: true }],
      ['Left on Bench', fmt(e.points_left_on_bench, 1), { hl: true, sub: `${fmt(e.avg_points_left, 1)} / game avg` }],
      ['Perfect Lineups', fmt(e.perfect_lineups), { hl: true, sub: `of ${e.games_analyzed} games` }],
    ]) + `<div class="row-sub" style="text-align:center;padding:2px 4px 6px">Since ${data.efficiency_start_year} -- the earliest year ESPN retains full weekly rosters</div>`);

    const rec = e.optimal_record;
    const fmtRec = r => `${r.w}-${r.l}${r.t ? '-' + r.t : ''}`;
    const recordCard = card('Optimal Record', pods([
      ['Actual', fmtRec(rec.actual)],
      ['Optimal', fmtRec(rec.optimal), { hl: true }],
      ['Extra Wins', rec.extra_wins > 0 ? `+${rec.extra_wins}` : fmt(rec.extra_wins), rec.extra_wins > 0 ? { tone: 'win' } : { hl: true }],
    ]) + `<div class="row-sub" style="text-align:center;padding:2px 4px 6px">Regular season only · vs. each week's real opponent score · ${rec.games} games</div>`);

    const wg = e.worst_game;
    const worstGameCard = card('Worst Lineup-Setting Week', wg
      ? `<div class="feature"><div class="luck-val unlucky">-${fmt(wg.diff, 1)}</div>
          <div class="feature-sub">Scored ${fmt(wg.actual, 1)}, best possible lineup was ${fmt(wg.optimal, 1)}<br>${weekLabel(wg)}</div></div>`
      : '<div class="empty-note">Every week was optimal, or close to it.</div>');

    const wb = e.worst_bench_miss;
    const worstBenchCard = card('Worst Bench Miss', wb
      ? `<div class="feature"><div class="luck-val unlucky">${fmt(wb.points, 1)}</div>
          <div class="feature-sub">${esc(wb.player_name)} put up ${fmt(wb.points, 1)} pts on your bench<br>${weekLabel(wb)}</div></div>`
      : '<div class="empty-note">No bench data yet.</div>');

    const seasonCard = card('By Season', rows(e.by_season.map(s => [String(s.year), [[fmtPct(s.pct), 'Efficiency'], [fmt(s.games), 'Games']]])));

    return headline + `<div class="card-grid">${recordCard}${worstGameCard}${worstBenchCard}${seasonCard}</div>`;
  }

  function badge(season) {
    const games = (season.reg_record || '0-0').split('-').reduce((a, b) => a + (parseInt(b, 10) || 0), 0);
    if (games < 10) return '<span class="badge progress">In Progress</span>';
    if (season.champion) return '<span class="badge champion">Champion</span>';
    if (season.final_standing === 2) return '<span class="badge runner-up">Runner-Up</span>';
    if (season.made_playoffs) return '<span class="badge playoffs">Playoffs</span>';
    return '<span class="badge missed">Missed Playoffs</span>';
  }
  function renderHistory(p) {
    const list = [...p.season_history].reverse().map(s => `
      <div class="hist-row${s.champion ? ' champion' : ''}">
        <div class="hist-year">${s.year}</div>
        <div><div class="hist-team">${esc(s.team_name || p.current_team_name || '')}</div>
          <div class="row-sub">Reg ${s.reg_record} (${fmtOrdinal(s.reg_standing)})${s.playoff_record ? ' · Playoffs ' + s.playoff_record : ''}</div></div>
        ${badge(s)}
      </div>`).join('');
    return `<div class="stat-card"><div class="stat-card-body">${list || '<div class="empty-note">No seasons on record yet.</div>'}</div></div>`;
  }

  const TABS = [
    { label: 'Performance', render: p => `<div class="card-grid three">${renderStreaks(p)}</div><div class="tab-group card-grid">${renderPerformance(p)}</div>` },
    { label: 'Scoring', render: p => `<div class="card-grid">${renderScoring(p)}</div>` },
    { label: 'Efficiency', render: p => renderEfficiency(p) },
    { label: 'Rivalries', render: p => `<div class="card-grid">${renderRivalries(p)}</div><div class="tab-group">${renderLuck(p)}</div>` },
    { label: 'Draft & Roster', render: p => `<div class="card-grid">${renderDraft(p)}</div>` },
    { label: 'History', render: p => renderHistory(p) },
  ];

  let data = null, tab = 0;
  function show(name) {
    const p = data.players.find(x => x.name === name);
    if (!p) return;
    document.getElementById('hero-container').innerHTML = renderHero(p);
    document.getElementById('tabs').innerHTML = TABS.map((t, i) => `<button class="tab ${i === tab ? 'on' : ''}" data-i="${i}">${t.label}</button>`).join('');
    document.getElementById('tab-content').innerHTML = TABS[tab].render(p);
  }

  document.addEventListener('click', e => {
    const t = e.target.closest('.tab');
    if (!t) return;
    tab = Number(t.dataset.i);
    show(document.getElementById('franchise-select').value);
  });

  fetch('data/franchise.json', { cache: 'no-store' }).then(r => r.json()).then(d => {
    data = d;
    document.getElementById('updated-at').textContent = formatUpdated(d.generated_at);
    const sel = document.getElementById('franchise-select');
    sel.innerHTML = d.players.map(p => `<option value="${esc(p.name)}">${esc(p.name)}</option>`).join('');
    const saved = (() => { try { return localStorage.getItem('franchise-selected'); } catch (e) { return null; } })();
    sel.value = d.players.some(p => p.name === saved) ? saved : d.players[0].name;
    show(sel.value);
    sel.addEventListener('change', () => {
      show(sel.value);
      try { localStorage.setItem('franchise-selected', sel.value); } catch (e) {}
    });
  }).catch(err => {
    console.error(err);
    document.getElementById('hero-container').innerHTML = '<div class="loading-row" style="color:#C0574B;">Error loading franchise data.</div>';
  });
</script>
<script src="track.js?v=1" defer></script>
</body>
</html>
