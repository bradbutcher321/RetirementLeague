      return `<div class="tile${tone ? ' is-' + tone : ''}"><div class="tile-l">${label}</div><div class="tile-v">${fmt(w[key])}</div>${sub ? `<div class="tile-s">${sub}</div>` : ''}</div>`;
    }).join('')}</div>
      <div class="wk-note">A bubble win is the lowest score that still beat that week's median. A bubble loss is the highest score that still lost to it.</div>`,
      { chip: chip(`${w.weeks} weeks since ${first}`) });

    // 12-team weeks only: 8- and 10-team years have no 7th through 12th.
    let strip = '';
    if (w.weeks12) {
      const max = Math.max(1, ...w.dist12);
      const col = (c, i) => `<div class="fcol${c ? '' : ' zero'}" title="${fmtOrdinal(i + 1)}: ${c} week${c === 1 ? '' : 's'}"><b>${c}</b><div class="fbar"><i style="height:${(c / max * 100).toFixed(1)}%"></i></div><span>${fmtOrdinal(i + 1)}</span></div>`;
      const cells = w.dist12.slice(0, 6).map(col).join('') + '<div class="fmid"></div>' + w.dist12.slice(6).map((c, i) => col(c, i + 6)).join('');
      const topHalf = Math.round(w.dist12.slice(0, 6).reduce((a, b) => a + b, 0) / w.weeks12 * 100);
      strip = card('Where You Finish Each Week', `<div class="fmed">Median</div><div class="fhist">${cells}</div>
        <div class="flegend"><span>Top half <b>${topHalf}%</b></span><span>Bottom half <b>${100 - topHalf}%</b></span></div>`,
        { chip: chip(`${w.weeks12} 12-team weeks`) });
    }

    const vsMed = w.beat + w.lost ? w.beat / (w.beat + w.lost) * 100 : null;
    const avgM = w.margin / w.weeks;
    const off = p.career.median || {};
    const med = card('Against the Weekly Median', tiles([
      ['Beat It', fmtPct(vsMed), { tone: rateTone(vsMed), sub: `${w.beat} of ${w.beat + w.lost} weeks` }],
      ['Avg vs Median', fmtSigned(avgM, 2, ''), { tone: signTone(avgM), sub: 'per week' }],
      ['Official', (off.wins || 0) + (off.losses || 0) ? rec(off.wins, off.losses) : '—', { sub: `Since ${data.median_era_start_year}` }],
    ], 3) + lines([
      ['Stolen Wins', [[fmt(w.stolen), '']], `Won while scoring below the median${weeklyRankSub(p, 'stolen') ? ` · ${weeklyRankSub(p, 'stolen')}` : ''}`],
      ['Robbed Losses', [[fmt(w.robbed), '']], `Lost while scoring above it${weeklyRankSub(p, 'robbed') ? ` · ${weeklyRankSub(p, 'robbed')}` : ''}`],
      ['Boom and Bust', [[fmt(w.boom), `${BOOM_PTS}+`, 'gold'], [fmt(w.bust), `Under ${BUST_PTS}`, 'loss']], `Weeks of ${BOOM_PTS}+ and weeks under ${BUST_PTS}`],
      // Site audit II #34: how far a typical week lands from this manager's
      // own average. Ranked widest first.
      ['Weekly Swing', [[`±${fmt(w.sd, 1)}`, 'pts']], `Standard deviation of weekly scores${weeklyRankSub(p, 'sd') ? ` · ${weeklyRankSub(p, 'sd')} widest` : ''}`],
    ]));

    return `${finishes}<div class="pair">${strip}${med}</div>${renderBestWorst(p)}`;
  }

  // Every finished game this manager played, playoffs included. Consolation
  // games count for the highs only (the weekly high-score prize counts every
  // game); a lineup nobody set there isn't a real low.
  function renderBestWorst(p) {
    const mine = GAMES.filter(g => g.type !== 'Bye' && g.p2 && g.winner !== 'In Progress' && g.s1 > 0 && g.s2 > 0 && (g.p1 === p.name || g.p2 === p.name))
      .map(g => g.p1 === p.name ? { s: g.s1, o: g.p2, os: g.s2, won: g.winner === g.p1, lost: g.winner === g.p2, g } : { s: g.s2, o: g.p1, os: g.s1, won: g.winner === g.p2, lost: g.winner === g.p1, g });
    const lows = mine.filter(x => x.g.type !== 'Cons');
    const pick = (list, better) => list.reduce((a, b) => (!a || better(b, a) ? b : a), null);
    // Same game-type words as Head to Head's tags.
    const TYPE = { Play: 'Playoffs', Champ: 'Final', Sacko: 'Sacko', Cons: 'Consolation', '3rd': '3rd place', '5th': '5th place' };
    const when = x => `${x.g.year} Wk ${x.g.week}${x.g.type === 'Reg' ? '' : ' · ' + (TYPE[x.g.type] || x.g.type)}`;
    const row = (label, x, cls) => x ? [label, [[fmt(x.s, 2), '', cls]], `vs ${esc(x.o)} ${fmt(x.os, 2)} · ${when(x)}`] : null;
    const rows = [
      row('Highest Score', pick(mine, (a, b) => a.s > b.s), 'gold'),
      row('Lowest Score', pick(lows, (a, b) => a.s < b.s), 'loss'),
      row('Most Points in a Loss', pick(mine.filter(x => x.lost), (a, b) => a.s > b.s)),
      row('Fewest Points in a Win', pick(lows.filter(x => x.won), (a, b) => a.s < b.s)),
    ].filter(Boolean);
    return rows.length ? card('Best and Worst Weeks', lines(rows)) : '';
  }

  // ---------- Money & Draft ----------
  function renderMoney(p) {
    const m = p.money;
    const money = !m ? card('Money', '<div class="empty-note">Not tracked for this franchise.</div>') :
      card('Money', tiles([
        ['Net', fmtMoney(m.net_result), { tone: signTone(m.net_result), sub: rankSub(p, x => x.money && x.money.net_result) }],
        ['Paid In', fmtMoney(m.total_dues), { sub: 'Dues' }],
        ['Won', fmtMoney(m.total_earnings), { sub: m.total_dues ? `${Math.round(m.total_earnings / m.total_dues * 100)}% of dues back` : '' }],
      ], 3) + lines([
        ['Parlays Bought', [[fmtMoney(m.parlays_purchased), 'Spent']]],
        ['Per Season', [[fmtSigned(m.net_result / (p.seasons || 1), 0, '').replace(/^([+−]?)/, '$1$'), 'Net', signCls(m.net_result)]]],
      ]));
    const b = p.moves.busiest_season;
    const draft = card('Draft & Roster', tiles([
      // Lowest average pick ranks first.
      ['Avg Pick', fmt(p.draft.avg_position, 1), { tone: topTone(p, x => x.draft && x.draft.avg_position, false) }],
      ['Earliest', fmt(p.draft.best_position), { sub: 'pick' }],
      ['Latest', fmt(p.draft.worst_position), { sub: 'pick' }],
    ], 3) + lines([
      ['Roster Moves', [[fmt(p.moves.total), 'Total'], [fmt(p.moves.avg_per_season, 1), 'Per Szn']], rankSub(p, x => x.moves.total) ? `${rankSub(p, x => x.moves.total)} most active` : ''],
      ['Busiest Season', [[b ? fmt(b.moves) : '—', b ? String(b.year) : '']]],
    ]));
    return `<div class="pair">${money}${draft}</div>${renderDraftGrades(p)}`;
  }

  // Draft value (site audit II #33), from data/draft-value.json: each
  // year's grade against that draft's field, then the best and worst pick
  // of every draft since lineups began in 2017. Picks are scored by their
  // regular-season points as this team's starters.
  function renderDraftGrades(p) {
    if (DRAFTV === undefined) return card('Draft Grades', '<div class="empty-note">Loading draft grades…</div>');
    if (!DRAFTV) return '';
    const years = Object.keys(DRAFTV).map(Number).sort((a, b) => a - b).filter(y => DRAFTV[y].managers[p.name]);
    if (!years.length) return card('Draft Grades', '<div class="empty-note">No drafts since 2017, when weekly lineups begin.</div>');
    const tilesHtml = years.map(y => {
      const v = DRAFTV[y], m = v.managers[p.name];
      const tone = v.complete ? (m.grade <= 'B' ? ' g-good' : m.grade >= 'D' ? ' g-bad' : '') : ' progress';
      return `<div class="arc-tile${tone}" title="${esc(`${y}: ${fmtNum(m.pts, 2)} pts, ${fmtOrdinal(m.rank)} of ${Object.keys(v.managers).length}${v.complete ? '' : ` through Week ${v.through_week}`}`)}"><div class="arc-year">${y}</div><div class="arc-standing">${m.grade}</div><div class="arc-rec">${fmtOrdinal(m.rank)}</div></div>`;
    }).join('');
    const all = years.map(y => [y, DRAFTV[y].managers[p.name]]);
    const best = all.reduce((a, b) => (!a || b[1].best.v > a[1].best.v ? b : a), null);
    const bust = all.reduce((a, b) => (!a || b[1].bust.v < a[1].bust.v ? b : a), null);
    const pickSub = (y, x) => `${esc(x.player)} · ${y} Rd ${x.round}.${x.pick} · ${fmtSigned(x.v, 2, '')} vs round avg`;
    const done = all.filter(([y]) => DRAFTV[y].complete);
    const avgRank = done.length ? done.reduce((a, [, m]) => a + m.rank, 0) / done.length : null;
    return card('Draft Grades', `<div class="arc-grid edge-fade dg-grid">${tilesHtml}</div>` + lines([
      ['Best Pick', [[fmt(best[1].best.pts, 2), 'pts', 'gold']], pickSub(best[0], best[1].best)],
      ['Biggest Bust', [[fmt(bust[1].bust.pts, 2), 'pts', 'loss']], pickSub(bust[0], bust[1].bust)],
      ...(avgRank != null ? [['Average Draft', [[fmt(avgRank, 1), 'Rank']], `Among each year's field · ${done.length} finished draft${done.length === 1 ? '' : 's'}`]] : []),
    ]), { note: `Points each pick scored as a starter for this team in the regular season, graded A to F against that year's draft. <a class="mgr" href="draft-board.html?view=value">Draft Board</a> has every pick.` });
  }

  // ---------- This season (audit X #10) ----------
  // What you.html had, for any manager: this week's matchup (and, on your
  // own, what needs doing), the season so far, playoff odds with the record
  // it takes, the schedule left, and how the roster was built.
  const WORKER_URL = 'https://retirement-league-refresh-proxy.bradbutcher321.workers.dev';
  const ESPN_LEAGUE = 58101;
  const getJSON = (url, opt) => fetch(url, Object.assign({ cache: 'no-cache' }, opt)).then(r => (r.ok ? r.json() : null)).catch(() => null);
  const SVGI = b => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${b}</svg>`;
  const IC = {
    chev: SVGI('<path d="m9 6 6 6-6 6"/>'),
    alert: SVGI('<path d="M12 4 2.8 19.5h18.4z"/><path d="M12 10v4.5M12 17.2v.3"/>'),
    ticket: SVGI('<path d="M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4V7z"/><path d="M14 7v10" stroke-dasharray="2 2.2"/>'),
  };
  // The Worker's live numbers, with the site's own odds and clinch marks.
  let LIVE = null, LIVE_P = null;
  const liveP = () => LIVE_P || (LIVE_P = getJSON(WORKER_URL, { cache: 'no-store' }).then(d => {
    if (d && d.teams && typeof RaceSim !== 'undefined') RaceSim.apply(d);
    LIVE = d && d.teams ? d : null;
    return LIVE;
  }));
  const lazy = {};
  const once = (k, fn) => lazy[k] || (lazy[k] = fn());
  const logoOf = name => { const x = data && data.players.find(q => q.name === name); return x && x.current_team_logo; };
  const avatar = name => { const u = logoOf(name); return `<span class="pf-av">${u ? `<img src="${esc(u)}" alt="" onerror="this.remove()">` : esc(monogram(name))}</span>`; };
  const ET = { timeZone: 'America/New_York' };
  const when = ms => { const d = new Date(ms); return `${d.toLocaleDateString('en-US', { weekday: 'short', ...ET })} ${d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', ...ET })}`; };

  // Finished regular-season games of a year, from league.json.
  const doneGames = year => GAMES.filter(g => g.year === year && g.type === 'Reg' && g.p2 && g.winner && g.winner !== 'In Progress' && (g.s1 > 0 || g.s2 > 0));
  function seriesOf(a, b) {
    const gs = GAMES.filter(g => g.p2 && ((g.p1 === a && g.p2 === b) || (g.p1 === b && g.p2 === a)) && (g.winner === a || g.winner === b));
    return { w: gs.filter(g => g.winner === a).length, l: gs.filter(g => g.winner === b).length };
  }
  // Schedule luck: wins against the real schedule, minus the wins an
  // average schedule gives the same scores; and the record with each other
  // manager's schedule (yours played against their opponents).
  function luckOf(name, year) {
    const gs = doneGames(year);
    const score = new Map(), opp = new Map();
    gs.forEach(g => {
      const s = score.get(g.week) || new Map(), o = opp.get(g.week) || new Map();
      s.set(g.p1, g.s1); s.set(g.p2, g.s2); o.set(g.p1, g.p2); o.set(g.p2, g.p1);
      score.set(g.week, s); opp.set(g.week, o);
    });
    let wins = 0, exp = 0, games = 0;
    const others = new Set();
    score.forEach((s, wk) => {
      if (!s.has(name)) return;
      games++;
      const mine = s.get(name), o = opp.get(wk).get(name);
      if (mine > s.get(o)) wins++;
      let beat = 0, n = 0;
      s.forEach((v, k) => { if (k === name) return; others.add(k); n++; if (mine > v) beat++; else if (mine === v) beat += 0.5; });
      exp += n ? beat / n : 0;
    });
    const swap = [...others].map(j => {
      let w = 0;
      score.forEach((s, wk) => { if (!s.has(name) || !s.has(j)) return; let o = opp.get(wk).get(j); if (o === name) o = j; if (s.get(name) > s.get(o)) w++; });
      return { j, w };
    });
    const hi = Math.max(...swap.map(x => x.w)), lo = Math.min(...swap.map(x => x.w));
    return { wins, games, exp, luck: wins - exp, best: { w: hi, with: swap.filter(x => x.w === hi).map(x => x.j) }, worst: { w: lo, with: swap.filter(x => x.w === lo).map(x => x.j) } };
  }
  // Odds after each finished week: RaceSim.history (race-sim.js, audit X #15).
  const oddsPath = (year, d) => RaceSim.history(d, GAMES, year, data.median_era_start_year || 9999) || {};
  function sparkSvg(vals) {
    if (!vals || vals.length < 2) return '';
    const W = 300, H = 56, L = 4, R = 30, x = i => L + i * (W - L - R) / (vals.length - 1), y = v => 4 + (100 - Math.max(0, Math.min(100, v))) * (H - 8) / 100;
    const last = vals.length - 1;
    return `<svg class="pf-spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Playoff odds after each week: ${vals.map(v => RaceSim.pct(v)).join(', ')}">
      <line class="mid" x1="${L}" x2="${W - R}" y1="${y(50)}" y2="${y(50)}"/><text x="${W - R + 6}" y="${y(50) + 3}">50%</text>
      <polyline class="ln" points="${vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}"/>
      <circle class="dt" cx="${x(last)}" cy="${y(vals[last])}" r="3.5"/></svg>`;
  }

  // The page's skeleton for the tab; fillNow() puts the numbers in.
  function nowHtml(p) {
    const slot = (id, title) => `<div id="${id}">${card(title, '<div class="empty-note">Loading…</div>')}</div>`;
    return `<div class="pf-cols"><div class="pf-col">${slot('pf-week', 'This week')}${slot('pf-so-far', 'Season so far')}<div id="pf-sched"></div><div id="pf-bets"></div></div>
      <div class="pf-col">${slot('pf-odds', 'Playoff odds')}<div id="pf-built"></div><div id="pf-more"></div></div></div>`;
  }
  const put = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };
  // Side bets (audit XI #20): your own profile keeps the ledger (bets.js).
  function fillBets(name) {
    if (!isMe(name) || typeof RLBets === 'undefined' || !getAuth()) return;
    RLBets.ledger().then(l => {
      if (l && shown === name && curTab() === 'now') put('pf-bets', card('Side bets', l.body, { chip: `<span class="chip">${esc(l.chip)}</span>` }));
    });
  }
  addEventListener('rl-bets', () => { if (shown) fillBets(shown); });
  async function fillNow(p) {
    const name = p.name, mine = isMe(name), year = CTX.currentYear;
    fillBets(name);
    const [d] = await Promise.all([liveP(), GAMES_P]);
    if (shown !== name || curTab() !== 'now') return;
    const team = d && d.teams.find(t => t.manager === name);

    // This week: the matchup, what needs doing (yours only), last week.
    const mu = d && (d.matchups || []).find(m => m.awayManager === name || m.homeManager === name);
    let weekHtml = '', opp = null;
    if (mu) {
      const side = mu.awayManager === name ? 'away' : 'home', other = side === 'away' ? 'home' : 'away';
      opp = mu[other + 'Manager'];
      const mp = mu[side + 'Players'] || [];
      const kicks = [...mp, ...(mu[other + 'Players'] || [])].map(x => x.game && Date.parse(x.game.date)).filter(Boolean);
      const started = (mu[side + 'Score'] || 0) + (mu[other + 'Score'] || 0) > 0;
      const s = seriesOf(name, opp);
      const ser = s.w === s.l ? `the series is tied ${s.w}-${s.l}` : `${mine ? 'you' : esc(name)} ${s.w > s.l ? 'lead' : 'trail'}${mine ? '' : 's'} the series ${s.w}-${s.l}`;
      const line = started
        ? `${fmt(mu[side + 'Score'], 2)} to ${fmt(mu[other + 'Score'], 2)} · ${Math.round(mu[side + 'WinProbability'])}% to win`
        : `${fmt(mu[side + 'Projected'], 2)} to ${fmt(mu[other + 'Projected'], 2)} projected · ${Math.round(mu[side + 'WinProbability'])}%`;
      const todo = [];
      if (mine) {
        mp.filter(x => !x.projectedPoints && (!x.game || x.game.state === 'pre')).forEach(h => todo.push(`<a class="pf-todo" href="https://fantasy.espn.com/football/team?leagueId=${ESPN_LEAGUE}&teamId=${team ? team.teamId : ''}&seasonId=${year}" target="_blank" rel="noopener"><span class="yu-ic bad">${IC.alert}</span><div><b>${esc(h.name)} ${!h.game ? 'is on bye' : h.injury === 'OUT' ? 'is out' : 'projects 0'}</b><span class="s">${esc(h.slot)} in your lineup · fix it in ESPN</span></div><span class="pf-pill">Fix</span></a>`));
        const board = await once('legs', () => getJSON(WORKER_URL + '/legs', { cache: 'no-store', headers: authHeaders() }));
        if (board && board.open && !board.locked && (board.players || []).includes(name)) {
          const leg = board.legs.find(l => l.player === name);
          const locks = new Date(board.locksAt).toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit', ...ET }).replace(',', '');
          todo.push(leg
            ? `<a class="pf-todo" href="parlay-legs.html"><span class="yu-ic">${IC.ticket}</span><div><b>Your leg is in</b><span class="s">${esc(String(leg.raw_pick || '').replace(/\s*\([+-]?\d+\)\s*$/, ''))}</span></div><span class="pf-pill">Change</span></a>`
            : `<a class="pf-todo" href="parlay-legs.html"><span class="yu-ic">${IC.ticket}</span><div><b>Parlay leg not in</b><span class="s">Locks ${esc(locks)} · ${board.legs.length} of ${board.players.length} in</span></div><span class="pf-pill solid">Enter</span></a>`);
        }
      }
      const href = mine ? 'index.html' : pageLink('head-to-head.html', { a: name, b: opp });
      weekHtml = `<a class="pf-mu" href="${esc(href)}">${avatar(opp)}<div><b>vs ${esc(opp)}${!started && kicks.length ? ` · ${esc(when(Math.min(...kicks)))}` : ''}</b><span class="s">${esc(line)} · ${ser}</span></div>${IC.chev}</a>
        ${todo.length ? `<div class="lines">${todo.join('')}</div>` : ''}`;
    }
    // Last finished week: the result, where it ranked, and its median call.
    const fin = doneGames(year).filter(g => g.p1 === name || g.p2 === name);
    const lw = fin.length ? Math.max(...fin.map(g => g.week)) : null;
    if (lw) {
      const g = fin.find(x => x.week === lw), home = g.p1 === name;
      const my = home ? g.s1 : g.s2, their = home ? g.s2 : g.s1, other = home ? g.p2 : g.p1;
      const all = doneGames(year).filter(x => x.week === lw).flatMap(x => [x.s1, x.s2]);
      const place = all.filter(v => v > my).length + 1;
      const where = place === 1 ? 'the week’s top score' : place === all.length ? 'the week’s low score' : `${fmtOrdinal(place)} of ${all.length} that week`;
      weekHtml += `<div class="pf-last">Week ${lw}: <b>${my > their ? 'beat' : 'lost to'} ${esc(other)} ${fmt(my, 2)}–${fmt(their, 2)}</b>, ${where}.</div>`;
    }
    put('pf-week', weekHtml ? card(d ? `Week ${d.week}` : 'This week', weekHtml) : '');

    // Season so far: record split, points, schedule luck, lineup calls.
    const gs = doneGames(year);
    const pf = {};
    gs.forEach(g => { pf[g.p1] = (pf[g.p1] || 0) + g.s1; pf[g.p2] = (pf[g.p2] || 0) + g.s2; });
    const pfRank = Object.keys(pf).sort((x, y) => pf[y] - pf[x]).indexOf(name) + 1;
    const mineG = gs.filter(g => g.p1 === name || g.p2 === name);
    const hw = mineG.filter(g => g.winner === name).length, hl = mineG.length - hw;
    const era = year >= (data.median_era_start_year || 9999);
    const mw = era ? mineG.filter(g => g.median != null && (g.p1 === name ? g.s1 : g.s2) > g.median).length : 0;
    const ml = era ? mineG.filter(g => g.median != null).length - mw : 0;
    const lk = mineG.length ? luckOf(name, year) : null;
    const eff = ((p.efficiency && p.efficiency.by_season) || []).find(s => s.year === year);
    let started = null;
    const lineups = await once('lineups' + year, () => getJSON(`data/lineups/${year}.json`));
    if (lineups && lineups.weeks) {
      started = 0;
      Object.entries(lineups.weeks).forEach(([wk, by]) => { if (mineG.some(g => g.week === Number(wk))) (by[name] || []).forEach(r => { if (r[2] !== 'BE' && r[2] !== 'IR') started += r[3] || 0; }); });
    }
    const left = eff && eff.pct && started != null ? started * (100 / eff.pct - 1) : null;
    const luckTone = lk && lk.luck >= 0.5 ? 'win' : lk && lk.luck <= -0.5 ? 'loss' : null;
    if (mineG.length) {
      put('pf-so-far', card('Season so far', tiles([
        ['Record', `${hw + mw}-${hl + ml}`, { tone: 'lead', sub: era ? `${hw}-${hl} matchups · ${mw}-${ml} median` : `${mineG.length} games` }],
        ['Points', fmtNum(pf[name] || 0, 0), { sub: `${fmtOrdinal(pfRank)} in the league` }],
        ['Schedule luck', lk ? `${lk.luck > 0.05 ? '+' : lk.luck < -0.05 ? '−' : ''}${Math.abs(lk.luck).toFixed(1)}` : '—', { tone: luckTone, sub: lk ? `Wins vs an average schedule. ${lk.best.w}-${lk.games - lk.best.w} with ${esc(lk.best.with.filter(x => x !== name)[0] || name)}’s, ${lk.worst.w}-${lk.games - lk.worst.w} with ${esc(lk.worst.with.filter(x => x !== name)[0] || name)}’s.` : '' }],
        ['Lineup calls', eff ? `${fmt(eff.pct, 1)}%` : '—', { sub: left != null ? `${fmt(left, 1)} pts left on the bench` : 'Of the best lineup’s points' }],
      ], 2), { chip: team ? chip(`${fmtOrdinal(team.standing)} of ${d.teams.length}`, 'gold') : '' }));
    } else put('pf-so-far', '');

    // The rest of the schedule: their record, then the series all-time.
    if (team && team.ahead && team.ahead.length) {
      const rec2 = m => { const t = d.teams.find(x => x.manager === m); return t ? t.record : ''; };
      const cells = team.ahead.map((o, i) => {
        const s = seriesOf(name, o), cls = s.w > s.l ? 'up' : s.w < s.l ? 'dn' : 'even';
        return `<a class="pf-wk${i === 0 ? ' now' : ''}" href="${esc(pageLink('head-to-head.html', { a: name, b: o }))}"><div class="w">WK ${d.week + i}</div><div class="o">${esc(o)}</div><div class="r">${esc(rec2(o))}</div><div class="v ${cls}">${s.w}-${s.l}</div></a>`;
      }).join('');
      put('pf-sched', card('The rest of the schedule', `<div class="pf-sched" style="--n:${team.ahead.length}">${cells}</div>`, { note: `Their record, then ${mine ? 'yours' : esc(name) + '’s'} against them all-time.` }));
    }

    // Playoff odds: now, week by week, and the record it takes (audit X #5).
    if (team && typeof team.playoffPct === 'number') {
      const inp = RaceSim.inputs(d);
      let body = '';
      if (team.clinch) body = `<div class="pf-odds"><span class="v">${team.clinch === 'e' ? 'Out' : 'In'}</span><span class="s">${esc(RaceSim.MARKS[team.clinch])}.</span></div>`;
      else {
        const res = inp && inp.sched.length ? RaceSim.simulate(inp, RaceSim.RUNS, null, true)[name] : null;
        const worth = res && res.ifWin != null && res.ifLoss != null && opp ? `<b>${RaceSim.pct(res.ifWin)}</b> with a win over ${esc(opp)}, <b>${RaceSim.pct(res.ifLoss)}</b> with a loss.` : '';
        body = `<div class="pf-odds"><span class="v">${RaceSim.pct(team.playoffPct)}</span><span class="s">to make the playoffs.<br>${worth}</span></div>`;
        // The record it takes: centred on the first one that's better than
        // even, one either side, each with the wins it needs from here.
        if (res && res.fw) {
          const fw = res.fw, total = inp.reg * 2, have = inp.base[name].w, had = inp.base[name].l;
          const ks = Object.keys(fw).map(Number).filter(k => fw[k][0] >= RaceSim.RUNS * 0.005).sort((x, y) => x - y);
          const k50 = ks.find(k => fw[k][1] / fw[k][0] >= 0.5);
          const pick = k50 == null ? [] : [k50 - 1, k50, k50 + 1].filter(k => fw[k]);
          if (pick.length) body += tiles(pick.map(k => {
            const v = fw[k][1] * 100 / fw[k][0];
            return [`At ${k}-${total - k}`, RaceSim.pct(v), { tone: v >= 90 ? 'win' : v <= 10 ? 'loss' : k === k50 ? 'lead' : null, sub: `${k - have}-${total - k - had} from here` }];
          }), pick.length);
        }
      }
      put('pf-odds', card('Playoff odds', body + '<div id="pf-path"></div>', { chip: `<a class="chip" href="standings.html?tab=race" style="text-decoration:none">Race ›</a>` }));
      // The week-by-week line costs a few small sims: after paint.
      setTimeout(() => {
        if (shown !== name || curTab() !== 'now') return;
        const path = oddsPath(year, d)[name];
        if (path && path.length > 1) put('pf-path', `${sparkSvg(path)}<div class="pf-last">After each week since the draft. ${path.length > 2 ? `High ${RaceSim.pct(Math.max(...path))}, low ${RaceSim.pct(Math.min(...path))}.` : ''}</div>`);
      }, 60);
    } else put('pf-odds', '');

    // How the roster was built: starter points from the draft, the wire and
    // trades, and the three players carrying it.
    Promise.all([once('board', () => getJSON('data/draft-board.json')), once('moves', () => getJSON('data/moves.json'))]).then(([db, mv]) => {
      if (shown !== name || curTab() !== 'now' || !lineups || !lineups.weeks) return;
      const yb = db && db.boards && db.boards[String(year)];
      if (!yb) return;
      const col = Object.fromEntries(yb.columns.map(c => [String(c.slot), c.manager]));
      const drafted = new Set();
      Object.values(yb.grid).forEach(rd => Object.entries(rd).forEach(([slot, x]) => { if (x && x.player_name && col[slot] === name) drafted.add(x.player_name); }));
      const traded = new Set();
      ((mv && mv.trades) || []).filter(t => t.year === year && t.sides && t.sides[name]).forEach(t => t.sides[name].players.forEach(x => traded.add(String(x.id))));
      const by = { draft: 0, wire: 0, trade: 0 }, per = {};
      Object.entries(lineups.weeks).forEach(([wk, w]) => (w[name] || []).forEach(r => {
        if (r[2] === 'BE' || r[2] === 'IR' || !mineG.some(g => g.week === Number(wk))) return;
        const k = drafted.has(r[0]) ? 'draft' : traded.has(String(r[6])) ? 'trade' : 'wire';
        by[k] += r[3] || 0; per[r[0]] = (per[r[0]] || 0) + (r[3] || 0);
        per[r[0] + '\u0000k'] = k;
      }));
      const tot = by.draft + by.wire + by.trade;
      if (!tot) return;
      const top = Object.keys(per).filter(k => !k.includes('\u0000')).sort((x, y) => per[y] - per[x]);
      const bestWire = top.find(n => per[n + '\u0000k'] === 'wire');
      const pctOf = v => `${Math.round(v * 100 / tot)}%`;
      put('pf-built', card('How the team was built', tiles([
        ['Drafted', pctOf(by.draft), { tone: 'lead', sub: 'of starter points' }],
        ['Picked up', pctOf(by.wire), { sub: bestWire ? `${esc(bestWire)} ${fmt(per[bestWire], 1)}` : 'None started' }],
        ...(by.trade ? [['Traded for', pctOf(by.trade), { sub: 'of starter points' }]] : []),
      ], by.trade ? 3 : 2) + `<div class="pf-carry">Carried by ${top.slice(0, 3).map(n => `<b>${esc(n)}</b> ${pctOf(per[n])}`).join(', ')}.</div>`));
    });

    // Where else to look: the roster tools and the next matchup's history.
    const more = [
      [pageLink('roster.html', { m: name }), mine ? 'Your roster' : `${esc(name)}’s roster`, 'Byes ahead, free agents, position ranks'],
      opp ? [pageLink('head-to-head.html', { a: name, b: opp }), `${mine ? 'You' : esc(name)} vs ${esc(opp)}`, 'Every game, all-time'] : null,
    ].filter(Boolean);
    put('pf-more', card('', `<div class="lines">${more.map(([h, t, s]) => `<a class="pf-go" href="${esc(h)}"><span class="t">${t}<small>${s}</small></span>${IC.chev}</a>`).join('')}</div>`));
    riseIn(document.querySelectorAll('#tab-content .stat-card'));
  }

  // ---------- Settings (your own profile only) ----------
  // The You sheet's panels, drawn on the page (nav.js rlYou.mount).
  const settingsHtml = () => `<div class="pf-cols"><div class="pf-col">${card('Notifications', '<div id="pf-push"></div>', { cls: 'pf-set' })}</div><div class="pf-col">${card('Settings', '<div id="pf-settings"></div>', { cls: 'pf-set' })}${card('Account', '<div id="pf-you"></div>', { cls: 'pf-set' })}</div></div>`;
  function fillSettings() { ['push', 'settings', 'you'].forEach(k => { const el = document.getElementById('pf-' + k); if (el) rlYou.mount(el, k); }); }

  // ---------- Tabs ----------
  // Audit X #10 regrouped Franchise's seven tabs: This season is new, Career
  // is Seasons + Results, Scoring is Weekly + Scoring, Trophies is Badges +
  // Money, and your own profile adds Settings.
  const TAB_DEFS = {
    now: { label: () => String(CTX.currentYear), render: p => nowHtml(p), after: p => fillNow(p) },
    career: { label: 'Career', render: p => renderHistory(p) + `<div class="pair">${renderStreaks(p)}${hasMedian(p) ? renderMedian(p) : ''}</div><div class="pair">${renderRegular(p)}${renderPlayoffs(p)}</div>` },
    scoring: { label: 'Scoring', render: p => renderWeekly(p) + renderScoring(p) },
    rivals: { label: 'Rivals', render: p => renderRivalries(p) },
    trophies: { label: 'Trophies', render: p => renderAchievements(p, CTX) + renderMoney(p) },
    settings: { label: 'Settings', render: () => settingsHtml(), after: () => fillSettings() },
  };
  // Old tab ids, from saved picks and links shared before each regroup.
  const OLD_TABS = { history: 'career', seasons: 'career', results: 'career', record: 'career', weekly: 'scoring', lineups: 'scoring', money: 'trophies', badges: 'trophies', achievements: 'trophies', you: 'settings' };
  const tabsFor = p => [
    ...(isActivePlayer(p, CTX.currentYear) ? ['now'] : []), 'career', 'scoring', 'rivals', 'trophies',
    ...(isMe(p.name) ? ['settings'] : []),
  ];

  // WEEKLY: weeklyFinishes() over GAMES once league.json is in; undefined
  // while it loads, null if it failed.
  // DRAFTV: data/draft-value.json's years, the same way.
  let data = null, CTX = null, GAMES = [], WEEKLY, DRAFTV;
  const normTab = id => { const k = String(id ?? '').toLowerCase(); return OLD_TABS[k] || k; };
  // The URL's tab (?tab=scoring, from a shared link) wins; otherwise a
  // profile opens on this season.
  let want = normTab(urlParam('tab')) || null;
  let shown = null, cur = null;
  const curTab = () => cur;
  window.rlProfileIsMe = () => !!shown && isMe(shown);
  // morph: a manager change, which on Career glides the Career Arc
  // across rather than redrawing it.
  function show(name, morph) {
    const p = data.players.find(x => x.name === name);
    if (!p) return;
    hideLogoPop();
    shown = p.name;
    document.getElementById('pf-name').textContent = p.name;
    document.querySelector('h1.pf-title').dataset.fold = p.name; // the folding bar, not the picker's options
    document.body.classList.toggle('me-page', isMe(p.name));
    document.title = `Retirement League — ${p.name}`;
    const list = tabsFor(p);
    cur = list.includes(want) ? want : list[0];
    // The full hero on the first tab only (audit XI #5).
    document.getElementById('hero-container').innerHTML = heroHtml(p);
    const tabsEl = document.getElementById('tabs');
    tabsEl.innerHTML = list.map(id => { const l = TAB_DEFS[id].label; return `<button class="tab ${id === cur ? 'on' : ''}" data-tab="${id}">${typeof l === 'function' ? l() : l}</button>`; }).join('');
    const before = morph && !reduceMotion && cur === 'career' ? arcSnapshot() : null;
    document.getElementById('tab-content').innerHTML = TAB_DEFS[cur].render(p);
    if (before) morphArc(before);
    if (TAB_DEFS[cur].after) TAB_DEFS[cur].after(p);
    keepSelectedInView(tabsEl);
    // Whatever is on screen is both the saved pick and the link to share.
    try { localStorage.setItem('franchise-selected', p.name); } catch (e) {}
    setUrlParams({ m: p.name, tab: cur === list[0] ? null : cur });
    if (window.rlHeaderPlace) rlHeaderPlace();
  }
  // The tab row pins under the title (audit XI #5): the nav bar's height to
  // sit under it on a desktop, and .stuck while pinned, as Standings' band.
  function watchBand() {
    const el = document.getElementById('pf-band');
    if (!el) return;
    const bar = document.querySelector('.nav-bar');
    if (bar) document.documentElement.style.setProperty('--nav-h', bar.offsetHeight + 'px');
    const top = parseFloat(getComputedStyle(el).top) || 0;
    el.classList.toggle('stuck', window.scrollY > 0 && el.getBoundingClientRect().top <= top + 1);
  }
  addEventListener('scroll', () => requestAnimationFrame(watchBand), { passive: true });
  addEventListener('resize', () => requestAnimationFrame(watchBand));
  // Your monogram on your own profile: its Settings tab (nav.js youTap).
  addEventListener('rl-you-tap', () => {
    if (!shown || !isMe(shown)) return;
    want = 'settings'; show(shown);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  // Picking your team (or another) redraws the profile: Settings comes and goes.
  addEventListener('rl-me', () => { if (data && shown) show(shown); });

  document.addEventListener('click', e => {
    const t = e.target.closest('.tab[data-tab]');
    if (t) {
      const band = document.getElementById('pf-band');
      const pinned = band.classList.contains('stuck');
      want = t.dataset.tab;
      show(document.getElementById('franchise-select').value);
      // Pinned: the new tab starts right under the tab row (audit XI #5).
      if (pinned) {
        const top = parseFloat(getComputedStyle(band).top) || 0;
        window.scrollTo({ top: document.getElementById('tab-content').getBoundingClientRect().top + window.scrollY - top - band.offsetHeight, behavior: 'instant' });
        watchBand();
      }
      return;
    }
    const sr = e.target.closest('.season[data-sched]');
    if (sr) {
      const box = sr.nextElementSibling;
      const on = !sr.classList.contains('open');
      sr.classList.toggle('open', on);
      sr.setAttribute('aria-expanded', on);
      box.classList.toggle('on', on);
      if (on && !box.dataset.filled) {
        const inner = box.firstElementChild;
        inner.innerHTML = '<div class="sg"><div class="sg-note">Loading the schedule…</div></div>';
        GAMES_P.then(() => {
          if (WEEKLY === null) { inner.innerHTML = '<div class="sg"><div class="sg-note">Could not load the schedule.</div></div>'; return; }
          inner.innerHTML = scheduleHtml(sr.dataset.m, Number(sr.dataset.sched), !!box.dataset.done);
          box.dataset.filled = '1';
        });
      }
      return;
    }
    const arcBtn = e.target.closest('[data-arc]');
    if (arcBtn) {
      arcView = arcBtn.dataset.arc;
      try { localStorage.setItem('franchise-arc-view', arcView); } catch (err) {}
      document.querySelectorAll('.arc-views').forEach(v => { v.dataset.view = arcView; });
      document.querySelectorAll('[data-arc]').forEach(b => b.classList.toggle('on', b.dataset.arc === arcView));
      return;
    }
    const logoTile = e.target.closest('.aka-logo-tile');
    if (logoTile) {
      // A mouse already opened it on hover; a tap toggles it.
      if (logoTile === popTile && !matchMedia('(hover: hover)').matches) hideLogoPop(); else showLogoPop(logoTile);
      return;
    }
    hideLogoPop();
    const ach = e.target.closest('.ach.flippable');
    if (ach) ach.classList.toggle('flipped');
  });

  // The Weekly tab's games. Only that tab waits for them; when they land
  // after the first render, it's redrawn if it's the one showing.
  const GAMES_P = rlData('league').then(d => {
    GAMES = d.games.map(g => ({ year: g[0], week: g[1], type: g[2], p1: g[3], p2: g[4], s1: g[5], s2: g[6], winner: g[7], median: g[9] }));
    WEEKLY = weeklyFinishes(GAMES);
  }).catch(err => { console.error(err); WEEKLY = null; });
  GAMES_P.then(() => {
    const p = data && data.players.find(x => x.name === document.getElementById('franchise-select').value);
    if (p && cur === 'scoring') document.getElementById('tab-content').innerHTML = renderWeekly(p) + renderScoring(p);
  });

  // Secret Santa's Shirty winners, every year (worker/src/santa.js, GET /santa/hof).
  // A win shows in the hero's badge row; the hero redraws if they land after it.
  let SHIRTYS = {};
  fetch('https://retirement-league-refresh-proxy.bradbutcher321.workers.dev/santa/hof').then(r => r.json()).then(h => {
    const by = {};
    for (const [year, y] of Object.entries(h.years || {})) for (const [key, res] of Object.entries(y.shirtys || {})) for (const w of res.winners || []) (by[w.manager] = by[w.manager] || []).push({ year: +year, label: (h.labels || {})[key] || res.label || key });
    Object.values(by).forEach(list => list.sort((a, b) => b.year - a.year));
    SHIRTYS = by;
    const p = data && data.players.find(x => x.name === document.getElementById('franchise-select').value);
    if (p && SHIRTYS[p.name]) document.getElementById('hero-container').innerHTML = heroHtml(p);
  }).catch(() => {});

  fetch('data/draft-value.json', { cache: 'no-cache' }).then(r => r.json()).then(d => { DRAFTV = d.years || {}; })
    .catch(err => { console.error(err); DRAFTV = null; }).then(() => {
      const p = data && data.players.find(x => x.name === document.getElementById('franchise-select').value);
      if (p && cur === 'trophies') document.getElementById('tab-content').innerHTML = renderAchievements(p, CTX) + renderMoney(p);
    });

  rlData('franchise').then(d => {
    data = d;
    const currentYear = leagueCurrentYear(d.players);
    CTX = {
      currentYear,
      foundingYear: Math.min(...d.players.map(x => x.founded_year).filter(y => y != null)),
    };
    setPageStatus(throughLabel(d.generated_at));
    const sel = document.getElementById('franchise-select');
    sel.innerHTML = d.players.map(p => `<option value="${esc(p.name)}">${esc(p.name)}</option>`).join('');
    const names = d.players.map(p => p.name);
    const saved = (() => { try { return localStorage.getItem('franchise-selected'); } catch (e) { return null; } })();
    // A link (?m=) first, then you (site audit II #36), then the last one looked at.
    sel.value = matchName(names, urlParam('m')) || matchName(names, getMe()) || (names.includes(saved) ? saved : names[0]);
    show(sel.value);
    riseIn([...document.getElementById('hero-container').children, ...document.getElementById('tab-content').children]);
    sel.addEventListener('change', () => {
      show(sel.value, true);
    });
    // This season's chips in the hero, once the Worker answers.
    liveP().then(d => { if (d && shown) document.getElementById('hero-container').innerHTML = heroHtml(data.players.find(x => x.name === shown)); });
  }).catch(err => {
    console.error(err);
    document.getElementById('hero-container').innerHTML = '<div class="loading-row" style="color:var(--loss);">Error loading franchise data.</div>';
    document.getElementById('tab-content').innerHTML = '';
  });
</script>
