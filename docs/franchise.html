<!-- The two font-family's woff2 files Google serves for the latin subset
     at the weights this site uses -- one variable-font file per family
     covers every weight declared, confirmed directly by fetching the
     stylesheet below and comparing each @font-face block's url(). Starts
     the actual font downloads immediately, in parallel with that
     stylesheet fetch, instead of waiting to discover these same URLs
     only after the stylesheet loads and is parsed -- avoids the
     fallback-to-webfont swap (FOUT) that otherwise shows on a slow or
     uncached load. If Google ever changes these hashed URLs, this just
     degrades to a wasted (unused) preload, not a correctness issue -- the
     stylesheet's own @font-face still fetches whatever the new URL is. -->
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/bigshouldersdisplay/v24/fC1_PZJEZG-e9gHhdI4-NBbfd2ys3SjJCx1czNDu.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="nav.css?v=5">
<style>
  /* Selector and stat-card styling live in theme.css -- only this page's own
     spacing and variants here. */
  .selector-row{ margin-bottom: 16px; }


  .hero-pills{ display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .aka{ background: var(--item); border: 1px solid var(--item-line); color: var(--text-dim); font-size: 0.74rem; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .rank-badge{ background: rgba(212,180,106,0.14); border: 1px solid var(--gold); color: var(--gold); font-size: 0.74rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .rank-badge.bad{ background: rgba(214,98,79,0.14); border-color: var(--loss); color: var(--loss); }

  /* ---------- Team logos -- current team gets one next to its headline
     name, past teams get the framed hover-tile list below (a polaroid grid
     was tried alongside it and dropped; the scratch page the two were
     prototyped on is long gone). logo_url comes straight from ESPN, which never validates or
     hosts it, so a good chunk of historical ones are genuinely dead
     links. Every <img> below has an onerror fallback to a colored
     initials avatar for that case, not just the ones that happen to
     still load. ---------- */
  .logo-ph{ display: none; align-items: center; justify-content: center; font-family: var(--scoreboard); font-weight: 800; color: #fff; }
  .current-logo-tile{ position: relative; display: inline-flex; }
  .current-logo-avatar{ position: relative; width: 56px; height: 56px; border-radius: 50%; overflow: hidden; flex-shrink: 0; border: 2px solid var(--gold); box-shadow: 0 0 14px rgba(212,180,106,0.35); }
  .current-logo-avatar img{ width: 100%; height: 100%; object-fit: cover; display: block; }
  .current-logo-preview{
    position: absolute; top: calc(100% + 8px); left: 0;
    width: 140px; height: 140px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line);
    box-shadow: 0 14px 30px rgba(0,0,0,0.55); opacity: 0; pointer-events: none; transition: opacity 0.15s; z-index: 6;
  }
  .current-logo-preview img{ width: 100%; height: 100%; object-fit: cover; display: block; }
  .current-logo-tile:hover .current-logo-preview, .current-logo-tile:focus .current-logo-preview{ opacity: 1; }
  .past-logos-label{ position: relative; color: var(--text-dim); font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.06em; margin: 18px 0 8px; }

  .aka-logo-tile{ position: relative; display: inline-flex; align-items: center; gap: 7px; background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px 4px 4px; cursor: default; }
  .aka-logo-avatar{ position: relative; width: 22px; height: 22px; border-radius: 50%; overflow: hidden; flex-shrink: 0; }
  .aka-logo-avatar img{ width: 100%; height: 100%; object-fit: cover; display: block; }
  .aka-logo-text{ font-size: 0.74rem; color: var(--text-dim); }
  .aka-logo-text .yr{ opacity: 0.6; }
  .aka-logo-preview{
    position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
    width: 120px; height: 120px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line);
    box-shadow: 0 14px 30px rgba(0,0,0,0.55); opacity: 0; pointer-events: none; transition: opacity 0.15s; z-index: 6;
  }
  .aka-logo-preview img{ width: 100%; height: 100%; object-fit: cover; display: block; }
  .aka-logo-tile:hover .aka-logo-preview, .aka-logo-tile:focus .aka-logo-preview{ opacity: 1; }

  /* ---------- Letting the previews out of the card ----------
     Absolutely-positioned previews are clipped by every ancestor that hides
     its overflow, and there are three: .hero2-main (the glow), .hero2 and
     .glass (the card's rounded corners). Un-hiding all of them would let the
     glow bleed and square off the card, so instead the previews switch to
     position: fixed, which no ancestor's overflow can clip, and CSS anchor
     positioning pins them back to their own tile. Past-team previews sit
     centered above their chip; the current logo's sits below it, since it's
     near the top of the card. position-try-fallbacks flips either one to the
     other side when the viewport has no room.

     Each element's position-anchor is set inline where it's rendered, since
     the names have to be unique per tile. Browsers without anchor support
     skip this block and keep the absolute version. */
  @supports (anchor-name: --x){
    .current-logo-tile{ anchor-name: --logo-current; }
    .current-logo-preview, .aka-logo-preview{
      position: fixed;
      inset: auto;
      transform: none;
      justify-self: anchor-center;
      position-try-fallbacks: flip-block;
      z-index: 50;
    }
    .current-logo-preview{ top: anchor(bottom); margin-top: 8px; }
    .aka-logo-preview{ bottom: anchor(top); margin-bottom: 8px; }
  }

  /* ---------- Hero ----------
     Its own card rather than the shared .hero2: no gold glow behind the
     name (the logo is the colour here), and not clipped, so the logo
     previews can hang outside it. Phone: identity on top, a five-stat
     strip underneath. Desktop: the strip turns into a column on the right. */
  .fhero{ background:linear-gradient(165deg, var(--surface-2), var(--surface)); border:1px solid var(--line); border-radius:14px; display:grid; grid-template-columns:minmax(0,1fr); }
  .fhero-main{ padding:18px 18px 16px; min-width:0; }
  .fhero-id{ display:flex; align-items:center; gap:14px; }
  .fhero-name{ font-family:var(--scoreboard); font-weight:800; font-size:clamp(1.9rem, 8vw, 2.6rem); line-height:0.95; overflow-wrap:anywhere; }
  .fhero-sub{ color:var(--text-dim); font-size:0.8rem; margin-top:5px; }
  /* No dividers between stats. Cells hug their content and the leftover
     width is shared evenly between them, so the visible gaps between
     numbers come out equal ("3" doesn't sit in a cell as wide as "76-100"). */
  .fhero-stats{ display:flex; justify-content:space-between; gap:8px; padding:0 20px; border-top:1px solid var(--line); background:rgba(0,0,0,0.22); border-radius:0 0 14px 14px; }
  .fs{ padding:13px 0 12px; text-align:center; min-width:0; }
  /* Each stat hugs its widest word, so a two-word label like "Weekly
     Sackos" always wraps rather than only on narrower phones -- the strip
     keeps one shape and even gaps at every width. */
  .fs{ width:min-content; }
  .fs-v{ justify-self:center; }
  .fs-v{ font-family:var(--scoreboard); font-weight:800; font-size:clamp(1.05rem, 5vw, 1.4rem); color:var(--gold); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .fs-l{ color:var(--text-dim); font-size:0.56rem; text-transform:uppercase; letter-spacing:0.05em; margin-top:2px; line-height:1.25; }
  @media (min-width:721px){
    .fhero{ grid-template-columns:minmax(0,1fr) auto; }
    .fhero-main{ padding:26px 28px 24px; }
    .fhero-stats{ display:flex; flex-direction:column; justify-content:center; gap:14px; border-top:none; border-left:1px solid var(--line); border-radius:0 14px 14px 0; padding:22px 26px; }
    .fs{ display:flex; justify-content:space-between; align-items:center; gap:28px; padding:0; text-align:left; width:auto; }
    .fs-v{ order:2; font-size:1.2rem; }
    .fs-l{ order:1; font-size:0.76rem; text-transform:none; letter-spacing:0; margin:0; }
  }

  /* ---------- Panels ----------
     Every section is one panel: white title top-left, an optional status
     chip top-right, then its content -- the same composition the
     dashboard's cards settled on. */
  .fr-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:14px 16px 0; }
  .fr-title{ font-weight:700; font-size:0.95rem; }
  .fr-note{ color:var(--text-dim); font-size:0.74rem; line-height:1.45; padding:3px 16px 0; }
  .fr-body{ padding:12px 12px 12px; }
  .fr-body > * + *{ margin-top:8px; }
  .chip{ font-size:0.68rem; font-weight:700; letter-spacing:0.03em; padding:3px 9px; border-radius:999px; border:1px solid var(--line); color:var(--text-dim); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .chip.gold{ color:var(--gold); border-color:var(--lead-line); background:var(--lead-tint); }
  .chip.win{ color:var(--turf); border-color:var(--win-line); background:var(--win-tint); }
  .chip.loss{ color:var(--loss); border-color:var(--loss-line); background:var(--loss-tint); }

  /* Page rhythm: one gap size between every panel, both directions. */
  #tab-content{ display:grid; gap:12px; }
  .pair{ display:grid; grid-template-columns:1fr; gap:12px; align-items:start; }
  @media (min-width:721px){ .pair{ grid-template-columns:1fr 1fr; } }
  .stat-card{ overflow:hidden; }

  /* Tabs scroll sideways on a phone via theme.css's shared .scroll. */
  section.fr-hero{ margin-bottom:14px; }

  /* ---------- Tiles: a label, one number, an optional sub-line ---------- */
  .tiles{ display:grid; grid-template-columns:repeat(var(--n,3), minmax(0,1fr)); gap:8px; }
  .tile{ background:var(--item); border:1px solid var(--item-line); border-radius:10px; padding:10px 6px 9px; text-align:center; min-width:0; }
  .tile-l{ color:var(--text-dim); font-size:0.6rem; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile-v{ font-family:var(--scoreboard); font-weight:800; font-size:1.5rem; line-height:1.15; margin-top:3px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .tile-s{ color:var(--text-dim); font-size:0.66rem; line-height:1.35; margin-top:2px; }
  .tile-s span{ display:block; }
  .tile.is-lead{ border-color:var(--lead-line); background:var(--lead-tint); }
  .tile.is-win{ border-color:var(--win-line); background:var(--win-tint); }
  .tile.is-loss{ border-color:var(--loss-line); background:var(--loss-tint); }
  :root[data-accent="outline"] .tile.is-lead, :root[data-accent="outline"] .tile.is-win, :root[data-accent="outline"] .tile.is-loss{ background:var(--item); }
  .tile.is-lead .tile-v{ color:var(--gold); }
  .tile.is-win .tile-v{ color:var(--turf); }
  .tile.is-loss .tile-v{ color:var(--loss); }
  @media (max-width:420px){ .tile-v{ font-size:1.3rem; } }

  /* ---------- Lines: label left, figures right, one box, hairlines between ----------
     Replaces a stack of separately boxed 58px rows, which put a full row
     of air between every stat. */
  .lines{ background:var(--item); border:1px solid var(--item-line); border-radius:10px; }
  .line{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:9px 12px; min-height:48px; }
  .line + .line{ border-top:1px solid var(--line); }
  .line-l{ min-width:0; }
  .line-name{ font-weight:600; font-size:0.86rem; }
  .line-sub{ color:var(--text-dim); font-size:0.7rem; margin-top:1px; line-height:1.35; }
  .line-vals{ display:flex; gap:16px; flex:none; }
  .lv{ text-align:center; min-width:40px; }
  .lv b{ display:block; font-family:var(--scoreboard); font-weight:700; font-size:1.1rem; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .lv span{ display:block; color:var(--text-dim); font-size:0.56rem; letter-spacing:0.05em; text-transform:uppercase; white-space:nowrap; }
  .lv b.win{ color:var(--turf); } .lv b.loss{ color:var(--loss); } .lv b.gold{ color:var(--gold); }

  /* ---------- Dot chart (finish by year, efficiency by year) ----------
     x positions are percentages so the chart fills any width without
     scaling its text; the y labels live in an HTML column beside it. */
  .chart{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:6px; }
  .chart-y{ position:relative; width:30px; }
  .chart-y span{ position:absolute; right:0; transform:translateY(-50%); color:var(--text-dim); font-size:0.6rem; white-space:nowrap; }
  .chart svg{ display:block; width:100%; overflow:visible; }
  .chart .grid{ stroke:rgba(255,255,255,0.06); stroke-width:1; }
  .chart .link{ stroke:rgba(255,255,255,0.18); stroke-width:1.5; }
  .chart .x{ fill:var(--text-dim); font-size:10px; font-family:var(--body); }
  .chart .v{ fill:var(--text); font-size:10px; font-weight:700; font-family:var(--body); }
  /* The transition only shows during the Career Arc morph, when a dot
     keeps its old class for one frame before taking the new one. */
  .dot{ stroke-width:2; transition:fill .35s, stroke .35s; }
  @media (prefers-reduced-motion: reduce){ .dot{ transition:none; } }
  .dot.champion{ fill:var(--gold); stroke:var(--gold); }
  .dot.runner-up{ fill:var(--surface); stroke:var(--gold); }
  .dot.playoffs{ fill:var(--turf); stroke:var(--turf); }
  .dot.missed{ fill:var(--loss); stroke:var(--loss); }
  .dot.progress{ fill:var(--surface); stroke:var(--text-dim); stroke-dasharray:2 2; }
  .dot.plain{ fill:var(--gold); stroke:var(--gold); }
  .legend{ display:flex; flex-wrap:wrap; gap:6px 14px; color:var(--text-dim); font-size:0.68rem; padding:2px 2px 0; }
  .legend i{ display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:-1px; border:2px solid; }
  .legend .lg-champion{ background:var(--gold); border-color:var(--gold); }
  .legend .lg-runner-up{ border-color:var(--gold); }
  .legend .lg-playoffs{ background:var(--turf); border-color:var(--turf); }
  .legend .lg-missed{ background:var(--loss); border-color:var(--loss); }
  .legend .lg-progress{ border-color:var(--text-dim); border-style:dashed; }

  /* ---------- Career Arc: graph / grid ----------
     The toggle is the shared segmented control, sized down to sit in the
     panel's title row where a chip would go. */
  .arc-seg{ --ctl-h:26px; --ctl-r:13px; --track-pad:3px; }
  .arc-seg button{ padding:0 12px; font-size:0.74rem; }
  .arc-views[data-view="graph"] .arc-grid,
  .arc-views[data-view="grid"] .arc-graph{ display:none; }
  .arc-views > .legend{ margin-top:8px; }
  /* One row of narrow fixed-width tiles, every season side by side. On a
     phone the row is wider than the card, so it scrolls sideways. */
  .arc-grid{ display:flex; gap:6px; padding:4px 0 4px; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  .arc-grid::-webkit-scrollbar{ display:none; }
  .arc-tile{ flex:none; width:60px; background:var(--item); border:1px solid var(--item-line); border-radius:8px; text-align:center; padding:9px 2px 8px; }
  .arc-year{ color:var(--text-dim); font-size:0.62rem; font-weight:600; letter-spacing:0.04em; }
  .arc-standing{ font-family:var(--scoreboard); font-weight:800; font-size:1.25rem; line-height:1.15; margin:2px 0 1px; }
  .arc-rec{ color:var(--text-dim); font-size:0.62rem; font-variant-numeric:tabular-nums; }
  /* Champion gets the full gold ring, runner-up the softer gold line, so
     the two read apart the same way the graph's solid/hollow dots do. */
  .arc-tile.champion{ border-color:var(--gold); background:var(--lead-tint); }
  .arc-tile.runner-up{ border-color:var(--lead-line); }
  .arc-tile.playoffs{ border-color:var(--win-line); background:var(--win-tint); }
  .arc-tile.missed{ border-color:var(--loss-line); background:var(--loss-tint); }
  .arc-tile.progress{ border-style:dashed; }
  :root[data-accent="outline"] .arc-tile{ background:var(--item); }
  .arc-tile.champion .arc-standing, .arc-tile.runner-up .arc-standing{ color:var(--gold); }
  .arc-tile.playoffs .arc-standing{ color:var(--turf); }
  .arc-tile.missed .arc-standing{ color:var(--loss); }
  .arc-tile.progress .arc-standing{ color:var(--text-dim); }

  /* ---------- Season list ---------- */
  .season{ display:grid; grid-template-columns:40px minmax(0,1fr) auto; align-items:center; gap:10px; padding:9px 12px; background:var(--item); border:1px solid var(--item-line); border-radius:10px; }
  .fr-body > .season + .season{ margin-top:6px; }
  .season-yr{ font-family:var(--scoreboard); font-weight:700; font-size:1.05rem; color:var(--text-dim); }
  .season-nm{ font-weight:600; font-size:0.86rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .season-sub{ color:var(--text-dim); font-size:0.7rem; margin-top:1px; }
  .season-fin{ text-align:right; }
  /* The outcome is the headline, the placement is its caption. */
  /* Body font, not the scoreboard face -- that one is for numbers. */
  .season-fin b{ display:block; font-weight:700; font-size:0.86rem; line-height:1.2; white-space:nowrap; }
  .season-fin span{ display:block; color:var(--text-dim); font-size:0.62rem; letter-spacing:0.05em; text-transform:uppercase; white-space:nowrap; margin-top:1px; }
  /* Title years are tinted gold, Sacko years red -- the two seasons that
     define a career. Everything else stays a plain row. */
  .season.champion{ border-color:var(--lead-line); background:var(--lead-tint); }
  .season.sacko{ border-color:var(--loss-line); background:var(--loss-tint); }
  :root[data-accent="outline"] .season.champion, :root[data-accent="outline"] .season.sacko{ background:var(--item); }
  .season.champion .season-fin b, .season.runner-up .season-fin b{ color:var(--gold); }
  .season.playoffs .season-fin b{ color:var(--turf); }
  .season.missed .season-fin b, .season.sacko .season-fin b{ color:var(--loss); }
  .season.progress{ border-style:dashed; }
  .season.progress .season-fin b{ color:var(--text-dim); }

  /* ---------- Rivalries ----------
     The two callouts sit side by side even on a phone -- each is just a
     name and a record. Nemesis/favorite IS a state, so each takes the
     shared outline + tint. */
  .rivals{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .rival{ border-radius:10px; padding:12px 8px 11px; text-align:center; border:1px solid; min-width:0; }
  .rival.nemesis{ border-color:var(--loss-line); background:var(--loss-tint); }
  .rival.favorite{ border-color:var(--win-line); background:var(--win-tint); }
  .rival-l{ font-size:0.62rem; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; }
  .rival.nemesis .rival-l{ color:var(--loss); }
  .rival.favorite .rival-l{ color:var(--turf); }
  .rival-nm{ font-family:var(--scoreboard); font-weight:800; font-size:1.6rem; line-height:1.1; margin-top:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rival-rec{ color:var(--text-dim); font-size:0.76rem; margin-top:2px; font-variant-numeric:tabular-nums; }
  .rival .empty-note{ padding:10px 4px; }

  /* Head to head ledger: one row per opponent, best record to worst. The
     initials circle carries the winning/even/losing colour so the record
     itself can stay plain. Each row opens the Head to Head page with this
     matchup already picked. Two columns on desktop. */
  .ledger{ display:grid; grid-template-columns:1fr; }
  @media (min-width:721px){ .ledger{ grid-template-columns:1fr 1fr; column-gap:24px; } }
  .lrow{ display:grid; grid-template-columns:36px minmax(0,1fr) auto; gap:12px; align-items:center; padding:9px 6px; border-top:1px solid var(--line); color:inherit; text-decoration:none; transition:background 0.12s; }
  .lrow:first-child{ border-top:none; }
  @media (min-width:721px){ .lrow:nth-child(2){ border-top:none; } }
  .lrow:hover{ background:var(--item-hover); }
  .lrow:focus-visible{ outline:2px solid var(--gold); outline-offset:-2px; }
  .lmono{ width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--scoreboard); font-weight:800; font-size:0.95rem; letter-spacing:0.02em; border:1px solid var(--line); background:var(--item); color:var(--text-dim); }
  .lmono.win{ color:var(--turf); border-color:var(--win-line); background:var(--win-tint); }
  .lmono.loss{ color:var(--loss); border-color:var(--loss-line); background:var(--loss-tint); }
  .lname{ font-weight:600; font-size:0.9rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lsub{ color:var(--text-dim); font-size:0.72rem; margin-top:2px; }
  /* Record and percentage centred on one shared axis, so the short one sits
     squarely under the long one instead of both hugging the right edge. */
  .lrec{ text-align:center; min-width:62px; }
  .lrec b{ display:block; font-family:var(--scoreboard); font-weight:800; font-size:1.35rem; line-height:1; font-variant-numeric:tabular-nums; }
  .lrec span{ display:block; color:var(--text-dim); font-size:0.68rem; margin-top:3px; }
  .lrow.former{ opacity:0.55; }
  @media (prefers-reduced-motion: reduce){ .lrow{ transition:none; } }

  /* ---------- Feature line (worst week, worst bench miss) ---------- */
  .feat{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:center; }
  .feat-v{ font-family:var(--scoreboard); font-weight:800; font-size:1.6rem; color:var(--loss); white-space:nowrap; }

  /* ---------- Achievement shelf ---------- */
  .shelf{ display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:8px; }
  .shelf:empty{ display:none; }
  .ach{ position:relative; background:var(--item); border:1px solid var(--item-line); border-radius:10px; min-height:70px; overflow:hidden; }
  .ach.good{ border-color:var(--lead-line); }
  .ach.bad{ border-color:var(--loss-line); }
  .ach.flippable{ cursor:pointer; perspective:800px; }
  .ach-face-static, .ach-face{ padding:11px 10px; display:flex; gap:9px; align-items:flex-start; }
  .ach-face-static{ height:100%; }
  /* Both faces stack in one grid cell, so the card grows to whichever
     face is taller instead of clipping a long description. */
  .ach-flip-inner{ display:grid; position:relative; width:100%; height:100%; min-height:70px; transition:transform 0.5s; transform-style:preserve-3d; }
  .ach.flipped .ach-flip-inner{ transform:rotateY(180deg); }
  .ach-face{ grid-area:1 / 1; backface-visibility:hidden; -webkit-backface-visibility:hidden; }
  .ach-back{ transform:rotateY(180deg); }
  .ach-icon{ flex-shrink:0; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .ach-icon svg{ width:16px; height:16px; }
  .ach.good .ach-icon{ background:rgba(212,180,106,0.14); color:var(--gold); }
  .ach.bad .ach-icon{ background:rgba(214,98,79,0.14); color:var(--loss); }
  .ach.locked .ach-icon{ background:rgba(255,255,255,0.03); color:var(--text-dim); }
  .ach-name{ font-weight:700; font-size:0.82rem; line-height:1.25; }
  .ach.locked{ opacity:0.6; }
  .ach-sub{ color:var(--text-dim); font-size:0.7rem; margin-top:2px; line-height:1.35; }
  .ach-divider{ color:var(--text-dim); font-size:0.64rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; padding:8px 2px 0; }
  @media (prefers-reduced-motion: reduce){ .ach-flip-inner{ transition:none; } }
</style>
</head>
<body>

    <section class="fr-hero"><div id="hero-container"><span class="sr-only">Loading franchise…</span><div class="sk sk-hero" aria-hidden="true"><div class="sk-main"><div class="sk-row" style="justify-content:flex-start;gap:16px"><i class="o" style="width:72px;height:72px"></i><div class="sk-col" style="gap:10px"><i style="width:min(100%,260px);height:36px"></i><i style="width:min(80%,170px);height:12px"></i></div></div><div class="sk-chips"><i class="p" style="width:160px;height:26px"></i><i class="p" style="width:180px;height:26px"></i><i class="p" style="width:168px;height:26px"></i><i class="p" style="width:164px;height:26px"></i><i class="p" style="width:152px;height:26px"></i></div><i style="width:90px;height:10px"></i><div class="sk-chips"><i class="p" style="width:190px;height:30px"></i><i class="p" style="width:226px;height:30px"></i></div></div><div class="sk-side" style="--n:6"><div><i style="width:44%;height:11px"></i><i style="width:30%;height:24px"></i></div><div><i style="width:44%;height:11px"></i><i style="width:30%;height:24px"></i></div><div><i style="width:44%;height:11px"></i><i style="width:30%;height:24px"></i></div><div><i style="width:44%;height:11px"></i><i style="width:30%;height:24px"></i></div><div><i style="width:44%;height:11px"></i><i style="width:30%;height:24px"></i></div><div><i style="width:44%;height:11px"></i><i style="width:30%;height:24px"></i></div></div></div></div></section>
    <section>
      <div class="tabs scroll" id="tabs" data-glide-panel="tab-content"></div>
      <div id="tab-content"><div class="sk" aria-hidden="true"><div class="sk-row"><i style="width:34%;height:16px"></i><i class="p" style="width:128px;height:36px"></i></div><div class="sk-grid" style="--cols:4"><div class="sk-item" style="justify-items:center;padding:14px 10px"><i style="width:46%;height:9px"></i><i style="width:40%;height:28px"></i><i style="width:52%;height:10px"></i></div><div class="sk-item" style="justify-items:center;padding:14px 10px"><i style="width:46%;height:9px"></i><i style="width:40%;height:28px"></i><i style="width:52%;height:10px"></i></div><div class="sk-item" style="justify-items:center;padding:14px 10px"><i style="width:46%;height:9px"></i><i style="width:40%;height:28px"></i><i style="width:52%;height:10px"></i></div><div class="sk-item" style="justify-items:center;padding:14px 10px"><i style="width:46%;height:9px"></i><i style="width:40%;height:28px"></i><i style="width:52%;height:10px"></i></div></div><i class="area" style="width:100%;height:190px"></i></div></div>

    <footer>Data via ESPN Fantasy (Money Tracker from the league sheet) · Updates Tuesday &amp; Thursday mornings</footer>

<script src="nav.js?v=3"></script>
<script src="page-common.js?v=14"></script>
<script src="achievements.js"></script>
<script>
  const { seasonState, bestChampionshipStreak, everHitPlayoffRate, EFFICIENCY_EXPERT_PCT, ACHIEVEMENTS } = ACHIEVEMENTS_LIB;
  const fmt = (n, d = 0) => (n === null || n === undefined || Number.isNaN(n)) ? '—' : Number(n).toFixed(d);
  const fmtPct = n => (n === null || n === undefined) ? '—' : `${Number(n).toFixed(1)}%`;
  const fmtSigned = (n, d = 1, unit = '%') => (n === null || n === undefined) ? '—' : `${n > 0 ? '+' : n < 0 ? '−' : ''}${Math.abs(n).toFixed(d)}${unit}`;
  const fmtMoney = n => (n === null || n === undefined) ? '—' : `${n < 0 ? '−' : ''}$${Math.abs(Number(n)).toLocaleString()}`;
  const fmtNum = (n, d = 0) => (n === null || n === undefined) ? '—' : Number(n).toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
  const fmtOrdinal = n => {
    if (n === null || n === undefined) return '—';
    const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  };
  const rec = (w, l, t) => `${fmt(w)}-${fmt(l)}${t ? '-' + t : ''}`;

  // ---------- Building blocks ----------
  // A panel: white title top-left, optional chip top-right, optional
  // one-line note, then the body.
  const card = (title, body, o = {}) => `
    <div class="stat-card${o.cls ? ' ' + o.cls : ''}">
      ${title ? `<div class="fr-head"><div class="fr-title">${title}</div>${o.chip || ''}</div>` : ''}
      ${o.note ? `<div class="fr-note">${o.note}</div>` : ''}
      <div class="fr-body">${body}</div>
    </div>`;
  const chip = (text, tone) => `<span class="chip${tone ? ' ' + tone : ''}">${text}</span>`;

  // tiles: [label, value, { tone: 'win'|'loss'|'lead', sub }]
  const tiles = (list, n) => `<div class="tiles" style="--n:${n || list.length}">${list.map(([label, value, o = {}]) => `
    <div class="tile${o.tone ? ' is-' + o.tone : ''}"${o.k ? ` data-k="${o.k}"` : ''}>
      <div class="tile-l">${label}</div>
      <div class="tile-v">${value}</div>
      ${o.sub ? `<div class="tile-s">${o.sub}</div>` : ''}
    </div>`).join('')}</div>`;

  // lines: [name, [[value, caption, cls], ...], sub]
  const lines = list => `<div class="lines">${list.map(([name, vals, sub]) => `
    <div class="line">
      <div class="line-l"><div class="line-name">${name}</div>${sub ? `<div class="line-sub">${sub}</div>` : ''}</div>
      <div class="line-vals">${vals.map(([v, cap, c]) => `<div class="lv"><b${c ? ` class="${c}"` : ''}>${v}</b>${cap ? `<span>${cap}</span>` : ''}</div>`).join('')}</div>
    </div>`).join('')}</div>`;

  const rateTone = v => v === null || v === undefined ? null : v >= 50 ? 'win' : 'loss';
  const signTone = v => v > 0 ? 'win' : v < 0 ? 'loss' : null;
  const signCls = v => v > 0 ? 'win' : v < 0 ? 'loss' : '';

  // A dot chart with percentage x positions, so it fills any width without
  // scaling its own text. pts: [{ x: label, y, cls, label }]. invert puts
  // the low value at the top (1st place up).
  function dotChart(pts, { min, max, invert = false, ticks = [], tickLabel = v => v, height = 150 }) {
    const top = 18, bottom = 22, plot = height - top - bottom;
    const yOf = v => {
      const t = (v - min) / (max - min || 1);
      return top + (invert ? t : 1 - t) * plot;
    };
    const xOf = i => `${((i + 0.5) / pts.length * 100).toFixed(3)}%`;
    // An optional key per point (Career Arc passes the year) tags its dot,
    // label, x label and links so morphArc can match them across managers.
    const k = p => p.key != null ? ` data-k="${p.key}"` : '';
    const grid = ticks.map(t => `<line class="grid" x1="0" x2="100%" y1="${yOf(t)}" y2="${yOf(t)}"/>`).join('');
    const links = pts.slice(1).map((p, i) => pts[i].y == null || p.y == null ? '' :
      `<line class="link"${p.key != null ? ` data-a="${pts[i].key}" data-b="${p.key}"` : ''} x1="${xOf(i)}" y1="${yOf(pts[i].y)}" x2="${xOf(i + 1)}" y2="${yOf(p.y)}"/>`).join('');
    const dots = pts.map((p, i) => p.y == null ? '' : `
      <circle class="dot ${p.cls || 'plain'}"${k(p)} cx="${xOf(i)}" cy="${yOf(p.y)}" r="5"/>
      ${p.label != null ? `<text class="v"${k(p)} x="${xOf(i)}" y="${yOf(p.y) - 9}" text-anchor="middle">${p.label}</text>` : ''}`).join('');
    const xs = pts.map((p, i) => `<text class="x"${k(p)} x="${xOf(i)}" y="${height - 4}" text-anchor="middle">${p.x}</text>`).join('');
    const yLabels = ticks.map(t => `<span style="top:${yOf(t)}px">${tickLabel(t)}</span>`).join('');
    return `<div class="chart"><div class="chart-y" style="height:${height}px">${yLabels}</div>
      <svg height="${height}" role="img">${grid}${links}${dots}${xs}</svg></div>`;
  }

  // ---------- Active-manager ranking ----------
  function leagueCurrentYear(all) {
    let max = -Infinity;
    all.forEach(x => x.season_history.forEach(s => { if (s.year > max) max = s.year; }));
    return max;
  }
  function isActivePlayer(p, currentYear) {
    return p.season_history.length > 0 && p.season_history[p.season_history.length - 1].year === currentYear;
  }
  function computeRank(mine, pool, getter, higherBetter = true) {
    if (mine === null || mine === undefined) return null;
    const better = pool.filter(x => {
      const v = getter(x);
      return v !== null && v !== undefined && (higherBetter ? v > mine : v < mine);
    }).length;
    return better + 1;
  }
  // "3rd of 12" among active managers, or '' for a retired one -- they
  // aren't in that pool, so ranking them against it gives "13th of 12".
  function rankSub(p, getter, higherBetter = true) {
    const cy = CTX.currentYear;
    if (!isActivePlayer(p, cy)) return '';
    const pool = data.players.filter(x => isActivePlayer(x, cy));
    const r = computeRank(getter(p), pool, getter, higherBetter);
    return r ? `${fmtOrdinal(r)} of ${pool.length}` : '';
  }
  // Gold outline only for a top-3 figure, in the same active-manager pool
  // rankSub uses. Elsewhere on the site that outline means a title or first
  // place, so a stat that ranks 11th of 12 stays a plain tile.
  function topTone(p, getter, higherBetter = true) {
    const cy = CTX.currentYear;
    if (!isActivePlayer(p, cy)) return null;
    const pool = data.players.filter(x => isActivePlayer(x, cy));
    const r = computeRank(getter(p), pool, getter, higherBetter);
    return r && r <= 3 ? 'lead' : null;
  }

  function clutchDelta(x) {
    const r = x.career.record, wr = x.career.win_rates;
    if ((r.playoff_w || 0) + (r.playoff_l || 0) === 0 || wr.reg_pct == null || wr.playoff_pct == null) return null;
    return wr.playoff_pct - wr.reg_pct;
  }
  // Schedule luck: actual regular-season win rate minus all-play win rate
  // (what you'd have won playing everyone every week). Positive means the
  // schedule handed you wins your scoring didn't earn.
  const scheduleLuck = x => (x.all_play && x.all_play.pct != null && x.career.win_rates.reg_pct != null)
    ? x.career.win_rates.reg_pct - x.all_play.pct : null;

  function leagueRankBadges(p, all) {
    // Retired managers neither compete for these badges nor count toward
    // anyone else's ranking -- otherwise someone who left the league years
    // ago could permanently "hold" a bad-stat badge nobody currently
    // playing can ever take from them.
    const currentYear = leagueCurrentYear(all);
    if (!isActivePlayer(p, currentYear)) return [];
    const pool = all.filter(x => isActivePlayer(x, currentYear));

    const rank = (getter, higherBetter = true) => computeRank(getter(p), pool, getter, higherBetter);
    const badges = [];
    const add = (r, ok, label, bad) => { if (r && r <= 3 && ok) badges.push({ label: `#${r} in ${label}`, bad }); };

    // Good (gold)
    add(rank(x => x.career.standings.championships), p.career.standings.championships > 0, 'Championships', false);
    add(rank(x => x.efficiency && x.efficiency.career_pct), !!(p.efficiency && p.efficiency.career_pct != null), 'Career Efficiency', false);
    add(rank(x => x.career.points.avg_pf), true, 'Average Points', false);
    add(rank(x => x.money && x.money.net_result), !!(p.money && p.money.net_result > 0), 'Net Money Won', false);
    add(rank(x => clutchDelta(x)), clutchDelta(p) > 0, 'Clutch Factor', false);
    add(rank(x => x.all_play && x.all_play.pct), !!(p.all_play && p.all_play.pct != null), 'Power Ranking', false);

    // Bad (red) -- same stats, ranked from the other end, plus a few that are only ever bad
    add(rank(x => x.money && x.money.net_result, false), !!(p.money && p.money.net_result < 0), 'Net Money Lost', true);
    add(rank(x => clutchDelta(x), false), clutchDelta(p) < 0, 'Choke Factor', true);
    add(rank(x => x.efficiency && x.efficiency.career_pct, false), !!(p.efficiency && p.efficiency.career_pct != null), 'Worst Efficiency', true);
    add(rank(x => x.career.standings.sackos), p.career.standings.sackos > 0, 'Most Sackos', true);
    add(rank(x => x.weekly_sackos), p.weekly_sackos > 0, 'Most Weekly Sackos', true);
    add(rank(x => x.efficiency && x.efficiency.avg_points_left), !!(p.efficiency && p.efficiency.avg_points_left != null), 'Points Left on Bench', true);
    add(rank(x => x.career.win_rates.reg_pct, false), p.career.win_rates.reg_pct != null, 'Lowest Win %', true);

    return badges;
  }

  // ---------- Achievements ----------
  // Fixed list, same for every manager, unlike the rank badges above --
  // these are absolute personal milestones (permanent once earned) rather
  // than "top-3 in the league right now" (which can be lost to someone
  // else's better season). Locked ones render greyed out on purpose: the
  // point is seeing what you haven't done yet.
  const ICONS = {
    trophy: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4h10v3a5 5 0 0 1-10 0V4z"/><rect x="10.4" y="12" width="3.2" height="4"/><rect x="7.5" y="17" width="9" height="2" rx="0.6"/><path d="M7 5H3.2v2a4 4 0 0 0 3.8 4" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M17 5h3.8v2a4 4 0 0 1-3.8 4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>',
    shield: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8 19 5.6v5.1c0 5.2-3.5 8.5-7 9.5-3.5-1-7-4.3-7-9.5V5.6l7-2.8z"/></svg>',
    flame: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3c2.2 3.6-2.6 4.6-2.6 8.3a2.7 2.7 0 0 0 5.4 0c0-.9-.4-1.6-.8-2 .2 1.4-.7 2.3-1.6 2.3-1.1 0-1.8-.9-1.5-2.1C9.7 10.4 9 12 9 13.6a3.6 3.6 0 0 0 7.2 0c0-4.3-2.7-6.3-4.2-10.6z"/></svg>',
    snow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><line x1="12" y1="3" x2="12" y2="21"/><line x1="5.5" y1="7" x2="18.5" y2="17"/><line x1="18.5" y1="7" x2="5.5" y2="17"/></svg>',
    target: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg>',
    dollar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3v18M16.5 7.5c0-1.9-2-3-4.5-3s-4.5 1.1-4.5 3 2 2.6 4.5 3 4.5 1.1 4.5 3-2 3-4.5 3-4.5-1.1-4.5-3"/></svg>',
  };

  function achCard(a, unlocked, ctx, p) {
    const cls = !unlocked ? 'locked' : (a.bad ? 'bad' : 'good');
    const icon = `<div class="ach-icon">${ICONS[a.icon]}</div>`;
    const name = `<div class="ach-name">${esc(a.name)}</div>`;
    if (!unlocked) {
      return `<div class="ach ${cls}"><div class="ach-face-static">${icon}<div>${name}<div class="ach-sub">${esc(a.desc)}</div></div></div></div>`;
    }
    return `<div class="ach ${cls} flippable" title="Tap to see how you earned this">
      <div class="ach-flip-inner">
        <div class="ach-face ach-front">${icon}<div>${name}<div class="ach-sub">${esc(a.desc)}</div></div></div>
        <div class="ach-face ach-back">${icon}<div>${name}<div class="ach-sub">${esc(a.sub(p, ctx))}</div></div></div>
      </div>
    </div>`;
  }

  function renderAchievements(p, ctx) {
    const unlocked = [], locked = [];
    ACHIEVEMENTS.forEach(a => (a.test(p, ctx) ? unlocked : locked).push(a));
    // Earned good ones first, then the bad ones you'd rather not have.
    unlocked.sort((a, b) => (a.bad ? 1 : 0) - (b.bad ? 1 : 0));
    const body = `<div class="shelf">${unlocked.map(a => achCard(a, true, ctx, p)).join('')}</div>`
      + (locked.length ? `<div class="ach-divider">Locked · ${locked.length}</div><div class="shelf">${locked.map(a => achCard(a, false, ctx, p)).join('')}</div>` : '');
    return card('Achievements', body, { chip: chip(`${unlocked.length} / ${ACHIEVEMENTS.length}`, 'gold'), note: 'Tap an unlocked badge to see how it was earned.' });
  }

  // ---------- Hero ----------
  // Deterministic "no photo" fallback -- a colored initials avatar, since
  // logo_url is whatever a manager pasted into ESPN years ago with no
  // validation or hosting of its own, and a real chunk of historical ones
  // are dead links today (confirmed directly for several real examples).
  const initials = name => name.replace(/[^A-Za-z ]/g, '').trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase() || '?';
  const hashColor = name => { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0; return `hsl(${h % 360}, 45%, 32%)`; };
  const logoPh = (name, size) => `<span class="logo-ph" style="position:absolute;inset:0;font-size:${size};background:${hashColor(name)}">${esc(initials(name))}</span>`;
  function onImgError(img) {
    img.style.display = 'none';
    const ph = img.nextElementSibling;
    if (ph) ph.style.display = 'flex';
  }

  // Framed tile per past team, hover (or focus) for a bigger preview --
  // the shape picked over a polaroid grid when the two were compared on
  // the real page rather than in isolation.
  function pastLogosHtml(p) {
    const names = p.previous_team_names || [];
    if (!names.length) return '';
    const logos = p.previous_team_logos || {};
    // Each tile gets its own anchor name so its preview can be positioned
    // against it from outside the card (see the anchor-positioning block in
    // the stylesheet). Anchor names have to be unique -- share one across
    // the list and every preview would latch onto the last tile.
    const tiles = names.map((n, i) => {
      const meta = logos[n] || {};
      const url = esc(meta.logo_url || '');
      return `
        <span class="aka-logo-tile" tabindex="0" style="anchor-name:--logo-past-${i}">
          <span class="aka-logo-avatar"><img src="${url}" onerror="onImgError(this)">${logoPh(n, '0.58rem')}</span>
          <span class="aka-logo-text">${esc(n)} <span class="yr">· ${meta.year || ''}</span></span>
          <span class="aka-logo-preview" style="position-anchor:--logo-past-${i}"><img src="${url}" onerror="onImgError(this)">${logoPh(n, '2rem')}</span>
        </span>`;
    }).join('');
    return `
      <div class="past-logos-label">Past Teams</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">${tiles}</div>`;
  }

  function renderHero(p) {
    const r = p.career.record;
    const w = (r.reg_w || 0) + (r.playoff_w || 0), l = (r.reg_l || 0) + (r.playoff_l || 0);
    const pct = w + l ? w / (w + l) * 100 : null;
    const ranks = leagueRankBadges(p, data.players).map(b => `<span class="rank-badge${b.bad ? ' bad' : ''}">${esc(b.label)}</span>`).join('');
    const active = isActivePlayer(p, CTX.currentYear);
    const last = p.season_history.length ? p.season_history[p.season_history.length - 1].year : null;
    const span = p.founded_year ? (active ? `Since ${p.founded_year}` : `${p.founded_year}–${last}`) : '';
    const tenure = [span, `${p.seasons} season${p.seasons === 1 ? '' : 's'}`].filter(Boolean).join(' · ');
    const currentName = p.current_team_name || p.name;
    const currentLogoUrl = esc(p.current_team_logo || '');
    // All gold, no per-stat tones: these are this franchise's headline
    // career figures, and colouring some of them good/bad made the strip
    // read as a scorecard rather than a summary.
    const side = [
      ['Record', `${w}-${l}`],
      ['Win %', fmtPct(pct)],
      ['Ships', fmt(p.career.standings.championships)],
      ['Playoffs', fmt(p.career.standings.playoff_appearances)],
      ['Sackos', fmt(p.career.standings.sackos)],
      ['Weekly Sackos', fmt(p.weekly_sackos)],
    ].map(([l2, v]) => `<div class="fs"><div class="fs-v">${v}</div><div class="fs-l">${l2}</div></div>`).join('');
    // No eyebrow or manager name: the page title and the dropdown right
    // above already say "Franchise" and whose it is.
    return `
      <div class="fhero">
        <div class="fhero-main">
          <div class="fhero-id">
            <span class="current-logo-tile" tabindex="0">
              <span class="current-logo-avatar">
                <img src="${currentLogoUrl}" onerror="onImgError(this)">${logoPh(currentName, '1.3rem')}
              </span>
              <span class="current-logo-preview" style="position-anchor:--logo-current"><img src="${currentLogoUrl}" onerror="onImgError(this)">${logoPh(currentName, '2.5rem')}</span>
            </span>
            <div style="min-width:0">
              <div class="fhero-name">${esc(currentName)}</div>
              <div class="fhero-sub">${esc(tenure)}${active ? '' : ' · Retired'}</div>
            </div>
          </div>
          ${ranks ? `<div class="hero-pills">${ranks}</div>` : ''}
          ${pastLogosHtml(p)}
        </div>
        <div class="fhero-stats">${side}</div>
      </div>`;
  }

  // ---------- History ----------
  const FINISH_LABELS = { progress: 'In progress', champion: 'Champion', 'runner-up': 'Runner-up', playoffs: 'Playoffs', missed: 'Missed Playoffs', sacko: 'Sacko' };

  function renderHistory(p) {
    const hist = p.season_history;
    if (!hist.length) return card('Seasons', '<div class="empty-note">No seasons on record yet.</div>');
    const done = hist.filter(s => seasonState(s) !== 'progress' && s.final_standing);
    const st = p.career.standings;
    const finishes = done.map(s => s.final_standing);
    const best = finishes.length ? Math.min(...finishes) : null;
    const bestYears = done.filter(s => s.final_standing === best).map(s => `'${String(s.year).slice(2)}`);
    const avg = finishes.length ? finishes.reduce((a, b) => a + b, 0) / finishes.length : null;
    const made = done.filter(s => s.made_playoffs).length;
    const rate = done.length ? made / done.length * 100 : null;
    const finalsLost = st.champ_appearances - st.championships;

    const summary = card('Career Arc', tiles([
      ['Best Finish', fmtOrdinal(best), { tone: best === 1 ? 'lead' : null, sub: bestYears.length > 3 ? `${bestYears.length} times` : bestYears.join(', ') }],
      ['Avg Finish', fmt(avg, 1), { k: 'avg', sub: rankSub(p, x => { const f = x.season_history.filter(s => seasonState(s) !== 'progress' && s.final_standing).map(s => s.final_standing); return f.length ? f.reduce((a, b) => a + b, 0) / f.length : null; }, false) }],
      ['Playoff %', rate == null ? '—' : `${Math.round(rate)}%`, { k: 'po', sub:`${made} of ${done.length}` }],
      ['Finals', `${st.championships}-${finalsLost}`, { tone: st.championships > 0 ? 'lead' : null, sub: st.champ_appearances ? `${st.champ_appearances} trip${st.champ_appearances === 1 ? '' : 's'}` : 'None yet' }],
    ], 4) + arcViews(p), { chip: arcToggle() });

    // Last place that year, from the whole league -- it's been 8, 10 and
    // 12 teams, so "last" can't be a fixed number.
    const lastPlace = {};
    data.players.forEach(x => x.season_history.forEach(h => { lastPlace[h.year] = Math.max(lastPlace[h.year] || 0, h.final_standing || 0); }));
    const list = [...hist].reverse().map(s => {
      let state = seasonState(s);
      if (state === 'missed' && s.final_standing && s.final_standing === lastPlace[s.year]) state = 'sacko';
      const regRank = s.reg_standing ? ` · ${fmtOrdinal(s.reg_standing)}${state === 'progress' ? ' so far' : ' reg'}` : '';
      const po = s.playoff_record ? ` · Playoffs ${s.playoff_record}` : '';
      const place = state === 'progress' ? '' : `${fmtOrdinal(s.final_standing)} place`;
      return `
        <div class="season ${state}">
          <div class="season-yr">${s.year}</div>
          <div style="min-width:0"><div class="season-nm">${esc(s.team_name || p.current_team_name || '')}</div>
            <div class="season-sub">${esc(s.reg_record)}${regRank}${po}</div></div>
          <div class="season-fin"><b>${FINISH_LABELS[state]}</b>${place ? `<span>${place}</span>` : ''}</div>
        </div>`;
    }).join('');
    return summary + card('Season by Season', list, { chip: chip(`${hist.length} season${hist.length === 1 ? '' : 's'}`) });
  }

  // Final finish by year, 1st at the top. An in-progress season plots its
  // current regular-season standing as a hollow dashed dot.
  function finishChart(p) {
    const maxTeams = Math.max(...data.players.flatMap(x => x.season_history.map(s => Math.max(s.final_standing || 0, s.reg_standing || 0))), 4);
    const pts = p.season_history.map(s => {
      const state = seasonState(s);
      const y = state === 'progress' ? (s.reg_standing || null) : (s.final_standing || null);
      return { x: `'${String(s.year).slice(2)}`, y, cls: state, label: y, key: s.year };
    });
    const mid = Math.round(maxTeams / 2);
    const legend = [['champion', 'Champion'], ['runner-up', 'Runner-up'], ['playoffs', 'Playoffs'], ['missed', 'Missed'], ['progress', 'In progress']]
      .filter(([k]) => p.season_history.some(s => seasonState(s) === k))
      .map(([k, l]) => `<span><i class="lg-${k}"></i>${l}</span>`).join('');
    return `<div class="arc-graph" style="padding-top:6px">${dotChart(pts, { min: 1, max: maxTeams, invert: true, ticks: [1, mid, maxTeams], tickLabel: fmtOrdinal, height: 160 })}</div>`;
  }

  // One tile per season, oldest first: year, finish, record. An
  // in-progress season shows its current regular-season standing, dimmed,
  // the same figure the graph plots for it.
  function arcGrid(p) {
    return `<div class="arc-grid edge-fade">${p.season_history.map(s => {
      const state = seasonState(s);
      const standing = state === 'progress' ? fmtOrdinal(s.reg_standing) : fmtOrdinal(s.final_standing);
      return `<div class="arc-tile ${state}"><div class="arc-year">${s.year}</div><div class="arc-standing">${standing}</div><div class="arc-rec">${esc(s.reg_record)}</div></div>`;
    }).join('')}</div>`;
  }

  // Graph and grid are both rendered; the toggle only flips which one
  // shows, so switching never rebuilds the tab.
  let arcView = (() => { try { return localStorage.getItem('franchise-arc-view') === 'grid' ? 'grid' : 'graph'; } catch (e) { return 'graph'; } })();
  const arcToggle = () => `<div class="seg arc-seg">${[['graph', 'Graph'], ['grid', 'Grid']].map(([k, l]) =>
    `<button type="button" data-arc="${k}" class="${arcView === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  function arcViews(p) {
    const legend = [['champion', 'Champion'], ['runner-up', 'Runner-up'], ['playoffs', 'Playoffs'], ['missed', 'Missed'], ['progress', 'In progress']]
      .filter(([k]) => p.season_history.some(s => seasonState(s) === k))
      .map(([k, l]) => `<span><i class="lg-${k}"></i>${l}</span>`).join('');
    return `<div class="arc-views" data-view="${arcView}">${finishChart(p)}${arcGrid(p)}<div class="legend">${legend}</div></div>`;
  }

  // ---------- Career Arc morph ----------
  // Changing manager on History glides each season's dot from the old
  // finish to the new one, on Median Watch's 0.68s curve, and counts Avg
  // Finish and Playoff % to their new values, so one career visibly turns
  // into another instead of the chart redrawing. Points match by year; a
  // year only one of the two managers played fades in or out in place.
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ARC_MS = 680;
  // cubic-bezier(0.34, 1.56, 0.64, 1) for the JS-driven glide.
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = t => ((ax * t + bx) * t + cx) * t;
    const sy = t => ((ay * t + by) * t + cy) * t;
    const dx = t => (3 * ax * t + 2 * bx) * t + cx;
    return x => {
      let t = x;
      for (let i = 0; i < 8; i++) { const e = sx(t) - x; if (Math.abs(e) < 1e-5) break; const d = dx(t); if (Math.abs(d) < 1e-6) break; t -= e / d; }
      return sy(Math.max(0, Math.min(1, t)));
    };
  }
  const glide = bezier(0.34, 1.56, 0.64, 1);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  let arcRun = 0;

  // The Career Arc as drawn right now (mid-glide included, so a quick
  // second change carries on from where the dots are), or null when
  // there's no graph showing to morph from.
  function arcSnapshot() {
    const svg = document.querySelector('#tab-content .arc-graph svg');
    if (!svg || arcView !== 'graph') return null;
    const num = (el, a) => parseFloat(el.getAttribute(a));
    const dots = new Map(), xs = new Map();
    svg.querySelectorAll('circle.dot[data-k]:not(.gone)').forEach(c => dots.set(c.dataset.k, {
      x: num(c, 'cx'), y: num(c, 'cy'), cls: c.getAttribute('class'), c, label: svg.querySelector(`text.v[data-k="${c.dataset.k}"]`),
    }));
    svg.querySelectorAll('text.x[data-k]:not(.gone)').forEach(t => xs.set(t.dataset.k, { x: num(t, 'x'), t }));
    const tile = k => parseFloat((document.querySelector(`#tab-content .tile[data-k="${k}"] .tile-v`) || {}).textContent);
    return { dots, xs, avg: tile('avg'), po: tile('po') };
  }

  function morphArc(before) {
    const svg = document.querySelector('#tab-content .arc-graph svg');
    if (!svg) return;
    const run = ++arcRun;
    const num = (el, a) => parseFloat(el.getAttribute(a));
    const pct = v => `${v.toFixed(3)}%`;

    // Dots and their finish labels. A matched dot starts on its old class
    // and takes the new one after a style flush, so .dot's fill/stroke
    // transition recolors it in flight.
    const dots = [];
    svg.querySelectorAll('circle.dot[data-k]').forEach(c => {
      const k = c.dataset.k, o = before.dots.get(k);
      const d = { k, c, label: svg.querySelector(`text.v[data-k="${k}"]`), to: { x: num(c, 'cx'), y: num(c, 'cy') }, from: o || null, cls: c.getAttribute('class') };
      if (o) c.setAttribute('class', o.cls);
      dots.push(d);
    });
    // Years the new manager never played: the old dots stay where they
    // were and fade out.
    const gone = [];
    before.dots.forEach((o, k) => {
      if (svg.querySelector(`circle.dot[data-k="${k}"]`)) return;
      [o.c, o.label].filter(Boolean).forEach(el => { el.classList.add('gone'); svg.appendChild(el); gone.push(el); });
    });
    const xs = [];
    svg.querySelectorAll('text.x[data-k]').forEach(t => xs.push({ t, from: before.xs.get(t.dataset.k), to: num(t, 'x') }));
    before.xs.forEach((o, k) => { if (!svg.querySelector(`text.x[data-k="${k}"]`)) { o.t.classList.add('gone'); svg.appendChild(o.t); gone.push(o.t); } });
    const links = [...svg.querySelectorAll('line.link[data-a]')];

    svg.getBoundingClientRect();
    dots.forEach(d => { if (d.from) d.c.setAttribute('class', d.cls); });

    const paint = t => {
      const e = glide(t), pos = {};
      dots.forEach(d => {
        const x = d.from ? d.from.x + (d.to.x - d.from.x) * e : d.to.x;
        const y = d.from ? d.from.y + (d.to.y - d.from.y) * e : d.to.y;
        const op = d.from ? 1 : Math.min(1, t * 2);
        pos[d.k] = { x, y, op };
        d.c.setAttribute('cx', pct(x)); d.c.setAttribute('cy', y); d.c.style.opacity = op;
        if (d.label) { d.label.setAttribute('x', pct(x)); d.label.setAttribute('y', y - 9); d.label.style.opacity = op; }
      });
      links.forEach(l => {
        const a = pos[l.dataset.a], b = pos[l.dataset.b];
        if (!a || !b) return;
        l.setAttribute('x1', pct(a.x)); l.setAttribute('y1', a.y); l.setAttribute('x2', pct(b.x)); l.setAttribute('y2', b.y);
        l.style.opacity = Math.min(a.op, b.op);
      });
      xs.forEach(x => {
        if (x.from) x.t.setAttribute('x', pct(x.from.x + (x.to - x.from.x) * e));
        else x.t.style.opacity = Math.min(1, t * 2);
      });
      gone.forEach(el => { el.style.opacity = Math.max(0, 1 - t * 2.5); });
    };

    const tick = (k, from, fmtV) => {
      const el = document.querySelector(`#tab-content .tile[data-k="${k}"] .tile-v`);
      const to = el && parseFloat(el.textContent);
      if (!el || Number.isNaN(from) || Number.isNaN(to) || from === to) return null;
      return t => { el.textContent = fmtV(from + (to - from) * easeOut(t)); };
    };
    const ticks = [tick('avg', before.avg, v => v.toFixed(1)), tick('po', before.po, v => `${Math.round(v)}%`)].filter(Boolean);

    const t0 = performance.now();
    const frame = now => {
      if (run !== arcRun) return;
      const t = Math.min(1, (now - t0) / ARC_MS);
      paint(t);
      ticks.forEach(f => f(t));
      if (t < 1) requestAnimationFrame(frame);
      else gone.forEach(el => el.remove());
    };
    paint(0);
    ticks.forEach(f => f(0));
    requestAnimationFrame(frame);
  }

  // ---------- Record ----------
  function renderStreaks(p) {
    // Without any median games, Vs Median is empty and Vs Both is just
    // Vs Opponent again, so only the one tile shows.
    const list = hasMedian(p) ? [['Vs Opponent', p.streaks.head_to_head], ['Vs Median', p.streaks.median], ['Vs Both', p.streaks.combined]]
      : [['Vs Opponent', p.streaks.head_to_head]];
    const t = list.map(([label, s]) => {
      const cur = s.current === 0 ? '—' : `${s.current > 0 ? 'W' : 'L'}${Math.abs(s.current)}`;
      return [label, cur, { tone: s.current > 0 ? 'win' : s.current < 0 ? 'loss' : null,
        sub: `<span style="white-space:nowrap">Longest W${fmt(s.longest_win)} · L${fmt(s.longest_loss)}</span>` }];
    });
    return card('Streaks', tiles(t, t.length));
  }

  function renderRegular(p) {
    const r = p.career.record, s = p.career.standings, wr = p.career.win_rates, ap = p.all_play;
    const luck = scheduleLuck(p);
    const lineRows = [
      ['Regular-Season Finish', [[fmtOrdinal(s.best_regular_finish), 'Best'], [fmtOrdinal(s.worst_regular_finish), 'Worst']]],
    ];
    if (ap && ap.pct != null) {
      lineRows.push(['Power Ranking', [[fmtPct(ap.pct), rec(ap.w, ap.l, ap.t), rateTone(ap.pct)]],
        rankSub(p, x => x.all_play && x.all_play.pct)]);
    }
    if (luck != null) {
      lineRows.push(['Schedule Luck', [[fmtSigned(luck), luck > 0 ? 'Lucky' : luck < 0 ? 'Unlucky' : 'Even', signCls(luck)]]]);
    }
    return card('Regular Season', tiles([
      ['Win Rate', fmtPct(wr.reg_pct), { tone: rateTone(wr.reg_pct), sub: rankSub(p, x => x.career.win_rates.reg_pct) }],
      ['Record', rec(r.reg_w, r.reg_l, r.reg_t), { sub: `${fmt((r.reg_w || 0) + (r.reg_l || 0) + (r.reg_t || 0))} games` }],
      ['Reg Szn Titles', fmt(s.reg_season_champs), { tone: s.reg_season_champs > 0 ? 'lead' : null, sub: 'Finished 1st' }],
    ], 3) + lines(lineRows));
  }

  function renderPlayoffs(p) {
    const r = p.career.record, s = p.career.standings, wr = p.career.win_rates;
    const games = (r.playoff_w || 0) + (r.playoff_l || 0);
    if (!games && !s.playoff_appearances) {
      return card('Playoffs', '<div class="empty-note">No playoff appearances yet.</div>');
    }
    const delta = clutchDelta(p);
    const lineRows = [
      ['Appearances', [[fmt(s.playoff_appearances), 'Playoffs'], [fmt(s.byes), 'Byes'], [fmt(s.champ_appearances), 'Finals']]],
    ];
    if (delta !== null) {
      const rk = rankSub(p, x => clutchDelta(x));
      lineRows.push(['Clutch Factor', [[fmtSigned(delta), 'vs reg %', signCls(delta)]], rk]);
    }
    if ((r.consolation_w || 0) + (r.consolation_l || 0) > 0) {
      lineRows.push(['Consolation', [[rec(r.consolation_w, r.consolation_l), 'Record']]]);
    }
    return card('Playoffs', tiles([
      ['Win Rate', fmtPct(wr.playoff_pct), { tone: rateTone(wr.playoff_pct) }],
      ['Record', rec(r.playoff_w, r.playoff_l), { sub: `${games} games` }],
      ['Ships', fmt(s.championships), { tone: s.championships > 0 ? 'lead' : null, sub: s.champ_appearances ? `${s.championships}-${s.champ_appearances - s.championships} in finals` : '' }],
    ], 3) + lines(lineRows));
  }

  const hasMedian = p => { const m = p.career.median || {}; return (m.wins || 0) + (m.losses || 0) > 0; };

  function renderMedian(p) {
    const med = p.career.median || {};
    const since = data.median_era_start_year;
    if (!(med.wins + med.losses)) {
      return card('Versus the Median', `<div class="empty-note">No median games -- the median game started in ${since}.</div>`);
    }
    return card('Versus the Median', tiles([
      ['Win Rate', fmtPct(med.pct), { tone: rateTone(med.pct), sub: rankSub(p, x => x.career.median && x.career.median.pct) }],
      ['Record', rec(med.wins, med.losses), { sub: `Since ${since}` }],
    ], 2));
  }

  // ---------- Scoring ----------
  function renderScoring(p) {
    const pts = p.career.points, ex = p.extremes;
    const diff = pts.avg_pf - pts.avg_pa;
    const points = card('Points', tiles([
      ['Avg For', fmt(pts.avg_pf, 2), { tone: topTone(p, x => x.career.points.avg_pf), sub: rankSub(p, x => x.career.points.avg_pf) }],
      ['Avg Against', fmt(pts.avg_pa, 2), { sub: rankSub(p, x => x.career.points.avg_pa) }],
      ['Avg Margin', fmtSigned(diff, 2, ''), { tone: signTone(diff), sub: 'per game' }],
    ], 3) + lines([
      ['Career Total', [[fmtNum(pts.total_pf, 2), 'For'], [fmtNum(pts.total_pa, 2), 'Against']]],
      ['Single Game', [[fmt(ex.highest_score, 2), 'High'], [fmt(ex.lowest_score, 2), 'Low']]]
    ]));
    const recTone = (w, l) => w > l ? 'win' : w < l ? 'loss' : '';
    const margins = card('Margins', tiles([
      ['Close Games', rec(ex.close_wins, ex.close_losses), { tone: signTone(ex.close_wins - ex.close_losses), sub: 'Under 5 pts' }],
      ['Blowouts', rec(ex.blowout_wins, ex.blowout_losses), { tone: signTone(ex.blowout_wins - ex.blowout_losses), sub: '50+ pts' }],
    ], 2) + lines([
      ['Win Margin', [[fmt(ex.biggest_win_margin, 2), 'Largest'], [fmt(ex.lowest_win_margin, 2), 'Smallest']]],
      ['Loss Margin', [[fmt(ex.biggest_loss_margin, 2), 'Largest'], [fmt(ex.lowest_loss_margin, 2), 'Smallest']]],
    ]));
    return `<div class="pair">${points}${margins}</div>`;
  }

  // ---------- Rivalries ----------
  const RIVALRY_LABELS = { nemesis: "Who's Your Daddy", favorite: "Who's Your Bitch" };

  // Picked from current members only, so a rivalry with someone who left
  // years ago can't hold either spot. A retired manager's own page uses
  // everyone they actually played. Ties go to the bigger sample.
  function pickRivals(p) {
    const all = (p.rivalries && p.rivalries.all) || [];
    const cy = CTX.currentYear;
    const activeNames = new Set(data.players.filter(x => isActivePlayer(x, cy)).map(x => x.name));
    const pool = isActivePlayer(p, cy) ? all.filter(r => activeNames.has(r.opponent)) : all;
    if (!pool.length) return { nemesis: null, favorite: null };
    const games = r => r.wins + r.losses;
    const favorite = pool.reduce((a, b) => (b.win_pct > a.win_pct || (b.win_pct === a.win_pct && games(b) > games(a)) ? b : a));
    const nemesis = pool.reduce((a, b) => (b.win_pct < a.win_pct || (b.win_pct === a.win_pct && games(b) > games(a)) ? b : a));
    return { nemesis, favorite: favorite === nemesis ? null : favorite };
  }

  function rivalBox(kind, r) {
    const label = RIVALRY_LABELS[kind];
    if (!r) return `<div class="rival ${kind}"><div class="rival-l">${label}</div><div class="empty-note">Not enough games yet.</div></div>`;
    return `<div class="rival ${kind}">
      <div class="rival-l">${label}</div>
      <div class="rival-nm">${esc(r.opponent)}</div>
      <div class="rival-rec">${r.wins}-${r.losses} · ${fmtPct(r.win_pct)}</div>
    </div>`;
  }

  function renderRivalries(p) {
    const { nemesis, favorite } = pickRivals(p);
    const callouts = card('', `<div class="rivals">${rivalBox('nemesis', nemesis)}${rivalBox('favorite', favorite)}</div>`);
    const all = (p.rivalries && p.rivalries.all) || [];
    if (!all.length) return callouts + card('Head to Head', '<div class="empty-note">No opponent with 3+ meetings yet.</div>');
    const cy = CTX.currentYear;
    const activeNames = new Set(data.players.filter(x => isActivePlayer(x, cy)).map(x => x.name));
    const games = r => r.wins + r.losses;
    const sorted = [...all].sort((a, b) => b.win_pct - a.win_pct || games(b) - games(a));
    const body = `<div class="ledger">${sorted.map(r => {
      const former = !activeNames.has(r.opponent);
      const tone = r.wins > r.losses ? 'win' : r.wins < r.losses ? 'loss' : '';
      return `<a class="lrow${former ? ' former' : ''}" href="head-to-head.html" data-h2h="${esc(r.opponent)}">
        <div class="lmono ${tone}">${esc(monogram(r.opponent))}</div>
        <div style="min-width:0"><div class="lname">${esc(r.opponent)}</div><div class="lsub">${games(r)} games${former ? ' · Former member' : ''}</div></div>
        <div class="lrec"><b>${r.wins}-${r.losses}</b><span>${fmtPct(r.win_pct)}</span></div>
      </a>`;
    }).join('')}</div>`;
    return callouts + card('Head to Head', body, { chip: chip(`${all.length} opponents`) });
  }

  // ---------- Lineups ----------
  const BRACKET_LABELS = { NONE: 'Regular Season', WINNERS_BRACKET: 'Playoffs', WINNERS_CONSOLATION_LADDER: 'Playoffs (Consolation)', LOSERS_CONSOLATION_LADDER: 'Consolation' };
  const bracketLabel = bt => BRACKET_LABELS[bt] || bt;
  const weekLabel = r => `${r.year} Week ${r.week}${r.bracket_type && r.bracket_type !== 'NONE' ? ' · ' + bracketLabel(r.bracket_type) : ''}`;

  function renderEfficiency(p) {
    const e = p.efficiency;
    const since = data.efficiency_start_year;
    if (!e) {
      return card('Lineup Efficiency', `<div class="empty-note">No box-score data for this franchise since ${since} -- ESPN doesn't keep weekly rosters further back.</div>`);
    }
    const headline = card('Lineup Efficiency', tiles([
      ['Efficiency', fmtPct(e.career_pct), { tone: topTone(p, x => x.efficiency && x.efficiency.career_pct), sub: rankSub(p, x => x.efficiency && x.efficiency.career_pct) }],
      ['Perfect Weeks', fmt(e.perfect_lineups), { sub: `of ${e.games_analyzed} games` }],
      ['Bench Pts / Gm', fmt(e.avg_points_left, 2), { sub: `${fmtNum(e.points_left_on_bench, 2)} total` }],
    ], 3) + seasonEffChart(e), { note: `Points started as a share of the best possible lineup, since ${since}.` });

    const r = e.optimal_record;
    // Ranked by win rate, not raw wins, so a longer tenure doesn't win it.
    const optimalPct = x => {
      const o = x.efficiency && x.efficiency.optimal_record && x.efficiency.optimal_record.optimal;
      const g = o ? o.w + o.l + (o.t || 0) : 0;
      return g ? (o.w + (o.t || 0) / 2) / g : null;
    };
    const fmtRec = x => rec(x.w, x.l, x.t);
    const recordCard = card('With Perfect Lineups', tiles([
      ['Actual', fmtRec(r.actual)],
      ['Optimal', fmtRec(r.optimal), { tone: topTone(p, optimalPct) }],
      ['Wins Left', fmt(r.extra_wins), { tone: r.extra_wins > 0 ? 'loss' : null, sub: 'on the bench' }],
    ], 3), { note: `Regular season, against each week's real opponent score · ${r.games} games.` });

    const wg = e.worst_game, wb = e.worst_bench_miss;
    const worst = card('Worst Calls', lines([
      wg ? ['Worst Lineup Week', [[`−${fmt(wg.diff, 2)}`, 'pts left', 'loss']], `Scored ${fmt(wg.actual, 2)} of a possible ${fmt(wg.optimal, 2)} · ${weekLabel(wg)}`]
        : ['Worst Lineup Week', [['—', '']], 'Every week was optimal, or close to it'],
      wb ? ['Worst Bench Miss', [[fmt(wb.points, 2), 'pts benched', 'loss']], `${esc(wb.player_name)} · ${weekLabel(wb)}`]
        : ['Worst Bench Miss', [['—', '']], 'No bench data yet'],
    ]));
    return headline + `<div class="pair">${recordCard}${worst}</div>`;
  }

  function seasonEffChart(e) {
    const s = e.by_season;
    if (s.length < 2) return '';
    const vals = s.map(x => x.pct);
    const lo = Math.floor((Math.min(...vals) - 3) / 5) * 5, hi = Math.min(100, Math.ceil((Math.max(...vals) + 3) / 5) * 5);
    const pts = s.map(x => ({ x: `'${String(x.year).slice(2)}`, y: x.pct, cls: x.pct >= EFFICIENCY_EXPERT_PCT ? 'champion' : 'runner-up', label: Math.round(x.pct) }));
    return `<div style="padding-top:8px">${dotChart(pts, { min: lo, max: hi, ticks: [lo, (lo + hi) / 2, hi], tickLabel: v => `${Math.round(v)}%`, height: 140 })}</div>
      <div class="legend"><span><i class="lg-champion"></i>${EFFICIENCY_EXPERT_PCT}%+ season</span><span><i class="lg-runner-up"></i>Under ${EFFICIENCY_EXPERT_PCT}%</span></div>`;
  }

  // ---------- Money & Draft ----------
  function renderMoney(p) {
    const m = p.money;
    const money = !m ? card('Money', '<div class="empty-note">Not tracked for this franchise.</div>') :
      card('Money', tiles([
        ['Net', fmtMoney(m.net_result), { tone: signTone(m.net_result), sub: rankSub(p, x => x.money && x.money.net_result) }],
        ['Paid In', fmtMoney(m.total_dues), { sub: 'Dues' }],
        ['Won', fmtMoney(m.total_earnings), { sub: m.total_dues ? `${Math.round(m.total_earnings / m.total_dues * 100)}% of dues back` : '' }],
      ], 3) + lines([
        ['Parlays Bought', [[fmtMoney(m.parlays_purchased), 'Spent']]],
        ['Per Season', [[fmtSigned(m.net_result / (p.seasons || 1), 0, '').replace(/^([+−]?)/, '$1$'), 'Net', signCls(m.net_result)]]],
      ]));
    const b = p.moves.busiest_season;
    const draft = card('Draft & Roster', tiles([
      // Lowest average pick ranks first.
      ['Avg Pick', fmt(p.draft.avg_position, 1), { tone: topTone(p, x => x.draft && x.draft.avg_position, false) }],
      ['Earliest', fmt(p.draft.best_position), { sub: 'pick' }],
      ['Latest', fmt(p.draft.worst_position), { sub: 'pick' }],
    ], 3) + lines([
      ['Roster Moves', [[fmt(p.moves.total), 'Total'], [fmt(p.moves.avg_per_season, 1), 'Per Szn']], rankSub(p, x => x.moves.total) ? `${rankSub(p, x => x.moves.total)} most active` : ''],
      ['Busiest Season', [[b ? fmt(b.moves) : '—', b ? String(b.year) : '']]],
    ]));
    return `<div class="pair">${money}${draft}</div>`;
  }

  // ---------- Tabs ----------
  const TABS = [
    { id: 'history', label: 'History', render: p => renderHistory(p) },
    { id: 'record', label: 'Record', render: p => `<div class="pair">${renderStreaks(p)}${hasMedian(p) ? renderMedian(p) : ''}</div><div class="pair">${renderRegular(p)}${renderPlayoffs(p)}</div>` },
    { id: 'scoring', label: 'Scoring', render: p => renderScoring(p) },
    { id: 'rivals', label: 'Rivalries', render: p => renderRivalries(p) },
    { id: 'lineups', label: 'Lineups', render: p => renderEfficiency(p) },
    { id: 'money', label: 'Money & Draft', render: p => renderMoney(p) },
    { id: 'achievements', label: 'Achievements', render: p => renderAchievements(p, CTX) },
  ];

  let data = null, CTX = null;
  let tab = (() => { try { const t = localStorage.getItem('franchise-tab'); return Math.max(0, TABS.findIndex(x => x.id === t)); } catch (e) { return 0; } })();
  // morph: a manager change, which on History glides the Career Arc
  // across rather than redrawing it.
  function show(name, morph) {
    const p = data.players.find(x => x.name === name);
    if (!p) return;
    document.getElementById('hero-container').innerHTML = renderHero(p);
    const tabsEl = document.getElementById('tabs');
    tabsEl.innerHTML = TABS.map((t, i) => `<button class="tab ${i === tab ? 'on' : ''}" data-i="${i}">${t.label}</button>`).join('');
    const before = morph && !reduceMotion && TABS[tab].id === 'history' ? arcSnapshot() : null;
    document.getElementById('tab-content').innerHTML = TABS[tab].render(p);
    if (before) morphArc(before);
    keepSelectedInView(tabsEl);
  }

  document.addEventListener('click', e => {
    const t = e.target.closest('.tab');
    if (t) {
      tab = Number(t.dataset.i);
      try { localStorage.setItem('franchise-tab', TABS[tab].id); } catch (err) {}
      show(document.getElementById('franchise-select').value);
      return;
    }
    // Opponent cards are plain links; this just hands Head to Head the pair
    // it should open on, through the same storage key that page saves to.
    const opp = e.target.closest('[data-h2h]');
    if (opp) {
      try { localStorage.setItem('h2h-pair', JSON.stringify([document.getElementById('franchise-select').value, opp.dataset.h2h])); } catch (err) {}
      return;
    }
    const arcBtn = e.target.closest('[data-arc]');
    if (arcBtn) {
      arcView = arcBtn.dataset.arc;
      try { localStorage.setItem('franchise-arc-view', arcView); } catch (err) {}
      document.querySelectorAll('.arc-views').forEach(v => { v.dataset.view = arcView; });
      document.querySelectorAll('[data-arc]').forEach(b => b.classList.toggle('on', b.dataset.arc === arcView));
      return;
    }
    const ach = e.target.closest('.ach.flippable');
    if (ach) ach.classList.toggle('flipped');
  });

  fetch('data/franchise.json', { cache: 'no-store' }).then(r => r.json()).then(d => {
    data = d;
    const currentYear = leagueCurrentYear(d.players);
    CTX = {
      currentYear,
      foundingYear: Math.min(...d.players.map(x => x.founded_year).filter(y => y != null)),
    };
    document.getElementById('updated-at').textContent = formatUpdated(d.generated_at);
    const sel = document.getElementById('franchise-select');
    sel.innerHTML = d.players.map(p => `<option value="${esc(p.name)}">${esc(p.name)}</option>`).join('');
    const saved = (() => { try { return localStorage.getItem('franchise-selected'); } catch (e) { return null; } })();
    sel.value = d.players.some(p => p.name === saved) ? saved : d.players[0].name;
    show(sel.value);
    riseIn([...document.getElementById('hero-container').children, ...document.getElementById('tab-content').children]);
    sel.addEventListener('change', () => {
      show(sel.value, true);
      try { localStorage.setItem('franchise-selected', sel.value); } catch (e) {}
    });
  }).catch(err => {
    console.error(err);
    document.getElementById('hero-container').innerHTML = '<div class="loading-row" style="color:var(--loss);">Error loading franchise data.</div>';
    document.getElementById('tab-content').innerHTML = '';
  });
</script>
<script src="track.js?v=1" defer></script>
</body>
</html>
