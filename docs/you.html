<style>
  /* You (site audit VIII #15): everything about your week on one page --
     the matchup and what needs doing, your odds, the rest of your schedule,
     last week, your alerts, and your own pages. Opened from your monogram
     once your team is picked; here, the monogram opens the You sheet. */
  .yu-hero{ display:flex; align-items:center; gap:14px; margin:2px 0 4px; }
  .yu-logo{ width:58px; height:58px; border-radius:50%; overflow:hidden; flex:none; background:#1d1d1d; box-shadow:0 0 0 2px var(--me-ring, #7AAEDB); display:grid; place-items:center; font:800 0.9rem/1 var(--body); }
  .yu-logo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .yu-name{ font:800 2rem/0.95 var(--scoreboard); letter-spacing:0.01em; }
  .yu-sub{ color:var(--text-dim); font-size:0.84rem; margin-top:4px; }
  /* Settings on the page (audit IX #7): Notifications, Settings and
     Account are drawn here by nav.js (rlYou.mount), the same panels the You
     sheet has on every other page. */
  .yu-set .ft-body{ padding-top: 4px; }
  .yu-set .you-sec:first-child{ margin-top: 0; padding-top: 0; border-top: 0; }
  .yu-more{ display:block; width:100%; min-height:44px; border:0; border-top:1px solid var(--line); background:none; color:var(--gold); font:600 var(--fs-small) var(--body); cursor:pointer; }

  .yu-mu{ display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--text); padding:2px 0; }
  .yu-mu > div{ flex:1; min-width:0; }
  .yu-mu b{ font-weight:700; font-size:0.96rem; }
  .yu-mu .s{ display:block; color:var(--text-dim); font-size:var(--fs-small); margin-top:2px; }
  .yu-mu svg, .yu-go svg{ width:16px; height:16px; color:var(--text-dim); flex:none; }
  .yu-todo{ display:flex; align-items:center; gap:12px; padding:11px 12px; text-decoration:none; color:var(--text); }
  .yu-todo + .yu-todo{ border-top:1px solid var(--line); }
  .yu-todo > div{ flex:1; min-width:0; }
  .yu-todo b{ font-weight:600; font-size:0.88rem; display:block; }
  .yu-todo span.s{ color:var(--text-dim); font-size:var(--fs-detail); display:block; margin-top:1px; overflow-wrap:anywhere; }
  .yu-ic{ width:32px; height:32px; border-radius:9px; display:grid; place-items:center; flex:none; color:var(--gold); background:var(--lead-tint); border:1px solid var(--lead-line); }
  .yu-ic.bad{ color:var(--loss); background:var(--loss-tint); border-color:var(--loss-line); }
  .yu-ic svg{ width:16px; height:16px; }
  .yu-pill{ flex:none; height:34px; padding:0 14px; border-radius:999px; display:inline-flex; align-items:center; font-weight:700; font-size:var(--fs-small); border:1px solid var(--lead-line); color:var(--gold); white-space:nowrap; }
  .yu-pill.solid{ background:var(--gold); border-color:var(--gold); color:var(--ctl-on-ink); }

  .yu-odds{ display:flex; align-items:center; gap:14px; }
  .yu-odds .v{ font:800 2.7rem/0.9 var(--scoreboard); color:var(--me-ring, #7AAEDB); font-variant-numeric:tabular-nums; }
  .yu-odds .s{ color:var(--text-dim); font-size:var(--fs-small); line-height:1.45; }
  .yu-odds .s b{ color:var(--text); font-weight:600; }

  .yu-sched{ display:grid; grid-template-columns:repeat(var(--n,7),minmax(0,1fr)); gap:5px; }
  .yu-wk{ border:1px solid var(--item-line); background:var(--item); border-radius:10px; padding:7px 2px; text-align:center; min-width:0; text-decoration:none; color:var(--text); }
  .yu-wk.now{ border-color:color-mix(in srgb, var(--me-ring, #7AAEDB) 60%, transparent); background:color-mix(in srgb, var(--me-ring, #7AAEDB) 7%, transparent); }
  .yu-wk .w{ color:var(--text-dim); font-size:var(--fs-label); font-weight:700; letter-spacing:0.06em; }
  .yu-wk .o{ font-weight:700; font-size:var(--fs-detail); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 2px; }
  .yu-wk .r{ color:var(--text-dim); font-size:var(--fs-label); margin-top:2px; font-variant-numeric:tabular-nums; }
  .yu-wk .v{ font-size:var(--fs-label); margin-top:3px; font-weight:700; font-variant-numeric:tabular-nums; }
  .yu-wk .v.up{ color:var(--turf); } .yu-wk .v.dn{ color:var(--loss); } .yu-wk .v.even{ color:var(--text-dim); }

  .yu-al{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 10px; padding:10px 12px; text-decoration:none; color:var(--text); }
  .yu-al + .yu-al{ border-top:1px solid var(--line); }
  .yu-al b{ font-weight:600; font-size:0.86rem; }
  .yu-al span{ grid-column:1; color:var(--text-dim); font-size:var(--fs-detail); overflow-wrap:anywhere; }
  .yu-al time{ grid-row:1; grid-column:2; color:var(--text-dim); font-size:var(--fs-label); white-space:nowrap; }

  .yu-links{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .yu-go{ display:flex; align-items:center; gap:10px; min-height:52px; padding:10px 12px; text-decoration:none; color:var(--text); font-weight:600; font-size:0.86rem; }
  .yu-go .t{ flex:1; min-width:0; }
  .yu-go .yu-ic{ width:28px; height:28px; border-radius:8px; }
  .yu-cols{ display:grid; gap:0; }
  @media (min-width:860px){ .yu-cols{ grid-template-columns:1fr 1fr; gap:0 14px; align-items:start; } }
</style>
</head>
<body>
  <div id="site-nav"></div>
  <div class="wrap">
    <header>
      <div class="header-row">
        <div>
          <div class="eyebrow">Retirement League</div>
          <h1>You</h1>
        </div>
      </div>
    </header>

    <div id="view"><span class="sr-only">Loading…</span><div class="sk-stack" aria-hidden="true">
      <div class="sk-row" style="justify-content:flex-start;gap:14px;padding:2px 0 4px"><i class="o" style="width:58px;height:58px"></i><div class="sk-col"><i style="width:40%;height:26px"></i><i style="width:58%;height:11px"></i></div></div>
      <div class="sk"><i style="width:28%;height:15px"></i><i style="width:64%;height:14px"></i><i style="width:80%;height:11px"></i></div>
      <div class="sk"><i style="width:34%;height:15px"></i><div class="sk-row" style="justify-content:flex-start;gap:14px"><i style="width:88px;height:40px"></i><div class="sk-col"><i style="width:60%;height:11px"></i><i style="width:80%;height:11px"></i></div></div><div class="sk-grid" style="--cols:3"><i style="width:100%;height:58px"></i><i style="width:100%;height:58px"></i><i style="width:100%;height:58px"></i></div></div>
    </div></div>

    <footer id="site-footer" data-note="Your matchup, odds and alerts in one place"></footer>
  </div>

<script src="nav.js?v=b6928293"></script>
<script src="page-common.js?v=ff41b6f1"></script>
<script>
  // You is your profile now (audit X #10): franchise.html with your name,
  // where Settings is a tab. Until a team is picked, this page still offers
  // the pick and the settings.
  const $ = id => document.getElementById(id);
  const panel = (title, body) => `<section class="glass ft-sec yu-set"><div class="panel-title"><span>${title}</span></div><div class="ft-body">${body}</div></section>`;
  function draw() {
    const me = getMe();
    if (me) { location.replace(pageLink('franchise.html', { m: me, tab: urlParam('tab') === 'settings' ? 'settings' : null })); return; }
    $('view').innerHTML = `<div class="ft-s" style="margin:0 2px 12px">Pick your team and your profile opens: your matchup, your odds and your alerts.</div>${panel('Account', '<div id="yu-you"></div>')}${panel('Settings', '<div id="yu-settings"></div>')}`;
    rlYou.mount($('yu-you'), 'you');
    rlYou.mount($('yu-settings'), 'settings');
  }
  window.addEventListener('rl-me', draw);
  window.addEventListener('rl-auth', draw);
  draw();
</script>
<script src="track.js?v=0cbf34b9" defer></script>
</body>
</html>
