<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">

<title>Retirement League — Commissioner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/bigshouldersdisplay/v24/fC1_PZJEZG-e9gHhdI4-NBbfd2ys3SjJCx1czNDu.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=30">
<link rel="stylesheet" href="nav.css?v=15">
<style>
  /* ---------- Commissioner: a hub of tools ----------
     The page opens on a hub (grouped rows, one panel per group, a live status
     line on each) with a "Needs you" panel above it. Each tool is a screen of
     its own at #name, so the browser's Back button returns to the hub. Behind
     the PIN only for a commissioner who isn't signed in; a signed-in one skips it.
     Worker side: worker/src/admin.js (tools), auth.js (sign-ins, roles). */
  .cm-count{ font-size: 0.68rem; font-weight: 700; letter-spacing: 0.03em; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--lead-line); color: var(--gold); background: var(--lead-tint); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .cm-count.green{ border-color: var(--win-line); color: var(--turf); background: var(--win-tint); }
  .cm-count.red{ border-color: var(--loss-line); color: var(--loss); background: var(--loss-tint); }
  .cm-count.dim{ border-color: var(--ctl-line); color: var(--text-dim); background: none; }
  .cm-note{ color: var(--text-dim); font-size: 0.78rem; line-height: 1.45; padding: 4px 22px 0; }
  .cm-fine{ color: var(--text-dim); font-size: 0.78rem; line-height: 1.45; margin: 12px 0 0; }
  .cm-fine b{ color: var(--text); font-weight: 600; }
  .cm-fine.bad{ color: var(--loss); font-weight: 600; }
  .cm-empty{ padding: 18px 10px; color: var(--text-dim); font-size: 0.85rem; text-align: center; }

  .back{ background: none; border: 0; padding: 0; min-height: 24px; display: inline-flex; align-items: center; gap: 2px; color: var(--gold); font: 600 0.8rem var(--body); letter-spacing: 0.02em; text-decoration: none; cursor: pointer; }
  .back svg{ width: 14px; height: 14px; margin-left: -4px; }
  .back:focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }

  .cm-rows{ display: grid; gap: 6px; }
  .cm-cols{ display: grid; gap: 6px; }
  .cm-split{ display: grid; gap: 14px; }
  .cm-groups{ display: grid; gap: 14px; }
  @media (min-width: 721px){
    .cm-cols{ grid-template-columns: 1fr 1fr; gap: 8px; }
    .cm-split{ grid-template-columns: 1fr 1fr; align-items: start; }
    .cm-groups{ grid-template-columns: 1fr 1fr; align-items: start; }
  }
  .cm-section{ margin-bottom: 14px; }

  /* A tappable row: icon, name and status, chevron. */
  .cm-row{ display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 8px 12px; min-width: 0; width: 100%; text-align: left; color: var(--text); font: inherit; text-decoration: none; }
  a.cm-row, button.cm-row{ cursor: pointer; }
  .cm-main{ min-width: 0; flex: 1; }
  .cm-name{ font-weight: 600; font-size: 0.9rem; }
  .cm-sub{ color: var(--text-dim); font-size: 0.74rem; margin-top: 1px; line-height: 1.35; }
  .cm-sub.in{ color: var(--text); }
  .cm-sub.bad{ color: var(--loss); }
  .cm-sub.clip{ white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cm-ic{ width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: var(--gold); background: var(--lead-tint); flex: none; }
  .cm-ic svg{ width: 17px; height: 17px; }
  .cm-chev{ width: 16px; height: 16px; color: var(--text-dim); flex: none; }
  .cm-chev svg, .cm-lock svg{ width: 100%; height: 100%; display: block; }
  .cm-lock{ width: 14px; height: 14px; color: var(--text-dim); flex: none; }
  @media (hover: hover){ a.cm-row:hover, button.cm-row:hover{ border-color: var(--lead-line); } }
  .cm-row:focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }
  .cm-dot{ display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--turf); margin-right: 6px; vertical-align: 1px; }
  .cm-dot.red{ background: var(--loss); }
  .cm-dot.dim{ background: var(--text-dim); }

  /* A row with buttons on its right (sign-ins, confirmations). */
  .cm-line{ display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 58px; padding: 8px 10px 8px 12px; min-width: 0; }
  .cm-btns{ display: flex; gap: 6px; flex: none; }
  .cm-wrap{ display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  /* 36px drawn, 44px to tap. */
  .cm-btn{ position: relative; height: 36px; padding: 0 15px; border-radius: 999px; border: 1px solid var(--lead-line); background: transparent; color: var(--gold); font: 700 0.78rem var(--body); white-space: nowrap; cursor: pointer; flex: none; text-decoration: none; display: inline-flex; align-items: center; }
  .cm-btn::before{ content: ''; position: absolute; inset: -4px -2px; }
  .cm-btn.dim{ border-color: var(--ctl-line); color: var(--text); }
  .cm-btn.danger{ border-color: var(--loss-line); color: var(--loss); }
  .cm-btn.solid{ background: var(--gold); border-color: var(--gold); color: var(--ctl-on-ink); }
  .cm-btn:focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }
  .cm-btn:disabled{ opacity: 0.45; cursor: default; }
  @media (hover: hover){ .cm-btn:hover:not(:disabled){ background: var(--item-hover); } .cm-btn.solid:hover:not(:disabled){ background: #E0C47F; } }

  .cm-mono{ width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--ctl-line); display: grid; place-items: center; font: 800 0.62rem/1 var(--body); letter-spacing: 0.02em; flex: none; }
  .cm-mono.gold{ border-color: var(--gold); color: var(--gold); }
  .cm-dots{ display: flex; flex-wrap: wrap; gap: 8px; }
  .cm-dots .cm-mono{ width: 36px; height: 36px; }
  .cm-dots .cm-mono.in{ border-color: var(--win-line); background: var(--win-tint); color: var(--turf); }
  .cm-dots .cm-mono.out{ color: var(--text-dim); border-style: dashed; }
  .cm-bar{ height: 5px; border-radius: 99px; background: var(--ctl-bg); margin-top: 7px; overflow: hidden; }
  .cm-bar i{ display: block; height: 100%; background: var(--gold); border-radius: 99px; }
  .cm-val{ font-weight: 700; font-size: 0.84rem; font-variant-numeric: tabular-nums; flex: none; }

  /* Fields */
  .cm-field{ display: grid; gap: 6px; margin-top: 12px; }
  .cm-field:first-child{ margin-top: 0; }
  .cm-field > span{ color: var(--text-dim); font-size: 0.74rem; font-weight: 600; }
  .cm-in{ width: 100%; min-height: 44px; padding: 0 14px; background: var(--item); color: var(--text); border: 1px solid var(--item-line); border-radius: 12px; font: 16px var(--body); user-select: text; -webkit-user-select: text; }
  textarea.cm-in{ padding: 11px 14px; min-height: 88px; resize: vertical; line-height: 1.4; }
  select.cm-in{ appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--text-dim) 50%), linear-gradient(135deg, var(--text-dim) 50%, transparent 50%); background-position: calc(100% - 18px) 19px, calc(100% - 13px) 19px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
  .cm-in:focus{ outline: none; border-color: var(--gold); }
  .cm-pills{ display: flex; gap: 6px; flex-wrap: wrap; }
  .cm-pill{ height: 32px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--ctl-line); background: var(--ctl-bg); color: var(--text); font: 600 0.78rem var(--body); cursor: pointer; }
  .cm-pill:focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }
  .cm-box{ padding: 12px 14px; font-size: 0.9rem; line-height: 1.4; }

  /* The PIN, asked once per browser, only when nobody is signed in as a commissioner. */
  .pin-row{ display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .pin-box{ width: 120px; height: 40px; padding: 0 14px; background: var(--item); color: var(--text); border: 1px solid var(--item-line); border-radius: 999px; font: 16px var(--body); letter-spacing: 0.2em; user-select: text; -webkit-user-select: text; }
  .pin-box:focus{ outline: none; border-color: var(--gold); }

  /* Role sheet: theme.css's bottom sheet on a phone, a centred card above 720px. */
  .cm-sheet .sheet-body{ padding: 0 16px calc(18px + env(safe-area-inset-bottom, 0px)); }
  .cm-sheet-head{ display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin: 4px 0 14px; }
  .cm-sheet-head b{ font: 800 1.6rem/1 var(--scoreboard); letter-spacing: 0.01em; display: block; }
  .cm-sheet-head span{ color: var(--text-dim); font-size: 0.78rem; }
  .cm-perm{ display: flex; align-items: center; gap: 12px; padding: 12px; }
  .cm-sw{ width: 46px; height: 28px; border-radius: 999px; border: 1px solid var(--ctl-line); background: var(--ctl-bg-solid); position: relative; flex: none; cursor: pointer; padding: 0; }
  .cm-sw::after{ content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--text-dim); transition: transform .15s; }
  .cm-sw[aria-checked="true"]{ background: var(--gold); border-color: var(--gold); }
  .cm-sw[aria-checked="true"]::after{ transform: translateX(18px); background: var(--ctl-on-ink); }
  .cm-sw:disabled{ opacity: 0.5; cursor: not-allowed; }
  .cm-sw::before{ content: ''; position: absolute; inset: -8px -4px; }
  .cm-sw:focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }
  @media (min-width: 721px){
    .sheet.cm-sheet{ left: 50%; right: auto; top: 12vh; bottom: auto; width: 440px; margin-left: -220px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); animation: panel-fade .18s ease-out; }
    .cm-sheet .sheet-grab{ display: none; }
  }
  .cm-toast{ position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h, 0px) + 18px); z-index: 70; max-width: 88vw; padding: 10px 16px; border-radius: 999px; background: var(--ctl-bg-solid); border: 1px solid var(--lead-line); color: var(--text); font-weight: 600; font-size: 0.8rem; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }

  /* Jon's Tables */
  .cm-pills .cm-pill.on{ background: var(--gold); border-color: var(--gold); color: var(--ctl-on-ink); }
  .cm-table-wrap{ overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; margin-top: 14px; }
  .cm-table{ width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  .cm-table th, .cm-table td{ padding: 9px 14px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .cm-table th{ color: var(--text-dim); font-weight: 700; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em; background: var(--surface-raised); }
  .cm-table th:first-child, .cm-table td:first-child{ text-align: left; font-weight: 600; }
  .cm-table.bets th:nth-child(2), .cm-table.bets td:nth-child(2){ text-align: left; }
  .cm-table sup{ font-size: 0.7em; line-height: 0; margin-left: 1px; }
  .cm-table tbody tr:last-child td{ border-bottom: none; }
  @media (hover: hover){ .cm-table tbody tr:hover{ background: var(--surface-raised); } }
  .cm-tools{ display: flex; gap: 6px; }

  /* Activity */
  .cm-tiles{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .cm-tile{ padding: 12px; text-align: left; }
  .cm-tile b{ display: block; font: 800 1.5rem/1 var(--scoreboard); font-variant-numeric: tabular-nums; }
  .cm-tile span{ display: block; color: var(--text-dim); font-size: 0.72rem; margin-top: 4px; }
  .cm-tile small{ display: block; font-size: 0.72rem; line-height: 1.35; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
  .cm-day{ display: grid; grid-template-columns: 62px 1fr 34px; align-items: center; gap: 10px; font-size: 0.78rem; font-variant-numeric: tabular-nums; }
  .cm-day .cm-bar{ margin-top: 0; height: 8px; }
  .cm-day em{ font-style: normal; text-align: right; font-weight: 700; }
  .cm-day span{ color: var(--text-dim); }
</style>
</head>
<body>
  <div id="site-nav"></div>
  <div class="wrap">
    <header>
      <div class="header-row">
        <div>
          <div class="eyebrow" id="cm-eyebrow">Retirement League</div>
          <h1 id="cm-title">Commissioner</h1>
        </div>
        <div id="cm-right"></div>
      </div>
    </header>

    <div id="cm-main"><div class="cm-empty">Loading…</div></div>
    <div id="cm-sheet"></div>
    <div id="cm-toast" role="status" aria-live="polite"></div>

    <footer id="site-footer" data-source="Tools kept by the league's Worker"></footer>
  </div>

<script src="nav.js?v=21"></script>
<script src="page-common.js?v=37"></script>
<script>
(function () {
  const WORKER_URL = 'https://retirement-league-refresh-proxy.bradbutcher321.workers.dev';
  // The same key Enter Picks kept the PIN under, so one entry still covers both.
  const PIN_KEY = 'rl-parlay-pin';
  const store = {
    get: k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
    set: (k, v) => { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch { /* private mode */ } },
  };
  const $ = id => document.getElementById(id);
  const mainEl = $('cm-main');

  const SVG = b => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${b}</svg>`;
  const I = {
    ticket: SVG('<path d="M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4V7z"/><path d="M14 7v10" stroke-dasharray="2 2.2"/>'),
    mega: SVG('<path d="M4 10v4h3l7 4V6L7 10H4z"/><path d="M17.5 9a4 4 0 0 1 0 6"/>'),
    play: SVG('<rect x="3.5" y="5" width="17" height="14" rx="3"/><path d="m10 9.5 4.5 2.5-4.5 2.5z" fill="currentColor"/>'),
    key: SVG('<circle cx="8" cy="15" r="3.5"/><path d="M10.5 12.5 19 4M16 7l2.5 2.5M13.5 9.5l2 2"/>'),
    people: SVG('<circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19c.7-3.2 2.9-4.9 5.5-4.9s4.8 1.7 5.5 4.9"/><circle cx="16.5" cy="9.5" r="2.6"/><path d="M15.6 14.3c2.3.1 4.2 1.6 4.9 4.7"/>'),
    bell: SVG('<path d="M6 17v-6a6 6 0 0 1 12 0v6l1.5 2h-15L6 17z"/><path d="M10 21h4"/>'),
    clock: SVG('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>'),
    cal: SVG('<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>'),
    shield: SVG('<path d="M12 3 19 6v5.5c0 4.4-3 7.6-7 9-4-1.4-7-4.6-7-9V6l7-3z"/><path d="m9 12 2.2 2.2L15.5 10"/>'),
    sync: SVG('<path d="M20 11a8 8 0 0 0-14.5-4M4 5v3.5h3.5"/><path d="M4 13a8 8 0 0 0 14.5 4M20 19v-3.5h-3.5"/>'),
    table: SVG('<rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M3.5 10h17M3.5 14.5h17M9.5 10v9"/>'),
    chart: SVG('<path d="M4 19h16"/><path d="m5 15 4-5 4 3 6-7"/>'),
    chev: SVG('<path d="m9 6 6 6-6 6"/>'),
    back: SVG('<path d="m15 6-6 6 6 6"/>'),
    lock: SVG('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'),
  };

  // ---------- State ----------
  let access = '';         // 'session' (signed-in commissioner), 'pin', or '' (neither yet)
  let names = [];          // this season's managers
  let ov = null;           // the hub's overview
  let people = null;       // { founder, managers } from the sign-in list
  let health = null;       // { at, checks }
  let asking = '';         // the manager whose Reset is waiting on a yes
  let copied = '';         // the manager whose text was just copied (no share sheet here)
  let sheet = '';          // the manager whose role sheet is open
  let confirmRole = '';    // the manager whose role change is waiting on a yes
  let confirmPush = false;
  let videoSeason = 0;
  let screenData = {};     // whatever the open screen last loaded
  let busy = '';           // an action in flight, by name
  let toastTimer;
  const drafts = {};       // typed-in field values, kept across a redraw

  const ERRORS = {
    wrong_pin: b => `Wrong PIN. ${b.triesLeft} tr${b.triesLeft === 1 ? 'y' : 'ies'} left before it locks for an hour.`,
    locked: () => 'Too many wrong PINs. Locked for an hour.',
    not_configured: () => "That isn't set up on the Worker yet.",
    founders_only: () => 'Only Brad and Jon can change who is a commissioner.',
    founder_locked: () => "Brad and Jon are commissioners for good. That can't be changed.",
    no_devices: () => 'Nobody has notifications on for that yet.',
    unreadable_playlist: () => "Couldn't read that playlist. Check the link and that it isn't private.",
    bad_playlist: () => 'That is not a playlist link or id.',
    cooldown: b => `That was just started. Try again in ${b.retryAfterSeconds}s.`,
  };

  async function call(action, extra = {}, path = '/admin') {
    let res, out = {};
    try {
      const body = { action, ...extra };
      if (access === 'pin') body.pin = store.get(PIN_KEY);
      res = await fetch(WORKER_URL + path, { method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders() }, body: JSON.stringify(body) });
      out = await res.json().catch(() => ({}));
    } catch {
      res = null;
    }
    if (res && res.ok) return out;
    throw { ...out, message: res && ERRORS[out.error] ? ERRORS[out.error](out) : `Couldn't reach the Worker (${res ? out.error || res.status : 'no connection'}). Try again.` };
  }
  // A guard for every action: a lost sign-in or a wrong PIN sends you back to the PIN box.
  function lostAccess(err) {
    if (err && (err.error === 'wrong_pin' || err.error === 'pin_needed')) {
      if (err.error === 'wrong_pin') store.set(PIN_KEY, '');
      access = '';
      showPin(err.error === 'wrong_pin' ? err.message : '');
      return true;
    }
    return false;
  }

  // ---------- Helpers ----------
  const list = a => a.length < 3 ? a.join(' and ') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  const etDay = ms => new Date(ms).toLocaleString('en-US', { timeZone: 'America/New_York', weekday: 'short', hour: 'numeric' }).replace(',', '');
  function when(ts) {
    if (!ts) return '';
    const d = new Date(ts), now = new Date();
    const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    if (d.toDateString() === now.toDateString()) return 'Today ' + time;
    if (now - d < 6 * 864e5) return d.toLocaleDateString([], { weekday: 'short' }) + ' ' + time;
    return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  }
  const ago = ts => {
    const m = Math.round((Date.now() - ts) / 60000);
    if (m < 2) return 'just now';
    if (m < 90) return `${m} minutes ago`;
    const h = Math.round(m / 60);
    return h < 36 ? `${h} hours ago` : `${Math.round(h / 24)} days ago`;
  };
  const draftText = at => {
    const d = new Date(at + ':00');
    return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) + ' · ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  };
  const signedIn = m => m.web + m.app > 0;
  const where = m => m.web && m.app ? 'website and app' : m.app ? 'app' : 'website';
  const linkFor = m => new URL('./', location.href).href + '#k=' + m.key;
  const textFor = m => `${m.manager}, tap to sign in to Retirement League:\n${linkFor(m)}\n\nIt only works for you, so keep it to yourself.`;

  function toast(t) {
    $('cm-toast').innerHTML = `<div class="cm-toast">${esc(t)}</div>`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $('cm-toast').innerHTML = ''; }, 2400);
  }
  const rowLink = (href, name, sub) => `<a class="cm-row item" href="${href}"><div class="cm-main"><div class="cm-name">${name}</div><div class="cm-sub">${sub}</div></div><span class="cm-chev">${I.chev}</span></a>`;
  const panel = (title, body, right, note) => `<section class="cm-section"><div class="glass"><div class="panel-title"><span>${title}</span>${right || ''}</div>${note ? `<div class="cm-note">${note}</div>` : ''}<div class="panel-body">${body}</div></div></section>`;
  const loading = '<div class="cm-empty">Loading…</div>';

  // ---------- The hub ----------
  const TOOLS = {
    parlay:   { label: 'Parlay Management', icon: I.ticket },
    tables:   { label: "Jon's Tables", icon: I.table },
    push:     { label: 'Notifications', icon: I.bell },
    announce: { label: 'Announcements', icon: I.mega },
    signins:  { label: 'Sign-Ins', icon: I.key },
    members:  { label: 'Member Accounts', icon: I.people },
    audit:    { label: 'Activity Log', icon: I.clock },
    videos:   { label: 'Recap Videos', icon: I.play },
    season:   { label: 'Season Setup', icon: I.cal },
    health:   { label: 'Site Health', icon: I.shield },
    refresh:  { label: 'Data Refresh', icon: I.sync },
    activity: { label: 'Activity', icon: I.chart },
  };
  const GROUPS = [
    ['Parlay', ['parlay', 'tables']],
    ['People', ['signins', 'members', 'push', 'announce', 'audit']],
    ['League', ['videos', 'season']],
    ['Site', ['health', 'refresh', 'activity']],
  ];
  const failing = () => ((health || (ov && ov.health)) ? (health || ov.health).checks : []).filter(c => !c.ok);
  const wfAt = file => { const c = ((health || (ov && ov.health)) ? (health || ov.health).checks : []).find(x => x.file === file); return c && c.at; };

  function status(k) {
    const P = ov.parlay;
    switch (k) {
      case 'parlay':
        if (!P) return { t: 'Legs, Sacko and final odds' };
        if (!P.windowOpen) return { t: `Next week's legs open Tue 12 AM` };
        return { t: P.locked ? `Locked · ${P.legsIn.length} of ${P.players.length} in` : `${P.legsIn.length} of ${P.players.length} in · locks ${etDay(P.locksAt)}` };
      case 'tables': return { t: "Season table and this week's legs" };
      case 'push': return { t: ov.push.people ? `${ov.push.people} of ${ov.managers} have it on` : 'Nobody has it on yet' };
      case 'announce': return { t: ov.announcement ? 'Showing on Live' : 'Nothing showing' };
      case 'signins': return { t: `${ov.signedIn} of ${ov.managers} signed in` };
      case 'members': return { t: plural(ov.commissioners, 'commissioner', 'commissioners') + ` · ${plural(ov.managers - ov.commissioners, 'manager', 'managers')}` };
      case 'audit': return { t: ov.last ? `${ov.last.who} · ${when(ov.last.ts)}` : 'Nothing yet' };
      case 'videos': return { t: ov.playlists.length ? `${ov.playlists[ov.playlists.length - 1]} · ${plural(ov.playlists.length, 'season', 'seasons')}` : 'No playlists yet' };
      case 'season': return { t: ov.draft ? `Draft ${draftText(ov.draft.at)}` : 'No draft date set' };
      case 'health': {
        const f = failing(), h = health || ov.health;
        if (!h) return { t: 'Not checked yet', dot: 'dim' };
        return f.length ? { t: f.length === 1 ? `${f[0].name}: ${f[0].detail}` : `${f.length} checks failing`, dot: 'red', bad: true } : { t: `All ${h.checks.length} checks passing`, dot: '' };
      }
      case 'refresh': { const at = wfAt('refresh_league_data.yml'); return { t: at ? `League data · ${ago(at)}` : 'Run any refresh now' }; }
      case 'activity': return { t: ov.visits ? `${plural(ov.visits.visitors, 'visitor', 'visitors')} today` : 'Visits and last seen' };
    }
    return { t: '' };
  }

  function needs() {
    const out = [], P = ov.parlay;
    const f = failing();
    if (f.length) out.push({ go: 'health', cls: 'is-loss', t: f.length === 1 ? `${f[0].name}: ${f[0].detail}` : `${f.length} site checks are failing`, s: f.length === 1 ? 'Tap to see all the checks' : list(f.map(c => c.name)) });
    if (P && P.windowOpen && !P.locked && P.missing.length) out.push({ go: 'parlay', cls: 'is-lead', t: plural(P.missing.length, 'leg', 'legs') + ' still missing', s: `${list(P.missing)} · locks ${etDay(P.locksAt)}` });
    if (ov.unsigned.length) out.push({ go: 'signins', cls: 'is-lead', t: ov.unsigned.length === 1 ? `${ov.unsigned[0]} isn't signed in` : `${ov.unsigned.length} managers aren't signed in`, s: ov.unsigned.length === 1 ? 'Send a sign-in text' : list(ov.unsigned) });
    return out;
  }

  function viewHub() {
    const n = needs();
    const strip = panel('Needs you',
      n.length ? `<div class="cm-rows">${n.map(x => `<a class="cm-row item ${x.cls}" href="#${x.go}"><div class="cm-main"><div class="cm-name">${esc(x.t)}</div><div class="cm-sub">${esc(x.s)}</div></div><span class="cm-chev">${I.chev}</span></a>`).join('')}</div>` : '<div class="cm-empty">Nothing needs you right now.</div>',
      `<span class="cm-count ${n.some(x => x.cls === 'is-loss') ? 'red' : n.length ? '' : 'green'}">${n.length || 'All clear'}</span>`);
    const groups = GROUPS.map(([g, keys]) => panel(g, `<div class="cm-rows">${keys.map(k => {
      const s = status(k), t = TOOLS[k];
      return `<a class="cm-row item" href="#${k}"><span class="cm-ic">${t.icon}</span><div class="cm-main"><div class="cm-name">${t.label}</div><div class="cm-sub clip${s.bad ? ' bad' : ''}">${s.dot !== undefined ? `<span class="cm-dot ${s.dot}"></span>` : ''}${esc(s.t)}</div></div><span class="cm-chev">${I.chev}</span></a>`;
    }).join('')}</div>`)).join('');
    return { title: 'Commissioner', html: strip + `<div class="cm-groups">${groups}</div>` };
  }

  // ---------- Parlay ----------
  function viewParlay() {
    const P = ov.parlay;
    if (!P) return { title: 'Parlay Management', html: panel('Legs', '<div class="cm-empty">Couldn\'t read this week\'s legs. Try again in a minute.</div>') };
    const cant = P.missing.filter(m => ov.unsigned.includes(m));
    const dots = P.players.map(n => `<span class="cm-mono ${P.legsIn.includes(n) ? 'in' : 'out'}" title="${esc(n)}">${esc(monogram(n))}</span>`).join('');
    let legs;
    if (!P.windowOpen) {
      legs = `<p class="cm-fine" style="margin-top:0">Legs for week ${P.week} open Tuesday at 12 AM ET and lock Thursday at 1 PM.</p>`;
    } else {
      legs = `<div class="cm-dots">${dots}</div>
        <p class="cm-fine">${P.missing.length ? `<b>Missing:</b> ${esc(list(P.missing))}.` : 'Every leg is in.'}${cant.length ? ` ${esc(list(cant))} ${cant.length > 1 ? "haven't" : "hasn't"} signed in, so they can't enter ${cant.length > 1 ? 'theirs' : 'one'} themselves.` : ''}</p>
        <p class="cm-fine">${P.locked ? 'Locked. Managers can no longer change their legs. You still can.' : `Locks ${esc(etDay(P.locksAt))} ET on its own. Lock now to shut the board once the bet is placed.`}</p>
        <div class="cm-wrap">${access === 'session' ? `<button type="button" class="cm-btn${P.locked ? ' dim' : ''}" data-act="lock"${busy === 'lock' ? ' disabled' : ''}>${P.locked ? 'Unlock legs' : 'Lock legs'}</button>` : ''}<a class="cm-btn dim" href="parlay-legs.html">Open the board</a></div>
        ${access === 'session' ? '' : '<p class="cm-fine">Sign in as a commissioner to lock the legs.</p>'}`;
    }
    const refreshed = wfAt('refresh_parlay_data.yml');
    const left = P.oddsLeft;
    const rows = `<div class="cm-rows">
      ${rowLink('parlay-legs.html', 'Enter or edit picks', 'Any manager, any week, or paste the whole week')}
      ${rowLink('parlay-legs.html', 'Sacko, final odds and payout', 'Set once the parlay is placed')}
      <div class="cm-line item"><div class="cm-main"><div class="cm-name">Refresh parlay data</div><div class="cm-sub">${busy === 'parlay' ? 'Refreshing…' : refreshed ? 'Last refreshed ' + ago(refreshed) : 'Re-reads the sheet and regrades'}</div></div><button type="button" class="cm-btn dim" data-act="run" data-which="parlay"${busy === 'parlay' ? ' disabled' : ''}>Refresh</button></div>
      <div class="cm-line item" style="display:block"><div style="display:flex;justify-content:space-between;gap:10px"><div class="cm-name">Odds credits</div><span class="cm-val">${left == null ? '—' : `${left} of 500`}</span></div><div class="cm-sub">${left == null ? 'Not checked yet this month' : 'Left this month for Hard Rock lines'}</div>${left == null ? '' : `<div class="cm-bar"><i style="width:${Math.max(0, Math.min(100, left / 5))}%"></i></div>`}</div>
    </div>`;
    return { title: 'Parlay Management', right: `<span class="cm-count ${P.locked ? 'dim' : P.windowOpen ? 'green' : 'dim'}">${P.locked ? 'Locked' : P.windowOpen ? 'Open' : 'Closed'}</span>`,
      html: `<div class="cm-split">${panel('Legs', legs, P.windowOpen ? `<span class="cm-count">${P.legsIn.length} of ${P.players.length} in</span>` : '')}${panel('Tools', rows)}</div>` };
  }

  // ---------- Jon's Tables (the season table and this week's legs, copyable) ----------
  let tScope = '';
  let tCopied = '';
  let tStatus = '';
  const fmtOdds = o => o === null || o === undefined ? '—' : (Math.round(o) > 0 ? '+' : '') + Math.round(o).toLocaleString();
  const fmtPct = n => n === null || n === undefined ? '—' : Number(n).toFixed(1) + '%';
  const toSuper = n => String(n).replace(/\d/g, d => '⁰¹²³⁴⁵⁶⁷⁸⁹'[d]);
  const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  function jonsRows(d, scope) {
    const st = d.stats[scope];
    if (!st) return [];
    const odds = Object.fromEntries(st.average_odds.map(r => [r.player, r.avg_odds]));
    const sackos = st.table_sackos || {};
    // individual_wl is already in win % order with ties broken on average odds.
    return st.individual_wl.map(w => ({ player: w.player, w: w.w, l: w.l, pct: w.win_pct, odds: odds[w.player] ?? null, sackos: sackos[w.player] ?? 0 }));
  }
  function betRows(d) {
    const cur = d.weeks[d.weeks.length - 1];
    const time = iso => { if (!iso) return 'TBD'; const t = new Date(iso), h = t.getHours(); return `${DAYS[t.getDay()]}. ${h % 12 || 12}:${String(t.getMinutes()).padStart(2, '0')}${h < 12 ? 'AM' : 'PM'}`; };
    // "{bet type}: {details}" -> "{bet type} | {details}"; Money Line / ML read Moneyline.
    const bet = p => {
      const x = String(p.pick || ''), i = x.indexOf(':');
      let type = (i < 0 ? x : x.slice(0, i)).trim();
      const rest = i < 0 ? '' : x.slice(i + 1).trim();
      if (/^(money\s*line|ml)$/i.test(type)) type = 'Moneyline';
      return rest ? `${type} | ${rest}` : type;
    };
    return d.players.filter(p => cur.picks[p]).map(p => [p, cur.picks[p]])
      .sort((a, b) => (a[1].gametime || '9999').localeCompare(b[1].gametime || '9999'))
      .map(([name, p]) => [name, bet(p), fmtOdds(p.odds), time(p.gametime), p.result || 'Pending']);
  }
  function viewTables() {
    const d = screenData.tables;
    if (!d) return { title: "Jon's Tables", html: panel("Jon's Table", loading) };
    if (d.error || !d.weeks) return { title: "Jon's Tables", html: panel("Jon's Table", '<div class="cm-empty">Couldn\'t read the parlay stats. Try again in a minute.</div>') };
    const cur = d.weeks[d.weeks.length - 1];
    const scopes = ['all', ...[...(d.years || [])].sort((a, b) => b - a).map(String)];
    if (!tScope || !d.stats[tScope]) tScope = String(cur.year);
    const rows = jonsRows(d, tScope).map(r => `<tr><td>${esc(r.player)}${r.sackos ? `<sup>${r.sackos}</sup>` : ''}</td><td>${fmtOdds(r.odds)}</td><td>${r.w} - ${r.l}</td><td>${fmtPct(r.pct)}</td></tr>`).join('');
    const pills = `<div class="cm-pills" role="group" aria-label="Season">${scopes.map(x => `<button type="button" class="cm-pill${x === tScope ? ' on' : ''}" data-act="tscope" data-scope="${x}" aria-pressed="${x === tScope}">${x === 'all' ? 'All Time' : x}</button>`).join('')}</div>`;
    const tools = `<div class="cm-tools"><button type="button" class="cm-btn dim" data-act="trefresh"${busy === 'trefresh' || tStatus ? ' disabled' : ''}>Refresh Data</button><button type="button" class="cm-btn dim" data-act="tcopy" data-which="j">${tCopied === 'j' ? 'Copied!' : 'Copy All'}</button></div>`;
    const jon = panel("Jon's Table", `${pills}<div class="cm-table-wrap"><table class="cm-table"><thead><tr><th>Team</th><th>Avg Odds</th><th>W - L</th><th>Win %</th></tr></thead><tbody>${rows}</tbody></table></div>${tStatus ? `<p class="cm-fine">${esc(tStatus)}</p>` : ''}`, tools);
    const bets = betRows(d).map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('');
    const pt = panel('Parlay Table', `<div class="cm-table-wrap" style="margin-top:0"><table class="cm-table bets"><thead><tr><th>Manager</th><th>Bet</th><th>Odds</th><th>Game Time</th><th>Result</th></tr></thead><tbody>${bets}</tbody></table></div>`,
      `<button type="button" class="cm-btn dim" data-act="tcopy" data-which="p">${tCopied === 'p' ? 'Copied!' : 'Copy All'}</button>`);
    return { title: "Jon's Tables", html: jon + pt };
  }
  function copyText(text, done) {
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { console.error('Copy failed', e); }
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(fallback);
    else fallback();
  }
  // Starts the parlay data refresh, then re-reads the stats once it has had time to finish.
  async function refreshTables() {
    await call('workflow_run', { which: 'parlay' });
    let left = 55;
    const tick = async () => {
      if (left <= 0) {
        tStatus = '';
        try { screenData.tables = await fetch(WORKER_URL + '/parlay-stats', { cache: 'no-store' }).then(r => r.json()); } catch { /* the old numbers stay */ }
        if (route() === 'tables') draw();
        return;
      }
      tStatus = `Refresh started. Updating in ${left}s…`;
      left -= 1;
      if (route() === 'tables') draw();
      setTimeout(tick, 1000);
    };
    tick();
  }

  // ---------- Announcements ----------
  function viewAnnounce() {
    const a = ov.announcement;
    const cur = a ? panel('Showing now', `<div class="item cm-box">${esc(a.text)}</div><p class="cm-fine">${a.until ? `Takes itself down after ${esc(a.until)}.` : 'Stays up until you take it down.'}</p><div class="cm-wrap"><button type="button" class="cm-btn danger" data-act="announce-clear"${busy ? ' disabled' : ''}>Take it down</button></div>`) : '';
    const form = panel(a ? 'Replace it' : 'New announcement', `
      <label class="cm-field"><span>Message</span><textarea class="cm-in" id="an-text" data-keep maxlength="200" placeholder="Draft is Sunday at 8">${esc(drafts['an-text'] || '')}</textarea></label>
      <label class="cm-field"><span>Show through (optional)</span><input class="cm-in" id="an-until" data-keep type="date" value="${esc(drafts['an-until'] || '')}"></label>
      <div class="cm-wrap"><button type="button" class="cm-btn solid" data-act="announce-post"${busy ? ' disabled' : ''}>Post to Live</button></div>`, '', 'Shows at the top of the Live page.');
    return { title: 'Announcements', html: `<div class="cm-split">${a ? cur : ''}${form}</div>` };
  }

  // ---------- Sign-Ins ----------
  function signinRow(m) {
    const name = esc(m.manager);
    if (asking === m.manager) {
      return `<div class="cm-line item is-loss"><div class="cm-main"><div class="cm-name">Reset ${name}?</div><div class="cm-sub">Their link and code stop working and they're signed out everywhere.</div></div>
        <div class="cm-btns"><button type="button" class="cm-btn dim" data-act="no">Cancel</button><button type="button" class="cm-btn danger" data-act="yes" data-who="${name}">Reset</button></div></div>`;

    const label = copied === m.manager ? 'Copied' : sent ? 'Resend' : 'Send';
    return `<div class="cm-line item"><div class="cm-main"><div class="cm-name">${name}</div>${sub}</div>
      <div class="cm-btns">${sent ? `<button type="button" class="cm-btn dim" data-act="ask" data-who="${name}">Reset</button>` : ''}<button type="button" class="cm-btn" data-act="send" data-who="${name}">${label}</button></div></div>`;

  function viewSignins() {

      html: `<section class="cm-section"><div class="glass"><div class="cm-note" style="padding-top:16px">Send opens your share sheet with that manager's text already written.</div><div class="panel-body"><div class="cm-cols">${ms.map(signinRow).join('')}</div></div></div></section>` };
  }

  // ---------- Member Accounts ----------
  function memberRow(m) {
    return `<button type="button" class="cm-row item" data-act="open" data-who="${esc(m.manager)}"><span class="cm-mono ${m.commissioner ? 'gold' : ''}">${esc(monogram(m.manager))}</span>
      <div class="cm-main"><div class="cm-name">${esc(m.manager)}</div><div class="cm-sub">${signedIn(m) ? 'Signed in: ' + where(m) : m.sentAt ? 'Sent' : 'Not sent'}${m.lastSeen ? ' · ' + esc(when(m.lastSeen)) : ''}</div></div>
      ${m.founder ? `<span class="cm-lock">${I.lock}</span>` : ''}<span class="cm-chev">${I.chev}</span></button>`;

      html: panel('Commissioners', `<div class="cm-cols">${c.map(memberRow).join('')}</div>`, '', 'Only Brad and Jon can add or remove commissioners, and neither of them can be removed.')
        + (p.length ? panel('Managers', `<div class="cm-cols">${p.map(memberRow).join('')}</div>`) : '') };
  }
  function drawSheet() {
    const host = $('cm-sheet');
    const m = people && people.managers.find(x => x.manager === sheet);
    if (!m) { host.innerHTML = ''; return; }
    const name = esc(m.manager);

    if (confirmRole === m.manager) {
      const making = !m.commissioner;
      perm = `<div class="cm-perm item ${making ? 'is-lead' : 'is-loss'}"><div class="cm-main"><div class="cm-name">${making ? `Make ${name} a commissioner?` : `Remove ${name} as a commissioner?`}</div>
        <div class="cm-sub">${making ? 'They can enter picks for anyone, lock legs and reset sign-ins.' : 'They go back to entering only their own leg.'}</div></div>
        <div class="cm-btns"><button type="button" class="cm-btn dim" data-act="role-no">Cancel</button><button type="button" class="cm-btn ${making ? 'solid' : 'danger'}" data-act="role-yes"${busy ? ' disabled' : ''}>${making ? 'Make' : 'Remove'}</button></div></div>`;
    } else {
      const locked = m.founder || !people.founder;
      const why = m.founder ? `${name} is a founding commissioner. This can't be changed.` : !people.founder ? 'Only Brad and Jon can change this.' : 'Enter picks for anyone, lock legs and reset sign-ins.';
      perm = `<div class="cm-perm item"><div class="cm-main"><div class="cm-name">Commissioner</div><div class="cm-sub">${why}</div></div>
        <button type="button" class="cm-sw" role="switch" aria-checked="${m.commissioner}" aria-label="Commissioner" data-act="role"${locked ? ' disabled' : ''}></button></div>`;
    }
    const sent = m.sentAt || signedIn(m);
    host.innerHTML = `<div class="scrim" data-act="close"></div><div class="sheet cm-sheet" role="dialog" aria-modal="true" aria-label="${name}">
      <div class="sheet-grab"><span></span></div>
      <div class="sheet-body"><div class="cm-sheet-head"><div><b>${name}</b><span>${signedIn(m) ? 'Signed in: ' + where(m) : m.sentAt ? 'Text sent' : 'Not sent'}</span></div><button type="button" class="cm-btn dim" data-act="close">Done</button></div>
      <div class="cm-rows">${perm}</div>
      <div class="cm-wrap" style="margin-top:12px"><button type="button" class="cm-btn" data-act="send" data-who="${name}">${copied === m.manager ? 'Copied' : sent ? 'Resend sign-in text' : 'Send sign-in text'}</button>${sent ? `<button type="button" class="cm-btn dim" data-act="reset-now" data-who="${name}">Reset sign-in</button>` : ''}</div></div></div>`;
  }

  // ---------- Notifications ----------
  const TEMPLATES = [
    ['Legs lock soon', 'Parlay legs lock Thursday at 1 PM', 'Enter your leg on the Parlay tab.'],
    ['Lineups', 'Set your lineup', 'Games start soon.'],
    ['Custom', '', ''],
  ];
  function viewPush() {
    const d = screenData.push;
    if (!d) return { title: 'Notifications', html: panel('Send', loading) };
    const byMe = Object.fromEntries(d.subs.map(s => [s.me.toLowerCase(), s]));
    const on = names.filter(n => byMe[n.toLowerCase()]);
    const total = d.subs.reduce((n, s) => n + s.devices, 0);
    const to = drafts['pu-to'] || 'all';
    const people_ = to === 'all' ? on.length : 1;
    const send = `<div class="cm-pills" role="group" aria-label="Start from">${TEMPLATES.map((t, i) => `<button type="button" class="cm-pill" data-act="template" data-i="${i}">${t[0]}</button>`).join('')}</div>
      <label class="cm-field"><span>Title</span><input class="cm-in" id="pu-title" data-keep maxlength="60" value="${esc(drafts['pu-title'] || '')}" autocomplete="off"></label>
      <label class="cm-field"><span>Message</span><textarea class="cm-in" id="pu-body" data-keep maxlength="180" style="min-height:70px">${esc(drafts['pu-body'] || '')}</textarea></label>
      <label class="cm-field"><span>To</span><select class="cm-in" id="pu-to" data-keep><option value="all"${to === 'all' ? ' selected' : ''}>Everyone (${plural(on.length, 'person', 'people')})</option>${on.map(n => `<option value="${esc(n)}"${to === n ? ' selected' : ''}>${esc(n)}</option>`).join('')}</select></label>
      ${confirmPush ? `<div class="cm-line item is-lead" style="margin-top:14px"><div class="cm-main"><div class="cm-name">Send to ${to === 'all' ? plural(people_, 'person', 'people') : esc(to)}?</div><div class="cm-sub">It goes out right away and can't be taken back.</div></div><div class="cm-btns"><button type="button" class="cm-btn dim" data-act="push-no">Cancel</button><button type="button" class="cm-btn solid" data-act="push-yes"${busy ? ' disabled' : ''}>Send</button></div></div>`
        : `<div class="cm-wrap"><button type="button" class="cm-btn solid" data-act="push-ask"${busy ? ' disabled' : ''}>Send</button></div>`}`;
    const who = `<div class="cm-cols">${names.map(n => {
      const s = byMe[n.toLowerCase()];
      return `<div class="cm-line item"><div class="cm-main"><div class="cm-name">${esc(n)}</div><div class="cm-sub${s ? ' in' : ''}">${s ? plural(s.devices, 'device', 'devices') : 'Not on'}</div></div></div>`;
    }).join('')}</div>`;
    const recent = d.recent.length ? `<div class="cm-rows">${d.recent.map(r => `<div class="cm-line item"><div class="cm-main"><div class="cm-name">${esc(r.text)}</div><div class="cm-sub">${esc(r.who)} · ${esc(when(r.ts))}</div></div></div>`).join('')}</div>` : '<div class="cm-empty">Nothing sent from here yet.</div>';
    return { title: 'Notifications', right: `<span class="cm-count">${plural(total, 'device', 'devices')}</span>`,
      html: `<div class="cm-split">${panel('Send', send, '', 'Goes to the Home Screen app, whatever notifications each person has turned on.')}<div>${panel('Who has it on', who)}${panel('Sent lately', recent)}</div></div>` };
  }

  // ---------- Activity Log ----------
  function viewAudit() {
    const d = screenData.log;
    if (!d) return { title: 'Activity Log', html: panel('Latest', loading) };
    return { title: 'Activity Log', html: panel('Latest', d.length ? `<div class="cm-cols">${d.map(r => `<div class="cm-line item"><div class="cm-main"><div class="cm-name">${esc(r.text)}</div><div class="cm-sub">${esc(r.who)} · ${esc(when(r.ts))}</div></div></div>`).join('')}</div>` : '<div class="cm-empty">Nothing yet. Resets, role changes, locks and sends show up here.</div>') };
  }

  // ---------- Recap Videos ----------
  function viewVideos() {
    const d = screenData.videos;
    if (!d) return { title: 'Recap Videos', html: panel('Playlists', loading) };
    const seasons = d.playlists;
    const pl = `<div class="cm-rows">${seasons.length ? seasons.map(p => `<div class="cm-line item${p.season === videoSeason ? ' is-lead' : ''}"><div class="cm-main"><div class="cm-name">${p.season}</div><div class="cm-sub">${p.saved ? 'Saved here' : 'Set up on the Worker'}</div></div>
      <div class="cm-btns">${p.saved ? `<button type="button" class="cm-btn dim" data-act="video-remove" data-season="${p.season}">Remove</button>` : ''}<button type="button" class="cm-btn" data-act="video-pick" data-season="${p.season}">Videos</button></div></div>`).join('') : '<div class="cm-empty">No playlists yet.</div>'}</div>`;
    const vids = screenData.videoList;
    const vl = !videoSeason ? '' : !vids ? panel(`${videoSeason} videos`, loading)
      : panel(`${videoSeason} videos`, vids.length ? `<div class="cm-rows">${vids.map(v => `<div class="cm-line item"><div class="cm-main"><div class="cm-name"${v.hidden ? ' style="color:var(--text-dim)"' : ''}>${esc(v.title)}</div><div class="cm-sub">${v.hidden ? 'Hidden from managers' : 'Showing'}</div></div><div class="cm-btns"><button type="button" class="cm-btn dim" data-act="video-hide" data-id="${esc(v.id)}" data-hidden="${v.hidden ? 0 : 1}" data-title="${esc(v.title)}">${v.hidden ? 'Show' : 'Hide'}</button></div></div>`).join('')}</div>` : '<div class="cm-empty">That playlist has no videos.</div>');
    const year = drafts['vp-season'] || String(new Date().getFullYear());
    const add = panel('Add or replace a playlist', `
      <label class="cm-field"><span>Season</span><input class="cm-in" id="vp-season" data-keep inputmode="numeric" maxlength="4" value="${esc(year)}" autocomplete="off"></label>
      <label class="cm-field"><span>YouTube playlist link</span><input class="cm-in" id="vp-link" data-keep value="${esc(drafts['vp-link'] || '')}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://www.youtube.com/playlist?list=…"></label>
      <div class="cm-wrap"><button type="button" class="cm-btn solid" data-act="video-save"${busy ? ' disabled' : ''}>Save playlist</button></div>`, '', 'Only signed-in managers can see these videos. The link never goes in the site\'s files.');
    return { title: 'Recap Videos', html: `<div class="cm-split"><div>${panel('Playlists', pl)}${vl}</div>${add}</div>` };
  }

  // ---------- Season Setup ----------
  function viewSeason() {
    const d = ov.draft;
    const val = drafts['se-draft'] !== undefined ? drafts['se-draft'] : (d ? d.at : '');
    return { title: 'Season Setup', html: panel('Draft', `
      <label class="cm-field"><span>Date and time (Eastern)</span><input class="cm-in" id="se-draft" data-keep type="datetime-local" value="${esc(val)}"></label>
      <div class="cm-wrap"><button type="button" class="cm-btn solid" data-act="draft-save"${busy ? ' disabled' : ''}>Save</button>${d ? '<button type="button" class="cm-btn dim" data-act="draft-clear"' + (busy ? ' disabled' : '') + '>Clear</button>' : ''}</div>`, d ? `<span class="cm-count">${esc(draftText(d.at))}</span>` : '', 'Shows on the Live page until it passes.') };
  }

  // ---------- Site Health and Data Refresh ----------
  function viewHealth() {
    const h = health || ov.health;
    const checks = h ? h.checks : [];
    const bad = checks.filter(c => !c.ok).length;
    const body = checks.length ? `<div class="cm-cols">${checks.map(c => `<div class="cm-line item ${c.ok ? '' : 'is-loss'}"><div class="cm-main"><div class="cm-name">${esc(c.name)}</div><div class="cm-sub${c.ok ? '' : ' bad'}">${esc(c.detail)}</div></div><span class="cm-dot ${c.ok ? '' : 'red'}" style="margin:0 6px"></span></div>`).join('')}</div>` : '<div class="cm-empty">Checking…</div>';
    return { title: 'Site Health', right: checks.length ? `<span class="cm-count ${bad ? 'red' : 'green'}">${bad ? bad + ' failing' : checks.length + ' of ' + checks.length + ' passing'}</span>` : '',
      html: `<section class="cm-section"><div class="glass"><div class="cm-note" style="padding-top:16px">Checked every morning at 9 AM ET. Anyone with site health alerts on in their You sheet gets a push when something breaks, and again when it is fixed.${h ? ` Last checked ${esc(ago(h.at))}.` : ''}</div>
        <div class="panel-body">${body}<div class="cm-wrap"><button type="button" class="cm-btn dim" data-act="check"${busy === 'check' ? ' disabled' : ''}>${busy === 'check' ? 'Checking…' : 'Check now'}</button></div></div></div></section>` };
  }
  const RUNNABLE = [['refresh_league_data.yml', 'league'], ['refresh_franchise_data.yml', 'franchise'], ['update_history_d1.yml', 'history'], ['sync_scores_to_sheet.yml', 'scores'], ['refresh_parlay_data.yml', 'parlay']];
  function viewRefresh() {
    const h = health || ov.health;
    const rows = RUNNABLE.map(([file, which]) => {
      const c = h && h.checks.find(x => x.file === file);
      return c ? `<div class="cm-line item${c.ok ? '' : ' is-loss'}"><div class="cm-main"><div class="cm-name">${esc(c.name)}</div><div class="cm-sub${c.ok ? '' : ' bad'}">${esc(busy === which ? 'Starting…' : c.detail)}</div></div><button type="button" class="cm-btn dim" data-act="run" data-which="${which}"${busy === which ? ' disabled' : ''}>Run now</button></div>` : '';
    }).join('');
    return { title: 'Data Refresh', html: panel('Workflows', h ? `<div class="cm-cols">${rows}</div>` : '<div class="cm-empty">Checking…</div>', '', 'Each one runs on its own schedule. Run now starts it right away; it takes a minute or two to finish.') };
  }

  // ---------- Activity ----------
  // "Brad, Jon, 2 guests": who, with a guest count for browsers that never signed in.
  const whoText = (names, guests, nobody) => {
    const parts = [...names, ...(guests ? [guests === 1 ? 'Guest' : `${guests} guests`] : [])];
    return parts.length ? parts.join(', ') : nobody;
  };
  function viewActivity() {
    const d = screenData.activity;
    if (!d) return { title: 'Activity', html: panel('Visits', loading) };
    const s = d.stats, w = d.who;
    const days = s && s.days ? [...s.days].reverse() : [];
    const max = Math.max(1, ...days.map(x => x.visitors));
    const count = g => g.names.length + g.guests;
    const tiles = s ? `<div class="cm-tiles">
        <div class="item cm-tile"><b>${w ? count(w.visitors) : s.visitorsToday}</b><span>Visitors today</span>${w ? `<small>${esc(whoText(w.visitors.names, w.visitors.guests, 'Nobody yet'))}</small>` : ''}</div>
        <div class="item cm-tile"><b>${s.viewsToday}</b><span>Page views today</span></div>
        <div class="item cm-tile"><b>${w ? count(w.here) : s.activeNow}</b><span>Here now</span>${w ? `<small>${esc(whoText(w.here.names, w.here.guests, 'Nobody'))}</small>` : ''}</div></div>
      <div class="cm-rows" style="margin-top:14px">${days.map(x => `<div class="cm-day"><span>${new Date(x.day + 'T12:00:00').toLocaleDateString([], { weekday: 'short', day: 'numeric' })}</span><div class="cm-bar"><i style="width:${(x.visitors / max) * 100}%"></i></div><em>${x.visitors}</em></div>`).join('')}</div>` : '<div class="cm-empty">Visit counts aren\'t available.</div>';
    const pages = w ? w.pages : (s && s.topPages ? s.topPages.map(p => ({ ...p, who: [], guests: 0 })) : []);
    const top = pages.length ? `<div class="cm-rows">${pages.map(p => `<div class="cm-line item"><div class="cm-main"><div class="cm-name">${esc(p.page)}</div>${w ? `<div class="cm-sub">${esc(whoText(p.who.map(x => x.views > 1 ? `${x.name} ×${x.views}` : x.name), p.guests, ''))}</div>` : ''}</div><span class="cm-val">${p.views}</span></div>`).join('')}</div>` : '<div class="cm-empty">No views yet today.</div>';
    const seen = Object.fromEntries(d.managers.map(m => [m.manager, m]));
    const last = (w && w.lastVisit) || {};
    const mrows = `<div class="cm-cols">${names.map(n => {
      const at = Math.max(last[n] || 0, (seen[n] && seen[n].seen) || 0);
      return `<div class="cm-line item"><div class="cm-main"><div class="cm-name">${esc(n)}</div><div class="cm-sub${at ? ' in' : ''}">${at ? 'Here ' + esc(when(at)) : 'Never signed in'}</div></div></div>`;
    }).join('')}</div>`;
    return { title: 'Activity', html: `<div class="cm-split"><div>${panel('Visits, last 7 days', tiles)}${panel('Top pages today', top)}</div>${panel('Managers', mrows)}</div>` };
  }

  // ---------- Drawing ----------
  const VIEWS = { hub: viewHub, parlay: viewParlay, tables: viewTables, announce: viewAnnounce, signins: viewSignins, members: viewMembers, push: viewPush, audit: viewAudit, videos: viewVideos, season: viewSeason, health: viewHealth, refresh: viewRefresh, activity: viewActivity };
  const route = () => { const r = location.hash.slice(1); return VIEWS[r] ? r : 'hub'; };

  function draw() {
    if (!access || !ov) return;
    document.querySelectorAll('#cm-main [data-keep]').forEach(el => { drafts[el.id] = el.value; });
    const r = route();
    const v = VIEWS[r]();
    $('cm-eyebrow').outerHTML = r === 'hub' ? '<div class="eyebrow" id="cm-eyebrow">Retirement League</div>' : `<a class="back" id="cm-eyebrow" href="#">${I.back}Commissioner</a>`;
    $('cm-title').textContent = v.title;
    $('cm-right').innerHTML = v.right || '';
    document.title = r === 'hub' ? 'Retirement League — Commissioner' : `Retirement League — ${v.title}`;
    const keep = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.keep !== undefined ? document.activeElement.id : '';
    const pos = keep ? [document.activeElement.selectionStart, document.activeElement.selectionEnd] : null;
    mainEl.innerHTML = v.html;
    document.querySelectorAll('#cm-main [data-keep]').forEach(el => { if (drafts[el.id] !== undefined && el.value !== drafts[el.id]) el.value = drafts[el.id]; });
    if (keep && $(keep)) { $(keep).focus(); try { $(keep).setSelectionRange(pos[0], pos[1]); } catch { /* date inputs have no selection */ } }
    drawSheet();
  }

  function showPin(msg) {
    $('cm-eyebrow').outerHTML = '<div class="eyebrow" id="cm-eyebrow">Retirement League</div>';
    $('cm-title').textContent = 'Commissioner';
    $('cm-right').innerHTML = '';
    mainEl.innerHTML = panel('PIN', `<form class="pin-row" id="pin-form" autocomplete="off" style="margin-top:0"><input class="pin-box" id="pin" type="password" inputmode="numeric" placeholder="PIN" aria-label="PIN" autocomplete="off"><button type="submit" class="cm-btn solid" style="height:40px;padding:0 18px">Unlock</button></form>
      ${msg ? `<p class="cm-fine bad" role="status">${esc(msg)}</p>` : ''}`, '', 'Signed-in commissioners skip this. Sign in from the You tab, or enter the PIN.');
    const pin = $('pin');
    pin.focus();
    $('pin-form').addEventListener('submit', e => {
      e.preventDefault();
      const v = pin.value.trim();
      if (!v) { pin.focus(); return; }
      store.set(PIN_KEY, v);
      access = 'pin';
      mainEl.innerHTML = loading;
      start();
    });
  }

  // ---------- Loading ----------
  async function loadNames() {
    const d = await fetch('data/league.json').then(r => r.json());
    const year = Math.max(...d.seasons.map(s => s.year));
    return [...new Set(d.seasons.filter(s => s.year === year).map(s => s.player))].sort((a, b) => a.localeCompare(b));
  }
  async function loadOverview() {
    ov = await call('overview', { names });
  }
  // What the open screen needs beyond the overview.
  async function loadScreen() {
    const r = route();
    try {
      if (r === 'signins' || r === 'members') { people = await call('list', { names }, '/auth/admin'); people.managers.sort((a, b) => a.manager.localeCompare(b.manager)); }
      else if (r === 'tables') { if (!screenData.tables) screenData.tables = await fetch(WORKER_URL + '/parlay-stats', { cache: 'no-store' }).then(x => x.json()); }
      else if (r === 'push') screenData.push = await call('push_info');
      else if (r === 'audit') screenData.log = (await call('log')).entries;
      else if (r === 'activity') screenData.activity = await call('activity');
      else if (r === 'videos') {
        screenData.videos = await call('videos_get');
        const seasons = screenData.videos.playlists.map(p => p.season);
        if (!seasons.includes(videoSeason)) videoSeason = seasons[seasons.length - 1] || 0;
        screenData.videoList = null;
        draw();
        if (videoSeason) screenData.videoList = (await call('videos_list', { season: videoSeason })).videos;
      }
      else if (r === 'health' || r === 'refresh') { draw(); health = await call('health'); }
      else if (r === 'hub') { await loadOverview(); draw(); if (!health || Date.now() - health.at > 10 * 60 * 1000) refreshHealth(); }
      else if (r === 'parlay' || r === 'season' || r === 'announce') await loadOverview();
    } catch (err) {
      if (lostAccess(err)) return;
      toast(err.message || "Couldn't load that. Try again.");
    }
    draw();
  }
  // Quietly, so the hub's health line is today's and not the morning's.
  async function refreshHealth() {
    try { health = await call('health'); if (route() === 'hub') draw(); } catch { /* the snapshot stands */ }
  }

  async function start() {
    try {
      if (!names.length) names = await loadNames();
      await loadOverview();
    } catch (err) {
      if (!lostAccess(err)) { access = ''; showPin(err.message || "Couldn't load the tools. Try again."); }
      return;
    }
    draw();
    if (route() !== 'hub') loadScreen(); else refreshHealth();
  }

  async function init() {
    const a = getAuth();
    if (a) {
      try {
        const res = await fetch(WORKER_URL + '/auth/me', { headers: authHeaders() });
        if (res.ok && (await res.json()).commissioner) access = 'session';
      } catch { /* try the PIN */ }
    }
    if (!access && store.get(PIN_KEY)) access = 'pin';
    if (!access) { showPin(''); return; }
    start();
  }

  // ---------- Actions ----------
  // Straight from the tap, with nothing awaited first: Safari only opens
  // the share sheet while it still counts the tap as the reason.
  function send(m) {
    const text = textFor(m);
    const done = () => { m.sentAt = Date.now(); call('sent', { manager: m.manager }, '/auth/admin').catch(() => {}); loadOverview().then(draw).catch(() => {}); };
    const copy = () => navigator.clipboard.writeText(text).then(() => {
      copied = m.manager; done(); draw();
      setTimeout(() => { if (copied === m.manager) { copied = ''; draw(); } }, 2000);
    }).catch(() => {});
    if (!navigator.share) { copy(); return; }
    navigator.share({ text }).then(() => { done(); draw(); }).catch(err => { if (!err || err.name !== 'AbortError') copy(); });
  }

  async function act(name, fn) {
    busy = name; draw();
    try { await fn(); } catch (err) { if (!lostAccess(err)) toast(err.message || 'That did not work. Try again.'); }
    busy = ''; draw();
  }

  document.addEventListener('click', async e => {
    const btn = e.target.closest('#cm-main [data-act], #cm-sheet [data-act]');
    if (!btn || !access) return;
    const a = btn.dataset.act, d = btn.dataset;
    const m = people && people.managers.find(x => x.manager === d.who);
    if (a === 'send' && m) send(m);
    else if (a === 'ask') { asking = d.who; draw(); }
    else if (a === 'no') { asking = ''; draw(); }
    else if (a === 'yes' && m) {
      await act('reset', async () => {
        const fresh = (await call('reset', { manager: m.manager }, '/auth/admin')).manager;
        people.managers = people.managers.map(x => x.manager === fresh.manager ? fresh : x);
        asking = '';
        await loadOverview();
      });
    }
    else if (a === 'reset-now' && m) {
      await act('reset', async () => {
        const fresh = (await call('reset', { manager: m.manager }, '/auth/admin')).manager;
        people.managers = people.managers.map(x => x.manager === fresh.manager ? fresh : x);
        await loadOverview();
        toast(`${m.manager} is signed out everywhere`);
      });
    }
    else if (a === 'open') { sheet = d.who; confirmRole = ''; drawSheet(); }
    else if (a === 'close') { sheet = ''; confirmRole = ''; drawSheet(); }
    else if (a === 'role') { confirmRole = sheet; drawSheet(); }
    else if (a === 'role-no') { confirmRole = ''; drawSheet(); }
    else if (a === 'role-yes') {
      const who = people.managers.find(x => x.manager === sheet);
      await act('role', async () => {
        const make = !who.commissioner;
        await call('role', { manager: who.manager, commissioner: make }, '/auth/admin');
        who.commissioner = make;
        ov.commissioners = people.managers.filter(x => x.commissioner).length;
        confirmRole = '';
        toast(make ? `${who.manager} is now a commissioner` : `${who.manager} is no longer a commissioner`);
      });
      drawSheet();
    }
    else if (a === 'lock') {
      await act('lock', async () => {
        const res = await fetch(WORKER_URL + '/legs/lock', { method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders() }, body: JSON.stringify({ locked: !ov.parlay.locked }) });
        if (!res.ok) throw { message: "Couldn't change the lock. Try again." };
        await loadOverview();
        toast(ov.parlay.locked ? 'Legs locked for everyone else' : 'Legs unlocked');
      });
    }
    else if (a === 'run') {
      await act(d.which, async () => {
        await call('workflow_run', { which: d.which });
        toast('Started. Give it a minute or two.');
        call('health').then(h => { health = h; draw(); }).catch(() => {});
      });
    }
    else if (a === 'tscope') { tScope = d.scope; draw(); }
    else if (a === 'tcopy') {
      const data = screenData.tables;
      const lines = d.which === 'j'
        ? [['Team', 'Avg Odds', 'W - L', 'Win %']].concat(jonsRows(data, tScope).map(r => [r.sackos ? r.player + toSuper(r.sackos) : r.player, r.odds == null ? '' : fmtOdds(r.odds), `${r.w} - ${r.l}`, r.pct == null ? '' : r.pct.toFixed(1) + '%']))
        : [['Manager', 'Bet', 'Odds', 'Game Time', 'Result']].concat(betRows(data));
      copyText(lines.map(r => r.join('\t')).join('\n'), () => { tCopied = d.which; draw(); setTimeout(() => { tCopied = ''; if (route() === 'tables') draw(); }, 1200); });
    }
    else if (a === 'trefresh') await act('trefresh', refreshTables);
    else if (a === 'check') await act('check', async () => { health = await call('health'); });
    else if (a === 'announce-post') {
      const text = ($('an-text').value || '').trim();
      if (!text) { $('an-text').focus(); return; }
      await act('announce', async () => {
        await call('announce_set', { text, until: $('an-until').value });
        delete drafts['an-text']; delete drafts['an-until'];
        await loadOverview();
        toast('Posted to the Live page');
      });
    }
    else if (a === 'announce-clear') await act('announce', async () => { await call('announce_clear'); await loadOverview(); toast('Taken down'); });
    else if (a === 'draft-save') {
      const v = $('se-draft').value;
      if (!v) { $('se-draft').focus(); return; }
      await act('draft', async () => { await call('season_set', { draft: v }); delete drafts['se-draft']; await loadOverview(); toast('Draft date saved'); });
    }
    else if (a === 'draft-clear') await act('draft', async () => { await call('season_set', { draft: '' }); delete drafts['se-draft']; await loadOverview(); toast('Draft date cleared'); });
    else if (a === 'template') {
      const t = TEMPLATES[Number(d.i)];
      drafts['pu-title'] = t[1]; drafts['pu-body'] = t[2]; confirmPush = false; draw();
      $('pu-title').focus();
    }
    else if (a === 'push-ask') {
      drafts['pu-title'] = $('pu-title').value; drafts['pu-body'] = $('pu-body').value; drafts['pu-to'] = $('pu-to').value;
      if (!drafts['pu-title'].trim()) { $('pu-title').focus(); return; }
      confirmPush = true; draw();
    }
    else if (a === 'push-no') { confirmPush = false; draw(); }
    else if (a === 'push-yes') {
      await act('push', async () => {
        const out = await call('push_send', { title: drafts['pu-title'], body: drafts['pu-body'], to: drafts['pu-to'] || 'all' });
        confirmPush = false;
        delete drafts['pu-title']; delete drafts['pu-body'];
        screenData.push = await call('push_info');
        toast(`Sent to ${plural(out.sent, 'device', 'devices')}`);
      });
    }
    else if (a === 'video-pick') {
      videoSeason = Number(d.season); screenData.videoList = null; draw();
      try { screenData.videoList = (await call('videos_list', { season: videoSeason })).videos; } catch (err) { if (!lostAccess(err)) toast(err.message); }
      draw();
    }
    else if (a === 'video-hide') {
      await act('video', async () => {
        await call('videos_hide', { id: d.id, hidden: d.hidden === '1', title: d.title });
        const v = screenData.videoList.find(x => x.id === d.id); if (v) v.hidden = d.hidden === '1';
      });
    }
    else if (a === 'video-remove') {
      await act('video', async () => {
        await call('videos_remove', { season: d.season });
        screenData.videos = await call('videos_get');
        toast(`Removed the saved ${d.season} playlist`);
      });
    }
    else if (a === 'video-save') {
      const season = $('vp-season').value.trim(), playlist = $('vp-link').value.trim();
      if (!/^\d{4}$/.test(season)) { $('vp-season').focus(); return; }
      if (!playlist) { $('vp-link').focus(); return; }
      await act('video', async () => {
        const out = await call('videos_set', { season, playlist });
        delete drafts['vp-link'];
        videoSeason = Number(season);
        screenData.videos = await call('videos_get');
        screenData.videoList = null;
        toast(`Saved the ${season} playlist (${plural(out.count, 'video', 'videos')})`);
        call('videos_list', { season }).then(r => { screenData.videoList = r.videos; draw(); }).catch(() => {});
      });
    }
  });

  document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheet) { sheet = ''; confirmRole = ''; drawSheet(); } });
  window.addEventListener('hashchange', () => {
    sheet = ''; confirmRole = ''; asking = ''; confirmPush = false;
    if (!access) return;
    draw();
    window.scrollTo(0, 0);
    loadScreen();
  });
  window.addEventListener('rl-auth', () => { access = ''; init(); });

  init();
})();
</script>
