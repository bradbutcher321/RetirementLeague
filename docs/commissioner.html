  // ---------- Site & Data (audit VIII #17) ----------
  // The checks, with Run now on each workflow, the health alert switch, and
  // what commissioners have done lately.
  const RUNNABLE = { 'refresh_league_data.yml': 'league', 'refresh_franchise_data.yml': 'franchise', 'update_history_d1.yml': 'history', 'sync_scores_to_sheet.yml': 'scores', 'refresh_parlay_data.yml': 'parlay' };
  function viewSite() {
    const h = health || ov.health;
    const checks = h ? h.checks : [];
    const bad = checks.filter(c => !c.ok).length;
    const body = checks.length ? `<div class="cm-cols">${checks.map(c => {
      const which = RUNNABLE[c.file];
      return `<div class="cm-line item ${c.ok ? '' : 'is-loss'}"><div class="cm-main"><div class="cm-name"><span class="cm-dot ${c.ok ? '' : 'red'}"></span>${esc(c.name)}</div><div class="cm-sub${c.ok ? '' : ' bad'}">${esc(busy === which ? 'Starting…' : c.detail)}</div></div>${which ? `<button type="button" class="cm-btn dim" data-act="run" data-which="${which}"${busy === which ? ' disabled' : ''}>Run now</button>` : ''}</div>`;
    }).join('')}</div>` : '<div class="cm-empty">Checking…</div>';
    const log = screenData.log;
    const logHtml = !log ? loading : log.length ? `<div class="cm-rows">${log.slice(0, 15).map(r => `<div class="cm-line item"><div class="cm-main"><div class="cm-name">${esc(r.text)}</div><div class="cm-sub">${esc(r.who || 'PIN')} · ${esc(when(r.ts))}</div></div></div>`).join('')}</div>` : '<div class="cm-empty">Nothing yet. Resets, role changes, locks and sends show up here.</div>';
    return { title: 'Site & Data', right: checks.length ? `<span class="cm-count ${bad ? 'red' : 'green'}">${bad ? bad + ' failing' : checks.length + ' of ' + checks.length + ' passing'}</span>` : '',
      html: panel('Checks', body + `<div class="cm-wrap"><button type="button" class="cm-btn dim" data-act="check"${busy === 'check' ? ' disabled' : ''}>${busy === 'check' ? 'Checking…' : 'Check now'}</button></div>`, '',
          `Checked every morning at 9 AM ET${h ? `, last ${esc(ago(h.at))}` : ''}. Run now starts a refresh right away; it takes a minute or two.`)
        + `<section class="cm-section"><div class="glass"><div class="panel-body">${healthAlertRow()}</div></div></section>`
        + panel('What commissioners did lately', logHtml) };
  }
  // The daily site health push, for this phone (the You sheet no longer has it).
  // It rides on the phone's notification subscription, so Notify me has to be on there first.
  function healthAlertRow() {
    const on = healthPush === 'on' && window.rlPush && rlPush.get('health');
    let sub = 'A push to this phone when a check fails, and when it recovers.';
    let off = false;
    if (access !== 'session') { sub = 'Sign in from the You tab to turn this on.'; off = true; }
    else if (healthPush === null) { sub = 'Checking this phone…'; off = true; }
    else if (healthPush === 'unsupported') { sub = "This browser can't show notifications."; off = true; }
    else if (healthPush === 'blocked') { sub = 'Notifications are blocked for this site in your browser settings.'; off = true; }
    else if (healthPush === 'off') { sub = 'Turn on Notify me in your You sheet first.'; off = true; }
    return `<div class="cm-line item"><div class="cm-main"><div class="cm-name">Site health alerts</div><div class="cm-sub">${esc(sub)}</div></div>
      <button type="button" class="cm-sw" role="switch" aria-checked="${on}" aria-label="Site health alerts" data-act="healthpush"${off || busy === 'healthpush' ? ' disabled' : ''}></button></div>`;
  }

  // ---------- Activity (audit VIII #20, #22) ----------
  // Two weeks of visits, a square per manager per day, with anyone away six
  // days or more called out; today's numbers; and pages by the names on the
  // tab bar, not their file names.
  const PAGE_NAMES = { dashboard: 'Live', feed: 'Feed', 'parlay-results': 'Parlay Results', 'parlay-legs': 'Parlay Legs', 'parlay-entry': 'Parlay Legs (old link)',
    standings: 'Standings', history: 'History', franchise: 'Franchise', 'head-to-head': 'Head to Head', videos: 'League Videos', 'game-records': 'Game Records',
    'parlay-stats': 'Parlay Stats', column: 'The Column', overview: 'League History', 'draft-board': 'Draft Board', race: 'Playoff Race', moves: 'Trades & Waivers',
    'rule-changes': 'Rule Changes', wrapped: 'Season Wrapped', players: 'Players', 'hall-of-fame': 'Hall of Fame', roster: 'Your Roster', 'secret-santa': 'Secret Santa', commissioner: 'Commissioner' };
  const pageName = p => PAGE_NAMES[p] || p;
  const whoText = (names_, guests, nobody) => {
    const parts = [...names_, ...(guests ? [guests === 1 ? 'Guest' : `${guests} guests`] : [])];
    return parts.length ? parts.join(', ') : nobody;
  };
  function gridHtml(d) {
    if (!d.grid || !d.today) return '';
    const end = Date.parse(d.today + 'T12:00:00Z');
    const days = Array.from({ length: 14 }, (_, i) => new Date(end - (13 - i) * 864e5).toISOString().slice(0, 10));
    const by = {};
    d.grid.forEach(r => { (by[r.manager] = by[r.manager] || {})[r.day] = r.views; });
    const tot = n => days.reduce((t, x) => t + ((by[n] || {})[x] || 0), 0);
    const last = n => days.filter(x => (by[n] || {})[x]).pop();
    const away = names.filter(n => { const l = last(n); return !l || (end - Date.parse(l + 'T12:00:00Z')) / 864e5 >= 6; });
    const cell = v => v ? `<span class="c" style="background:rgba(212,180,106,${Math.min(1, 0.2 + Math.log10(v + 1) / 2.1).toFixed(2)})" title="${v} page view${v === 1 ? '' : 's'}"></span>` : '<span class="c"></span>';
    const rows = names.slice().sort((a, b) => tot(b) - tot(a) || a.localeCompare(b)).map(n => `<span class="n${away.includes(n) ? ' away' : ''}">${esc(n)}</span>${days.map(x => cell((by[n] || {})[x])).join('')}<span class="tot">${tot(n)}</span>`).join('');
    const head = `<span></span>${days.map(x => `<span class="d">${'SMTWTFS'[new Date(x + 'T12:00:00Z').getUTCDay()]}</span>`).join('')}<span></span>`;
    const fmt = x => new Date(x + 'T12:00:00Z').toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
    const awayLine = away.length ? `<div class="cm-line item is-loss" style="margin-top:12px"><div class="cm-main"><div class="cm-name">Away 6+ days: ${esc(list(away))}</div><div class="cm-sub">${esc(away.map(n => `${n} ${last(n) ? 'last here ' + fmt(last(n)) : 'not here in two weeks'}`).join(' · '))}</div></div></div>` : '';
    return panel('Last 14 days', `<div class="ac-grid" role="img" aria-label="Page views per manager per day">${head}${rows}</div>${awayLine}`, '<span class="cm-count dim">Page views</span>');
  }
  function viewActivity() {
    const d = screenData.activity;
    if (!d) return { title: 'Activity', html: panel('Last 14 days', loading) };
    const s = d.stats, w = d.who;
    const count = g => g.names.length + g.guests;
    const tiles = s ? `<div class="cm-tiles">
        <div class="item cm-tile"><b>${w ? count(w.visitors) : s.visitorsToday}</b><span>Visitors today</span>${w ? `<small>${esc(whoText(w.visitors.names, w.visitors.guests, 'Nobody yet'))}</small>` : ''}</div>
        <div class="item cm-tile"><b>${s.viewsToday}</b><span>Page views today</span></div>
        <div class="item cm-tile"><b>${w ? count(w.here) : s.activeNow}</b><span>Here now</span>${w ? `<small>${esc(whoText(w.here.names, w.here.guests, 'Nobody'))}</small>` : ''}</div></div>` : '<div class="cm-empty">Visit counts aren\'t available.</div>';
    const pages = w ? w.pages : (s && s.topPages ? s.topPages.map(p => ({ ...p, who: [], guests: 0 })) : []);
    const top = pages.length ? `<div class="cm-rows">${pages.map(p => `<div class="cm-line item"><div class="cm-main"><div class="cm-name">${esc(pageName(p.page))}</div>${w ? `<div class="cm-sub">${esc(whoText(p.who.map(x => x.views > 1 ? `${x.name} ×${x.views}` : x.name), p.guests, ''))}</div>` : ''}</div><span class="cm-val">${p.views}</span></div>`).join('')}</div>` : '<div class="cm-empty">No views yet today.</div>';
    const p21 = d.pages21 && d.pages21.length ? `<div class="cm-rows">${d.pages21.map(p => `<div class="cm-line item"><div class="cm-main"><div class="cm-name">${esc(pageName(p.page))}</div><div class="cm-sub">${plural(p.people, 'browser', 'browsers')}</div></div><span class="cm-val">${p.views.toLocaleString()}</span></div>`).join('')}</div>` : '';
    return { title: 'Activity', html: gridHtml(d) + `<div class="cm-split"><div>${panel('Today', tiles)}${panel('Top pages today', top)}</div>${p21 ? panel('Pages, last 3 weeks', p21) : ''}</div>` };
  }

  // ---------- Feedback (worker/src/feedback.js) ----------
  // What managers sent from their You sheet. New first; tap one to set where
  // it stands and write a reply, which the sender sees under their form.
  const FB_KIND = { bug: 'Bug', improve: 'Improvement', feature: 'Feature idea', other: 'Other' };
  const FB_ST = [['new', 'New'], ['planned', 'Planned'], ['done', 'Done'], ['no', "Won't do"]];
  let fbOpen = 0, fbScope = 'open', fbAsk = 0;
  function viewFeedback() {
    const all = screenData.feedback;
    if (!all) return { title: 'Feedback', html: panel('From managers', loading) };
    const open = all.filter(f => f.status === 'new' || f.status === 'planned');
    const shown = fbScope === 'open' ? open : fbScope === 'closed' ? all.filter(f => f.status === 'done' || f.status === 'no') : all.slice();
    const order = { new: 0, planned: 1, done: 2, no: 3 };
    shown.sort((a, b) => (fbScope === 'open' ? order[a.status] - order[b.status] : 0) || b.id - a.id);
    const stName = s => (FB_ST.find(x => x[0] === s) || FB_ST[0])[1];
    const row = f => {
      const head = `<div class="cm-name">${esc(FB_KIND[f.kind] || 'Other')} · ${esc(f.manager)}</div><div class="cm-sub">${esc(when(f.ts))}${f.page ? ' · ' + esc(f.page.replace(/\.html$/, '')) : ''}</div>`;
      const chip = `<span class="cm-count ${f.status === 'new' ? '' : f.status === 'done' ? 'green' : 'dim'}">${stName(f.status)}</span>`;
      if (fbOpen !== f.id) {
        return `<button type="button" class="cm-fb item${f.status === 'new' ? ' is-lead' : ''}" data-act="fb-open" data-id="${f.id}"><div class="cm-fb-h"><div class="cm-main">${head}</div>${chip}</div><div class="cm-fb-t clamp">${esc(f.text)}</div>${f.reply ? `<div class="cm-fb-r">${esc(f.reply)}</div>` : ''}</button>`;
      }
      const id = 'fb-reply-' + f.id;
      return `<div class="cm-fb item open"><div class="cm-fb-h"><div class="cm-main">${head}</div><button type="button" class="cm-btn dim" data-act="fb-close">Close</button></div>
        <div class="cm-fb-t">${esc(f.text)}</div>
        <div class="cm-pills" role="radiogroup" aria-label="Status" style="margin-top:12px">${FB_ST.map(([k, l]) => `<button type="button" role="radio" class="cm-pill${f.status === k ? ' on' : ''}" aria-checked="${f.status === k}" data-act="fb-status" data-id="${f.id}" data-st="${k}"${busy ? ' disabled' : ''}>${l}</button>`).join('')}</div>
        <label class="cm-field"><span>Reply (${esc(f.manager)} sees it)</span><textarea class="cm-in" id="${id}" data-keep maxlength="400" placeholder="Fixed, thanks">${esc(drafts[id] !== undefined ? drafts[id] : f.reply)}</textarea></label>
        ${fbAsk === f.id ? `<div class="cm-line item is-loss" style="margin-top:12px"><div class="cm-main"><div class="cm-name">Delete this?</div><div class="cm-sub">It's gone for ${esc(f.manager)} too.</div></div><div class="cm-btns"><button type="button" class="cm-btn dim" data-act="fb-del-no">Cancel</button><button type="button" class="cm-btn danger" data-act="fb-del-yes" data-id="${f.id}"${busy ? ' disabled' : ''}>Delete</button></div></div>`
          : `<div class="cm-wrap"><button type="button" class="cm-btn solid" data-act="fb-save" data-id="${f.id}"${busy ? ' disabled' : ''}>Save reply</button><button type="button" class="cm-btn danger" data-act="fb-del" data-id="${f.id}">Delete</button></div>`}</div>`;
    };
    const scopes = [['open', `Open · ${open.length}`], ['closed', 'Closed'], ['all', 'All']];
    const pills = `<div class="cm-pills outline" role="group" aria-label="Show" style="margin-bottom:12px">${scopes.map(([k, l]) => `<button type="button" class="cm-pill${k === fbScope ? ' on' : ''}" data-act="fb-scope" data-scope="${k}" aria-pressed="${k === fbScope}">${l}</button>`).join('')}</div>`;
    return { title: 'Feedback',
      html: panel('From managers', pills + (shown.length ? `<div class="cm-rows">${shown.map(row).join('')}</div>` : `<div class="cm-empty">${fbScope === 'open' ? 'Nothing open.' : 'Nothing here yet.'}</div>`), '', 'Signed-in managers send these from You › Send feedback. Commissioners with notifications on get a push for each one.') };
  }
  async function fbUpdate(id, status) {
    const f = screenData.feedback.find(x => x.id === id);
    if (!f) return;
    const box = $('fb-reply-' + id);
    const reply = box ? box.value.trim() : f.reply;
    await call('feedback_set', { id, status, reply });
    f.status = status; f.reply = reply;
    delete drafts['fb-reply-' + id];
    ov.feedbackNew = screenData.feedback.filter(x => x.status === 'new').length;
  }

  // ---------- Drawing ----------
  const VIEWS = { hub: viewHub, parlay: viewParlay, tables: viewTables, managers: viewManagers, messages: viewMessages, activity: viewActivity, videos: viewVideos, season: viewSeason, feedback: viewFeedback, site: viewSite };
  const route = () => { let r = location.hash.slice(1); if (ALIAS[r]) { if (r === 'push') msgTab = 'push'; else if (r === 'announce') msgTab = 'banner'; r = ALIAS[r]; } return VIEWS[r] ? r : 'hub'; };

  function draw() {
    if (!access || !ov) return;
    document.querySelectorAll('#cm-main [data-keep]').forEach(el => { drafts[el.id] = el.value; });
    const r = route();
    const v = VIEWS[r]();
    $('cm-eyebrow').outerHTML = r === 'hub' ? '<div class="eyebrow" id="cm-eyebrow">Retirement League</div>' : `<a class="hdr-back" id="cm-eyebrow" href="#" aria-label="Back to Commissioner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg><span>Commissioner</span></a>`;
    $('cm-title').textContent = v.title;
    $('cm-right').innerHTML = v.right || '';
    document.title = r === 'hub' ? 'Retirement League — Commissioner' : `Retirement League — ${v.title}`;
    const keep = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.keep !== undefined ? document.activeElement.id : '';
    const pos = keep ? [document.activeElement.selectionStart, document.activeElement.selectionEnd] : null;
    mainEl.innerHTML = v.html;
    document.querySelectorAll('#cm-main [data-keep]').forEach(el => { if (drafts[el.id] !== undefined && el.value !== drafts[el.id]) el.value = drafts[el.id]; });
    if (keep && $(keep)) { $(keep).focus(); try { $(keep).setSelectionRange(pos[0], pos[1]); } catch { /* date inputs have no selection */ } }
    drawSheet();
  }

  function showPin(msg) {
    $('cm-eyebrow').outerHTML = '<div class="eyebrow" id="cm-eyebrow">Retirement League</div>';
    $('cm-title').textContent = 'Commissioner';
    $('cm-right').innerHTML = '';
    mainEl.innerHTML = panel('PIN', `<form class="pin-row" id="pin-form" autocomplete="off" style="margin-top:0"><input class="pin-box" id="pin" type="password" inputmode="numeric" placeholder="PIN" aria-label="PIN" autocomplete="off"><button type="submit" class="cm-btn solid" style="height:40px;padding:0 18px">Unlock</button></form>
      ${msg ? `<p class="cm-fine bad" role="status">${esc(msg)}</p>` : ''}`, '', 'Signed-in commissioners skip this. Sign in from the You tab, or enter the PIN.');
    const pin = $('pin');
    pin.focus();
    $('pin-form').addEventListener('submit', e => {
      e.preventDefault();
      const v = pin.value.trim();
      if (!v) { pin.focus(); return; }
      store.set(PIN_KEY, v);
      access = 'pin';
      mainEl.innerHTML = loading;
      start();
    });
  }

  // ---------- Loading ----------
  async function loadNames() {
    const d = await fetch('data/league.json').then(r => r.json());
    const year = Math.max(...d.seasons.map(s => s.year));
    return [...new Set(d.seasons.filter(s => s.year === year).map(s => s.player))].sort((a, b) => a.localeCompare(b));
  }
  async function loadOverview() {
    ov = await call('overview', { names });
  }
  // What the open screen needs beyond the overview.
  async function loadScreen() {
    const r = route();
    try {
      if (r === 'managers') {
        const [list_, actv] = await Promise.all([call('list', { names }, '/auth/admin'), call('activity').catch(() => null), loadOverview()]);
        people = list_; people.managers.sort((a, b) => a.manager.localeCompare(b.manager));
        if (actv) screenData.activity = actv;
      }
      else if (r === 'tables') { if (!screenData.tables) screenData.tables = await fetch(WORKER_URL + '/parlay-stats', { cache: 'no-store' }).then(x => x.json()); }
      else if (r === 'messages') {
        draw();
        const [push, log] = await Promise.all([call('push_info'), call('log'), loadOverview()]);
        screenData.push = push; screenData.log = log.entries;
      }
      else if (r === 'activity') screenData.activity = await call('activity');
      else if (r === 'feedback') screenData.feedback = (await call('feedback_list')).items;
      else if (r === 'videos') {
        screenData.videos = await call('videos_get');
        const seasons = screenData.videos.playlists.map(p => p.season);
        if (!seasons.includes(videoSeason)) videoSeason = seasons[seasons.length - 1] || 0;
        screenData.videoList = null;
        draw();
        if (videoSeason) screenData.videoList = (await call('videos_list', { season: videoSeason })).videos;
      }
      else if (r === 'site') {
        if (window.rlPush) rlPush.state().then(st_ => { healthPush = st_; if (route() === 'site') draw(); });
        draw();
        call('log').then(x => { screenData.log = x.entries; if (route() === 'site') draw(); }).catch(() => {});
        health = await call('health');
      }
      else if (r === 'hub') { await loadOverview(); draw(); loadWeekStats(); if (!health || Date.now() - health.at > 10 * 60 * 1000) refreshHealth(); }
      else if (r === 'parlay' || r === 'season') await loadOverview();
    } catch (err) {
      if (lostAccess(err)) return;
      toast(err.message || "Couldn't load that. Try again.");
    }
    draw();
  }
  // The bet and results for the hub's timeline (the same read as Jon's Tables).
  async function loadWeekStats() {
    try { screenData.tables = await fetch(WORKER_URL + '/parlay-stats', { cache: 'no-store' }).then(x => x.json()); if (route() === 'hub') draw(); } catch { /* the timeline stops at the lock */ }
  }
  // Quietly, so the hub's health line is today's and not the morning's.
  async function refreshHealth() {
    try { health = await call('health'); if (route() === 'hub') draw(); } catch { /* the snapshot stands */ }
  }

  async function start() {
    try {
      if (!names.length) names = await loadNames();
      await loadOverview();
    } catch (err) {
      if (!lostAccess(err)) { access = ''; showPin(err.message || "Couldn't load the tools. Try again."); }
      return;
    }
    draw();
    if (route() !== 'hub') loadScreen(); else { refreshHealth(); loadWeekStats(); }
  }

  async function init() {
    const a = getAuth();
    if (a) {
      try {
        const res = await fetch(WORKER_URL + '/auth/me', { headers: authHeaders() });
        if (res.ok && (await res.json()).commissioner) access = 'session';
      } catch { /* try the PIN */ }
    }
    if (!access && store.get(PIN_KEY)) access = 'pin';
    if (!access) { showPin(''); return; }
    start();
  }

  // ---------- Actions ----------
  // Straight from the tap, with nothing awaited first: Safari only opens
  // the share sheet while it still counts the tap as the reason.
  function send(m) {
    const text = textFor(m);
    const done = () => { m.sentAt = Date.now(); call('sent', { manager: m.manager }, '/auth/admin').catch(() => {}); loadOverview().then(draw).catch(() => {}); };
    const copy = () => navigator.clipboard.writeText(text).then(() => {
      copied = m.manager; done(); draw();
      setTimeout(() => { if (copied === m.manager) { copied = ''; draw(); } }, 2000);
    }).catch(() => {});
    if (!navigator.share) { copy(); return; }
    navigator.share({ text }).then(() => { done(); draw(); }).catch(err => { if (!err || err.name !== 'AbortError') copy(); });
  }

  async function act(name, fn) {
    busy = name; draw();
    try { await fn(); } catch (err) { if (!lostAccess(err)) toast(err.message || 'That did not work. Try again.'); }
    busy = ''; draw();
  }

  document.addEventListener('click', async e => {
    const btn = e.target.closest('#cm-main [data-act], #cm-sheet [data-act]');
    if (!btn || !access) return;
    const a = btn.dataset.act, d = btn.dataset;
    const m = people && people.managers.find(x => x.manager === d.who);
    if (a === 'send' && m) send(m);
    else if (a === 'ask') { asking = d.who; draw(); }
    else if (a === 'no') { asking = ''; draw(); }
    else if (a === 'yes' && m) {
      await act('reset', async () => {
        const fresh = (await call('reset', { manager: m.manager }, '/auth/admin')).manager;
        people.managers = people.managers.map(x => x.manager === fresh.manager ? fresh : x);
        asking = '';
        await loadOverview();
      });
    }
    else if (a === 'reset-now' && m) {
      await act('reset', async () => {
        const fresh = (await call('reset', { manager: m.manager }, '/auth/admin')).manager;
        people.managers = people.managers.map(x => x.manager === fresh.manager ? fresh : x);
        await loadOverview();
        toast(`${m.manager} is signed out everywhere`);
      });
    }
    else if (a === 'open') { sheet = d.who; confirmRole = ''; drawSheet(); }
    else if (a === 'close') { sheet = ''; confirmRole = ''; drawSheet(); }
    else if (a === 'role') { confirmRole = sheet; drawSheet(); }
    else if (a === 'role-no') { confirmRole = ''; drawSheet(); }
    else if (a === 'role-yes') {
      const who = people.managers.find(x => x.manager === sheet);
      await act('role', async () => {
        const make = !who.commissioner;
        await call('role', { manager: who.manager, commissioner: make }, '/auth/admin');
        who.commissioner = make;
        ov.commissioners = people.managers.filter(x => x.commissioner).length;
        confirmRole = '';
        toast(make ? `${who.manager} is now a commissioner` : `${who.manager} is no longer a commissioner`);
      });
      drawSheet();
    }
    else if (a === 'lock') {
      await act('lock', async () => {
        const res = await fetch(WORKER_URL + '/legs/lock', { method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders() }, body: JSON.stringify({ locked: !ov.parlay.locked }) });
        if (!res.ok) throw { message: "Couldn't change the lock. Try again." };
        await loadOverview();
        const pr = ov.parlay.locked && ov.parlay.priced, changed = pr ? pr.legs.filter(x => x.how === 'updated').length : 0;
        toast(!ov.parlay.locked ? 'Legs unlocked' : pr ? `Legs locked · Hard Rock odds changed on ${plural(changed, 'leg', 'legs')}` : 'Legs locked for everyone else');
      });
    }
    else if (a === 'run') {
      await act(d.which, async () => {
        await call('workflow_run', { which: d.which });
        toast('Started. Give it a minute or two.');
        call('health').then(h => { health = h; draw(); }).catch(() => {});
      });
    }
    else if (a === 'nudge') { nudge = true; nudgeOff.clear(); nudgeArmed = 0; drawSheet(); }
    else if (a === 'nudge-close') { nudge = false; drawSheet(); }
    else if (a === 'nudge-who') { nudgeOff.has(d.who) ? nudgeOff.delete(d.who) : nudgeOff.add(d.who); nudgeArmed = 0; drawSheet(); }
    else if (a === 'nudge-share') { const who = ov.parlay.missing.filter(n => !nudgeOff.has(n)); shareOrCopy(nudgeText(who), 'nudge'); }
    else if (a === 'nudge-push') {
      if (Date.now() - nudgeArmed > 4000) { nudgeArmed = Date.now(); drawSheet(); setTimeout(() => { if (nudge) drawSheet(); }, 4100); return; }
      nudgeArmed = 0;
      const reach = ov.parlay.missing.filter(n => !nudgeOff.has(n) && pushOn(n));
      await act('nudge', async () => {
        const out = await call('push_send', { title: "Your parlay leg isn't in", body: `Legs lock ${etDay(ov.parlay.locksAt)} ET. Tap to put yours in.`, to: reach });
        toast(`Pushed ${list(reach)} (${plural(out.sent, 'device', 'devices')})`);
      });
    }
    else if (a === 'mfilter') { mFilter = d.f; draw(); }
    else if (a === 'mtab') {
      msgTab = d.tab;
      if (d.tpl !== undefined) setDraft('gt-text', GT_TPL()[Number(d.tpl)][1]);
      draw();
    }
    else if (a === 'mpush') { setDraft('pu-to', d.who); msgTab = 'push'; sheet = ''; location.hash = '#messages'; }
    else if (a === 'howto') { shareOrCopy(howtoFor(d.who), 'howto:' + d.who); }
    else if (a === 'reset-ask') {
      if (asking !== d.who) { asking = d.who; drawSheet(); setTimeout(() => { if (asking === d.who) { asking = ''; drawSheet(); } }, 4000); return; }
      asking = '';
      await act('reset', async () => {
        const fresh = (await call('reset', { manager: m.manager }, '/auth/admin')).manager;
        people.managers = people.managers.map(x => x.manager === fresh.manager ? fresh : x);
        await loadOverview();
        toast(`${m.manager} is signed out everywhere`);
      });
    }
    else if (a === 'an-tpl') { setDraft('an-text', ANN_TPL()[Number(d.i)][1]); draw(); const t = $('an-text'); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }
    else if (a === 'an-again') { setDraft('an-text', annHistory()[Number(d.i)].text); window.scrollTo({ top: 0, behavior: 'smooth' }); draw(); }
    else if (a === 'an-until') { setDraft('an-until', d.v); draw(); }
    else if (a === 'gt-tpl') { setDraft('gt-text', GT_TPL()[Number(d.i)][1]); draw(); }
    else if (a === 'gt-share') { const t = $('gt-text'); const text = (t ? t.value : drafts['gt-text'] || '').trim(); if (!text) { if (t) t.focus(); return; } shareOrCopy(text, 'gt'); }
    else if (a === 'tscope') { tScope = d.scope; draw(); }
    else if (a === 'fb-scope') { fbScope = d.scope; fbOpen = 0; draw(); }
    else if (a === 'fb-open') { fbOpen = Number(d.id); fbAsk = 0; draw(); }
    else if (a === 'fb-close') { fbOpen = 0; fbAsk = 0; draw(); }
    else if (a === 'fb-status') await act('fb', async () => { await fbUpdate(Number(d.id), d.st); toast('Saved'); });
    else if (a === 'fb-save') await act('fb', async () => { const f = screenData.feedback.find(x => x.id === Number(d.id)); await fbUpdate(Number(d.id), f.status); toast('Reply saved'); });
    else if (a === 'fb-del') { fbAsk = Number(d.id); draw(); }
    else if (a === 'fb-del-no') { fbAsk = 0; draw(); }
    else if (a === 'fb-del-yes') await act('fb', async () => {
      await call('feedback_delete', { id: Number(d.id) });
      screenData.feedback = screenData.feedback.filter(x => x.id !== Number(d.id));
      fbOpen = 0; fbAsk = 0;
      ov.feedbackNew = screenData.feedback.filter(x => x.status === 'new').length;
      toast('Deleted');
    });
    else if (a === 'tcopy') {
      const data = screenData.tables;
      const lines = d.which === 'j'
        ? [['Team', 'Avg Odds', 'W - L', 'Win %']].concat(jonsRows(data, tScope).map(r => [r.sackos ? r.player + toSuper(r.sackos) : r.player, r.odds == null ? '' : fmtOdds(r.odds), `${r.w} - ${r.l}`, r.pct == null ? '' : r.pct.toFixed(1) + '%']))
        : [['Manager', 'Bet', 'Odds', 'Game Time', 'Result']].concat(betRows(data));
      copyText(lines.map(r => r.join('\t')).join('\n'), () => { tCopied = d.which; draw(); setTimeout(() => { tCopied = ''; if (route() === 'tables') draw(); }, 1200); });
    }
    else if (a === 'trefresh') await act('trefresh', refreshTables);
    else if (a === 'check') await act('check', async () => { health = await call('health'); });
    else if (a === 'healthpush') await act('healthpush', async () => { await rlPush.set('health', !rlPush.get('health')); toast(rlPush.get('health') ? 'Site health alerts on' : 'Site health alerts off'); });
    else if (a === 'announce-post') {
      const text = ($('an-text').value || '').trim();
      if (!text) { $('an-text').focus(); return; }
      await act('announce', async () => {
        await call('announce_set', { text, until: $('an-until').value });
        screenData.log = (await call('log')).entries;
        delete drafts['an-text']; delete drafts['an-until'];
        await loadOverview();
        toast('Posted to the Live page');
      });
    }
    else if (a === 'announce-clear') await act('announce', async () => { await call('announce_clear'); await loadOverview(); toast('Taken down'); });
    else if (a === 'draft-save') {
      const v = $('se-draft').value;
      if (!v) { $('se-draft').focus(); return; }
      await act('draft', async () => { await call('season_set', { draft: v }); delete drafts['se-draft']; await loadOverview(); toast('Draft date saved'); });
    }
    else if (a === 'draft-clear') await act('draft', async () => { await call('season_set', { draft: '' }); delete drafts['se-draft']; await loadOverview(); toast('Draft date cleared'); });
    else if (a === 'template') {
      const t = TEMPLATES[Number(d.i)];
      setDraft('pu-title', t[1]); setDraft('pu-body', t[2]); confirmPush = false; draw();
      $('pu-title').focus();
    }
    else if (a === 'push-ask') {
      drafts['pu-title'] = $('pu-title').value; drafts['pu-body'] = $('pu-body').value; drafts['pu-to'] = $('pu-to').value;
      if (!drafts['pu-title'].trim()) { $('pu-title').focus(); return; }
      confirmPush = true; draw();
    }
    else if (a === 'push-no') { confirmPush = false; draw(); }
    else if (a === 'push-yes') {
      await act('push', async () => {
        const out = await call('push_send', { title: drafts['pu-title'], body: drafts['pu-body'], to: drafts['pu-to'] || 'all' });
        confirmPush = false;
        delete drafts['pu-title']; delete drafts['pu-body'];
        screenData.push = await call('push_info');
        toast(`Sent to ${plural(out.sent, 'device', 'devices')}`);
      });
    }
    else if (a === 'video-pick') {
      videoSeason = Number(d.season); screenData.videoList = null; draw();
      try { screenData.videoList = (await call('videos_list', { season: videoSeason })).videos; } catch (err) { if (!lostAccess(err)) toast(err.message); }
      draw();
    }
    else if (a === 'video-hide') {
      await act('video', async () => {
        await call('videos_hide', { id: d.id, hidden: d.hidden === '1', title: d.title });
        const v = screenData.videoList.find(x => x.id === d.id); if (v) v.hidden = d.hidden === '1';
      });
    }
    else if (a === 'video-remove') {
      await act('video', async () => {
        await call('videos_remove', { season: d.season });
        screenData.videos = await call('videos_get');
        toast(`Removed the saved ${d.season} playlist`);
      });
    }
    else if (a === 'video-save') {
      const season = $('vp-season').value.trim(), playlist = $('vp-link').value.trim();
      if (!/^\d{4}$/.test(season)) { $('vp-season').focus(); return; }
      if (!playlist) { $('vp-link').focus(); return; }
      await act('video', async () => {
        const out = await call('videos_set', { season, playlist });
        delete drafts['vp-link'];
        videoSeason = Number(season);
        screenData.videos = await call('videos_get');
        screenData.videoList = null;
        toast(`Saved the ${season} playlist (${plural(out.count, 'video', 'videos')})`);
        call('videos_list', { season }).then(r => { screenData.videoList = r.videos; draw(); }).catch(() => {});
      });
    }
  });

  document.addEventListener('input', e => {
    if (e.target.id === 'an-text') { const pv = $('an-prev'); if (pv) pv.textContent = e.target.value.trim() || 'Your message shows here.'; drafts['an-text'] = e.target.value; }
    else if (e.target.id === 'an-until') {
      drafts['an-until'] = e.target.value;
      document.querySelectorAll('[data-act="an-until"]').forEach(b => { const on = b.dataset.v === e.target.value; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
    }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && (sheet || nudge)) { sheet = ''; nudge = false; confirmRole = ''; drawSheet(); } });
  window.addEventListener('hashchange', () => {
    sheet = ''; confirmRole = ''; asking = ''; confirmPush = false; nudge = false;
    if (!access) return;
    draw();
    window.scrollTo(0, 0);
    loadScreen();
  });
  window.addEventListener('rl-auth', () => { access = ''; init(); });

  init();
})();
</script>
</body>
</html>
