<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>html{background:#050505}</style>
<title>Retirement League — Rule Changes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The two font-family's woff2 files Google serves for the latin subset
     at the weights this site uses -- one variable-font file per family
     covers every weight declared, confirmed directly by fetching the
     stylesheet below and comparing each @font-face block's url(). Starts
     the actual font downloads immediately, in parallel with that
     stylesheet fetch, instead of waiting to discover these same URLs
     only after the stylesheet loads and is parsed -- avoids the
     fallback-to-webfont swap (FOUT) that otherwise shows on a slow or
     uncached load. If Google ever changes these hashed URLs, this just
     degrades to a wasted (unused) preload, not a correctness issue -- the
     stylesheet's own @font-face still fetches whatever the new URL is. -->
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/bigshouldersdisplay/v24/fC1_PZJEZG-e9gHhdI4-NBbfd2ys3SjJCx1czNDu.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=6">
<link rel="stylesheet" href="nav.css?v=4">
<style>
  /* Selector styling lives in theme.css -- only this page's spacing here. */
  .tab-row{ margin-bottom: 18px; }

  /* The card surface itself comes from theme.css's shared rule; clipped here
     so the quadrant hairlines stop at the card's rounded corners. */
  .rules-card{ overflow: hidden; }
  /* The season currently being played is the one state this card has. */
  .rules-card.is-current{ border-color: var(--lead-line); }
  .rules-head{ padding: 16px 20px 12px; border-bottom: 1px solid var(--line); }
  .rules-title{ font-family: var(--scoreboard); font-weight: 800; font-size: 1.5rem; }
  /* The four quadrants used to be painted a flat --surface (#111111) and
     separated by a 1px grid gap showing --line through from the parent.
     That flat fill covered the card's own #161616 -> #111111 gradient
     entirely, which is why this card read darker and deader than every
     other panel on the site. The cells are transparent now and the
     hairlines are drawn as pseudo-elements instead, so the gradient shows
     through exactly like it does elsewhere. */
  .rules-body{ display: grid; grid-template-columns: 1fr 1fr; }
  .rules-section{ padding: 16px 20px; position: relative; }
  /* Vertical rule between the two columns, only when there's a cell beside
     it -- an odd final section shouldn't trail a hairline into dead space. */
  .rules-section:nth-child(odd):has(+ .rules-section)::after{
    content: ''; position: absolute; top: 0; bottom: 0; right: 0; width: 1px; background: var(--line);
  }
  /* Horizontal rule above every row after the first. */
  .rules-section:nth-child(n+3)::before{
    content: ''; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: var(--line);
  }
  @media (max-width: 520px){
    .rules-body{ grid-template-columns: 1fr; }
    .rules-section:nth-child(odd):has(+ .rules-section)::after{ display: none; }
    .rules-section:nth-child(n+2)::before{
      content: ''; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: var(--line);
    }
  }
  .rules-section-title{ color: var(--gold); font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 10px; }
  /* Each setting is its own small chip (flex-wrapped) instead of a stacked
     list of label/value rows -- the same visual language as the Season
     Timeline's chips on Overview, applied here to settings instead of
     results. Diff state (changed/added/dropped) still reads at a glance
     via the chip's own tint, same logic as before, just not a full-width
     highlighted row any more. */
  .rules-chips{ display: flex; flex-wrap: wrap; gap: 6px; }
  .rules-chip{ display: inline-flex; align-items: baseline; gap: 4px; background: var(--item); border: 1px solid var(--item-line); border-radius: 999px; padding: 5px 12px; font-size: 0.84rem; color: var(--text); white-space: nowrap; }
  .rules-chip .label{ color: var(--text-dim); }
  .rules-chip.line-changed{ border-color: var(--lead-line); background: var(--lead-tint); }
  /* Added and changed share the gold accent; what separates them is the
     chip's own shape -- an added setting reads "+ 1 FLEX", a changed one
     reads "old -> new". */
  .rules-chip.line-added{ border-color: var(--lead-line); background: var(--lead-tint); color: var(--gold); }
  .rules-chip.line-dropped{ border-color: var(--loss-line); background: var(--loss-tint); }
  :root[data-accent="outline"] .rules-chip.line-changed,
  :root[data-accent="outline"] .rules-chip.line-added,
  :root[data-accent="outline"] .rules-chip.line-dropped{ background: var(--item); }
  .rules-chip.line-dropped .now{ color: var(--loss); }
  .rules-chip .was{ color: var(--text-dim); margin-right: 2px; }
  .rules-chip .now{ color: var(--gold); font-weight: 700; }
  .rules-footnote{ color: var(--text-dim); font-size: 0.76rem; margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); }

  .manager-chips{ display: flex; flex-wrap: wrap; gap: 6px; }
  .manager-chip{
    background: var(--item); border: 1px solid var(--item-line); color: var(--text);
    font-size: 0.82rem; font-weight: 600; padding: 4px 11px; border-radius: 999px;
  }
  .manager-chip.added{ background: var(--win-tint); border-color: var(--win-line); color: var(--turf); }
  .manager-chip.removed{ background: var(--loss-tint); border-color: var(--loss-line); color: var(--loss); }
  :root[data-accent="outline"] .manager-chip.added,
  :root[data-accent="outline"] .manager-chip.removed{ background: var(--item); }

  /* ---------- Timeline ----------
     Each year is its own glass panel sitting beside its dot on the rail,
     rather than bare chips floating on the page background -- same panel
     treatment every other page uses, with the rail kept so the run of
     years still reads as a chronology. */
  .timeline{ position: relative; padding-left: 30px; display: flex; flex-direction: column; gap: 14px; }
  .timeline::before{ content: ''; position: absolute; left: 8px; top: 14px; bottom: 14px; width: 2px; background: var(--line); }
  .timeline-item{ position: relative; }
  /* Sits level with the year title inside the panel, not the panel's edge. */
  .timeline-dot{ position: absolute; left: -26px; top: 22px; width: 9px; height: 9px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px rgba(212,180,106,0.5); }
  .timeline-year{ font-family: var(--scoreboard); font-weight: 800; font-size: 1.15rem; color: var(--gold); padding: 14px 18px 0; }
  .change-list{ display: flex; flex-direction: column; gap: 6px; padding: 10px 18px 16px; }
  /* The panel already groups these under their year, so each change needs
     no accent bar of its own. */
  .change-chip{ background: var(--item); border: 1px solid var(--item-line); padding: 8px 12px; font-size: 0.88rem; border-radius: 8px; }
  .change-chip-label{ color: var(--text-dim); margin-right: 4px; }
  .manager-delta{ display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; margin: 2px 3px 2px 0; }
  .manager-delta.in{ background: var(--win-tint); color: var(--turf); border: 1px solid var(--win-line); }
  .manager-delta.out{ background: var(--loss-tint); color: var(--loss); border: 1px solid var(--loss-line); }
  :root[data-accent="outline"] .manager-delta.in,
  :root[data-accent="outline"] .manager-delta.out{ background: none; }
</style>
</head>
<body>
  <div id="site-nav"></div>
  <div class="wrap">
    <header>
      <div class="header-row">
        <div>
          <div class="eyebrow">Retirement League</div>
          <h1>Rule Changes</h1>
        </div>
        <div class="updated-block">
          <div class="updated-label">Updated</div>
          <div class="updated-value" id="updated-at">—</div>
        </div>
      </div>
    </header>

    <section id="compare-section">
      <div class="tab-row" id="year-tab-row"></div>
      <div id="selected-container"><div class="loading-row">Loading rules…</div></div>
    </section>

    <section id="changes-section">
      <h2>Timeline of Changes</h2>
      <div id="changes-container"></div>
    </section>

    <footer>Rules and manager history from ESPN Fantasy · Money from the league sheet</footer>
  </div>

<script src="nav.js?v=2"></script>
<script src="page-common.js?v=2"></script>
<script>

  function section(title, lines, footnote) {
    if (!lines.length) return '';
    return `<div class="rules-section"><div class="rules-section-title">${esc(title)}</div><div class="rules-chips">${lines.join('')}</div>${footnote ? `<div class="rules-footnote">${footnote}</div>` : ''}</div>`;
  }

  // A "chip" renders plain unless prevVal is given and differs from val, in
  // which case it renders as old → new, highlighted.
  function scalarLine(label, val, prevVal) {
    if (prevVal === undefined || prevVal === val) {
      return `<span class="rules-chip"><span class="label">${esc(label)}:</span> ${esc(val)}</span>`;
    }
    return `<span class="rules-chip line-changed"><span class="label">${esc(label)}:</span> <span class="was">${esc(prevVal)}</span>→ <span class="now">${esc(val)}</span></span>`;
  }

  function settingsSection(rec, prev) {
    const rows = [
      ['Teams', rec.team_count, prev && prev.team_count],
      ['Playoff Teams', rec.playoff_team_count, prev && prev.playoff_team_count],
      ['Scoring', rec.ppr_label, prev && prev.ppr_label],
      ['Median Scoring', rec.median_scoring ? 'Yes' : 'No', prev && (prev.median_scoring ? 'Yes' : 'No')],
      ['Waiver Type', rec.waiver_type, prev && prev.waiver_type],
      ['Keepers', rec.keeper_count || 'None', prev && (prev.keeper_count || 'None')],
    ];
    return section('League Settings', rows.map(([label, val, prevVal]) => scalarLine(label, val, prev ? prevVal : undefined)));
  }

  function rosterSection(rec, prev) {
    if (!prev) {
      return section('Roster Structure', rec.roster_structure.map(r => `<span class="rules-chip">${r.count} ${esc(r.position)}</span>`));
    }
    const currMap = Object.fromEntries(rec.roster_structure.map(r => [r.position, r.count]));
    const prevMap = Object.fromEntries(prev.roster_structure.map(r => [r.position, r.count]));
    const order = rec.roster_structure.map(r => r.position);
    Object.keys(prevMap).forEach(p => { if (!order.includes(p)) order.push(p); });
    const lines = order.map(pos => {
      const c = currMap[pos], p = prevMap[pos];
      if (c === undefined) return `<span class="rules-chip line-dropped">${esc(pos)}: <span class="was">${p}</span>→ <span class="now">0</span></span>`;
      if (p === undefined) return `<span class="rules-chip line-added">+ ${c} ${esc(pos)}</span>`;
      if (p === c) return `<span class="rules-chip">${c} ${esc(pos)}</span>`;
      return `<span class="rules-chip line-changed">${esc(pos)}: <span class="was">${p}</span>→ <span class="now">${c}</span></span>`;
    });
    return section('Roster Structure', lines);
  }

  function moneySection(rec, prev) {
    if (!rec.buy_in) return '';
    const footnote = rec.payouts_year && rec.payouts_year !== rec.year
      ? `${rec.year} season in progress — payouts shown are from the ${rec.payouts_year} season`
      : '';
    const lines = [scalarLine('Buy-in', '$' + rec.buy_in, prev && prev.buy_in ? '$' + prev.buy_in : undefined)];
    if (!prev) {
      rec.payouts.forEach(p => lines.push(`<span class="rules-chip"><span class="label">${esc(p.label)}:</span> $${p.amount}</span>`));
    } else {
      const prevMap = Object.fromEntries(prev.payouts.map(p => [p.label, p.amount]));
      const order = rec.payouts.map(p => p.label);
      Object.keys(prevMap).forEach(l => { if (!order.includes(l)) order.push(l); });
      order.forEach(label => {
        const currAmt = rec.payouts.find(p => p.label === label);
        const c = currAmt ? currAmt.amount : undefined;
        const p = prevMap[label];
        if (c === undefined) lines.push(`<span class="rules-chip line-dropped"><span class="label">${esc(label)}:</span> <span class="was">$${p}</span>→ <span class="now">$0</span></span>`);
        else if (p === undefined) lines.push(`<span class="rules-chip line-added">+ ${esc(label)}: $${c}</span>`);
        else if (p === c) lines.push(`<span class="rules-chip"><span class="label">${esc(label)}:</span> $${c}</span>`);
        else lines.push(`<span class="rules-chip line-changed"><span class="label">${esc(label)}:</span> <span class="was">$${p}</span>→ <span class="now">$${c}</span></span>`);
      });
    }
    return section('Money', lines, footnote);
  }

  function managersSection(rec, prev) {
    if (!rec.managers.length) return '';
    if (!prev) {
      const chips = rec.managers.map(m => `<span class="manager-chip">${esc(m)}</span>`).join('');
      return section(`Managers (${rec.managers.length})`, [`<div class="manager-chips">${chips}</div>`]);
    }
    const prevSet = new Set(prev.managers);
    const currSet = new Set(rec.managers);
    const order = [...rec.managers, ...prev.managers.filter(m => !currSet.has(m))].sort();
    const chips = order.map(m => {
      if (currSet.has(m) && prevSet.has(m)) return `<span class="manager-chip">${esc(m)}</span>`;
      if (currSet.has(m)) return `<span class="manager-chip added">+${esc(m)}</span>`;
      return `<span class="manager-chip removed">-${esc(m)}</span>`;
    }).join('');
    return section(`Managers (${rec.managers.length})`, [`<div class="manager-chips">${chips}</div>`]);
  }

  function yearCard(rec, prev, isCurrent) {
    const sections = [settingsSection(rec, prev), rosterSection(rec, prev), moneySection(rec, prev), managersSection(rec, prev)]
      .filter(Boolean);
    return `
      <div class="rules-card${isCurrent ? ' is-current' : ''}">
        <div class="rules-head">
          <div class="rules-title">${rec.year}</div>
        </div>
        <div class="rules-body">${sections.join('')}</div>
      </div>`;
  }

  function changeChip(text) {
    const m = text.match(/^Managers: (.+)$/);
    if (!m) return `<div class="change-chip">${esc(text)}</div>`;
    const pills = m[1].split(', ').map(p => {
      const out = p.startsWith('-');
      return `<span class="manager-delta ${out ? 'out' : 'in'}">${esc(p)}</span>`;
    }).join('');
    return `<div class="change-chip"><span class="change-chip-label">Managers:</span>${pills}</div>`;
  }

  function timelineItem(entry) {
    return `
      <div class="timeline-item">
        <div class="timeline-dot"></div>
        <div class="glass">
          <div class="timeline-year">${entry.year}</div>
          <div class="change-list">${entry.changes.map(changeChip).join('')}</div>
        </div>
      </div>`;
  }

  fetch('data/rule-changes.json', { cache: 'no-store' })
    .then(res => res.json())
    .then(data => {
      document.getElementById('updated-at').textContent = formatUpdated(data.generated_at);

      // The selectable years are every documented snapshot plus "now",
      // appended only if it isn't already the last snapshot (i.e. the
      // current year's rules haven't changed since the last documented one).
      const list = [...data.snapshots];
      const lastYear = list[list.length - 1].year;
      if (data.current.year !== lastYear) list.push(data.current);

      const tabRow = document.getElementById('year-tab-row');
      const selectedContainer = document.getElementById('selected-container');
      tabRow.innerHTML = list.map((rec, i) => {
        const isCurrent = rec.year === data.current.year;
        const label = isCurrent ? 'Current' : i === 0 ? 'Start' : rec.year;
        return `<button type="button" class="year-tab${isCurrent ? ' is-current' : ''}${i === 0 ? ' active' : ''}" data-i="${i}">${label}</button>`;
      }).join('');

      function showYear(i) {
        [...tabRow.children].forEach((btn, idx) => btn.classList.toggle('active', idx === i));
        const rec = list[i];
        const prev = i === 0 ? null : list[i - 1];
        const isCurrent = rec.year === data.current.year;
        selectedContainer.innerHTML = yearCard(rec, prev, isCurrent);
      }
      tabRow.addEventListener('click', e => {
        const btn = e.target.closest('.year-tab');
        if (btn) showYear(Number(btn.dataset.i));
      });
      showYear(0);

      const changesContainer = document.getElementById('changes-container');
      if (!data.changes.length) {
        changesContainer.innerHTML = '<div class="empty-note">No changes recorded yet.</div>';
      } else {
        changesContainer.innerHTML = `<div class="timeline">${data.changes.map(timelineItem).join('')}</div>`;
      }
    })
    .catch(err => {
      console.error('Rule changes data error:', err);
      document.getElementById('selected-container').innerHTML = '<div class="loading-row" style="color:var(--loss);">Error loading rule changes data.</div>';
    });
</script>
<script src="track.js?v=1" defer></script>
</body>
</html>
