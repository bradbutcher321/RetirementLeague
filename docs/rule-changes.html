<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retirement League — Rule Changes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=3">
<link rel="stylesheet" href="nav.css?v=3">
<style>
  .tab-row{ display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .year-tab{
    background: var(--surface); border: 1px solid var(--line); color: var(--text-dim);
    font-family: var(--body); font-size: 0.86rem; font-weight: 600; padding: 9px 16px;
    border-radius: 999px; cursor: pointer;
  }
  .year-tab:hover{ border-color: var(--gold); color: var(--text); }
  .year-tab.active{ background: rgba(186,155,55,0.12); border-color: var(--gold); color: var(--gold); }
  .year-tab.is-current{ border-color: var(--turf-dim); }
  .year-tab.is-current:hover{ border-color: var(--turf); color: var(--text); }
  .year-tab.is-current.active{ background: rgba(76,154,107,0.14); border-color: var(--turf); color: var(--turf); }

  .rules-card{ background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--gold); max-width: 640px; }
  .rules-card.is-current{ border-top-color: var(--turf); }
  .rules-head{ padding: 16px 20px 12px; border-bottom: 1px solid var(--line); }
  .rules-title{ font-family: var(--scoreboard); font-weight: 800; font-size: 1.5rem; }
  .rules-body{ display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); }
  @media (max-width: 520px){ .rules-body{ grid-template-columns: 1fr; } }
  .rules-section{ background: var(--surface); padding: 16px 20px; }
  .rules-section-title{ color: var(--gold); font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 10px; }
  .rules-line{ font-size: 0.9rem; padding: 3px 6px; margin: 0 -6px; color: var(--text); border-radius: 3px; }
  .rules-line .label{ color: var(--text-dim); }
  .rules-line.line-changed{ background: rgba(186,155,55,0.1); }
  .rules-line.line-added{ background: rgba(76,154,107,0.1); color: var(--turf); }
  .rules-line.line-dropped{ background: rgba(192,87,75,0.1); }
  .rules-line.line-dropped .now{ color: var(--loss); }
  .rules-line .was{ color: var(--text-dim); margin-right: 4px; }
  .rules-line .now{ color: var(--gold); font-weight: 700; }
  .rules-footnote{ color: var(--text-dim); font-size: 0.76rem; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .empty-note{ padding: 22px 10px; color: var(--text-dim); font-size: 0.85rem; text-align: center; }

  .manager-chips{ display: flex; flex-wrap: wrap; gap: 6px; }
  .manager-chip{
    background: var(--surface-raised); border: 1px solid var(--line); color: var(--text);
    font-size: 0.82rem; font-weight: 600; padding: 4px 11px; border-radius: 999px;
  }
  .manager-chip.added{ background: rgba(76,154,107,0.14); border-color: var(--turf-dim); color: var(--turf); }
  .manager-chip.removed{ background: rgba(192,87,75,0.14); border-color: var(--loss); color: var(--loss); }

  /* ---------- Timeline ---------- */
  .timeline{ position: relative; padding-left: 30px; }
  .timeline::before{ content: ''; position: absolute; left: 8px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
  .timeline-item{ position: relative; padding-bottom: 24px; }
  .timeline-item:last-child{ padding-bottom: 0; }
  .timeline-dot{ position: absolute; left: -30px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--bg); border: 2px solid var(--gold); }
  .timeline-year{ font-family: var(--scoreboard); font-weight: 800; font-size: 1.15rem; color: var(--gold); margin-bottom: 8px; }
  .change-list{ display: flex; flex-direction: column; gap: 6px; }
  .change-chip{ background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--gold); padding: 8px 12px; font-size: 0.88rem; border-radius: 4px; }
  .change-chip-label{ color: var(--text-dim); margin-right: 4px; }
  .manager-delta{ display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; margin: 2px 3px 2px 0; }
  .manager-delta.in{ background: rgba(76,154,107,0.15); color: var(--turf); border: 1px solid var(--turf-dim); }
  .manager-delta.out{ background: rgba(192,87,75,0.15); color: var(--loss); border: 1px solid var(--loss); }
</style>
</head>
<body>
  <div id="site-nav"></div>
  <div class="wrap">
    <header>
      <div class="header-row">
        <div>
          <div class="eyebrow">Retirement League</div>
          <h1>Rule Changes</h1>
        </div>
        <div class="updated-block">
          <div class="updated-label">Updated</div>
          <div class="updated-value" id="updated-at">—</div>
        </div>
      </div>
    </header>

    <section id="compare-section">
      <div class="tab-row" id="year-tab-row"></div>
      <div id="selected-container"><div class="loading-row">Loading rules…</div></div>
    </section>

    <section id="changes-section">
      <h2>Timeline of Changes</h2>
      <div id="changes-container"></div>
    </section>

    <footer>Rules and manager history from ESPN Fantasy · Money from the league sheet</footer>
  </div>

<script src="nav.js"></script>
<script>
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function formatUpdated(iso) {
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return '—';
    const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    if (d.toDateString() === new Date().toDateString()) return time;
    return `${d.toLocaleDateString([], { month: 'short', day: 'numeric' })} · ${time}`;
  }

  function section(title, lines, footnote) {
    if (!lines.length) return '';
    return `<div class="rules-section"><div class="rules-section-title">${esc(title)}</div>${lines.join('')}${footnote ? `<div class="rules-footnote">${footnote}</div>` : ''}</div>`;
  }

  // A "line" renders plain unless prevVal is given and differs from val, in
  // which case it renders as old → new, highlighted.
  function scalarLine(label, val, prevVal) {
    if (prevVal === undefined || prevVal === val) {
      return `<div class="rules-line"><span class="label">${esc(label)}:</span> ${esc(val)}</div>`;
    }
    return `<div class="rules-line line-changed"><span class="label">${esc(label)}:</span> <span class="was">${esc(prevVal)}</span>→<span class="now">${esc(val)}</span></div>`;
  }

  function settingsSection(rec, prev) {
    const rows = [
      ['Teams', rec.team_count, prev && prev.team_count],
      ['Playoff Teams', rec.playoff_team_count, prev && prev.playoff_team_count],
      ['Scoring', rec.ppr_label, prev && prev.ppr_label],
      ['Median Scoring', rec.median_scoring ? 'Yes' : 'No', prev && (prev.median_scoring ? 'Yes' : 'No')],
      ['Waiver Type', rec.waiver_type, prev && prev.waiver_type],
      ['Keepers', rec.keeper_count || 'None', prev && (prev.keeper_count || 'None')],
    ];
    return section('League Settings', rows.map(([label, val, prevVal]) => scalarLine(label, val, prev ? prevVal : undefined)));
  }

  function rosterSection(rec, prev) {
    if (!prev) {
      return section('Roster Structure', rec.roster_structure.map(r => `<div class="rules-line">${r.count} ${esc(r.position)}</div>`));
    }
    const currMap = Object.fromEntries(rec.roster_structure.map(r => [r.position, r.count]));
    const prevMap = Object.fromEntries(prev.roster_structure.map(r => [r.position, r.count]));
    const order = rec.roster_structure.map(r => r.position);
    Object.keys(prevMap).forEach(p => { if (!order.includes(p)) order.push(p); });
    const lines = order.map(pos => {
      const c = currMap[pos], p = prevMap[pos];
      if (c === undefined) return `<div class="rules-line line-dropped">${esc(pos)}: <span class="was">${p}</span>→<span class="now">0</span></div>`;
      if (p === undefined) return `<div class="rules-line line-added">+ ${c} ${esc(pos)}</div>`;
      if (p === c) return `<div class="rules-line">${c} ${esc(pos)}</div>`;
      return `<div class="rules-line line-changed">${esc(pos)}: <span class="was">${p}</span>→<span class="now">${c}</span></div>`;
    });
    return section('Roster Structure', lines);
  }

  function moneySection(rec, prev) {
    if (!rec.buy_in) return '';
    const footnote = rec.payouts_year && rec.payouts_year !== rec.year
      ? `${rec.year} season in progress — payouts shown are from the ${rec.payouts_year} season`
      : '';
    const lines = [scalarLine('Buy-in', '$' + rec.buy_in, prev && prev.buy_in ? '$' + prev.buy_in : undefined)];
    if (!prev) {
      rec.payouts.forEach(p => lines.push(`<div class="rules-line"><span class="label">${esc(p.label)}:</span> $${p.amount}</div>`));
    } else {
      const prevMap = Object.fromEntries(prev.payouts.map(p => [p.label, p.amount]));
      const order = rec.payouts.map(p => p.label);
      Object.keys(prevMap).forEach(l => { if (!order.includes(l)) order.push(l); });
      order.forEach(label => {
        const currAmt = rec.payouts.find(p => p.label === label);
        const c = currAmt ? currAmt.amount : undefined;
        const p = prevMap[label];
        if (c === undefined) lines.push(`<div class="rules-line line-dropped"><span class="label">${esc(label)}:</span> <span class="was">$${p}</span>→<span class="now">$0</span></div>`);
        else if (p === undefined) lines.push(`<div class="rules-line line-added">+ ${esc(label)}: $${c}</div>`);
        else if (p === c) lines.push(`<div class="rules-line"><span class="label">${esc(label)}:</span> $${c}</div>`);
        else lines.push(`<div class="rules-line line-changed"><span class="label">${esc(label)}:</span> <span class="was">$${p}</span>→<span class="now">$${c}</span></div>`);
      });
    }
    return section('Money', lines, footnote);
  }

  function managersSection(rec, prev) {
    if (!rec.managers.length) return '';
    if (!prev) {
      const chips = rec.managers.map(m => `<span class="manager-chip">${esc(m)}</span>`).join('');
      return section(`Managers (${rec.managers.length})`, [`<div class="manager-chips">${chips}</div>`]);
    }
    const prevSet = new Set(prev.managers);
    const currSet = new Set(rec.managers);
    const order = [...rec.managers, ...prev.managers.filter(m => !currSet.has(m))].sort();
    const chips = order.map(m => {
      if (currSet.has(m) && prevSet.has(m)) return `<span class="manager-chip">${esc(m)}</span>`;
      if (currSet.has(m)) return `<span class="manager-chip added">+${esc(m)}</span>`;
      return `<span class="manager-chip removed">-${esc(m)}</span>`;
    }).join('');
    return section(`Managers (${rec.managers.length})`, [`<div class="manager-chips">${chips}</div>`]);
  }

  function yearCard(rec, prev, isCurrent) {
    const sections = [settingsSection(rec, prev), rosterSection(rec, prev), moneySection(rec, prev), managersSection(rec, prev)]
      .filter(Boolean);
    return `
      <div class="rules-card${isCurrent ? ' is-current' : ''}">
        <div class="rules-head">
          <div class="rules-title">${rec.year}</div>
        </div>
        <div class="rules-body">${sections.join('')}</div>
      </div>`;
  }

  function changeChip(text) {
    const m = text.match(/^Managers: (.+)$/);
    if (!m) return `<div class="change-chip">${esc(text)}</div>`;
    const pills = m[1].split(', ').map(p => {
      const out = p.startsWith('-');
      return `<span class="manager-delta ${out ? 'out' : 'in'}">${esc(p)}</span>`;
    }).join('');
    return `<div class="change-chip"><span class="change-chip-label">Managers:</span>${pills}</div>`;
  }

  function timelineItem(entry) {
    return `
      <div class="timeline-item">
        <div class="timeline-dot"></div>
        <div class="timeline-year">${entry.year}</div>
        <div class="change-list">${entry.changes.map(changeChip).join('')}</div>
      </div>`;
  }

  fetch('data/rule-changes.json', { cache: 'no-store' })
    .then(res => res.json())
    .then(data => {
      document.getElementById('updated-at').textContent = formatUpdated(data.generated_at);

      // The selectable years are every documented snapshot plus "now",
      // appended only if it isn't already the last snapshot (i.e. the
      // current year's rules haven't changed since the last documented one).
      const list = [...data.snapshots];
      const lastYear = list[list.length - 1].year;
      if (data.current.year !== lastYear) list.push(data.current);

      const tabRow = document.getElementById('year-tab-row');
      const selectedContainer = document.getElementById('selected-container');
      tabRow.innerHTML = list.map((rec, i) => {
        const isCurrent = rec.year === data.current.year;
        const label = isCurrent ? 'Current' : i === 0 ? 'Start' : rec.year;
        return `<button type="button" class="year-tab${isCurrent ? ' is-current' : ''}${i === 0 ? ' active' : ''}" data-i="${i}">${label}</button>`;
      }).join('');

      function showYear(i) {
        [...tabRow.children].forEach((btn, idx) => btn.classList.toggle('active', idx === i));
        const rec = list[i];
        const prev = i === 0 ? null : list[i - 1];
        const isCurrent = rec.year === data.current.year;
        selectedContainer.innerHTML = yearCard(rec, prev, isCurrent);
      }
      tabRow.addEventListener('click', e => {
        const btn = e.target.closest('.year-tab');
        if (btn) showYear(Number(btn.dataset.i));
      });
      showYear(0);

      const changesContainer = document.getElementById('changes-container');
      if (!data.changes.length) {
        changesContainer.innerHTML = '<div class="empty-note">No changes recorded yet.</div>';
      } else {
        changesContainer.innerHTML = `<div class="timeline">${data.changes.map(timelineItem).join('')}</div>`;
      }
    })
    .catch(err => {
      console.error('Rule changes data error:', err);
      document.getElementById('selected-container').innerHTML = '<div class="loading-row" style="color:#C0574B;">Error loading rule changes data.</div>';
    });
</script>
<script src="track.js?v=1" defer></script>
</body>
</html>
