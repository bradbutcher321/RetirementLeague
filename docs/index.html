<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retirement League — Live Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B0F14;
    --surface: #131920;
    --surface-raised: #1A222B;
    --line: #26303B;
    --text: #E9EEF3;
    --text-dim: #8A97A3;
    --gold: #E8AA2E;
    --turf: #4C9A6B;
    --turf-dim: #2E5A3F;
    --loss: #C0574B;
    --scoreboard: 'Big Shoulders Display', sans-serif;
    --body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 900px 500px at 20% -10%, rgba(232,170,46,0.06), transparent),
      radial-gradient(ellipse 900px 500px at 90% 10%, rgba(76,154,107,0.06), transparent);
    color: var(--text);
    font-family: var(--body);
    -webkit-font-smoothing: antialiased;
  }

  .wrap{ max-width: 980px; margin: 0 auto; padding: 0 20px 60px; }

  /* ---------- Header / ticker ---------- */
  header{
    padding: 28px 0 0;
  }
  .eyebrow{
    color: var(--gold);
    font-weight: 600;
    font-size: 0.8rem;
    letter-spacing: 0.02em;
  }
  h1{
    font-family: var(--scoreboard);
    font-weight: 800;
    font-size: clamp(2rem, 5vw, 3.1rem);
    margin: 2px 0 20px;
    letter-spacing: 0.01em;
    line-height: 1;
  }

  .ticker{
    display: flex;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    margin-bottom: 34px;
  }
  .ticker-item{
    flex: 1;
    padding: 16px 18px;
    border-right: 1px solid var(--line);
  }
  .ticker-item:last-child{ border-right: none; }
  .ticker-label{
    color: var(--text-dim);
    font-size: 0.78rem;
    margin-bottom: 4px;
  }
  .ticker-value{
    font-family: var(--scoreboard);
    font-weight: 700;
    font-size: 1.7rem;
    font-variant-numeric: tabular-nums;
  }

  section{ margin-bottom: 44px; }
  h2{
    font-size: 1rem;
    font-weight: 600;
    color: var(--text-dim);
    margin: 0 0 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }

  /* ---------- Matchup cards ---------- */
  .matchups{ display: flex; flex-direction: column; gap: 14px; }

  .matchup-card{
    background: var(--surface);
    border: 1px solid var(--line);
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
  }

  .side{
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    border-top: 3px solid transparent;
  }
  .side.leading{ border-top-color: var(--gold); }

  .side.away{ text-align: left; align-items: flex-start; }
  .side.home{ text-align: right; align-items: flex-end; }

  .team-name{
    font-weight: 600;
    font-size: 1rem;
  }
  .meta-row{
    display: flex;
    gap: 10px;
    color: var(--text-dim);
    font-size: 0.82rem;
  }
  .side.home .meta-row{ flex-direction: row-reverse; }

  .score-line{
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .side.home .score-line{ flex-direction: row-reverse; }
  .score{
    font-family: var(--scoreboard);
    font-weight: 700;
    font-size: 2.4rem;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .proj{
    color: var(--text-dim);
    font-size: 0.85rem;
    font-variant-numeric: tabular-nums;
  }

  .remaining-badge{
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.76rem;
    color: var(--text-dim);
  }
  .remaining-badge .dot{
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--turf);
  }
  .remaining-badge.done .dot{ background: var(--line); }

  .vs-divider{
    padding: 0 18px;
    color: var(--text-dim);
    font-family: var(--scoreboard);
    font-weight: 600;
    font-size: 0.95rem;
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
    align-self: stretch;
    display: flex;
    align-items: center;
  }

  @media (max-width: 640px){
    .matchup-card{ grid-template-columns: 1fr; }
    .vs-divider{ border-left:none; border-right:none; border-top:1px solid var(--line); border-bottom:1px solid var(--line); justify-content:center; padding: 6px 0; }
    .side.home{ text-align:left; align-items:flex-start; }
    .side.home .meta-row, .side.home .score-line{ flex-direction: row; }
  }

  /* ---------- Leaderboard ---------- */
  .leaderboard{
    border: 1px solid var(--line);
    background: var(--surface);
  }
  .lb-row{
    display: grid;
    grid-template-columns: 32px 1fr 70px 90px 90px 90px;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    font-size: 0.9rem;
  }
  .lb-row:last-child{ border-bottom: none; }
  .lb-row.head{
    color: var(--text-dim);
    font-size: 0.76rem;
    background: var(--surface-raised);
  }
  .lb-rank{ color: var(--text-dim); font-family: var(--scoreboard); font-weight: 700; }
  .lb-name{ font-weight: 500; }
  .lb-record{ color: var(--text-dim); font-size: 0.82rem; }
  .lb-num{ font-variant-numeric: tabular-nums; text-align: right; }
  .lb-current{ font-weight: 700; }

  @media (max-width: 640px){
    .lb-row{ grid-template-columns: 24px 1fr 60px 70px; }
    .lb-record, .lb-remaining-col{ display: none; }
  }

  .loading-row{ padding: 30px 16px; color: var(--text-dim); font-size: 0.9rem; text-align: center; }
  footer{ color: var(--text-dim); font-size: 0.78rem; text-align: center; padding-top: 10px; }

  /* ---------- Median Watch ---------- */
  .median-grid{ display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px){ .median-grid{ grid-template-columns: 1fr; } }

  .median-card{
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 18px 20px;
  }
  .median-card-header{
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }
  .median-card-title{ font-weight: 600; font-size: 0.9rem; color: var(--text-dim); }
  .median-card-value{
    font-family: var(--scoreboard);
    font-weight: 700;
    font-size: 1.3rem;
    font-variant-numeric: tabular-nums;
  }

  .median-groups{ display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .median-group-label{
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
    font-weight: 600;
  }
  .median-group-label.above{ color: var(--turf); }
  .median-group-label.below{ color: var(--loss); }

  .median-team-row{
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 5px 0;
    font-size: 0.85rem;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .median-team-row:last-child{ border-bottom: none; }
  .median-team-name{
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .median-team-score{ color: var(--text-dim); font-variant-numeric: tabular-nums; flex-shrink: 0; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">Retirement League</div>
      <h1 id="week-header">Live Dashboard</h1>
    </header>

    <div class="ticker">
      <div class="ticker-item">
        <div class="ticker-label">Current median</div>
        <div class="ticker-value" id="curr-median">—</div>
      </div>
      <div class="ticker-item">
        <div class="ticker-label">Projected median</div>
        <div class="ticker-value" id="proj-median">—</div>
      </div>
      <div class="ticker-item">
        <div class="ticker-label">Updated</div>
        <div class="ticker-value" id="updated-at" style="font-size:1.1rem;">—</div>
      </div>
    </div>

    <section>
      <h2>This week's matchups</h2>
      <div class="matchups" id="matchups-container">
        <div class="loading-row">Loading matchups…</div>
      </div>
    </section>

    <section>
      <h2>Current Standings</h2>
      <div class="leaderboard" id="leaderboard-container">
        <div class="loading-row">Loading standings…</div>
      </div>
    </section>

    <section>
      <h2>Median Watch</h2>
      <div class="median-grid" id="median-container">
        <div class="loading-row">Loading median splits…</div>
      </div>
    </section>

    <footer>Auto-refreshes from the league sheet · Data via ESPN Fantasy</footer>
  </div>

<script>
  // Paste your exact published "Live Weekly Medians" tab CSV URL here
  const csvUrl = 'https://docs.google.com/spreadsheets/d/1WghofPfu0Df9eEuePopV8Y0LJbPUYRdMOsPE-fZUtb4/gviz/tq?tqx=out:csv&gid=941832551';

  // --- On-demand refresh trigger -------------------------------------
  // IMPORTANT: earlier versions of this file embedded a raw GitHub
  // Personal Access Token here. That is unsafe: anyone who views the page
  // source can copy the token and use the GitHub API as you. Never put a
  // PAT (or any secret) into client-side HTML/JS.
  //
  // Instead, this now calls a small proxy endpoint that YOU control
  // (e.g. a Cloudflare Worker / Vercel serverless function / AWS Lambda
  // URL) which holds the real token server-side and forwards the
  // repository_dispatch call to GitHub. Set REFRESH_PROXY_URL below once
  // that's deployed. Leaving it blank simply skips the on-demand refresh
  // and the dashboard still works fine off the last scheduled run.
  const REFRESH_PROXY_URL = 'https://retirement-league-refresh-proxy.bradbutcher321.workers.dev';

  function triggerLiveOnDemandRefresh() {
    if (!REFRESH_PROXY_URL) return;
    fetch(REFRESH_PROXY_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' } })
      .then(res => res.json())
      .then(data => {
        if (data.dispatched) console.log('Refresh dispatched.');
        else if (data.skipped) console.log('Refresh skipped:', data.reason);
      })
      .catch(err => console.error('On-demand refresh error:', err));
  }
  triggerLiveOnDemandRefresh();

  // --- CSV parsing -----------------------------------------------------
  function cleanCell(text) {
    return text ? text.replace(/"/g, '').trim() : '';
  }

  function parseCsv(text) {
    return text.split('\n').map(row => row.split(',').map(cleanCell));
  }

  function fmtScore(n) {
    const num = parseFloat(n);
    return isNaN(num) ? n : num.toFixed(2);
  }

  function renderMatchupCard(m) {
    const homeLeading = parseFloat(m.homeScore) >= parseFloat(m.awayScore);
    const remBadge = (n, label) => {
      const remaining = parseInt(n, 10) || 0;
      const done = remaining === 0;
      return `<span class="remaining-badge ${done ? 'done' : ''}">
                <span class="dot"></span>${remaining} ${label} left to play
              </span>`;
    };

    return `
      <div class="matchup-card">
        <div class="side away ${!homeLeading ? 'leading' : ''}">
          <div class="team-name">${m.awayName}</div>
          <div class="meta-row"><span>${m.awayRecord}</span></div>
          <div class="score-line">
            <span class="score">${fmtScore(m.awayScore)}</span>
            <span class="proj">proj ${fmtScore(m.awayProjected)}</span>
          </div>
          ${remBadge(m.awayRemaining, '')}
        </div>
        <div class="vs-divider">@</div>
        <div class="side home ${homeLeading ? 'leading' : ''}">
          <div class="team-name">${m.homeName}</div>
          <div class="meta-row"><span>${m.homeRecord}</span></div>
          <div class="score-line">
            <span class="score">${fmtScore(m.homeScore)}</span>
            <span class="proj">proj ${fmtScore(m.homeProjected)}</span>
          </div>
          ${remBadge(m.homeRemaining, '')}
        </div>
      </div>`;
  }

  function renderMedianGroup(list, label, cls) {
    if (!list.length) return '';
    return `
      <div class="median-group">
        <div class="median-group-label ${cls}">${label}</div>
        ${list.map(t => `
          <div class="median-team-row">
            <span class="median-team-name">${t.name}</span>
            <span class="median-team-score">${fmtScore(t.score)}</span>
          </div>`).join('')}
      </div>`;
  }

  // Splits teams by rank (not by literal distance from the median value) so
  // it always yields an even above/below split — 6-and-6 in a 12-team
  // league — even if a couple of scores happen to tie exactly at the median.
  function renderMedianCard(title, medianValue, teamsSorted, scoreKey) {
    const half = Math.floor(teamsSorted.length / 2);
    const above = teamsSorted.slice(0, half).map(t => ({ name: t.name, score: t[scoreKey] }));
    const below = teamsSorted.slice(teamsSorted.length - half).map(t => ({ name: t.name, score: t[scoreKey] }));
    return `
      <div class="median-card">
        <div class="median-card-header">
          <span class="median-card-title">${title}</span>
          <span class="median-card-value">${fmtScore(medianValue)}</span>
        </div>
        <div class="median-groups">
          ${renderMedianGroup(above, 'Above Median', 'above')}
          ${renderMedianGroup(below, 'Below Median', 'below')}
        </div>
      </div>`;
  }

  function renderLeaderboardRow(t, rank) {
    return `
      <div class="lb-row">
        <div class="lb-rank">${rank}</div>
        <div class="lb-name">${t.name}</div>
        <div class="lb-record">${t.record}</div>
        <div class="lb-num lb-current">${fmtScore(t.current)}</div>
        <div class="lb-num">${fmtScore(t.projected)}</div>
        <div class="lb-num lb-remaining-col">${t.remaining} left</div>
      </div>`;
  }

  // Cache-bust: append a timestamp so neither the browser nor any
  // intermediate cache serves a stale copy of the CSV.
  const cacheBustedCsvUrl = csvUrl + '&_=' + Date.now();

  // The leaderboard (columns A-F) and matchup table (columns H-Q) now live
  // side by side on separate columns within the same tab/row-range — see
  // update_page_and_sheets.py for why. So each row belongs to exactly one
  // zone: check column A (index 0) for leaderboard content, column H
  // (index 7) for matchup content.
  const MATCHUP_START = 7;
  // Column Z (index 25) holds the epoch timestamp of the last successful
  // update_page_and_sheets.py run (see cell Z1) — that's the true
  // "data updated" time, as opposed to whenever a visitor's browser
  // happens to load this page.
  const UPDATED_COL = 25;

  fetch(cacheBustedCsvUrl, { cache: 'no-store' })
    .then(res => res.text())
    .then(csvText => {
      const rows = parseCsv(csvText);

      let currMedian = '—', projMedian = '—', week = '', updatedEpoch = '';
      const teams = [];
      const matchups = [];

      rows.forEach(row => {
        if (row.length < 2 || row.every(c => c === '')) return;

        const a = row[0];
        if (!updatedEpoch && row[UPDATED_COL]) updatedEpoch = row[UPDATED_COL];

        // Leaderboard zone (columns A-F)
        if (a === 'Matchup Week') { week = row[1]; return; }
        if (a === 'Current Median Score') { currMedian = row[1]; return; }
        if (a === 'Projected Median Score') { projMedian = row[1]; return; }
        if (a === 'Team Name') return; // leaderboard header row
        if (a) {
          teams.push({
            name: a, record: row[1], current: row[2], projected: row[3],
            remaining: row[4], standing: row[5],
          });
          return;
        }

        // Matchup zone (columns H-Q)
        const h = row[MATCHUP_START];
        if (h === 'Away Team') return; // matchup header row
        if (h) {
          matchups.push({
            awayName: h, awayRecord: row[MATCHUP_START + 1], awayScore: row[MATCHUP_START + 2],
            awayProjected: row[MATCHUP_START + 3], awayRemaining: row[MATCHUP_START + 4],
            homeName: row[MATCHUP_START + 5], homeRecord: row[MATCHUP_START + 6],
            homeScore: row[MATCHUP_START + 7], homeProjected: row[MATCHUP_START + 8],
            homeRemaining: row[MATCHUP_START + 9],
          });
        }
      });

      document.getElementById('week-header').textContent = week ? `Live Dashboard — ${week}` : 'Live Dashboard';
      document.getElementById('curr-median').textContent = fmtScore(currMedian);
      document.getElementById('proj-median').textContent = fmtScore(projMedian);
      document.getElementById('updated-at').textContent = updatedEpoch
        ? new Date(parseInt(updatedEpoch, 10) * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        : '—';

      document.getElementById('matchups-container').innerHTML =
        matchups.length ? matchups.map(renderMatchupCard).join('') : '<div class="loading-row">No matchups found.</div>';

      const lbHeader = `
        <div class="lb-row head">
          <div>#</div><div>Team</div><div>Record</div><div class="lb-num">Score</div><div class="lb-num">Proj</div><div class="lb-num lb-remaining-col">Rem.</div>
        </div>`;
      document.getElementById('leaderboard-container').innerHTML =
        lbHeader + teams.map((t, idx) => renderLeaderboardRow(t, idx + 1)).join('');

      // Before games kick off every team sits at 0.00 — a current-score
      // median split is meaningless then, so skip that card and only show
      // the projected split until real scores start coming in.
      const currentHasStarted = teams.some(t => parseFloat(t.current) > 0);
      const byCurrentDesc = [...teams].sort((a, b) => parseFloat(b.current) - parseFloat(a.current));
      const byProjectedDesc = [...teams].sort((a, b) => parseFloat(b.projected) - parseFloat(a.projected));

      let medianHtml = '';
      if (currentHasStarted) {
        medianHtml += renderMedianCard('Current Score', currMedian, byCurrentDesc, 'current');
      }
      medianHtml += renderMedianCard('Projected Score', projMedian, byProjectedDesc, 'projected');
      document.getElementById('median-container').innerHTML = medianHtml;
    })
    .catch(err => {
      console.error('Dashboard error:', err);
      document.getElementById('matchups-container').innerHTML = '<div class="loading-row" style="color:#C0574B;">Error loading league data.</div>';
    });
</script>
</body>
</html>
