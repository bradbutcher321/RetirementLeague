<body>
  <div id="site-nav"></div>
  <div class="wrap">
    <header>
      <div class="header-row">
        <div>
          <h1><span id="week-header">Live</span></h1>
        </div>
        <!-- The week chip opens the week picker (audit IX #2: it took over
             from the old ‹ › arrows); the status line says what the week
             is doing, and the time only once the numbers are a few minutes old. -->
        <div class="updated-block">
          <button type="button" class="wk-chip" id="wk-title" data-wp-open aria-haspopup="dialog" aria-expanded="false" hidden><span id="wk-chip-t">Week</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
          <div class="updated-label" id="updated-label">Updated</div>
          <div class="updated-value" id="updated-at">—</div>
        </div>
      </div>
    </header>

    <!-- Secret Santa teaser: up through Dec 31 (the script below hides it
         after that). A tap opens secret-santa.html. -->
    <section id="santa-section">
      <button type="button" class="santa-tk" id="santa-tk">
        <span class="santa-ss" aria-hidden="true"></span>
        <span class="santa-snow" aria-hidden="true"></span>
        <span class="santa-l"><span class="santa-k">Secret Santa 2026</span><span class="santa-h" id="santa-h">Sign-ups open <b>Nov 1</b></span><span class="santa-s" id="santa-s">Press and hold to reroll shirts!</span></span>
        <span class="santa-r" aria-hidden="true"><span class="santa-slot l"><img src="icons/santa/shirts/081.webp" alt=""></span><span class="santa-slot r"><img src="icons/santa/shirts/038.webp" alt=""></span><span class="santa-slot c"><img src="icons/santa/downtown.webp" alt="" width="300" height="254"></span></span>
        <span class="santa-go" aria-hidden="true">›</span>
        <span class="santa-glare" aria-hidden="true"></span>
      </button>
    </section>

    <!-- Your standing, once you've picked your team (renderStatusLine): where
         you sit, how far from the playoff line, your odds, who you play. Its
         ✕ hides it until the next week. -->
    <section id="status-section" hidden></section>
    <section id="waiver-section" hidden></section>

    <!-- Week in Review (site audit 28): leads the page from the end of the
         week until the next one kicks off, when Median Watch and the
         matchups have nothing new to say. Hidden the rest of the week. -->
    <section id="recap-section" hidden></section>

    <!-- A commissioner's announcement and the draft date (Commissioner page >
         Announcements, Season Setup; Worker GET /site-info). Absent when there
         is neither. -->
    <section id="notice-section" hidden></section>

    <!-- This is me (site audit II #36): the visitor's own matchup leads the
         matchups list below, ringed, or sits here with the You sheet's
         "top of the dashboard" setting on. Until they've picked a team, a
         one-line prompt sits here; its ✕ hides it for good (the You button
         in the bar still opens the same sheet). -->
    <section id="me-section" hidden><div class="matchups" id="my-matchup"></div></section>

    <section>
      <div id="median-container">
        <span class="sr-only">Loading median splits…</span>
        <div class="sk" aria-hidden="true">
          <div class="sk-row"><i style="width:34%;height:16px"></i><i class="p" style="width:150px;height:36px"></i></div>
          <i style="width:52%;height:11px"></i>
          <div class="sk-grid"><div class="sk-item"><div class="sk-row"><i style="width:42%;height:14px"></i><i style="width:30%;height:16px"></i></div><i style="width:34%;height:10px"></i></div><div class="sk-item"><div class="sk-row"><i style="width:42%;height:14px"></i><i style="width:30%;height:16px"></i></div><i style="width:34%;height:10px"></i></div><div class="sk-item"><div class="sk-row"><i style="width:42%;height:14px"></i><i style="width:30%;height:16px"></i></div><i style="width:34%;height:10px"></i></div><div class="sk-item"><div class="sk-row"><i style="width:42%;height:14px"></i><i style="width:30%;height:16px"></i></div><i style="width:34%;height:10px"></i></div><div class="sk-item"><div class="sk-row"><i style="width:42%;height:14px"></i><i style="width:30%;height:16px"></i></div><i style="width:34%;height:10px"></i></div><div class="sk-item"><div class="sk-row"><i style="width:42%;height:14px"></i><i style="width:30%;height:16px"></i></div><i style="width:34%;height:10px"></i></div></div>
          <i style="width:44%;height:12px;margin:2px auto"></i>
          <div class="sk-grid"><div class="sk-item"><div class="sk-row"><i style="width:42%;height:14px"></i><i style="width:30%;height:16px"></i></div><i style="width:34%;height:10px"></i></div><div class="sk-item"><div class="sk-row"><i style="width:42%;height:14px"></i><i style="width:30%;height:16px"></i></div><i style="width:34%;height:10px"></i></div><div class="sk-item"><div class="sk-row"><i style="width:42%;height:14px"></i><i style="width:30%;height:16px"></i></div><i style="width:34%;height:10px"></i></div><div class="sk-item"><div class="sk-row"><i style="width:42%;height:14px"></i><i style="width:30%;height:16px"></i></div><i style="width:34%;height:10px"></i></div><div class="sk-item"><div class="sk-row"><i style="width:42%;height:14px"></i><i style="width:30%;height:16px"></i></div><i style="width:34%;height:10px"></i></div><div class="sk-item"><div class="sk-row"><i style="width:42%;height:14px"></i><i style="width:30%;height:16px"></i></div><i style="width:34%;height:10px"></i></div></div>
        </div>
      </div>
      <div class="lore-row">
        <div id="parlay-highlight-container"><div class="sk" aria-hidden="true" style="height:100%">
          <div class="sk-row"><i style="width:38%;height:15px"></i><i class="p" style="width:58px;height:24px"></i></div>
          <div class="sk-item" style="padding:16px"><i style="width:92%;height:14px"></i><i style="width:64%;height:14px"></i></div>
          <div class="sk-row" style="justify-content:center;gap:28px"><i style="width:24%;height:10px"></i><i style="width:24%;height:10px"></i></div>
        </div></div>
        <div id="stat-of-moment-container"><div class="sk" aria-hidden="true" style="height:100%">
          <i style="width:32%;height:15px"></i>
          <div class="sk-item" style="padding:16px"><i style="width:88%;height:14px"></i><i style="width:56%;height:14px"></i></div>
        </div></div>
      </div>
    </section>

    <section>
      <h2><span class="h-state" id="matchups-state"></span><span id="matchups-h">This week's matchups</span></h2>
      <div class="matchups" id="matchups-container">
        <span class="sr-only">Loading matchups…</span>

          <div class="sk-row"><i style="width:44%;height:15px"></i><i style="width:40%;height:15px"></i></div>
          <div class="sk-row"><i style="width:30%;height:11px"></i><i style="width:28%;height:11px"></i></div>
          <div class="sk-row"><i style="width:34%;height:40px"></i><i style="width:38%;height:40px"></i></div>
          <div class="sk-row"><i style="width:20%;height:10px"></i><i style="width:22%;height:10px"></i></div>
          <i style="width:100%;height:6px"></i>
          <div class="sk-row"><i style="width:34%;height:6px"></i><i class="p" style="width:64px;height:24px"></i><i style="width:34%;height:6px"></i></div>
        </div>
        <div class="sk" aria-hidden="true">
          <div class="sk-row"><i style="width:44%;height:15px"></i><i style="width:40%;height:15px"></i></div>
          <div class="sk-row"><i style="width:30%;height:11px"></i><i style="width:28%;height:11px"></i></div>
          <div class="sk-row"><i style="width:34%;height:40px"></i><i style="width:38%;height:40px"></i></div>
          <div class="sk-row"><i style="width:20%;height:10px"></i><i style="width:22%;height:10px"></i></div>

        </div>
        <div class="sk" aria-hidden="true">
          <div class="sk-row"><i style="width:44%;height:15px"></i><i style="width:40%;height:15px"></i></div>
          <div class="sk-row"><i style="width:30%;height:11px"></i><i style="width:28%;height:11px"></i></div>

        </div>

        </div>
        <div class="sk" aria-hidden="true">
          <div class="sk-row"><i style="width:44%;height:15px"></i><i style="width:40%;height:15px"></i></div>
          <div class="sk-row"><i style="width:30%;height:11px"></i><i style="width:28%;height:11px"></i></div>
          <div class="sk-row"><i style="width:34%;height:40px"></i><i style="width:38%;height:40px"></i></div>
          <div class="sk-row"><i style="width:20%;height:10px"></i><i style="width:22%;height:10px"></i></div>
          <i style="width:100%;height:6px"></i>
          <div class="sk-row"><i style="width:34%;height:6px"></i><i class="p" style="width:64px;height:24px"></i><i style="width:34%;height:6px"></i></div>
        </div>
      </div>
    </section>

    <!-- hidden until loadDashboard's first render, same as Current Parlay and
         League Lore: without it the accolade placeholders drew on their own
         while the rest of the page was still loading, instead of appearing
         in step with it. -->
    <section id="season-section" hidden>
      <!-- Superlatives and standings answer the same question ("where does
           the season stand, counting this week as of X?"), so they share one
           heading and one Through / live / projected toggle. There are no
           separate "Superlatives" / "Current Standings" headings: the cards
           carry their own titles, and the standings panel has its own. -->
      <h2><span class="h-state" id="season-state"></span>Superlatives</h2>
      <div id="season-toggle"></div>
      <div class="accolades-grid" id="accolades-container">
        <div class="loading-row">Loading accolades…</div>
      </div>
      <!-- The standings table moved to the Standings page, which has the
           same Through / projected switch. The toggle stays for the cards. -->
    </section>

    <footer id="site-footer" data-note="Refreshes every 15 seconds"></footer>
