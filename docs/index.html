<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retirement League — Live Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=3">
<link rel="stylesheet" href="nav.css?v=3">
<style>
  /* ---------- Matchup cards ---------- */
  .matchups{ display: flex; flex-direction: column; gap: 14px; }

  .matchup-card{
    background: var(--surface);
    border: 1px solid var(--line);
    display: grid;
    cursor: pointer;
    /* Each side has a 175px floor instead of shrinking freely, so on a
       narrow phone the card stays laid out side-by-side (never stacks) and
       instead scrolls horizontally within itself — overflow-x lives on this
       same element as the background/border so the background scrolls
       along with the content instead of leaving a gap. */
    grid-template-columns: minmax(175px, 1fr) auto minmax(175px, 1fr);
    align-items: center;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  .side{
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    border-top: 3px solid transparent;
    transition: border-top-color 0.4s ease;
  }
  .side.leading{ border-top-color: var(--gold); }
  .side.leading.final{ border-top-color: var(--turf); }

  .side.away{ text-align: left; align-items: flex-start; }
  .side.home{ text-align: right; align-items: flex-end; }

  .team-name{
    font-weight: 600;
    font-size: 1rem;
    /* Stretch to the side's full width (overriding the flex-start/flex-end
       shrink-wrap the other elements in .side use) so there's a fixed box
       to measure and truncate against instead of wrapping to a second
       line. Stays right-aligned by inheritance on the home side — same as
       every other short name — until JS (see loadDashboard) detects this
       particular name actually overflows and adds .truncate, which flips
       just that one name to left-aligned so it reads from the start with
       the cut, and the "…", landing at the end instead of the start. */
    align-self: stretch;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .team-name.truncate{ text-align: left; }
  .meta-row{
    display: flex;
    align-items: baseline;
    gap: 6px;
    color: var(--text-dim);
    font-size: 0.82rem;
    white-space: nowrap;
  }
  .side.home .meta-row{ flex-direction: row-reverse; }
  .manager-name{ font-weight: 500; }
  .meta-dot{ color: var(--line); }

  .score-line{
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: nowrap;
    white-space: nowrap;
  }
  .side.home .score-line{ flex-direction: row-reverse; }
  .score{
    font-family: var(--scoreboard);
    font-weight: 700;
    /* Shrinks fluidly on narrow phones instead of wrapping onto a second
       line when a score picks up an extra digit or a minus sign. */
    font-size: clamp(1.6rem, 8vw, 2.4rem);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .proj{
    color: var(--text-dim);
    font-size: 0.85rem;
    font-variant-numeric: tabular-nums;
  }

  .remaining-badge{
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.76rem;
    color: var(--text-dim);
  }
  .remaining-badge .dot{
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--turf);
  }
  .remaining-badge.done .dot{ background: var(--line); }

  .badge-row{ display: flex; gap: 10px; flex-wrap: wrap; }
  .side.home .badge-row{ justify-content: flex-end; }

  .chip{
    display: inline-flex;
    align-items: center;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--text-dim);
  }
  .chip.wp-fav{ border-color: var(--gold); color: var(--gold); }
  .chip.streak-win{ border-color: var(--turf-dim); color: var(--turf); }
  .chip.streak-loss{ border-color: var(--loss); color: var(--loss); }

  .vs-divider{
    position: relative;
    padding: 0 8px;
    align-self: stretch;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .expand-chip{
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    display: inline-flex;
    align-items: center;
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--text-dim);
    background: var(--surface-raised);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px 9px;
    white-space: nowrap;
  }
  /* Both labels always render; CSS (driven by the same .expanded class the
     click handler already toggles) shows only the one that matches — no
     extra JS needed to keep the chip's text in sync with the card state. */
  .expand-chip .label-expanded{ display: none; }
  .matchup-card.expanded .expand-chip .label-collapsed{ display: none; }
  .matchup-card.expanded .expand-chip .label-expanded{ display: inline; }
  .live-indicator{
    /* Anchored to the top of the divider (independent of the centered VS
       badge below it) with an opaque background so it fully covers the
       divider's vertical line instead of the line showing through it. */
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--loss);
    background: var(--surface-raised);
    border: 1px solid var(--loss);
    border-radius: 999px;
    padding: 3px 8px;
    white-space: nowrap;
  }
  .live-indicator .pulse-dot{
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--loss);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(1.35); }
  }
  .vs-divider::before{
    content: "";
    position: absolute;
    top: 16px;
    bottom: 16px;
    left: 50%;
    width: 1px;
    background: var(--line);
    transform: translateX(-50%);
  }
  .vs-badge{
    position: relative;
    background: var(--surface-raised);
    border: 1px solid var(--gold);
    color: var(--gold);
    font-family: var(--scoreboard);
    font-weight: 800;
    font-size: 0.74rem;
    letter-spacing: 0.03em;
    padding: 5px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }

  /* ---------- Expanded matchup details (per-player roster) ---------- */
  .matchup-details{
    display: none;
    grid-column: 1 / -1;
    /* Matches the card's own surface — the per-row game-state colors are
       what should read as "different here", not a separately-tinted
       panel competing with them. The border-top plus a faint inset shadow
       are enough to read as a drawer without changing the base color. */
    background: var(--surface);
    border-top: 1px solid var(--line);
    box-shadow: inset 0 1px 6px rgba(0, 0, 0, 0.35);
  }
  .matchup-card.expanded .matchup-details{ display: block; }

  .detail-row{
    display: grid;
    grid-template-columns: minmax(130px, 1fr) 36px minmax(130px, 1fr);
    align-items: stretch;
    gap: 4px;
    border-bottom: 1px solid var(--line);
  }
  .detail-row .detail-position{ align-self: center; }
  .detail-row:last-child{ border-bottom: none; }
  .detail-position{
    text-align: center;
  }
  .position-label{
    display: inline-block;
    background: var(--surface-raised);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 3px;
    font-size: 0.66rem;
    font-weight: 700;
    color: var(--text-dim);
    letter-spacing: 0.03em;
  }

  .player-cell{
    display: grid;
    grid-template-columns: 1fr auto;
    column-gap: 8px;
    padding: 10px 8px;
    border: 1px solid transparent;
    position: relative;
    min-width: 0;
  }
  /* Home side mirrors the column order so its score still ends up on the
     inner edge (next to the position label) and its name/info on the
     outer edge, matching the away side's score-toward-center layout. */
  .player-cell.home{ grid-template-columns: auto 1fr; }
  .player-cell.home .player-info{ order: 2; text-align: right; }
  .player-cell.home .player-score{ order: 1; text-align: left; }

  /* Only the two states actually worth looking at right now get an
     accent: in progress, and in progress with the ball (gold — the one
     moment that should really pop). Not-started and final both stay
     neutral, full-bleed to the card's own edge — left for away, right for
     home — with no rounding and no surrounding gap, so consecutive rows
     (and the row against the card above it) read as one continuous strip
     rather than a series of separate floating boxes. */
  .player-cell.away{ border-left: 4px solid var(--state-bar-color, transparent); padding-left: 10px; }
  .player-cell.home{ border-right: 4px solid var(--state-bar-color, transparent); padding-right: 10px; }
  .player-cell.state-live{
    --state-bar-color: rgba(214, 214, 208, 0.5);
    background: rgba(214, 214, 208, 0.10);
  }
  .player-cell.state-possession{
    --state-bar-color: rgba(186,155,55, 0.6);
    background: rgba(186,155,55, 0.10);
  }

  /* Info (name/game-status/stats) top-aligns so the top two lines always
     land in the same place regardless of how many stat lines (0-2) either
     side ends up with. The score instead centers vertically, in line with
     the position callout next to it, independent of that variable height. */
  .player-info{ min-width: 0; text-align: left; align-self: start; }
  .player-score{ text-align: right; align-self: center; }
  .team-tag{
    display: inline-block;
    flex-shrink: 0;
    font-size: 0.6rem;
    font-weight: 700;
    color: var(--text-dim);
    background: var(--surface-raised);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 4px;
  }
  /* A flex row instead of a single nowrap text block, so the team tag
     (flex-shrink: 0) always stays fully visible while only the name text
     itself shrinks and hard-clips (no ellipsis — it just runs until it
     meets the tag) when space is tight. */
  .player-name{
    display: flex;
    align-items: center;
    gap: 4px;
    min-width: 0;
    font-weight: 600;
    font-size: 0.83rem;
  }
  .player-cell.home .player-name{ justify-content: flex-end; }
  .name-text{
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
  }
  .player-score .current{
    font-family: var(--scoreboard);
    font-weight: 700;
    font-size: 1.05rem;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .player-score .projected{
    font-size: 0.68rem;
    color: var(--text-dim);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
  }
  .player-game-line{
    font-size: 0.7rem;
    color: var(--text-dim);
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* Sizes to however many stat lines there actually are (0-2, clipped
     beyond that) rather than always reserving 2 — an empty or one-line
     stat block just takes less room instead of leaving dead blank space.
     Alignment across both sides comes from .player-cell's top-alignment
     above, not from forcing this to a fixed height. */
  .player-stat-line{
    font-size: 0.7rem;
    color: var(--text-dim);
    margin-top: 2px;
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  /* ---------- Leaderboard ---------- */
  /* One row per team instead of an 8-column table — Score/Proj dropped
     (redundant with the matchup cards above) and the record shown once,
     next to the manager's name, instead of in its own column. Everything
     fits on a single row with no horizontal scroll or tap-to-expand. */
  .leaderboard{ display: flex; flex-direction: column; gap: 8px; }
  .lb-row{
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--line);
    padding: 10px 14px;
  }
  .lb-row.playoff{ border-left-color: var(--turf); }
  .lb-rank{
    font-family: var(--scoreboard);
    font-weight: 800;
    font-size: 1.2rem;
    color: var(--text-dim);
    width: 20px;
    text-align: center;
    flex-shrink: 0;
  }
  .lb-row.playoff .lb-rank{ color: var(--gold); }
  .lb-identity{ flex: 1; min-width: 0; }
  .lb-name{
    font-weight: 600;
    font-size: 0.92rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .lb-meta{ color: var(--text-dim); font-size: 0.76rem; margin-top: 1px; }
  .lb-stat{ text-align: center; flex-shrink: 0; width: 48px; }
  .lb-stat .v{ font-family: var(--scoreboard); font-weight: 700; font-size: 0.95rem; font-variant-numeric: tabular-nums; }
  .lb-stat .l{ font-size: 0.58rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.02em; margin-top: 1px; }
  .lb-playoff-chip{
    flex-shrink: 0;
    font-size: 0.68rem;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--text-dim);
    min-width: 40px;
    text-align: center;
  }
  .lb-playoff-chip.high{ border-color: var(--turf-dim); color: var(--turf); }
  .lb-playoff-chip.low{ border-color: rgba(192,87,75,0.4); color: var(--loss); }

  /* ---------- Median Watch ---------- */
  .median-grid{ display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px){ .median-grid{ grid-template-columns: 1fr; } }

  .median-card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-top: 3px solid var(--gold);
    padding: 18px 20px;
  }
  .median-card-header{
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }
  .median-card-title{ font-weight: 700; font-size: 0.95rem; color: var(--text); }
  .median-card-value{
    font-family: var(--scoreboard);
    font-weight: 700;
    font-size: 1.3rem;
    font-variant-numeric: tabular-nums;
  }

  .group-label{
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
    font-weight: 600;
  }
  .group-label.above{ color: var(--turf); }
  .group-label.below{ color: var(--loss); }

  /* The card splits into the Above/Below grids (left) and the vertical
     spread strip (right, fixed width) side by side, so the grids run 2
     columns x 3 rows instead of 3 x 2 to leave room for it. */
  .card-body{ display: grid; grid-template-columns: 1fr auto; gap: 16px; }
  .mini-grid{ display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; margin-bottom: 14px; }
  .mini-grid:last-of-type{ margin-bottom: 0; }
  .mini-card{
    background: var(--surface-raised);
    border: 1px solid var(--line);
    border-top: 2px solid transparent;
    border-radius: 4px;
    padding: 7px 9px;
  }
  .mini-card.above{ border-top-color: var(--turf); }
  .mini-card.below{ border-top-color: var(--loss); }
  .mini-card.locked.above{ background: rgba(76,154,107,0.14); border-color: var(--turf-dim); border-top-color: var(--turf); }
  .mini-card.locked.below{ background: rgba(192,87,75,0.14); border-color: rgba(192,87,75,0.45); border-top-color: var(--loss); }
  .mini-card .stat{
    font-size: 0.62rem;
    margin-top: 2px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .mini-card .stat.lock.above{ color: var(--turf); }
  .mini-card .stat.lock.below{ color: var(--loss); }
  .mini-card .stat .live-txt{ color: var(--loss); }
  .live-dot{ display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--loss); --pc: 192,87,75; animation: live-pulse 1.6s infinite; }
  @keyframes live-pulse{
    0%{ box-shadow: 0 0 0 0 rgba(var(--pc), 0.6); }
    70%{ box-shadow: 0 0 0 6px rgba(var(--pc), 0); }
    100%{ box-shadow: 0 0 0 0 rgba(var(--pc), 0); }
  }
  .mini-card .name{
    font-size: 0.74rem;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mini-card .score{
    font-family: var(--scoreboard);
    font-weight: 700;
    font-size: 1.05rem;
    font-variant-numeric: tabular-nums;
  }

  /* A single-axis plot positioned by each team's actual score, not rank —
     distance on the page is real distance in points. Runs top (highest)
     to bottom (lowest); adjacent teams close enough to visually collide
     merge into one taller row (see renderSpreadChart) with all their
     names stacked, highest on top. */
  /* Reserved top/bottom padding is where the low/high endcap labels live
     (see .endcap-score below) — kept outside .vplot's own box entirely so
     they can never overlap the top/bottom rows inside it. */
  .spread-col{ width: 108px; flex-shrink: 0; padding: 15px 0; }
  .vplot{ position: relative; height: 100%; min-height: 200px; }
  .vplot .axis{ position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: var(--line); }
  /* z-index above .name-row so the tick renders on top of row edges
     instead of disappearing behind them (plain DOM order would otherwise
     paint rows, which come after it in the markup, over the top of it).
     No text label on it — the actual median value is already shown in
     the card header, and there's no space in this narrow a column to
     print it here without it colliding with the name rows on the line. */
  .vplot .median-tick{ position: absolute; left: 50%; transform: translateX(-50%); height: 1px; background: var(--gold); z-index: 2; }
  /* Background is set inline per-row (solid green/above, solid red/below,
     or a split gradient sized to how many members are on each side of the
     median for a merged row) since it varies per team composition. Width
     is also set inline (see measureMaxRowWidth) so every row — single
     name or merged — is exactly as wide as the single longest name among
     this week's teams, not a guessed constant with padding to spare. */
  .name-row{
    background-color: var(--surface);
    position: absolute;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    border: 1px solid var(--line);
    padding: 0;
  }
  .name-row .slot{
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    line-height: 1.4;
    border: 1px solid transparent;
    border-radius: 0;
    width: 100%;
    text-align: center;
  }
  /* Only the outer corners of a (possibly merged) pill are rounded, so a
     locked fill in the middle of a stack is square. */
  .name-row .slot:first-child{ border-top-left-radius: 3px; border-top-right-radius: 3px; }
  .name-row .slot:last-child{ border-bottom-left-radius: 3px; border-bottom-right-radius: 3px; }
  /* Status on the strip: check = no starters left, solid fill = result locked
     in (see renderMedianCard), red pulsing dot = a player is live. */
  .name-row .slot{ position: relative; }
  .name-row .slot.live::before{
    content: '';
    position: absolute;
    left: 4px;
    top: 50%;
    margin-top: -2.5px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--loss);
    --pc: 192,87,75;
    animation: live-pulse 1.6s infinite;
  }
  .name-row .slot.final::after{
    content: '\2713';
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.6rem;
    line-height: 1;
  }
  /* A red dot would vanish on a solid red (locked below) pill. */
  .name-row .slot.locked.below.live::before{ background: #fff; --pc: 255,255,255; }
  .name-row .slot.locked.above{ background: var(--turf); color: #08140d; border-color: var(--turf); }
  .name-row .slot.locked.below{ background: var(--loss); color: #1a0908; border-color: var(--loss); }
  .name-row .slot.above{ color: var(--turf); }
  .name-row .slot.below{ color: var(--loss); }
  /* Sits in .spread-col's own reserved padding, above/below .vplot's box
     entirely, so it can't overlap the top/bottom name rows inside it. */
  .endcap-score{
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.62rem;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  /* Lock lines on the Current strip: above the green line a team can't fall
     below the median any more, below the red line a finished team can't get above it. The plot shifts left
     to leave room for the line labels. */
  .spread-col.zoned{ width: 136px; }
  .vplot.zoned .axis, .vplot.zoned .name-row, .vplot.zoned .median-tick{ left: 44px; }
  .vplot.zoned .endcap-score{ left: 44px; }
  .zone{ position: absolute; left: 0; right: 0; z-index: 0; }
  .zone.up{ border-bottom: 1px dashed rgba(76,154,107,0.6); }
  .zone.dn{ border-top: 1px dashed rgba(192,87,75,0.6); }
  .zone-label{ position: absolute; right: 0; z-index: 4; font-size: 0.58rem; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .zone-label.up{ color: var(--turf); transform: translateY(-105%); }
  .zone-label.dn{ color: var(--loss); transform: translateY(5%); }
  .median-legend{ display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--text-dim); font-size: 0.68rem; }
  .median-legend .k{ display: inline-flex; align-items: center; gap: 6px; }
  .median-legend .sw{ display: inline-block; width: 14px; height: 9px; border-radius: 2px; border: 1px solid var(--text-dim); }
  .median-legend .sw.locked{ background: linear-gradient(135deg, var(--turf) 50%, var(--loss) 50%); border-color: var(--line); }
  .endcap-score.low{ bottom: -15px; }

<body>
  <div id="site-nav"></div>
  <div class="wrap">
    <header>
      <div class="header-row">
        <div>
          <div class="eyebrow">Retirement League</div>
          <h1 id="week-header">Live Dashboard</h1>
        </div>

          <div class="updated-label">Updated</div>
          <div class="updated-value" id="updated-at">—</div>
        </div>
      </div>

    <section>
      <h2>Median Watch</h2>
      <div class="median-grid" id="median-container">
        <div class="loading-row">Loading median splits…</div>
      </div>
    </section>

    <section>
      <h2>This week's matchups</h2>

      </div>
    </section>

      <div id="superlatives-toggle"></div>

        <div class="loading-row">Loading accolades…</div>
      </div>
    </section>

    <section>
      <h2>Current Standings</h2>
      <div id="standings-toggle"></div>
      <div class="leaderboard" id="leaderboard-container">
        <div class="loading-row">Loading standings…</div>
      </div>
    </section>

    <section id="activity-section" hidden>

    <footer>Auto-refreshes every couple minutes · Data via ESPN Fantasy</footer>

<script src="nav.js"></script>
<script>
  // This Worker fetches ESPN directly and caches the computed result in KV
  // (see the retirement-league-refresh-proxy repo/src/index.js) — no more
  // Google Sheet or GitHub Action in the loop for this page. A GET here
  // either returns data cached within the last 2 minutes instantly, or
  // fetches fresh from ESPN, caches it, and returns that.
  const WORKER_URL = 'https://retirement-league-refresh-proxy.bradbutcher321.workers.dev';

  function fmtScore(n) {
    const num = parseFloat(n);
    return isNaN(num) ? n : num.toFixed(2);
  }

  // Which matchups are currently expanded, keyed by team-name pair rather
  // than array index so expansion survives the list re-sorting finals to
  // the bottom, or the whole innerHTML being rebuilt on the next poll.
  const expandedMatchups = new Set();
  const matchupKey = (m) => `${m.awayName}::${m.homeName}`;

  // Four states a starter's real NFL game can be in: hasn't kicked off
  // yet, in progress, in progress AND their team has the ball (the single
  // highest-attention moment), or over. Drives the whole-cell wash and
  // edge accent bar via .player-cell.state-* — colors live in CSS.
  function playerState(p) {
    if (!p || !p.game) return null;
    if (p.game.state === 'pre') return 'pre';
    if (p.game.state === 'post') return 'final';
    return p.game.hasPossession ? 'possession' : 'live';
  }

  function renderPlayerCell(p, side, state) {
    if (!p) return `<div class="player-cell ${side}"></div>`;
    const hasLiveScore = p.livePoints !== null && p.livePoints !== undefined;
    let gameLine = '';
    if (p.game) {
      if (p.game.state === 'pre') {
        const kickoff = p.game.date ? new Date(p.game.date) : null;
        const when = kickoff
          ? `${kickoff.toLocaleDateString([], { weekday: 'short' })} ${kickoff.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`
          : '';
        gameLine = `vs ${p.game.opponent}${when ? ' · ' + when : ''}`;
      } else if (p.game.state === 'post') {
        gameLine = `${p.game.opponent} ${p.game.teamScore}-${p.game.opponentScore} Final`;
      } else {
        gameLine = `${p.game.opponent} ${p.game.teamScore}-${p.game.opponentScore} · Q${p.game.period} ${p.game.clock}`;
      }
    }
    const teamTag = p.game && p.game.team ? `<span class="team-tag">${p.game.team}</span>` : '';
    return `
      <div class="player-cell ${side} ${state ? 'state-' + state : ''}">
        <div class="player-info">
          <div class="player-name"><span class="name-text">${p.name}</span>${teamTag}</div>
          <div class="player-game-line">${gameLine}</div>
          <div class="player-stat-line">${p.statLine || ''}</div>
        </div>
        <div class="player-score">
          <div class="current">${hasLiveScore ? fmtScore(p.livePoints) : '-'}</div>
          <div class="projected">${fmtScore(p.projectedPoints)}</div>
        </div>
      </div>`;
  }

  function renderMatchupDetails(m) {
    const awayPlayers = m.awayPlayers || [];
    const homePlayers = m.homePlayers || [];
    const rowCount = Math.max(awayPlayers.length, homePlayers.length);
    const rows = [];
    for (let i = 0; i < rowCount; i++) {
      const a = awayPlayers[i];
      const h = homePlayers[i];
      const awayState = playerState(a);
      const homeState = playerState(h);
      rows.push(`
        <div class="detail-row">
          ${renderPlayerCell(a, 'away', awayState)}
          <div class="detail-position">
            <span class="position-label">${(a && a.slot) || (h && h.slot) || ''}</span>
          </div>
          ${renderPlayerCell(h, 'home', homeState)}
        </div>`);
    }
    return `<div class="matchup-details">${rows.join('')}</div>`;
  }

  // A matchup is decided (green bar, sinks to the bottom) once nobody is left to
  // play on either side, or once a team with no players left is already behind
  // its opponent's current score: the opponent's score can only go up, so the
  // finished team can't catch back up. The second case needs the NFL game
  // states to be readable; otherwise a team with "0 left" might just be missing data.
  function matchupDecided(m) {
    const hIn = parseInt(m.homeInPlay, 10) || 0, aIn = parseInt(m.awayInPlay, 10) || 0;
    const hRem = parseInt(m.homeRemaining, 10) || 0, aRem = parseInt(m.awayRemaining, 10) || 0;
    if (hIn + aIn + hRem + aRem === 0) return true;
    if (!medianStatusKnown) return false;
    const hs = parseFloat(m.homeScore), as = parseFloat(m.awayScore);
    return (hIn + hRem === 0 && hs < as) || (aIn + aRem === 0 && as < hs);
  }

  function renderMatchupCard(m) {
    const homeLeading = parseFloat(m.homeScore) >= parseFloat(m.awayScore);
    const homeInPlay = parseInt(m.homeInPlay, 10) || 0;
    const awayInPlay = parseInt(m.awayInPlay, 10) || 0;
    const homeRemaining = parseInt(m.homeRemaining, 10) || 0;
    const awayRemaining = parseInt(m.awayRemaining, 10) || 0;
    const isLive = homeInPlay + awayInPlay > 0;
    const isFinal = matchupDecided(m);
    const statusBadge = (count, label) => {
      const done = count === 0;
      return `<span class="remaining-badge ${done ? 'done' : ''}">
                <span class="dot"></span>${count} ${label}
              </span>`;
    };
    const statusRow = (inPlay, remaining) => `
      <div class="badge-row">
        ${statusBadge(inPlay, 'In Play')}
        ${statusBadge(remaining, 'To Play')}
      </div>`;
    const chipRow = (winProbability, streak) => {
      const wpChip = typeof winProbability === 'number'
        ? `<span class="chip ${winProbability >= 50 ? 'wp-fav' : ''}">${Math.round(winProbability)}% to win</span>`
        : '';
      const streakChip = streak
        ? `<span class="chip ${streak[0] === 'W' ? 'streak-win' : 'streak-loss'}">${streak}</span>`
        : '';
      return (wpChip || streakChip) ? `<div class="badge-row">${wpChip}${streakChip}</div>` : '';
    };
    const metaRow = (manager, record) => `
      <div class="meta-row">
        ${manager ? `<span class="manager-name">${manager}</span><span class="meta-dot">•</span>` : ''}
        <span>${record}</span>
      </div>`;

    const sideClass = (leading) => leading ? `leading ${isFinal ? 'final' : ''}` : '';
    const key = matchupKey(m);
    const expanded = expandedMatchups.has(key);

    return `
      <div class="matchup-card ${expanded ? 'expanded' : ''}" data-key="${encodeURIComponent(key)}">
        <div class="side away ${sideClass(!homeLeading)}">
          <div class="team-name">${m.awayName}</div>
          ${metaRow(m.awayManager, m.awayRecord)}
          <div class="score-line">
            <span class="score">${fmtScore(m.awayScore)}</span>
            <span class="proj">proj ${fmtScore(m.awayProjected)}</span>
          </div>
          ${chipRow(m.awayWinProbability, m.awayStreak)}
          ${statusRow(awayInPlay, awayRemaining)}
        </div>
        <div class="vs-divider">
          <span class="vs-badge">VS</span>
          ${isLive ? `<span class="live-indicator"><span class="pulse-dot"></span>Live</span>` : ''}
          <span class="expand-chip">
            <span class="label-collapsed">▾ Expand</span>
            <span class="label-expanded">▴ Collapse</span>
          </span>
        </div>
        <div class="side home ${sideClass(homeLeading)}">
          <div class="team-name">${m.homeName}</div>
          ${metaRow(m.homeManager, m.homeRecord)}
          <div class="score-line">
            <span class="score">${fmtScore(m.homeScore)}</span>
            <span class="proj">proj ${fmtScore(m.homeProjected)}</span>
          </div>
          ${chipRow(m.homeWinProbability, m.homeStreak)}
          ${statusRow(homeInPlay, homeRemaining)}
        </div>
        ${renderMatchupDetails(m)}
      </div>`;
  }

  function medianTeamName(t) { return t.manager || t.name; }

  // Status line under each score: locked (result can't change), final (no
  // starters left), or what's still to come. Blank when the NFL game state
  // couldn't be read, so nobody is wrongly shown as finished.
  function miniStatus(t, cls) {
    if (!t.statusKnown) return '';
    if (t.locked) return `<div class="stat lock ${cls}">\u2713 LOCKED ${t.lockedAbove ? 'ABOVE' : 'BELOW'}</div>`;
    if (t.done) return '<div class="stat">FINAL</div>';
    const toPlay = t.remaining ? `${t.remaining} to play` : '';
    if (t.inPlay) return `<div class="stat"><span class="live-dot ${cls}"></span><span class="live-txt">${t.inPlay} live</span>${toPlay ? '<span>\u00b7 ' + toPlay + '</span>' : ''}</div>`;
    return `<div class="stat">${toPlay}</div>`;
  }

  function buildMiniGrid(list, cls) {
    if (!list.length) return '';
    return `<div class="mini-grid">${list.map(t => `
      <div class="mini-card ${cls}${t.locked ? ' locked' : ''}">
        <div class="name">${t.name}</div>
        <div class="score">${fmtScore(t.score)}</div>
        ${miniStatus(t, cls)}
      </div>`).join('')}</div>`;
  }

  // Queued by renderMedianCard while building the (synchronous, string-based)
  // page HTML, then drained right after that HTML is inserted into the DOM —
  // the chart needs each .vplot's actual rendered height (for collision
  // math), which only exists once the element is really on the page.
  let spreadChartJobs = [];
  // Whether the Worker could read NFL game states this refresh; without that
  // every team would look finished, so status and locks stay hidden.
  let medianStatusKnown = false;

  const SPREAD_MIN_GAP = 3; // px minimum breathing room between separate rows

  // A name's rendered height doesn't depend on how long it is (one line is
  // one line), so rather than guess at row padding/border/line-height and
  // get it wrong, briefly render one real 1-slot and one real 2-slot row
  // (invisible, off the layout flow) in the actual container and measure
  // them — height of an empty row, and how much each added slot costs.
  function measurePillHeights(container) {
    const probe = document.createElement('div');
    probe.className = 'name-row';
    probe.style.visibility = 'hidden';
    probe.style.position = 'absolute';
    probe.style.left = '-9999px';
    probe.innerHTML = '<span class="slot">Xx</span>';
    container.appendChild(probe);
    const singleHeight = probe.offsetHeight;
    probe.innerHTML = '<span class="slot">Xx</span><span class="slot">Xx</span>';
    const slotHeight = probe.offsetHeight - singleHeight;
    container.removeChild(probe);
    return { singleHeight, slotHeight };
  }

  // Every row (single name or merged) renders at exactly the width of the
  // single longest name among this week's teams — measured for real
  // rather than guessed, so there's no leftover margin around shorter
  // names once that longest one is accounted for.
  function measureMaxRowWidth(container, names) {
    const probe = document.createElement('div');
    probe.className = 'name-row';
    probe.style.visibility = 'hidden';
    probe.style.position = 'absolute';
    probe.style.left = '-9999px';
    container.appendChild(probe);
    let max = 0;
    for (const name of names) {
      probe.innerHTML = `<span class="slot">${name}</span>`;
      max = Math.max(max, probe.offsetWidth);
    }
    container.removeChild(probe);
    return max;
  }

  // Positions every team by its actual score along one axis (not by rank),
  // merging adjacent teams into a single taller row wherever they'd
  // otherwise visually collide, so distance on the page always means
  // distance in points instead of silently overlapping. Pure 0..plotSize
  // number-line math — used for the vertical axis, with "width" meaning
  // "size along the axis" (height, here) and pos 0 meaning the lowest score.
  function computeSpreadClusters(ascendingTeams, plotSize, singleSize, slotSize) {
    const scores = ascendingTeams.map(t => t.score);
    const min = scores[0];
    const max = scores[scores.length - 1];
    const idealPos = s => (max === min ? plotSize / 2 : ((s - min) / (max - min)) * plotSize);
    const sizeOf = c => singleSize + (c.members.length - 1) * slotSize;

    // Pass 1: greedy merge based on each team's ideal (unclamped) position.
    const clusters = [];
    for (const t of ascendingTeams) {
      const pos = idealPos(t.score);
      const prev = clusters[clusters.length - 1];
      if (prev) {
        const requiredGap = sizeOf(prev) / 2 + singleSize / 2 + SPREAD_MIN_GAP;
        if (pos - prev.pos < requiredGap) {
          prev.members.push(t);
          prev.pos = (prev.pos * (prev.members.length - 1) + pos) / prev.members.length;
          continue;
        }
      }
      clusters.push({ members: [t], pos });
    }

    // A cluster's own half-size can push it past the plot's edge even
    // though its center (pos) is a valid in-range position — e.g. several
    // teams tied at the very lowest score merge into a row centered at
    // pos=0, and the centering transform then hangs half that row off the
    // edge of the card entirely. Clamp the first/last cluster inward by
    // their own half-size before spacing the rest off of them.
    if (clusters.length) {
      const first = clusters[0];
      first.pos = Math.max(first.pos, sizeOf(first) / 2);
    }

    // Pass 2: push clusters apart low-to-high so a merge that grew a row
    // can't then make it overlap its neighbor.
    for (let i = 1; i < clusters.length; i++) {
      const prevC = clusters[i - 1], curC = clusters[i];
      const requiredGap = sizeOf(prevC) / 2 + sizeOf(curC) / 2 + SPREAD_MIN_GAP;
      if (curC.pos - prevC.pos < requiredGap) curC.pos = prevC.pos + requiredGap;
    }

    if (clusters.length) {
      const last = clusters[clusters.length - 1];
      last.pos = Math.min(last.pos, plotSize - sizeOf(last) / 2);
    }
    clusters.forEach(c => { c.size = sizeOf(c); });
    return clusters;
  }

  // The median tick's position comes from where the rows actually
  // rendered (post edge-clamping above), not from the raw linear score
  // scale — otherwise a cluster shifted to avoid spilling off the card
  // could end up visually on the wrong side of a tick placed purely by
  // score, even though every one of its members is genuinely below (or
  // above) the median.
  function findMedianTickPos(clusters, median, plotSize, isBelow = m => m.score < median) {
    for (const c of clusters) {
      const belowCount = c.members.filter(isBelow).length;
      if (belowCount > 0 && belowCount < c.members.length) {
        // Straddles the median — tick lines up with this row's own
        // below/above color split, not just its center.
        return (c.pos - c.size / 2) + (belowCount / c.members.length) * c.size;
      }
    }
    let belowEdge = 0, aboveEdge = plotSize;
    for (const c of clusters) {
      if (c.members.every(isBelow)) belowEdge = Math.max(belowEdge, c.pos + c.size / 2);
      else aboveEdge = Math.min(aboveEdge, c.pos - c.size / 2);
    }
    return (belowEdge + aboveEdge) / 2;
  }

  function renderSpreadChart(elId, ascendingTeams, median, zones) {
    const el = document.getElementById(elId);
    if (!el || ascendingTeams.length < 2) return;
    const plotSize = el.clientHeight || 220;
    const { singleHeight, slotHeight } = measurePillHeights(el);
    const rowWidth = measureMaxRowWidth(el, ascendingTeams.map(t => t.name)) + 24;
    const clusters = computeSpreadClusters(ascendingTeams, plotSize, singleHeight, slotHeight);
    // Highest score renders at the top, so a cluster's axis position (0 =
    // lowest score) maps to "100% minus its share of the plot" for `top`.
    const toTopPct = pos => 100 - (pos / plotSize) * 100;
    const RED = 'rgba(192,87,75,0.28)';
    const GREEN = 'rgba(76,154,107,0.28)';

    let html = '';
    if (zones) {
      if (zones.up !== null) {
        const yUp = toTopPct(findMedianTickPos(clusters, median, plotSize, m => m.score <= zones.up));
        html += `<div class="zone up" style="top:0; height:${yUp}%;"></div><div class="zone-label up" style="top:${yUp}%;">\u25B2 ${fmtScore(zones.up)}</div>`;
      }
      if (zones.down !== null) {
        const yDn = toTopPct(findMedianTickPos(clusters, median, plotSize, m => m.score < zones.down));
        html += `<div class="zone dn" style="top:${yDn}%; bottom:0;"></div><div class="zone-label dn" style="top:${yDn}%;">\u25BC ${fmtScore(zones.down)}</div>`;
      }
    }
    html += '<div class="axis"></div>';
    const medianPct = toTopPct(findMedianTickPos(clusters, median, plotSize));
    html += `<div class="median-tick" style="top:${medianPct}%; width:${rowWidth - 2}px;"></div>`;

    clusters.forEach(c => {
      const belowCount = c.members.filter(m => m.score < median).length;
      const aboveCount = c.members.length - belowCount;
      let background, borderColor;
      if (belowCount === 0) {
        background = `linear-gradient(${GREEN}, ${GREEN})`;
        borderColor = 'var(--turf-dim)';
      } else if (aboveCount === 0) {
        background = `linear-gradient(${RED}, ${RED})`;
        borderColor = 'rgba(192,87,75,0.5)';
      } else {
        // Straddles the median — split proportional to how many members
        // are on each side (1 below + 1 above = an even half/half row).
        // "to top" so the below/red share sits at the bottom, matching
        // low-scores-at-the-bottom.
        const splitPct = (belowCount / c.members.length) * 100;
        background = `linear-gradient(to top, ${RED} ${splitPct}%, ${GREEN} ${splitPct}%)`;
        borderColor = 'var(--line)';
      }
      const slots = c.members
        .slice()
        .sort((a, b) => b.score - a.score) // highest first = rendered on top
        .map(m => `<span class="slot ${m.score >= median ? 'above' : 'below'}${m.statusKnown ? (m.locked ? ' locked' : '') + (m.done ? ' final' : '') + (m.inPlay ? ' live' : '') : ''}">${m.name}</span>`)
        .join('');
      html += `<div class="name-row" style="top:${toTopPct(c.pos)}%; width:${rowWidth}px; background-image:${background}; border-color:${borderColor};">${slots}</div>`;
    });

    const lowest = ascendingTeams[0], highest = ascendingTeams[ascendingTeams.length - 1];
    html += `<div class="endcap-score low">${fmtScore(lowest.score)}</div>`;
    html += `<div class="endcap-score high">${fmtScore(highest.score)}</div>`;
    el.innerHTML = html;
  }

  // Splits teams by rank (not by literal distance from the median value) so
  // it always yields an even above/below split — 6-and-6 in a 12-team
  // league — even if a couple of scores happen to tie exactly at the median.
  function renderMedianCard(title, medianValue, teamsSorted, scoreKey, elId, opts = {}) {
    const half = Math.floor(teamsSorted.length / 2);
    const known = medianStatusKnown;
    const withScore = teamsSorted.map(t => ({
      name: medianTeamName(t),
      score: t[scoreKey],
      cur: t.current,
      remaining: t.remaining || 0,
      inPlay: t.inPlay || 0,
      statusKnown: known,
      done: known && !(t.remaining || 0) && !(t.inPlay || 0),
    }));

    // Locks are decided from real (current) scores on both cards. Scores only
    // ever go up, and fantasy points have no cap, so:
    //  - a team is locked ABOVE once at least half the league is finished and
    //    already scoring below its current score (only finished teams are
    //    certain to stay below it; unfinished ones could still climb past);
    //  - a FINISHED team is locked BELOW once at least half the league is
    //    already scoring above it (finished or not, they can't drop back).
    // The zone lines are drawn on the Current strip only, where the axis is
    // in real scores. The lower line applies to a team that has finished.
    let zones = null;
    if (opts.locks && known) {
      const finished = withScore.filter(m => m.done).map(m => m.cur);
      const upLine = finished.length >= half ? [...finished].sort((a, b) => a - b)[half - 1] : null;
      const downLine = withScore.length > half ? withScore.map(m => m.cur).sort((a, b) => b - a)[half - 1] : null;
      withScore.forEach(m => {
        m.lockedAbove = upLine !== null && m.cur > upLine;
        m.lockedBelow = m.done && downLine !== null && m.cur < downLine;
        m.locked = m.lockedAbove || m.lockedBelow;
      });
      if (opts.zones && (upLine !== null || downLine !== null)) zones = { up: upLine, down: downLine };
    }

    const above = withScore.slice(0, half);
    const below = withScore.slice(withScore.length - half);
    spreadChartJobs.push({
      elId,
      median: medianValue,
      ascending: [...withScore].sort((a, b) => a.score - b.score),
      zones,
    });
    const legend = known ? `
        <div class="median-legend">
          ${opts.locks ? '<span class="k"><span class="sw locked"></span>Locked</span>' : ''}
          <span class="k"><span style="color:var(--text-dim);font-weight:700">\u2713</span>Final</span>
          <span class="k"><span class="live-dot"></span>Live</span>
          ${zones ? '<span class="k" style="color:var(--turf)">\u25B2 Locked Above Score</span><span class="k" style="color:var(--loss)">\u25BC Locked Below Score</span>' : ''}
        </div>` : '';
    return `
      <div class="median-card">
        <div class="median-card-header">
          <span class="median-card-title">${title}</span>
          <span class="median-card-value">${fmtScore(medianValue)}</span>
        </div>
        <div class="card-body">
          <div>
            <div class="group-label above">Above Median</div>
            ${buildMiniGrid(above, 'above')}
            <div class="group-label below">Below Median</div>
            ${buildMiniGrid(below, 'below')}
          </div>
          <div class="spread-col${zones ? ' zoned' : ''}">
            <div class="vplot${zones ? ' zoned' : ''}" id="${elId}"></div>
          </div>
        </div>${legend}
      </div>`;
  }

  // Thursday Night Football kickoff is when this week's scores actually
  // start moving off 0.00, so that's what the pending card counts down to.
  function getNextThursdayKickoff() {
    const now = new Date();
    const target = new Date(now);
    target.setHours(20, 15, 0, 0); // 8:15 PM local time
    target.setDate(now.getDate() + ((4 - now.getDay() + 7) % 7)); // 4 = Thursday
    if (target <= now) target.setDate(target.getDate() + 7);
    return target;
  }

  function formatCountdown(ms) {
    if (ms <= 0) return 'Kickoff!';
    const totalMinutes = Math.floor(ms / 60000);
    const days = Math.floor(totalMinutes / (60 * 24));
    const hours = Math.floor((totalMinutes % (60 * 24)) / 60);
    const minutes = totalMinutes % 60;
    if (days > 0) return `${days}d ${hours}h ${minutes}m`;
    if (hours > 0) return `${hours}h ${minutes}m`;
    return `${minutes}m`;
  }

  // Re-looks-up the element each call (rather than caching a reference) so
  // it keeps working across loadDashboard() re-rendering the card every
  // couple minutes, and no-ops harmlessly once the season is underway and
  // the pending card (and this element) no longer exist.
  function updateKickoffCountdown() {
    const el = document.getElementById('kickoff-countdown');
    if (!el) return;
    el.textContent = formatCountdown(getNextThursdayKickoff() - new Date());
  }

  // Shown for the Current Score card before Week 1 kicks off, when every
  // team is tied at 0.00 and an above/below split would be meaningless.
  function renderMedianPendingCard(title) {
    return `
      <div class="median-card">
        <div class="median-card-header">
          <span class="median-card-title">${title}</span>
          <span class="median-card-value">—</span>
        </div>
        <div class="median-pending">
          <div class="pending-headline" id="kickoff-countdown">—</div>
          <div class="pending-sub">Until Thursday Night Kickoff</div>
        </div>
      </div>`;
  }

  function fmtPct(n) {
    const num = parseFloat(n);
    return isNaN(num) ? '—' : `${num.toFixed(1)}%`;
  }

  // The row's gold rank/green edge means "actually holds a playoff spot
  // right now" (rank <= however many the league sends teams to) — a
  // deterministic fact from standings position. The chip's color means
  // "current playoff odds >= 50%" — a separate, probability-based signal
  // that can disagree with raw rank (tiebreakers, remaining schedule).
  // Deliberately not the same threshold, so showing both is more
  // informative than picking just one.
  function renderLeaderboardRow(t, rank, playoffTeamCount) {
    const hasPlayoffPct = typeof t.playoffPct === 'number';
    const chipCls = hasPlayoffPct ? (t.playoffPct >= 50 ? 'high' : 'low') : '';
    const inPlayoffPosition = playoffTeamCount > 0 && rank <= playoffTeamCount;
    return `
      <div class="lb-row ${inPlayoffPosition ? 'playoff' : ''}">
        <div class="lb-rank">${rank}</div>
        <div class="lb-identity">
          <div class="lb-name">${t.name}</div>
          <div class="lb-meta">${t.manager ? `${t.manager} • ` : ''}${t.record}</div>
        </div>
        <div class="lb-stat"><div class="v">${fmtScore(t.pointsFor)}</div><div class="l">PF</div></div>
        <div class="lb-stat"><div class="v">${fmtScore(t.pointsAgainst)}</div><div class="l">PA</div></div>
        <div class="lb-playoff-chip ${chipCls}">${fmtPct(t.playoffPct)}</div>
      </div>`;
  }

  // ---------- Standings: through last week / + this week live / + this week projected ----------
  let standingsData = null;
  let standingsMode = 'through';

  function formatRecordParts(w, l, t) { return `${w}-${l}${t ? '-' + t : ''}`; }

  // Standings as they would look if the week ended with the given scores:
  // last weeks' results plus this week's head-to-head result and this week's
  // result against the median (top half of scores wins), points included.
  function projectStandings(data, mode) {
    const teams = data.teams || [];
    const scoreOf = t => (mode === 'proj' ? Math.max(t.projected || 0, t.current || 0) : (t.current || 0));
    const byName = new Map(teams.map(t => [t.name, t]));
    const oppByName = new Map();
    (data.matchups || []).forEach(m => {
      oppByName.set(m.homeName, m.awayName);
      oppByName.set(m.awayName, m.homeName);
    });
    const ranked = [...teams].sort((a, b) => scoreOf(b) - scoreOf(a));
    const half = Math.floor(ranked.length / 2);
    const medianWin = new Map(ranked.map((t, i) => [t.name, i < half]));
    return teams.map((t, i) => {
      const p = t.prior || { w: 0, l: 0, t: 0, pf: t.pointsFor, pa: t.pointsAgainst };
      const opp = byName.get(oppByName.get(t.name));
      const own = scoreOf(t);
      const oppScore = opp ? scoreOf(opp) : null;
      let w = p.w, l = p.l, ties = p.t;
      if (mode !== 'through') {
        if (oppScore !== null) { if (own > oppScore) w++; else if (own < oppScore) l++; else ties++; }
        if (medianWin.get(t.name)) w++; else l++;
      }
      return {
        name: t.name, manager: t.manager, w, l, ties,
        pf: p.pf + (mode === 'through' ? 0 : own),
        pa: p.pa + (mode === 'through' || oppScore === null ? 0 : oppScore),
        espnRank: i + 1,
        playoffPct: t.playoffPct,
      };
    });
  }

  function renderStandings() {
    const data = standingsData;
    if (!data) return;
    const teams = data.teams || [];
    const container = document.getElementById('leaderboard-container');
    const toggle = document.getElementById('standings-toggle');
    const week = data.week || 1;
    const hasPrior = week > 1 && teams.length > 0 && teams.every(t => t.prior);
    const started = teams.some(t => (t.current || 0) > 0);

    if (!hasPrior || !started) {
      // Week 1, or nothing scored yet: no earlier weeks to compare against.
      toggle.innerHTML = '';
      standingsMode = 'through';
      container.innerHTML = teams.map((t, idx) => renderLeaderboardRow(t, idx + 1, data.playoffTeamCount)).join('');
      return;
    }

    const modes = [['through', `Through Week ${week - 1}`], ['live', `+ Week ${week} live`], ['proj', `+ Week ${week} projected`]];
    const m = standingsMode;
    toggle.innerHTML = `<div class="sup-seg">${modes.map(([k, l]) => `<button type="button" data-stand="${k}" class="${k === m ? 'on' : ''}">${l}</button>`).join('')}</div>`;

    if (m === 'through') {
      container.innerHTML = teams.map((t, idx) => renderLeaderboardRow(t, idx + 1, data.playoffTeamCount)).join('');
      return;
    }

    const rows = projectStandings(data, m);
    const base = projectStandings(data, 'through');
    const baseRank = new Map([...base].sort((a, b) => b.w - a.w || b.pf - a.pf).map((r, i) => [r.name, i + 1]));
    const ordered = [...rows].sort((a, b) => b.w - a.w || b.pf - a.pf);
    container.innerHTML = ordered.map((r, i) => {
      const rank = i + 1;
      const move = baseRank.get(r.name) - rank;
      const chipCls = move > 0 ? 'high' : move < 0 ? 'low' : '';
      const chipText = move > 0 ? `\u25B2 ${move}` : move < 0 ? `\u25BC ${-move}` : '\u2013';
      const inPlayoffPosition = data.playoffTeamCount > 0 && rank <= data.playoffTeamCount;
      return `
      <div class="lb-row ${inPlayoffPosition ? 'playoff' : ''}">
        <div class="lb-rank">${rank}</div>
        <div class="lb-identity">
          <div class="lb-name">${r.name}</div>
          <div class="lb-meta">${r.manager ? `${r.manager} • ` : ''}${formatRecordParts(r.w, r.l, r.ties)}</div>
        </div>
        <div class="lb-stat"><div class="v">${fmtScore(r.pf)}</div><div class="l">PF</div></div>
        <div class="lb-stat"><div class="v">${fmtScore(r.pa)}</div><div class="l">PA</div></div>
        <div class="lb-playoff-chip ${chipCls}">${chipText}</div>
      </div>`;
    }).join('');
  }

  document.getElementById('standings-toggle').addEventListener('click', e => {
    const b = e.target.closest('[data-stand]');
    if (!b) return;
    standingsMode = b.dataset.stand;
    renderStandings();
  });

  function renderAccoladeCard(eyebrow, team, manager, meta, score) {
    if (!team) {
      return `
        <div class="accolade-card">
          <div class="accolade-eyebrow">${eyebrow}</div>
          <div class="accolade-placeholder">Stats will appear once games get underway.</div>
        </div>`;
    }
    return `
      <div class="accolade-card">
        <div class="accolade-eyebrow">${eyebrow}</div>
        <div class="accolade-score">${fmtScore(score)}</div>
        <div class="accolade-team">${team}</div>
        <div class="accolade-meta">
          ${manager ? `<span>${manager}</span>` : ''}
          ${manager && meta ? `<span class="accolade-dot">•</span>` : ''}
          ${meta ? `<span>${meta}</span>` : ''}
        </div>
      </div>`;
  }

  // ---------- Superlatives: through last week / + this week live / + this week projected ----------
  let superlativesData = null;
  let superlativesMode = 'live';

  function renderSuperlatives() {
    const data = superlativesData;
    if (!data) return;
    const container = document.getElementById('accolades-container');
    const toggle = document.getElementById('superlatives-toggle');
    const teams = (data.teams || []).map(t => ({
      team: t.name,
      manager: t.manager,
      n: medianTeamName(t),
      prior: typeof t.priorPoints === 'number' ? t.priorPoints : (t.pointsFor || 0),
      cur: t.current || 0,
      proj: Math.max(t.projected || 0, t.current || 0),
    }));
    const week = data.week || 1;
    const prevHigh = data.priorSeasonHigh || null;
    const hasPrior = week > 1 && Boolean(prevHigh);

    // Nothing has been scored yet this season: keep the original placeholders.
    if (!hasPrior && !teams.some(t => t.cur > 0)) {
      toggle.innerHTML = '';
      container.innerHTML =
        renderAccoladeCard('Season High Score', null, '', '', 0) +
        renderAccoladeCard('Season Points Leader', null, '', '', 0);
      return;
    }

    const modes = hasPrior
      ? [['through', `Through Week ${week - 1}`], ['live', `+ Week ${week} live`], ['proj', `+ Week ${week} projected`]]
      : [['live', `Week ${week} live`], ['proj', `Week ${week} projected`]];
    if (!modes.some(([k]) => k === superlativesMode)) superlativesMode = 'live';
    const m = superlativesMode;
    toggle.innerHTML = `<div class="sup-seg">${modes.map(([k, l]) => `<button type="button" data-sup="${k}" class="${k === m ? 'on' : ''}">${l}</button>`).join('')}</div>`;

    const tag = (isNew, label) => !hasPrior || m === 'through' ? ''
      : (isNew ? `<div class="sup-tag new">${label}</div>` : '<div class="sup-tag hold">Holding</div>');
    const card = (eyebrow, score, team, manager, meta, extra, tagHtml) => `
      <div class="accolade-card">
        <div class="accolade-eyebrow">${eyebrow}</div>
        ${tagHtml || ''}
        <div class="accolade-score">${fmtScore(score)}</div>
        <div class="accolade-team">${team}</div>
        <div class="accolade-meta">
          ${manager ? `<span>${manager}</span>` : ''}
          ${manager && meta ? '<span class="accolade-dot">\u2022</span>' : ''}
          ${meta ? `<span>${meta}</span>` : ''}
        </div>
        ${extra || ''}
      </div>`;

    // ----- Season High Score -----
    const recordScore = prevHigh ? prevHigh.score : 0;
    const bestCur = teams.reduce((a, t) => (!a || t.cur > a.cur ? t : a), null);
    const bestProj = teams.reduce((a, t) => (!a || t.proj > a.proj ? t : a), null);
    const liveBreaks = bestCur && bestCur.cur > recordScore;
    const projBreaks = bestProj && bestProj.proj > Math.max(recordScore, bestCur ? bestCur.cur : 0);
    let high;
    if (m === 'through' && prevHigh) high = { score: prevHigh.score, team: prevHigh.team, manager: prevHigh.manager, meta: `Week ${prevHigh.week}`, isNew: false };
    else if (m === 'proj' && projBreaks) high = { score: bestProj.proj, team: bestProj.team, manager: bestProj.manager, meta: `Week ${week} \u00b7 projected`, isNew: true };
    else if (liveBreaks) high = { score: bestCur.cur, team: bestCur.team, manager: bestCur.manager, meta: `Week ${week} \u00b7 live`, isNew: true };
    else if (prevHigh) high = { score: prevHigh.score, team: prevHigh.team, manager: prevHigh.manager, meta: `Week ${prevHigh.week}`, isNew: false };
    else high = { score: bestCur.cur, team: bestCur.team, manager: bestCur.manager, meta: `Week ${week} \u00b7 live`, isNew: true };

    let highExtra = '';
    if (m === 'through') {
      highExtra = `<div class="sup-note">Record set in Week ${prevHigh.week}. Switch to a live or projected view to see how this week's scores stack up.</div>`;
    } else {
      const rows = [...teams].sort((a, b) => (m === 'proj' ? b.proj - a.proj : b.cur - a.cur)).slice(0, 3).map(r => {
        const gap = Math.max(0, recordScore - (m === 'proj' ? r.proj : r.cur));
        return `<div class="sup-row"><span class="n">${r.n}</span><span class="r ${m === 'live' ? 'lead' : ''}">${fmtScore(r.cur)}</span>` +
          `<span class="r">${recordScore ? fmtScore(gap) + ' short' : '\u2014'}</span><span class="r ${m === 'proj' ? 'lead' : ''}">${fmtScore(r.proj)}</span></div>`;
      }).join('');
      highExtra = `<div class="sup-lines"><div class="sup-row head"><span>Best this week</span><span class="r">Live</span><span class="r">To record</span><span class="r">Proj</span></div>${rows}</div>`;
    }

    // ----- Season Points Leader -----
    const total = r => r.prior + (m === 'through' ? 0 : m === 'live' ? r.cur : r.proj);
    const ranked = [...teams].sort((a, b) => total(b) - total(a));
    const throughLeader = [...teams].sort((a, b) => b.prior - a.prior)[0];
    const leader = ranked[0];
    const leaderChanged = hasPrior && m !== 'through' && leader.team !== throughLeader.team;
    const modeLabel = m === 'through' ? `Through Week ${week - 1}` : m === 'live' ? `Through Week ${week} so far` : `Projected through Week ${week}`;
    const leadRows = ranked.slice(0, 4).map((r, i) => `<div class="sup-row"><span class="n">${r.n}</span><span class="r">${fmtScore(r.prior)}</span>` +
      `<span class="r">${m === 'through' ? '\u2014' : '+ ' + fmtScore(m === 'live' ? r.cur : r.proj)}</span><span class="r ${i === 0 ? 'lead' : ''}">${fmtScore(total(r))}</span></div>`).join('');
    const leadExtra = `<div class="sup-lines"><div class="sup-row head"><span>Team</span><span class="r">${week > 1 ? 'Thru Wk ' + (week - 1) : 'Before'}</span><span class="r">Week ${week}</span><span class="r">Total</span></div>${leadRows}</div>`;

    container.innerHTML =
      card('Season High Score', high.score, high.team, high.manager, high.meta, highExtra, tag(high.isNew, 'New record')) +
      card('Season Points Leader', total(leader), leader.team, leader.manager, modeLabel, leadExtra, tag(leaderChanged, 'New leader'));
  }

  document.getElementById('superlatives-toggle').addEventListener('click', e => {
    const b = e.target.closest('[data-sup]');
    if (!b) return;
    superlativesMode = b.dataset.sup;
    renderSuperlatives();
  });

  // ---------- Site activity (unique visitors / page views from the Worker's own counter) ----------
  const PAGE_LABELS = { dashboard: 'Live Dashboard', franchise: 'Franchise', 'parlay-results': 'Parlay Results', standings: 'Standings', 'head-to-head': 'Head to Head', overview: 'Overview', 'game-records': 'Game Records' };

  function dayLabel(iso, today) {
    if (iso === today) return 'Today';
    const d = new Date(iso + 'T12:00:00');
    return d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
  }

  function loadActivity() {
    fetch(WORKER_URL + '/stats', { cache: 'no-store' })
      .then(res => res.json())
      .then(st => {
        if (st.error || typeof st.visitorsToday !== 'number') throw new Error(st.error || 'No stats');
        const days = (st.days || []).map(d => `
          <div class="act-row"><span class="n">${dayLabel(d.day, st.today)}</span><span class="r"><b>${d.visitors}</b></span><span class="r"><b>${d.views}</b></span></div>`).join('');
        const pages = (st.topPages || []).map(p => `
          <div class="act-row"><span class="n">${PAGE_LABELS[p.page] || p.page}</span><span class="r"><b>${p.views}</b></span></div>`).join('');
        document.getElementById('activity-container').innerHTML = `
          <div class="act-tiles">
            <div class="act-tile"><div class="act-label">Active now</div><div class="act-value live">${st.activeNow}</div><div class="act-sub">last 5 minutes</div></div>
            <div class="act-tile"><div class="act-label">Unique visitors today</div><div class="act-value">${st.visitorsToday}</div><div class="act-sub">people</div></div>
            <div class="act-tile"><div class="act-label">Page views today</div><div class="act-value">${st.viewsToday}</div><div class="act-sub">pages opened</div></div>
          </div>
          <div class="act-panels">
            <div class="act-card"><div class="act-card-title">Last 7 days</div>
              <div class="act-row head"><span>Day</span><span class="r">Visitors</span><span class="r">Views</span></div>${days || '<div class="act-row"><span class="n">No visits yet</span></div>'}</div>
            <div class="act-card"><div class="act-card-title">Top pages today</div>
              <div class="act-row head"><span>Page</span><span class="r">Views</span></div>${pages || '<div class="act-row"><span class="n">No visits yet</span></div>'}</div>
          </div>`;
        document.getElementById('activity-section').hidden = false;
      })
      .catch(() => { document.getElementById('activity-section').hidden = true; });
  }

  // Polling the Worker every 2 minutes is now cheap regardless of whether
  // the cooldown is active — within it, the Worker just returns its KV
  // cache instantly; only once it's expired does a real ESPN fetch happen.
  const AUTO_REFRESH_MS = 2 * 60 * 1000;

  function loadDashboard() {
    fetch(WORKER_URL, { cache: 'no-store' })
      .then(res => res.json())
      .then(data => {
        if (!data.teams) throw new Error(data.error || 'Empty response from Worker');

        const teams = data.teams || [];
        // Fully final matchups (nobody left to play, nobody in play, on
        // either side) sink to the bottom, but only ever move there once —
        // live and not-yet-started matchups keep their original relative
        // order instead of continuously reshuffling every poll.
        medianStatusKnown = Boolean(data.medianStatusKnown) && teams.every(t => typeof t.remaining === 'number');
        const isMatchupFinal = matchupDecided;
        const matchups = (data.matchups || [])
          .map((m, i) => ({ m, i, final: isMatchupFinal(m) }))
          .sort((a, b) => (a.final === b.final ? a.i - b.i : a.final ? 1 : -1))
          .map(({ m }) => m);

        document.getElementById('week-header').textContent = data.week ? `Live Dashboard — Week ${data.week}` : 'Live Dashboard';
        document.getElementById('updated-at').textContent = data.updatedAt
          ? new Date(data.updatedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          : '—';

        document.getElementById('matchups-container').innerHTML =
          matchups.length ? matchups.map(renderMatchupCard).join('') : '<div class="loading-row">No matchups found.</div>';

        // Team names stay right-aligned (matching every other short name)
        // unless a specific one is actually too long for its box, in which
        // case flip just that one to left-aligned so its ellipsis truncates
        // from the end instead of the start. Reading scrollWidth here is a
        // synchronous layout read, but it's a couple dozen elements at most
        // and only runs on this periodic refresh, so the cost is negligible.
        document.querySelectorAll('#matchups-container .team-name').forEach(el => {
          if (el.scrollWidth > el.clientWidth) el.classList.add('truncate');
        });

        standingsData = data;
        renderStandings();

        // Before games kick off every team sits at 0.00 — an above/below split
        // on current score would be meaningless then, so that card shows a
        // "kickoff hasn't happened yet" placeholder instead of being hidden.
        // Both cards always render so they sit side-by-side on desktop /
        // stacked on mobile, the same as when the season is underway.
        const currentHasStarted = teams.some(t => t.current > 0);
        const byCurrentDesc = [...teams].sort((a, b) => b.current - a.current);
        const byProjectedDesc = [...teams].sort((a, b) => b.projected - a.projected);

        spreadChartJobs = [];
        medianStatusKnown = Boolean(data.medianStatusKnown) && teams.every(t => typeof t.remaining === 'number');
        const medianHtml =
          (currentHasStarted
            ? renderMedianCard('Current Median', data.currentMedian, byCurrentDesc, 'current', 'spread-current', { locks: true, zones: true })
            : renderMedianPendingCard('Current Median')) +
          renderMedianCard('Projected Median', data.projectedMedian, byProjectedDesc, 'projected', 'spread-projected', { locks: true, zones: true });
        document.getElementById('median-container').innerHTML = medianHtml;
        // Needs the .vplot elements to actually be in the DOM first, so
        // clientHeight (used for the collision math) reflects their real
        // rendered height instead of a guessed constant.
        spreadChartJobs.forEach(job => renderSpreadChart(job.elId, job.ascending, job.median, job.zones));
        updateKickoffCountdown();

        superlativesData = data;
        renderSuperlatives();
      })
      .catch(err => {
        console.error('Dashboard error:', err);
        document.getElementById('matchups-container').innerHTML = '<div class="loading-row" style="color:#C0574B;">Error loading league data.</div>';
      });
  }

  // Delegated once — click a card to expand/collapse its roster. The
  // expanded state itself lives in expandedMatchups (checked at render
  // time), so this just needs to flip the class on the clicked element and
  // keep that Set in sync for the next re-render.
  document.getElementById('matchups-container').addEventListener('click', (e) => {
    const card = e.target.closest('.matchup-card');
    if (!card) return;
    const key = decodeURIComponent(card.dataset.key);
    if (expandedMatchups.has(key)) expandedMatchups.delete(key);
    else expandedMatchups.add(key);
    card.classList.toggle('expanded');
  });

  // Background tabs don't poll (each poll costs Worker/KV quota); coming
  // back to the tab refreshes right away if the data is stale.
  let lastLoadAt = 0;
  loadActivity();
  setInterval(() => { if (!document.hidden) loadActivity(); }, 60 * 1000);
  const loadDashboardTracked = () => { lastLoadAt = Date.now(); loadDashboard(); };
  loadDashboardTracked();
  setInterval(() => { if (!document.hidden) loadDashboardTracked(); }, AUTO_REFRESH_MS);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && Date.now() - lastLoadAt >= AUTO_REFRESH_MS) loadDashboardTracked();
  });
  // Ticks the countdown between data refreshes so it counts down smoothly
  // rather than jumping only once every AUTO_REFRESH_MS.
  setInterval(updateKickoffCountdown, 60 * 1000);
</script>
<script src="track.js?v=1" defer></script>
</body>
</html>
