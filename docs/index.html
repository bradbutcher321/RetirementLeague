<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League Statistics Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; margin-top: 0; }
        
        /* Tab Navigation Styling */
        .tab-menu { display: flex; gap: 10px; border-bottom: 2px solid #ddd; margin-bottom: 20px; padding-bottom: 10px; }
        .tab-btn { background: #e8f4f8; border: none; padding: 10px 20px; font-size: 16px; font-weight: bold; color: #2c3e50; cursor: pointer; border-radius: 4px; transition: 0.2s; }
        .tab-btn:hover { background: #d0e7f0; }
        .tab-btn.active { background: #3498db; color: white; }
        
        /* Table Component Styling */
        .table-responsive { width: 100%; overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; white-space: nowrap; }
        th { background: #f8f9fa; font-weight: 600; color: #2c3e50; }
        tr:hover { background-color: #fafafa; }
        
        .loading { font-style: italic; color: #666; padding: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏆 Retirement League Statistics 🏆</h1>
        
        <!-- Tab Buttons (Will be populated by JavaScript) -->
        <div class="tab-menu" id="tab-menu-container"></div>

        <!-- Dynamic Data Content Container -->
        <div class="table-responsive" id="table-container">
            <div class="loading">Select a tab to load league metrics...</div>
        </div>
    </div>

    <script>
        // 1. CONFIGURATION: Define your tab labels and paste your exact CSV URLs here
        const leagueTabs = {
            "Live Weekly Medians": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTpuyTa17f_K_VMTCVBXO4bDPaPkiDf66w8OAXTPtyn1MTQR3yjuCORs91WPabAyjo5Wso_eXKNM1SS/pub?gid=941832551&single=true&output=csv",
            "Historical Standings": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTpuyTa17f_K_VMTCVBXO4bDPaPkiDf66w8OAXTPtyn1MTQR3yjuCORs91WPabAyjo5Wso_eXKNM1SS/pubhtml?gid=283917789&single=true",
            "All-Time Records": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTpuyTa17f_K_VMTCVBXO4bDPaPkiDf66w8OAXTPtyn1MTQR3yjuCORs91WPabAyjo5Wso_eXKNM1SS/pub?gid=0&single=true&output=csv"
        };

        // 2. Generate Tab Buttons dynamically based on configuration
        const menuContainer = document.getElementById('tab-menu-container');
        Object.keys(leagueTabs).forEach((tabName, index) => {
            const button = document.createElement('button');
            button.className = `tab-btn ${index === 0 ? 'active' : ''}`;
            button.innerText = tabName;
            button.onclick = () => switchTab(tabName, button);
            menuContainer.appendChild(button);
        });

        // 3. Main Data Fetch and Render Engine
        function loadTabData(url) {
            const container = document.getElementById('table-container');
            container.innerHTML = '<div class="loading">Fetching records from Google Sheets...</div>';

            fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error('Network error');
                    return response.text();
                })
                .then(csvText => {
                    // Split rows by line break, split cells by comma parsing
                    const rows = csvText.split('\n')
                                        .map(row => row.split(','))
                                        .filter(row => row.length > 0 && row[0].trim() !== ""); // Filter blank lines
                    
                    let htmlTable = '<table><thead><tr>';
                    
                    // Build Headers (First Row)
                    rows[0].forEach(headerText => {
                        htmlTable += `<th>${headerText.replace(/"/g, '')}</th>`;
                    });
                    htmlTable += '</tr></thead><tbody>';
                    
                    // Build Data Rows
                    for (let i = 1; i < rows.length; i++) {
                        htmlTable += '<tr>';
                        rows[i].forEach(cellText => {
                            // Strips extra quotes added by CSV formatting structures
                            htmlTable += `<td>${cellText.replace(/"/g, '')}</td>`;
                        });
                        htmlTable += '</tr>';
                    }
                    htmlTable += '</tbody></table>';
                    
                    container.innerHTML = htmlTable;
                })
                .catch(error => {
                    container.innerHTML = `<div class="loading" style="color: red;">Error: Could not render sheet data. Verify your published CSV link settings.</div>`;
                    console.error(error);
                });
        }

        // 4. Tab Switch Click Coordinator
        function switchTab(tabName, buttonElement) {
            // Remove active classes from all navigation tabs
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            // Set current tab to active status
            buttonElement.classList.add('active');
            // Trigger fetch pipeline
            loadTabData(leagueTabs[tabName]);
        }

        // 5. Initial Execution: Load the very first configured tab on page open
        const initialTabName = Object.keys(leagueTabs)[0];
        loadTabData(leagueTabs[initialTabName]);
    </script>
</body>
</html>
