<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>html{background:#050505}</style>
<title>Retirement League — Live Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The two font-family's woff2 files Google serves for the latin subset
     at the weights this site uses -- one variable-font file per family
     covers every weight declared, confirmed directly by fetching the
     stylesheet below and comparing each @font-face block's url(). Starts
     the actual font downloads immediately, in parallel with that
     stylesheet fetch, instead of waiting to discover these same URLs
     only after the stylesheet loads and is parsed -- avoids the
     fallback-to-webfont swap (FOUT) that otherwise shows on a slow or
     uncached load. If Google ever changes these hashed URLs, this just
     degrades to a wasted (unused) preload, not a correctness issue -- the
     stylesheet's own @font-face still fetches whatever the new URL is. -->
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/bigshouldersdisplay/v24/fC1_PZJEZG-e9gHhdI4-NBbfd2ys3SjJCx1czNDu.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=6">
<link rel="stylesheet" href="nav.css?v=4">
<style>
  /* ---------- Matchup cards ---------- */
  .matchups{ display: flex; flex-direction: column; gap: 14px; }

  .matchup-card{
    position: relative;
    background: linear-gradient(165deg, var(--surface-2), var(--surface));
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 20px 50px -20px rgba(0,0,0,0.6);
    display: grid;
    cursor: pointer;
    /* Each side has a 175px floor instead of shrinking freely, so on a
       narrow phone the card stays laid out side-by-side (never stacks) and
       instead scrolls horizontally within itself — overflow-x lives on this
       same element as the background/border so the background scrolls
       along with the content instead of leaving a gap. overflow-y is
       pinned to hidden (rather than left to auto-promote) so an
       absolutely-positioned descendant -- namely the glow pseudo-element
       below -- can never inflate this into a second, vertical scrollbar. */
    grid-template-columns: minmax(175px, 1fr) auto minmax(175px, 1fr);
    align-items: center;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
  }
  /* Full-bleed wash toward whichever side is the projected favorite --
     layered on top of the base surface gradient (first-listed background
     paints on top), strongest at that side's edge and fading by center.
     Gold pregame; the more specific .live rules below override to red
     once the game actually has players in it, so red stays a dedicated
     "this is live" signal rather than just another favorite indicator. */
  .matchup-card.fav-away{ background: linear-gradient(90deg, rgba(212,180,106,0.10) 0%, transparent 46%), linear-gradient(165deg, var(--surface-2), var(--surface)); }
  .matchup-card.fav-home{ background: linear-gradient(270deg, rgba(212,180,106,0.10) 0%, transparent 46%), linear-gradient(165deg, var(--surface-2), var(--surface)); }
  .matchup-card.live.fav-away{ background: linear-gradient(90deg, rgba(214,98,79,0.12) 0%, transparent 46%), linear-gradient(165deg, var(--surface-2), var(--surface)); }
  .matchup-card.live.fav-home{ background: linear-gradient(270deg, rgba(214,98,79,0.12) 0%, transparent 46%), linear-gradient(165deg, var(--surface-2), var(--surface)); }
  /* A live game gets a faint warm wash across the whole card -- a glance
     down the list should pick out what's in progress before reading any
     text. Sits behind everything else (z-index 0), which is why .side /
     .vs-divider / .matchup-details / .live-indicator below all get
     z-index 1+. inset:0 (not a negative inset) -- this card scrolls on
     the x-axis, so anything extending past its own box would inflate the
     scrollable area and add a phantom scrollbar even on a desktop width
     that never needed one. */
  .matchup-card::before{
    content: ''; position: absolute; inset: 0; filter: blur(10px);
    background: radial-gradient(circle at 50% 10%, rgba(214,98,79,0.22), transparent 60%);
    pointer-events: none; z-index: 0; opacity: 0; transition: opacity 0.4s ease;
  }
  .matchup-card.live::before{ opacity: 1; }

  .side{
    position: relative; z-index: 1;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  /* The top border accent that used to mark the live-score leader is
     gone -- the full-bleed projected-favorite wash covers that now, and
     having both read as two different, sometimes-disagreeing signals
     (live lead vs. projected favorite) on the same card. */
  .side.leading .score{ text-shadow: 0 0 20px rgba(212,180,106,0.45); }
  .side.leading.final .score{ text-shadow: 0 0 20px rgba(79,174,122,0.45); }

  .side.away{ text-align: left; align-items: flex-start; }
  .side.home{ text-align: right; align-items: flex-end; }

  .team-name{
    font-weight: 600;
    font-size: 1rem;
    /* Stretch to the side's full width (overriding the flex-start/flex-end
       shrink-wrap the other elements in .side use) so there's a fixed box
       to measure and truncate against instead of wrapping to a second
       line. Stays right-aligned by inheritance on the home side — same as
       every other short name — until JS (see loadDashboard) detects this
       particular name actually overflows and adds .truncate, which flips
       just that one name to left-aligned so it reads from the start with
       the cut, and the "…", landing at the end instead of the start. */
    align-self: stretch;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .team-name.truncate{ text-align: left; }
  .meta-row{
    display: flex;
    align-items: baseline;
    gap: 6px;
    color: var(--text-dim);
    font-size: 0.82rem;
    white-space: nowrap;
  }
  .side.home .meta-row{ flex-direction: row-reverse; }
  .manager-name{ font-weight: 500; }
  .meta-dot{ color: var(--line); }

  .score-line{
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: nowrap;
    white-space: nowrap;
  }
  .side.home .score-line{ flex-direction: row-reverse; }
  .score{
    font-family: var(--scoreboard);
    font-weight: 700;
    /* Shrinks fluidly on narrow phones instead of wrapping onto a second
       line when a score picks up an extra digit or a minus sign. */
    font-size: clamp(1.6rem, 8vw, 2.4rem);
    font-variant-numeric: tabular-nums;
    line-height: 1;
    /* Every score gets a soft ambient glow now, not just the leader's --
       .side.leading below layers a stronger, colored glow on top of this
       baseline rather than being the only score that glows at all. */
    text-shadow: 0 0 14px rgba(255,255,255,0.18);
  }
  .proj{
    color: var(--text-dim);
    font-size: 0.85rem;
    font-variant-numeric: tabular-nums;
  }

  .remaining-badge{
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.76rem;
    color: var(--text-dim);
  }
  .remaining-badge .dot{
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--turf);
  }
  .remaining-badge.done .dot{ background: var(--line); }

  .badge-row{ display: flex; gap: 10px; flex-wrap: wrap; }
  .side.home .badge-row{ justify-content: flex-end; }

  .chip{
    display: inline-flex;
    align-items: center;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--text-dim);
  }
  .chip.wp-fav{ border-color: var(--gold); color: var(--gold); }
  .chip.streak-win{ border-color: var(--turf-dim); color: var(--turf); }
  .chip.streak-loss{ border-color: var(--loss); color: var(--loss); }

  .vs-divider{
    position: relative;
    z-index: 1;
    padding: 0 8px;
    align-self: stretch;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .expand-chip{
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    display: inline-flex;
    align-items: center;
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--text-dim);
    background: var(--surface-raised);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px 9px;
    white-space: nowrap;
  }
  /* Both labels always render; CSS (driven by the same .expanded class the
     click handler already toggles) shows only the one that matches — no
     extra JS needed to keep the chip's text in sync with the card state. */
  .expand-chip .label-expanded{ display: none; }
  .matchup-card.expanded .expand-chip .label-collapsed{ display: none; }
  .matchup-card.expanded .expand-chip .label-expanded{ display: inline; }
  .live-indicator{
    /* Centered over the VS divider, not top-left -- top-left collided
       with team names once real (often longer) names were in play. */
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--loss);
    background: var(--surface-raised);
    border: 1px solid var(--loss);
    border-radius: 999px;
    padding: 3px 8px;
    white-space: nowrap;
  }
  .live-indicator .pulse-dot{
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--loss);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(1.35); }
  }
  .vs-divider::before{
    content: "";
    position: absolute;
    top: 16px;
    bottom: 16px;
    left: 50%;
    width: 1px;
    background: var(--line);
    transform: translateX(-50%);
  }
  .vs-badge{
    position: relative;
    background: var(--surface-raised);
    border: 1px solid var(--gold);
    color: var(--gold);
    font-family: var(--scoreboard);
    font-weight: 800;
    font-size: 0.74rem;
    letter-spacing: 0.03em;
    padding: 5px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }

  /* ---------- Expanded matchup details (per-player roster) ---------- */
  .matchup-details{
    display: none;
    grid-column: 1 / -1;
    /* Matches the card's own surface — the per-row game-state colors are
       what should read as "different here", not a separately-tinted
       panel competing with them. The border-top plus a faint inset shadow
       are enough to read as a drawer without changing the base color. */
    background: var(--surface);
    border-top: 1px solid var(--line);
    box-shadow: inset 0 1px 6px rgba(0, 0, 0, 0.35);
  }
  .matchup-card.expanded .matchup-details{ display: block; }

  .detail-row{
    display: grid;
    grid-template-columns: minmax(130px, 1fr) 36px minmax(130px, 1fr);
    align-items: stretch;
    gap: 4px;
    border-bottom: 1px solid var(--line);
  }
  .detail-row .detail-position{ align-self: center; }
  .detail-row:last-child{ border-bottom: none; }
  .detail-position{
    text-align: center;
  }
  .position-label{
    display: inline-block;
    background: var(--surface-raised);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 3px;
    font-size: 0.66rem;
    font-weight: 700;
    color: var(--text-dim);
    letter-spacing: 0.03em;
  }

  .player-cell{
    display: grid;
    grid-template-columns: 1fr auto;
    column-gap: 8px;
    padding: 10px 8px;
    border: 1px solid transparent;
    position: relative;
    min-width: 0;
  }
  /* Home side mirrors the column order so its score still ends up on the
     inner edge (next to the position label) and its name/info on the
     outer edge, matching the away side's score-toward-center layout. */
  .player-cell.home{ grid-template-columns: auto 1fr; }
  .player-cell.home .player-info{ order: 2; text-align: right; }
  .player-cell.home .player-score{ order: 1; text-align: left; }

  /* Three readings, loudest to quietest: in progress with the ball (gold —
     the one moment that should really pop, and now the only state that
     still gets an edge bar), in progress (a pale wash), and finished (a
     recessed dark wash — that player is settled and nothing about their
     number will change again). Not-started stays plain. Cells are
     full-bleed to the card's own edge — left for away, right for home —
     with no rounding and no surrounding gap, so consecutive rows read as
     one continuous strip rather than separate floating boxes. */
  .player-cell.away{ border-left: 4px solid var(--state-bar-color, transparent); padding-left: 10px; }
  .player-cell.home{ border-right: 4px solid var(--state-bar-color, transparent); padding-right: 10px; }
  .player-cell.state-live{
    background: rgba(214, 214, 208, 0.10);
  }
  .player-cell.state-possession{
    --state-bar-color: rgba(212,180,106, 0.6);
    background: rgba(212,180,106, 0.10);
  }
  /* Previously 'final' and 'not started' rendered identically, so the only
     clue a starter had already played was a number showing up in the score
     column. Now the cell recedes and the projection line turns into how far
     over or under that projection they actually landed. */
  .player-cell.state-final{ background: rgba(0,0,0,0.32); }
  .player-cell.state-final .player-game-line{ color: var(--text-dim); opacity: 0.8; }
  .player-score .delta{
    font-size: 0.68rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
    white-space: nowrap;
  }
  .player-score .delta.up{ color: var(--turf); }
  .player-score .delta.down{ color: var(--loss); }
  .player-score .delta.even{ color: var(--text-dim); }

  /* Info (name/game-status/stats) top-aligns so the top two lines always
     land in the same place regardless of how many stat lines (0-2) either
     side ends up with. The score instead centers vertically, in line with
     the position callout next to it, independent of that variable height. */
  .player-info{ min-width: 0; text-align: left; align-self: start; }
  .player-score{ text-align: right; align-self: center; }
  .team-tag{
    display: inline-block;
    flex-shrink: 0;
    font-size: 0.6rem;
    font-weight: 700;
    color: var(--text-dim);
    background: var(--surface-raised);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 4px;
  }
  /* A flex row instead of a single nowrap text block, so the team tag
     (flex-shrink: 0) always stays fully visible while only the name text
     itself shrinks and hard-clips (no ellipsis — it just runs until it
     meets the tag) when space is tight. */
  .player-name{
    display: flex;
    align-items: center;
    gap: 4px;
    min-width: 0;
    font-weight: 600;
    font-size: 0.83rem;
  }
  .player-cell.home .player-name{ justify-content: flex-end; }
  .name-text{
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
  }
  .player-score .current{
    font-family: var(--scoreboard);
    font-weight: 700;
    font-size: 1.05rem;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .player-score .projected{
    font-size: 0.68rem;
    color: var(--text-dim);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
  }
  .player-game-line{
    font-size: 0.7rem;
    color: var(--text-dim);
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* Sizes to however many stat lines there actually are (0-2, clipped
     beyond that) rather than always reserving 2 — an empty or one-line
     stat block just takes less room instead of leaving dead blank space.
     Alignment across both sides comes from .player-cell's top-alignment
     above, not from forcing this to a fixed height. */
  .player-stat-line{
    font-size: 0.7rem;
    color: var(--text-dim);
    margin-top: 2px;
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  /* ---------- Leaderboard ---------- */
  /* One row per team instead of an 8-column table — Score/Proj dropped
     (redundant with the matchup cards above) and the record shown once,
     next to the manager's name, instead of in its own column. Everything
     fits on a single row with no horizontal scroll or tap-to-expand. */
  .leaderboard{ display: flex; flex-direction: column; gap: 8px; }
  .lb-row{
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--item);
    border: 1px solid var(--item-line);
    border-radius: 10px;
    padding: 10px 14px;
  }
  .lb-rank{
    font-family: var(--scoreboard);
    font-weight: 800;
    font-size: 1.2rem;
    color: var(--text-dim);
    width: 20px;
    text-align: center;
    flex-shrink: 0;
  }
  .lb-row.playoff .lb-rank{ color: var(--gold); }
  .lb-identity{ flex: 1; min-width: 0; }
  .lb-name{
    font-weight: 600;
    font-size: 0.92rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .lb-meta{ color: var(--text-dim); font-size: 0.76rem; margin-top: 1px; }
  .lb-stat{ text-align: center; flex-shrink: 0; width: 48px; }
  .lb-stat .v{ font-family: var(--scoreboard); font-weight: 700; font-size: 0.95rem; font-variant-numeric: tabular-nums; }
  .lb-stat .l{ font-size: 0.58rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.02em; margin-top: 1px; }
  .lb-playoff-chip{
    flex-shrink: 0;
    font-size: 0.68rem;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--text-dim);
    min-width: 40px;
    text-align: center;
  }
  .lb-playoff-chip.high{ border-color: var(--turf-dim); color: var(--turf); }
  .lb-playoff-chip.low{ border-color: rgba(192,87,75,0.4); color: var(--loss); }


  /* ---------- Median Watch ----------
     The card surface itself comes from theme.css's shared card rule. */
  .median-card{ padding: 18px 20px; }
  .median-card-header{
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }
  .median-card-title{ font-weight: 700; font-size: 0.95rem; color: var(--text); }

  /* The card splits into the Above/Below grids (left) and the vertical
     spread strip (right, fixed width) side by side, so the grids run 2
     columns x 3 rows instead of 3 x 2 to leave room for it. */
  .card-body{ display: grid; grid-template-columns: 1fr auto; gap: 16px; }
  .live-dot{ display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--loss); --pc: 192,87,75; animation: live-pulse 1.6s infinite; }
  @keyframes live-pulse{
    0%{ box-shadow: 0 0 0 0 rgba(var(--pc), 0.6); }
    70%{ box-shadow: 0 0 0 6px rgba(var(--pc), 0); }
    100%{ box-shadow: 0 0 0 0 rgba(var(--pc), 0); }
  }
  /* A single-axis plot positioned by each team's actual score, not rank —
     distance on the page is real distance in points. Runs top (highest)
     to bottom (lowest); adjacent teams close enough to visually collide
     merge into one taller row (see renderSpreadChart) with all their
     names stacked, highest on top. */
  /* Reserved top/bottom padding is where the low/high endcap labels live
     (see .endcap-score below) — kept outside .vplot's own box entirely so
     they can never overlap the top/bottom rows inside it. */
  .spread-col{ width: 108px; flex-shrink: 0; padding: 15px 0; }
  .vplot{ position: relative; height: 100%; min-height: 200px; }
  .vplot .axis{ position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: var(--line); }
  /* z-index above .name-row so the tick renders on top of row edges
     instead of disappearing behind them (plain DOM order would otherwise
     paint rows, which come after it in the markup, over the top of it).
     No text label on it — the actual median value is already shown in
     the card header, and there's no space in this narrow a column to
     print it here without it colliding with the name rows on the line. */
  .vplot .median-tick{ position: absolute; left: 50%; transform: translateX(-50%); height: 1px; background: var(--gold); box-shadow: 0 0 8px rgba(212,180,106,0.7); z-index: 2; }
  /* Fixed-opacity backdrop marking which half of the plot is above vs.
     below the median -- not a per-team proportional bar, since its two
     bands don't scale with any one team's value. */
  .median-zone-wash{ position: absolute; left: 0; right: 0; z-index: 0; pointer-events: none; }
  .median-zone-wash.above{ background: linear-gradient(to top, transparent, rgba(79,174,122,0.07)); }
  .median-zone-wash.below{ background: linear-gradient(to bottom, transparent, rgba(214,98,79,0.07)); }
  /* Background is set inline per-row (solid green/above, solid red/below,
     or a split gradient sized to how many members are on each side of the
     median for a merged row) since it varies per team composition. Width
     is also set inline (see measureMaxRowWidth) so every row — single
     name or merged — is exactly as wide as the single longest name among
     this week's teams, not a guessed constant with padding to spare. */
  .name-row{
    background-color: var(--surface);
    position: absolute;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    border: 1px solid var(--line);
    padding: 0;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .name-row .slot{
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    line-height: 1.4;
    border: 1px solid transparent;
    border-radius: 0;
    width: 100%;
    text-align: center;
    transition: background-color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }
  /* Only the outer corners of a (possibly merged) pill are rounded, so a
     locked fill in the middle of a stack is square. */
  .name-row .slot:first-child{ border-top-left-radius: 3px; border-top-right-radius: 3px; }
  .name-row .slot:last-child{ border-bottom-left-radius: 3px; border-bottom-right-radius: 3px; }
  /* Status on the strip: check = no starters left, solid fill = result locked
     in (see renderMedianCard), red pulsing dot = a player is live. */
  .name-row .slot{ position: relative; }
  .name-row .slot.live::before{
    content: '';
    position: absolute;
    left: 4px;
    top: 50%;
    margin-top: -2.5px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--loss);
    --pc: 192,87,75;
    animation: live-pulse 1.6s infinite;
  }
  .name-row .slot.final::after{
    content: '\2713';
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.6rem;
    line-height: 1;
  }
  /* A red dot would vanish on a solid red (locked below) pill. */
  .name-row .slot.locked.below.live::before{ background: #fff; --pc: 255,255,255; }
  .name-row .slot.locked.above{ background: var(--turf); color: #08140d; border-color: var(--turf); }
  .name-row .slot.locked.below{ background: var(--loss); color: #1a0908; border-color: var(--loss); }
  .name-row .slot.above{ color: var(--turf); }
  .name-row .slot.below{ color: var(--loss); }
  /* Sits in .spread-col's own reserved padding, above/below .vplot's box
     entirely, so it can't overlap the top/bottom name rows inside it. */
  .endcap-score{
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.62rem;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  /* Lock lines on the Current strip: above the green line a team can't fall
     below the median any more, below the red line a finished team can't get above it. The plot shifts left
     to leave room for the line labels. */
  .spread-col.zoned{ width: 136px; }
  .vplot.zoned .axis, .vplot.zoned .name-row, .vplot.zoned .median-tick{ left: 44px; }
  .vplot.zoned .endcap-score{ left: 44px; }
  .zone{ position: absolute; left: 0; right: 0; z-index: 0; }
  .zone.up{ border-bottom: 1px dashed rgba(76,154,107,0.6); }
  .zone.dn{ border-top: 1px dashed rgba(192,87,75,0.6); }
  .zone-label{ position: absolute; right: 0; z-index: 4; font-size: 0.58rem; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .zone-label.up{ color: var(--turf); transform: translateY(-105%); }
  .zone-label.dn{ color: var(--loss); transform: translateY(5%); }
  .endcap-score.low{ bottom: -15px; }
  .endcap-score.high{ top: -15px; }

  .median-pending{
    text-align: center;
    padding: 22px 10px 14px;
  }
  .pending-headline{
    font-family: var(--scoreboard);
    font-weight: 800;
    font-size: 2rem;
    letter-spacing: 0.01em;
    color: var(--gold);
    line-height: 1;
  }
  .pending-sub{
    margin-top: 10px;
    color: var(--text-dim);
    font-size: 0.88rem;
  }

  /* ---------- Median Watch: unified Current/Projected toggle card ---------- */
  .median-split-label{ text-align: center; color: var(--gold); font-weight: 700; font-size: 0.8rem; letter-spacing: 0.02em; margin: 12px 0; padding: 7px 0; }
  .median-split-label b{ font-family: var(--scoreboard); font-variant-numeric: tabular-nums; margin-left: 6px; }
  .mw-grid{ display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 7px; }
  @media (max-width: 420px){
    .mw-grid{ grid-template-columns: 1fr; }
    .median-card:has(#median-toggle-seg) .median-card-header{ flex-wrap: wrap; gap: 8px; align-items: center; }
  }
  /* Each team gets its own fully self-contained chip (background/border on
     .slot itself) instead of sharing one pill per cluster -- see the
     chipStyle comment on renderSpreadChart. No gap/padding beyond the base
     .slot, and the border is an inset box-shadow rather than a real
     border+padding -- neither affects box-model height, so a chip-style row
     and its settled merged-pill row stay pixel-identical in height and
     settling never needs to reposition anything. */
  .name-row.plain-wrap{ background: none; border: none; box-shadow: none; }
  .slot.slot-chip{ display: block; border-radius: 4px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
  .slot.slot-chip.above{ background: rgba(76,154,107,0.16); box-shadow: inset 0 0 0 1px var(--turf-dim); }
  .slot.slot-chip.below{ background: rgba(192,87,75,0.16); box-shadow: inset 0 0 0 1px rgba(192,87,75,0.45); }
  .slot.slot-chip.locked.above{ background: var(--turf); color: #08140d; box-shadow: inset 0 0 0 1px var(--turf); }
  .slot.slot-chip.locked.below{ background: var(--loss); color: #1a0908; box-shadow: inset 0 0 0 1px var(--loss); }
  /* chipStyle only: the tick is correctly positioned exactly at a cluster's
     above/below boundary, but chips sit edge-to-edge with no gap between
     them, so the line ends up sitting exactly on a chip's own border
     instead of floating independently. Hidden during the animation and
     faded back in once settleMedianToMergedPills runs. */
  .vplot .median-tick.slim{ opacity: 0; }
  .mb-card{ background: rgba(255,255,255,0.03); border-radius: 8px; padding: 9px 10px; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 1px solid var(--line); }
  .mb-card.locked{ border-color: var(--gold); }
  .mb-card .mw-name{ font-size: 1rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  /* The score and everything said about it stack in one right-hand column,
     so a second status line pushes the card taller rather than sideways. */
  .mb-card .mw-right{ text-align: right; flex-shrink: 0; }
  .mb-card .mw-score{ font-family: var(--scoreboard); font-weight: 700; font-size: 1.3rem; line-height: 1.1; flex-shrink: 0; }
  /* One line per fact (see miniStatusLines): how many players are live/left,
     and separately whether the result is locked or final. Colored by class
     rather than inline, since the three readings are fixed. */
  .mb-card .mw-stat{ font-size: 0.64rem; white-space: nowrap; display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 2px; color: var(--text-dim); }
  .mb-card .mw-stat.live{ color: var(--loss); }
  .mb-card .mw-stat.locked{ color: var(--gold); }
  /* Same 0.68s/bounce-adjacent duration as cards+chart sliding into their
     new spot on toggle. */
  ::view-transition-group(*){ animation-duration: 0.68s; animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
  /* By default a View Transition also cross-fades "root" -- a flat
     before/after screenshot of everything NOT individually named, i.e.
     the whole rest of the page -- at the UA's own default duration (0.25s,
     shorter than the 0.68s above), which reads as a quick whole-page flash
     at the start of every toggle even though nothing outside the card
     actually changed. Disabling root's animation scopes the transition to
     just the explicitly named cards/chips; everything else stays static
     and untouched the whole time. */
  ::view-transition-old(root), ::view-transition-new(root){ animation: none; mix-blend-mode: normal; }

  /* ---------- Stat of the Moment: single rotating-feeling hero fact

  /* --item is a translucent fill tuned to sit on top of a .glass/.median-

     .stat-moment is a SIBLING of #median-container, not nested inside it
     (see the two containers in the markup below), so it sits directly on

  .stat-moment-text{ font-size: 1.15rem; font-weight: 600; line-height: 1.4; margin-top: 8px; }

  .stat-moment-fine{ display: block; font-size: 0.62rem; font-weight: 400; color: var(--text-dim); margin-top: 4px; }

  /* ---------- Superlatives ---------- */

  .sup-tag.new{ color: var(--turf); border: 1px solid var(--turf-dim); background: rgba(76,154,107,0.12); }

  /* ---------- Comparison rows: real position on a shared axis instead of a
     label/value table. Each row plots one or two markers along a 0-100%
     scale (set per-card by cmpScale) so the gap between teams, and between

  .cmp-wrap{ position: relative; margin-top: 16px; text-align: left; }

  .cmp-row{ display: grid; grid-template-columns: minmax(0,72px) 1fr auto; align-items: center; gap: 10px; padding: 11px 0; }
  .cmp-row + .cmp-row{ border-top: 1px solid var(--line); }
  .cmp-name{ font-size: 0.78rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cmp-track{ position: relative; height: 10px; }
  .cmp-track::before{ content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--line); }
  .cmp-link{ position: absolute; top: 50%; height: 2px; transform: translateY(-50%); background: var(--line); border-radius: 2px; }
  .cmp-link.on{ background: rgba(212,180,106,0.45); }
  .cmp-dot{ position: absolute; top: 50%; width: 7px; height: 7px; border-radius: 50%; transform: translate(-50%,-50%); background: var(--surface); border: 2px solid var(--text-dim); }
  .cmp-dot.now{ background: var(--text-dim); border-color: var(--text-dim); }
  .cmp-dot.on{ background: var(--gold); border-color: var(--gold); box-shadow: 0 0 8px rgba(212,180,106,0.55); }
  .cmp-ref{ position: absolute; top: -3px; bottom: -3px; width: 0; border-left: 1px dashed var(--gold-dim); transform: translateX(-50%); }
  .cmp-ref-label{ position: absolute; top: -15px; transform: translateX(-50%); font-size: 0.56rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--gold-dim); white-space: nowrap; }

  .cmp-val.on{ color: var(--gold); }

  @media (max-width: 480px){

<body>
  <div id="site-nav"></div>
  <div class="wrap">
    <header>
      <div class="header-row">
        <div>
          <div class="eyebrow">Retirement League</div>
          <h1 id="week-header">Live Dashboard</h1>
        </div>
        <div class="updated-block">
          <div class="updated-label">Updated</div>
          <div class="updated-value" id="updated-at">—</div>
        </div>
      </div>
    </header>

    <section>
      <div id="median-container">
        <div class="loading-row">Loading median splits…</div>
      </div>
      <div id="stat-of-moment-container"></div>
    </section>

    <section>
      <h2>This week's matchups</h2>
      <div class="matchups" id="matchups-container">
        <div class="loading-row">Loading matchups…</div>
      </div>
    </section>

    <section>
      <h2>Superlatives</h2>
      <div id="superlatives-toggle"></div>
      <div class="accolades-grid" id="accolades-container">
        <div class="loading-row">Loading accolades…</div>
      </div>
    </section>

    <section>
      <h2>Current Standings</h2>
      <div id="standings-toggle"></div>
      <!-- Rows sit inside one glass panel rather than straight on the page
           background, so they have an edge to line up against -- same
           treatment the Standings page uses. The heading above and the mode
           toggle already label the list, so the panel takes no title. -->
      <div class="glass">
        <div class="panel-body leaderboard" id="leaderboard-container">
          <div class="loading-row">Loading standings…</div>
        </div>
      </div>
    </section>

    <section id="activity-section" hidden>
      <details class="tray">
        <summary>
          <span class="tray-title">Site Activity</span>
          <span class="tray-summary" id="activity-summary"></span>
          <span class="tray-chevron" aria-hidden="true"></span>
        </summary>
        <div id="activity-container"></div>
      </details>
    </section>

    <footer>Auto-refreshes every two minutes · Data via ESPN Fantasy</footer>
  </div>

<script src="nav.js?v=2"></script>
<script>
  // This Worker fetches ESPN directly and caches the computed result in KV
  // (see the retirement-league-refresh-proxy repo/src/index.js) — no more
  // Google Sheet or GitHub Action in the loop for this page. A GET here
  // either returns data cached within the last 2 minutes instantly, or
  // fetches fresh from ESPN, caches it, and returns that.
  const WORKER_URL = 'https://retirement-league-refresh-proxy.bradbutcher321.workers.dev';

  function fmtScore(n) {
    const num = parseFloat(n);
    return isNaN(num) ? n : num.toFixed(2);
  }

  // Which matchups are currently expanded, keyed by team-name pair rather
  // than array index so expansion survives the list re-sorting finals to
  // the bottom, or the whole innerHTML being rebuilt on the next poll.
  const expandedMatchups = new Set();
  const matchupKey = (m) => `${m.awayName}::${m.homeName}`;

  // Four states a starter's real NFL game can be in: hasn't kicked off
  // yet, in progress, in progress AND their team has the ball (the single
  // highest-attention moment), or over. Drives the whole-cell wash and
  // edge accent bar via .player-cell.state-* — colors live in CSS.
  function playerState(p) {
    if (!p || !p.game) return null;
    if (p.game.state === 'pre') return 'pre';
    if (p.game.state === 'post') return 'final';
    return p.game.hasPossession ? 'possession' : 'live';
  }

  function renderPlayerCell(p, side, state) {
    if (!p) return `<div class="player-cell ${side}"></div>`;
    const hasLiveScore = p.livePoints !== null && p.livePoints !== undefined;
    let gameLine = '';
    if (p.game) {
      if (p.game.state === 'pre') {
        const kickoff = p.game.date ? new Date(p.game.date) : null;
        const when = kickoff
          ? `${kickoff.toLocaleDateString([], { weekday: 'short' })} ${kickoff.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`
          : '';
        gameLine = `vs ${p.game.opponent}${when ? ' · ' + when : ''}`;
      } else if (p.game.state === 'post') {
        gameLine = `${p.game.opponent} ${p.game.teamScore}-${p.game.opponentScore} Final`;
      } else {
        gameLine = `${p.game.opponent} ${p.game.teamScore}-${p.game.opponentScore} · Q${p.game.period} ${p.game.clock}`;
      }
    }
    const teamTag = p.game && p.game.team ? `<span class="team-tag">${p.game.team}</span>` : '';
    // Once the game is over the pre-game projection stops being the useful
    // number — how far the player beat or missed it is. ESPN keeps serving
    // the original projection after the final whistle, so this delta stays
    // meaningful rather than collapsing to zero.
    const delta = state === 'final' && hasLiveScore && p.projectedPoints !== null && p.projectedPoints !== undefined
      ? p.livePoints - p.projectedPoints
      : null;
    const scoreSub = delta === null
      ? `<div class="projected">${fmtScore(p.projectedPoints)}</div>`
      : `<div class="delta ${delta > 0.05 ? 'up' : delta < -0.05 ? 'down' : 'even'}" title="Projected ${fmtScore(p.projectedPoints)}">${delta >= 0 ? '▲' : '▼'} ${fmtScore(Math.abs(delta))}</div>`;
    return `
      <div class="player-cell ${side} ${state ? 'state-' + state : ''}">
        <div class="player-info">
          <div class="player-name"><span class="name-text">${p.name}</span>${teamTag}</div>
          <div class="player-game-line">${gameLine}</div>
          <div class="player-stat-line">${p.statLine || ''}</div>
        </div>
        <div class="player-score">
          <div class="current">${hasLiveScore ? fmtScore(p.livePoints) : '-'}</div>
          ${scoreSub}
        </div>
      </div>`;
  }

  function renderMatchupDetails(m) {
    const awayPlayers = m.awayPlayers || [];
    const homePlayers = m.homePlayers || [];
    const rowCount = Math.max(awayPlayers.length, homePlayers.length);
    const rows = [];
    for (let i = 0; i < rowCount; i++) {
      const a = awayPlayers[i];
      const h = homePlayers[i];
      const awayState = playerState(a);
      const homeState = playerState(h);
      rows.push(`
        <div class="detail-row">
          ${renderPlayerCell(a, 'away', awayState)}
          <div class="detail-position">
            <span class="position-label">${(a && a.slot) || (h && h.slot) || ''}</span>
          </div>
          ${renderPlayerCell(h, 'home', homeState)}
        </div>`);
    }
    return `<div class="matchup-details">${rows.join('')}</div>`;
  }

  // A matchup is decided (green bar, sinks to the bottom) once nobody is left to
  // play on either side, or once a team with no players left is already behind
  // its opponent's current score: the opponent's score can only go up, so the
  // finished team can't catch back up. The second case needs the NFL game
  // states to be readable; otherwise a team with "0 left" might just be missing data.
  function matchupDecided(m) {
    const hIn = parseInt(m.homeInPlay, 10) || 0, aIn = parseInt(m.awayInPlay, 10) || 0;
    const hRem = parseInt(m.homeRemaining, 10) || 0, aRem = parseInt(m.awayRemaining, 10) || 0;
    if (hIn + aIn + hRem + aRem === 0) return true;
    if (!medianStatusKnown) return false;
    const hs = parseFloat(m.homeScore), as = parseFloat(m.awayScore);
    return (hIn + hRem === 0 && hs < as) || (aIn + aRem === 0 && as < hs);
  }

  function renderMatchupCard(m) {
    const homeLeading = parseFloat(m.homeScore) >= parseFloat(m.awayScore);
    // Full-bleed wash leans toward whichever side is *projected* to win
    // (win probability), not whichever is currently ahead on the live
    // score -- those two can disagree mid-game, and the wash is meant to
    // read as "who's expected to take this," not a live-score indicator
    // (the score glow and .leading border already cover that).
    const awayWP = typeof m.awayWinProbability === 'number' ? m.awayWinProbability
      : typeof m.homeWinProbability === 'number' ? 100 - m.homeWinProbability : null;
    const favClass = awayWP === null ? '' : awayWP >= 50 ? ' fav-away' : ' fav-home';
    const homeInPlay = parseInt(m.homeInPlay, 10) || 0;
    const awayInPlay = parseInt(m.awayInPlay, 10) || 0;
    const homeRemaining = parseInt(m.homeRemaining, 10) || 0;
    const awayRemaining = parseInt(m.awayRemaining, 10) || 0;
    const isLive = homeInPlay + awayInPlay > 0;
    const isFinal = matchupDecided(m);
    const statusBadge = (count, label) => {
      const done = count === 0;
      return `<span class="remaining-badge ${done ? 'done' : ''}">
                <span class="dot"></span>${count} ${label}
              </span>`;
    };
    const statusRow = (inPlay, remaining) => `
      <div class="badge-row">
        ${statusBadge(inPlay, 'In Play')}
        ${statusBadge(remaining, 'To Play')}
      </div>`;
    const chipRow = (winProbability, streak) => {
      const wpChip = typeof winProbability === 'number'
        ? `<span class="chip ${winProbability >= 50 ? 'wp-fav' : ''}">${Math.round(winProbability)}% to win</span>`
        : '';
      const streakChip = streak
        ? `<span class="chip ${streak[0] === 'W' ? 'streak-win' : 'streak-loss'}">${streak}</span>`
        : '';
      return (wpChip || streakChip) ? `<div class="badge-row">${wpChip}${streakChip}</div>` : '';
    };
    const metaRow = (manager, record) => `
      <div class="meta-row">
        ${manager ? `<span class="manager-name">${manager}</span><span class="meta-dot">•</span>` : ''}
        <span>${record}</span>
      </div>`;

    const sideClass = (leading) => leading ? `leading ${isFinal ? 'final' : ''}` : '';
    const key = matchupKey(m);
    const expanded = expandedMatchups.has(key);

    return `
      <div class="matchup-card ${expanded ? 'expanded' : ''}${isLive ? ' live' : ''}${favClass}" data-key="${encodeURIComponent(key)}">
        ${isLive ? `<span class="live-indicator"><span class="pulse-dot"></span>Live</span>` : ''}
        <div class="side away ${sideClass(!homeLeading)}">
          <div class="team-name">${m.awayName}</div>
          ${metaRow(m.awayManager, m.awayRecord)}
          <div class="score-line">
            <span class="score">${fmtScore(m.awayScore)}</span>
            <span class="proj">proj ${fmtScore(m.awayProjected)}</span>
          </div>
          ${chipRow(m.awayWinProbability, m.awayStreak)}
          ${statusRow(awayInPlay, awayRemaining)}
        </div>
        <div class="vs-divider">
          <span class="vs-badge">VS</span>
          <span class="expand-chip">
            <span class="label-collapsed">▾ Expand</span>
            <span class="label-expanded">▴ Collapse</span>
          </span>
        </div>
        <div class="side home ${sideClass(homeLeading)}">
          <div class="team-name">${m.homeName}</div>
          ${metaRow(m.homeManager, m.homeRecord)}
          <div class="score-line">
            <span class="score">${fmtScore(m.homeScore)}</span>
            <span class="proj">proj ${fmtScore(m.homeProjected)}</span>
          </div>
          ${chipRow(m.homeWinProbability, m.homeStreak)}
          ${statusRow(homeInPlay, homeRemaining)}
        </div>
        ${renderMatchupDetails(m)}
      </div>`;
  }

  function medianTeamName(t) { return t.manager || t.name; }

  // The lines under each score, as separate facts rather than one slot that
  // can only hold one of them:
  //   - how many of this team's starters are in play right now and how many
  //     haven't kicked off yet;
  //   - whether the result is already locked (can't change) or the team is
  //     done for the week.
  // These used to share a single line, with locked/final taking priority, so
  // a locked team stopped reporting its remaining players entirely -- and got
  // them back as soon as the lock lifted (the lock line rises as more teams
  // finish, so a team can come back out of it on any refresh). That read as
  // the count randomly disappearing and reappearing between refreshes. They
  // are independent facts, so they get independent lines: a team locked above
  // with five still to play is both of those things at once.
  // Everything stays blank when the NFL game state couldn't be read, so
  // nobody is wrongly shown as finished.
  function miniStatusLines(t) {
    if (!t.statusKnown) return [];
    const lines = [];
    const players = [];
    if (t.inPlay) players.push(`${t.inPlay} live`);
    if (t.remaining) players.push(`${t.remaining} to play`);
    if (players.length) lines.push({ text: players.join(' \u00b7 '), cls: t.inPlay ? 'live' : '' });
    // A done team has no players line (nothing left to count), so "Final"
    // lands on the first line and that card doesn't grow a second one.
    if (t.locked) lines.push({ text: `Locked ${t.lockedAbove ? 'above' : 'below'}`, cls: 'locked' });
    else if (t.done) lines.push({ text: 'Final', cls: 'final' });
    return lines;
  }

  function mwCardHtml(t, tone) {
    const lines = miniStatusLines(t);
    return `<div class="mb-card${lines.some(l => l.cls === 'locked') ? ' locked' : ''}" data-name="${t.name}">
      <span class="mw-name">${t.name}</span>
      <div class="mw-right">
        <div class="mw-score" style="color:var(--${tone});">${fmtScore(t.score)}</div>
        ${lines.map(l => `<div class="mw-stat ${l.cls}">${l.cls === 'live' ? '<span class="live-dot"></span>' : ''}${l.cls === 'locked' ? '\u2713 ' : ''}${l.text}</div>`).join('')}
      </div>
    </div>`;
  }

  function mwGridHtml(list, tone) {
    return `<div class="mw-grid">${list.map(t => mwCardHtml(t, tone)).join('')}</div>`;
  }

  // Whether the Worker could read NFL game states this refresh; without that
  // every team would look finished, so status and locks stay hidden.
  let medianStatusKnown = false;

  const SPREAD_MIN_GAP = 3; // px minimum breathing room between separate rows

  // A name's rendered height doesn't depend on how long it is (one line is
  // one line), so rather than guess at row padding/border/line-height and
  // get it wrong, briefly render one real 1-slot and one real 2-slot row
  // (invisible, off the layout flow) in the actual container and measure
  // them — height of an empty row, and how much each added slot costs.
  function measurePillHeights(container, chipStyle) {
    // Must probe with the SAME classes renderSpreadChart actually renders
    // with -- chipStyle's .slot-chip has its own box-shadow border but no
    // extra padding/gap (kept exactly height-neutral vs. plain .slot on
    // purpose), but probing with the wrong markup would still understate
    // real pill height if that ever changes, and the median tick (placed at
    // a cluster boundary) is computed from this same size.
    const probe = document.createElement('div');
    probe.className = 'name-row' + (chipStyle ? ' plain-wrap' : '');
    probe.style.visibility = 'hidden';
    probe.style.position = 'absolute';
    probe.style.left = '-9999px';
    const slotCls = 'slot' + (chipStyle ? ' slot-chip' : '');
    probe.innerHTML = `<span class="${slotCls}">Xx</span>`;
    container.appendChild(probe);
    const singleHeight = probe.offsetHeight;
    probe.innerHTML = `<span class="${slotCls}">Xx</span><span class="${slotCls}">Xx</span>`;
    const slotHeight = probe.offsetHeight - singleHeight;
    container.removeChild(probe);
    return { singleHeight, slotHeight };
  }

  // Every row (single name or merged) renders at exactly the width of the
  // single longest name among this week's teams — measured for real
  // rather than guessed, so there's no leftover margin around shorter
  // names once that longest one is accounted for.
  function measureMaxRowWidth(container, names, chipStyle) {
    const probe = document.createElement('div');
    probe.className = 'name-row' + (chipStyle ? ' plain-wrap' : '');
    probe.style.visibility = 'hidden';
    probe.style.position = 'absolute';
    probe.style.left = '-9999px';
    container.appendChild(probe);
    const slotCls = 'slot' + (chipStyle ? ' slot-chip' : '');
    let max = 0;
    for (const name of names) {
      probe.innerHTML = `<span class="${slotCls}">${name}</span>`;
      max = Math.max(max, probe.offsetWidth);
    }
    container.removeChild(probe);
    return max;
  }

  // Positions every team by its actual score along one axis (not by rank),
  // merging adjacent teams into a single taller row wherever they'd
  // otherwise visually collide, so distance on the page always means
  // distance in points instead of silently overlapping. Pure 0..plotSize
  // number-line math — used for the vertical axis, with "width" meaning
  // "size along the axis" (height, here) and pos 0 meaning the lowest score.
  function computeSpreadClusters(ascendingTeams, plotSize, singleSize, slotSize) {
    const scores = ascendingTeams.map(t => t.score);
    const min = scores[0];
    const max = scores[scores.length - 1];
    const idealPos = s => (max === min ? plotSize / 2 : ((s - min) / (max - min)) * plotSize);
    const sizeOf = c => singleSize + (c.members.length - 1) * slotSize;

    // Pass 1: greedy merge based on each team's ideal (unclamped) position.
    const clusters = [];
    for (const t of ascendingTeams) {
      const pos = idealPos(t.score);
      const prev = clusters[clusters.length - 1];
      if (prev) {
        const requiredGap = sizeOf(prev) / 2 + singleSize / 2 + SPREAD_MIN_GAP;
        if (pos - prev.pos < requiredGap) {
          prev.members.push(t);
          prev.pos = (prev.pos * (prev.members.length - 1) + pos) / prev.members.length;
          continue;
        }
      }
      clusters.push({ members: [t], pos });
    }

    // A cluster's own half-size can push it past the plot's edge even
    // though its center (pos) is a valid in-range position — e.g. several
    // teams tied at the very lowest score merge into a row centered at
    // pos=0, and the centering transform then hangs half that row off the
    // edge of the card entirely. Clamp the first/last cluster inward by
    // their own half-size before spacing the rest off of them.
    if (clusters.length) {
      const first = clusters[0];
      first.pos = Math.max(first.pos, sizeOf(first) / 2);
    }

    // Pass 2: push clusters apart low-to-high so a merge that grew a row
    // can't then make it overlap its neighbor.
    for (let i = 1; i < clusters.length; i++) {
      const prevC = clusters[i - 1], curC = clusters[i];
      const requiredGap = sizeOf(prevC) / 2 + sizeOf(curC) / 2 + SPREAD_MIN_GAP;
      if (curC.pos - prevC.pos < requiredGap) curC.pos = prevC.pos + requiredGap;
    }

    if (clusters.length) {
      const last = clusters[clusters.length - 1];
      last.pos = Math.min(last.pos, plotSize - sizeOf(last) / 2);
    }
    clusters.forEach(c => { c.size = sizeOf(c); });
    return clusters;
  }

  // The median tick's position comes from where the rows actually
  // rendered (post edge-clamping above), not from the raw linear score
  // scale — otherwise a cluster shifted to avoid spilling off the card
  // could end up visually on the wrong side of a tick placed purely by
  // score, even though every one of its members is genuinely below (or
  // above) the median.
  function findMedianTickPos(clusters, median, plotSize, isBelow = m => m.score < median) {
    for (const c of clusters) {
      const belowCount = c.members.filter(isBelow).length;
      if (belowCount > 0 && belowCount < c.members.length) {
        // Straddles the median — tick lines up with this row's own
        // below/above color split, not just its center.
        return (c.pos - c.size / 2) + (belowCount / c.members.length) * c.size;
      }
    }
    let belowEdge = 0, aboveEdge = plotSize;
    for (const c of clusters) {
      if (c.members.every(isBelow)) belowEdge = Math.max(belowEdge, c.pos + c.size / 2);
      else aboveEdge = Math.min(aboveEdge, c.pos - c.size / 2);
    }
    return (belowEdge + aboveEdge) / 2;
  }

  function renderSpreadChart(elId, ascendingTeams, median, zones, noWash, chipStyle) {
    const el = document.getElementById(elId);
    if (!el || ascendingTeams.length < 2) return;
    const plotSize = el.clientHeight || 220;
    const { singleHeight, slotHeight } = measurePillHeights(el, chipStyle);
    const rowWidth = measureMaxRowWidth(el, ascendingTeams.map(t => t.name), chipStyle) + 24;
    const clusters = computeSpreadClusters(ascendingTeams, plotSize, singleHeight, slotHeight);
    // Highest score renders at the top, so a cluster's axis position (0 =
    // lowest score) maps to "100% minus its share of the plot" for `top`.
    const toTopPct = pos => 100 - (pos / plotSize) * 100;
    const RED = 'rgba(192,87,75,0.28)';
    const GREEN = 'rgba(76,154,107,0.28)';

    let html = '';
    // Soft background wash marking "above" (toward higher scores, top of
    // the plot) vs "below" the median -- a fixed-opacity backdrop behind
    // everything else, not a per-team proportional bar, so it reinforces
    // direction without claiming to encode any one team's distance from it.
    const medianPct = toTopPct(findMedianTickPos(clusters, median, plotSize));
    if (!noWash) {
      html += `<div class="median-zone-wash above" style="top:0; height:${medianPct}%;"></div>`;
      html += `<div class="median-zone-wash below" style="top:${medianPct}%; height:${100 - medianPct}%;"></div>`;
    }
    if (zones) {
      if (zones.up !== null) {
        const yUp = toTopPct(findMedianTickPos(clusters, median, plotSize, m => m.score <= zones.up));
        html += `<div class="zone up" style="top:0; height:${yUp}%;"></div><div class="zone-label up" style="top:${yUp}%;">\u25B2 ${fmtScore(zones.up)}</div>`;
      }
      if (zones.down !== null) {
        const yDn = toTopPct(findMedianTickPos(clusters, median, plotSize, m => m.score < zones.down));
        html += `<div class="zone dn" style="top:${yDn}%; bottom:0;"></div><div class="zone-label dn" style="top:${yDn}%;">\u25BC ${fmtScore(zones.down)}</div>`;
      }
    }
    html += '<div class="axis"></div>';
    html += `<div class="median-tick${chipStyle ? ' slim' : ''}" style="top:${medianPct}%; width:${rowWidth - 2}px;"></div>`;

    clusters.forEach(c => {
      const belowCount = c.members.filter(m => m.score < median).length;
      const aboveCount = c.members.length - belowCount;
      let background, borderColor, splitFill = '';
      if (belowCount === 0) {
        background = `linear-gradient(${GREEN}, ${GREEN})`;
        borderColor = 'var(--turf-dim)';
      } else if (aboveCount === 0) {
        background = `linear-gradient(${RED}, ${RED})`;
        borderColor = 'rgba(192,87,75,0.5)';
      } else {
        // Straddles the median — split proportional to how many members
        // are on each side (1 below + 1 above = an even half/half row).
        // Two solid-color layers, each with only its OWN touching corners
        // rounded, rather than one hard-stop linear-gradient relying on the
        // row's border-radius to clip it -- that showed a thin sliver of
        // the wrong color right at the row's outer top/bottom edges, far
        // from the actual split line (confirmed by swapping in a plain
        // solid color, which eliminated it -- a gradient/border-radius
        // rendering quirk, not a logic bug). "Bottom" so the below/red
        // share sits at the bottom, matching low-scores-at-the-bottom. Each
        // layer also carries its own colored border on its 3 outer sides
        // (not the shared edge, which the gold median tick already marks),
        // so the outline is split green/red too instead of one flat neutral
        // border around the whole row.
        background = 'none';
        borderColor = 'transparent';
        const redPct = (belowCount / c.members.length) * 100;
        const greenPct = 100 - redPct;
        splitFill = `<div style="position:absolute;left:0;right:0;bottom:0;height:${redPct}%;background:${RED};border:1px solid rgba(192,87,75,0.5);border-top:none;border-radius:0 0 4px 4px;"></div><div style="position:absolute;left:0;right:0;top:0;height:${greenPct}%;background:${GREEN};border:1px solid var(--turf-dim);border-bottom:none;border-radius:4px 4px 0 0;"></div>`;
      }
      const slots = c.members
        .slice()
        .sort((a, b) => b.score - a.score) // highest first = rendered on top
        .map(m => `<span class="slot${chipStyle ? ' slot-chip' : ''} ${m.score >= median ? 'above' : 'below'}${m.statusKnown ? (m.locked ? ' locked' : '') + (m.done ? ' final' : '') + (m.inPlay ? ' live' : '') : ''}" data-name="${m.name}">${m.name}</span>`)
        .join('');
      // A row that's locked and uniformly on one side of the median gets a
      // matching glow -- straddling rows skip it, since there's no single
      // direction to glow toward.
      const glow = !c.members.some(m => m.locked) ? '' : belowCount === 0 ? 'box-shadow:0 0 14px rgba(76,154,107,0.3);' : aboveCount === 0 ? 'box-shadow:0 0 14px rgba(192,87,75,0.3);' : '';
      html += chipStyle
        ? `<div class="name-row plain-wrap" style="top:${toTopPct(c.pos)}%; width:${rowWidth}px;">${slots}</div>`
        : `<div class="name-row" style="top:${toTopPct(c.pos)}%; width:${rowWidth}px; background-image:${background}; border-color:${borderColor}; ${glow}">${splitFill}${slots}</div>`;
    });

    const lowest = ascendingTeams[0], highest = ascendingTeams[ascendingTeams.length - 1];
    html += `<div class="endcap-score low">${fmtScore(lowest.score)}</div>`;
    html += `<div class="endcap-score high">${fmtScore(highest.score)}</div>`;
    el.innerHTML = html;
  }

  // Splits teams by rank (not by literal distance from the median value) so
  // it always yields an even above/below split — 6-and-6 in a 12-team
  // league — even if a couple of scores happen to tie exactly at the median.
  function computeMedianRows(teamsSorted, medianValue, scoreKey) {
    const half = Math.floor(teamsSorted.length / 2);
    const known = medianStatusKnown;
    const withScore = teamsSorted.map(t => ({
      name: medianTeamName(t),
      score: t[scoreKey],
      cur: t.current,
      remaining: t.remaining || 0,
      inPlay: t.inPlay || 0,
      statusKnown: known,
      done: known && !(t.remaining || 0) && !(t.inPlay || 0),
    }));

    // Locks are decided from real (current) scores on both cards. Scores only
    // ever go up, and fantasy points have no cap, so:
    //  - a team is locked ABOVE once at least half the league is finished and
    //    already scoring below its current score (only finished teams are
    //    certain to stay below it; unfinished ones could still climb past);
    //  - a FINISHED team is locked BELOW once at least half the league is
    //    already scoring above it (finished or not, they can't drop back).
    // The zone lines are drawn on the Current strip only, where the axis is
    // in real scores. The lower line applies to a team that has finished.
    let zones = null;
    if (known) {
      const finished = withScore.filter(m => m.done).map(m => m.cur);
      const upLine = finished.length >= half ? [...finished].sort((a, b) => a - b)[half - 1] : null;
      // Also requires a finished team to exist -- with nobody done yet
      // (e.g. before Thursday kickoff), no team can be locked below this
      // line regardless of its numeric value, so it shouldn't draw.
      const downLine = finished.length > 0 && withScore.length > half
        ? withScore.map(m => m.cur).sort((a, b) => b - a)[half - 1]
        : null;
      withScore.forEach(m => {
        m.lockedAbove = upLine !== null && m.cur > upLine;
        m.lockedBelow = m.done && downLine !== null && m.cur < downLine;
        m.locked = m.lockedAbove || m.lockedBelow;
      });
      if (upLine !== null || downLine !== null) zones = { up: upLine, down: downLine };
    }
    const sorted = withScore.slice().sort((a, b) => b.score - a.score);
    return { above: sorted.slice(0, half), below: sorted.slice(sorted.length - half), all: sorted, zones };
  }

  // ---------- Median Watch: unified Current/Projected toggle card ----------
  // Remembered per-browser across real page reloads (not just the in-memory
  // periodic refresh, which already preserves it since medianViewMode just
  // isn't reset). Defaults to 'projected' the first time, same as before,
  // and falls back to it if localStorage is blocked/unavailable or holds
  // something unexpected.
  let medianViewMode = 'projected';
  try {
    const saved = localStorage.getItem('medianViewMode');
    if (saved === 'current' || saved === 'projected') medianViewMode = saved;
  } catch (e) {}
  let lastMedianTeams = null, lastMedianData = null;
  const mwSlug = name => 'mw-' + name.replace(/[^a-zA-Z0-9]/g, '-');

  function tagMedianTransitionNames() {
    document.querySelectorAll('#median-above .mb-card, #median-below .mb-card').forEach(el => {
      el.style.viewTransitionName = 'card-' + mwSlug(el.dataset.name);
    });
    document.querySelectorAll('#median-chart .slot').forEach(el => {
      el.style.viewTransitionName = 'chart-' + mwSlug(el.dataset.name);
    });
  }

  // Re-skins each already-positioned chip-style cluster back into one
  // shared pill (today's merged look) by reading its composition straight
  // off the DOM -- no re-layout, nothing moves, only the per-chip borders
  // dissolve away (see the .slot/.name-row transitions in the CSS).
  function settleMedianToMergedPills() {
    const RED = 'rgba(192,87,75,0.28)', GREEN = 'rgba(76,154,107,0.28)';
    document.querySelectorAll('#median-chart .name-row.plain-wrap').forEach(row => {
      const slots = Array.from(row.querySelectorAll('.slot'));
      const belowCount = slots.filter(s => s.classList.contains('below')).length;
      const aboveCount = slots.length - belowCount;
      row.querySelectorAll(':scope > .split-fill').forEach(f => f.remove());
      let background, borderColor;
      if (belowCount === 0) { background = `linear-gradient(${GREEN}, ${GREEN})`; borderColor = 'var(--turf-dim)'; }
      else if (aboveCount === 0) { background = `linear-gradient(${RED}, ${RED})`; borderColor = 'rgba(192,87,75,0.5)'; }
      else {
        background = 'none';
        borderColor = 'transparent';
        const redPct = (belowCount / slots.length) * 100;
        const greenPct = 100 - redPct;
        const redFill = document.createElement('div');
        redFill.className = 'split-fill';
        redFill.style.cssText = `position:absolute;left:0;right:0;bottom:0;height:${redPct}%;background:${RED};border:1px solid rgba(192,87,75,0.5);border-top:none;border-radius:0 0 4px 4px;`;
        const greenFill = document.createElement('div');
        greenFill.className = 'split-fill';
        greenFill.style.cssText = `position:absolute;left:0;right:0;top:0;height:${greenPct}%;background:${GREEN};border:1px solid var(--turf-dim);border-bottom:none;border-radius:4px 4px 0 0;`;
        row.prepend(greenFill);
        row.prepend(redFill);
      }
      const anyLocked = slots.some(s => s.classList.contains('locked'));
      row.style.backgroundImage = background;
      row.style.borderColor = borderColor;
      row.style.boxShadow = !anyLocked ? '' : belowCount === 0 ? '0 0 14px rgba(76,154,107,0.3)' : aboveCount === 0 ? '0 0 14px rgba(192,87,75,0.3)' : '';
      row.classList.remove('plain-wrap');
      slots.forEach(s => s.classList.remove('slot-chip'));
    });
    const tick = document.querySelector('#median-chart .median-tick');
    if (tick) tick.classList.remove('slim');
  }

  function tickMwNumber(el, from, to) {
    if (!el) return;
    const duration = 680;
    const fromV = Number(from), toV = Number(to);
    el.textContent = fromV.toFixed(2);
    const start = performance.now();
    function frame(now) {
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      el.textContent = (fromV + (toV - fromV) * eased).toFixed(2);
      if (t < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function medianPendingBodyHtml() {
    return `<div class="median-pending"><div class="pending-headline" id="kickoff-countdown">\u2014</div><div class="pending-sub">Until Thursday Night Kickoff</div></div>`;
  }

  // Used for the initial load and every periodic refresh (new data, same or
  // different mode) -- rebuilds the whole card fresh with no animation at
  // all, straight to the normal merged-pill look. Toggling mode is the only
  // thing that animates (see applyMedianUpdate below); a 2-minute data
  // refresh landing mid-animation would be an awkward collision otherwise.
  function renderMedianStatic(mode) {
    const currentHasStarted = lastMedianTeams.some(t => t.current > 0);
    const toggleHtml = `<div class="sup-seg" id="median-toggle-seg">
      <button data-mode="current" class="${mode === 'current' ? 'on' : ''}">Current</button>
      <button data-mode="projected" class="${mode === 'projected' ? 'on' : ''}">Projected</button>
    </div>`;
    let bodyHtml, rows = null, medianValue = null;
    if (mode === 'current' && !currentHasStarted) {
      bodyHtml = medianPendingBodyHtml();
    } else {
      medianValue = mode === 'current' ? lastMedianData.currentMedian : lastMedianData.projectedMedian;
      const label = mode === 'current' ? 'Current Median' : 'Projected Median';
      rows = computeMedianRows(lastMedianTeams, medianValue, mode);
      bodyHtml = `
        <div class="card-body">
          <div>
            <div id="median-above">${mwGridHtml(rows.above, 'turf')}</div>
            <div class="median-split-label">${label} <b>${fmtScore(medianValue)}</b></div>
            <div id="median-below">${mwGridHtml(rows.below, 'loss')}</div>
          </div>
          <div class="spread-col${rows.zones ? ' zoned' : ''}" id="median-spreadcol" style="width:${rows.zones ? 118 : 88}px;">
            <div class="vplot${rows.zones ? ' zoned' : ''}" id="median-chart"></div>
          </div>
        </div>`;
    }
    document.getElementById('median-container').innerHTML = `
      <div class="median-card">
        <div class="median-card-header">
          <span class="median-card-title">Median Watch</span>
          ${toggleHtml}
        </div>
        <div id="median-body">${bodyHtml}</div>
      </div>`;
    if (rows) {
      renderSpreadChart('median-chart', rows.all.slice().reverse(), medianValue, rows.zones, true);
      // Every card/chart element needs a view-transition-name BEFORE a
      // toggle starts, not just after one -- the browser's View Transition
      // snapshots whatever names are already in the DOM at the moment
      // startViewTransition is called, to know what to morph FROM. Without
      // this, the very first toggle click has nothing tagged yet (this
      // static path never used to tag anything), so nothing can slide --
      // it just falls back to an instant swap, and only looks right from
      // the SECOND click on, once a prior toggle has tagged things.
      tagMedianTransitionNames();
      // The chart measures pill size/width via JS (measurePillHeights/
      // measureMaxRowWidth), using whatever font is active at that instant
      // -- but the page's custom fonts load async (display=swap), so a
      // cold first load can measure against the fallback font before the
      // real one swaps in, sizing the chart slightly wrong. The rest of the
      // card reflows automatically when the font arrives (that's just
      // CSS), but this chart's pill geometry is locked into whatever was
      // measured and won't. Re-measuring once fonts are confirmed loaded
      // fixes the mis-sized first paint -- and since that resolves well
      // before a human can click the toggle, it also keeps the first
      // toggle's View Transition "old" snapshot correctly sized instead of
      // animating from the wrong geometry.
      if (document.fonts && document.fonts.ready) {
        const mode = medianViewMode;
        document.fonts.ready.then(() => {
          if (medianViewMode === mode) {
            renderSpreadChart('median-chart', rows.all.slice().reverse(), medianValue, rows.zones, true);
            tagMedianTransitionNames();
          }
        });
      }
    }
    updateKickoffCountdown();
  }

  // ---------- Stat of the Moment ----------
  // A single hero fact under Median Watch, re-rolled on every data refresh
  // (loadDashboard already runs every 2 minutes and on every manual
  // reload, so this "cycles" along with it rather than needing its own
  // timer). Always shows the manager, not the team name, per request.
  //
  // Deliberately never comments on an in-progress matchup (closest
  // game/blowout/upset watch used to, and reading "up by 2.5 right now"
  // next to "but was given only a 30% chance to win" read as flatly
  // contradictory mid-game, since win probability here is closer to a
  // pregame number than a true live-updating one) -- every fact here is
  // either season-to-date (current year, from the live Worker data,
  // through completed weeks only) or full career history (all time, from
  // docs/data/franchise.json, fetched once below). Neither source can
  // produce a claim that's still in flux.
  //
  // ~20 current-year templates + ~20 all-time templates, several of which
  // produce one fact per qualifying manager (every active streak, every
  // manager's nemesis/favorite rivalry, every worst bench mistake) rather
  // than a single league winner -- across a 14-manager franchise that's
  // comfortably 100+ distinct facts that could appear here, even though
  // only whichever are true right now are in the pool on a given refresh.
  // Several are deliberately played for laughs (Paper Champion, Human
  // Victory Cigar, rivalry nemesis, worst bench mistake) per request.
  function who(t) { return (t && (t.manager || t.name)) || 'Someone'; }
  function hi(x) { return `<b>${x}</b>`; }

  let franchiseData = null;
  fetch('data/franchise.json', { cache: 'no-store' })
    .then(res => res.json())
    .then(d => {
      franchiseData = d;
      // Only render here if the main dashboard data has already arrived
      // and rendered once (loadDashboard calls this itself too, every
      // cycle) -- franchise.json is a small static file that often
      // resolves well before the live Worker fetch, so without this
      // guard the League Lore card could appear and pick its first fact
      // before the rest of the page (matchups, standings) has loaded,
      // drawing attention to itself mid-load instead of appearing in
      // step with everything else.
      if (standingsData) renderStatOfMoment();
    })
    .catch(() => {});

  function currentYearFacts(data) {
    const teams = data.teams || [];
    if (!teams.length) return [];
    const facts = [];
    const add = (cond, text) => { if (cond) facts.push(text); };

    // teams[] already arrives ranked best-record-first, same assumption
    // Current Standings relies on.
    const byPF = [...teams].sort((a, b) => (b.pointsFor || 0) - (a.pointsFor || 0));
    const byPA = [...teams].sort((a, b) => (b.pointsAgainst || 0) - (a.pointsAgainst || 0));
    const byDiff = [...teams].sort((a, b) =>
      ((b.pointsFor || 0) - (b.pointsAgainst || 0)) - ((a.pointsFor || 0) - (a.pointsAgainst || 0)));
    const byOdds = teams.filter(t => typeof t.playoffPct === 'number').sort((a, b) => (b.playoffPct || 0) - (a.playoffPct || 0));

    add(byPF[0], `${who(byPF[0])} leads the league with ${hi(fmtScore(byPF[0] && byPF[0].pointsFor))} points for this year.`);
    add(byPF.length > 1, `${who(byPF[byPF.length - 1])} has the league's fewest points for this year, just ${hi(fmtScore(byPF[byPF.length - 1] && byPF[byPF.length - 1].pointsFor))}.`);
    add(byPA[0], `${who(byPA[0])} has allowed more points than anyone this year, ${hi(fmtScore(byPA[0] && byPA[0].pointsAgainst))} against.`);
    add(byPA.length > 1, `${who(byPA[byPA.length - 1])} has the league's stingiest schedule this year, allowing just ${hi(fmtScore(byPA[byPA.length - 1] && byPA[byPA.length - 1].pointsAgainst))}.`);
    add(teams[0], `${who(teams[0])} owns the league's best record this year at ${hi(teams[0] && teams[0].record)}.`);
    add(teams.length > 1, `${who(teams[teams.length - 1])} is holding down the league cellar this year at ${hi(teams[teams.length - 1] && teams[teams.length - 1].record)}.`);
    add(byDiff[0], `${who(byDiff[0])} has the league's best point differential this year at ${hi('+' + fmtScore((byDiff[0].pointsFor || 0) - (byDiff[0].pointsAgainst || 0)))}.`);
    add(byDiff.length > 1, `${who(byDiff[byDiff.length - 1])} has the league's worst point differential this year at ${hi(fmtScore((byDiff[byDiff.length - 1].pointsFor || 0) - (byDiff[byDiff.length - 1].pointsAgainst || 0)))}.`);
    add(byOdds[0], `${who(byOdds[0])} has the best playoff odds in the league right now at ${hi(fmtPct(byOdds[0] && byOdds[0].playoffPct))}.`);
    add(byOdds.length > 1, `${who(byOdds[byOdds.length - 1])} has the longest playoff odds in the league right now, just ${hi(fmtPct(byOdds[byOdds.length - 1] && byOdds[byOdds.length - 1].playoffPct))}.`);

    const ptc = data.playoffTeamCount || 0;
    add(ptc > 0 && teams[ptc - 1], `${who(teams[ptc - 1])} is clinging to the final playoff spot, at #${ptc}.`);
    add(ptc > 0 && teams[ptc], `${who(teams[ptc])} is first team out of the playoff picture right now.`);

    const pfRank = new Map(byPF.map((t, i) => [t.name, i]));
    add(teams[0] && pfRank.get(teams[0].name) >= 3,
      `${who(teams[0])} has the league's best record this year without even cracking the points-for top 3 -- a certified Paper Champion.`);
    const unlucky = teams.slice(Math.ceil(teams.length / 2)).find(t => pfRank.get(t.name) < 3);
    add(unlucky, `${who(unlucky)} is stuck in the bottom half of the standings despite a top-3 points-for total -- snake-bitten doesn't begin to cover it.`);
    add(byPF.length, `${who(byPF[byPF.length - 1])} has quietly put up the league's fewest points all year -- the Human Victory Cigar.`);

    const h = data.priorSeasonHigh;
    add(h && h.score, `${(h && (h.manager || h.team)) || ''} set this year's high score to beat, ${hi(fmtScore(h && h.score))} in Week ${h && h.week}.`);

    return facts;
  }

  // Past members no longer in the league -- individual career stats about
  // them personally are stale/irrelevant trivia at this point, but a
  // *current* manager's good head-to-head record against one of them is
  // still fair game (that's the current manager's stat, not theirs), per
  // request.
  const PAST_MEMBERS = new Set(['Chappy', 'Corey']);

  function allTimeFacts(franchise) {
    const allPlayers = (franchise && franchise.players) || [];
    if (!allPlayers.length) return [];
    const players = allPlayers.filter(p => !PAST_MEMBERS.has(p.name));
    const facts = [];
    const add = (cond, text) => { if (cond) facts.push(text); };
    const maxBy = (arr, f) => arr.reduce((a, b) => (a === null || f(b) > f(a) ? b : a), null);
    const minBy = (arr, f) => arr.reduce((a, b) => (a === null || f(b) < f(a) ? b : a), null);
    const has = (p, f) => typeof f(p) === 'number';
    // Fisher-Yates-ish: good enough for "pick a handful at random" on a
    // list this small, not used anywhere order-sensitive.
    const sampleUpTo = (arr, n) => arr.map(x => [Math.random(), x]).sort((a, b) => a[0] - b[0]).slice(0, n).map(([, x]) => x);

    const withChamps = players.filter(p => has(p, p => p.career && p.career.standings && p.career.standings.championships));
    const topChamp = maxBy(withChamps, p => p.career.standings.championships);
    add(topChamp && topChamp.career.standings.championships > 0,
      `${topChamp && topChamp.name} has the most championships in league history with ${hi(topChamp && topChamp.career.standings.championships)}.`);

    const withWinPct = players.filter(p => has(p, p => p.career && p.career.win_rates && p.career.win_rates.reg_pct));
    const bestWinPct = maxBy(withWinPct, p => p.career.win_rates.reg_pct);
    const worstWinPct = minBy(withWinPct, p => p.career.win_rates.reg_pct);
    add(bestWinPct, `${bestWinPct && bestWinPct.name} has the best all-time regular season win rate at ${hi(fmtPct(bestWinPct && bestWinPct.career.win_rates.reg_pct))}.`);
    add(worstWinPct, `${worstWinPct && worstWinPct.name} has the worst all-time regular season win rate at ${hi(fmtPct(worstWinPct && worstWinPct.career.win_rates.reg_pct))}.`);

    const withTotalPF = players.filter(p => has(p, p => p.career && p.career.points && p.career.points.total_pf));
    const topTotalPF = maxBy(withTotalPF, p => p.career.points.total_pf);
    add(topTotalPF, `${topTotalPF && topTotalPF.name} has scored more career points than anyone in league history, ${hi(fmtScore(topTotalPF && topTotalPF.career.points.total_pf))}.`);

    const withHigh = players.filter(p => has(p, p => p.extremes && p.extremes.highest_score));
    const topHigh = maxBy(withHigh, p => p.extremes.highest_score);
    add(topHigh, `${topHigh && topHigh.name} owns the single-week scoring record in league history, ${hi(fmtScore(topHigh && topHigh.extremes.highest_score))}.`);
    const withLow = players.filter(p => has(p, p => p.extremes && typeof p.extremes.lowest_score === 'number'));
    const lowLow = minBy(withLow, p => p.extremes.lowest_score);
    add(lowLow, `${lowLow && lowLow.name} is responsible for the lowest single-week score in league history, just ${hi(fmtScore(lowLow && lowLow.extremes.lowest_score))}.`);

    const withWinMargin = players.filter(p => has(p, p => p.extremes && p.extremes.biggest_win_margin));
    const topWinMargin = maxBy(withWinMargin, p => p.extremes.biggest_win_margin);
    add(topWinMargin, `${topWinMargin && topWinMargin.name} is behind the biggest single-game blowout in league history, a ${hi(fmtScore(topWinMargin && topWinMargin.extremes.biggest_win_margin))}-point win.`);
    const withLossMargin = players.filter(p => has(p, p => p.extremes && p.extremes.biggest_loss_margin));
    const topLossMargin = maxBy(withLossMargin, p => p.extremes.biggest_loss_margin);
    add(topLossMargin, `${topLossMargin && topLossMargin.name} is on the wrong end of the worst beatdown in league history, a ${hi(fmtScore(topLossMargin && topLossMargin.extremes.biggest_loss_margin))}-point loss.`);

    const withStreakW = players.filter(p => has(p, p => p.streaks && p.streaks.combined && p.streaks.combined.longest_win));
    const topStreakW = maxBy(withStreakW, p => p.streaks.combined.longest_win);
    add(topStreakW, `${topStreakW && topStreakW.name} holds the league's longest winning streak ever at ${hi(topStreakW && topStreakW.streaks.combined.longest_win)} games.`);
    const withStreakL = players.filter(p => has(p, p => p.streaks && p.streaks.combined && p.streaks.combined.longest_loss));
    const topStreakL = maxBy(withStreakL, p => p.streaks.combined.longest_loss);
    add(topStreakL, `${topStreakL && topStreakL.name} holds the league's longest losing streak ever at ${hi(topStreakL && topStreakL.streaks.combined.longest_loss)} games.`);

    const withSackos = players.filter(p => has(p, p => p.weekly_sackos));
    const topSackos = maxBy(withSackos, p => p.weekly_sackos);
    add(topSackos && topSackos.weekly_sackos > 0, `${topSackos && topSackos.name} has taken home the most weekly Sacko awards in league history, ${hi(topSackos && topSackos.weekly_sackos)}.`);
    const withSeasonSackos = players.filter(p => has(p, p => p.career && p.career.standings && p.career.standings.sackos));
