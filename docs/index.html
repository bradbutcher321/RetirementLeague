<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>html{background:#050505}</style>
<title>Retirement League — Live Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The two font-family's woff2 files Google serves for the latin subset
     at the weights this site uses -- one variable-font file per family
     covers every weight declared, confirmed directly by fetching the
     stylesheet below and comparing each @font-face block's url(). Starts
     the actual font downloads immediately, in parallel with that
     stylesheet fetch, instead of waiting to discover these same URLs
     only after the stylesheet loads and is parsed -- avoids the
     fallback-to-webfont swap (FOUT) that otherwise shows on a slow or
     uncached load. If Google ever changes these hashed URLs, this just
     degrades to a wasted (unused) preload, not a correctness issue -- the
     stylesheet's own @font-face still fetches whatever the new URL is. -->
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/bigshouldersdisplay/v24/fC1_PZJEZG-e9gHhdI4-NBbfd2ys3SjJCx1czNDu.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=9">
<link rel="stylesheet" href="nav.css?v=4">
<style>
  /* ---------- Matchup cards ----------
     Phone first: one card per row, both teams side by side, nothing
     scrolls sideways. Two cards per row on desktop, where one card
     stretched to 980px left a wide empty middle. Every class the card
     adds is mu-prefixed -- Median Watch already owns .slot, .live, etc.

     State is carried by exactly three things, so nothing on the card
     competes with them:
       - the status pill (VS -> pulsing red LIVE -> FINAL), which also
         holds the expand chevron;
       - the win-odds meter, gold on the favorite's share only (this
         replaced a gold wash toward the favorite, which said who but not
         by how much);
       - one pip per starter, in roster order (outline = yet to play, red =
         in a live game, gold = live and his team has the ball, grey = done). */
  .matchups{ display: grid; gap: 12px; }
  @media (min-width: 900px){ .matchups{ grid-template-columns: 1fr 1fr; align-items: start; gap: 14px; } }

  .matchup-card{
    container: mu / inline-size;
    background: linear-gradient(165deg, var(--surface-2), var(--surface));
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
  }

  .mu-head{ display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); align-items: start; gap: 12px; padding: 14px 14px 0; }
  .mu-side{ min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .mu-side.home{ align-items: flex-end; text-align: right; }
  .team-name{
    font-weight: 600;
    font-size: 0.95rem;
    /* Stretched to the side's full width so there's a fixed box to measure
       and truncate against. Stays right-aligned on the home side until JS
       (see loadDashboard) finds this particular name overflowing and adds
       .truncate, which flips just that one name to left-aligned so the cut
       and the "…" land at the end instead of the start. */
    align-self: stretch;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .team-name.truncate{ text-align: left; }
  .mu-meta{ font-size: 0.76rem; color: var(--text-dim); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .mu-stk.win{ color: var(--turf); }
  .mu-stk.loss{ color: var(--loss); }
  .mu-score{
    font-family: var(--scoreboard);
    font-weight: 700;
    font-size: 2.6rem;
    line-height: 0.95;
    font-variant-numeric: tabular-nums;
    margin-top: 6px;
    color: var(--text);
  }
  /* Live: the trailing score steps back a little. Decided: the winner's
     score is gold with a glow -- it's the one number the card exists to
     report -- and the loser's recedes. */
  .mu-score.trail{ color: rgba(245,245,243,0.7); }
  .mu-score.won{ color: var(--gold); text-shadow: 0 0 20px rgba(212,180,106,0.45); }
  .mu-score.lost{ color: var(--text-dim); }
  .mu-proj{ font-size: 0.74rem; color: var(--text-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* A decided card's result against its pregame projection: the arrow and
     number take the tone, "vs proj" stays dim. */
  .mu-proj.vs.up{ color: var(--turf); }
  .mu-proj.vs.down{ color: var(--loss); }
  .mu-proj.vs span{ color: var(--text-dim); }
  .mu-arrow{ width: 0.62em; height: 0.5em; margin-right: 3px; vertical-align: 0.05em; }

  .mu-odds{ display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; padding: 12px 14px 0; font-size: 0.74rem; font-weight: 600; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .mu-odds .fav{ color: var(--gold); }
  .mu-bar{ display: flex; gap: 3px; height: 5px; }
  .mu-bar span{ border-radius: 3px; background: rgba(255,255,255,0.13); }
  .mu-bar span.fav{ background: var(--gold); }
  .mu-margin{ padding: 12px 14px 0; text-align: center; font-size: 0.74rem; color: var(--text-dim); font-variant-numeric: tabular-nums; }

  .mu-foot{ display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: center; gap: 8px; padding: 12px 14px; }
  .mu-pips-wrap{ display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .mu-pips-wrap.home{ align-items: flex-end; }
  .mu-pips{ display: flex; gap: 3px; }
  .mu-pip{ width: 12px; height: 5px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.22); }
  .mu-pip.live{ background: var(--loss); box-shadow: none; }
  .mu-pip.possession{ background: var(--gold); box-shadow: none; }
  .mu-pip.final{ background: rgba(255,255,255,0.42); box-shadow: none; }
  .mu-pip-text{ font-size: 0.7rem; color: var(--text-dim); white-space: nowrap; }
  .mu-pip-text .n-live{ color: var(--loss); font-weight: 600; }

  .mu-status{
    display: inline-flex; align-items: center; gap: 5px;
    font-family: var(--scoreboard); font-weight: 800; font-size: 0.78rem;
    letter-spacing: 0.06em; text-transform: uppercase;
    padding: 5px 9px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--text-dim);
    white-space: nowrap;
  }
  .mu-status.live{ border-color: rgba(214,98,79,0.55); color: var(--loss); }
  .mu-status.final{ border-color: rgba(255,255,255,0.18); color: var(--text); }
  .mu-status .pulse-dot{ width: 6px; height: 6px; border-radius: 50%; background: var(--loss); animation: pulse 1.6s ease-in-out infinite; }
  .mu-chev{ display: grid; place-items: center; margin-right: -3px; opacity: 0.8; transition: transform 0.25s ease; }
  .matchup-card.expanded .mu-chev{ transform: rotate(180deg); }
  @keyframes pulse{
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(1.35); }
  }

  /* ---------- Expanded matchup details (per-player roster) ---------- */
  .matchup-details{ display: none; border-top: 1px solid var(--line); background: rgba(0,0,0,0.22); padding: 4px; }
  .matchup-card.expanded .matchup-details{ display: block; }
  .mu-row{ display: grid; grid-template-columns: minmax(0,1fr) 38px minmax(0,1fr); align-items: stretch; padding: 2px 0; }
  .mu-row + .mu-row{ border-top: 1px solid rgba(255,255,255,0.04); }
  .mu-slot{ align-self: center; justify-self: center; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.04em; color: var(--text-dim); }

  /* No edge bars (house style: state is an outline plus a faint tint of
     the same color). His team has the ball = the site's gold lead outline;
     in a live game = a faint white one; finished = the name recedes and
     the projection turns into how far over/under it he landed. */
  .mu-pc{ min-width: 0; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 6px; align-items: center; padding: 8px; border-radius: 9px; }
  .mu-pc.home{ grid-template-columns: auto minmax(0,1fr); }
  .mu-pc.home .mu-pinfo{ order: 2; text-align: right; }
  .mu-pc.home .mu-pscore{ order: 1; text-align: left; }
  .mu-pc.live{ background: rgba(255,255,255,0.035); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.11); }
  .mu-pc.possession{ background: var(--lead-tint); box-shadow: inset 0 0 0 1px var(--lead-line); }
  .mu-pinfo{ min-width: 0; align-self: start; }
  /* Flex row so the team badge (flex-shrink: 0) always stays whole and the
     name text hard-clips right where it meets it -- no ellipsis. */
  .player-name{ display: flex; align-items: center; gap: 4px; min-width: 0; font-weight: 600; font-size: 0.82rem; }
  .mu-pc.home .player-name{ justify-content: flex-end; }
  .mu-pc.final .player-name{ color: rgba(245,245,243,0.75); }
  .name-text{ min-width: 0; overflow: hidden; white-space: nowrap; }
  .team-tag{
    flex-shrink: 0;
    font-size: 0.6rem;
    font-weight: 700;
    color: var(--text-dim);
    background: var(--surface-raised);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 4px;
  }
  .mu-gline{ font-size: 0.68rem; color: var(--text-dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mu-gline .clk{ color: var(--text); font-weight: 600; }
  .mu-pc.possession .mu-gline .clk{ color: var(--gold); }
  .mu-gline .ldot{ display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--loss); margin-right: 4px; vertical-align: 1px; animation: pulse 1.6s ease-in-out infinite; }
  .mu-gline .ball{ display: inline-block; width: 9px; height: 6px; border-radius: 50%; background: var(--gold); margin-right: 4px; }
  /* Up to two wrapped lines, then hard-cut (no ellipsis). */
  .mu-sline{ font-size: 0.68rem; color: var(--text-dim); margin-top: 2px; line-height: 1.35; max-height: 2.7em; overflow: hidden; }
  .mu-pscore{ text-align: right; font-variant-numeric: tabular-nums; }
  .mu-pts{ font-family: var(--scoreboard); font-weight: 700; font-size: 1.08rem; line-height: 1; }
  .mu-pts.none{ color: var(--text-dim); }
  .mu-sub{ font-size: 0.66rem; color: var(--text-dim); margin-top: 3px; white-space: nowrap; font-weight: 500; }
  .mu-sub.up{ color: var(--turf); font-weight: 700; }
  .mu-sub.down{ color: var(--loss); font-weight: 700; }

  /* Game line: a narrow card (phone) drops the "PM" and the opponent on
     live/final lines; a wide card (desktop) shows them. */
  .mu-w{ display: none; }
  @container mu (min-width: 460px){
    .mu-w{ display: inline; }
    .mu-n{ display: none; }
    .mu-head{ padding: 16px 18px 0; }
    .mu-odds, .mu-margin{ padding: 12px 18px 0; }
    .mu-foot{ padding: 12px 18px; }
  }
  @media (prefers-reduced-motion: reduce){
    .mu-status .pulse-dot, .mu-gline .ldot{ animation: none; }
    .mu-chev{ transition: none; }
  }
  /* ---------- Leaderboard ---------- */
  /* One row per team instead of an 8-column table — Score/Proj dropped
     (redundant with the matchup cards above) and the record shown once,
     next to the manager's name, instead of in its own column. Everything
     fits on a single row with no horizontal scroll or tap-to-expand. */
  .leaderboard{ display: flex; flex-direction: column; gap: 8px; }
  .lb-row{
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--item);
    border: 1px solid var(--item-line);
    border-radius: 10px;
    padding: 10px 14px;
  }
  .lb-rank{
    font-family: var(--scoreboard);
    font-weight: 800;
    font-size: 1.2rem;
    color: var(--text-dim);
    width: 20px;
    text-align: center;
    flex-shrink: 0;
  }
  .lb-row.playoff .lb-rank{ color: var(--gold); }
  .lb-identity{ flex: 1; min-width: 0; }
  .lb-name{
    font-weight: 600;
    font-size: 0.92rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .lb-meta{ color: var(--text-dim); font-size: 0.76rem; margin-top: 1px; }
  .lb-stat{ text-align: center; flex-shrink: 0; width: 48px; }
  .lb-stat .v{ font-family: var(--scoreboard); font-weight: 700; font-size: 0.95rem; font-variant-numeric: tabular-nums; }
  .lb-stat .l{ font-size: 0.58rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.02em; margin-top: 1px; }
  .lb-playoff-chip{
    flex-shrink: 0;
    font-size: 0.68rem;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--text-dim);
    min-width: 40px;
    text-align: center;
  }
  .lb-playoff-chip.high{ border-color: var(--turf-dim); color: var(--turf); }
  .lb-playoff-chip.low{ border-color: rgba(192,87,75,0.4); color: var(--loss); }


  /* ---------- Median Watch ----------
     The card surface itself comes from theme.css's shared card rule. */
  .median-card{ padding: 18px 20px; }
  .median-card-header{
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }
  .median-card-title{ font-weight: 700; font-size: 0.95rem; color: var(--text); }

  /* The card splits into the Above/Below grids (left) and the vertical
     spread strip (right, fixed width) side by side, so the grids run 2
     columns x 3 rows instead of 3 x 2 to leave room for it. */
  .card-body{ display: grid; grid-template-columns: 1fr auto; gap: 16px; }
  .live-dot{ display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--loss); --pc: 192,87,75; animation: live-pulse 1.6s infinite; }
  @keyframes live-pulse{
    0%{ box-shadow: 0 0 0 0 rgba(var(--pc), 0.6); }
    70%{ box-shadow: 0 0 0 6px rgba(var(--pc), 0); }
    100%{ box-shadow: 0 0 0 0 rgba(var(--pc), 0); }
  }
  /* A single-axis plot positioned by each team's actual score, not rank —
     distance on the page is real distance in points. Runs top (highest)
     to bottom (lowest); adjacent teams close enough to visually collide
     merge into one taller row (see renderSpreadChart) with all their
     names stacked, highest on top. */
  /* Reserved top/bottom padding is where the low/high endcap labels live
     (see .endcap-score below) — kept outside .vplot's own box entirely so
     they can never overlap the top/bottom rows inside it. */
  .spread-col{ width: 108px; flex-shrink: 0; padding: 15px 0; }
  .vplot{ position: relative; height: 100%; min-height: 200px; }
  .vplot .axis{ position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: var(--line); }
  /* z-index above .name-row so the tick renders on top of row edges
     instead of disappearing behind them (plain DOM order would otherwise
     paint rows, which come after it in the markup, over the top of it).
     No text label on it — the actual median value is already shown in
     the card header, and there's no space in this narrow a column to
     print it here without it colliding with the name rows on the line. */
  .vplot .median-tick{ position: absolute; left: 0; right: 0; height: 1px; background: var(--gold); box-shadow: 0 0 8px rgba(212,180,106,0.7); z-index: 2; }
  /* Fixed-opacity backdrop marking which half of the plot is above vs.
     below the median -- not a per-team proportional bar, since its two
     bands don't scale with any one team's value. */
  .median-zone-wash{ position: absolute; left: 0; right: 0; z-index: 0; pointer-events: none; }
  .median-zone-wash.above{ background: linear-gradient(to top, transparent, rgba(79,174,122,0.07)); }
  .median-zone-wash.below{ background: linear-gradient(to bottom, transparent, rgba(214,98,79,0.07)); }
  /* Background is set inline per-row (solid green/above, solid red/below,
     or a split gradient sized to how many members are on each side of the
     median for a merged row) since it varies per team composition. Width
     is also set inline (see measureMaxRowWidth) so every row — single
     name or merged — is exactly as wide as the single longest name among
     this week's teams, not a guessed constant with padding to spare. */
  .name-row{
    background-color: var(--surface);
    position: absolute;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    border: 1px solid var(--line);
    padding: 0;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .name-row .slot{
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    line-height: 1.4;
    border: 1px solid transparent;
    border-radius: 0;
    width: 100%;
    text-align: center;
    transition: background-color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }
  /* Only the outer corners of a (possibly merged) pill are rounded, so a
     locked fill in the middle of a stack is square. */
  .name-row .slot:first-child{ border-top-left-radius: 3px; border-top-right-radius: 3px; }
  .name-row .slot:last-child{ border-bottom-left-radius: 3px; border-bottom-right-radius: 3px; }
  /* Status on the strip: check = no starters left, glowing outline = result locked
     in (see renderMedianCard), red pulsing dot = a player is live. */
  .name-row .slot{ position: relative; }
  .name-row .slot.live::before{
    content: '';
    position: absolute;
    left: 4px;
    top: 50%;
    margin-top: -2.5px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--loss);
    --pc: 192,87,75;
    animation: live-pulse 1.6s infinite;
  }
  .name-row .slot.final::after{
    content: '\2713';
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.6rem;
    line-height: 1;
  }
  /* Locked = a bright glowing outline around just that name, green above
     the median and red below; raised so the glow sits over its neighbors. */
  .name-row .slot.locked{ z-index: 1; border-radius: 3px; }
  .name-row .slot.locked::after{ color: var(--gold); }
  .name-row .slot.locked.above{ border-color: var(--turf); box-shadow: 0 0 8px rgba(76,154,107,0.9), inset 0 0 6px rgba(76,154,107,0.45); }
  .name-row .slot.locked.below{ border-color: var(--loss); box-shadow: 0 0 8px rgba(192,87,75,0.9), inset 0 0 6px rgba(192,87,75,0.45); }
  .name-row .slot.above{ color: var(--turf); }
  .name-row .slot.below{ color: var(--loss); }
  /* Sits in .spread-col's own reserved padding, above/below .vplot's box
     entirely, so it can't overlap the top/bottom name rows inside it. */
  .endcap-score{
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.62rem;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  /* Lock lines on the strip: above the green line a team can't fall below
     the median any more, below the red line a finished team can't get above
     it. Their values sit under the median label (.median-lock-line), not
     beside the plot, so the strip stays 88px and the cards keep the room. */
  .zone{ position: absolute; left: 0; right: 0; z-index: 0; }
  .zone.up{ border-bottom: 1px dashed rgba(76,154,107,0.6); }
  .zone.dn{ border-top: 1px dashed rgba(192,87,75,0.6); }
  .endcap-score.low{ bottom: -15px; }
  .endcap-score.high{ top: -15px; }

  .median-pending{
    text-align: center;
    padding: 22px 10px 14px;
  }
  .pending-headline{
    font-family: var(--scoreboard);
    font-weight: 800;
    font-size: 2rem;
    letter-spacing: 0.01em;
    color: var(--gold);
    line-height: 1;
  }
  .pending-sub{
    margin-top: 10px;
    color: var(--text-dim);
    font-size: 0.88rem;
  }

  /* ---------- Median Watch: unified Current/Projected toggle card ---------- */
  .median-split-label{ text-align: center; color: var(--gold); font-weight: 700; font-size: 0.8rem; letter-spacing: 0.02em; margin: 12px 0; padding: 7px 0; }
  .median-split-label b{ font-family: var(--scoreboard); font-variant-numeric: tabular-nums; margin-left: 6px; }
  /* Pulled up under the median label, inside its bottom padding. */
  .median-lock-line{ text-align: center; font-size: 0.66rem; font-weight: 600; color: var(--text-dim); margin: -8px 0 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .median-lock-line b{ font-family: var(--scoreboard); font-size: 0.8rem; font-weight: 700; margin-left: 4px; }
  .median-lock-line .up b{ color: var(--turf); }
  .median-lock-line .dn b{ color: var(--loss); }
  .median-lock-line .sep{ margin: 0 8px; opacity: 0.5; }
  .mw-grid{ display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 7px; }
  @media (max-width: 420px){
    .mw-grid{ grid-template-columns: 1fr; }
    .median-card:has(#median-toggle-seg) .median-card-header{ flex-wrap: wrap; gap: 8px; align-items: center; }
  }
  /* Each team gets its own fully self-contained chip (background/border on
     .slot itself) instead of sharing one pill per cluster -- see the
     chipStyle comment on renderSpreadChart. No gap/padding beyond the base
     .slot, and the border is an inset box-shadow rather than a real
     border+padding -- neither affects box-model height, so a chip-style row
     and its settled merged-pill row stay pixel-identical in height and
     settling never needs to reposition anything. */
  .name-row.plain-wrap{ background: none; border: none; box-shadow: none; }
  .slot.slot-chip{ display: block; border-radius: 4px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
  .slot.slot-chip.above{ background: rgba(76,154,107,0.16); box-shadow: inset 0 0 0 1px var(--turf-dim); }
  .slot.slot-chip.below{ background: rgba(192,87,75,0.16); box-shadow: inset 0 0 0 1px rgba(192,87,75,0.45); }
  .slot.slot-chip.locked.above{ box-shadow: inset 0 0 0 1px var(--turf), 0 0 8px rgba(76,154,107,0.9), inset 0 0 6px rgba(76,154,107,0.45); }
  .slot.slot-chip.locked.below{ box-shadow: inset 0 0 0 1px var(--loss), 0 0 8px rgba(192,87,75,0.9), inset 0 0 6px rgba(192,87,75,0.45); }
  /* chipStyle only: the tick is correctly positioned exactly at a cluster's
     above/below boundary, but chips sit edge-to-edge with no gap between
     them, so the line ends up sitting exactly on a chip's own border
     instead of floating independently. Hidden during the animation and
     faded back in once settleMedianToMergedPills runs. */
  .vplot .median-tick.slim{ opacity: 0; }
  /* Two independent rows: name | score on top, margin | status underneath.
     They used to be two columns (name over margin, score over status), which
     made the right column as wide as its longest status line -- "5 live · 3
     to play" -- and on a phone's two-up cards that squeezed every name down
     to "C." and ran the margin into the status. As rows, the name only has
     to share its line with the score. */
  .mb-card{ background: rgba(255,255,255,0.03); border-radius: 8px; padding: 9px 10px; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; border: 1px solid var(--line); container-type: inline-size; }
  /* Outline matches the chart's lock glow: green above, red below. The
     "Locked above/below" text stays gold (.mw-stat.locked). */
  .mb-card.locked{ border-color: var(--turf); }
  .mb-card.locked.locked-below{ border-color: var(--loss); }
  .mb-card .mw-top, .mb-card .mw-bot{ display: flex; justify-content: space-between; gap: 8px; min-width: 0; }
  .mb-card .mw-top{ align-items: baseline; }
  .mb-card .mw-bot{ align-items: baseline; }
  .mb-card .mw-name{ font-size: 1rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  /* Margin to the median -- same size as the status line, colored like the score. */
  .mb-card .mw-margin{ font-size: 0.64rem; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mb-card .mw-stats{ text-align: right; flex-shrink: 0; }
  .mb-card .mw-score{ font-family: var(--scoreboard); font-weight: 700; font-size: 1.3rem; line-height: 1.1; flex-shrink: 0; }
  /* One line per fact (see miniStatusLines): how many players are live/left,
     and separately whether the result is locked or final. Colored by class
     rather than inline, since the three readings are fixed. */
  .mb-card .mw-stat{ font-size: 0.64rem; white-space: nowrap; display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 2px; color: var(--text-dim); }
  /* Only the live count is red; players still to play stay grey. */
  .mb-card .mw-stat.live > span:first-child{ color: var(--loss); }
  .mb-card .mw-stat.locked{ color: var(--gold); }
  /* A two-up card on a phone is ~130px wide. The status always stays on
     one line ("5 live · 3 to play"), so in a card that narrow the name,
     score and status each come down a step and the separator tightens.
     No live dot on the card: the spread chart beside it already shows
     who's live, and the dot cost the line its room. */
  @container (max-width: 200px){
    .mb-card .mw-name{ font-size: 0.9rem; }
    .mb-card .mw-score{ font-size: 1.12rem; }
    .mb-card .mw-bot{ gap: 6px; }
    .mb-card .mw-stat{ font-size: 0.6rem; gap: 3px; }
    .mb-card .mw-margin{ font-size: 0.6rem; }
  }
  /* On an iPhone Pro Max (430-440px) the cards are narrower still: when the
     spread strip was 118px wide (it's 88px now), each two-up card had
     about 96px inside its padding, and a two-part status
     ("3 live · 1 to play") beside a margin needs about 110px. It ran past
     the card's edge. The status stays on one line (see above), so those
     cards get a little more room and a step smaller type instead. The
     breakpoint is where the grid is still two-up (single-column below
     421px); the container size catches only the narrowest cards. */
  @media (min-width: 421px) and (max-width: 480px){ .mb-card{ padding: 9px 7px; } }
  @container (max-width: 115px){
    .mb-card .mw-bot{ gap: 4px; }
    .mb-card .mw-stat{ font-size: 0.56rem; gap: 2px; }
    .mb-card .mw-margin{ font-size: 0.56rem; }
  }

  /* ---------- Median Watch: a manager's players still to come ----------
     A card with players left opens them -- in the shared bottom sheet on a
     phone, the shared popover under the card on desktop (theme.css "Detail
     panels", the same pair Game Records uses). Neither moves a card. */
  .mb-card.can{ cursor: pointer; transition: background-color .15s ease, border-color .15s ease; }
  .mb-card.can:hover{ background: var(--item-hover); }
  .mb-card.can:focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }
  .mb-card.sel{ border-color: var(--lead-line); background: var(--lead-tint); }
  #mw-pop{ padding: 12px 14px 14px; }
  .mwp-line{ display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .mwp-line .mwp-label{ margin: 0; }
  .mwp-line-r{ display: flex; align-items: center; gap: 10px; font-size: 0.74rem; color: var(--text-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mwp-line-r b{ font-family: var(--scoreboard); font-size: 0.95rem; font-weight: 700; color: var(--gold); margin-left: 3px; }
  /* Under the title while any card can open. "Click" with a mouse, "Tap" on a touchscreen. */
  .mw-hint{ display: block; font-size: 0.72rem; font-weight: 500; color: var(--text-dim); margin-top: 3px; }
  .mw-hint[hidden]{ display: none; }
  .mw-hint .tap{ display: none; }
  @media (hover: none){ .mw-hint .click{ display: none; } .mw-hint .tap{ display: inline; } }
  #mw-sheet .sheet-grab{ position: relative; }
  #mw-sheet .sheet-head{ padding: 6px 18px 0; }
  #mw-sheet .sheet-body{ padding: 0 18px calc(18px + env(safe-area-inset-bottom, 0px)); }
  .mwp-done{ position: absolute; right: 8px; top: 0; font: 600 0.82rem var(--body); color: var(--gold); background: none; border: 0; padding: 8px 12px; min-height: 36px; cursor: pointer; }
  .mwp-head{ display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: end; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .mwp-name{ font-size: 1.1rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mwp-sub{ font-size: 0.74rem; color: var(--text-dim); margin-top: 4px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .mwp-sub b{ font-family: var(--scoreboard); font-size: 0.95rem; font-weight: 700; color: var(--gold); margin-left: 3px; }
  .mwp-score{ font-family: var(--scoreboard); font-weight: 700; font-size: 1.9rem; line-height: 0.95; font-variant-numeric: tabular-nums; }
  #mw-sheet .mwp-name{ font-size: 1.3rem; }
  #mw-sheet .mwp-score{ font-size: 2.3rem; }
  .mwp-label{ font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-dim); margin: 12px 0 8px; }
  .mwp-pods{ display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }
  .mwp-pod{ background: var(--item); border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px 11px; min-width: 0; }
  .mwp-pod-top{ display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .mwp-st{ font-size: 0.6rem; color: var(--text-dim); display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .mwp-st.live{ color: var(--loss); }
  .mwp-st .ld{ width: 5px; height: 5px; border-radius: 50%; background: var(--loss); animation: pulse 1.5s ease-in-out infinite; }
  .mwp-game{ font-size: 0.6rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; font-variant-numeric: tabular-nums; }
  .mwp-pts{ font-family: var(--scoreboard); font-weight: 800; font-size: 1.95rem; line-height: 1; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .mwp-pts.none{ color: var(--text-dim); }
  .mwp-proj{ font-size: 0.6rem; color: var(--text-dim); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .mwp-nm{ font-size: 0.82rem; font-weight: 600; margin-top: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mwp-nm span{ color: var(--text-dim); font-weight: 500; font-size: 0.64rem; margin-left: 4px; }
  .mwp-sline{ font-size: 0.66rem; color: var(--text-dim); margin-top: 3px; line-height: 1.35; min-height: 1.35em; }
  .mwp-nav{ display: flex; justify-content: space-between; gap: 10px; margin-top: 16px; }
  .mwp-nav button{ font: 600 0.8rem var(--body); color: var(--text); background: rgba(255,255,255,0.06); border: 1px solid var(--line); border-radius: 999px; padding: 0 16px; min-height: 44px; cursor: pointer; }
  .mwp-nav button.gone{ visibility: hidden; }
  .mwp-nav button:focus-visible, .mwp-done:focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce){ .mwp-st .ld{ animation: none; } }
  /* Same 0.68s/bounce-adjacent duration as cards+chart sliding into their
     new spot on toggle. */
  ::view-transition-group(*){ animation-duration: 0.68s; animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
  /* By default a View Transition also cross-fades "root" -- a flat
     before/after screenshot of everything NOT individually named, i.e.
     the whole rest of the page -- at the UA's own default duration (0.25s,
     shorter than the 0.68s above), which reads as a quick whole-page flash
     at the start of every toggle even though nothing outside the card
     actually changed. Disabling root's animation scopes the transition to
     just the explicitly named cards/chips; everything else stays static
     and untouched the whole time. */
  ::view-transition-old(root), ::view-transition-new(root){ animation: none; mix-blend-mode: normal; }

  /* ---------- Stat of the Moment: single rotating-feeling hero fact
     directly under Median Watch, wearing the same plain card outline. ------ */
  /* --item is a translucent fill tuned to sit on top of a .glass/.median-
     card gradient, which is what makes a nested row's grey read right. But
     .stat-moment is a SIBLING of #median-container, not nested inside it
     (see the two containers in the markup below), so it sits directly on
     the page's #050505 background instead, where that same translucent
     rule resolves to a visibly darker grey. Same CSS, different backdrop
     behind it -- it needs the OPAQUE top-level card treatment every other
     standalone card on this page uses (.median-card itself included), not
     the translucent item fill meant for something nested inside one. */
  .stat-moment{
    margin-top: 0;
    height: 100%;
    background: linear-gradient(165deg, var(--surface-2), var(--surface));
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px 18px;
    display: flex;
    flex-direction: column;
  }
  /* Same size/weight/color as Current Parlay's own title (.ph-title),
     left-aligned the same way -- the two cards sit side by side, so their
     headers should read as a matched pair, not one gold and one white. */
  .stat-moment-eyebrow{ color: var(--text); font-weight: 700; font-size: 0.92rem; margin-bottom: 12px; }
  /* The fact itself lives in a bordered item box, same treatment -- and
     same content-hugging height -- as the featured leg in the Current
     Parlay card beside it. It does NOT grow to fill the card: any extra
     height from that card's stats row just leaves quiet space below the
     box rather than stretching the box itself to match. */
  .stat-moment-box{ background: var(--item); border: 1px solid var(--item-line); border-radius: 10px; padding: 12px 14px 11px; }
  /* A real easter egg (not the DBZ fact or the heading swap) gets a soft gold ring. */
  .stat-moment-box.egg{ border-color: rgba(212,180,106,0.5); }
  .stat-moment-text{ font-size: 1rem; font-weight: 600; line-height: 1.4; text-align: left; }
  .stat-moment-text b{ font-family: var(--scoreboard); color: var(--gold); font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat-moment-fine{ display: block; font-size: 0.62rem; font-weight: 400; color: var(--text-dim); margin-top: 4px; }
  .stat-moment-attrib{ display: block; font-size: 0.8rem; font-weight: 500; color: var(--text-dim); margin-top: 10px; }

  /* ---------- Current Parlay highlight ----------
     Sits left of League Lore, in the row this shares with it. Reuses the
     parlay page's own visual language (the leg card, the live dot) at a
     condensed, non-interactive size -- so clicking through to the full
     parlay page reads as a zoom-in, not a jump to a different design. */
  .lore-row{ margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: stretch; }
  @media (max-width: 700px){ .lore-row{ grid-template-columns: 1fr; } }
  /* No current-week parlay data (off-season, nothing picked yet) collapses
     back to one column instead of stranding League Lore next to a gap. */
  .lore-row:has(#parlay-highlight-container:empty){ grid-template-columns: 1fr; }
  #parlay-highlight-container:empty{ display: none; }

  .parlay-highlight{
    height: 100%;
    background: linear-gradient(165deg, var(--surface-2), var(--surface));
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px 18px;
    cursor: pointer;
    transition: border-color 0.15s;
    display: flex;
    flex-direction: column;
  }
  .parlay-highlight:hover{ border-color: rgba(255,255,255,0.18); }
  .ph-head{ display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
  .ph-title{ font-weight: 700; font-size: 0.92rem; }

  .ph-leg{ background: var(--item); border: 1px solid var(--item-line); border-radius: 10px; padding: 12px 14px 11px; }
  /* A live leg's current trend tints it the same win/outline-tint way a
     decided one does on the parlay page itself (.leg.live-up/.live-down) --
     it's reporting where the leg stands right now, not a final result. */
  .ph-leg.trend-up{ border-color: var(--win-line); background: var(--win-tint); }
  .ph-leg.trend-down{ border-color: var(--loss-line); background: var(--loss-tint); }
  .ph-leg-top{ display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .ph-leg-name{ font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ph-leg-bet{ color: var(--text-dim); font-size: 0.86rem; margin-top: 4px; line-height: 1.35; }
  .ph-leg-result{ font-family: var(--scoreboard); font-weight: 700; font-size: 0.86rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-dim); white-space: nowrap; flex-shrink: 0; }
  .ph-leg-result.turf{ color: var(--turf); }
  .ph-leg-result.loss{ color: var(--loss); }
  /* Graded-week recap: one sentence (who failed their leg, what it cost)
     at the top, Sacko/killer as a centered label/value footer at the bottom. The wrap grows like the
     stats row did (flex: 1); the hidden spacer inside is a real leg box +
     stats row, so the card is exactly as tall as before, and the recap box
     is laid over all of it. Text styled like League Lore's beside it. */
  .ph-recap-wrap{ position: relative; flex: 1; display: flex; flex-direction: column; }
  .ph-recap-spacer{ visibility: hidden; flex: 1; display: flex; flex-direction: column; }
  .ph-leg.ph-recap{ position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; padding: 10px 14px; overflow: hidden; }
  .ph-recap-text{ font-size: 1rem; font-weight: 600; line-height: 1.4; }
  .ph-recap-text b{ font-weight: 800; }
  .ph-recap-text b.gold{ font-family: var(--scoreboard); color: var(--gold); font-weight: 800; font-variant-numeric: tabular-nums; }
  .ph-recap-foot{ display: flex; justify-content: center; gap: 26px; padding-top: 7px; border-top: 1px solid var(--line); }
  .ph-recap-foot div{ display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .ph-recap-foot span{ font-size: 0.6rem; color: var(--text-dim); letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; }
  .ph-recap-foot b{ font-size: 0.86rem; font-weight: 700; color: var(--loss); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ph-kickoff{ color: var(--text-dim); font-size: 0.78rem; white-space: nowrap; flex-shrink: 0; }

  /* The live dot is always red -- same as the parlay page's own
     .leg-stats .live-wrap. It marks "in progress", a separate signal from
     who's currently ahead, so it doesn't turn green just because the leg
     reads as a win right now. Only the text beside it takes that tone. */
  .ph-live{ display: inline-flex; align-items: center; gap: 5px; font-family: var(--scoreboard); font-weight: 700; font-size: 0.86rem; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--loss); flex-shrink: 0; }
  .ph-live.turf{ color: var(--turf); }
  .ph-live .dot{ width: 6px; height: 6px; border-radius: 50%; background: var(--loss); flex-shrink: 0; animation: pulse 1.5s ease-in-out infinite; }

  /* margin-top: auto (not a fixed value) pins this row to the card's bottom
     edge -- once .parlay-highlight is stretched to match League Lore's
     height, the gap opens up above the stats instead of leaving them
     stranded mid-card with dead space underneath. */
  .ph-stats{ display: flex; justify-content: space-between; gap: 10px; margin: auto 54px 0; padding-top: 12px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .ph-stat{ text-align: center; }
  .ph-stat b{ display: block; font-family: var(--scoreboard); font-size: 1.05rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--gold); }
  .ph-stat b.loss{ color: var(--loss); }
  .ph-stat span{ font-size: 0.6rem; color: var(--text-dim); letter-spacing: 0.04em; text-transform: uppercase; }

  /* ---------- Superlatives ---------- */
  .accolades-grid{ display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px){ .accolades-grid{ grid-template-columns: 1fr; } }

  /* Matches Current Parlay / League Lore's own composition: title top-left
     (white, same weight/size as their titles) with a status chip top-right,
     then a bordered item box standing in for their featured-leg box --
     manager + score on one line, team + the week/qualifier on the next. No
     ambient wash; gold is spent in exactly one place, the score itself. */
  .accolade-card{
    background: linear-gradient(165deg, var(--surface-raised), var(--surface));
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    height: 100%;
  }
  .acc-head{ display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .acc-title{ font-weight: 700; font-size: 0.92rem; }
  .acc-box{ background: var(--item); border: 1px solid var(--item-line); border-radius: 10px; padding: 12px 14px 11px; }
  .acc-box-row{ display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .acc-box-row + .acc-box-row{ margin-top: 4px; }
  .acc-manager{ font-weight: 700; font-size: 0.92rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acc-score{ font-family: var(--scoreboard); font-weight: 800; font-size: 1.4rem; color: var(--gold); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .acc-team{ font-weight: 600; font-size: 0.86rem; color: var(--text-dim); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acc-qualifier{ font-size: 0.86rem; color: var(--text-dim); text-align: right; white-space: nowrap; }
  .acc-placeholder{ color: var(--text-dim); font-size: 0.85rem; }
  .badge.dim{ color: var(--text-dim); border-color: var(--line); }

  /* Superlatives view toggle + race rows */
  /* Selector styling lives in theme.css -- only this page's spacing here. */
  .sup-seg{ margin-bottom: 14px; }
  .standings-card{ margin-top: 14px; }
  .standings-title{ padding: 16px 18px 0; font-weight: 700; font-size: 0.95rem; color: #fff; text-shadow: 0 0 14px rgba(255,255,255,0.45); }
  .sup-note{ position: relative; padding-top: 12px; border-top: 1px solid var(--line); color: var(--text-dim); font-size: 0.78rem; line-height: 1.5; }
  /* ---------- Comparison rows: real position on a shared axis instead of a
     label/value table. Each row plots one or two markers along a 0-100%
     scale (set per-card by cmpScale) so the gap between teams, and between
     a team and the season-high reference line, is an actual spatial
     distance — not a proportional fill bar. ---------- */
  .cmp-wrap{ position: relative; text-align: left; }
  .cmp-head{ display: flex; justify-content: space-between; color: var(--text-dim); font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.05em; padding-bottom: 8px; margin-bottom: 2px; border-bottom: 1px solid var(--line); }
  .cmp-row{ display: grid; grid-template-columns: minmax(0,72px) 1fr auto; align-items: center; gap: 10px; padding: 11px 0; }
  .cmp-row + .cmp-row{ border-top: 1px solid var(--line); }
  .cmp-name{ font-size: 0.78rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cmp-track{ position: relative; height: 10px; }
  .cmp-track::before{ content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--line); }
  .cmp-link{ position: absolute; top: 50%; height: 2px; transform: translateY(-50%); background: var(--line); border-radius: 2px; }
  .cmp-link.on{ background: rgba(212,180,106,0.45); }
  .cmp-dot{ position: absolute; top: 50%; width: 7px; height: 7px; border-radius: 50%; transform: translate(-50%,-50%); background: var(--surface); border: 2px solid var(--text-dim); }
  .cmp-dot.now{ background: var(--text-dim); border-color: var(--text-dim); }
  .cmp-dot.on{ background: var(--gold); border-color: var(--gold); box-shadow: 0 0 8px rgba(212,180,106,0.55); }
  .cmp-ref{ position: absolute; top: -3px; bottom: -3px; width: 0; border-left: 1px dashed var(--gold-dim); transform: translateX(-50%); }
  .cmp-ref-label{ position: absolute; top: -15px; transform: translateX(-50%); font-size: 0.56rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--gold-dim); white-space: nowrap; }
  .cmp-val{ font-family: var(--scoreboard); font-weight: 700; font-size: 0.92rem; text-align: right; font-variant-numeric: tabular-nums; min-width: 50px; color: var(--text-dim); }
  .cmp-val.on{ color: var(--gold); }
  .cmp-delta{ font-size: 0.64rem; color: var(--text-dim); font-variant-numeric: tabular-nums; margin-top: 1px; text-align: right; }
  @media (max-width: 480px){
    /* Padding only -- the height comes from --ctl-h, so a shorthand here
       would fight the track's derived radius. */
    .sup-seg button{ padding: 0 10px; font-size: 0.74rem; }
    .cmp-row{ grid-template-columns: minmax(0,58px) 1fr auto; gap: 6px; padding: 9px 0; }
    .cmp-name{ font-size: 0.72rem; }
  }

  /* Collapsible tray (Site Activity), closed until opened. The tray itself is
     styled in theme.css, shared with Parlay Results' Jon's Table -- only the
     tabular figures this one puts in its summary line, and its own body
     spacing, are page-specific. */
  .tray-summary{ font-variant-numeric: tabular-nums; }
  .tray > #activity-container{ margin-top: 16px; }

  /* Site activity */
  .act-tiles{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
  .act-tile{ background: linear-gradient(165deg, var(--surface-2), var(--surface)); border: 1px solid var(--line); border-radius: 10px; padding: 16px 12px; text-align: center; }
  .act-label{ color: var(--text-dim); font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .act-value{ font-family: var(--scoreboard); font-weight: 800; font-size: 2.4rem; line-height: 1.1; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .act-sub{ color: var(--text-dim); font-size: 0.72rem; margin-top: 2px; }
  .act-panels{ display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px){ .act-panels{ grid-template-columns: 1fr; } }
  .act-card{ background: linear-gradient(165deg, var(--surface-2), var(--surface)); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px 8px; }
  .act-card-title{ font-weight: 700; font-size: 0.95rem; margin-bottom: 6px; }
  .act-row{ display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 14px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
  .act-row.head{ border-top: none; color: var(--text-dim); font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 2px 0 4px; }
  .act-row .r{ text-align: right; min-width: 54px; }
  .act-row .n{ font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .act-row b{ font-family: var(--scoreboard); font-size: 1.05rem; font-weight: 700; }

  /* ---------- Small-phone tightening (must stay last: overrides base rules above) ---------- */
  @media (max-width: 480px){
    .median-card{ padding: 16px; }
    .card-body{ gap: 8px; }
    .spread-col{ width: 84px; }
    .lb-stat{ width: 34px; }
    .lb-stat .v{ font-size: 0.82rem; }
    .lb-stat .l{ font-size: 0.52rem; }
    /* The desktop inset that pulls the four stats together leaves too
       little width on a phone -- Payout wrapped onto a second line. */
    .ph-stats{ margin: auto 0 0; }
  }
</style>
</head>
<body>
  <div id="site-nav"></div>
  <div class="wrap">
    <header>
      <div class="header-row">
        <div>
          <div class="eyebrow">Retirement League</div>
          <h1 id="week-header">Live Dashboard</h1>
        </div>
        <div class="updated-block">
          <div class="updated-label">Updated</div>
          <div class="updated-value" id="updated-at">—</div>
        </div>
      </div>
    </header>

    <section>
      <div id="median-container">
        <div class="loading-row">Loading median splits…</div>
      </div>
      <div class="lore-row">
        <div id="parlay-highlight-container"></div>
        <div id="stat-of-moment-container"></div>
      </div>
    </section>

    <section>
      <h2>This week's matchups</h2>
      <div class="matchups" id="matchups-container">
        <div class="loading-row">Loading matchups…</div>
      </div>
    </section>

    <!-- hidden until loadDashboard's first render, same as Current Parlay and
         League Lore: without it the standings card and accolade
         placeholders drew on their own while the rest of the page was still
         loading, instead of appearing in step with it. -->
    <section id="season-section" hidden>
      <!-- Superlatives and standings answer the same question ("where does
           the season stand, counting this week as of X?"), so they share one
           heading and one Through / live / projected toggle. There are no
           separate "Superlatives" / "Current Standings" headings: the cards
           carry their own titles, and the standings panel has its own. -->
      <h2>Season So Far</h2>
      <div id="season-toggle"></div>
      <div class="accolades-grid" id="accolades-container">
        <div class="loading-row">Loading accolades…</div>
      </div>
      <!-- Rows sit inside one glass panel rather than straight on the page
           background, so they have an edge to line up against -- same
           treatment the Standings page uses. -->
      <div class="glass standings-card">
        <div class="standings-title">Standings</div>
        <div class="panel-body leaderboard" id="leaderboard-container">
          <div class="loading-row">Loading standings…</div>
        </div>
      </div>
    </section>

    <section id="activity-section" hidden>
      <details class="tray">
        <summary>
          <span class="tray-title">Site Activity</span>
          <span class="tray-summary" id="activity-summary"></span>
          <span class="tray-chevron" aria-hidden="true"></span>
        </summary>
        <div id="activity-container"></div>
      </details>
    </section>

    <footer>Auto-refreshes every two minutes · Data via ESPN Fantasy</footer>
  </div>

<script src="nav.js?v=2"></script>
<script>
  // This Worker fetches ESPN directly and caches the computed result in KV
  // (see the retirement-league-refresh-proxy repo/src/index.js) — no more
  // Google Sheet or GitHub Action in the loop for this page. A GET here
  // either returns data cached within the last 2 minutes instantly, or
  // fetches fresh from ESPN, caches it, and returns that.
  const WORKER_URL = 'https://retirement-league-refresh-proxy.bradbutcher321.workers.dev';

  function fmtScore(n) {
    const num = parseFloat(n);
    return isNaN(num) ? n : num.toFixed(2);
  }
  function fmtMoney(n) {
    if (n === null || n === undefined) return '—';
    return '$' + Number(n).toLocaleString(undefined, { maximumFractionDigits: 0 });
  }
  function fmtOdds(o) {
    if (o === null || o === undefined) return '—';
    const n = Math.round(o);
    return (n > 0 ? '+' : '') + n.toLocaleString();
  }
  const PARLAY_DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  function fmtKickoff(iso) {
    if (!iso) return 'TBD';
    const d = new Date(iso);
    const h = d.getHours();
    const mins = String(d.getMinutes()).padStart(2, '0');
    return `${PARLAY_DAYS[d.getDay()]} ${h % 12 || 12}:${mins}${h < 12 ? 'AM' : 'PM'}`;
  }

  // Which matchups are currently expanded, keyed by team-name pair rather
  // than array index so expansion survives the list re-sorting finals to
  // the bottom, or the whole innerHTML being rebuilt on the next poll.
  const expandedMatchups = new Set();
  const matchupKey = (m) => `${m.awayName}::${m.homeName}`;

  // Four states a starter's real NFL game can be in: hasn't kicked off
  // yet, in progress, in progress AND their team has the ball (the single
  // highest-attention moment), or over. Drives the roster cell's outline
  // and the card's starter pips via .mu-pc.* / .mu-pip.* -- colors live in CSS.
  function playerState(p) {
    if (!p || !p.game) return null;
    if (p.game.state === 'pre') return 'pre';
    if (p.game.state === 'post') return 'final';
    return p.game.hasPossession ? 'possession' : 'live';
  }

  // "J. Allen" -- the roster is two players to a row on a 430px phone, so
  // full first names clipped constantly. A D/ST's name ("Bears D/ST") is
  // left whole: its first word is the only part that identifies it.
  function shortName(p) {
    const parts = (p.name || '').split(' ');
    if (parts.length < 2 || p.slot === 'D/ST' || /D\/ST/.test(p.name)) return p.name || '';
    return `${parts[0][0]}. ${parts.slice(1).join(' ')}`;
  }

  // mu-n is shown on a narrow (phone) card, mu-w on a wide (desktop) one.
  function playerGameLine(p, state) {
    const g = p.game;
    if (!g) return '';
    if (state === 'pre') {
      const kickoff = g.date ? new Date(g.date) : null;
      if (!kickoff) return `vs ${g.opponent}`;
      const day = kickoff.toLocaleDateString([], { weekday: 'short' });
      const time = kickoff.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      return `vs ${g.opponent} · ${day} <span class="mu-n">${time.replace(/\s?PM$/i, '')}</span><span class="mu-w">${time}</span>`;
    }
    const score = `${g.teamScore}–${g.opponentScore}`;
    if (state === 'final') return `Final · ${score}<span class="mu-w"> vs ${g.opponent}</span>`;
    const period = g.period > 4 ? 'OT' : `Q${g.period}`;
    const mark = state === 'possession' ? '<span class="ball"></span>' : '<span class="ldot"></span>';
    return `${mark}<span class="clk">${period} ${g.clock}</span> · ${score}<span class="mu-w"> vs ${g.opponent}</span>`;
  }

  function renderPlayerCell(p, side, state) {
    if (!p) return `<div class="mu-pc ${side}"></div>`;
    const hasLiveScore = p.livePoints !== null && p.livePoints !== undefined;
    const teamTag = p.game && p.game.team ? `<span class="team-tag">${p.game.team}</span>` : '';
    // Once the game is over the pre-game projection stops being the useful
    // number — how far the player beat or missed it is. ESPN keeps serving
    // the original projection after the final whistle, so this delta stays
    // meaningful rather than collapsing to zero.
    const delta = state === 'final' && hasLiveScore && p.projectedPoints !== null && p.projectedPoints !== undefined
      ? p.livePoints - p.projectedPoints
      : null;
    const scoreSub = delta === null
      ? `<div class="mu-sub">${fmtScore(p.projectedPoints)}</div>`
      : `<div class="mu-sub ${delta > 0.05 ? 'up' : delta < -0.05 ? 'down' : ''}" title="Projected ${fmtScore(p.projectedPoints)}">${delta >= 0 ? '▲' : '▼'} ${fmtScore(Math.abs(delta))}</div>`;
    return `
      <div class="mu-pc ${side} ${state || ''}">
        <div class="mu-pinfo">
          <div class="player-name"><span class="name-text">${shortName(p)}</span>${teamTag}</div>
          <div class="mu-gline">${playerGameLine(p, state)}</div>
          ${p.statLine ? `<div class="mu-sline">${p.statLine}</div>` : ''}
        </div>
        <div class="mu-pscore">
          <div class="mu-pts ${hasLiveScore ? '' : 'none'}">${hasLiveScore ? fmtScore(p.livePoints) : '–'}</div>
          ${scoreSub}
        </div>
      </div>`;
  }

  function renderMatchupDetails(m) {
    const awayPlayers = m.awayPlayers || [];
    const homePlayers = m.homePlayers || [];
    const rowCount = Math.max(awayPlayers.length, homePlayers.length);
    const rows = [];
    for (let i = 0; i < rowCount; i++) {
      const a = awayPlayers[i];
      const h = homePlayers[i];
      rows.push(`
        <div class="mu-row">
          ${renderPlayerCell(a, 'away', playerState(a))}
          <span class="mu-slot">${(a && a.slot) || (h && h.slot) || ''}</span>
          ${renderPlayerCell(h, 'home', playerState(h))}
        </div>`);
    }
    return `<div class="matchup-details">${rows.join('')}</div>`;
  }

  // A matchup is decided (FINAL, sinks to the bottom) once nobody is left to
  // play on either side, or once a team with no players left is already behind
  // its opponent's current score: the opponent's score can only go up, so the
  // finished team can't catch back up. The second case needs the NFL game
  // states to be readable; otherwise a team with "0 left" might just be missing data.
  function matchupDecided(m) {
    const hIn = parseInt(m.homeInPlay, 10) || 0, aIn = parseInt(m.awayInPlay, 10) || 0;
    const hRem = parseInt(m.homeRemaining, 10) || 0, aRem = parseInt(m.awayRemaining, 10) || 0;
    if (hIn + aIn + hRem + aRem === 0) return true;
    if (!medianStatusKnown) return false;
    const hs = parseFloat(m.homeScore), as = parseFloat(m.awayScore);
    return (hIn + hRem === 0 && hs < as) || (aIn + aRem === 0 && as < hs);
  }

  function renderMatchupCard(m) {
    const awayScore = parseFloat(m.awayScore) || 0;
    const homeScore = parseFloat(m.homeScore) || 0;
    const homeInPlay = parseInt(m.homeInPlay, 10) || 0;
    const awayInPlay = parseInt(m.awayInPlay, 10) || 0;
    const homeRemaining = parseInt(m.homeRemaining, 10) || 0;
    const awayRemaining = parseInt(m.awayRemaining, 10) || 0;
    const isFinal = matchupDecided(m);
    const isLive = !isFinal && homeInPlay + awayInPlay > 0;

    // Live, the trailing score steps back; decided, the winner goes gold.
    const scoreClass = (mine, theirs) => isFinal
      ? (mine > theirs ? 'won' : mine < theirs ? 'lost' : '')
      : (mine < theirs ? 'trail' : '');

    const metaParts = (manager, record, streak) => [
      manager ? `<span>${manager}</span>` : '',
      record ? `<span>${record}</span>` : '',
      streak ? `<span class="mu-stk ${streak[0] === 'W' ? 'win' : 'loss'}">${streak}</span>` : '',
    ].filter(Boolean);

    // Once decided, the live projection has nothing left to say, so its line
    // reports how the team did against its starters' pregame projection
    // instead (ESPN's per-player projection, which stays put after kickoff,
    // summed). The line is always rendered -- even blank, if there are no
    // projections to sum -- so a decided card keeps a live card's height.
    const vsProj = (players, score) => {
      const proj = players.reduce((sum, p) => sum + (p.projectedPoints || 0), 0);
      if (!proj) return '<div class="mu-proj">&nbsp;</div>';
      const diff = Math.round((score - proj) * 100) / 100;
      const tone = diff > 0 ? 'up' : diff < 0 ? 'down' : '';
      const arrow = diff ? `<svg class="mu-arrow" viewBox="0 0 10 8" aria-hidden="true"><path d="${diff > 0 ? 'M5 0L10 8H0Z' : 'M0 0H10L5 8Z'}" fill="currentColor"/></svg>` : '';
      return `<div class="mu-proj vs ${tone}" title="Projected ${fmtScore(proj)} before kickoff">${arrow}${fmtScore(Math.abs(diff))} <span>vs proj</span></div>`;
    };

    const side = (cls, name, meta, score, theirScore, projected, players) => `
      <div class="mu-side ${cls}">
        <div class="team-name">${name}</div>
        <div class="mu-meta">${meta.join(' · ')}</div>
        <div class="mu-score ${scoreClass(score, theirScore)}">${fmtScore(score)}</div>
        ${isFinal ? vsProj(players, score) : `<div class="mu-proj">proj ${fmtScore(projected)}</div>`}
      </div>`;

    // Win-odds meter while undecided; once decided, the winning margin.
    const awayWP = typeof m.awayWinProbability === 'number' ? m.awayWinProbability
      : typeof m.homeWinProbability === 'number' ? 100 - m.homeWinProbability : null;
    let oddsRow = '';
    if (isFinal) {
      const winner = awayScore > homeScore ? m.awayName : homeScore > awayScore ? m.homeName : null;
      oddsRow = winner ? `<div class="mu-margin">${winner} by ${fmtScore(Math.abs(awayScore - homeScore))}</div>` : '';
    } else if (awayWP !== null) {
      const a = Math.max(1, Math.min(99, Math.round(awayWP)));
      const h = 100 - a;
      const awayFav = a >= 50;
      oddsRow = `
        <div class="mu-odds">
          <span class="${awayFav ? 'fav' : ''}">${a}%</span>
          <div class="mu-bar" role="img" aria-label="Win odds ${a}% to ${h}%"><span class="${awayFav ? 'fav' : ''}" style="flex-grow:${a}"></span><span class="${awayFav ? '' : 'fav'}" style="flex-grow:${h}"></span></div>
          <span class="${awayFav ? '' : 'fav'}">${h}%</span>
        </div>`;
    }

    const pips = (players, inPlay, remaining, cls) => {
      const bits = [];
      if (inPlay) bits.push(`<span class="n-live">${inPlay} live</span>`);
      if (remaining) bits.push(`${remaining} to play`);
      return `
        <div class="mu-pips-wrap ${cls}">
          <div class="mu-pips">${players.map(p => {
            const st = playerState(p);
            return `<span class="mu-pip ${st && st !== 'pre' ? st : ''}"></span>`;
          }).join('')}</div>
          ${bits.length ? `<span class="mu-pip-text">${bits.join(' · ')}</span>` : ''}
        </div>`;
    };

    const chev = '<span class="mu-chev" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 14 14" fill="none"><path d="M3 5l4 4 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
    const status = isFinal ? `<span class="mu-status final">Final${chev}</span>`
      : isLive ? `<span class="mu-status live"><span class="pulse-dot"></span>Live${chev}</span>`
      : `<span class="mu-status">VS${chev}</span>`;

    const key = matchupKey(m);
    const expanded = expandedMatchups.has(key);

    return `
      <div class="matchup-card ${expanded ? 'expanded' : ''}" data-key="${encodeURIComponent(key)}">
        <div class="mu-head">
          ${side('away', m.awayName, metaParts(m.awayManager, m.awayRecord, m.awayStreak), awayScore, homeScore, m.awayProjected, m.awayPlayers || [])}
          ${side('home', m.homeName, metaParts(m.homeManager, m.homeRecord, m.homeStreak).reverse(), homeScore, awayScore, m.homeProjected, m.homePlayers || [])}
        </div>
        ${oddsRow}
        <div class="mu-foot">
          ${pips(m.awayPlayers || [], awayInPlay, awayRemaining, 'away')}
          ${status}
          ${pips(m.homePlayers || [], homeInPlay, homeRemaining, 'home')}
        </div>
        ${renderMatchupDetails(m)}
      </div>`;
  }
  function medianTeamName(t) { return t.manager || t.name; }

  // The lines under each score, as separate facts rather than one slot that
  // can only hold one of them:
  //   - how many of this team's starters are in play right now and how many
  //     haven't kicked off yet;
  //   - whether the result is already locked (can't change) or the team is
  //     done for the week.
  // These used to share a single line, with locked/final taking priority, so
  // a locked team stopped reporting its remaining players entirely -- and got
  // them back as soon as the lock lifted (the lock line rises as more teams
  // finish, so a team can come back out of it on any refresh). That read as
  // the count randomly disappearing and reappearing between refreshes. They
  // are independent facts, so they get independent lines: a team locked above
  // with five still to play is both of those things at once.
  // Everything stays blank when the NFL game state couldn't be read, so
  // nobody is wrongly shown as finished.
  function miniStatusLines(t) {
    if (!t.statusKnown) return [];
    const lines = [];
    const players = [];
    if (t.inPlay) players.push(`${t.inPlay} live`);
    if (t.remaining) players.push(`${t.remaining} to play`);
    if (players.length) lines.push({ parts: players, cls: t.inPlay ? 'live' : '' });
    // A done team has no players line (nothing left to count), so "Final"
    // lands on the first line and that card doesn't grow a second one.
    if (t.locked) lines.push({ text: `Locked ${t.lockedAbove ? 'above' : 'below'}`, cls: 'locked' });
    else if (t.done) lines.push({ text: 'Final', cls: 'final' });
    return lines;
  }

  // How far a team sits above or below the median, signed, e.g. "+12.02" /
  // "−0.97" (a real minus sign, so it lines up with the plus).
  function fmtMwMargin(v) { return (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(2); }

  function mwCardHtml(t, tone, median) {
    const lines = miniStatusLines(t);
    // One line per fact group, never wrapped. No live dot here -- the spread
    // chart beside the cards already marks who's live.
    const statHtml = l => {
      const parts = l.parts || [l.text];
      const lead = l.cls === 'locked' ? '\u2713 ' : '';
      return `<div class="mw-stat ${l.cls}">${lead}${parts.map((x, i) => `${i ? '<span class="sep">\u00b7</span>' : ''}<span>${x}</span>`).join('')}</div>`;
    };
    // A card with anyone still to play opens them (see "players still to come" below).
    const can = t.statusKnown && (t.inPlay + t.remaining) > 0;
    const canAttrs = can ? ' role="button" tabindex="0" aria-haspopup="dialog" aria-expanded="false"' : '';
    return `<div class="mb-card${lines.some(l => l.cls === 'locked') ? ' locked' + (t.lockedBelow ? ' locked-below' : '') : ''}${can ? ' can' : ''}" data-name="${t.name}"${canAttrs}>
      <div class="mw-top">
        <span class="mw-name">${t.name}</span>
        <div class="mw-score" style="color:var(--${tone});">${fmtScore(t.score)}</div>
      </div>
      <div class="mw-bot">
        <div class="mw-margin" style="color:var(--${tone});">${fmtMwMargin(t.score - median)}</div>
        <div class="mw-stats">${lines.map(statHtml).join('')}</div>
      </div>
    </div>`;
  }

  function mwGridHtml(list, tone, median) {
    return `<div class="mw-grid">${list.map(t => mwCardHtml(t, tone, median)).join('')}</div>`;
  }

  // ---------- Median Watch: a manager's players still to come ----------
  // Tapping a card with players left lists them: a bottom sheet on a phone,
  // a popover under the card on desktop -- the same two surfaces, and the
  // same 720px switch, the Game Records page uses for its top 10s (theme.css
  // "Detail panels"). Neither moves a card. The open panel is rebuilt on
  // every refresh, so its scores stay live, and it closes itself once that
  // manager has nobody left to play.
  const mwOneColumn = matchMedia('(max-width:720px)');
  let mwOpen = null;

  const mwCardEl = name => document.querySelector(`#median-container .mb-card[data-name="${CSS.escape(name)}"]`);
  const mwStillToCome = p => ['pre', 'live', 'possession'].includes(playerState(p));

  function mwPlayersLeft(name) {
    const t = (lastMedianTeams || []).find(x => medianTeamName(x) === name);
    if (!t || !lastMedianData) return null;
    const m = (lastMedianData.matchups || []).find(x => x.awayName === t.name || x.homeName === t.name);
    const players = m ? (m.awayName === t.name ? m.awayPlayers : m.homePlayers) || [] : [];
    return { t, players: players.filter(mwStillToCome) };
  }

  // One player: game clock (or kickoff), his NFL game's score, his points so
  // far, his pregame projection, and his stat line. Points stay white -- a
  // player beating his projection mid-game isn't a result yet.
  function mwPodHtml(p) {
    const g = p.game || {};
    const live = playerState(p) !== 'pre';
    const status = live ? `<i class="ld"></i>${g.period > 4 ? 'OT' : `Q${g.period}`} ${g.clock}` : fmtKickoff(g.date);
    const game = live ? `${g.team} ${g.teamScore}–${g.opponentScore} ${g.opponent}` : `${g.team} vs ${g.opponent}`;
    const has = live && p.livePoints !== null && p.livePoints !== undefined;
    return `<div class="mwp-pod">
      <div class="mwp-pod-top"><span class="mwp-st${live ? ' live' : ''}">${status}</span><span class="mwp-game">${game}</span></div>
      <div class="mwp-pts${has ? '' : ' none'}">${has ? fmtScore(p.livePoints) : '—'}</div>
      <div class="mwp-proj">proj ${fmtScore(p.projectedPoints)}</div>
      <div class="mwp-nm">${p.name}<span>${p.slot || ''}</span></div>
      <div class="mwp-sline">${p.statLine || ''}</div>
    </div>`;
  }

  // The one number the card itself doesn't show: the other mode's total.
  const mwOtherTotal = t => medianViewMode === 'current'
    ? `proj<b>${fmtScore(t.projected)}</b>` : `now<b>${fmtScore(t.current)}</b>`;

  // Phone only: the sheet covers the card, so it repeats the manager,
  // scored the way their card is right now (Current or Projected).
  function mwHeadHtml(t, name) {
    const mode = medianViewMode;
    const median = mode === 'current' ? lastMedianData.currentMedian : lastMedianData.projectedMedian;
    const card = mwCardEl(name);
    const tone = card && card.closest('#median-below') ? 'loss' : 'turf';
    return `<div class="mwp-head">
      <div style="min-width:0"><div class="mwp-name">${name}</div>
        <div class="mwp-sub"><span style="color:var(--${tone})">${fmtMwMargin(t[mode] - median)}</span> vs median · ${mwOtherTotal(t)}</div></div>
      <div class="mwp-score" style="color:var(--${tone})">${fmtScore(t[mode])}</div>
    </div>`;
  }

  function mwShow(name, animate) {
    const info = mwPlayersLeft(name);
    if (!info || !info.players.length || !mwCardEl(name)) { mwHide(); return; }
    mwOpen = name;
    mwMark();
    const count = info.players.length;
    const label = `${name}: ${count} still to play`;
    const pods = `<div class="mwp-pods">${info.players.map(mwPodHtml).join('')}</div>`;

    // Desktop: the popover sits right under its card, so it doesn't repeat
    // the name, score or margin -- one line, then the players.
    if (!mwOneColumn.matches) {
      let pop = document.getElementById('mw-pop');
      if (!pop) {
        document.body.insertAdjacentHTML('beforeend', '<div class="pop" id="mw-pop" role="dialog"></div>');
        pop = document.getElementById('mw-pop');
      }
      pop.setAttribute('aria-label', label);
      pop.innerHTML = `<div class="mwp-line"><span class="mwp-label">${count} still to play</span>
        <span class="mwp-line-r"><span>${mwOtherTotal(info.t)}</span><button type="button" class="x" data-mw-close aria-label="Close">&times;</button></span></div>${pods}`;
      mwPlacePop();
      return;
    }
    const list = `<div class="mwp-label">${count} still to play</div>${pods}`;

    // Phone: the sheet steps through managers itself, in card order.
    const order = [...document.querySelectorAll('#median-container .mb-card.can')].map(c => c.dataset.name);
    const i = order.indexOf(name), prev = order[i - 1], next = order[i + 1];
    const nav = `<div class="mwp-nav">
      <button type="button" class="${prev ? '' : 'gone'}" data-mw-go="${prev || ''}">‹ ${prev || ''}</button>
      <button type="button" class="${next ? '' : 'gone'}" data-mw-go="${next || ''}">${next || ''} ›</button></div>`;
    let sheet = document.getElementById('mw-sheet');
    if (!sheet) {
      const still = animate ? '' : ' style="animation:none"';
      document.body.insertAdjacentHTML('beforeend', `<div class="scrim" id="mw-scrim" data-mw-close${still}></div>
        <div class="sheet" id="mw-sheet" role="dialog" aria-modal="true"${still}>
          <div class="sheet-grab" data-grab><span></span><button type="button" class="mwp-done" data-mw-close>Done</button></div>
          <div class="sheet-head" data-grab data-head></div>
          <div class="sheet-body" data-body></div></div>`);
      sheet = document.getElementById('mw-sheet');
      mwWireSwipe(sheet);
    }
    sheet.setAttribute('aria-label', label);
    sheet.querySelector('[data-head]').innerHTML = mwHeadHtml(info.t, name);
    const body = sheet.querySelector('[data-body]');
    const keepScroll = sheet.dataset.name === name ? body.scrollTop : 0;
    body.innerHTML = list + nav;
    body.scrollTop = keepScroll;
    sheet.dataset.name = name;
  }

  function mwHide() {
    mwOpen = null;
    mwMark();
    ['mw-pop', 'mw-sheet', 'mw-scrim'].forEach(id => { const el = document.getElementById(id); if (el) el.remove(); });
  }

  // The open card wears the gold outline on desktop, where it stays visible
  // beside its popover; on a phone the sheet covers it anyway.
  function mwMark() {
    document.querySelectorAll('#median-container .mb-card.can').forEach(c => {
      const on = c.dataset.name === mwOpen;
      c.classList.toggle('sel', on && !mwOneColumn.matches);
      c.setAttribute('aria-expanded', on);
    });
  }

  // Under the card, at least 360px wide and never off the side of the
  // screen, with the arrow on the card's center. Two passes, as on Game
  // Records: placing it can add a scrollbar, which shifts the card.
  function mwPlacePop() {
    const pop = document.getElementById('mw-pop');
    if (!pop) return;
    const card = mwOpen && mwCardEl(mwOpen);
    if (!card) { mwHide(); return; }
    for (let pass = 0; pass < 2; pass++) {
      const r = card.getBoundingClientRect(), vw = document.documentElement.clientWidth;
      const w = Math.min(Math.max(r.width, 360), vw - 24);
      const left = Math.min(Math.max(r.left, 12), vw - w - 12);
      pop.style.width = w + 'px';
      pop.style.left = (left + scrollX) + 'px';
      pop.style.top = (r.bottom + scrollY + 10) + 'px';
      pop.style.setProperty('--arrow-x', (r.left + r.width / 2 - left) + 'px');
    }
  }

  // Drag the sheet down past 90px to dismiss it, like a native sheet.
  function mwWireSwipe(sheet) {
    let y0 = null, dy = 0;
    sheet.querySelectorAll('[data-grab]').forEach(el => {
      el.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; y0 = e.clientY; dy = 0; sheet.style.animation = 'none'; el.setPointerCapture(e.pointerId); });
      el.addEventListener('pointermove', e => { if (y0 === null) return; dy = Math.max(0, e.clientY - y0); sheet.style.transform = `translateY(${dy}px)`; });
      el.addEventListener('pointerup', () => { if (y0 === null) return; y0 = null; if (dy > 90) mwHide(); else sheet.style.transform = ''; });
    });
  }

  // Called after every rebuild of the cards (refresh or Current/Projected).
  // The hint under the title only shows while some card can actually open.
  function mwRefresh() {
    const hint = document.getElementById('mw-hint');
    if (hint) hint.hidden = !document.querySelector('#median-container .mb-card.can');
    if (mwOpen) mwShow(mwOpen, false);
  }

  document.addEventListener('click', e => {
    if (e.target.closest('[data-mw-close]')) { mwHide(); return; }
    const go = e.target.closest('[data-mw-go]');
    if (go) { if (go.dataset.mwGo) mwShow(go.dataset.mwGo, false); return; }
    // Desktop: a click anywhere but the popover or a card closes it.
    if (mwOpen && !mwOneColumn.matches && !e.target.closest('#mw-pop') && !e.target.closest('#median-container .mb-card.can')) mwHide();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && mwOpen) mwHide(); });
  addEventListener('resize', mwPlacePop);
  // Crossing 720px swaps sheet for popover: close whichever was open.
  mwOneColumn.addEventListener('change', mwHide);

  // Whether the Worker could read NFL game states this refresh; without that
  // every team would look finished, so status and locks stay hidden.
  let medianStatusKnown = false;

  const SPREAD_MIN_GAP = 3; // px minimum breathing room between separate rows

  // A name's rendered height doesn't depend on how long it is (one line is
  // one line), so rather than guess at row padding/border/line-height and
  // get it wrong, briefly render one real 1-slot and one real 2-slot row
  // (invisible, off the layout flow) in the actual container and measure
  // them — height of an empty row, and how much each added slot costs.
  function measurePillHeights(container, chipStyle) {
    // Must probe with the SAME classes renderSpreadChart actually renders
    // with -- chipStyle's .slot-chip has its own box-shadow border but no
    // extra padding/gap (kept exactly height-neutral vs. plain .slot on
    // purpose), but probing with the wrong markup would still understate
    // real pill height if that ever changes, and the median tick (placed at
    // a cluster boundary) is computed from this same size.
    const probe = document.createElement('div');
    probe.className = 'name-row' + (chipStyle ? ' plain-wrap' : '');
    probe.style.visibility = 'hidden';
    probe.style.position = 'absolute';
    probe.style.left = '-9999px';
    const slotCls = 'slot' + (chipStyle ? ' slot-chip' : '');
    probe.innerHTML = `<span class="${slotCls}">Xx</span>`;
    container.appendChild(probe);
    const singleHeight = probe.offsetHeight;
    probe.innerHTML = `<span class="${slotCls}">Xx</span><span class="${slotCls}">Xx</span>`;
    const slotHeight = probe.offsetHeight - singleHeight;
    container.removeChild(probe);
    return { singleHeight, slotHeight };
  }

  // Every row (single name or merged) renders at exactly the width of the
  // single longest name among this week's teams — measured for real
  // rather than guessed, so there's no leftover margin around shorter
  // names once that longest one is accounted for.
  function measureMaxRowWidth(container, names, chipStyle) {
    const probe = document.createElement('div');
    probe.className = 'name-row' + (chipStyle ? ' plain-wrap' : '');
    probe.style.visibility = 'hidden';
    probe.style.position = 'absolute';
    probe.style.left = '-9999px';
    container.appendChild(probe);
    const slotCls = 'slot' + (chipStyle ? ' slot-chip' : '');
    let max = 0;
    for (const name of names) {
      probe.innerHTML = `<span class="${slotCls}">${name}</span>`;
      max = Math.max(max, probe.offsetWidth);
    }
    container.removeChild(probe);
    return max;
  }

  // Positions every team by its actual score along one axis (not by rank),
  // merging adjacent teams into a single taller row wherever they'd
  // otherwise visually collide, so distance on the page always means
  // distance in points instead of silently overlapping. Pure 0..plotSize
  // number-line math — used for the vertical axis, with "width" meaning
  // "size along the axis" (height, here) and pos 0 meaning the lowest score.
  function computeSpreadClusters(ascendingTeams, plotSize, singleSize, slotSize) {
    const scores = ascendingTeams.map(t => t.score);
    const min = scores[0];
    const max = scores[scores.length - 1];
    const idealPos = s => (max === min ? plotSize / 2 : ((s - min) / (max - min)) * plotSize);
    const sizeOf = c => singleSize + (c.members.length - 1) * slotSize;

    // Pass 1: greedy merge based on each team's ideal (unclamped) position.
    const clusters = [];
    for (const t of ascendingTeams) {
      const pos = idealPos(t.score);
      const prev = clusters[clusters.length - 1];
      if (prev) {
        const requiredGap = sizeOf(prev) / 2 + singleSize / 2 + SPREAD_MIN_GAP;
        if (pos - prev.pos < requiredGap) {
          prev.members.push(t);
          prev.pos = (prev.pos * (prev.members.length - 1) + pos) / prev.members.length;
          continue;
        }
      }
      clusters.push({ members: [t], pos });
    }

    // A cluster's own half-size can push it past the plot's edge even
    // though its center (pos) is a valid in-range position — e.g. several
    // teams tied at the very lowest score merge into a row centered at
    // pos=0, and the centering transform then hangs half that row off the
    // edge of the card entirely. Clamp the first/last cluster inward by
    // their own half-size before spacing the rest off of them.
    if (clusters.length) {
      const first = clusters[0];
      first.pos = Math.max(first.pos, sizeOf(first) / 2);
    }

    // Pass 2: push clusters apart low-to-high so a merge that grew a row
    // can't then make it overlap its neighbor.
    for (let i = 1; i < clusters.length; i++) {
      const prevC = clusters[i - 1], curC = clusters[i];
      const requiredGap = sizeOf(prevC) / 2 + sizeOf(curC) / 2 + SPREAD_MIN_GAP;
