<!-- The two font-family's woff2 files Google serves for the latin subset
     at the weights this site uses -- one variable-font file per family
     covers every weight declared, confirmed directly by fetching the
     stylesheet below and comparing each @font-face block's url(). Starts
     the actual font downloads immediately, in parallel with that
     stylesheet fetch, instead of waiting to discover these same URLs
     only after the stylesheet loads and is parsed -- avoids the
     fallback-to-webfont swap (FOUT) that otherwise shows on a slow or
     uncached load. If Google ever changes these hashed URLs, this just
     degrades to a wasted (unused) preload, not a correctness issue -- the
     stylesheet's own @font-face still fetches whatever the new URL is. -->
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/bigshouldersdisplay/v24/fC1_PZJEZG-e9gHhdI4-NBbfd2ys3SjJCx1czNDu.woff2">

<style>
  /* Selector styling, the tabs-plus-Year row (.controls-row) and the
     label+control pairing that stops the two splitting across a wrap
     (.selector-group) all live in theme.css. */
  .legend{ display:flex; gap:16px; flex-wrap:wrap; color:var(--text-dim); font-size:0.74rem; padding:18px 24px 0; }
  .legend i{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }

  .qrow .tm{ font-weight:600; font-size:0.9rem; display:flex; align-items:center; gap:6px; min-width:0; }
  .qrow .tm .nm{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .qrow-main{ min-width:0; }
  /* Two badges at once (All-Time view) sit next to the name whenever
     there's room, same as a single badge always does -- only moving to
     the row's right side, above W/L/Win%, once they genuinely don't fit
     (breakpoint tuned to where "Flanders" + both badges stops fitting,
     confirmed directly, not guessed). CSS can't move one element based
     on available space, so both copies render and this toggles which is
     visible. */
  /* .qrow centers every column vertically by default, fine when they're
     all one line tall -- but the name/meta column can run 2-3 lines
     (seasons + PF/PA) while stats-col is only 1-2, and centering each
     independently let the shorter one drift into the taller one's space
     (confirmed directly: real visual overlap between the meta line and
     the W/L/Win% numbers). Top-aligning stats-col keeps it level with
     the name at the top of the row regardless of how tall either gets. */
  .qrow .stats-col{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; align-self:start; }
  .qrow .badge-side{ display:none; flex-direction:row; flex-wrap:wrap; justify-content:flex-end; gap:4px; }
  @media (max-width:580px){
    .qrow .badges-inline.multi{ display:none; }
    .qrow .badge-side{ display:flex; }
    /* At a genuine ~320-375px width there's not enough room for
       full-size badges + W/L/Win% + any sliver of name all at once
       (confirmed directly: real text overlap between the meta line and
       the stats numbers). Shrinking badges specifically in this narrow
       fallback -- never in the normal inline case above the breakpoint,
       which stays full-size -- claws back enough room to actually fit. */
    .qrow .badge-side .badge{ font-size:0.52rem; padding:1px 5px; }
    .qrow .stats{ gap:8px; }
    .qrow .stats div{ min-width:26px; }
  }
  /* "PF x · PA y" is always forced onto its own line after "N seasons"
     (at every width, not just mobile), instead of "seasons · PF" sharing
     a line while "PA" gets stranded below. Within it, PF and PA each stay
     whole, and only when the pair is wider than the column (two-decimal
     all-time totals at 375-390px) does PA drop to its own line. Every
     part carries its own leading " · ", and the row is shifted left by
     that separator's width inside an overflow:hidden segment, so the
     separator of whichever part starts a line is clipped off. */
  .qrow .meta-seg{ white-space:nowrap; display:block; overflow:hidden; }
  .qrow .meta-sep{ display:none; }
  .qrow .pfpa{ display:flex; flex-wrap:wrap; margin-left:-1em; }
  .qrow .pfpa > span::before{ content:'·'; display:inline-block; width:1em; text-align:center; }

  /* Every row opens that manager's Franchise page. */
  a.qrow{ color:inherit; text-decoration:none; }
  a.qrow:focus-visible{ outline:2px solid var(--gold); outline-offset:-2px; }

  /* Current season only: places gained or lost since last week, the same
     pill as the dashboard's Move column. It sits beside the name, where a
     finished season's Champion/Sacko badge goes -- a column of its own
     beside W/L/Win % pushed the stats into the PF/PA line at phone width. */
  .mv{ flex:none; box-sizing:border-box; width:40px; padding:2px 0; border-radius:999px; border:1px solid var(--line); text-align:center;
       color:var(--text-dim); font-style:normal; font-size:0.68rem; font-weight:700; line-height:1.2; white-space:nowrap; }
  .mv.up{ border-color:var(--turf-dim); color:var(--turf); }
  .mv.down{ border-color:rgba(214,98,79,0.4); color:var(--loss); }

  #standings-container{ margin-top:14px; }
  /* Rows sit 6px apart (each .qrow's margin-top); the Playoff line takes
     10px either side of it, counting the next row's own 6px. */
  #standings-container .po-line{ margin:10px 0 4px; }
</style>

<body>

    <section>
      <!-- No section heading: the page title says "Standings", and the tab
           row and Year control below say which ones -- a line reading
           "All-Time Final Standings" only repeated all three. -->

        <div class="selector-group">

        </div>
      </div>
      <div id="standings-container">
        <span class="sr-only">Loading standings…</span>
        <div class="sk-stack" aria-hidden="true"><div class="sk" style="gap:8px"><i style="width:40%;height:16px;margin-bottom:10px"></i><div class="sk-item" style="display:flex;align-items:center;gap:16px;padding:20px 18px"><i style="width:12px;height:22px"></i><div class="sk-col"><i style="width:40%;height:15px"></i><i style="width:62%;height:10px"></i></div><i style="width:118px;height:30px"></i></div><div class="sk-item" style="display:flex;align-items:center;gap:16px;padding:20px 18px"><i style="width:12px;height:22px"></i><div class="sk-col"><i style="width:40%;height:15px"></i><i style="width:62%;height:10px"></i></div><i style="width:118px;height:30px"></i></div><div class="sk-item" style="display:flex;align-items:center;gap:16px;padding:20px 18px"><i style="width:12px;height:22px"></i><div class="sk-col"><i style="width:40%;height:15px"></i><i style="width:62%;height:10px"></i></div><i style="width:118px;height:30px"></i></div><div class="sk-item" style="display:flex;align-items:center;gap:16px;padding:20px 18px"><i style="width:12px;height:22px"></i><div class="sk-col"><i style="width:40%;height:15px"></i><i style="width:62%;height:10px"></i></div><i style="width:118px;height:30px"></i></div><div class="sk-item" style="display:flex;align-items:center;gap:16px;padding:20px 18px"><i style="width:12px;height:22px"></i><div class="sk-col"><i style="width:40%;height:15px"></i><i style="width:62%;height:10px"></i></div><i style="width:118px;height:30px"></i></div><div class="sk-item" style="display:flex;align-items:center;gap:16px;padding:20px 18px"><i style="width:12px;height:22px"></i><div class="sk-col"><i style="width:40%;height:15px"></i><i style="width:62%;height:10px"></i></div><i style="width:118px;height:30px"></i></div><div class="sk-item" style="display:flex;align-items:center;gap:16px;padding:20px 18px"><i style="width:12px;height:22px"></i><div class="sk-col"><i style="width:40%;height:15px"></i><i style="width:62%;height:10px"></i></div><i style="width:118px;height:30px"></i></div><div class="sk-item" style="display:flex;align-items:center;gap:16px;padding:20px 18px"><i style="width:12px;height:22px"></i><div class="sk-col"><i style="width:40%;height:15px"></i><i style="width:62%;height:10px"></i></div><i style="width:118px;height:30px"></i></div><div class="sk-item" style="display:flex;align-items:center;gap:16px;padding:20px 18px"><i style="width:12px;height:22px"></i><div class="sk-col"><i style="width:40%;height:15px"></i><i style="width:62%;height:10px"></i></div><i style="width:118px;height:30px"></i></div></div></div>
      </div>
    </section>

    <footer>Data via ESPN Fantasy</footer>
  </div>

<script src="nav.js?v=3"></script>
<script src="page-common.js?v=14"></script>
<script src="league-common.js?v=3"></script>
<script>
  // esc() is a global from page-common.js, not part of LG.
  const { f2, pct } = LG;
  const TABS = [['reg', 'Regular Season'], ['final', 'Final Standings']];
  let D, tab = 'final';
  const $ = id => document.getElementById(id);
  // No card title: it read "Regular Season" / "Final Standings" directly
  // under the selected tab saying the same thing. The note that used to be
  // the title's hover tooltip now rides on the selected tab instead.

  function build(year, type) {
    const reg = type === 'reg';
    const mk = s => {
      const w = (reg ? s.reg_w : s.tot_w) + s.med_w, l = (reg ? s.reg_l : s.tot_l) + s.med_l;
      return { w, l, pf: reg ? s.reg_pf : s.tot_pf, pa: reg ? s.reg_pa : s.tot_pa };
    };
    if (year === 'all') {
      const by = {};
      D.seasons.forEach(s => {
        const m = mk(s), e = by[s.player] || (by[s.player] = { player: s.player, w: 0, l: 0, pf: 0, pa: 0, seasons: 0, s: { champ: 0, sacko: 0 } });
        e.w += m.w; e.l += m.l; e.pf += m.pf; e.pa += m.pa; e.seasons++; e.s.champ += s.champ; e.s.sacko += s.sacko;
      });
      const rows = Object.values(by).map(e => ({ ...e, pct: e.w + e.l ? e.w / (e.w + e.l) : null }));
      const cur = rows.filter(r => D.active.has(r.player)).sort((a, b) => b.pct - a.pct || b.w - a.w);
      const former = rows.filter(r => !D.active.has(r.player)).sort((a, b) => b.pct - a.pct || b.w - a.w);
      cur.forEach((r, i) => { r.rank = i + 1; });
      former.forEach(r => { r.rank = null; r.former = true; });
      return [...cur, ...former];
    }
    const rows = D.seasons.filter(s => s.year === year).map(s => {
      const m = mk(s);
      // ESPN leaves final_rank at 0 until the season ends, so a season in
      // progress shows its current regular-season order on both tabs.
      return { player: s.player, ...m, pct: m.w + m.l ? m.w / (m.w + m.l) : null, rank: reg ? s.reg_rank : (s.final_rank || s.reg_rank), s };
    });
    rows.sort((a, b) => (a.rank ?? 99) - (b.rank ?? 99) || b.w - a.w || b.pf - a.pf);
    return rows;
  }

  const MEDIAN_ERA_START = 2025;

  // Each manager's rank after the previous week of a season in progress:
  // every regular-season game before the latest week played, head-to-head
  // plus median results, ordered by wins then PF -- the same order the
  // dashboard's Move column uses. Null before Week 2.
  function lastWeekRanks(year) {
    const reg = D.games.filter(g => g.year === year && g.type === 'Reg');
    const latest = Math.max(0, ...reg.map(g => g.week));
    if (latest < 2) return null;
    lastWeek = latest - 1;
    const t = {};
    reg.filter(g => g.week < latest).forEach(g => {
      [[g.p1, g.s1], [g.p2, g.s2]].forEach(([p, s]) => {
        if (!p) return;
        const e = t[p] || (t[p] = { w: 0, pf: 0 });
        e.pf += s || 0;
        if (g.winner === p) e.w++;
        if (year >= MEDIAN_ERA_START && g.median != null && s > g.median) e.w++;
      });
    });
    const order = Object.keys(t).sort((a, b) => t[b].w - t[a].w || t[b].pf - t[a].pf);
    return new Map(order.map((p, i) => [p, i + 1]));
  }
  let formerCount = 0, prevRank = null, lastWeek = 0;
  function row(r, k, n, type, complete, year, race) {
    const cls = ['qrow'];
    if (r.former) cls.push('former');
    else if (r.rank === 1) cls.push('top'); else if (r.rank === n - (year === 'all' ? formerCount : 0)) cls.push('last');
    else if (type === 'reg' && complete && r.s.playoff > 0) cls.push('po');
    const badges = [];
    if (year === 'all') {
      if (type === 'final') {
        if (r.s.champ) badges.push(`<span class="badge gold">${r.s.champ}× Title</span>`);
        if (r.s.sacko) badges.push(`<span class="badge loss">${r.s.sacko}× Sacko</span>`);
      }
    } else if (complete && type === 'final') {
      if (r.s.champ) badges.push('<span class="badge gold">Champion</span>');
      else if (r.s.sacko) badges.push('<span class="badge loss">Sacko</span>');
    }
    const metaParts = [];
    if (year === 'all') metaParts.push(`${r.seasons} seasons`);
    metaParts.push(`<span class="pfpa"><span>PF ${f2(r.pf)}</span><span>PA ${f2(r.pa)}</span>${raceMark(race)}</span>`);
    const metaHtml = metaParts.map(p => `<span class="meta-seg">${p}</span>`).join('<span class="meta-sep"> · </span>');
    // One badge reads fine next to the name at any width. Two at once
    // (All-Time view, a manager with both titles and sackos) are wide
    // enough together to squeeze the name out on a narrow row -- but
    // should still sit next to the name whenever there's room, only
    // moving to the row's right side (above W/L/Win%) once they
    // genuinely don't fit. CSS can't reposition one element based on
    // available space, so both copies render and a media query (tuned to
    // where "Flanders" + both badges actually stops fitting, confirmed
    // directly) shows exactly one.
    const isMulti = badges.length >= 2;
    const sideBadges = isMulti ? `<div class="badge-side">${badges.join('')}</div>` : '';
    let moveHtml = '';
    if (prevRank && prevRank.has(r.player) && r.rank) {
      const mv = prevRank.get(r.player) - r.rank;
      const txt = mv > 0 ? `▲ ${mv}` : mv < 0 ? `▼ ${-mv}` : '–';
      const say = mv > 0 ? `Up ${mv}` : mv < 0 ? `Down ${-mv}` : 'No change';
      moveHtml = `<i class="mv${mv > 0 ? ' up' : mv < 0 ? ' down' : ''}" title="${say} since Week ${lastWeek}" aria-label="${say} since Week ${lastWeek}">${txt}</i>`;
    }
    return `<a class="${cls.join(' ')}" href="franchise.html" data-fr="${esc(r.player)}"><div class="rk">${r.former ? '–' : (r.rank ?? k + 1)}</div><div class="qrow-main"><div class="tm"><span class="nm">${esc(r.player)}</span>${moveHtml}<span class="badges-inline${isMulti ? ' multi' : ''}">${badges.join('')}</span></div>` +
      `<div class="meta">${metaHtml}</div></div>` +
      `<div class="stats-col">${sideBadges}<div class="stats"><div><b>${r.w}</b><span>W</span></div><div><b>${r.l}</b><span>L</span></div><div><b>${pct(r.pct)}</b><span>Win %</span></div></div></div></a>`;
  }

  function render() {
    const sel = $('year-select').value;
    const year = sel === 'all' ? 'all' : Number(sel);
    const complete = year !== 'all' && D.completeYears.includes(year);
    const rows = build(year, tab);
    formerCount = rows.filter(r => r.former).length;
    prevRank = year === D.currentYear && !complete ? lastWeekRanks(year) : null;
    // The season in progress gets the playoff race (site audit 29): a
    // Playoff line after the last spot, and Clinched, Eliminated or games
    // back at the end of each row's PF/PA line. Read from
    // the regular-season record alone, median games included, so it holds
    // once the playoffs start too.
    const live = year === D.currentYear && !complete;
    const set = live && D.settings && D.settings[year];
    const spots = set ? set.playoff_teams : 0;
    const race = set ? playoffRace(rows.map(r => ({ w: r.s.reg_w + r.s.med_w, l: r.s.reg_l + r.s.med_l })), spots,
      set.reg_weeks * (year >= MEDIAN_ERA_START ? 2 : 1)) : null;
    const legend = tab === 'reg' && complete
      ? '<div class="legend"><span><i style="background:var(--turf)"></i>Made the playoffs</span><span><i style="background:var(--line)"></i>Missed the playoffs</span></div>'
      : '';
    const note = year === 'all' ? 'Every season combined, current teams ranked by win percentage (former teams listed after). Median games count from 2025 on.' : year >= 2025 ? 'Wins and losses include the weekly median game.' : '';
    $('tabs').innerHTML = TABS.map(([k, l]) => `<button class="tab ${k === tab ? 'on' : ''}" data-t="${k}"${k === tab && note ? ` title="${esc(note)}"` : ''}>${l}</button>`).join('');
    // 18px above the first row (or the legend) matches the rows' 18px sides.
    $('standings-container').innerHTML = `<div class="glass">${legend}<div style="padding:${legend ? 14 : 18}px 18px 20px">${rows.map((r, k) => row(r, k, rows.length, tab, complete, year, race && race[k]) + (spots && k === spots - 1 && rows.length > spots ? PLAYOFF_LINE : '')).join('')}</div></div>`;
  }

  document.addEventListener('click', e => {
    const t = e.target.closest('[data-t]');
    if (t) { tab = t.dataset.t; render(); return; }
    // Rows are plain links; this hands Franchise the manager to open on,
    // through the same storage key that page saves its own pick to.
    const fr = e.target.closest('[data-fr]');
    if (fr) { try { localStorage.setItem('franchise-selected', fr.dataset.fr); } catch (err) {} }
  });

  LG.load().then(data => {
    D = data;
    $('year-select').innerHTML = '<option value="all">All-Time</option>' + data.years.slice().reverse().map(y => `<option value="${y}">${y}</option>`).join('');
    $('year-select').value = 'all';
    $('year-select').addEventListener('change', render);
    render();
    riseIn(document.querySelectorAll('#standings-container .qrow'));
  }).catch(err => LG.showError('standings-container', err));
</script>
<script src="track.js?v=1" defer></script>
