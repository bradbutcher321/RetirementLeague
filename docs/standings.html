<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retirement League — Standings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=3">
<link rel="stylesheet" href="nav.css?v=3">
<link rel="stylesheet" href="league.css?v=5">
<style>
  .top-row{ display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:14px; }
  .tabs{ display:flex; gap:8px; flex-wrap:wrap; }
  .tab{ background:none; border:1px solid var(--line); color:var(--text-dim); font-family:var(--body); font-size:0.82rem; font-weight:600; padding:8px 14px; border-radius:999px; cursor:pointer; }
  .tab.on{ border-color:var(--gold); color:var(--gold); background:rgba(212,180,106,0.10); }
  .top-row .sp{ flex:1; }
  .legend{ display:flex; gap:16px; flex-wrap:wrap; color:var(--text-dim); font-size:0.74rem; padding:14px 24px 0; }
  .legend i{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }

  .qrow .tm{ font-weight:600; font-size:0.9rem; display:flex; align-items:center; gap:6px; min-width:0; }
  .qrow .tm .nm{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
</style>
</head>
<body>
  <div id="site-nav"></div>
  <div class="wrap">
    <header>
      <div class="header-row">
        <div>
          <div class="eyebrow">Retirement League</div>
          <h1>Standings</h1>
        </div>
        <div class="updated-block">
          <div class="updated-label">Updated</div>
          <div class="updated-value" id="updated-at">—</div>
        </div>
      </div>
    </header>

    <section>
      <h2 id="standings-heading">Standings</h2>
      <div class="top-row">
        <div class="tabs" id="tabs"></div>
        <div class="sp"></div>
        <label class="selector-label" for="year-select">Season</label>
        <select class="lg-select" id="year-select" autocomplete="off"></select>
      </div>
      <div id="tiles"></div>
      <div id="standings-container"><div class="loading-row">Loading standings…</div></div>
    </section>

    <footer>Data via ESPN Fantasy</footer>
  </div>

<script src="nav.js"></script>
<script src="league-common.js?v=2"></script>
<script>
  const { f1, esc, pct } = LG;
  const TABS = [['reg', 'Regular Season'], ['final', 'Final Standings']];
  let D, tab = 'reg';
  const $ = id => document.getElementById(id);
  const glassCard = (title, body, note) => `<div class="glass"><div style="padding:20px 24px ${note ? '4px' : '16px'}"><div style="font-weight:700;font-size:1rem">${title}</div>${note ? `<div style="color:var(--text-dim);font-size:0.78rem;margin-top:4px">${note}</div>` : ''}</div>${body}</div>`;

  function build(year, type) {
    const reg = type === 'reg';
    const mk = s => {
      const w = (reg ? s.reg_w : s.tot_w) + s.med_w, l = (reg ? s.reg_l : s.tot_l) + s.med_l;
      return { w, l, pf: reg ? s.reg_pf : s.tot_pf, pa: reg ? s.reg_pa : s.tot_pa };
    };
    if (year === 'all') {
      const by = {};
      D.seasons.forEach(s => {
        const m = mk(s), e = by[s.player] || (by[s.player] = { player: s.player, w: 0, l: 0, pf: 0, pa: 0, seasons: 0, s: { champ: 0, sacko: 0 } });
        e.w += m.w; e.l += m.l; e.pf += m.pf; e.pa += m.pa; e.seasons++; e.s.champ += s.champ; e.s.sacko += s.sacko;
      });
      const rows = Object.values(by).map(e => ({ ...e, pct: e.w + e.l ? e.w / (e.w + e.l) : null }));
      const cur = rows.filter(r => D.active.has(r.player)).sort((a, b) => b.pct - a.pct || b.w - a.w);
      const former = rows.filter(r => !D.active.has(r.player)).sort((a, b) => b.pct - a.pct || b.w - a.w);
      cur.forEach((r, i) => { r.rank = i + 1; });
      former.forEach(r => { r.rank = null; r.former = true; });
      return [...cur, ...former];
    }
    const rows = D.seasons.filter(s => s.year === year).map(s => {
      const m = mk(s);
      return { player: s.player, ...m, pct: m.w + m.l ? m.w / (m.w + m.l) : null, rank: reg ? s.reg_rank : s.final_rank, s };
    });
    rows.sort((a, b) => (a.rank ?? 99) - (b.rank ?? 99) || b.w - a.w || b.pf - a.pf);
    return rows;
  }

  const tileData = (title, name, cls, sub) => ({ title, name, cls, sub });

  // Biggest single-game score for the selected season; regular-season tab only counts regular-season games.
  function gameTileData(year) {
    const games = D.games.filter(g => g.type !== 'Bye' && g.p2 && g.s1 > 0 && g.s2 > 0 && g.winner !== 'In Progress' &&
      (year === 'all' || g.year === year) && (tab === 'reg' ? g.type === 'Reg' : true));
    let best = null;
    games.forEach(g => [[g.p1, g.s1, g.p2], [g.p2, g.s2, g.p1]].forEach(([p, sc, opp]) => { if (!best || sc > best.sc) best = { p, sc, opp, g }; }));
    if (!best) return tileData('Top Single Game', '—', '', 'No games yet');
    const g = best.g;
    return tileData('Top Single Game', best.p, '', `${f1(best.sc)} · ${year === 'all' ? g.year + ' ' : ''}Week ${g.week} vs ${best.opp}`);
  }

  function tilesAllData() {
    const cur = build('all', tab), fin = build('all', 'final');
    const top = cur.find(r => !r.former);
    const champs = fin.slice().sort((a, b) => b.s.champ - a.s.champ), sackos = fin.slice().sort((a, b) => b.s.sacko - a.s.sacko);
    const mostPf = cur.slice().sort((a, b) => b.pf - a.pf)[0];
    const names = (list, k) => list.filter(r => r.s[k] === list[0].s[k]).slice(0, 2).map(r => r.player).join(' · ');
    return [
      tileData('Best Win %', top.player, 'good', `${pct(top.pct)} · ${top.w}-${top.l}`),
      tileData('Most Titles', names(champs, 'champ'), 'gold', `${champs[0].s.champ} championships`),
      tileData('Most Sackos', names(sackos, 'sacko'), 'bad', `${sackos[0].s.sacko} sackos`),
      tileData('Most Points', mostPf.player, '', `${f1(mostPf.pf)} points for`),
      gameTileData('all'),
    ];
  }

  function tilesData(year) {
    if (year === 'all') return tilesAllData();
    const complete = D.completeYears.includes(year);
    const cur = build(year, tab), fin = build(year, 'final');
    const champ = complete ? fin.find(r => r.s.champ) : null, sacko = complete ? fin.find(r => r.s.sacko) : null;
    const top = tab === 'reg' ? cur[0] : cur.slice().sort((a, b) => b.pct - a.pct || b.w - a.w)[0];
    const mostPf = cur.slice().sort((a, b) => b.pf - a.pf)[0];
    return [
      tileData(tab === 'reg' ? (complete ? 'Top Seed' : 'Current Leader') : 'Best Record', top.player, 'good', `${top.w}-${top.l} ${tab === 'reg' ? 'regular season' : 'overall'}`),
      tileData('Champion', champ ? champ.player : '—', champ ? 'gold' : '', champ ? `${champ.w}-${champ.l} overall` : 'Season in progress'),
      tileData('Sacko', sacko ? sacko.player : '—', sacko ? 'bad' : '', sacko ? `${sacko.w}-${sacko.l} overall` : 'Season in progress'),
      tileData('Most Points', mostPf.player, '', `${f1(mostPf.pf)}${tab === 'reg' ? ' points' : ' incl. playoffs'}`),
      gameTileData(year),
    ];
  }

  // Hero (biggest/leader stat, glowing) + two quiet side stats + a two-tile strip below --
  // not every number on this page deserves equal weight, so the leader gets to stand out.
  function renderTiles(list) {
    const toneCls = c => (c === 'good' ? 'turf' : c === 'bad' ? 'loss' : '');
    const hero = list[0], side = list.slice(1, 3), rest = list.slice(3);
    const glow = hero.cls === 'bad' ? 'glow-loss' : 'glow-turf';
    const heroHtml = `<div class="glass hero2"><div class="hero2-main ${glow}"><div class="hero2-eyebrow">${hero.title}</div>` +
      `<div class="hero2-v">${esc(hero.name)}</div><div class="hero2-sub">${esc(hero.sub)}</div></div>` +
      `<div class="hero2-side">${side.map(x => `<div class="hs"><div class="hs-l">${x.title}</div><div class="hs-r">` +
        `<div class="hs-v ${toneCls(x.cls)}">${esc(x.name)}</div><div class="hs-n">${esc(x.sub)}</div></div></div>`).join('')}</div></div>`;
    const tilesRow = `<div class="glass qtiles">${rest.map(x => `<div><div class="qtile-v ${toneCls(x.cls)}">${esc(x.name)}</div><div class="qtile-t">${x.title}</div>` +
      `<div style="color:var(--text-dim);font-size:0.7rem;margin-top:3px">${esc(x.sub)}</div></div>`).join('')}</div>`;
    return heroHtml + '<div class="gap"></div>' + tilesRow;
  }

  let formerCount = 0;
  function row(r, k, n, type, complete, year) {
    const cls = ['qrow'];
    if (r.former) cls.push('former');
    else if (r.rank === 1) cls.push('top'); else if (r.rank === n - (year === 'all' ? formerCount : 0)) cls.push('last');
    else if (type === 'reg' && complete && r.s.playoff > 0) cls.push('po');
    let badge = '';
    if (year === 'all') {
      if (type === 'final') {
        if (r.s.champ) badge += `<span class="badge gold">${r.s.champ}× Title</span>`;
        if (r.s.sacko) badge += `<span class="badge loss">${r.s.sacko}× Sacko</span>`;
      }
    } else if (complete && type === 'final') {
      if (r.s.champ) badge = '<span class="badge gold">Champion</span>';
      else if (r.s.sacko) badge = '<span class="badge loss">Sacko</span>';
    }
    return `<div class="${cls.join(' ')}"><div class="rk">${r.former ? '–' : (r.rank ?? k + 1)}</div><div style="min-width:0"><div class="tm"><span class="nm">${esc(r.player)}</span>${badge}</div>` +
      `<div class="meta">${year === 'all' ? r.seasons + ' seasons · ' : ''}PF ${f1(r.pf)} · PA ${f1(r.pa)}</div></div>` +
      `<div class="stats"><div><b>${r.w}</b><span>W</span></div><div><b>${r.l}</b><span>L</span></div><div><b>${pct(r.pct)}</b><span>Win %</span></div></div></div>`;
  }

  function render() {
    const sel = $('year-select').value;
    const year = sel === 'all' ? 'all' : Number(sel);
    const complete = year !== 'all' && D.completeYears.includes(year);
    $('tabs').innerHTML = TABS.map(([k, l]) => `<button class="tab ${k === tab ? 'on' : ''}" data-t="${k}">${l}</button>`).join('');
    $('standings-heading').textContent = `${year === 'all' ? 'All-Time' : year} ${tab === 'reg' ? 'Regular Season' : 'Final'} Standings`;
    $('tiles').innerHTML = renderTiles(tilesData(year));
    const rows = build(year, tab);
    formerCount = rows.filter(r => r.former).length;
    const legend = tab === 'reg' && complete
      ? '<div class="legend"><span><i style="background:var(--turf)"></i>Made the playoffs</span><span><i style="background:var(--line)"></i>Missed the playoffs</span></div>'
      : '';
    const note = year === 'all' ? 'Every season combined, current teams ranked by win percentage (former teams listed after). Median games count from 2025 on.' : year >= 2025 ? 'Wins and losses include the weekly median game.' : '';
    $('standings-container').innerHTML = glassCard(tab === 'reg' ? 'Regular Season' : 'After the Playoffs', legend +
      `<div style="padding:14px 18px 20px">${rows.map((r, k) => row(r, k, rows.length, tab, complete, year)).join('')}</div>`, note);
  }

  document.addEventListener('click', e => {
    const t = e.target.closest('[data-t]');
    if (t) { tab = t.dataset.t; render(); }
  });

  LG.load().then(data => {
    D = data;
    $('year-select').innerHTML = '<option value="all">All-Time</option>' + data.years.slice().reverse().map(y => `<option value="${y}">${y}</option>`).join('');
    $('year-select').value = data.completeYears[data.completeYears.length - 1];
    $('year-select').addEventListener('change', render);
    render();
  }).catch(err => LG.showError('standings-container', err));
</script>
<script src="track.js?v=1" defer></script>
</body>
</html>
