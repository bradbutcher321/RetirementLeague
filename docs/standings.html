<!-- The two font-family's woff2 files Google serves for the latin subset
     at the weights this site uses -- one variable-font file per family
     covers every weight declared, confirmed directly by fetching the
     stylesheet below and comparing each @font-face block's url(). Starts
     the actual font downloads immediately, in parallel with that
     stylesheet fetch, instead of waiting to discover these same URLs
     only after the stylesheet loads and is parsed -- avoids the
     fallback-to-webfont swap (FOUT) that otherwise shows on a slow or
     uncached load. If Google ever changes these hashed URLs, this just
     degrades to a wasted (unused) preload, not a correctness issue -- the
     stylesheet's own @font-face still fetches whatever the new URL is. -->
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/bigshouldersdisplay/v24/fC1_PZJEZG-e9gHhdI4-NBbfd2ys3SjJCx1czNDu.woff2">

<style>
  /* Selector styling, the tabs-plus-Year row (.controls-row) and the
     label+control pairing that stops the two splitting across a wrap
     (.selector-group) all live in theme.css. */
  /* On a phone the caption goes, as on Parlay's rows (theme.css): "All-Time"
     or "2025" already says it's a year, and its ~50px is what kept the
     dropdown from fitting beside the tabs at 375-398px (site audit II #18).
     Kept for screen readers. */
  @media (max-width:600px){
    .controls-row .selector-label{ position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
  }
  .legend{ display:flex; gap:16px; flex-wrap:wrap; color:var(--text-dim); font-size:0.74rem; padding:18px 24px 0; }
  .legend i{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }

  .qrow .tm{ font-weight:600; font-size:0.9rem; display:flex; align-items:center; gap:6px; min-width:0; }
  .qrow .tm .nm{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  /* Your Daddy / Your Bitch (rivals.js): on a line of its own, so it never squeezes the name. */
  .qrow .rv-row{ margin-top:4px; } .qrow .rv-row .rv-tag{ margin-left:0; }
  .qrow-main{ min-width:0; }
  /* All-Time titles and Sackos ride the line under the name ("12 szns ·
     3 titles · 2 Sackos", site audit II #10) instead of badges, which
     had to shrink and move above W/L once two of them met a narrow row.
     That leaves stats-col one line tall; top-aligning it keeps it level
     with the name however tall the meta lines run. */
  .qrow .stats-col{ display:flex; flex-direction:column; align-items:flex-end; align-self:start; }
  .qrow .meta .t{ color:var(--gold); font-weight:600; }
  .qrow .meta .s{ color:var(--loss); font-weight:600; }
  @media (max-width:580px){
    .qrow .stats{ gap:8px; }
    .qrow .stats div{ min-width:26px; }
  }
  /* "PF x · PA y" is always forced onto its own line after "N seasons"
     (at every width, not just mobile), instead of "seasons · PF" sharing
     a line while "PA" gets stranded below. Within it, PF and PA each stay
     whole, and only when the pair is wider than the column does PA drop
     to its own line. The All-Time "szns · titles · Sackos" line (.tally)
     wraps the same way at 375-390px instead of clipping. Every
     part carries its own leading " · ", and the row is shifted left by
     that separator's width inside an overflow:hidden segment, so the
     separator of whichever part starts a line is clipped off. */
  .qrow .meta-seg{ white-space:nowrap; display:block; overflow:hidden; }
  .qrow .meta-sep{ display:none; }
  .qrow .pfpa, .qrow .tally{ display:flex; flex-wrap:wrap; margin-left:-1em; }
  .qrow .pfpa > span::before, .qrow .tally > span::before{ content:'·'; display:inline-block; width:1em; text-align:center; color:var(--text-dim); font-weight:400; }

  /* Every row opens that manager's Franchise page. */
  a.qrow{ color:inherit; text-decoration:none; }
  a.qrow:focus-visible{ outline:2px solid var(--gold); outline-offset:-2px; }

  /* Current season only: places gained or lost since last week, the same
     pill as the dashboard's Move column. It sits beside the name, where a
     finished season's Champion/Sacko badge goes -- a column of its own
     beside W/L/Win % pushed the stats into the PF/PA line at phone width. */
  .mv{ flex:none; box-sizing:border-box; width:40px; padding:2px 0; border-radius:999px; border:1px solid var(--line); text-align:center;
       color:var(--text-dim); font-style:normal; font-size:0.68rem; font-weight:700; line-height:1.2; white-space:nowrap; }
  .mv.up{ border-color:var(--turf-dim); color:var(--turf); }
  .mv.down{ border-color:rgba(214,98,79,0.4); color:var(--loss); }

  #standings-container{ margin-top:14px; }

  /* Form (site audit II #32): the season in progress's last five
     head-to-head results under W/L/Win %, oldest first, a letter in each so
     colour isn't the only signal. */
  .form{ display:flex; gap:3px; justify-content:flex-end; margin-top:6px; }
  .form i{ width:16px; height:16px; border-radius:4px; border:1px solid; display:flex; align-items:center; justify-content:center;
    font-style:normal; font-size:0.55rem; font-weight:800; line-height:1; }
  .form i.w{ color:var(--turf); border-color:var(--win-line); background:var(--win-tint); }
  .form i.l{ color:var(--loss); border-color:var(--loss-line); background:var(--loss-tint); }
  .form i.t{ color:var(--text-dim); border-color:var(--line); }

  /* Rank by Week (site audit II #32): one line per manager through the
     regular season. Grey until one is picked (tap a line or a name), which
     turns gold while the rest fade. Drawn at the panel's real width, so the
     text never scales. */
  .bump-card{ margin-top:14px; }
  .bump-hint{ color:var(--text-dim); font-size:0.74rem; padding:4px 22px 0; }
  .bump{ padding:10px 12px 16px; }
  .bump svg{ display:block; width:100%; overflow:visible; }
  .bump .grid{ stroke:var(--line); }
  .bump .ax{ fill:var(--text-dim); font-size:10px; font-family:var(--body); }
  .bump .ln{ fill:none; stroke:rgba(255,255,255,0.22); stroke-width:2; stroke-linejoin:round; stroke-linecap:round; transition:stroke .2s, opacity .2s; }
  .bump .dt{ fill:#5a5a58; transition:fill .2s, opacity .2s; }
  .bump .nm{ fill:var(--text); font-size:11px; font-weight:600; font-family:var(--body); cursor:pointer; transition:fill .2s, opacity .2s; }
  .bump .hit{ fill:none; stroke:transparent; stroke-width:14; cursor:pointer; pointer-events:stroke; }
  .bump.picked .ln, .bump.picked .dt, .bump.picked .nm{ opacity:0.25; }
  .bump.picked .on{ opacity:1; }
  .bump .ln.on{ stroke:var(--gold); stroke-width:3; }
  .bump .dt.on{ fill:var(--gold); }
  .bump .nm.on{ fill:var(--gold); }
  .bump .rk-v{ fill:#111; font-size:8px; font-weight:800; font-family:var(--body); pointer-events:none; }
  @media (hover:hover){ .bump .nm:hover{ fill:var(--gold); } }
  /* Rows sit 6px apart (each .qrow's margin-top); the Playoff line takes
     10px either side of it, counting the next row's own 6px. */
  #standings-container .po-line{ margin:10px 0 4px; }

<script src="nav.js?v=25"></script>

<script>
  // esc() is a global from page-common.js, not part of LG.
  const { pct } = LG;
  // Whole points with thousands separators: all-time totals with two
  // decimals pushed PA onto its own line at phone width.
  const n0 = n => Math.round(n).toLocaleString('en-US');
  // "Regular Szn" / "Final" (site audit II #18): the long names pushed the
  // Year dropdown onto its own row on a phone.
  const TABS = [['reg', 'Regular Szn'], ['final', 'Final'], ['bracket', 'Bracket']];
  let D, tab = 'final', optsFor = null;
  const $ = id => document.getElementById(id);
  // No card title: it read "Regular Season" / "Final Standings" directly
  // under the selected tab saying the same thing. The note that used to be
  // the title's hover tooltip now rides on the selected tab instead.

  function build(year, type) {
    const reg = type === 'reg';
    const mk = s => {
      const w = (reg ? s.reg_w : s.tot_w) + s.med_w, l = (reg ? s.reg_l : s.tot_l) + s.med_l;
      return { w, l, pf: reg ? s.reg_pf : s.tot_pf, pa: reg ? s.reg_pa : s.tot_pa };
    };
    if (year === 'all') {
      const by = {};
      D.seasons.forEach(s => {
        const m = mk(s), e = by[s.player] || (by[s.player] = { player: s.player, w: 0, l: 0, pf: 0, pa: 0, seasons: 0, s: { champ: 0, sacko: 0 } });
        e.w += m.w; e.l += m.l; e.pf += m.pf; e.pa += m.pa; e.seasons++; e.s.champ += s.champ; e.s.sacko += s.sacko;
      });
      const rows = Object.values(by).map(e => ({ ...e, pct: e.w + e.l ? e.w / (e.w + e.l) : null }));
      const cur = rows.filter(r => D.active.has(r.player)).sort((a, b) => b.pct - a.pct || b.w - a.w);
      const former = rows.filter(r => !D.active.has(r.player)).sort((a, b) => b.pct - a.pct || b.w - a.w);
      cur.forEach((r, i) => { r.rank = i + 1; });
      former.forEach(r => { r.rank = null; r.former = true; });
      return [...cur, ...former];
    }
    const rows = D.seasons.filter(s => s.year === year).map(s => {
      const m = mk(s);
      // ESPN leaves final_rank at 0 until the season ends, so a season in
      // progress shows its current regular-season order on both tabs.
      return { player: s.player, ...m, pct: m.w + m.l ? m.w / (m.w + m.l) : null, rank: reg ? s.reg_rank : (s.final_rank || s.reg_rank), s };
    });
    rows.sort((a, b) => (a.rank ?? 99) - (b.rank ?? 99) || b.w - a.w || b.pf - a.pf);
    return rows;
  }

  // Each manager's rank after the previous week of a season in progress:
  // every regular-season game before the latest week played, head-to-head
  // plus median results, ordered by wins then PF -- the same order the
  // dashboard's Move column uses. Null before Week 2.
  function lastWeekRanks(year) {
    const reg = D.games.filter(g => g.year === year && g.type === 'Reg');
    const latest = Math.max(0, ...reg.map(g => g.week));
    if (latest < 2) return null;
    lastWeek = latest - 1;
    const t = {};
    reg.filter(g => g.week < latest).forEach(g => {
      [[g.p1, g.s1], [g.p2, g.s2]].forEach(([p, s]) => {
        if (!p) return;
        const e = t[p] || (t[p] = { w: 0, pf: 0 });
        e.pf += s || 0;
        if (g.winner === p) e.w++;
        if (year >= D.median_era_start_year && g.median != null && s > g.median) e.w++;
      });
    });
    const order = Object.keys(t).sort((a, b) => t[b].w - t[a].w || t[b].pf - t[a].pf);
    return new Map(order.map((p, i) => [p, i + 1]));
  }
  // Every manager's rank after each finished regular-season week of a year,
  // ordered the same way as lastWeekRanks. The last week takes the real
  // standing (reg_rank) instead, since ESPN's tiebreakers can differ from
  // wins-then-PF. Returns { weeks: [1..n], by: Map(name -> [rank per week]) }.
  function ranksByWeek(year) {
    const reg = D.games.filter(g => g.year === year && g.type === 'Reg');
    const open = new Set(reg.filter(g => g.winner === 'In Progress').map(g => g.week));
    const weeks = [...new Set(reg.map(g => g.week))].filter(w => !open.has(w)).sort((a, b) => a - b);
    const t = {}, by = new Map();
    weeks.forEach((wk, i) => {
      reg.filter(g => g.week === wk).forEach(g => {
        [[g.p1, g.s1], [g.p2, g.s2]].forEach(([p, s]) => {
          if (!p) return;
          const e = t[p] || (t[p] = { w: 0, pf: 0 });
          e.pf += s || 0;
          if (g.winner === p) e.w++;
          if (year >= D.median_era_start_year && g.median != null && s > g.median) e.w++;
        });
      });
      Object.keys(t).sort((a, b) => t[b].w - t[a].w || t[b].pf - t[a].pf).forEach((p, r) => {
        if (!by.has(p)) by.set(p, Array(weeks.length).fill(null));
        by.get(p)[i] = r + 1;
      });
    });
    const last = weeks.length - 1;
    if (last >= 0) D.seasons.filter(s => s.year === year && s.reg_rank).forEach(s => { if (by.has(s.player)) by.get(s.player)[last] = s.reg_rank; });
    return { weeks, by };
  }

  let bumpPick = null;
  function bumpChart(year) {
    if (ranksByWeek(year).weeks.length < 2) return '';
    return `<div class="glass bump-card"><div class="panel-title">Rank by Week</div>
      <div class="bump-hint">Tap a line or a name to follow one team.</div>
      <div class="bump" id="bump" data-year="${year}"></div></div>`;
  }
  // Drawn after the card is on the page, at its real width.
  function drawBump() {
    const el = $('bump');
    if (!el) return;
    const { weeks, by } = ranksByWeek(Number(el.dataset.year));
    const names = [...by.keys()], n = names.length;
    const W = el.clientWidth - 24, left = 22, right = 66, top = 8, rowH = 22;
    const H = top + (n - 1) * rowH + 26;
    const x = i => left + i * (W - left - right) / Math.max(1, weeks.length - 1);
    const y = r => top + (r - 1) * rowH;
    let svg = '';
    for (let r = 1; r <= n; r++) svg += `<line class="grid" x1="${left}" x2="${W - right}" y1="${y(r)}" y2="${y(r)}"/><text class="ax" x="0" y="${y(r) + 3.5}">${r}</text>`;
    weeks.forEach((wk, i) => { svg += `<text class="ax" x="${x(i)}" y="${H - 4}" text-anchor="middle">${wk}</text>`; });
    const on = name => name === bumpPick ? ' on' : '';
    // The picked line last, so it draws over the rest.
    [...names].sort((a, b) => (a === bumpPick) - (b === bumpPick)).forEach(name => {
      const rk = by.get(name), m = esc(name), picked = name === bumpPick;
      const pts = rk.map((r, i) => r == null ? null : `${x(i).toFixed(1)},${y(r)}`).filter(Boolean).join(' ');
      svg += `<polyline class="ln${on(name)}" data-m="${m}" points="${pts}"/>`;
      svg += rk.map((r, i) => r == null ? '' : `<circle class="dt${on(name)}" data-m="${m}" cx="${x(i).toFixed(1)}" cy="${y(r)}" r="${picked ? 7 : 3}"/>` +
        (picked ? `<text class="rk-v" x="${x(i).toFixed(1)}" y="${y(r) + 3}" text-anchor="middle">${r}</text>` : '')).join('');
      svg += `<polyline class="hit" data-m="${m}" points="${pts}"><title>${m}</title></polyline>`;
      const lastR = rk[rk.length - 1];
      if (lastR != null) svg += `<text class="nm${on(name)}" data-m="${m}" x="${W - right + 10}" y="${y(lastR) + 4}">${m}</text>`;
    });
    el.classList.toggle('picked', !!bumpPick);
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Each manager's rank after every week">${svg}</svg>`;
  }
  addEventListener('resize', () => { clearTimeout(drawBump.t); drawBump.t = setTimeout(drawBump, 120); });

  // Last five head-to-head results of a season, oldest first.
  function formOf(year, player) {
    return D.games.filter(g => g.year === year && g.type === 'Reg' && g.p2 && g.winner !== 'In Progress' && (g.p1 === player || g.p2 === player))
      .sort((a, b) => a.week - b.week).slice(-5)
      .map(g => g.winner === player ? 'w' : (g.winner === g.p1 || g.winner === g.p2) ? 'l' : 't');
  }

  // The Worker's live dashboard, for the schedule left (site audit II #31):
  // { week, ahead: Map(manager -> opponents from that week on) }. Only
  // fetched for the season in progress; null until it lands or if it fails.
  const WORKER_URL = 'https://retirement-league-refresh-proxy.bradbutcher321.workers.dev';
  let LIVE = null, liveAsked = false;
  function askLive() {
    if (liveAsked) return;
    liveAsked = true;
    fetch(WORKER_URL, { cache: 'no-store' }).then(r => r.json()).then(d => {
      LIVE = { week: d.week, ahead: new Map((d.teams || []).filter(t => t.manager).map(t => [t.manager, t.ahead || []])) };
      render();
    }).catch(err => console.error('Schedule left:', err));
  }

  let formerCount = 0, prevRank = null, lastWeek = 0;
  function row(r, k, n, type, complete, year, race, sos, hard, form) {
    const cls = ['qrow'];
    if (r.former) cls.push('former');
    else if (r.rank === 1) cls.push('top'); else if (r.rank === n - (year === 'all' ? formerCount : 0)) cls.push('last');
    else if (type === 'reg' && complete && r.s.playoff > 0) cls.push('po');
    if (isMe(r.player)) cls.push('me');
    const badges = [];
    if (year !== 'all' && complete && type === 'final') {
      if (r.s.champ) badges.push('<span class="badge gold">Champion</span>');
      else if (r.s.sacko) badges.push('<span class="badge loss">Sacko</span>');
    }
    const metaParts = [];
    if (year === 'all') {
      const tally = [`<span>${r.seasons} szns</span>`];
      if (type === 'final') {
        if (r.s.champ) tally.push(`<span class="t">${r.s.champ} title${r.s.champ === 1 ? '' : 's'}</span>`);
        if (r.s.sacko) tally.push(`<span class="s">${r.s.sacko} Sacko${r.s.sacko === 1 ? '' : 's'}</span>`);
      }
      metaParts.push(`<span class="tally">${tally.join('')}</span>`);
    }
    metaParts.push(`<span class="pfpa"><span>PF ${n0(r.pf)}</span><span>PA ${n0(r.pa)}</span></span>`);
    // Schedule left and the race marker get a line of their own.
    const race2 = sosMark(sos, hard) + raceMark(race);
    if (race2) metaParts.push(`<span class="pfpa">${race2}</span>`);
    const metaHtml = metaParts.map(p => `<span class="meta-seg">${p}</span>`).join('<span class="meta-sep"> · </span>');
    let moveHtml = '';
    if (prevRank && prevRank.has(r.player) && r.rank) {
      const mv = prevRank.get(r.player) - r.rank;
      const txt = mv > 0 ? `▲ ${mv}` : mv < 0 ? `▼ ${-mv}` : '–';
      const say = mv > 0 ? `Up ${mv}` : mv < 0 ? `Down ${-mv}` : 'No change';
      moveHtml = `<i class="mv${mv > 0 ? ' up' : mv < 0 ? ' down' : ''}" title="${say} since Week ${lastWeek}" aria-label="${say} since Week ${lastWeek}">${txt}</i>`;
    }
    // Your Daddy / Your Bitch (rivals.js), in your ring color, after the name.
    return `<a class="${cls.join(' ')}" href="${esc(pageLink('franchise.html', { m: r.player }))}" data-rv="${esc(r.player)}"><div class="rk">${r.former ? '–' : (r.rank ?? k + 1)}</div><div class="qrow-main"><div class="tm"><span class="nm">${esc(r.player)}</span>${moveHtml}<span class="badges-inline">${badges.join('')}</span></div>${Rivals.pill(r.player) ? `<div class="rv-row">${Rivals.pill(r.player)}</div>` : ''}` +
      `<div class="meta">${metaHtml}</div></div>` +
      `<div class="stats-col"><div class="stats"><div><b>${r.w}</b><span>W</span></div><div><b>${r.l}</b><span>L</span></div><div><b>${pct(r.pct)}</b><span>Win %</span></div></div>` +
      (form && form.length ? `<div class="form" aria-label="Last ${form.length}: ${form.map(f => f.toUpperCase()).join(' ')}">${form.map(f => `<i class="${f}" aria-hidden="true">${f.toUpperCase()}</i>`).join('')}</div>` : '') +
      `</div></a>`;
  }


  // Bracket (site audit III #4): every season's playoffs drawn as they
  // happened, the Sacko game under them, and this season as it would be
  // seeded today. The shape (four teams in 2015-16, six since 2017) is read
  // from the games; the seeds are each team's regular-season finish.
  const ord = n => n + (['th', 'st', 'nd', 'rd'][(n % 100 - 20) % 10] || ['th', 'st', 'nd', 'rd'][n % 100] || 'th');
  const f2 = n => Number(n).toFixed(2);
  const seedOf = (year, p) => { const s = D.seasons.find(x => x.year === year && x.player === p); return s ? s.reg_rank : null; };
  const bkSide = (s, won, final) => s ? `<div class="bk-s${won ? ' won' : final ? ' lost' : ''}"><span class="bk-seed">${s.seed ?? ''}</span>${s.link === false ? `<span class="bk-m">${esc(s.m)}</span>` : `<a class="bk-m" href="${esc(pageLink('franchise.html', { m: s.m }))}">${esc(s.m)}</a>`}<span class="bk-sc">${s.s != null ? f2(s.s) : ''}</span></div>` : '';
  function bkGame(g, label) {
    const fin = g.w != null && g.w !== 'In Progress' && g.a.s != null;
    const close = fin && g.b && Math.abs(g.a.s - g.b.s) < 1;
    return `<div class="bk-g ft-item${g.type === 'Champ' ? ' champ' : ''}${g.type === 'Sacko' ? ' sacko' : ''}">${label ? `<div class="bk-lab">${label}</div>` : ''}${bkSide(g.a, fin && g.w === g.a.m, fin)}${bkSide(g.b, fin && g.b && g.w === g.b.m, fin)}${close ? `<div class="bk-note">Decided by ${f2(Math.abs(g.a.s - g.b.s))}</div>` : ''}</div>`;
  }
  const bkTbd = '<div class="bk-g ft-item tbd">To be decided</div>';
  function bkRealGame(year, g) {
    return { type: g.type, week: g.week, w: g.winner, a: { m: g.p1, seed: seedOf(year, g.p1), s: g.s1 }, b: g.p2 ? { m: g.p2, seed: seedOf(year, g.p2), s: g.s2 } : null };
  }
  function bracketView(year) {
    const set = (D.settings && D.settings[year]) || {};
    const gs = D.games.filter(g => g.year === year && ['Play', 'Bye', 'Champ', '3rd', '5th', 'Sacko'].includes(g.type)).map(g => bkRealGame(year, g));
    const live = year === D.currentYear && !D.completeYears.includes(year);
    if (!gs.some(g => g.type === 'Play' || g.type === 'Champ')) return live ? projectedBracket(year, set) : `<div class="ft-empty">No playoff games on record for ${year}.</div>`;
    const spots = set.playoff_teams || (year >= 2017 ? 6 : 4);
    const names = spots >= 6 ? ['Quarterfinals', 'Semifinals'] : ['Semifinals'];
    const playWeeks = [...new Set(gs.filter(g => g.type === 'Play').map(g => g.week))].sort((a, b) => a - b);
    const firstWeek = playWeeks[0] ?? ((set.reg_weeks || 14) + 1);
    const byes = gs.filter(g => g.type === 'Bye').map(g => g.a);
    const champ = gs.find(g => g.type === 'Champ');
    const rounds = names.map((name, i) => ({ name, week: firstWeek + i, games: gs.filter(g => g.type === 'Play' && g.week === firstWeek + i) }));
    const cols = rounds.length + 1;
    const champName = champ && champ.w && champ.w !== 'In Progress' ? champ.w : null;
    const main = `<div class="bk-main cols${cols}">
      ${rounds.map((r, i) => `<div class="bk-col"><div class="bk-rh">${r.name}<span>Week ${r.week}</span></div>
        ${r.games.length ? r.games.map(g => bkGame(g)).join('') : bkTbd}
        ${i === 0 && byes.length ? `<div class="bk-bye"><span>Byes</span>${byes.map(b => `<b>${b.seed} ${esc(b.m)}</b>`).join('')}</div>` : ''}</div>`).join('')}
      <div class="bk-col"><div class="bk-rh">Final<span>Week ${champ ? champ.week : firstWeek + rounds.length}</span></div>${champ ? bkGame(champ) : bkTbd}
        ${champName ? `<div class="bk-champ">★ <b>${esc(champName)}</b><span>${ord(champName === champ.a.m ? champ.a.seed : champ.b.seed)} seed</span></div>` : ''}</div></div>`;
    const third = gs.find(g => g.type === '3rd'), fifth = gs.find(g => g.type === '5th'), sacko = gs.find(g => g.type === 'Sacko');
    const loser = sacko && sacko.w && sacko.w !== 'In Progress' ? (sacko.w === sacko.a.m ? sacko.b.m : sacko.a.m) : null;
    const extra = [third && bkGame(third, '3rd place'), fifth && bkGame(fifth, '5th place'), sacko && bkGame(sacko, `Sacko game · Week ${sacko.week}`) + (loser ? `<div class="bk-sk">${esc(loser)} took the Sacko.</div>` : '')].filter(Boolean);
    return main + (extra.length ? `<div class="bk-extra">${extra.join('')}</div>` : '');
  }
  // The season in progress, seeded as it stands: record, then points.
  function projectedBracket(year, set) {
    const rows = build(year, 'reg').map((r, i) => ({ m: r.player, seed: r.rank ?? i + 1, s: null }));
    const spots = set.playoff_teams || 6, regWeeks = set.reg_weeks || 14;
    const g = (a, b) => ({ type: 'Play', a: rows[a], b: rows[b] });
    const w1 = regWeeks + 1, w2 = regWeeks + 2, w3 = regWeeks + 3;
    const sk = { type: 'Sacko', a: rows[rows.length - 2], b: rows[rows.length - 1] };
    const open = (a, text) => ({ type: 'Play', a, b: { m: text, seed: '', link: false } });
    const six = spots >= 6;
    return `<div class="bk-proj">If the season ended today, by record and then points.</div>
      <div class="bk-main cols${six ? 3 : 2}">
        ${six ? `<div class="bk-col"><div class="bk-rh">Quarterfinals<span>Week ${w1}</span></div>${bkGame(g(2, 5))}${bkGame(g(3, 4))}
          <div class="bk-bye"><span>Byes</span><b>1 ${esc(rows[0].m)}</b><b>2 ${esc(rows[1].m)}</b></div></div>` : ''}
        <div class="bk-col"><div class="bk-rh">Semifinals<span>Week ${six ? w2 : w1}</span></div>
          ${six ? bkGame(open(rows[0], 'Lowest seed left')) + bkGame(open(rows[1], 'Other winner')) : bkGame(g(0, 3)) + bkGame(g(1, 2))}</div>
        <div class="bk-col"><div class="bk-rh">Final<span>Week ${six ? w3 : w2}</span></div>${bkTbd}</div>
      </div>
      <div class="bk-extra">${bkGame(sk, `Sacko game · Week ${six ? w3 : w2}`)}</div>`;
  }
  // The Year dropdown lists All-Time everywhere but the Bracket, which
  // draws one season at a time.
  function yearOptions() {
    const sel = $('year-select'), cur = sel.value, noAll = tab === 'bracket';
    sel.innerHTML = (noAll ? '' : '<option value="all">All-Time</option>') + D.years.slice().reverse().map(y => `<option value="${y}">${y}</option>`).join('');
    sel.value = [...sel.options].some(o => o.value === cur) ? cur : String(D.currentYear);
    optsFor = noAll;
  }

  // Picking your team in the You sheet rings your row (site audit II #36).
  window.addEventListener('rl-me', () => render());
  // The tags need the head-to-head history, which lands on its own.
  Rivals.ready().then(book => { if (book && D) render(); });
  function render() {
    if (optsFor !== (tab === 'bracket')) yearOptions();
    const sel = $('year-select').value;
    const year = sel === 'all' ? 'all' : Number(sel);
    const complete = year !== 'all' && D.completeYears.includes(year);
    // The defaults (this season, Final Standings) leave the URL bare.
    setUrlParams({ year: year === D.currentYear ? null : year, tab: tab === 'final' ? null : tab });
    if (tab === 'bracket') {
      $('tabs').innerHTML = TABS.map(([k, l]) => `<button class="tab ${k === tab ? 'on' : ''}" data-t="${k}">${l}</button>`).join('');
      $('standings-container').innerHTML = `<div class="glass"><div class="ft-body" style="padding:18px">${bracketView(year)}</div></div>`;
      return;
    }
    const rows = build(year, tab);
    formerCount = rows.filter(r => r.former).length;
    prevRank = year === D.currentYear && !complete ? lastWeekRanks(year) : null;
    // The season in progress gets the playoff race (site audit 29): a
    // Playoff line after the last spot, and Clinched, Eliminated or games
    // back at the end of each row's PF/PA line. Read from
    // the regular-season record alone, median games included, so it holds
    // once the playoffs start too.
    const live = year === D.currentYear && !complete;
    const set = live && D.settings && D.settings[year];
    const spots = set ? set.playoff_teams : 0;
    const race = set ? playoffRace(rows.map(r => ({ w: r.s.reg_w + r.s.med_w, l: r.s.reg_l + r.s.med_l })), spots,
      set.reg_weeks * (year >= D.median_era_start_year ? 2 : 1)) : null;
    // Schedule left, once the Worker answers: from next week on if
    // league.json already has the Worker's current week, else from it.
    let sos = null, hard = null;
    if (live) {
      askLive();
      if (LIVE) {
        const have = Math.max(0, ...D.games.filter(g => g.year === year && g.type === 'Reg' && g.winner !== 'In Progress').map(g => g.week));
        const skip = have >= LIVE.week ? 1 : 0;
        const recOf = new Map(rows.map(r => [r.player, { w: r.s.reg_w + r.s.med_w, l: r.s.reg_l + r.s.med_l }]));
        sos = rows.map(r => scheduleLeft((LIVE.ahead.get(r.player) || []).slice(skip), nm => recOf.get(nm)));
        hard = rankSchedules(sos);
      }
    }
    const legend = tab === 'reg' && complete
      ? '<div class="legend"><span><i style="background:var(--turf)"></i>Made the playoffs</span><span><i style="background:var(--line)"></i>Missed the playoffs</span></div>'
      : '';
    const note = year === 'all' ? 'Every season combined, current teams ranked by win percentage (former teams listed after). Median games count from 2025 on.' : year >= 2025 ? 'Wins and losses include the weekly median game.' : '';
    $('tabs').innerHTML = TABS.map(([k, l]) => `<button class="tab ${k === tab ? 'on' : ''}" data-t="${k}"${k === tab && note ? ` title="${esc(note)}"` : ''}>${l}</button>`).join('');
    // 18px above the first row (or the legend) matches the rows' 18px sides.
    $('standings-container').innerHTML = `<div class="glass">${legend}<div style="padding:${legend ? 14 : 18}px 18px 20px">${rows.map((r, k) => row(r, k, rows.length, tab, complete, year, race && race[k], sos && sos[k], hard && hard[k], live ? formOf(year, r.player) : null) + (spots && k === spots - 1 && rows.length > spots ? PLAYOFF_LINE : '')).join('')}</div></div>` +
      // Rank by Week: the season in progress, or a finished one's Regular Szn tab.
      (year !== 'all' && (live || tab === 'reg') ? bumpChart(year) : '');
    drawBump();
  }

  document.addEventListener('click', e => {
    const t = e.target.closest('[data-t]');
    if (t) { tab = t.dataset.t; render(); return; }
    const b = e.target.closest('#bump [data-m]');
    if (b) { bumpPick = bumpPick === b.dataset.m ? null : b.dataset.m; drawBump(); }
  });

  LG.load().then(data => {
    D = data;
    // A shared link's ?year=2024&tab=reg, where it names a real year and
    // tab. No year means this season; ?year=all is the All-Time table.
    if (TABS.some(([k]) => k === urlParam('tab'))) tab = urlParam('tab');
    yearOptions();
    const y = urlParam('year');
    if (data.years.includes(Number(y)) || (y === 'all' && tab !== 'bracket')) $('year-select').value = y;
    $('year-select').addEventListener('change', render);
    render();
    riseIn(document.querySelectorAll('#standings-container .qrow'));
  }).catch(err => LG.showError('standings-container', err));
</script>
<script src="track.js?v=2" defer></script>
</body>
