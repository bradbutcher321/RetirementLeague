     at the weights this site uses -- one variable-font file per family
     covers every weight declared, confirmed directly by fetching the
     stylesheet below and comparing each @font-face block's url(). Starts
     the actual font downloads immediately, in parallel with that
     stylesheet fetch, instead of waiting to discover these same URLs
     only after the stylesheet loads and is parsed -- avoids the
     fallback-to-webfont swap (FOUT) that otherwise shows on a slow or
     uncached load. If Google ever changes these hashed URLs, this just
     degrades to a wasted (unused) preload, not a correctness issue -- the
     stylesheet's own @font-face still fetches whatever the new URL is. -->
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/bigshouldersdisplay/v24/fC1_PZJEZG-e9gHhdI4-NBbfd2ys3SjJCx1czNDu.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2">

<style>
  .wrap.wide{ max-width: 1180px; }

  /* .selector-row and .board-select styling both live in theme.css. */

  /* The legend doubles as a filter (site audit 32): tap a position to dim
     every other one, tap more to add them. Each chip is a 44px tap target
     around a smaller pill. Tapping a manager's column header lights up just
     that column. Clear appears once anything is picked. */
  .legend{ display: flex; flex-wrap: wrap; align-items: center; gap: 0 6px; margin: -5px 0 11px; }
  .legend-chip{ height: 44px; padding: 0; border: none; background: none; cursor: pointer; font: inherit; color: var(--text-dim); }
  .legend-chip > span{
    display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 999px;
    border: 1px solid var(--ctl-line); background: var(--ctl-bg); font-size: 0.74rem; font-weight: 600;
    transition: background-color .2s, border-color .2s, color .2s;
  }
  .legend-chip:hover > span{ color: var(--text); }
  .legend-chip.on > span{ color: var(--text); border-color: var(--c); background: color-mix(in srgb, var(--c) 20%, transparent); }
  .legend-chip:focus-visible{ outline: none; }
  .legend-chip:focus-visible > span{ outline: 2px solid var(--gold); outline-offset: 2px; }
  .legend-swatch{ width: 10px; height: 10px; border-radius: 2px; }
  .legend-hint{ font-size: 0.72rem; color: var(--text-dim); margin-left: 4px; }
  .legend-clear{ height: 44px; padding: 0 6px; border: none; background: none; cursor: pointer; font: 600 0.74rem var(--body); color: var(--gold); }
  .pick-cell, .sb-pick, table.board thead th{ transition: opacity .25s ease; }
  .pick-cell.dim{ opacity: 0.16; }
  .sb-pick.dim{ opacity: 0.22; }
  table.board thead th.dim{ opacity: 0.4; }

  /* .board-toggle styling lives in theme.css with the other selectors. */

  /* ---------- Simple "by team" view: one column per manager, picks listed
     top to bottom, instead of the snake-order grid ---------- */
  .simple-label{ display: flex; align-items: center; gap: 10px; color: var(--text-dim); font-size: 0.74rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .simple-label::after{ content: ''; flex: 1; height: 1px; background: var(--line); }
  /* Hard-capped at 3 columns (rather than auto-fit's implicit count) --
     room for the pro-team column means 4-up got too tight for names --
     extra teams wrap to another row instead. Breakpoints are the narrowest
     viewports where every name in every year's draft fits uncut at that
     column count; anything tighter clipped most of the board. Below the
     first one, teams become full-width pages you swipe between instead of
     a twelve-team stack. */
  .sb-col{ padding: 22px 24px; }
  .sb-pager{ display: none; }
  @media (max-width: 799px){
    .sb-track{
      display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
      scrollbar-width: none; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch;
    }
    .sb-track::-webkit-scrollbar{ display: none; }
    /* One team per swipe, however hard the flick. */
    .sb-col{ flex: 0 0 100%; min-width: 0; scroll-snap-align: start; scroll-snap-stop: always; }
    .sb-pager{
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 18px; border-bottom: 1px solid var(--line);
    }
    .sb-step{
      flex: none; width: var(--track-h); height: var(--track-h); border-radius: 50%;
      border: 1px solid var(--ctl-line); background: var(--ctl-bg-solid); color: var(--text-dim);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .sb-step:hover:not(:disabled){ color: var(--text); }
    .sb-step:disabled{ opacity: 0.35; cursor: default; }
    .sb-step:focus-visible, .sb-dot:focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }
    .sb-step svg{ width: 16px; height: 16px; }
    .sb-dots{ display: flex; flex-wrap: wrap; justify-content: center; min-width: 0; }
    /* The dot itself is 6px; the padding is the tap target around it. */
    .sb-dot{ padding: 8px 4px; border: none; background: none; cursor: pointer; }
    .sb-dot i{
      display: block; width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.22);
      transition: width .3s ease, background-color .3s ease;
    }
    .sb-dot.on i{ width: 18px; background: var(--gold); }
  }
  @media (max-width: 799px) and (prefers-reduced-motion: reduce){
    .sb-dot i{ transition: none; }
  }
  @media (min-width: 800px){
    .sb-track{ display: grid; grid-template-columns: repeat(2, 1fr); }
    .sb-col:nth-child(n+3){ border-top: 1px solid var(--line); }
    .sb-col:nth-child(2n){ border-left: 1px solid var(--line); }
  }
  @media (min-width: 1160px){
    .sb-track{ grid-template-columns: repeat(3, 1fr); }
    .sb-col:nth-child(2n){ border-left: none; }
    .sb-col:nth-child(3n+2), .sb-col:nth-child(3n){ border-left: 1px solid var(--line); }
    .sb-col:nth-child(n+3){ border-top: none; }
    .sb-col:nth-child(n+4){ border-top: 1px solid var(--line); }
  }
  .sb-name{ color: var(--gold); font-weight: 700; font-size: 1.05rem; margin-bottom: 14px; }
  /* Fixed-width badge/pick-number/team columns so names line up in a
     straight column instead of drifting with each row's badge text
     length. Player name's own left margin (on top of the grid gap) gives
     it a little extra breathing room off the pick number specifically. */
  .sb-pick{ display: grid; grid-template-columns: 46px 30px 1fr 34px; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); }
  .sb-pick:first-of-type{ border-top: none; padding-top: 0; }
  .sb-badge{ display: flex; align-items: center; justify-content: center; font-family: var(--scoreboard); font-weight: 800; font-size: 0.6rem; color: #fff; padding: 3px 4px; border-radius: 5px; white-space: nowrap; overflow: hidden; }
  .sb-overall{ color: var(--text-dim); font-size: 0.78rem; font-variant-numeric: tabular-nums; }
  .sb-player{ font-weight: 600; font-size: 0.9rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-left: 4px; }
  .sb-team{ color: var(--text-dim); font-size: 0.68rem; font-weight: 600; text-transform: uppercase; text-align: right; white-space: nowrap; }
  @media (max-width: 799px){
    /* One team per page has room for every name except the odd outlier on
       a small phone (Marquez Valdes-Scantling at 375px) -- wrap that one
       rather than cut it. */
    .sb-player{ white-space: normal; }
  }
  @media (max-width: 720px){
    .sb-col{ padding: 16px 18px; }
  }

  /* Table width is intrinsic (cell size × column count) so it stays the
     same size across years and only grows wider when a year has more
     teams — never stretched to fill the container. */
  .board-scroll{ overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 2px; }
  table.board{ border-collapse: separate; border-spacing: 3px; width: auto; table-layout: fixed; }
  table.board th, table.board td{ padding: 0; }
  table.board thead th{
    width: 92px; background: var(--surface-raised); color: var(--text); font-family: var(--scoreboard);
    font-weight: 700; font-size: 0.78rem; padding: 8px 4px; text-align: center; white-space: nowrap;
    position: sticky; top: 0; z-index: 2; border-radius: 4px;
  }
  /* The header is a button that picks out the manager's column. */
  table.board thead th.mgr{ padding: 0; }
  .mgr-btn{ display: block; width: 100%; padding: 8px 4px; border: none; border-radius: 4px; background: none; color: inherit; font: inherit; cursor: pointer; }
  .mgr-btn:hover .slot-manager{ text-decoration: underline; text-underline-offset: 2px; }
  .mgr-btn:focus-visible{ outline: 2px solid var(--gold); outline-offset: -2px; }
  table.board thead th.on{ box-shadow: inset 0 0 0 1px var(--gold); }
  table.board thead th .slot-manager{ display: block; color: var(--gold); font-size: 0.74rem; margin-bottom: 2px; }
  table.board thead th .slot-team{ display: block; color: var(--text-dim); font-weight: 500; font-size: 0.64rem; max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin: 0 auto; }

  .pick-cell{
    width: 92px; height: 64px; padding: 6px 6px !important; vertical-align: top;
    background: var(--surface-raised); border: 1px solid var(--line); border-radius: 5px; overflow: hidden;
    position: relative; color: var(--text);
  }
  .pick-top{ display: flex; align-items: center; justify-content: space-between; gap: 4px; overflow: hidden; }
  .pick-tag{ display: flex; align-items: center; gap: 3px; min-width: 0; overflow: hidden; }
  .pick-rank{
    flex-shrink: 0; font-weight: 800; font-size: 0.64rem; font-family: var(--scoreboard);
    color: #fff; padding: 1px 5px; border-radius: 3px; letter-spacing: 0.01em; white-space: nowrap;
  }
  .pick-team{
    color: #111; font-weight: 700; font-size: 0.58rem;
    background: rgba(255,255,255,0.88); padding: 1px 4px; border-radius: 3px;
    white-space: nowrap; overflow: hidden;
  }
  .pick-overall{ flex-shrink: 0; font-size: 0.6rem; font-variant-numeric: tabular-nums; color: var(--text-dim); white-space: nowrap; }
  .pick-player{ font-size: 0.72rem; font-weight: 700; line-height: 1.18; margin-top: 4px; white-space: nowrap; overflow: hidden; color: var(--text); }
  .pick-player span{ display: block; }
  .pick-arrow{ position: absolute; bottom: 2px; right: 4px; font-size: 0.62rem; line-height: 1; color: var(--text-dim); }
  .pick-keeper{
    position: absolute; top: 2px; right: 2px; width: 8px; height: 8px; border-radius: 50%;
    background: var(--gold); box-shadow: 0 0 0 1px rgba(0,0,0,0.4);
  }
  .pick-empty{ color: var(--text-dim); font-size: 0.7rem; text-align: center; padding-top: 22px !important; height: 100%; }

  /* Position color coding — tinted glass: a soft wash + border, with the
     rank as a solid-color pill so the position still reads at a glance
     without a full-bleed saturated card on every one of 150+ picks. */
  .pos-QB{ background: rgba(224,100,79,0.16); border-color: rgba(224,100,79,0.45); } .pos-QB .pick-rank{ background: #E0644F; }
  .pos-RB{ background: rgba(76,154,107,0.18); border-color: rgba(76,154,107,0.45); } .pos-RB .pick-rank{ background: #4C9A6B; }
  .pos-WR{ background: rgba(74,144,217,0.18); border-color: rgba(74,144,217,0.45); } .pos-WR .pick-rank{ background: #4A90D9; }
  .pos-TE{ background: rgba(217,133,47,0.18); border-color: rgba(217,133,47,0.45); } .pos-TE .pick-rank{ background: #D9852F; }
  .pos-K{ background: rgba(155,107,196,0.18); border-color: rgba(155,107,196,0.45); } .pos-K .pick-rank{ background: #9B6BC4; }
  .pos-DST{ background: rgba(138,138,133,0.18); border-color: rgba(138,138,133,0.45); } .pos-DST .pick-rank{ background: #8A8A85; }
  .pos-none{ background: var(--surface-raised); color: var(--text-dim); }

  @media (max-width: 480px){
    .pick-cell{ width: 78px; height: 60px; }
    table.board thead th{ width: 78px; }
  }
</style>
</head>

eight:16px"></i><i style="width:22%;height:10px"></i></div><i style="width:76%;height:13px"></i><i style="width:58%;height:13px"></i></div><div class="sk-item" style="padding:10px;gap:8px"><div class="sk-row"><i style="width:56%;height:16px"></i><i style="width:22%;height:10px"></i></div><i style="width:76%;height:13px"></i><i style="width:58%;height:13px"></i></div></div></div></div>

<script src="page-common.js?v=10"></script>
<script>
  const POSITION_COLORS = {
    QB: '#E0644F', RB: '#4C9A6B', WR: '#4A90D9', TE: '#D9852F', K: '#9B6BC4', 'D/ST': '#8A8A85',
  };
  const posClass = pos => pos ? 'pos-' + pos.replace('/', '') : 'pos-none';

  // Only the positions this year's draft actually contains. Kickers left the
  // roster after 2019 and D/ST after 2022 (see Rule Changes), so a fixed
  // six-chip legend promised two colors that never appear on a modern board.
  // Order follows POSITION_COLORS, not order of appearance, so the legend
  // doesn't reshuffle as you move between years.
  // grid is {round: {slot: pick}} -- both levels are objects keyed by number
  // as a string, not arrays, so both need Object.values.
  function positionsIn(board) {
    const seen = new Set();
    Object.values(board.grid || {}).forEach(round =>
      Object.values(round || {}).forEach(pick => { if (pick && pick.position) seen.add(pick.position); })
    );
    return seen;
  }

  // Filters (site audit 32): positions picked in the legend, and one
  // manager picked from the grid's column headers. Both survive switching
  // year or view. A pick stays lit when it matches every active filter.
  const posFilter = new Set();
  let mgrFilter = null;

  function renderLegend(board) {
    const seen = board ? positionsIn(board) : new Set(Object.keys(POSITION_COLORS));
    const chips = Object.entries(POSITION_COLORS)
      .filter(([pos]) => seen.has(pos))
      .map(([pos, color]) =>
        `<button type="button" class="legend-chip${posFilter.has(pos) ? ' on' : ''}" data-pos="${pos}" aria-pressed="${posFilter.has(pos)}" style="--c:${color}"><span><span class="legend-swatch" style="background:${color}"></span>${pos}</span></button>`
      ).join('');
    const tail = posFilter.size || mgrFilter
      ? '<button type="button" class="legend-clear" data-clear>Clear</button>'
      : `<span class="legend-hint">Pick to highlight</span>`;
    return chips + tail;
  }

  // Dims whatever the filters leave out, in whichever view is showing. The
  // manager filter only applies to the grid, where it has columns to pick.
  function applyFilters() {
    const posOk = pos => !posFilter.size || posFilter.has(pos);
    const mgrOk = mgr => !mgrFilter || mgr === mgrFilter;
    boardContainer.querySelectorAll('.pick-cell[data-mgr]').forEach(td => {
      td.classList.toggle('dim', !(posOk(td.dataset.pos) && mgrOk(td.dataset.mgr)));
    });
    boardContainer.querySelectorAll('thead th.mgr').forEach(th => {
      th.classList.toggle('on', mgrFilter === th.dataset.mgr);
      th.classList.toggle('dim', Boolean(mgrFilter) && mgrFilter !== th.dataset.mgr);
      th.querySelector('.mgr-btn').setAttribute('aria-pressed', String(mgrFilter === th.dataset.mgr));
    });
    boardContainer.querySelectorAll('.sb-pick[data-pos]').forEach(row => row.classList.toggle('dim', !posOk(row.dataset.pos)));
  }

  function splitName(name) {
    const parts = name.trim().split(/\s+/);
    if (parts.length === 1) return [parts[0], ''];
    return [parts[0], parts.slice(1).join(' ')];
  }

  function renderCell(pick, round, teamCount, arrow, manager) {
    if (!pick || !pick.player_name) {
      return `<td class="pick-cell pos-none" data-mgr="${esc(manager)}" data-pos=""><div class="pick-empty">—</div></td>`;
    }
    const pickInRound = pick.overall - (round - 1) * teamCount;
    const [first, last] = splitName(pick.player_name);
    return `
      <td class="pick-cell ${posClass(pick.position)}" data-mgr="${esc(manager)}" data-pos="${esc(pick.position || '')}">
        ${pick.keeper ? '<div class="pick-keeper" title="Keeper"></div>' : ''}
        <div class="pick-top">
          <span class="pick-tag">
            <span class="pick-rank">${esc(pick.position_rank || pick.position || '')}</span>
            ${pick.pro_team ? `<span class="pick-team">${esc(pick.pro_team)}</span>` : ''}
          </span>
          <span class="pick-overall">${round}.${pickInRound}</span>
        </div>
        <div class="pick-player"><span>${esc(first)}</span>${last ? `<span>${esc(last)}</span>` : ''}</div>
        ${arrow ? `<div class="pick-arrow">${arrow}</div>` : ''}
      </td>`;
  }

  function renderBoard(board) {
    const teamCount = board.team_count;
    const lastRound = board.rounds[board.rounds.length - 1];
    const headerCells = board.columns.map(c => `
      <th class="mgr" data-mgr="${esc(c.manager || '')}">
        <button type="button" class="mgr-btn" aria-pressed="false" aria-label="Highlight ${esc(c.manager || '')}'s picks">
          <span class="slot-manager">${esc(c.manager || '')}</span>
          <span class="slot-team">${esc(c.team_name || '')}</span>
        </button>
      </th>`).join('');

    const rows = board.rounds.map(round => {
      const ascending = round % 2 === 1;
      const turnSlot = ascending ? teamCount : 1;
      const cells = board.columns.map(c => {
        const isTurn = c.slot === turnSlot;
        const arrow = isTurn ? (round === lastRound ? '' : '↓') : (ascending ? '→' : '←');
        return renderCell(board.grid[round] && board.grid[round][c.slot], round, teamCount, arrow, c.manager || '');
      }).join('');
      return `<tr>${cells}</tr>`;
    }).join('');

    return `
      <div class="board-scroll">
        <table class="board">
          <thead><tr>${headerCells}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  // One column per manager, picks listed top to bottom in draft order --
  // an alternative to the snake-order grid for reading "what did my team
  // draft" at a glance instead of "who was on the clock when."
  function renderSimpleBoard(board) {
    const teamCount = board.team_count;
    const firstRound = board.rounds[0], lastRound = board.rounds[board.rounds.length - 1];
    const roundLabel = firstRound === lastRound ? `Round ${firstRound}` : `Rounds ${firstRound}–${lastRound}`;
    const cols = board.columns.map(c => {
      const rows = board.rounds.map(r => {
        const pick = board.grid[r] && board.grid[r][c.slot];
        if (!pick || !pick.player_name) return '';
        const pickInRound = pick.overall - (r - 1) * teamCount;
        const color = POSITION_COLORS[pick.position] || '#8A8A85';
        return `
          <div class="sb-pick" data-pos="${esc(pick.position || '')}">
            <span class="sb-badge" style="background:${color}">${esc(pick.position_rank || pick.position || '')}</span>
            <span class="sb-overall">${r}.${pickInRound}</span>
            <span class="sb-player">${esc(pick.player_name)}</span>
            <span class="sb-team">${pick.pro_team ? esc(pick.pro_team) : 'FA'}</span>
          </div>`;
      }).join('');
      return `<div class="sb-col" data-manager="${esc(c.manager || '')}"><div class="sb-name">${esc(c.manager || '')}</div>${rows}</div>`;
    }).join('');
    // Pager only shows on phones, where the track swipes one team at a time
    // (see .sb-track); on wider screens every team is on screen at once.
    const chevron = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
    const dots = board.columns.map((c, i) =>
      `<button type="button" class="sb-dot" data-goto="${i}" aria-label="${esc(c.manager || '')}"><i></i></button>`).join('');
    const pager = `
      <div class="sb-pager">
        <button type="button" class="sb-step" data-step="-1" aria-label="Previous team">${chevron('m15 18-6-6 6-6')}</button>
        <div class="sb-dots">${dots}</div>
        <button type="button" class="sb-step" data-step="1" aria-label="Next team">${chevron('m9 18 6-6-6-6')}</button>
      </div>`;
    return `<div class="simple-label">${roundLabel}</div><div class="glass simple-board">${pager}<div class="sb-track">${cols}</div></div>`;
  }

  // By Team on a phone: which team page is showing. Kept by manager name
  // rather than position so switching years stays on the same person even
  // when draft slots change.
  let sbManager = null;
  const boardContainer = document.getElementById('board-container');

  // Exact page width, not clientWidth: that's rounded to whole pixels, and
  // the rounding error adds up a pixel or two by the last few teams.
  const sbWidth = track => track.getBoundingClientRect().width;
  const sbIndex = track => sbWidth(track) ? Math.round(track.scrollLeft / sbWidth(track)) : 0;

  function syncPager(track) {
    const i = sbIndex(track), n = track.children.length;
    boardContainer.querySelectorAll('.sb-dot').forEach((d, j) => {
      d.classList.toggle('on', j === i);
      d.setAttribute('aria-current', j === i ? 'true' : 'false');
    });
    boardContainer.querySelector('[data-step="-1"]').disabled = i <= 0;
    boardContainer.querySelector('[data-step="1"]').disabled = i >= n - 1;
    if (track.children[i]) sbManager = track.children[i].dataset.manager;
  }

  function goToTeam(track, i, smooth) {
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    track.scrollTo({ left: i * sbWidth(track), behavior: smooth && !reduce ? 'smooth' : 'auto' });
  }

  // Scroll doesn't bubble, so listen in the capture phase -- this one
  // listener survives every re-render of the board's innerHTML.
  boardContainer.addEventListener('scroll', e => {
    if (e.target.classList && e.target.classList.contains('sb-track')) syncPager(e.target);
  }, true);
  boardContainer.addEventListener('click', e => {
    const btn = e.target.closest('[data-step], [data-goto]');
    const track = boardContainer.querySelector('.sb-track');
    if (!btn || !track) return;
    const i = btn.dataset.goto != null ? +btn.dataset.goto : sbIndex(track) + +btn.dataset.step;
    goToTeam(track, Math.max(0, Math.min(track.children.length - 1, i)), true);
  });

  let boardView = 'grid';
  const viewToggle = document.getElementById('view-toggle');

  fetch('data/draft-board.json', { cache: 'no-store' })
    .then(res => res.json())
    .then(data => {
      const sel = document.getElementById('year-select');
      sel.innerHTML = data.years.map(y => `<option value="${y}">${y}</option>`).join('');
      document.getElementById('updated-at').textContent = formatUpdated(data.generated_at);

      function show(year) {
        const board = data.boards[year];
        // Legend is redrawn per year, not once at load -- which positions
        // exist changes with the era's roster rules.
        document.getElementById('legend').innerHTML = renderLegend(board);
        document.getElementById('board-container').innerHTML = !board
          ? '<div class="empty-note">No draft data for this year.</div>'
          : boardView === 'simple' ? renderSimpleBoard(board) : renderBoard(board);
        applyFilters();
        const track = boardContainer.querySelector('.sb-track');
        if (track) {
          const cols = [...track.children];
          const i = Math.max(0, cols.findIndex(c => c.dataset.manager === sbManager));
          goToTeam(track, i, false);
          syncPager(track);
        }
      }
      sel.value = data.years[0];
      show(sel.value);
      riseIn(document.getElementById('board-container').children);
      sel.addEventListener('change', () => show(sel.value));
      // A filter change only re-dims the board in place; the legend redraws
      // for its on/off states and the Clear button.
      const refilter = () => {
        document.getElementById('legend').innerHTML = renderLegend(data.boards[sel.value]);
        applyFilters();
      };
      document.getElementById('legend').addEventListener('click', e => {
        const chip = e.target.closest('[data-pos]');
        if (chip) {
          const pos = chip.dataset.pos;
          if (posFilter.has(pos)) posFilter.delete(pos); else posFilter.add(pos);
        } else if (e.target.closest('[data-clear]')) {
          posFilter.clear();
          mgrFilter = null;
        } else return;
        refilter();
      });
      boardContainer.addEventListener('click', e => {
        const th = e.target.closest('th.mgr');
        if (!th) return;
        mgrFilter = mgrFilter === th.dataset.mgr ? null : th.dataset.mgr;
        refilter();
      });
      viewToggle.addEventListener('click', e => {
        const btn = e.target.closest('[data-view]');
        if (!btn) return;
        boardView = btn.dataset.view;
        [...viewToggle.children].forEach(b => b.classList.toggle('on', b === btn));
        show(sel.value);
      });
    })
    .catch(err => {
      console.error('Draft board data error:', err);
      document.getElementById('board-container').innerHTML = '<div class="loading-row" style="color:var(--loss);">Error loading draft board data.</div>';
    });
</script>
<script src="track.js?v=1" defer></script>
</body>
</html>
