<title>Retirement League — Draft Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The two font-family's woff2 files Google serves for the latin subset
     at the weights this site uses -- one variable-font file per family
     covers every weight declared, confirmed directly by fetching the
     stylesheet below and comparing each @font-face block's url(). Starts
     the actual font downloads immediately, in parallel with that
     stylesheet fetch, instead of waiting to discover these same URLs
     only after the stylesheet loads and is parsed -- avoids the
     fallback-to-webfont swap (FOUT) that otherwise shows on a slow or
     uncached load. If Google ever changes these hashed URLs, this just
     degrades to a wasted (unused) preload, not a correctness issue -- the
     stylesheet's own @font-face still fetches whatever the new URL is. -->
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/bigshouldersdisplay/v24/fC1_PZJEZG-e9gHhdI4-NBbfd2ys3SjJCx1czNDu.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=32">
<link rel="stylesheet" href="nav.css?v=24">
<style>
  .wrap.wide{ max-width: 1180px; }

  /* .selector-row and .board-select styling both live in theme.css. */

  /* The legend doubles as a filter (site audit 32): tap a position to dim
     every other one, tap more to add them. Each chip is a 44px tap target
     around a smaller pill. Tapping a manager's column header lights up just
     that column. Clear appears once anything is picked. */
  .legend{ display: flex; flex-wrap: wrap; align-items: center; gap: 0 6px; margin: -5px 0 11px; }
  .legend-chip{ height: 44px; padding: 0; border: none; background: none; cursor: pointer; font: inherit; color: var(--text-dim); }
  .legend-chip > span{
    display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 999px;
    border: 1px solid var(--ctl-line); background: var(--ctl-bg); font-size: 0.74rem; font-weight: 600;
    transition: background-color .2s, border-color .2s, color .2s;
  }
  @media (hover: hover){
    .legend-chip:hover > span{ color: var(--text); }
  }
  .legend-chip.on > span{ color: var(--text); border-color: var(--c); background: color-mix(in srgb, var(--c) 20%, transparent); }
  .legend-chip:focus-visible{ outline: none; }
  .legend-chip:focus-visible > span{ outline: 2px solid var(--gold); outline-offset: 2px; }
  .legend-swatch{ width: 10px; height: 10px; border-radius: 2px; }
  .legend-hint{ font-size: 0.72rem; color: var(--text-dim); margin-left: 4px; }
  .legend-clear{ height: 44px; padding: 0 6px; border: none; background: none; cursor: pointer; font: 600 0.74rem var(--body); color: var(--gold); }
  .pick-cell, .sb-pick, table.board thead th{ transition: opacity .25s ease; }
  .pick-cell.dim{ opacity: 0.16; }
  .pick-cell.found{ outline: 2px solid var(--gold); outline-offset: 1px; }
  .sb-pick.dim{ opacity: 0.22; }
  table.board thead th.dim{ opacity: 0.4; }

  /* .board-toggle styling lives in theme.css with the other selectors. */
  /* A third view (Value) made View + Year too wide for one row on a phone;
     as on Standings, the captions go there (kept for screen readers) -- the
     buttons and "2022" say what they are. */
  @media (max-width:600px){
    .selector-row .selector-label{ position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
  }

  /* ---------- Simple "by team" view: one column per manager, picks listed
     top to bottom, instead of the snake-order grid ---------- */
  .simple-label{ display: flex; align-items: center; gap: 10px; color: var(--text-dim); font-size: 0.74rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .simple-label::after{ content: ''; flex: 1; height: 1px; background: var(--line); }
  /* Hard-capped at 3 columns (rather than auto-fit's implicit count) --
     room for the pro-team column means 4-up got too tight for names --
     extra teams wrap to another row instead. Breakpoints are the narrowest
     viewports where every name in every year's draft fits uncut at that
     column count; anything tighter clipped most of the board. Below the
     first one, teams become full-width pages you swipe between instead of
     a twelve-team stack. */
  .sb-col{ padding: 22px 24px; }
  .sb-pager{ display: none; }
  @media (max-width: 799px){
    .sb-track{
      display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
      scrollbar-width: none; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch;
    }
    .sb-track::-webkit-scrollbar{ display: none; }
    /* One team per swipe, however hard the flick. */
    .sb-col{ flex: 0 0 100%; min-width: 0; scroll-snap-align: start; scroll-snap-stop: always; }
    .sb-pager{
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 18px; border-bottom: 1px solid var(--line);
    }
    .sb-step{
      flex: none; width: var(--track-h); height: var(--track-h); border-radius: 50%;
      border: 1px solid var(--ctl-line); background: var(--ctl-bg-solid); color: var(--text-dim);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    @media (hover: hover){
      .sb-step:hover:not(:disabled){ color: var(--text); }
    }
    .sb-step:disabled{ opacity: 0.35; cursor: default; }
    .sb-step:focus-visible, .sb-dot:focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }
    .sb-step svg{ width: 16px; height: 16px; }
    .sb-dots{ display: flex; flex-wrap: wrap; justify-content: center; min-width: 0; }
    /* The dot itself is 6px; the padding is the tap target around it. */
    .sb-dot{ padding: 8px 4px; border: none; background: none; cursor: pointer; }
    .sb-dot i{
      display: block; width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.22);
      transition: width .3s ease, background-color .3s ease;
    }
    .sb-dot.on i{ width: 18px; background: var(--gold); }
  }
  @media (max-width: 799px) and (prefers-reduced-motion: reduce){
    .sb-dot i{ transition: none; }
  }
  @media (min-width: 800px){
    .sb-track{ display: grid; grid-template-columns: repeat(2, 1fr); }
    .sb-col:nth-child(n+3){ border-top: 1px solid var(--line); }
    .sb-col:nth-child(2n){ border-left: 1px solid var(--line); }
  }
  @media (min-width: 1160px){
    .sb-track{ grid-template-columns: repeat(3, 1fr); }
    .sb-col:nth-child(2n){ border-left: none; }
    .sb-col:nth-child(3n+2), .sb-col:nth-child(3n){ border-left: 1px solid var(--line); }
    .sb-col:nth-child(n+3){ border-top: none; }
    .sb-col:nth-child(n+4){ border-top: 1px solid var(--line); }
  }
  .sb-name{ color: var(--gold); font-weight: 700; font-size: 1.05rem; margin-bottom: 14px; }
  /* Fixed-width badge/pick-number/team columns so names line up in a
     straight column instead of drifting with each row's badge text
     length. Player name's own left margin (on top of the grid gap) gives
     it a little extra breathing room off the pick number specifically. */
  .sb-pick{ display: grid; grid-template-columns: 46px 30px 1fr 34px; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); }
  .sb-pick:first-of-type{ border-top: none; padding-top: 0; }
  .sb-badge{ display: flex; align-items: center; justify-content: center; font-family: var(--scoreboard); font-weight: 800; font-size: 0.6rem; color: #fff; padding: 3px 4px; border-radius: 5px; white-space: nowrap; overflow: hidden; }
  .sb-overall{ color: var(--text-dim); font-size: 0.78rem; font-variant-numeric: tabular-nums; }
  .sb-player{ font-weight: 600; font-size: 0.9rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-left: 4px; }
  .sb-team{ color: var(--text-dim); font-size: 0.68rem; font-weight: 600; text-transform: uppercase; text-align: right; white-space: nowrap; }
  @media (max-width: 799px){
    /* One team per page has room for every name except the odd outlier on
       a small phone (Marquez Valdes-Scantling at 375px) -- wrap that one
       rather than cut it. */
    .sb-player{ white-space: normal; }
  }
  @media (max-width: 720px){
    .sb-col{ padding: 16px 18px; }
  }

  /* Table width is intrinsic (cell size × column count) so it stays the
     same size across years and only grows wider when a year has more
     teams — never stretched to fill the container. */
  .board-scroll{ overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 2px; }
  table.board{ border-collapse: separate; border-spacing: 3px; width: auto; table-layout: fixed; }
  table.board th, table.board td{ padding: 0; }
  table.board thead th{
    width: 92px; background: var(--surface-raised); color: var(--text); font-family: var(--scoreboard);
    font-weight: 700; font-size: 0.78rem; padding: 8px 4px; text-align: center; white-space: nowrap;
    position: sticky; top: 0; z-index: 2; border-radius: 4px;
  }
  /* The header is a button that picks out the manager's column. */
  table.board thead th.mgr{ padding: 0; }
  .mgr-btn{ display: block; width: 100%; padding: 8px 4px; border: none; border-radius: 4px; background: none; color: inherit; font: inherit; cursor: pointer; }
  @media (hover: hover){
    .mgr-btn:hover .slot-manager{ text-decoration: underline; text-underline-offset: 2px; }
  }
  .mgr-btn:focus-visible{ outline: 2px solid var(--gold); outline-offset: -2px; }
  table.board thead th.on{ box-shadow: inset 0 0 0 1px var(--gold); }
  table.board thead th .slot-manager{ display: block; color: var(--gold); font-size: 0.74rem; margin-bottom: 2px; }
  table.board thead th .slot-team{ display: block; color: var(--text-dim); font-weight: 500; font-size: 0.64rem; max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin: 0 auto; }

  .pick-cell{
    width: 92px; height: 64px; padding: 6px 6px !important; vertical-align: top;
    background: var(--surface-raised); border: 1px solid var(--line); border-radius: 5px; overflow: hidden;
    position: relative; color: var(--text);
  }
  .pick-top{ display: flex; align-items: center; justify-content: space-between; gap: 4px; overflow: hidden; }
  .pick-tag{ display: flex; align-items: center; gap: 3px; min-width: 0; overflow: hidden; }
  .pick-rank{
    flex-shrink: 0; font-weight: 800; font-size: 0.64rem; font-family: var(--scoreboard);
    color: #fff; padding: 1px 5px; border-radius: 3px; letter-spacing: 0.01em; white-space: nowrap;
  }
  .pick-team{
    color: #111; font-weight: 700; font-size: 0.58rem;
    background: rgba(255,255,255,0.88); padding: 1px 4px; border-radius: 3px;
    white-space: nowrap; overflow: hidden;
  }
  .pick-overall{ flex-shrink: 0; font-size: 0.6rem; font-variant-numeric: tabular-nums; color: var(--text-dim); white-space: nowrap; }
  .pick-player{ font-size: 0.72rem; font-weight: 700; line-height: 1.18; margin-top: 4px; white-space: nowrap; overflow: hidden; color: var(--text); }
  .pick-player span{ display: block; }
  .pick-arrow{ position: absolute; bottom: 2px; right: 4px; font-size: 0.62rem; line-height: 1; color: var(--text-dim); }
  .pick-keeper{
    position: absolute; top: 2px; right: 2px; width: 8px; height: 8px; border-radius: 50%;
    background: var(--gold); box-shadow: 0 0 0 1px rgba(0,0,0,0.4);
  }
  .pick-empty{ color: var(--text-dim); font-size: 0.7rem; text-align: center; padding-top: 22px !important; height: 100%; }

  /* Position color coding — tinted glass: a soft wash + border, with the
     rank as a solid-color pill so the position still reads at a glance
     without a full-bleed saturated card on every one of 150+ picks. */
  .pos-QB{ background: rgba(224,100,79,0.16); border-color: rgba(224,100,79,0.45); } .pos-QB .pick-rank{ background: #E0644F; }
  .pos-RB{ background: rgba(76,154,107,0.18); border-color: rgba(76,154,107,0.45); } .pos-RB .pick-rank{ background: #4C9A6B; }
  .pos-WR{ background: rgba(74,144,217,0.18); border-color: rgba(74,144,217,0.45); } .pos-WR .pick-rank{ background: #4A90D9; }
  .pos-TE{ background: rgba(217,133,47,0.18); border-color: rgba(217,133,47,0.45); } .pos-TE .pick-rank{ background: #D9852F; }
  .pos-K{ background: rgba(155,107,196,0.18); border-color: rgba(155,107,196,0.45); } .pos-K .pick-rank{ background: #9B6BC4; }
  .pos-DST{ background: rgba(138,138,133,0.18); border-color: rgba(138,138,133,0.45); } .pos-DST .pick-rank{ background: #8A8A85; }
  .pos-none{ background: var(--surface-raised); color: var(--text-dim); }

  @media (max-width: 480px){
    .pick-cell{ width: 78px; height: 60px; }
    table.board thead th{ width: 78px; }
  }

  /* ---------- Draft value (site audit II #33) ----------
     Each pick's regular-season points as a starter for the team that drafted
     him (data/draft-value.json), bottom left of its cell -- the cells grow a
     line for it -- and as a column in By Team. */
  table.board.has-pts .pick-cell{ height: 76px; }
  @media (max-width: 480px){ table.board.has-pts .pick-cell{ height: 72px; } }
  .pick-pts{ position: absolute; bottom: 3px; left: 6px; font-size: 0.62rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); opacity: 0.8; line-height: 1; }
  .simple-board.has-pts .sb-pick{ grid-template-columns: 46px 30px 1fr 34px 44px; }
  .sb-pts{ text-align: right; font-size: 0.78rem; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* The Value view: the draft's best value and biggest bust, then every
     manager's draft graded against that year's field. */
  .dv-note{ color: var(--text-dim); font-size: 0.74rem; padding: 4px 22px 0; }
  .dv-pair{ margin-bottom: 14px; }
  .dv-item{ padding: 14px 16px; }
  .dv-top{ display: flex; align-items: center; gap: 8px; min-width: 0; }
  .dv-name{ font-weight: 700; font-size: 1rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dv-meta{ color: var(--text-dim); font-size: 0.74rem; margin-top: 6px; }
  .dv-v{ display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .dv-v b{ font-family: var(--scoreboard); font-size: 1.5rem; font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; }
  .dv-v span{ color: var(--text-dim); font-size: 0.74rem; }
  .dv-v .win{ color: var(--turf); font-weight: 600; }
  .dv-v .loss{ color: var(--loss); font-weight: 600; }
  .chip{ font-size: 0.7rem; font-weight: 600; color: var(--text-dim); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  /* The grade takes the rank column: a letter in a rounded square, coloured
     only where it means something (A/B good, D/F bad), the letter always
     saying it too. */
  .dv-list .qrow{ grid-template-columns: 34px minmax(0,1fr) auto; }
  a.qrow{ color: inherit; text-decoration: none; }
  a.qrow:focus-visible{ outline: 2px solid var(--gold); outline-offset: -2px; }
  .grade{ width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-family: var(--scoreboard); font-weight: 800; font-size: 1.15rem; border: 1px solid var(--item-line); background: var(--item); color: var(--text); }
  .grade.g-A, .grade.g-B{ color: var(--turf); border-color: var(--win-line); background: var(--win-tint); }
  .grade.g-D, .grade.g-F{ color: var(--loss); border-color: var(--loss-line); background: var(--loss-tint); }
  .dv-list .meta{ line-height: 1.5; }
  .dv-list .meta .win{ color: var(--turf); } .dv-list .meta .loss{ color: var(--loss); }

  /* ---------- Draft Day Live (site audit III #17) ----------
     The Live view: who is on the clock, the latest pick graded against where
     ESPN's average draft position said he'd go, the grid filling in, and a
     TV mode for the draft-party screen. A pick's delta is how many spots
     after (+) or before (−) his ADP he went. */
  .board-toggle button[hidden]{ display: none; }
  .selector-row.live-on #year-group{ display: none; }
  .lv-top{ display: grid; gap: 14px; margin-bottom: 14px; }
  @media (min-width: 700px){ .lv-top{ grid-template-columns: 1fr 1fr; } }
  .lv-top .panel-body{ padding: 12px 14px 14px; }
  .lv-item{ padding: 14px 16px; }
  .lv-who{ font-family: var(--scoreboard); font-weight: 800; font-size: 2.3rem; line-height: 1; color: var(--gold); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lv-sub{ color: var(--text-dim); font-size: 0.78rem; margin-top: 6px; }
  .lv-next{ display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .lv-next .chip b{ color: var(--text); font-weight: 600; }
  .lv-btns{ display: flex; align-items: center; gap: 8px; }
  .lv-tv{ height: 44px; padding: 0 4px; border: none; background: none; cursor: pointer; font: 600 0.74rem var(--body); color: var(--gold); }
  .lv-tv:focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 8px; }
  .lv-exit{ display: none; }
  .lv-extra{ display: grid; gap: 14px; margin-top: 14px; }
  @media (max-width: 699px){ .lv-tv{ display: none; } }
  @media (min-width: 900px){ .lv-extra{ grid-template-columns: 1fr 1fr; align-items: start; } }
  .lv-list{ display: grid; gap: 6px; padding: 12px 14px 14px; }
  .lv-row{ display: grid; grid-template-columns: 40px minmax(0,1fr) auto; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; background: var(--item); border: 1px solid var(--item-line); }
  .lv-row.steal{ border-color: var(--win-line); background: var(--win-tint); }
  .lv-row.reach{ border-color: var(--loss-line); background: var(--loss-tint); }
  .lv-no{ color: var(--text-dim); font-family: var(--scoreboard); font-size: 0.95rem; text-align: center; font-variant-numeric: tabular-nums; }
  .lv-nm{ font-weight: 600; font-size: 0.9rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lv-mt{ color: var(--text-dim); font-size: 0.72rem; margin-top: 1px; }
  .lv-delta{ font-family: var(--scoreboard); font-weight: 700; font-size: 1.05rem; font-variant-numeric: tabular-nums; color: var(--text-dim); white-space: nowrap; }
  .lv-delta.up{ color: var(--turf); } .lv-delta.down{ color: var(--loss); }
  .chip.up{ color: var(--turf); border-color: var(--win-line); background: var(--win-tint); }
  .chip.down{ color: var(--loss); border-color: var(--loss-line); background: var(--loss-tint); }
  .pick-pts.lv-d{ opacity: 1; }
  .pick-pts.lv-d.up{ color: var(--turf); } .pick-pts.lv-d.down{ color: var(--loss); }
  .pick-cell.clock{ outline: 2px solid var(--gold); outline-offset: 1px; background: rgba(212,180,106,0.10); animation: lv-clock 1.8s ease-in-out infinite; }
  .pick-cell.clock .pick-empty{ color: var(--gold); font-weight: 700; }
  .pick-cell.fresh{ animation: lv-in .5s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes lv-clock{ 50%{ background: rgba(212,180,106,0.03); } }
  @keyframes lv-in{ from{ transform: scale(0.88); opacity: 0; } }
  @media (prefers-reduced-motion: reduce){ .pick-cell.clock, .pick-cell.fresh{ animation: none; } }
  /* TV mode: only the clock, the latest pick and the grid, the grid scaled
     to whatever screen it is on (tvFit in the page script). */
  body.tv #site-nav, body.tv header, body.tv .selector-row, body.tv #legend, body.tv footer, body.tv .lv-extra, body.tv .lv-tv{ display: none; }
  body.tv .wrap.wide{ max-width: none; padding: 10px 16px; }
  body.tv .lv-top{ grid-template-columns: 1fr 1fr; margin-bottom: 10px; }
  body.tv .board-scroll{ overflow: hidden; }
  body.tv .lv-exit{ display: flex; align-items: center; justify-content: center; position: fixed; bottom: 10px; right: 10px; z-index: 50; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--ctl-line); background: var(--ctl-bg-solid); color: var(--text-dim); cursor: pointer; font-size: 1rem; }
</style>
</head>
<body>
  <div id="site-nav"></div>
  <div class="wrap wide">
    <header>
      <div class="header-row">
        <div>
          <div class="eyebrow">Retirement League</div>
          <h1>Draft Board</h1>
        </div>
        <div class="updated-block">
          <div class="updated-label">Updated</div>
          <div class="updated-value" id="updated-at">—</div>
        </div>
      </div>
    </header>

    <section>
      <!-- Both controls sit against the board's right edge, Year last, so the
           thing you change most often is closest to the board's top-right
           corner rather than floating off at the far left of the page. -->
      <div class="selector-row right">
        <!-- Labelled because it shares a row with the labelled Year
             dropdown; an unlabelled control next to a labelled one reads as
             part of it. -->
        <div class="selector-group">

<script>
  const POSITION_COLORS = {
    QB: '#E0644F', RB: '#4C9A6B', WR: '#4A90D9', TE: '#D9852F', K: '#9B6BC4', 'D/ST': '#8A8A85',
  };
  const posClass = pos => pos ? 'pos-' + pos.replace('/', '') : 'pos-none';

  // Only the positions this year's draft actually contains. Kickers left the
  // roster after 2019 and D/ST after 2022 (see Rule Changes), so a fixed
  // six-chip legend promised two colors that never appear on a modern board.
  // Order follows POSITION_COLORS, not order of appearance, so the legend
  // doesn't reshuffle as you move between years.
  // grid is {round: {slot: pick}} -- both levels are objects keyed by number
  // as a string, not arrays, so both need Object.values.
  function positionsIn(board) {
    const seen = new Set();
    Object.values(board.grid || {}).forEach(round =>
      Object.values(round || {}).forEach(pick => { if (pick && pick.position) seen.add(pick.position); })
    );
    return seen;
  }

  // Filters (site audit 32): positions picked in the legend, and one
  // manager picked from the grid's column headers. Both survive switching
  // year or view. A pick stays lit when it matches every active filter.
  const posFilter = new Set();
  let mgrFilter = null;
  // A player search result (nav.js, site audit III #10) links here with
  // ?player=: that pick wears a gold ring in every year he was taken, and
  // the first board shown scrolls to him.
  const FOUND = urlParam('player');

  function renderLegend(board) {
    const seen = board ? positionsIn(board) : new Set(Object.keys(POSITION_COLORS));
    const chips = Object.entries(POSITION_COLORS)
      .filter(([pos]) => seen.has(pos))
      .map(([pos, color]) =>
        `<button type="button" class="legend-chip${posFilter.has(pos) ? ' on' : ''}" data-pos="${pos}" aria-pressed="${posFilter.has(pos)}" style="--c:${color}"><span><span class="legend-swatch" style="background:${color}"></span>${pos}</span></button>`
      ).join('');
    const tail = posFilter.size || mgrFilter
      ? '<button type="button" class="legend-clear" data-clear>Clear</button>'
      : `<span class="legend-hint">Pick to highlight</span>`;
    return chips + tail;
  }

  // Dims whatever the filters leave out, in whichever view is showing. The
  // manager filter only applies to the grid, where it has columns to pick.
  function applyFilters() {
    const posOk = pos => !posFilter.size || posFilter.has(pos);
    const mgrOk = mgr => !mgrFilter || mgr === mgrFilter;
    boardContainer.querySelectorAll('.pick-cell[data-mgr]').forEach(td => {
      td.classList.toggle('dim', !(posOk(td.dataset.pos) && mgrOk(td.dataset.mgr)));
    });
    boardContainer.querySelectorAll('thead th.mgr').forEach(th => {
      th.classList.toggle('on', mgrFilter === th.dataset.mgr);
      th.classList.toggle('dim', Boolean(mgrFilter) && mgrFilter !== th.dataset.mgr);
      th.querySelector('.mgr-btn').setAttribute('aria-pressed', String(mgrFilter === th.dataset.mgr));
    });
    boardContainer.querySelectorAll('.sb-pick[data-pos]').forEach(row => row.classList.toggle('dim', !posOk(row.dataset.pos)));
  }

  function splitName(name) {
    const parts = name.trim().split(/\s+/);
    if (parts.length === 1) return [parts[0], ''];
    return [parts[0], parts.slice(1).join(' ')];
  }

  // ---------- Draft value (site audit II #33) ----------
  // data/draft-value.json, by year: picks {round: {slot: [pts, starts, pts
  // minus the round's average]}}, each manager's total and grade, and the
  // draft's best value and biggest bust. Null for a year before 2017 (no
  // lineups) or when the file didn't load.
  let VALUE = {};
  const yearValue = year => VALUE[year] || null;
  const pickValue = (v, round, slot) => (v && v.picks[round] && v.picks[round][slot]) || null;
  const f1 = n => Number(n).toFixed(1), f2 = n => Number(n).toFixed(2);
  const signed = n => `${n > 0 ? '+' : n < 0 ? '−' : ''}${f2(Math.abs(n))}`;
  const starts = n => `${n} start${n === 1 ? '' : 's'}`;
  const valueTitle = pv => `${f2(pv[0])} pts in ${starts(pv[1])} for the team that drafted him · ${signed(pv[2])} vs the round's average`;

  function renderCell(pick, round, teamCount, arrow, manager, pv, lv) {
    if (!pick || !pick.player_name) {
      // Live: the slot says which pick it is, and the one on the clock lights up.
      if (lv) {
        const pi = lv.overall - (round - 1) * teamCount;
        return `<td class="pick-cell pos-none${lv.clock === lv.overall ? ' clock' : ''}" data-mgr="${esc(manager)}" data-pos="" data-overall="${lv.overall}"><div class="pick-empty">${round}.${pi}</div></td>`;
      }
      return `<td class="pick-cell pos-none" data-mgr="${esc(manager)}" data-pos=""><div class="pick-empty">—</div></td>`;
    }
    const pickInRound = pick.overall - (round - 1) * teamCount;
    const [first, last] = splitName(pick.player_name);
    let pts = pv ? `<div class="pick-pts" title="${esc(valueTitle(pv))}">${f1(pv[0])}</div>` : '';
    if (!pv && lv && pick.d != null) pts = `<div class="pick-pts lv-d ${deltaTone(pick.d)}" title="${esc(deltaTitle(pick))}">${signedInt(pick.d)}</div>`;
    return `
      <td class="pick-cell ${posClass(pick.position)}${pick.player_name === FOUND ? ' found' : ''}${lv && lv.fresh.has(pick.overall) ? ' fresh' : ''}" data-mgr="${esc(manager)}" data-pos="${esc(pick.position || '')}"${lv ? ` data-overall="${pick.overall}"` : ''}>
        ${pick.keeper ? '<div class="pick-keeper" title="Keeper"></div>' : ''}
        <div class="pick-top">
          <span class="pick-tag">
            <span class="pick-rank">${esc(pick.position_rank || pick.position || '')}</span>
            ${pick.pro_team ? `<span class="pick-team">${esc(pick.pro_team)}</span>` : ''}
          </span>
          <span class="pick-overall">${round}.${pickInRound}</span>
        </div>
        <div class="pick-player"><span>${esc(first)}</span>${last ? `<span>${esc(last)}</span>` : ''}</div>
        ${pts}${arrow ? `<div class="pick-arrow">${arrow}</div>` : ''}
      </td>`;
  }

  function renderBoard(board, v, live) {
    const teamCount = board.team_count;
    const lastRound = board.rounds[board.rounds.length - 1];
    const headerCells = board.columns.map(c => `
      <th class="mgr" data-mgr="${esc(c.manager || '')}">
        <button type="button" class="mgr-btn" aria-pressed="false" aria-label="Highlight ${esc(c.manager || '')}'s picks">
          <span class="slot-manager">${esc(c.manager || '')}</span>
          <span class="slot-team">${esc(c.team_name || '')}</span>
        </button>
      </th>`).join('');

    const rows = board.rounds.map(round => {
      const ascending = round % 2 === 1;
      const turnSlot = ascending ? teamCount : 1;
      const cells = board.columns.map(c => {
        const isTurn = c.slot === turnSlot;
        const arrow = isTurn ? (round === lastRound ? '' : '↓') : (ascending ? '→' : '←');
        const lv = live && { clock: live.clock, fresh: live.fresh, overall: (round - 1) * teamCount + (ascending ? c.slot : teamCount + 1 - c.slot) };
        return renderCell(board.grid[round] && board.grid[round][c.slot], round, teamCount, arrow, c.manager || '', pickValue(v, round, c.slot), lv);
      }).join('');
      return `<tr>${cells}</tr>`;
    }).join('');

    return `
      <div class="board-scroll">
        <table class="board${v || live ? ' has-pts' : ''}">
          <thead><tr>${headerCells}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  // One column per manager, picks listed top to bottom in draft order --
  // an alternative to the snake-order grid for reading "what did my team
  // draft" at a glance instead of "who was on the clock when."
  function renderSimpleBoard(board, v) {
    const teamCount = board.team_count;
    const firstRound = board.rounds[0], lastRound = board.rounds[board.rounds.length - 1];
    const roundLabel = firstRound === lastRound ? `Round ${firstRound}` : `Rounds ${firstRound}–${lastRound}`;
    const cols = board.columns.map(c => {
      const rows = board.rounds.map(r => {
        const pick = board.grid[r] && board.grid[r][c.slot];
        if (!pick || !pick.player_name) return '';
        const pickInRound = pick.overall - (r - 1) * teamCount;
        const color = POSITION_COLORS[pick.position] || '#8A8A85';
        const pv = pickValue(v, r, c.slot);
        return `
          <div class="sb-pick" data-pos="${esc(pick.position || '')}">
            <span class="sb-badge" style="background:${color}">${esc(pick.position_rank || pick.position || '')}</span>
            <span class="sb-overall">${r}.${pickInRound}</span>
            <span class="sb-player">${esc(pick.player_name)}</span>
            <span class="sb-team">${pick.pro_team ? esc(pick.pro_team) : 'FA'}</span>
            ${pv ? `<span class="sb-pts" title="${esc(valueTitle(pv))}">${f1(pv[0])}</span>` : ''}
          </div>`;
      }).join('');
      return `<div class="sb-col" data-manager="${esc(c.manager || '')}"><div class="sb-name">${esc(c.manager || '')}</div>${rows}</div>`;
    }).join('');
    // Pager only shows on phones, where the track swipes one team at a time
    // (see .sb-track); on wider screens every team is on screen at once.
    const chevron = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
    const dots = board.columns.map((c, i) =>
      `<button type="button" class="sb-dot" data-goto="${i}" aria-label="${esc(c.manager || '')}"><i></i></button>`).join('');
    const pager = `
      <div class="sb-pager">
        <button type="button" class="sb-step" data-step="-1" aria-label="Previous team">${chevron('m15 18-6-6 6-6')}</button>
        <div class="sb-dots">${dots}</div>
        <button type="button" class="sb-step" data-step="1" aria-label="Next team">${chevron('m9 18 6-6-6-6')}</button>
      </div>`;
    return `<div class="simple-label">${roundLabel}</div><div class="glass simple-board${v ? ' has-pts' : ''}">${pager}<div class="sb-track">${cols}</div></div>`;
  }

  // The Value view: best value and biggest bust, then every manager's draft
  // total and grade, best first.
  function renderValue(year, v) {
    if (!v) {
      return `<div class="glass"><div class="empty-note">${Number(year) < 2017
        ? `No weekly lineups before 2017, so there's no draft value for ${year}.`
        : `No draft value for ${year} yet.`}</div></div>`;
    }
    const when = v.complete ? '' : `Through Week ${v.through_week}`;
    const pickCard = (title, x, tone) => {
      const color = POSITION_COLORS[x.position] || '#8A8A85';
      return `<div class="glass"><div class="panel-title">${title}</div><div class="panel-body"><div class="item dv-item">
        <div class="dv-top"><span class="sb-badge" style="background:${color}">${esc(x.position || '')}</span><span class="dv-name">${esc(x.player)}</span></div>
        <div class="dv-meta">${mgrLink(x.manager)} · Round ${x.round}, pick ${x.pick} · ${starts(x.gs)}</div>
        <div class="dv-v"><b>${f2(x.pts)}</b><span>pts</span><span class="${tone}">${signed(x.v)} vs round avg</span></div>
      </div></div></div>`;
    };
    const rows = Object.entries(v.managers).map(([name, m]) => `
      <a class="qrow" href="${esc(pageLink('franchise.html', { m: name, tab: 'money' }))}">
        <div class="grade g-${m.grade}" aria-label="Grade ${m.grade}">${m.grade}</div>
        <div style="min-width:0"><div class="nm">${esc(name)}</div>
          <div class="meta">Best ${esc(m.best.player)} <span class="win">${signed(m.best.v)}</span> · Bust ${esc(m.bust.player)} <span class="loss">${signed(m.bust.v)}</span></div></div>
        <div class="stats"><div><b>${Math.round(m.pts).toLocaleString('en-US')}</b><span>Pts</span></div></div>
      </a>`).join('');
    return `<div class="card-grid dv-pair">${pickCard('Best Value', v.best, 'win')}${pickCard('Biggest Bust', v.bust, 'loss')}</div>
      <div class="glass"><div class="panel-title">Draft Grades${when ? `<span class="chip">${when}</span>` : ''}</div>
        <div class="dv-note">Regular-season points each team's picks scored as its starters, graded A to F against that year's field. Value is a pick's points against the average for his round.</div>
        <div class="panel-body dv-list">${rows}</div></div>`;
  }

  // By Team on a phone: which team page is showing. Kept by manager name
  // rather than position so switching years stays on the same person even
  // when draft slots change.
  let sbManager = null;
  const boardContainer = document.getElementById('board-container');

  // ---------- Draft Day Live (site audit III #17) ----------
  // The Worker's GET /draft (worker/src/draft.js) is ESPN's draft room: the
  // order, every pick made so far and each player's average draft position.
  // This turns it into the same board shape the other views use, with a
  // delta on every pick (overall pick minus ADP: + he fell past where he was
  // expected, − he went early). ?demo=2025 replays a past draft a pick at a
  // time (?at=40 to start partway) with made-up ADPs, so the view can be
  // tried outside draft week.
  const WORKER_URL = 'https://retirement-league-refresh-proxy.bradbutcher321.workers.dev';
  const DEMO = urlParam('demo') || '';
  const LIVE_MS = 4000, PRE_MS = 30000, DEMO_MS = 2500;
  let LIVE = null, liveInfo = null, liveTimer = null, liveSeen = null, liveBusy = false, liveClock = null;
  let demoN = Number(urlParam('at')) || 0, prevRounds = 0;
  let tvOn = false, wakeLock = null;

  const signedInt = n => `${n > 0 ? '+' : n < 0 ? '−' : ''}${Math.abs(n)}`;
  const deltaTone = d => d >= 4 ? 'up' : d <= -4 ? 'down' : '';
  const deltaWord = d => d >= 10 ? 'Steal' : d >= 4 ? 'Value' : d > -4 ? 'On the board' : d > -10 ? 'Early' : 'Reach';
  const deltaTitle = p => `ADP ${p.adp} · taken at ${p.overall} · ${p.d === 0 ? 'right on it' : `${Math.abs(p.d)} ${p.d > 0 ? 'later' : 'earlier'} than expected`}`;
  const pickNo = (o, tc) => { const r = Math.ceil(o / tc); return `${r}.${o - (r - 1) * tc}`; };

  // A past draft as the Worker would send it, revealed up to pick n.
  function demoData(board, n) {
    const tc = board.team_count;
    const teams = {}, players = {}, picks = [];
    board.columns.forEach(c => { teams[c.team_id] = { manager: c.manager || '', name: c.team_name || '' }; });
    const slotTeam = Object.fromEntries(board.columns.map(c => [c.slot, c.team_id]));
    Object.entries(board.grid).forEach(([r, row]) => Object.entries(row).forEach(([slot, pk]) => {
      if (!pk || !pk.player_name || pk.overall > n) return;
      const id = pk.overall;
      // A repeatable wobble, wider later in the draft, standing in for the ADP.
      const wobble = Math.round((((pk.overall * 37) % 23) - 11) * (0.4 + pk.overall / 60));
      players[id] = { n: pk.player_name, pos: pk.position || '', tm: pk.pro_team || '', adp: Math.max(1, pk.overall + wobble) };
      picks.push({ o: pk.overall, t: slotTeam[slot], p: id, ...(pk.keeper ? { k: 1 } : {}) });
    }));
    picks.sort((a, b) => a.o - b.o);
    const total = tc * board.rounds.length;
    return { year: 'demo', status: n >= total ? 'done' : 'live', startsAt: null, order: board.columns.map(c => c.team_id), teams,
      picks, rounds: board.rounds.length, players, updatedAt: new Date().toISOString() };
  }

  function buildLive(d) {
    const order = d.order && d.order.length ? d.order : Object.keys(d.teams || {}).map(Number);
    const tc = order.length;
    if (!tc) return null;
    const rounds = Math.max(prevRounds, d.rounds || 0, d.picks.length ? Math.ceil(d.picks[d.picks.length - 1].o / tc) : 0);
    const team = t => d.teams[t] || { manager: '', name: '' };
    const columns = order.map((t, i) => ({ slot: i + 1, team_id: t, team_name: team(t).name, manager: team(t).manager }));
    const slotOf = o => { const r = Math.ceil(o / tc), p = o - (r - 1) * tc; return r % 2 ? p : tc + 1 - p; };
    const mgrAt = o => team(order[slotOf(o) - 1]).manager;
    const grid = {}, made = new Set(), posCount = {}, list = [];
    d.picks.forEach(p => {
      const pl = d.players[p.p] || {};
      const r = Math.ceil(p.o / tc);
      if (pl.pos) posCount[pl.pos] = (posCount[pl.pos] || 0) + 1;
      // A keeper wasn't taken against anyone's expectations, so it gets no delta.
      const d0 = !p.k && pl.adp ? Math.round(p.o - pl.adp) : null;
      const cell = { overall: p.o, player_name: pl.n || 'Unknown', position: pl.pos || null,
        position_rank: pl.pos ? pl.pos + posCount[pl.pos] : null, pro_team: pl.tm || null, keeper: !!p.k, d: d0, adp: pl.adp || null };
      (grid[r] = grid[r] || {})[slotOf(p.o)] = cell;
      made.add(p.o);
      list.push({ ...cell, round: r, pick: p.o - (r - 1) * tc, manager: mgrAt(p.o) });
    });
    const next = [];
    for (let o = 1; o <= tc * rounds && next.length < 4; o++) if (!made.has(o)) next.push(o);
    const board = { team_count: tc, rounds: Array.from({ length: rounds }, (_, i) => i + 1), columns, grid };
    return { board, list, next, clock: next[0] || null, tc, mgrAt, teamAt: o => team(order[slotOf(o) - 1]), fresh: new Set() };
  }

  function applyLive(d) {
    const info = buildLive(d);
    const now = new Set(d.picks.map(p => p.o));
    // Picks that arrived since the last look pop in; the first look pops nothing.
    if (info && liveSeen) now.forEach(o => { if (!liveSeen.has(o)) info.fresh.add(o); });
    liveSeen = now;
    LIVE = d;
    liveInfo = info;
  }

  function loadLive() {
    if (DEMO) {
      return fetch('data/draft-board.json', { cache: 'no-cache' }).then(r => r.json()).then(all => {
        const board = all.boards[DEMO];
        if (!board) return null;
        demoN = Math.min(demoN, board.team_count * board.rounds.length);
        const out = demoData(board, demoN);
        if (out.status === 'live') demoN += 1;
        return out;
      });
    }
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 8000);
    return fetch(`${WORKER_URL}/draft`, { cache: 'no-store', signal: ctl.signal })
      .then(r => r.json()).then(d => (d && d.status && Array.isArray(d.picks) ? d : null))
      .catch(() => null).finally(() => clearTimeout(t));
  }

  function liveCards() {
    const L = liveInfo, d = LIVE;
    let clock;
    if (!L) {
      clock = `<div class="glass"><div class="panel-title">Draft room</div><div class="panel-body"><div class="item lv-item"><div class="empty-note" style="padding:6px 0">ESPN hasn't set the draft order yet.</div></div></div></div>`;
    } else if (d.status === 'done' || !L.clock) {
      clock = `<div class="glass"><div class="panel-title">Draft complete<span class="chip">${d.picks.length} picks</span></div><div class="panel-body"><div class="item lv-item"><div class="lv-who">That's the board</div><div class="lv-sub">Every pick is in. The Value view takes over once the season has points.</div></div></div></div>`;
    } else if (d.status === 'pre') {
      const when = d.startsAt ? new Date(d.startsAt).toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZone: 'America/New_York' }) : '';
      clock = `<div class="glass"><div class="panel-title">Draft room${when ? `<span class="chip">${esc(when)} ET</span>` : ''}</div><div class="panel-body"><div class="item lv-item"><div class="lv-sub" style="margin:0 0 6px">First on the clock</div><div class="lv-who">${esc(L.mgrAt(1))}</div><div class="lv-sub">${esc(L.teamAt(1).name)}</div></div></div></div>`;
    } else {
      const o = L.clock;
      const next = L.next.slice(1, 4).map(n => `<span class="chip">${pickNo(n, L.tc)} <b>${esc(L.mgrAt(n))}</b></span>`).join('');
      clock = `<div class="glass"><div class="panel-title">On the clock<span class="lv-btns"><span class="chip">Pick ${pickNo(o, L.tc)} · #${o}</span><button type="button" class="lv-tv" id="lv-tv">TV</button></span></div>
        <div class="panel-body"><div class="item lv-item"><div class="lv-who">${esc(L.mgrAt(o))}</div><div class="lv-sub">${esc(L.teamAt(o).name)}</div>${next ? `<div class="lv-next">${next}</div>` : ''}</div></div></div>`;
    }
    const last = L && L.list[L.list.length - 1];
    let lastCard;
    if (!last) {
      lastCard = `<div class="glass"><div class="panel-title">Latest pick</div><div class="panel-body"><div class="item lv-item"><div class="lv-sub" style="margin:0">No picks yet.</div></div></div></div>`;
    } else {
      const color = POSITION_COLORS[last.position] || '#8A8A85';
      const chip = last.d == null ? (last.keeper ? '<span class="chip">Keeper</span>' : '')
        : `<span class="chip ${deltaTone(last.d)}">${deltaWord(last.d)} · ${signedInt(last.d)}</span>`;
      const adp = last.d == null ? '' : `<div class="dv-v"><b>${last.adp}</b><span>ADP</span><span class="${last.d >= 4 ? 'win' : last.d <= -4 ? 'loss' : ''}">taken at ${last.overall}${last.d === 0 ? '' : `, ${Math.abs(last.d)} ${last.d > 0 ? 'later' : 'earlier'}`}</span></div>`;
      lastCard = `<div class="glass"><div class="panel-title">Latest pick${chip}</div><div class="panel-body"><div class="item lv-item">
        <div class="dv-top"><span class="sb-badge" style="background:${color}">${esc(last.position || '')}</span><span class="dv-name">${esc(last.player_name)}</span></div>
        <div class="dv-meta">${esc(last.manager)} · Round ${last.round}, pick ${last.pick}${last.pro_team ? ` · ${esc(last.pro_team)}` : ''}</div>${adp}</div></div></div>`;
    }
    return `<div class="lv-top">${clock}${lastCard}</div>`;
  }

  function liveExtra() {
    const L = liveInfo;
    if (!L || !L.list.length) return '';
    const recent = L.list.slice(-10).reverse().map(p => {
      const tone = p.d == null ? '' : p.d >= 10 ? ' steal' : p.d <= -10 ? ' reach' : '';
      return `<div class="lv-row${tone}"><span class="lv-no">${p.round}.${p.pick}</span>
        <div style="min-width:0"><div class="lv-nm">${esc(p.player_name)}</div><div class="lv-mt">${esc(p.position || '')}${p.pro_team ? ` · ${esc(p.pro_team)}` : ''} · ${esc(p.manager)}</div></div>
        ${p.d == null ? (p.keeper ? '<span class="chip">Keeper</span>' : '<span></span>') : `<span class="lv-delta ${deltaTone(p.d)}" title="${esc(deltaTitle(p))}">${signedInt(p.d)}</span>`}</div>`;
    }).join('');
    const by = {};
    L.list.forEach(p => {
      const m = by[p.manager] = by[p.manager] || { n: 0, graded: 0, sum: 0 };
      m.n++;
      if (p.d != null) { m.graded++; m.sum += p.d; }
    });
    const ranked = Object.entries(by).filter(([, m]) => m.graded).sort((a, b) => b[1].sum - a[1].sum);
    const value = ranked.map(([name, m], i) => `<div class="lv-row"><span class="lv-no">${i + 1}</span>
        <div style="min-width:0"><div class="lv-nm">${esc(name)}</div><div class="lv-mt">${m.n} pick${m.n === 1 ? '' : 's'}</div></div>
        <span class="lv-delta ${deltaTone(m.sum)}">${signedInt(m.sum)}</span></div>`).join('');
    return `<div class="lv-extra"><div class="glass"><div class="panel-title">Recent picks</div><div class="lv-list">${recent}</div></div>
      ${value ? `<div class="glass"><div class="panel-title">Draft value</div><div class="dv-note">Spots each team's picks went after (+) or before (−) their ADP.</div><div class="lv-list">${value}</div></div>` : ''}</div>`;
  }

  const renderLive = () => liveCards() + (liveInfo ? renderBoard(liveInfo.board, null, { clock: liveInfo.clock, fresh: liveInfo.fresh }) : '') + liveExtra();

  // Redraws the live view in place: the grid keeps its sideways scroll, and
  // slides to the pick on the clock when that has moved.
  function paintLive() {
    const old = boardContainer.querySelector('.board-scroll');
    const left = old ? old.scrollLeft : 0;
    boardContainer.innerHTML = renderLive();
    const sc = boardContainer.querySelector('.board-scroll');
    const legend = document.getElementById('legend');
    legend.innerHTML = liveInfo && liveInfo.list.length ? renderLegend(liveInfo.board) : '';
    legend.hidden = !legend.innerHTML;
    applyFilters();
    if (sc) {
      sc.scrollLeft = left;
      const cell = sc.querySelector('.pick-cell.clock');
      const at = liveInfo && liveInfo.clock;
      if (cell && at !== liveClock && !tvOn) {
        const to = cell.offsetLeft - (sc.clientWidth - cell.offsetWidth) / 2;
        const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
        sc.scrollTo({ left: Math.max(0, to), behavior: left && !reduce ? 'smooth' : 'auto' });
      }
    }
    liveClock = liveInfo ? liveInfo.clock : null;
    if (LIVE) document.getElementById('updated-at').textContent = formatUpdated(LIVE.updatedAt);
    tvFit();
  }

  // The next look at ESPN: quick while picks are coming, slow before the
  // draft, none once it's over or while the tab is hidden or on another view.
  function liveTick() {
    clearTimeout(liveTimer);
    if (boardView !== 'live' || document.hidden || liveBusy) return;
    liveBusy = true;
    loadLive().catch(() => null).then(d => {
      if (d) { applyLive(d); if (boardView === 'live') paintLive(); }
    }).finally(() => {
      liveBusy = false;
      if (boardView !== 'live' || (LIVE && LIVE.status === 'done')) return;
      liveTimer = setTimeout(liveTick, DEMO ? DEMO_MS : LIVE && LIVE.status === 'pre' ? PRE_MS : LIVE_MS);
    });
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) liveTick(); });

  // The grid scaled to fill the screen in TV mode: by width, but never so
  // tall that it runs off the bottom.
  function tvFit() {
    const table = boardContainer.querySelector('table.board'), wrap = boardContainer.querySelector('.board-scroll');
    if (!table || !wrap) return;
    table.style.transform = '';
    table.style.width = '';
    if (!tvOn) { wrap.style.height = ''; return; }
    let w = table.offsetWidth, h = table.offsetHeight;
    const room = innerHeight - (wrap.getBoundingClientRect().top + scrollY) - 12;
    const s = Math.min(2, (wrap.clientWidth - 6) / w, room / h);
    // Taller than wide for the screen: spread the columns across what's left
    // of the width instead of leaving it empty.
    table.style.width = `${Math.max(w, (wrap.clientWidth - 6) / s)}px`;
    h = table.offsetHeight;
    table.style.transformOrigin = '0 0';
    table.style.transform = `scale(${s})`;
    wrap.style.height = `${Math.ceil(h * s) + 6}px`;
  }

  async function setTv(on) {
    tvOn = on;
    document.body.classList.toggle('tv', on);
    try {
      if (on) {
        if (document.documentElement.requestFullscreen && !document.fullscreenElement) await document.documentElement.requestFullscreen();
        if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen');
      } else {
        if (document.fullscreenElement && document.exitFullscreen) await document.exitFullscreen();
        if (wakeLock) { await wakeLock.release(); wakeLock = null; }
      }
    } catch (e) {}
    tvFit();
    if (on) scrollTo(0, 0);
  }
  addEventListener('resize', () => { if (tvOn) tvFit(); });
  document.addEventListener('fullscreenchange', () => { if (tvOn && !document.fullscreenElement) setTv(false); });
  document.getElementById('lv-exit').addEventListener('click', () => setTv(false));
  boardContainer.addEventListener('click', e => { if (e.target.closest('#lv-tv')) setTv(true); });

  // Exact page width, not clientWidth: that's rounded to whole pixels, and
  // the rounding error adds up a pixel or two by the last few teams.
  const sbWidth = track => track.getBoundingClientRect().width;
  const sbIndex = track => sbWidth(track) ? Math.round(track.scrollLeft / sbWidth(track)) : 0;

  function syncPager(track) {
    const i = sbIndex(track), n = track.children.length;
    boardContainer.querySelectorAll('.sb-dot').forEach((d, j) => {
      d.classList.toggle('on', j === i);
      d.setAttribute('aria-current', j === i ? 'true' : 'false');
    });
    boardContainer.querySelector('[data-step="-1"]').disabled = i <= 0;
    boardContainer.querySelector('[data-step="1"]').disabled = i >= n - 1;
    if (track.children[i]) sbManager = track.children[i].dataset.manager;
  }

  function goToTeam(track, i, smooth) {
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    track.scrollTo({ left: i * sbWidth(track), behavior: smooth && !reduce ? 'smooth' : 'auto' });
  }

  // Scroll doesn't bubble, so listen in the capture phase -- this one
  // listener survives every re-render of the board's innerHTML.
  boardContainer.addEventListener('scroll', e => {
    if (e.target.classList && e.target.classList.contains('sb-track')) syncPager(e.target);
  }, true);
  boardContainer.addEventListener('click', e => {
    const btn = e.target.closest('[data-step], [data-goto]');
    const track = boardContainer.querySelector('.sb-track');
    if (!btn || !track) return;
    const i = btn.dataset.goto != null ? +btn.dataset.goto : sbIndex(track) + +btn.dataset.step;
    goToTeam(track, Math.max(0, Math.min(track.children.length - 1, i)), true);
  });

  // Year and view ride in the URL (?year=2019&view=team, site audit II #20)
  // so a board can be sent as a link. The view is also remembered here, since
  // By Team is the better one on a phone; the URL wins over the saved one.
  // The newest year leaves the URL bare. The view is always written, so a
  // link opens on the sender's view rather than whatever the reader saved.
  const VIEWS = { live: 'live', grid: 'grid', team: 'simple', value: 'value' };
  const viewKey = v => Object.keys(VIEWS).find(k => VIEWS[k] === v);
  let boardView = VIEWS[urlParam('view')]
    || (() => { try { return VIEWS[localStorage.getItem('draft-board-view')]; } catch (e) { return null; } })()
    || 'grid';
  const viewToggle = document.getElementById('view-toggle');
  [...viewToggle.children].forEach(b => b.classList.toggle('on', b.dataset.view === boardView));

  // Draft value and the live draft are extras: if either fails, the board
  // still shows without them.
  const liveReady = loadLive().catch(() => null);
  const valueReady = fetch('data/draft-value.json', { cache: 'no-cache' })
    .then(res => res.json()).then(d => { VALUE = d.years || {}; })
    .catch(err => console.error('Draft value data error:', err));
  Promise.all([fetch('data/draft-board.json', { cache: 'no-cache' }).then(res => res.json()), valueReady, liveReady])
    .then(([data, , first]) => {
      const sel = document.getElementById('year-select');
      prevRounds = (data.boards[data.years[0]] || { rounds: [] }).rounds.length;
      // Live shows while a draft is on (or just ended and isn't in the board
      // data yet) and leads the page until it's over. It never becomes the
      // saved view, so a stale choice can't keep it up.
      const liveOn = Boolean(first) && (Boolean(DEMO) || first.status !== 'done' || !data.years.includes(first.year));
      viewToggle.querySelector('[data-view="live"]').hidden = !liveOn;
      if (liveOn) applyLive(first);
      if (!liveOn && boardView === 'live') boardView = 'grid';
      else if (liveOn && !VIEWS[urlParam('view')] && (DEMO || first.status !== 'done')) boardView = 'live';
      [...viewToggle.children].forEach(b => b.classList.toggle('on', b.dataset.view === boardView));
      sel.innerHTML = data.years.map(y => `<option value="${y}">${y}</option>`).join('');
      document.getElementById('updated-at').textContent = formatUpdated(data.generated_at);

      function show(year) {
        const isLive = boardView === 'live';
        setUrlParams({ year: isLive || String(year) === String(data.years[0]) ? null : year, view: viewKey(boardView) });
        document.querySelector('.selector-row').classList.toggle('live-on', isLive);
        if (!isLive && tvOn) setTv(false);
        if (isLive) { paintLive(); liveTick(); return; }
        clearTimeout(liveTimer);
        const board = data.boards[year], v = yearValue(year);
        // Legend is redrawn per year, not once at load -- which positions
        // exist changes with the era's roster rules. The Value view has no
        // picks to filter, so no legend.
        const legend = document.getElementById('legend');
        legend.innerHTML = boardView === 'value' ? '' : renderLegend(board);
        legend.hidden = boardView === 'value';
        document.getElementById('board-container').innerHTML = !board
          ? '<div class="empty-note">No draft data for this year.</div>'
          : boardView === 'value' ? renderValue(year, v)
          : boardView === 'simple' ? renderSimpleBoard(board, v) : renderBoard(board, v);
        applyFilters();
        const track = boardContainer.querySelector('.sb-track');
        if (track) {
          const cols = [...track.children];
          const i = Math.max(0, cols.findIndex(c => c.dataset.manager === sbManager));
          goToTeam(track, i, false);
          syncPager(track);
        }
      }
      const y = Number(urlParam('year'));
      sel.value = data.years.includes(y) ? y : data.years[0];
      show(sel.value);
      riseIn(document.getElementById('board-container').children);
      const found = boardContainer.querySelector('.pick-cell.found');
      if (found) requestAnimationFrame(() => found.scrollIntoView({ block: 'center', inline: 'center' }));
      sel.addEventListener('change', () => show(sel.value));
      // A filter change only re-dims the board in place; the legend redraws
      // for its on/off states and the Clear button.
      const refilter = () => {
        if (boardView === 'value') return;
        document.getElementById('legend').innerHTML = renderLegend(boardView === 'live' ? liveInfo.board : data.boards[sel.value]);
        applyFilters();
      };
      document.getElementById('legend').addEventListener('click', e => {
        const chip = e.target.closest('[data-pos]');
        if (chip) {
          const pos = chip.dataset.pos;
          if (posFilter.has(pos)) posFilter.delete(pos); else posFilter.add(pos);
        } else if (e.target.closest('[data-clear]')) {
          posFilter.clear();
          mgrFilter = null;
        } else return;
        refilter();
      });
      boardContainer.addEventListener('click', e => {
        const th = e.target.closest('th.mgr');
        if (!th) return;
        mgrFilter = mgrFilter === th.dataset.mgr ? null : th.dataset.mgr;
        refilter();
      });
      viewToggle.addEventListener('click', e => {
        const btn = e.target.closest('[data-view]');
        if (!btn) return;
        boardView = btn.dataset.view;
        if (boardView !== 'live') { try { localStorage.setItem('draft-board-view', viewKey(boardView)); } catch (err) {} }
        [...viewToggle.children].forEach(b => b.classList.toggle('on', b === btn));
        show(sel.value);
      });
    })
    .catch(err => {
      console.error('Draft board data error:', err);
      document.getElementById('board-container').innerHTML = '<div class="loading-row" style="color:var(--loss);">Error loading draft board data.</div>';
    });
</script>
<script src="track.js?v=2" defer></script>
</body>
