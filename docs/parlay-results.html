<!-- The two font-family's woff2 files Google serves for the latin subset
     at the weights this site uses -- one variable-font file per family
     covers every weight declared, confirmed directly by fetching the
     stylesheet below and comparing each @font-face block's url(). Starts
     the actual font downloads immediately, in parallel with that
     stylesheet fetch, instead of waiting to discover these same URLs
     only after the stylesheet loads and is parsed -- avoids the
     fallback-to-webfont swap (FOUT) that otherwise shows on a slow or
     uncached load. If Google ever changes these hashed URLs, this just
     degrades to a wasted (unused) preload, not a correctness issue -- the
     stylesheet's own @font-face still fetches whatever the new URL is. -->
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/bigshouldersdisplay/v24/fC1_PZJEZG-e9gHhdI4-NBbfd2ys3SjJCx1czNDu.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* ---------- Week selector ----------
     .selector-row and .parlay-select styling both live in theme.css. */
  /* ---------- Gold outline button ----------
     The page's two buttons ("Back to current" and the legs' Expand/Collapse
     all) are the same control at two sizes, so they share one definition.
     Pill-shaped like every other control on the site, and the hover tint is
     the current gold (212,180,106) rather than the retired #BA9B37 it used
     to be mixed from -- at 10% the two are close enough to miss side by
     side, and far enough apart to read as slightly off next to a real gold
     border. */
  .back-link, .leg-expand-toggle{
    background: none;
    border: 1px solid var(--gold);
    color: var(--gold);
    font-family: var(--body);
    font-weight: 600;
    border-radius: 999px;
    cursor: pointer;
  }
  @media (hover: hover){
    .back-link:hover, .leg-expand-toggle:hover{ background: rgba(212,180,106,0.1); }
  }
  .back-link:focus-visible, .leg-expand-toggle:focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }
  .back-link{ font-size: 0.8rem; padding: 8px 14px; }
  .back-link:disabled{ opacity: 0.5; cursor: default; }
  @media (hover: hover){
    .back-link:disabled:hover{ background: none; }
  }
  .back-link[hidden]{ display: none; }
  /* Tuesday to Thursday 1 PM: the way in to Parlay Legs, where each
     manager enters their own leg. Gone once legs lock. */
  .legs-banner{
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-height: 52px; padding: 10px 16px; margin-bottom: 18px; border-radius: 12px;
    border: 1px solid var(--lead-line); background: var(--lead-tint); color: var(--text); text-decoration: none;
  }
  .legs-banner[hidden]{ display: none; }
  .legs-banner .lb-text{ min-width: 0; font-size: 0.86rem; color: var(--text-dim); }
  .legs-banner .lb-text b{ color: var(--text); font-weight: 700; }
  .legs-banner .lb-go{ flex: none; color: var(--gold); font-weight: 700; font-size: 0.86rem; white-space: nowrap; }
  .legs-banner:focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }

  /* ---------- Parlay hero: Payout as the one glowing headline number,
     Legs Hit/Lost/Combined Odds/Split as quiet side stats, reusing the
     shared .glass/.hero2/.hs components instead of a row of
     identically-weighted tiles. Status is its own corner ribbon, fully
     detached from the hero number instead of sharing a row with an
     eyebrow label. ---------- */
  /* Which week this is, and how it ended, as a matched pair in the card's
     two top corners. Both use .badge so they carry the same weight -- the
     week read heavier than the status when it was a full-size .hero-chip. */
  .status-ribbon{ position: absolute; top: 18px; right: 18px; }
  .week-ribbon{ position: absolute; top: 18px; left: 18px; color: var(--text); border-color: var(--line); }
  /* Clears the week ribbon, the same way .hero2-side clears the status one. */
  .hero2-main{ padding-top: 52px; }
  .gold-label-xl{ color: var(--gold); font-size: 0.95rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; }
  /* Clears the status ribbon above -- its badge text length varies
     ("Alive" vs "Dead" vs "Hit"), so the first side row needs guaranteed
     headroom rather than whatever theme.css's default .hero2-side padding
     happens to leave. Desktop only: once the hero stacks (theme.css, 700px)
     the side strip sits below the payout, nowhere near the ribbon, and this
     padding was just a 46px empty band above the stats. */
  @media (min-width: 701px){ .hero2-side{ padding-top: 46px; } }

  .hero-chips{ display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; position: relative; }
  .hero-chip{ display: inline-flex; align-items: center; background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-size: 0.8rem; color: var(--text); }
  .hero-chip.loss{ border-color: rgba(214,98,79,0.4); background: rgba(214,98,79,0.08); color: var(--loss); font-weight: 600; }

  /* The old .memoriam block was a full-width bordered panel for one name;
     it's a chip alongside Sacko now, same weight as the fact it carries. */

  /* ---------- Legs ----------
     Collapsed to two lines: name + result share the top line, the bet gets
     its own full line underneath with no truncation -- even the longest bet
     on the board reads in full without a click. Sport/odds/kickoff move into
     a detail panel that opens on click, the same pattern the dashboard's
     matchup cards use (see index.html's .matchup-card / expandedMatchups). */
  .leg{
    background: var(--item);
    border: 1px solid var(--item-line);
    border-radius: 10px;
    margin-top: 8px;
    cursor: pointer;
    overflow: hidden;
  }
  .leg:first-child{ margin-top: 0; }
  .leg.Win{ border-color: var(--win-line); background: var(--win-tint); }
  .leg.Loss{ border-color: var(--loss-line); background: var(--loss-tint); }
  .leg.live-up{ border-color: var(--win-line); background: var(--win-tint); }
  .leg.live-down{ border-color: var(--loss-line); background: var(--loss-tint); }
  .leg.missing{ cursor: default; }
  /* Two columns on desktop (site audit #13): twelve legs one per row ran
     ~950px wide and twice as tall as they needed to. Kickoff order reads
     across, then down. align-items: start so opening a leg doesn't stretch
     the one beside it. */
  @media (min-width: 900px){
    .legs-grid{ display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: start; }
    .legs-grid .leg{ margin-top: 0; }
  }

  .leg-head{ padding: 12px 14px 11px; }
  .leg-top{ display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .leg-name{ font-weight: 700; }
  .leg-result-group{ display: flex; align-items: center; gap: 7px; flex-shrink: 1; min-width: 0; }
  /* ---------- The graded result, beside the verdict ----------
     Filled rather than outlined, matching .hero-chip at the top of this page,
     so it's a shape the page already owns. Deliberately NOT tinted win/loss:
     the word next to it already carries that, and a third green thing on a
     winning row was too much. Nothing renders here until a leg is decided. */
  .fin{
    font-family: var(--scoreboard); font-variant-numeric: tabular-nums;
    font-size: 0.78rem; font-weight: 700; line-height: 1; color: var(--text);
    background: rgba(255,255,255,0.06); border-radius: 999px; padding: 4px 10px;
    white-space: nowrap; flex-shrink: 0;
  }
  /* Not every graded detail is a score -- a prop reads "Passing Yards: 390"
     and a bout "Pereira · Round 1". The condensed scoreboard face is built
     for numerals and turns to mush on words, so those take the body face a
     size down, and they're the thing that shrinks on a narrow screen so the
     verdict can never be pushed off the row. */
  .fin.is-text{
    font-family: var(--body); font-weight: 600; font-size: 0.7rem; letter-spacing: 0;
    min-width: 0; flex-shrink: 1; overflow: hidden; text-overflow: ellipsis;
  }
  /* The name gives way before the chip does -- it's repeated down the column,
     while the chip's content is unique to this row. */
  .leg-name{ min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .leg-result{ font-family: var(--scoreboard); font-weight: 700; font-size: 0.86rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-dim); white-space: nowrap; }
  .leg-result.turf{ color: var(--turf); }
  .leg-result.loss{ color: var(--loss); }
  .leg-result-group .chev{ color: var(--text-dim); }
  /* Fixed width (measured against "Collapse all", the longer of the two
     labels, at this font) so the pill doesn't resize when the label
     changes -- a width that merely fit "Expand all" would grow on every
     toggle. */
  .leg-expand-toggle{
    font-size: 0.78rem;
    padding: 7px 0;
    width: 104px;
    text-align: center;
    flex-shrink: 0;
  }
  .legs-actions{ display: flex; gap: 8px; }
  #leg-share{ width: 84px; }

  /* The Share button's picture (share.js): a copy of the hero + legs card as
     it reads on screen, every leg expanded and the toggles gone. */
  .share-shot .legs-actions{ display: none; }
  /* Grey and a size down from the name -- this is supporting text under a
     bold headline, not a second headline. */
  .leg-bet{ color: var(--text-dim); font-size: 0.86rem; margin-top: 4px; line-height: 1.35; }

  .leg-detail{ max-height: 0; overflow: hidden; transition: max-height 0.22s ease; }
  /* Room for .leg-stats wrapping onto a second line (see there). */
  .leg.open .leg-detail{ max-height: 120px; }
  @media (prefers-reduced-motion: reduce){ .leg-detail{ transition: none; } }
  /* The rule and its padding live on this full-width wrapper, not on
     .leg-stats itself -- .leg-stats is only as wide as its own content
     (width: max-content, for the grid below), so a border on it would stop
     wherever the content stopped instead of running to the card's edge. */
  .leg-detail-in{ border-top: 1px solid var(--line); margin: 0 14px; padding: 10px 0 12px; }

  /* Sport / Odds / Kickoff-or-Live / Matchup, each a label-over-value
     block. Every block is built the same way (one label line, one value
     line), so on a shared line "SPORT/ODDS/LIVE" still sit level with each
     other and "NFL/-110/<score>" level below. It's a wrapping row rather
     than the fixed one-line grid it used to be because a live prop's four
     blocks ("0 TDs · 17-19 · 12:34 - 3rd" next to "ARI vs. NYG") sit right
     at a phone's width -- on a narrower one, or with a long clock, the last
     block drops to a second line instead of being clipped off the card. */
  .leg-stats{ display: flex; flex-wrap: wrap; column-gap: 22px; row-gap: 10px; }
  .leg-stats .st{ display: flex; flex-direction: column; gap: 4px; }
  /* display:block + text-align:center so each label centers over ITS OWN
     value even when the two are different widths (e.g. "LIVE" is narrower
     than its live score). */
  .leg-stats .l{ display: block; text-align: center; color: var(--text-dim); font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.06em; }
  .leg-stats .v{ display: block; text-align: center; font-family: var(--scoreboard); font-weight: 700; font-size: 0.95rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
  /* inline-flex so the dot sits beside the score as one inline unit that
     the parent's text-align:center can still center as a whole.
     The score itself says whether the leg is covering right now, matching
     the tint on the whole leg card: green while it's winning, red otherwise.
     The dot is deliberately NOT part of that -- it's a "this game is in
     progress" marker, not a result, so it stays red whatever the score is
     doing. It sets `background` rather than `color`, so it doesn't inherit
     the green either. */
  .leg-stats .live-wrap{ display: inline-flex; align-items: center; gap: 5px; color: var(--loss); }
  .leg-stats .live-wrap.up{ color: var(--turf); }
  .leg-stats .live-wrap .dot{ width: 6px; height: 6px; border-radius: 50%; background: var(--loss); flex-shrink: 0; animation: leg-live-pulse 1.5s ease-in-out infinite; }
  @keyframes leg-live-pulse{ 0%, 100%{ opacity: 1; } 50%{ opacity: 0.25; } }
  @media (prefers-reduced-motion: reduce){ .leg-stats .live-wrap .dot{ animation: none; } }

</style>

<script>
  const WORKER_URL = 'https://retirement-league-refresh-proxy.bradbutcher321.workers.dev';
  const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  function fmtOdds(o) {
    if (o === null || o === undefined) return '—';
    const n = Math.round(o);
    return (n > 0 ? '+' : '') + n.toLocaleString();
  }
  function fmtMoney(n) {
    if (n === null || n === undefined) return '—';
    return '$' + Number(n).toLocaleString(undefined, { maximumFractionDigits: 0 });
  }
  function fmtPct(n) {
    return n === null || n === undefined ? '—' : Number(n).toFixed(1) + '%';
  }
  function fmtTime(iso) {
    if (!iso) return 'TBD';
    const d = new Date(iso);
    const h = d.getHours();
    const mins = String(d.getMinutes()).padStart(2, '0');
    return `${DAYS[d.getDay()]} ${h % 12 || 12}:${mins}${h < 12 ? 'AM' : 'PM'}`;
  }
  // ---------- Parlay (current / past) ----------
  function legsSorted(week, players) {
    return players.filter(p => week.picks[p])
      .map(p => [p, week.picks[p]])
      .sort((a, b) => (a[1].gametime || '9999').localeCompare(b[1].gametime || '9999'));
  }

  // reconstruct_pick_text (generate_parlay_data.py) writes every pick as
  // "{bet type}: {details}", for bet types it knows and for ones it doesn't,
  // and a pick with no bet type is never published -- so the prefix is always
  // there to read.
  const betTypeOf = p => String(p.pick || '').split(':')[0].trim();
  // An over/under on a game's combined score. Mirrors parlay_note_parser.py's
  // TOTAL_VS. A UFC "Total Rounds" bet is in that set but has no two scores to
  // add -- the round a fight ended in is the one number there, and its graded
  // detail reads "<winner> won (round 3)" -- so it simply never matches the
  // two-score shape the sum below looks for.
  const TOTAL_BET_TYPES = new Set(['Total Points', 'Total Goals', 'Total Rounds']);
  // The bets that grade off one player's stat line rather than a game's score
  // -- parlay_note_parser.py's PLAYER_OU plus PLAYER_ONLY.
  const PLAYER_BET_TYPES = new Set(['Receiving Yards', 'Passing TD', 'Home Runs', 'Player Points',
    'Interceptions', 'Total Yards', 'Receptions', 'Passing Yards', 'Anytime TD', 'Coin Toss']);
  const isTotalBet = p => TOTAL_BET_TYPES.has(betTypeOf(p));
  // What a live prop's running stat counts, [one, many] -- "1 TD", "0 TDs".
  const PROP_STAT_UNITS = {
    'Anytime TD': ['TD', 'TDs'], 'Passing TD': ['Pass TD', 'Pass TDs'],
    'Passing Yards': ['Pass Yd', 'Pass Yds'], 'Receiving Yards': ['Rec Yd', 'Rec Yds'], 'Total Yards': ['Yd', 'Yds'],
    'Receptions': ['Rec', 'Rec'], 'Interceptions': ['INT', 'INTs'], 'Home Runs': ['HR', 'HRs'], 'Player Points': ['Pt', 'Pts'],
  };

  // entry: {kind: 'team'|'prop', team_score, opponent_score, period, clock,
  // detail, tone}, plus `stat` on a prop -- see publish_parlay_stats.py's
  // build_live_scores. A totals bet shows the two scores added up, since
  // the combined number IS the thing being bet on -- "17-27" makes you do
  // the arithmetic yourself to see where it stands against the line. A prop
  // leads with its own stat, then its player's game the way a team bet
  // shows it: "0 TDs · 17-14 · Halftime".
  function liveText(entry, p) {
    // entry.detail is ESPN's own phrase for where the game stands --
    // "Top 1st" for baseball, "4:32 - 2nd Quarter" for football -- which is
    // already correct per sport. Falls back to the old quarter/clock guess
    // only if ESPN didn't supply one (or for data cached before this field
    // existed), which was never right for a sport without quarters anyway.
    const state = entry.detail ? ` · ${entry.detail}` : (entry.period ? ` · Q${entry.period} ${entry.clock || ''}`.trim() : '');
    const a = Math.round(entry.team_score), b = Math.round(entry.opponent_score);
    if (entry.kind !== 'team') {
      const stat = propStatText(entry, p);
      // A prop published before props carried their game has no score.
      return entry.team_score == null ? stat : `${stat} · ${a}-${b}${state}`;
    }
    return `${isTotalBet(p) ? a + b : `${a}-${b}`}${state}`;
  }

  // "1 TD", "0 TDs", "64 Rec Yds".
  function propStatText(entry, p) {
    const n = entry.stat % 1 === 0 ? entry.stat : entry.stat.toFixed(1);
    const [one, many] = PROP_STAT_UNITS[betTypeOf(p)] || ['', ''];
    return `${n} ${entry.stat === 1 ? one : many}`.trim();
  }

  // Rewrites the graded detail -- free text out of the sheet's Grade Detail
  // column, written by auto_grade_results.py -- into what the chip shows.
  // The sheet keeps the original wording as the audit trail; this is purely
  // how it reads on the page, which is also why every past leg picks these
  // up with no backfill.
  function finalChipText(p, detail) {
    const bet = betTypeOf(p);

    // A totals bet is about the combined number, so "17-27" becomes 44.
    if (TOTAL_BET_TYPES.has(bet)) {
      detail = detail.replace(/^(\d+)\s*-\s*(\d+)\b/, (_m, a, b) => String(Number(a) + Number(b)));
    }

    // A player prop grades to "<player>: <stat>". The player's name is
    // already on the bet line directly above, while what the number measures
    // isn't -- so the bet type takes the label's place: "Passing Yards: 390".
    if (PLAYER_BET_TYPES.has(bet)) {
      detail = detail.replace(/^.+?:\s*(-?\d+(?:\.\d+)?)$/, (_m, n) => `${bet}: ${n}`);
    }

    // A UFC bout grades to "Pereira won (round 1)" -- tightened to
    // "Pereira · Round 1", the same middot separator the rest of the site
    // uses between a fact and its qualifier. A decision with no round
    // recorded keeps its plain "<winner> won".
    detail = detail.replace(/^(.+?)\s+won\s*\(round\s*(\d+(?:\.\d+)?)\)$/i,
      (_m, who, round) => `${who} · Round ${round}`);

    return detail;
  }

  // The third stat slot is whichever of these is actually useful right now:
  // the kickoff time before the game starts, the running score once it's
  // live, or the graded final once it's decided -- never more than one of
  // the three at once, which is what keeps a leg card to a single stat row.
  // The chip beside the verdict: what the leg was graded from. Empty string
  // until the leg is actually decided -- a live leg gets livePillHtml in the
  // same spot instead, and a leg that hasn't kicked off gets nothing.
  function finalChipHtml(p) {
    if (p.result !== 'Win' && p.result !== 'Loss') return '';
    // auto_grade_results.py writes a score-graded detail as "17-10 final";
    // the chip is already in the verdict's own slot, so a trailing "final"
    // in the value would be saying it twice. Other shapes (a prop's
    // "Player: 2", a 1st-half score, a UFC result) never end in that word.
    const raw = (p.detail || '').replace(/\s*\bfinal\b\s*$/i, '').trim();
    if (!raw) return '';
    const text = finalChipText(p, raw);
    // Digits get the condensed scoreboard face; anything with words in it
    // takes the body face a size down, and may shrink before the verdict
    // does -- see .fin.is-text.
    const cls = /^[\d\s.–—-]+$/.test(text) ? 'fin' : 'fin is-text';
    return `<span class="${cls}" title="${esc(text)}">${esc(text)}</span>`;
  }

  // finalChipHtml's live counterpart, in the same pill: the number the leg
  // is riding on right now -- the score, a total's combined points, a
  // prop's stat. A spread adds the game's margin written the way a spread
  // is, so it reads straight against the bet's own line: Bears up 13-3 are
  // playing like a -10 next to their -3, and a tie reads "±0" rather than
  // "PK", which looked like it described the bet. Not 1st Half Spread -- the live
  // score is the full game's, which stops being the half's after halftime.
  const LIVE_SPREAD_BET_TYPES = new Set(['Spread', 'Alt Spread']);
  function livePillHtml(p, entry) {
    let text;
    if (entry.kind !== 'team') {
      text = propStatText(entry, p);
    } else {
      const a = Math.round(entry.team_score), b = Math.round(entry.opponent_score);
      text = isTotalBet(p) ? String(a + b) : `${a}-${b}`;
      if (LIVE_SPREAD_BET_TYPES.has(betTypeOf(p))) text += ` · ${a === b ? '±0' : `${a > b ? '-' : '+'}${Math.abs(a - b)}`}`;
    }
    return `<span class="fin">${esc(text)}</span>`;
  }

  // The third stat slot, for a leg that hasn't been decided yet: the kickoff
  // time before the game starts, or the running score once it's live. A
  // graded leg has nothing here any more -- its score sits in the chip
  // beside the verdict, and showing it in both places said it twice.
  function thirdStat(p, entry) {
    if (p.result === 'Pending' && entry) return ['Live', `<span class="live-wrap${entry.tone === 'up' ? ' up' : ''}"><span class="dot"></span>${esc(liveText(entry, p))}</span>`];
    if (p.result === 'Pending') return ['Kickoff', esc(fmtTime(p.gametime))];
    return null;
  }

  function legStatsHtml(p, entry) {
    const third = thirdStat(p, entry);
    const st = (label, value) => `<div class="st"><span class="l">${label}</span><span class="v">${value}</span></div>`;
    // A prop's bet line names only the player, so the game they're in gets
    // a fourth slot -- a team bet's line already reads "Bears -3 vs. Jets".
    // publish_parlay_stats.py only finds it for a still-Pending prop.
    return st('Sport', p.sport ? esc(p.sport) : '—') +
      st('Odds', esc(fmtOdds(p.odds))) +
      (third ? st(third[0], third[1]) : '') +
      (p.matchup ? st('Matchup', esc(p.matchup)) : '');
  }

  // Keyed like the live-score map (year:week:name) so expanding a leg
  // survives the 2-minute live-score poll's re-render without carrying the
  // state into a different week -- same pattern as index.html's
  // expandedMatchups for the dashboard's matchup cards.
  const expandedLegs = new Set();

  function renderParlay(week, players, live) {
    const legs = legsSorted(week, players);
    const wins = legs.filter(([, p]) => p.result === 'Win').length;
    const losses = legs.filter(([, p]) => p.result === 'Loss').length;
    const missing = players.filter(p => !week.picks[p]);
    const result = week.final.result;
    const status = result === 'Loss' ? 'Dead' : result === 'Win' ? 'Hit' : 'Alive';
    const statusTone = result === 'Loss' ? 'loss' : result === 'Win' ? 'turf' : 'gold';
    const hero = `
      <div class="glass hero2" style="position:relative">
        <span class="badge week-ribbon">${esc(week.year)} · Week ${esc(week.week)}</span>
        <span class="badge status-ribbon ${statusTone}">${status}</span>
        <div class="hero2-main glow">
          <div class="gold-label-xl">Payout</div>
          <div class="hero2-v">${fmtMoney(week.final.payout)}</div>
          <div class="hero-chips">
            ${week.sacko ? `<span class="hero-chip loss">Sacko: ${esc(week.sacko)}</span>` : ''}
            ${week.killed_by.length ? `<span class="hero-chip loss">Killed by: ${esc(week.killed_by.join(' & '))}</span>` : ''}
          </div>
        </div>
        <div class="hero2-side">
          <div class="hs"><div class="hs-l">Legs Hit</div><div class="hs-r"><div class="hs-v gold">${wins}</div></div></div>
          <div class="hs"><div class="hs-l">Legs Lost</div><div class="hs-r"><div class="hs-v${losses > 0 ? ' loss' : ''}">${losses}</div></div></div>
          <div class="hs"><div class="hs-l">Combined Odds</div><div class="hs-r"><div class="hs-v">${fmtOdds(week.final.odds)}</div></div></div>
          <div class="hs"><div class="hs-l">Split</div><div class="hs-r"><div class="hs-v">${fmtMoney(week.final.split)}</div></div></div>
        </div>
      </div>`;

    const rows = legs.map(([name, p]) => {
      const key = `${week.year}:${week.week}:${name}`;
      const entry = p.result === 'Pending' ? (live || {})[key] : null;
      const tone = entry && entry.tone ? ` live-${entry.tone}` : '';
      const open = expandedLegs.has(key) ? ' open' : '';
      // A live leg says so where its Win/Loss will land -- red like the
      // live dot, an "in progress" marker rather than a verdict either way.
      // An Anytime TD that's already scored (entry.hit) can't un-hit, so it
      // reads Win straight away rather than waiting for the final whistle.
      const hit = entry && entry.hit;
      const resultTone = p.result === 'Win' || hit ? 'turf' : p.result === 'Loss' || entry ? 'loss' : '';
      const resultLabel = hit ? 'Win' : entry ? 'Live' : p.result === 'Pending' ? '—' : p.result;
      return `
      <div class="leg ${p.result}${tone}${open}" data-leg-key="${esc(key)}">
        <div class="leg-head">
          <div class="leg-top">
            <div class="leg-name">${esc(name)}</div>
            <div class="leg-result-group">
              ${entry ? livePillHtml(p, entry) : finalChipHtml(p)}
              <span class="leg-result ${resultTone}">${resultLabel}</span>
              <span class="chev" aria-hidden="true"></span>
            </div>
          </div>
          <div class="leg-bet">${esc(p.pick)}</div>
        </div>
        <div class="leg-detail"><div class="leg-detail-in"><div class="leg-stats">${legStatsHtml(p, entry)}</div></div></div>
      </div>`;
    }).join('') +
      // No pick, nothing to expand -- a flat row, not clickable.
      missing.map(name => `
      <div class="leg missing">
        <div class="leg-head">
          <div class="leg-top">
            <div class="leg-name">${esc(name)}</div>
            <span class="leg-result">—</span>
          </div>
          <div class="leg-bet">No pick yet</div>
        </div>
      </div>`).join('');

    // Hit/lost/live already live in the hero's Legs Hit/Legs Lost stats --
    // repeating them here was the same count twice on one screen.
    //
    // The all-toggle's label is computed from the same expandedLegs Set the
    // per-row "open" class reads, so it's correct on first paint (e.g. after
    // the 2-minute live-score poll re-renders while some legs are already
    // expanded) rather than always starting at "Expand all".
    const legKeys = legs.map(([name]) => `${week.year}:${week.week}:${name}`);
    const allOpen = legKeys.length > 0 && legKeys.every(k => expandedLegs.has(k));
    const toggleAll = legKeys.length
      ? `<button type="button" class="leg-expand-toggle hit" id="leg-expand-toggle">${allOpen ? 'Collapse all' : 'Expand all'}</button>`
      : '';
    const share = legKeys.length
      ? `<button type="button" class="leg-expand-toggle hit" id="leg-share">Share</button>`
      : '';
    return `${hero}
      <div class="glass" style="margin-top:14px">
        <div class="panel-title">Legs<span class="legs-actions">${share}${toggleAll}</span></div>
        <div class="panel-body legs-grid">${rows}</div>
      </div>`;
  }

  // ---------- Parlay Legs banner ----------
  fetch(WORKER_URL + '/legs', { cache: 'no-store', headers: authHeaders() })
    .then(r => r.ok ? r.json() : null)
    .then(b => {
      if (!b || !b.open || b.locked) return;
      const el = document.getElementById('legs-banner');
      const locks = new Date(b.locksAt).toLocaleString('en-US', { timeZone: 'America/New_York', weekday: 'short', hour: 'numeric', minute: '2-digit' }).replace(',', '');
      const mineIn = b.me && b.legs.some(l => l.player === b.me);
      el.innerHTML = `<span class="lb-text"><b>Week ${b.week} legs are open.</b> ${b.legs.length} of ${b.players.length} in · locks ${esc(locks)}</span>
        <span class="lb-go">${mineIn ? 'See the legs' : 'Enter your leg'} ›</span>`;
      el.hidden = false;
    })
    .catch(() => {});

  // ---------- Wiring ----------
  // Reads straight from the Worker/KV now instead of a committed static
  // file (see publish_parlay_stats.py) -- same shape either way, so
  // nothing downstream of this fetch needed to change.
  fetch(WORKER_URL + '/parlay-stats', { cache: 'no-store' })
    .then(res => res.json())
    .then(data => {
      const { players, weeks, stats } = data;
      let live = data.live || {};
      const current = weeks[weeks.length - 1];
      const years = [...new Set(weeks.map(w => w.year))].sort((a, b) => b - a);
      const yearSel = document.getElementById('year-select');
      const weekSel = document.getElementById('week-select');
      const backBtn = document.getElementById('back-to-current');
      const container = document.getElementById('current-container');
      yearSel.innerHTML = years.map(y => `<option value="${y}">${y}</option>`).join('');

      function fillWeeks(preferred) {
        const inYear = weeks.filter(w => w.year === Number(yearSel.value)).sort((a, b) => b.week - a.week);
        weekSel.innerHTML = inYear.map(w => `<option value="${w.week}">Week ${w.week}</option>`).join('');
        if (preferred !== undefined && inYear.some(w => w.week === preferred)) weekSel.value = preferred;
      }
      // The Share button's picture (share.js): the hero + legs card with
      // every leg open. Redrawn a moment after every render -- a week
      // change, a live-score poll -- and dropped the instant the card
      // changes, so a tap never shares a stale picture.
      const shot = RLShare.make({
        eager: true,
        nodes: () => [...container.children],
        eyebrow: 'Retirement League',
        name: () => `parlay-${yearSel.value}-week-${weekSel.value}.png`,
        prep: wrap => wrap.querySelectorAll('.leg:not(.missing)').forEach(l => l.classList.add('open')),
      });
      function showSelected() {
        const w = weeks.find(x => x.year === Number(yearSel.value) && x.week === Number(weekSel.value));
        if (!w) return;
        const isCurrent = w === current;
        backBtn.hidden = isCurrent;
        container.innerHTML = renderParlay(w, players, live);
        shot.queue();
      }
      // Keeps the all-toggle's label matching the actual state after a
      // per-row click, instead of waiting for the next full re-render.
      function syncExpandAllLabel() {
        const btn = container.querySelector('#leg-expand-toggle');
        if (!btn) return;
        const rows = [...container.querySelectorAll('.leg:not(.missing)')];
        const allOpen = rows.length > 0 && rows.every(r => r.classList.contains('open'));
        btn.textContent = allOpen ? 'Collapse all' : 'Expand all';
      }
      // Delegated once on the container rather than per-leg, since
      // showSelected() rebuilds the legs' markup wholesale on every
      // selection change and every 2-minute live-score poll.
      container.addEventListener('click', e => {
        // On a phone, the picture goes to the share sheet (straight into
        // Messages); anywhere else, onto the clipboard to paste. If either
        // is refused, the picture opens on screen to save by hand.
        const shareBtn = e.target.closest('#leg-share');
        if (shareBtn) { shot.share(shareBtn); return; }
        const toggleAll = e.target.closest('#leg-expand-toggle');
        if (toggleAll) {
          const rows = [...container.querySelectorAll('.leg:not(.missing)')];
          const allOpen = rows.length > 0 && rows.every(r => r.classList.contains('open'));
          rows.forEach(r => {
            const key = r.dataset.legKey;
            r.classList.toggle('open', !allOpen);
            if (allOpen) expandedLegs.delete(key); else expandedLegs.add(key);
          });
          toggleAll.textContent = allOpen ? 'Expand all' : 'Collapse all';
          return;
        }
        const leg = e.target.closest('.leg:not(.missing)');
        if (!leg) return;
        const key = leg.dataset.legKey;
        if (expandedLegs.has(key)) expandedLegs.delete(key); else expandedLegs.add(key);
        leg.classList.toggle('open');
        syncExpandAllLabel();
      });
      function selectCurrent() {
        yearSel.value = current.year;
        fillWeeks(current.week);
        showSelected();
      }
      selectCurrent();
      riseIn(container.children);
      yearSel.addEventListener('change', () => { fillWeeks(); showSelected(); });
      weekSel.addEventListener('change', showSelected);
      backBtn.addEventListener('click', selectCurrent);

      // Re-checks just the live-score map every couple minutes (the same
      // endpoint, re-fetched -- one cheap KV read) and re-renders the
      // currently-displayed week in place, without touching the
      // year/week selection or the Stats section below. publish_parlay_stats.py
      // only refreshes this data every 10 minutes itself, but polling a
      // little faster here means a game that just went live (or just
      // ended) shows up close to as soon as the backend has it. Hidden
      // tabs skip the poll; coming back catches up if it's gone stale.
      const LIVE_POLL_MS = 120000;
      let liveLoadAt = Date.now();
      function pollLive() {
        liveLoadAt = Date.now();
        fetch(WORKER_URL + '/parlay-stats', { cache: 'no-store' })
          .then(res => res.json())
          .then(fresh => { live = fresh.live || {}; showSelected(); })
          .catch(() => {}); // a missed poll just tries again next interval
      }
      setInterval(() => { if (!document.hidden) pollLive(); }, LIVE_POLL_MS);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && Date.now() - liveLoadAt >= LIVE_POLL_MS) pollLive();
      });

      document.getElementById('updated-at').textContent = formatUpdated(data.generated_at);
    })
    .catch(err => {
      console.error('Parlay data error:', err);
      document.getElementById('current-container').innerHTML = '<div class="loading-row" style="color:var(--loss);">Error loading parlay data.</div>';
    });
</script>
<script src="track.js?v=2" defer></script>
</body>
</html>
