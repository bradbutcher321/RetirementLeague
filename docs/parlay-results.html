<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>html{background:#050505}</style>
<title>Retirement League — Parlay Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The two font-family's woff2 files Google serves for the latin subset
     at the weights this site uses -- one variable-font file per family
     covers every weight declared, confirmed directly by fetching the
     stylesheet below and comparing each @font-face block's url(). Starts
     the actual font downloads immediately, in parallel with that
     stylesheet fetch, instead of waiting to discover these same URLs
     only after the stylesheet loads and is parsed -- avoids the
     fallback-to-webfont swap (FOUT) that otherwise shows on a slow or
     uncached load. If Google ever changes these hashed URLs, this just
     degrades to a wasted (unused) preload, not a correctness issue -- the
     stylesheet's own @font-face still fetches whatever the new URL is. -->
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/bigshouldersdisplay/v24/fC1_PZJEZG-e9gHhdI4-NBbfd2ys3SjJCx1czNDu.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=4">
<link rel="stylesheet" href="nav.css?v=3">
<style>
  /* ---------- Week selector ---------- */
  .selector-row{ display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .selector-label{ color: var(--text-dim); font-size: 0.82rem; }
  .parlay-select{
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: var(--body);
    font-size: 0.95rem;
    font-weight: 600;
    padding: 9px 12px;
    border-radius: 4px;
  }
  .parlay-select:focus{ outline: 1px solid var(--gold); }
  .back-link{
    background: none;
    border: 1px solid var(--gold);
    color: var(--gold);
    font-family: var(--body);
    font-size: 0.8rem;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 4px;
    cursor: pointer;
  }
  .back-link:hover{ background: rgba(186,155,55,0.1); }
  .back-link:disabled{ opacity: 0.5; cursor: default; }
  .back-link:disabled:hover{ background: none; }
  .back-link[hidden]{ display: none; }

  /* Season/scope selector: solid-filled toggle, the most prominent of the
     three levels so it doesn't read as just another row of tabs. */
  .scope-row{ display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .scope-btn{ background: var(--surface-raised); border: 1px solid var(--line); color: var(--text-dim); font-family: var(--body); font-weight: 700; font-size: 0.85rem; padding: 8px 16px; border-radius: 5px; cursor: pointer; }
  .scope-btn:hover:not(.on){ color: var(--text); }
  .scope-btn.on{ background: var(--gold); border-color: var(--gold); color: #050505; }

  /* Category tabs: outline pills. */
  .tabs{ display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .tab{ background: none; border: 1px solid var(--line); color: var(--text-dim); font-family: var(--body); font-size: 0.86rem; font-weight: 600; padding: 9px 16px; border-radius: 999px; cursor: pointer; }
  .tab:hover{ border-color: var(--gold); color: var(--text); }
  .tab.on{ border-color: var(--gold); color: var(--gold); background: rgba(186,155,55,0.10); }

  /* Subsections within a category: bordered segmented bar. */
  .seg{ display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 4px 0 18px; }
  .seg button{ background: none; border: none; color: var(--text-dim); font-family: var(--body); font-weight: 600; font-size: 0.82rem; padding: 8px 15px; cursor: pointer; }
  .seg button:hover{ color: var(--text); }
  .seg button.on{ background: rgba(186,155,55,0.14); color: var(--gold); }

  /* ---------- Parlay hero: Payout as the one glowing headline number,
     Legs Hit/Lost/Combined Odds/Split as quiet side stats, reusing the
     shared .glass/.hero2/.hs components instead of a row of
     identically-weighted tiles. Status is its own corner ribbon, fully
     detached from the hero number instead of sharing a row with an
     eyebrow label. ---------- */
  .status-ribbon{ position: absolute; top: 18px; right: 18px; }
  .gold-label-xl{ color: var(--gold); font-size: 0.95rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; }
  /* Clears the status ribbon above -- its badge text length varies
     ("Parlay alive" vs "Parlay dead" vs "Parlay hit"), so the first side
     row needs guaranteed headroom rather than whatever theme.css's
     default .hero2-side padding happens to leave. */
  .hero2-side{ padding-top: 46px; }

  .hero-chips{ display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; position: relative; }
  .hero-chip{ display: inline-flex; align-items: center; background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-size: 0.8rem; color: var(--text); }
  .hero-chip.loss{ border-color: rgba(214,98,79,0.4); background: rgba(214,98,79,0.08); color: var(--loss); font-weight: 600; }

  .memoriam{ position: relative; margin-top: 12px; padding: 12px 16px; background: rgba(214,98,79,0.08); border: 1px solid rgba(214,98,79,0.3); border-radius: 10px; text-align: center; }
  .memoriam-label{ color: var(--text-dim); font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.08em; }
  .memoriam-killer{ font-family: var(--scoreboard); font-weight: 800; font-size: 1rem; color: var(--loss); margin-top: 4px; }

  /* ---------- Legs: each its own small card, not rows in a table ---------- */
  .legs-label{ display: flex; align-items: center; gap: 10px; color: var(--text-dim); font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin: 22px 0 10px; }
  .legs-label::after{ content: ''; flex: 1; height: 1px; background: var(--line); }
  .leg{
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 10px;
    padding: 14px 18px;
    margin-top: 10px;
    background: rgba(255,255,255,0.025);
    border: 1px solid var(--line);
    border-radius: 12px;
    border-left: 3px solid transparent;
  }
  .leg:first-child{ margin-top: 0; }
  .leg.Win{ border-left-color: var(--turf); }
  .leg.Loss{ border-left-color: var(--loss); }
  .leg.live-up{ background: rgba(76,154,107,0.08); border-left-color: var(--turf-dim); }
  .leg.live-down{ background: rgba(192,87,75,0.08); border-left-color: var(--loss); }
  .leg-name{ font-weight: 700; }
  .leg-bet{ font-size: 0.92rem; margin-top: 2px; }
  .leg-meta{ color: var(--text-dim); font-size: 0.78rem; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .leg-result{ font-family: var(--scoreboard); font-weight: 700; font-size: 0.92rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-dim); white-space: nowrap; }
  .leg-result.turf{ color: var(--turf); }
  .leg-result.loss{ color: var(--loss); }
  .leg-live{ display: flex; align-items: center; gap: 6px; color: var(--text-dim); font-size: 0.78rem; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .leg-live .dot{ width: 6px; height: 6px; border-radius: 50%; background: var(--loss); flex-shrink: 0; animation: leg-live-pulse 1.5s ease-in-out infinite; }
  @keyframes leg-live-pulse{ 0%, 100%{ opacity: 1; } 50%{ opacity: 0.25; } }
  @media (max-width: 480px){
    .leg{ padding: 12px 14px; }
  }

  /* ---------- Stat cards ---------- */
  .card-grid{ display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
  @media (max-width: 720px){ .card-grid{ grid-template-columns: 1fr; } }
  .stat-card{ background: linear-gradient(165deg, var(--surface-2), var(--surface)); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 20px 50px -20px rgba(0,0,0,0.6); border-top: 3px solid var(--gold); overflow: hidden; }
  .stat-card-title{ padding: 12px 16px 4px; font-weight: 700; font-size: 0.95rem; }
  .stat-card-note{ color: var(--text-dim); font-size: 0.74rem; padding: 0 16px 8px; }
  .stat-card-body{ padding: 6px 10px 12px; }

  .pill{ font-size: 0.78rem; font-weight: 700; padding: 4px 11px; border-radius: 999px; border: 1px solid; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .pill.up{ color: var(--turf); border-color: var(--turf-dim); background: rgba(76,154,107,0.10); }
  .pill.flat{ color: var(--text-dim); border-color: var(--line); }
  .pill.down{ color: var(--loss); border-color: var(--loss); background: rgba(192,87,75,0.10); }

  /* Ranked rows: Game Records' .cols/.ln pattern -- a plain two-column list,
     rank 1 picked out with a colored left border instead of a podium tile. */
  .cols{ display: flex; flex-direction: column; }
  .ln{
    display: grid; grid-template-columns: 30px minmax(0,1fr) auto; align-items: center; gap: 12px;
    background: var(--surface-raised); border: 1px solid var(--line); border-radius: 10px; border-left: 3px solid var(--turf);
    padding: 9px 12px; margin-top: 6px; min-height: 58px;
  }
  .ln.norank{ grid-template-columns: minmax(0,1fr) auto; }
  .ln .rk{ font-family: var(--scoreboard); font-weight: 700; color: var(--text-dim); text-align: center; font-size: 1.2rem; }
  .ln .tm{ font-weight: 700; font-size: 0.92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ln .meta{ color: var(--text-dim); font-size: 0.72rem; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ln.rec.up{ border-color: var(--turf); background: rgba(76,154,107,0.07); }
  .ln.rec.up .rk{ color: var(--turf); }
  .ln.rec.down{ border-color: var(--loss); background: rgba(192,87,75,0.07); }
  .ln.rec.down .rk{ color: var(--loss); }
  .row-stats{ display: flex; gap: 14px; }
  .row-stat{ text-align: center; min-width: 34px; }
  .row-stat b{ display: block; font-family: var(--scoreboard); font-size: 1.15rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .row-stat b.up{ color: var(--turf); }
  .row-stat b.down{ color: var(--loss); }
  .row-stat span{ font-size: 0.6rem; color: var(--text-dim); letter-spacing: 0.04em; text-transform: uppercase; }
  .ln-val{ font-family: var(--scoreboard); font-weight: 700; font-size: 1.1rem; font-variant-numeric: tabular-nums; }

  /* ---------- Histograms ---------- */
  .hist-row{ display: grid; grid-template-columns: 26px 1fr 30px; align-items: center; gap: 10px; padding: 5px 16px; font-size: 0.82rem; font-variant-numeric: tabular-nums; }
    .hist-row:last-child{ padding-bottom: 12px; }
  .hist-label{ color: var(--text-dim); text-align: right; }
  .hist-track{ height: 10px; }
  .hist-bar{ height: 100%; border-radius: 0 4px 4px 0; min-width: 0; }
  .hist-bar.low{ background: var(--loss); }
  .hist-bar.mid{ background: var(--turf); }
  .hist-bar.full{ background: var(--gold); }
  .hist-count{ text-align: right; font-weight: 600; }
  .hist-count.zero{ color: var(--text-dim); font-weight: 400; }

  .empty-note{ padding: 22px 10px; color: var(--text-dim); font-size: 0.85rem; text-align: center; }

  /* ---------- Collapsible tray (Jon's Table), closed until opened ---------- */
  .tray > summary{
    list-style: none; cursor: pointer; display: flex; align-items: baseline; gap: 12px;
    padding-bottom: 10px; border-bottom: 1px solid var(--line); color: var(--text-dim); font-size: 1rem; font-weight: 600;
  }
  .tray > summary::-webkit-details-marker{ display: none; }
  .tray > summary:hover .tray-title{ color: var(--text); }
  .tray-summary{ flex: 1; text-align: right; font-size: 0.78rem; font-weight: 500; }
  .tray-chevron{
    width: 8px; height: 8px; border-right: 2px solid var(--gold); border-bottom: 2px solid var(--gold);
    transform: rotate(45deg) translateY(-2px); transition: transform 0.2s ease; align-self: center;
  }
  .tray[open] > summary .tray-chevron{ transform: rotate(-135deg) translateY(-2px); }
  .tray-body{ margin-top: 16px; }

  .jt-toolbar{ display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-bottom: 10px; }
  .jt-status{ color: var(--text-dim); font-size: 0.78rem; }
  .table-wrap{ overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
  .jt-table{ width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  .jt-table th, .jt-table td{ padding: 9px 14px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .jt-table th{ color: var(--text-dim); font-weight: 700; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em; background: var(--surface-raised); }
  .jt-table th:first-child, .jt-table td:first-child{ text-align: left; font-weight: 600; }
  .jt-table tbody tr:hover{ background: var(--surface-raised); }
  .jt-table tbody tr:last-child td{ border-bottom: none; }
</style>
</head>
<body>
  <div id="site-nav"></div>
  <div class="wrap">
    <header>
      <div class="header-row">
        <div>
          <div class="eyebrow">Retirement League</div>
          <h1>Parlay Results</h1>
        </div>
        <div class="updated-block">
          <div class="updated-label">Updated</div>
          <div class="updated-value" id="updated-at">—</div>
        </div>
      </div>
    </header>

    <section>
      <h2 id="parlay-heading">Current Parlay</h2>
      <div class="selector-row">
        <label class="selector-label" for="year-select">Year</label>
        <select class="parlay-select" id="year-select" autocomplete="off"></select>
        <label class="selector-label" for="week-select">Week</label>
        <select class="parlay-select" id="week-select" autocomplete="off"></select>
        <button type="button" class="back-link" id="back-to-current" hidden>Back to current</button>
      </div>
      <div id="current-container"><div class="loading-row">Loading parlay…</div></div>
    </section>

    <section>
      <h2>Stats</h2>
      <div class="scope-row" id="scope-tab-row"></div>
      <div class="tabs" id="category-tab-row"></div>
      <div id="sub-tab-row"></div>
      <div class="card-grid" id="stats-container"></div>
    </section>

    <section>
      <details class="tray">
        <summary>
          <span class="tray-title">Jon's Table</span>
          <span class="tray-summary" id="jt-summary"></span>
          <span class="tray-chevron" aria-hidden="true"></span>
        </summary>
        <div class="tray-body">
          <div class="scope-row" id="jt-scope-row"></div>
          <div class="jt-toolbar">
            <span class="jt-status" id="jt-refresh-status"></span>
            <button type="button" class="back-link" id="jt-refresh-btn">Refresh Data</button>
            <button type="button" class="back-link" id="jt-copy-btn">Copy All</button>
          </div>
          <div class="table-wrap">
            <table class="jt-table">
              <thead>
                <tr><th>Team</th><th>W</th><th>L</th><th>Win %</th><th>Avg Odds</th><th>Kills</th><th>Sackos</th></tr>
              </thead>
              <tbody id="jt-tbody"></tbody>
            </table>
          </div>
        </div>
      </details>
    </section>

    <footer id="footer">Full refresh every 10 minutes · Data from the league sheet</footer>
  </div>

<script src="nav.js"></script>
<script src="page-common.js"></script>
<script>
  const WORKER_URL = 'https://retirement-league-refresh-proxy.bradbutcher321.workers.dev';
  const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  function fmtOdds(o) {
    if (o === null || o === undefined) return '—';
    const n = Math.round(o);
    return (n > 0 ? '+' : '') + n.toLocaleString();
  }
  function fmtMoney(n) {
    if (n === null || n === undefined) return '—';
    return '$' + Number(n).toLocaleString(undefined, { maximumFractionDigits: 0 });
  }
  function fmtPct(n) {
    return n === null || n === undefined ? '—' : Number(n).toFixed(1) + '%';
  }
  function fmtTime(iso) {
    if (!iso) return 'TBD';
    const d = new Date(iso);
    const h = d.getHours();
    const mins = String(d.getMinutes()).padStart(2, '0');
    return `${DAYS[d.getDay()]} ${h % 12 || 12}:${mins}${h < 12 ? 'AM' : 'PM'}`;
  }
  // ---------- Parlay (current / past) ----------
  function legsSorted(week, players) {
    return players.filter(p => week.picks[p])
      .map(p => [p, week.picks[p]])
      .sort((a, b) => (a[1].gametime || '9999').localeCompare(b[1].gametime || '9999'));
  }

  // entry: {kind: 'team', team_score, opponent_score, period, clock, tone} or
  // {kind: 'prop', stat, tone} -- see publish_parlay_stats.py's build_live_scores.
  function liveLine(entry) {
    if (!entry) return '';
    const clock = entry.kind === 'team' && entry.period ? ` · Q${entry.period} ${entry.clock || ''}`.trim() : '';
    const text = entry.kind === 'team'
      ? `${Math.round(entry.team_score)}-${Math.round(entry.opponent_score)}${clock}`
      : `${entry.stat % 1 === 0 ? entry.stat : entry.stat.toFixed(1)} so far`;
    return `<div class="leg-live"><span class="dot"></span>${esc(text)}</div>`;
  }

  function renderParlay(week, players, live) {
    const legs = legsSorted(week, players);
    const wins = legs.filter(([, p]) => p.result === 'Win').length;
    const losses = legs.filter(([, p]) => p.result === 'Loss').length;
    const missing = players.filter(p => !week.picks[p]);
    const result = week.final.result;
    const status = result === 'Loss' ? 'Parlay dead' : result === 'Win' ? 'Parlay hit' : 'Parlay alive';
    const statusTone = result === 'Loss' ? 'loss' : result === 'Win' ? 'turf' : 'gold';
    const hero = `
      <div class="glass hero2" style="position:relative">
        <span class="badge status-ribbon ${statusTone}">${status}</span>
        <div class="hero2-main glow">
          <div class="gold-label-xl">Payout</div>
          <div class="hero2-v">${fmtMoney(week.final.payout)}</div>
          <div class="hero-chips">
            <span class="hero-chip">${esc(week.year)} · Week ${esc(week.week)}</span>
            ${week.sacko ? `<span class="hero-chip loss">Sacko: ${esc(week.sacko)}</span>` : ''}
          </div>
          ${week.killed_by.length ? `
          <div class="memoriam">
            <div class="memoriam-label">In Memoriam</div>
            <div class="memoriam-killer">Killed by ${esc(week.killed_by.join(' & '))}</div>
          </div>` : ''}
        </div>
        <div class="hero2-side">
          <div class="hs"><div class="hs-l">Legs Hit</div><div class="hs-r"><div class="hs-v gold">${wins}</div></div></div>
          <div class="hs"><div class="hs-l">Legs Lost</div><div class="hs-r"><div class="hs-v${losses > 0 ? ' loss' : ''}">${losses}</div></div></div>
          <div class="hs"><div class="hs-l">Combined Odds</div><div class="hs-r"><div class="hs-v">${fmtOdds(week.final.odds)}</div></div></div>
          <div class="hs"><div class="hs-l">Split</div><div class="hs-r"><div class="hs-v">${fmtMoney(week.final.split)}</div></div></div>
        </div>
      </div>`;

    const rows = legs.map(([name, p]) => {
      const entry = p.result === 'Pending' ? (live || {})[`${week.year}:${week.week}:${name}`] : null;
      const tone = entry && entry.tone ? ` live-${entry.tone}` : '';
      // detail: the score/stat the pick was actually graded from (see
      // auto_grade_results.py's Grade Detail column) -- shown once a leg
      // is decided, so "why" is visible next to the result, not just
      // while the game's still live.
      const detail = p.result !== 'Pending' && p.detail
        ? `<div class="leg-meta">${esc(p.detail)}</div>` : '';
      const resultTone = p.result === 'Win' ? 'turf' : p.result === 'Loss' ? 'loss' : '';
      const resultLabel = p.result === 'Pending' ? '—' : p.result;
      return `
      <div class="leg ${p.result}${tone}">
        <div style="min-width:0">
          <div class="leg-name">${esc(name)}</div>
          <div class="leg-bet">${esc(p.pick)}</div>
          <div class="leg-meta">${p.sport ? esc(p.sport) + ' · ' : ''}${fmtOdds(p.odds)} · ${fmtTime(p.gametime)}</div>
          ${detail}
          ${liveLine(entry)}
        </div>
        <div class="leg-result ${resultTone}">${resultLabel}</div>
      </div>`;
    }).join('') +
      missing.map(name => `
      <div class="leg">
        <div style="min-width:0">
          <div class="leg-name">${esc(name)}</div>
          <div class="leg-meta">No pick yet</div>
        </div>
        <div class="leg-result">—</div>
      </div>`).join('');

    return `${hero}<div class="legs-label">Legs</div>${rows}`;
  }

  // ---------- Stat cards ----------
  const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
  const pill = (text, up) => `<span class="pill ${up ? 'up' : 'down'}">${text}</span>`;
  const winPill = pct => pct === null || pct === undefined ? '<span class="pill flat">—</span>' : pill(fmtPct(pct), pct >= 50);
  const signedMoney = n => (n < 0 ? '-' : '') + fmtMoney(Math.abs(n));
  // list entries are [value, label, tone?] -- tone 'up'/'down' colors just that number.
  const stats = list => `<div class="row-stats">${list.map(([v, l, tone]) => `<div class="row-stat"><b class="${tone || ''}">${v}</b><span>${l}</span></div>`).join('')}</div>`;
  // Highlights every item tied for the max (or min) of valueFn's result, by
  // setting item.highlight to the given tone -- used so "tied for the lead"
  // (or "tied for last") picks out every row that qualifies, not just one.
  function highlightExtreme(items, valueFn, which, tone) {
    if (!items.length) return;
    const vals = items.map(valueFn);
    const target = which === 'max' ? Math.max(...vals) : Math.min(...vals);
    items.forEach((it, i) => { if (vals[i] === target) it.highlight = tone; });
  }

  // items: { name, sub/detail, right, unranked, highlight }. Ranked lists
  // (the default) number every row; unless an item sets `highlight`
  // ('up'/'down') explicitly, #1 is picked out the way Game Records does --
  // a colored left border, no separate "top 3" tile treatment. Pass
  // podium: false for lists that are buckets, not rankings (e.g. Favorite
  // vs. Underdog), which renders as a plain unnumbered list instead.
  function rankedCard(title, items, opts = {}) {
    const ranked = opts.podium !== false;
    let rank = 0;
    const rows = items.map(it => {
      const body = `<div style="min-width:0"><div class="tm">${esc(it.name)}</div>${it.detail || it.sub ? `<div class="meta">${esc(it.detail || it.sub)}</div>` : ''}</div>${it.right || '<span></span>'}`;
      if (!ranked) return `<div class="ln norank">${body}</div>`;
      if (!it.unranked) rank++;
      const auto = rank === 1 && !it.unranked ? 'up' : null;
      const tone = it.highlight !== undefined ? it.highlight : auto;
      return `<div class="ln${tone ? ` rec ${tone}` : ''}"><div class="rk">${it.unranked ? '–' : rank}</div>${body}</div>`;
    });
    const cols = `<div class="cols">${rows.join('')}</div>`;
    return `
      <div class="stat-card">
        <div class="stat-card-title">${title}</div>
        ${opts.note ? `<div class="stat-card-note">${opts.note}</div>` : ''}
        <div class="stat-card-body">${cols}</div>
      </div>`;
  }

  // Keeps the 10 most-bet categories (ordered by win %) and folds the rest
  // into a single "All Others" row so the card can't grow without bound.
  function condensedWlItems(rows, key, limit = 10) {
    if (rows.length <= limit) return wlItems(rows, key);
    const byVolume = [...rows].sort((a, b) => (b.w + b.l) - (a.w + a.l));
    const kept = new Set(byVolume.slice(0, limit));
    const others = rows.filter(r => !kept.has(r));
    const w = others.reduce((a, r) => a + r.w, 0);
    const l = others.reduce((a, r) => a + r.l, 0);
    const items = wlItems(rows.filter(r => kept.has(r)), key);
    items.push({
      name: 'All Others', unranked: true, sub: `${w}-${l} · ${others.length} more`, big: fmtPct(w + l ? w / (w + l) * 100 : null),
      right: winPill(w + l ? w / (w + l) * 100 : 0),
    });
    return items;
  }

  function wlItems(rows, key) {
    return rows.map(r => ({ name: r[key], sub: `${r.w}-${r.l}`, big: fmtPct(r.win_pct), right: winPill(r.win_pct) }));
  }

  function histCard(title, rows, note) {
    const max = Math.max(1, ...rows.map(r => r.occurrences));
    const body = rows.map(r => `
      <div class="hist-row">
        <div class="hist-label">${r.legs}</div>
        <div class="hist-track"><div class="hist-bar ${r.legs < 6 ? 'low' : r.legs < 12 ? 'mid' : 'full'}" style="width:${r.occurrences / max * 100}%"></div></div>
        <div class="hist-count${r.occurrences ? '' : ' zero'}">${r.occurrences}</div>
      </div>`).join('');
    return `<div class="stat-card"><div class="stat-card-title">${title}</div><div class="stat-card-note">${note}</div><div class="stat-card-body">${body}</div></div>`;
  }

  function withTotal(rows, key) {
    const tw = rows.reduce((a, r) => a + r.w, 0);
    const tl = rows.reduce((a, r) => a + r.l, 0);
    const items = wlItems(rows, key);
    items.push({ name: 'Total', sub: `${tw}-${tl}`, right: winPill(tw + tl ? tw / (tw + tl) * 100 : null) });
    return items;
  }

  function weekLabel(r) {
    return `${r.year} · Week ${r.week}`;
  }

  // ---------- Individual cards, one function per card, keyed by name ----------
  const CARD = {
    legsPerParlay: s => histCard('Legs Won per Parlay', s.legs_won_per_parlay, 'Weeks by how many of the legs hit, once every leg was graded.'),
    legsBeforeLoss: s => histCard('Legs Won Before First Loss', s.legs_won_before_loss, 'Weeks by how many legs won, in game-time order, before the first loss.'),

    individualWL: s => rankedCard('Individual W/L', wlItems(s.individual_wl, 'player')),
    averageOdds: s => rankedCard('Average Odds', s.average_odds.map(r => ({
      name: r.player, right: `<span class="ln-val">${fmtOdds(r.avg_odds)}</span>`,
    }))),
    winStreaks: s => {
      const rows = [...s.streaks].sort((a, b) => b.longest_win - a.longest_win || b.current - a.current)
        .map(r => ({ player: r.player, longest_win: r.longest_win, curWin: Math.max(r.current, 0) }));
      const maxLongest = Math.max(...rows.map(r => r.longest_win));
      const maxCurrent = Math.max(...rows.map(r => r.curWin));
      return rankedCard('Win Streaks', rows.map(r => {
        const longestTie = r.longest_win === maxLongest;
        const currentTie = maxCurrent > 0 && r.curWin === maxCurrent;
        return {
          name: r.player, sub: `Current ${r.curWin}`,
          right: stats([[r.longest_win, 'Longest', longestTie ? 'up' : null], [r.curWin, 'Current', currentTie ? 'up' : null]]),
          highlight: (longestTie || currentTie) ? 'up' : null,
        };
      }));
    },
    lossStreaks: s => {
      const rows = [...s.streaks].sort((a, b) => b.longest_loss - a.longest_loss || a.current - b.current)
        .map(r => ({ player: r.player, longest_loss: r.longest_loss, curLoss: Math.max(-r.current, 0) }));
      const maxLongest = Math.max(...rows.map(r => r.longest_loss));
      const maxCurrent = Math.max(...rows.map(r => r.curLoss));
      return rankedCard('Losing Streaks', rows.map(r => {
        const longestTie = r.longest_loss === maxLongest;
        const currentTie = maxCurrent > 0 && r.curLoss === maxCurrent;
        return {
          name: r.player, sub: `Current ${r.curLoss}`,
          right: stats([[r.longest_loss, 'Longest', longestTie ? 'down' : null], [r.curLoss, 'Current', currentTie ? 'down' : null]]),
          highlight: (longestTie || currentTie) ? 'down' : null,
        };
      }));
    },

    potentialEarnings: s => {
      const earnings = s.potential_earnings.map(r => ({ player: r.player, net: r.winnings - r.losses })).sort((a, b) => b.net - a.net);
      const items = earnings.map(r => ({ name: r.player, right: pill(signedMoney(r.net), r.net >= 0), net: r.net }));
      highlightExtreme(items, it => it.net, 'min', 'down');
      return rankedCard('Potential Earnings', items);
    },
    flatBetProfit: s => {
      const items = s.flat_bet_profit.map(r => ({ name: r.player, sub: plural(r.bets, 'bet'), right: pill(signedMoney(r.profit), r.profit >= 0), profit: r.profit }));
      highlightExtreme(items, it => it.profit, 'min', 'down');
      return rankedCard('Flat Bet Profit', items);
    },

    biggestHit: s => {
      const items = s.biggest_hits.map(r => ({ name: r.player, sub: r.sport || '', right: stats([[fmtOdds(r.odds), 'Odds']]), detail: r.pick, odds: r.odds }));
      highlightExtreme(items, it => it.odds, 'max', 'up');
      return rankedCard('Biggest Hit', items);
    },
    safestLoss: s => {
      const items = s.safest_losses.map(r => ({ name: r.player, sub: r.sport || '', right: stats([[fmtOdds(r.odds), 'Odds']]), detail: r.pick, odds: r.odds }));
      highlightExtreme(items, it => it.odds, 'min', 'down');
      return rankedCard('Safest Loss', items);
    },

    weeklySackos: s => {
      const items = s.weekly_sackos.map(r => ({ name: r.player, sub: fmtMoney(r.cost), right: stats([[r.sackos, r.sackos === 1 ? 'Sacko' : 'Sackos']]), sackos: r.sackos }));
      highlightExtreme(items, it => it.sackos, 'max', 'down');
      highlightExtreme(items, it => it.sackos, 'min', 'up');
      return rankedCard('Weekly Sacko Count', items);
    },
    parlaysKilled: s => {
      const items = s.parlays_killed.map(r => ({
        name: r.player, sub: plural(r.kill_chances, 'chance'),
        right: stats([[r.kills.toFixed(1), 'Kills'], [r.avg_bet_position === null ? '—' : r.avg_bet_position.toFixed(1), 'Avg Pos']]),
        kills: r.kills,
      }));
      highlightExtreme(items, it => it.kills, 'max', 'down');
      highlightExtreme(items, it => it.kills, 'min', 'up');
      return rankedCard('Parlays Killed', items);
    },

    sportWL: s => rankedCard('Sport W/L', condensedWlItems(s.sport_wl, 'sport')),
    betTypeWL: s => rankedCard('Bet Type W/L', condensedWlItems(s.bet_type_wl, 'bet_type')),
    favoriteUnderdog: s => rankedCard('Favorite vs. Underdog', withTotal(s.odds_type_wl, 'odds_type'), { podium: false }),
    oddsRange: s => rankedCard('Odds Range', wlItems(s.odds_range_wl, 'range'), { podium: false }),
    overUnder: s => rankedCard('Over vs. Under', withTotal(s.over_under_wl, 'side'), { podium: false }),
    dayOfWeek: s => rankedCard('Day of Week', wlItems(s.day_of_week_wl, 'day'), { podium: false }),
    biggestMisses: s => rankedCard('Biggest Misses', s.biggest_misses.map(r => ({
      name: weekLabel(r), sub: `Killed by ${r.killed_by.join(' & ')}`,
      right: stats([[fmtMoney(r.payout), 'Payout']]),
    })), { podium: false }),
    closestCalls: s => rankedCard('Closest Calls', s.closest_calls.map(r => ({
      name: weekLabel(r), sub: `Missed by ${r.lost_by.join(', ')}`,
      right: stats([[`${r.legs_hit}/12`, 'Legs Hit']]),
    })), { podium: false }),
  };

  // ---------- Category > subsection structure ----------
  const CATEGORIES = [
    { label: 'How Far Parlays Get', cards: ['legsPerParlay', 'legsBeforeLoss'] },
    {
      label: 'Betting Stats',
      subsections: [
        { label: 'Record', cards: ['individualWL', 'averageOdds'] },
        { label: 'Streaks', cards: ['winStreaks', 'lossStreaks'] },
        { label: 'Picks', cards: ['biggestHit', 'safestLoss'] },
        { label: 'Sacko & Kills', cards: ['weeklySackos', 'parlaysKilled'] },
      ],
    },
    {
      label: 'Bet Breakdowns',
      subsections: [
        { label: 'Bet Type', cards: ['sportWL', 'betTypeWL'] },
        { label: 'Odds', cards: ['favoriteUnderdog', 'overUnder', 'dayOfWeek', 'oddsRange'] },
      ],
    },
    {
      label: 'Misc',
      subsections: [
        { label: 'Money', cards: ['potentialEarnings', 'flatBetProfit'] },
        { label: 'Notable Weeks', cards: ['biggestMisses', 'closestCalls'] },
      ],
    },
  ];

  // ---------- Wiring ----------
  // Reads straight from the Worker/KV now instead of a committed static
  // file (see publish_parlay_stats.py) -- same shape either way, so
  // nothing downstream of this fetch needed to change.
  fetch(WORKER_URL + '/parlay-stats', { cache: 'no-store' })
    .then(res => res.json())
    .then(data => {
      const { players, weeks, stats } = data;
      let live = data.live || {};
      const current = weeks[weeks.length - 1];
      const years = [...new Set(weeks.map(w => w.year))].sort((a, b) => b - a);
      const yearSel = document.getElementById('year-select');
      const weekSel = document.getElementById('week-select');
      const backBtn = document.getElementById('back-to-current');
      const heading = document.getElementById('parlay-heading');
      const container = document.getElementById('current-container');
      yearSel.innerHTML = years.map(y => `<option value="${y}">${y}</option>`).join('');

      function fillWeeks(preferred) {
        const inYear = weeks.filter(w => w.year === Number(yearSel.value)).sort((a, b) => b.week - a.week);
        weekSel.innerHTML = inYear.map(w => `<option value="${w.week}">Week ${w.week}</option>`).join('');
        if (preferred !== undefined && inYear.some(w => w.week === preferred)) weekSel.value = preferred;
      }
      function showSelected() {
        const w = weeks.find(x => x.year === Number(yearSel.value) && x.week === Number(weekSel.value));
        if (!w) return;
        const isCurrent = w === current;
        heading.textContent = isCurrent ? 'Current Parlay' : 'Past Parlay';
        backBtn.hidden = isCurrent;
        container.innerHTML = renderParlay(w, players, live);
      }
      function selectCurrent() {
        yearSel.value = current.year;
        fillWeeks(current.week);
        showSelected();
      }
      selectCurrent();
      yearSel.addEventListener('change', () => { fillWeeks(); showSelected(); });
      weekSel.addEventListener('change', showSelected);
      backBtn.addEventListener('click', selectCurrent);

      // Re-checks just the live-score map every couple minutes (the same
      // endpoint, re-fetched -- one cheap KV read) and re-renders the
      // currently-displayed week in place, without touching the
      // year/week selection or the Stats section below. publish_parlay_stats.py
      // only refreshes this data every 10 minutes itself, but polling a
      // little faster here means a game that just went live (or just
      // ended) shows up close to as soon as the backend has it.
      setInterval(() => {
        fetch(WORKER_URL + '/parlay-stats', { cache: 'no-store' })
          .then(res => res.json())
          .then(fresh => { live = fresh.live || {}; showSelected(); })
          .catch(() => {}); // a missed poll just tries again next interval
      }, 120000);

      // ---------- Stats: scope (Season-equivalent) > category tabs > subsections ----------
      let activeCategory = 0;
      let activeScope = 'all';
      const activeSub = {}; // remembers the picked subsection per category

      const scopeTabRow = document.getElementById('scope-tab-row');
      const categoryTabRow = document.getElementById('category-tab-row');
      const subTabRow = document.getElementById('sub-tab-row');
      const statsContainer = document.getElementById('stats-container');

      const scopeYears = [...(data.years || [])].sort((a, b) => b - a);
      const scopes = ['all', ...scopeYears.map(String)];
      const scopeLabel = s => s === 'all' ? 'All Time' : s;

      scopeTabRow.innerHTML = scopes.map(s => `<button type="button" class="scope-btn${s === activeScope ? ' on' : ''}" data-scope="${s}">${scopeLabel(s)}</button>`).join('');
      categoryTabRow.innerHTML = CATEGORIES.map((c, i) => `<button type="button" class="tab${i === activeCategory ? ' on' : ''}" data-i="${i}">${c.label}</button>`).join('');

      function renderStats() {
        const s = stats[activeScope];
        if (!s) return;
        const cat = CATEGORIES[activeCategory];
        if (cat.subsections) {
          const subIdx = activeSub[activeCategory] || 0;
          subTabRow.innerHTML = `<div class="seg">${cat.subsections.map((sub, i) => `<button type="button" class="${i === subIdx ? 'on' : ''}" data-sub="${i}">${sub.label}</button>`).join('')}</div>`;
          statsContainer.innerHTML = cat.subsections[subIdx].cards.map(key => CARD[key](s)).join('');
        } else {
          subTabRow.innerHTML = '';
          statsContainer.innerHTML = cat.cards.map(key => CARD[key](s)).join('');
        }
      }
      scopeTabRow.addEventListener('click', e => {
        const btn = e.target.closest('[data-scope]');
        if (!btn) return;
        activeScope = btn.dataset.scope;
        [...scopeTabRow.children].forEach(b => b.classList.toggle('on', b.dataset.scope === activeScope));
        renderStats();
      });
      categoryTabRow.addEventListener('click', e => {
        const btn = e.target.closest('.tab');
        if (!btn) return;
        activeCategory = Number(btn.dataset.i);
        [...categoryTabRow.children].forEach((b, i) => b.classList.toggle('on', i === activeCategory));
        renderStats();
      });
      subTabRow.addEventListener('click', e => {
        const btn = e.target.closest('[data-sub]');
        if (!btn) return;
        activeSub[activeCategory] = Number(btn.dataset.sub);
        renderStats();
      });
      renderStats();

      // ---------- Jon's Table (collapsible, copyable) ----------
      const jtScopeRow = document.getElementById('jt-scope-row');
      const jtTbody = document.getElementById('jt-tbody');
      const jtCopyBtn = document.getElementById('jt-copy-btn');
      const JT_HEADER = ['Team', 'W', 'L', 'Win %', 'Avg Odds', 'Kills', 'Sackos'];
      let jtScope = String(current.year);

      function jonsRows(scope) {
        const s = stats[scope];
        if (!s) return [];
        const oddsMap = Object.fromEntries(s.average_odds.map(r => [r.player, r.avg_odds]));
        const killMap = Object.fromEntries(s.parlays_killed.map(r => [r.player, r.kills]));
        const sackoMap = Object.fromEntries(s.weekly_sackos.map(r => [r.player, r.sackos]));
        // individual_wl is already ordered by win % with ties broken on
        // average odds (harder bets rank first) -- follow that order rather
        // than re-deriving a separate, potentially inconsistent one here.
        return s.individual_wl.map(wl => ({
          player: wl.player, w: wl.w, l: wl.l, win_pct: wl.win_pct,
          avgOdds: oddsMap[wl.player] ?? null, kills: killMap[wl.player] ?? 0, sackos: sackoMap[wl.player] ?? 0,
        }));
      }

      function renderJonsTable() {
        jtTbody.innerHTML = jonsRows(jtScope).map(r => `
          <tr>
            <td>${esc(r.player)}</td>
            <td>${r.w}</td>
            <td>${r.l}</td>
            <td>${fmtPct(r.win_pct)}</td>
            <td>${fmtOdds(r.avgOdds)}</td>
            <td>${r.kills.toFixed(1)}</td>
            <td>${r.sackos}</td>
          </tr>`).join('');
      }

      jtScopeRow.innerHTML = scopes.map(s => `<button type="button" class="scope-btn${s === jtScope ? ' on' : ''}" data-scope="${s}">${scopeLabel(s)}</button>`).join('');
      jtScopeRow.addEventListener('click', e => {
        const btn = e.target.closest('[data-scope]');
        if (!btn) return;
        jtScope = btn.dataset.scope;
        [...jtScopeRow.children].forEach(b => b.classList.toggle('on', b.dataset.scope === jtScope));
        renderJonsTable();
      });
      renderJonsTable();

      // ---------- Restore view state after an auto-refresh reload ----------
      // (see the Refresh Data handler below, which saves this right before
      // reloading -- without it, a refresh would silently reset the
      // visitor back to the current week, "All Time" stats, and a closed
      // Jon's Table, even if they'd navigated somewhere else first.)
      try {
        const saved = sessionStorage.getItem('parlay-view-state');
        if (saved) {
          sessionStorage.removeItem('parlay-view-state');
          const st = JSON.parse(saved);
          if (st.year !== undefined && [...yearSel.options].some(o => o.value === st.year)) {
            yearSel.value = st.year;
            fillWeeks(Number(st.week));
            showSelected();
          }
          if (st.scope && stats[st.scope]) {
            activeScope = st.scope;
            [...scopeTabRow.children].forEach(b => b.classList.toggle('on', b.dataset.scope === activeScope));
          }
          if (st.category !== undefined && CATEGORIES[st.category]) {
            activeCategory = st.category;
            [...categoryTabRow.children].forEach((b, i) => b.classList.toggle('on', i === activeCategory));
          }
          if (st.sub) Object.assign(activeSub, st.sub);
          renderStats();
          if (st.jtScope && stats[st.jtScope]) {
            jtScope = st.jtScope;
            [...jtScopeRow.children].forEach(b => b.classList.toggle('on', b.dataset.scope === jtScope));
            renderJonsTable();
          }
          if (st.jtOpen) document.querySelector('.tray').open = true;
          if (typeof st.scrollY === 'number') window.scrollTo(0, st.scrollY);
        }
      } catch (e) { /* corrupted/stale saved state -- page already rendered normally, just ignore it */ }

      function fallbackCopy(text, done) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); done(); } catch (e) { console.error('Copy failed', e); }
        document.body.removeChild(ta);
      }
      jtCopyBtn.addEventListener('click', () => {
        const lines = [JT_HEADER.join('\t')].concat(jonsRows(jtScope).map(r => [
          r.player, r.w, r.l,
          r.win_pct === null || r.win_pct === undefined ? '' : r.win_pct.toFixed(1) + '%',
          r.avgOdds === null || r.avgOdds === undefined ? '' : fmtOdds(r.avgOdds),
          r.kills.toFixed(1), r.sackos,
        ].join('\t')));
        const text = lines.join('\n');
        const done = () => {
          const original = jtCopyBtn.textContent;
          jtCopyBtn.textContent = 'Copied!';
          setTimeout(() => { jtCopyBtn.textContent = original; }, 1200);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
        } else {
          fallbackCopy(text, done);
        }
      });

      // Kicks off the "Refresh Parlay Data" GitHub Action on demand (see
      // worker/src/parlayRefresh.js) instead of waiting for its 30-minute
      // schedule. It only dispatches the run -- grading, republishing to
      // KV, and syncing to D1 (see refresh_parlay_data.yml) typically
      // finish in under a minute after that, no git commit or GitHub
      // Pages rebuild involved anymore.
      const jtRefreshBtn = document.getElementById('jt-refresh-btn');
      const jtRefreshStatus = document.getElementById('jt-refresh-status');
      // Measured from a real Action run: ~33s of actual job execution plus
      // a few seconds of dispatch/queue time -- this leaves headroom
      // rather than cutting it close.
      const RELOAD_DELAY_SECONDS = 55;
      jtRefreshBtn.addEventListener('click', () => {
        jtRefreshBtn.disabled = true;
        jtRefreshStatus.textContent = 'Requesting refresh…';
        fetch(WORKER_URL + '/refresh-parlay', { method: 'POST' })
          .then(res => res.json().then(body => ({ ok: res.ok, body })))
          .then(({ ok, body }) => {
            if (ok) {
              // The page only ever fetches parlay data once, at load, so
              // without this the refresh would finish on the server with
              // nothing on screen changing until the user thought to
              // reload manually -- counts down and reloads automatically
              // instead. Button stays disabled through the countdown
              // (the reload will restore the current view -- see below --
              // shortly anyway). Saves what's currently on screen first so
              // the reload doesn't silently drop the visitor back to the
              // current week / All Time / a closed Jon's Table if they'd
              // navigated somewhere else.
              let remaining = RELOAD_DELAY_SECONDS;
              const tick = () => {
                if (remaining <= 0) {
                  try {
                    sessionStorage.setItem('parlay-view-state', JSON.stringify({
                      year: yearSel.value, week: weekSel.value,
                      scope: activeScope, category: activeCategory, sub: activeSub,
                      jtScope, jtOpen: document.querySelector('.tray').open,
                      scrollY: window.scrollY,
                    }));
                  } catch (e) { /* sessionStorage unavailable -- reload still happens, just without state restore */ }
                  location.reload();
                  return;
                }
                jtRefreshStatus.textContent = `Refresh started — reloading in ${remaining}s…`;
                remaining -= 1;
                setTimeout(tick, 1000);
              };
              tick();
            } else if (body && body.error === 'cooldown') {
              jtRefreshStatus.textContent = `Just refreshed — try again in ${body.retryAfterSeconds}s.`;
              jtRefreshBtn.disabled = false;
            } else {
              jtRefreshStatus.textContent = 'Refresh failed — try again shortly.';
              jtRefreshBtn.disabled = false;
            }
          })
          .catch(() => {
            jtRefreshStatus.textContent = 'Refresh failed — try again shortly.';
            jtRefreshBtn.disabled = false;
          });
      });

      document.getElementById('updated-at').textContent = formatUpdated(data.generated_at);
    })
    .catch(err => {
      console.error('Parlay data error:', err);
      document.getElementById('current-container').innerHTML = '<div class="loading-row" style="color:var(--loss);">Error loading parlay data.</div>';
    });
</script>
<script src="track.js?v=1" defer></script>
</body>
</html>
