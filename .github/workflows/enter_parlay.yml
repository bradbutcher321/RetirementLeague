name: Enter Parlay Picks

# Dispatched by the Worker's POST /parlay-entry (worker/src/parlayEntry.js)
# once the site's Enter Picks page has the PIN right. The page already
# parsed the note and found the games, so this only writes the week to
# Auto Parlay Tracker (enter_parlay.py), then runs the same grade, publish
# and D1 sync as refresh_parlay_data.yml so the week shows on the site.
on:
  workflow_dispatch:
    inputs:
      picks:
        description: "The week as JSON (see enter_parlay.py)"
        required: true

permissions:
  contents: read

# Two saves in a row run one after the other, never side by side.
concurrency:
  group: enter-parlay
  cancel-in-progress: false

jobs:
  enter:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install gspread google-auth

    - name: Create Google Secret File
      run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > google_secret.json

    # The input goes through env, never pasted into the script, so nothing
    # typed on the page can run as shell.
    - name: Write the Week to the Sheet
      env:
        GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        PICKS: ${{ inputs.picks }}
      run: python enter_parlay.py

    - name: Grade Finished Games
      env:
        GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      run: python auto_grade_results.py

    - name: Publish Parlay Stats to Cloudflare KV
      if: ${{ !cancelled() }}
      env:
        GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: f53f8e388e691eca52769f9f586713df
      run: python publish_parlay_stats.py

    - name: Sync Picks to D1
      if: ${{ !cancelled() }}
      env:
        GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: f53f8e388e691eca52769f9f586713df
      run: python sync_parlay_to_d1.py

    - name: Remove Google Secret File
      if: always()
      run: rm -f google_secret.json
