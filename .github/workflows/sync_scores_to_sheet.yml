name: Sync Scores to Sheet

on:
  schedule:
    # Tuesday 12:30am US Eastern -- shortly after Monday Night Football
    # wraps, so every game for the week should be final in D1 by then.
    # GitHub Actions cron always runs in UTC (no named-timezone option),
    # so 4:30 UTC lands around 12:30-1:30am Eastern depending on daylight
    # saving -- adjust the hour here if you want it more precise.
    - cron: '30 4 * * 2'
  workflow_dispatch: # Manual button inside GitHub web console

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install gspread google-auth

    - name: Create Google Secret File
      run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > google_secret.json

    - name: Sync Scores to Game Tracker
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: f53f8e388e691eca52769f9f586713df
      run: python sync_scores_to_sheet.py

    - name: Remove Google Secret File
      if: always()
      run: rm -f google_secret.json
