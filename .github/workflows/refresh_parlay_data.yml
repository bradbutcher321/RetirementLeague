name: Refresh Parlay Data

on:
  schedule:
    # Parlay results change as games finish, so refresh every 30 minutes.
    - cron: '*/30 * * * *'
  workflow_dispatch: # Manual button inside GitHub web console

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install gspread google-auth

    - name: Create Google Secret File
      run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > google_secret.json

    - name: Publish Parlay Stats to Cloudflare KV
      env:
        GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: f53f8e388e691eca52769f9f586713df
      run: python publish_parlay_stats.py

    - name: Remove Google Secret File
      if: always()
      run: rm -f google_secret.json
