name: Refresh Parlay Data

on:
  schedule:
    # Parlay results change as games finish, so refresh every 30 minutes.
    # The script only rewrites parlay.json when the data actually changed,
    # so quiet periods don't create commits.
    - cron: '*/30 * * * *'
  workflow_dispatch: # Manual button inside GitHub web console

permissions:
  contents: write

concurrency:
  group: refresh-parlay-data
  cancel-in-progress: false

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install gspread google-auth

    - name: Create Google Secret File
      run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > google_secret.json

    - name: Run Parlay Data Script
      env:
        GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      run: python generate_parlay_data.py

    - name: Remove Google Secret File
      if: always()
      run: rm -f google_secret.json

    - name: Commit and Push Updated Data
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add docs/data/parlay.json
        git diff --cached --quiet || git commit -m "Update parlay data"
        git pull --rebase
        git push
