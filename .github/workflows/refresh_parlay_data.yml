name: Refresh Parlay Data

on:
  # No schedule: trigger here -- GitHub's own cron is best-effort and was
  # observed firing every 2.5-5.5 hours instead of every 30 minutes
  # (silently dropped rather than queued, worst right at :00/:30 when
  # everyone else's crons also fire). A Cloudflare Cron Trigger dispatches
  # this workflow every 30 minutes instead -- see worker/wrangler.toml's
  # [triggers] and the scheduled() handler in worker/src/index.js.
  workflow_dispatch: # Manual button inside GitHub web console, and Cloudflare's cron dispatch

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install gspread google-auth

    - name: Create Google Secret File
      run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > google_secret.json

    # These three are independent operations sharing one credential-setup
    # step, so each runs regardless of whether an earlier one failed
    # (`!cancelled()` -- everything except an actual cancellation) --
    # confirmed directly this matters: Publish once failed on a Cloudflare
    # token permission issue and silently skipped the unrelated D1 sync
    # right after it, even though nothing about D1 was broken.
    - name: Grade Finished Games
      if: ${{ !cancelled() }}
      env:
        GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      run: python auto_grade_results.py

    - name: Publish Parlay Stats to Cloudflare KV
      if: ${{ !cancelled() }}
      env:
        GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: f53f8e388e691eca52769f9f586713df
      run: python publish_parlay_stats.py

    - name: Sync Picks to D1
      if: ${{ !cancelled() }}
      env:
        GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: f53f8e388e691eca52769f9f586713df
      run: python sync_parlay_to_d1.py

    - name: Remove Google Secret File
      if: always()
      run: rm -f google_secret.json
