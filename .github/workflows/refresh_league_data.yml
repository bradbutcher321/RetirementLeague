name: Refresh League Data

on:
  schedule:
    # Game Tracker is updated by hand after each week's games, so a few
    # times a day is plenty. The script only rewrites league.json when the
    # data actually changed.
    - cron: '15 */3 * * *'
  workflow_dispatch: # Manual button inside GitHub web console

permissions:
  contents: write

concurrency:
  group: refresh-league-data
  cancel-in-progress: false

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install gspread google-auth

    - name: Create Google Secret File
      run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > google_secret.json

    - name: Run League Data Script
      env:
        GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: f53f8e388e691eca52769f9f586713df
      run: python generate_league_data_d1.py

    - name: Remove Google Secret File
      if: always()
      run: rm -f google_secret.json

    - name: Commit and Push Updated Data
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add docs/data/league.json
        git diff --cached --quiet || git commit -m "Update league data"
        git pull --rebase
        git push
