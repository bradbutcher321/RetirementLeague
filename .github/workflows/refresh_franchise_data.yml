name: Refresh Franchise Data

on:
  # Chained to the nightly D1 refresh (update_history_d1.yml, 12:22am
  # Eastern) instead of its own cron, so it always builds from that night's
  # data -- GitHub's cron runs hours late, and the old fixed 12:00 UTC slot
  # was landing mid-afternoon. The gate job below lets it through only on
  # Tuesday (Monday Night Football results), Thursday (ESPN's stat
  # corrections, usually applied Tue-Wed) and Friday (a backstop for late
  # corrections). A Monday run would add nothing: this script drops
  # matchups ESPN hasn't decided, and none are decided until MNF ends.
  workflow_run:
    workflows: ["Update League History (D1)"]
    types: [completed]
  workflow_dispatch: # Manual button inside GitHub web console

permissions:
  contents: write

jobs:
  gate:
    # Only after a successful D1 refresh, and only on Tue/Thu/Fri (US
    # Eastern, so a run GitHub starts late still counts as the right day).
    # A manual run always goes ahead.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.day.outputs.go }}
    steps:
    - id: day
      run: |
        dow=$(TZ=America/New_York date +%u)
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$dow" = 2 ] || [ "$dow" = 4 ] || [ "$dow" = 5 ]; then
          echo "go=true" >> "$GITHUB_OUTPUT"
        else
          echo "Day $dow is not Tue/Thu/Fri -- skipping."
          echo "go=false" >> "$GITHUB_OUTPUT"
        fi

  build-and-commit:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install gspread google-auth requests

    - name: Create Google Secret File
      run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > google_secret.json

    - name: Run Franchise Data Script
      env:
        GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: f53f8e388e691eca52769f9f586713df
        # Logos uploaded to ESPN only load for a logged-in browser; the
        # cookies let logo_mirror.py fetch them into docs/icons/teams/.
        ESPN_S2: ${{ secrets.ESPN_S2 }}
        ESPN_SWID: ${{ secrets.ESPN_SWID }}
      run: python generate_franchise_data_d1.py

    - name: Run Draft Board Data Script
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: f53f8e388e691eca52769f9f586713df
      run: python generate_draft_board_data.py

    - name: Run Rule Changes Data Script
      env:
        GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: f53f8e388e691eca52769f9f586713df
      run: python generate_rule_changes_data.py

    # Trades & Waivers and Players (audit III #1, #5): D1 plus ESPN's
    # transaction feed, which needs the same cookies as the logo mirror.
    - name: Run Moves and Players Data Script
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: f53f8e388e691eca52769f9f586713df
        ESPN_S2: ${{ secrets.ESPN_S2 }}
        ESPN_SWID: ${{ secrets.ESPN_SWID }}
      run: python generate_moves_data.py

    - name: Remove Google Secret File
      if: always()
      run: rm -f google_secret.json

    - name: Commit and Push Updated Data
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add docs/data/franchise.json docs/data/draft-board.json docs/data/rule-changes.json docs/data/moves.json docs/data/players-index.json docs/data/players docs/icons/teams
        git diff --cached --quiet || git commit -m "Update franchise, draft board, rule changes, moves and players data"
        git pull --rebase
        git push
