name: Refresh Fantasy Dashboard

on:
  schedule:
    # Runs every 15 minutes from Thursday afternoon through Monday night (Fantasy Game Days)
    - cron: '*/15 * * * 4,5,6,0,1'
    # Runs once every 3 hours on Tuesday and Wednesday (Fantasy Off-days)
    - cron: '0 */3 * * 2,3'
  repository_dispatch:
    # Allows our frontend webpage access button to send a webhook event trigger
    types: [web_site_access]
  workflow_dispatch: # Manual button inside GitHub web console

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests gspread google-auth

    - name: Create Google Secret File
      run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > google_secret.json

    - name: Run Median Calculations Script
      env:
        ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
        ESPN_YEAR: ${{ secrets.ESPN_YEAR }}
        ESPN_SWID: ${{ secrets.ESPN_SWID }}
        ESPN_S2: ${{ secrets.ESPN_S2 }}
        GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        # Pass down the webhook event token payload context if it came from the webpage
        TRIGGER_SOURCE: ${{ github.event.action == 'web_site_access' && 'web_access' || 'schedule' }}
      run: python update_page_and_sheets.py
