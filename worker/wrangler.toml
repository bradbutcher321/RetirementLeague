name = "retirement-league-refresh-proxy"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Plain-text config (safe to commit — these are not secrets)
[vars]
ALLOWED_ORIGIN = "https://bradbutcher321.github.io"  # tighten this to your real site URL
ESPN_LEAGUE_ID = "58101"
ESPN_YEAR = "2026"

# Secrets — NOT set here. Run these once locally:
#   wrangler secret put ESPN_SWID
#   wrangler secret put ESPN_S2
#   wrangler secret put GITHUB_PAT
# (ESPN_SWID/S2 match the GitHub Actions secrets of the same name.
# GITHUB_PAT is a fine-grained token scoped to just this repo, with
# Actions: read/write and nothing else -- used only by /refresh-parlay
# to dispatch refresh_parlay_data.yml on demand.)

# KV namespace, now used to cache the computed dashboard payload (previously
# only held the cooldown timestamp).
[[kv_namespaces]]
binding = "COOLDOWN_KV"
id = "1521d1a4fe954b00a05b4542c7a44670"

# Site analytics: one row per page view, plus a last-seen table for "active now".
[[d1_databases]]
binding = "DB"
database_name = "retirement-league-analytics"
database_id = "5bf8d0cf-b461-437b-9367-7818a00a431d"

# Full league history (2015-present): team/matchup records for every season,
# plus full weekly box scores (starters + bench, every stat) from 2019 on.
# See RetirementLeague/database/schema.sql and build_history_db.py.
[[d1_databases]]
binding = "HISTORY_DB"
database_name = "retirement-league-history"
database_id = "a8caf66c-650a-4e93-af94-a909c32f0808"
