<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League Statistics & Medians</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; }
        .card-box { display: flex; gap: 20px; margin-bottom: 30px; }
        .card { flex: 1; background: #e8f4f8; padding: 20px; border-radius: 6px; border-left: 5px solid #3498db; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: #f8f9fa; }
    </style>
</head>
<body>
    <div class="container">
        <h1>League Performance Dashboard</h1>
        <div class="card-box">
            <div class="card">
                <h3>Current Median</h3>
                <p id="curr-median" style="font-size: 24px; font-weight: bold;">Loading...</p>
            </div>
            <div class="card">
                <h3>Projected Median</h3>
                <p id="proj-median" style="font-size: 24px; font-weight: bold;">Loading...</p>
            </div>
        </div>

        <h2>Historical & Live Records</h2>
        <div id="table-container">Loading sheet data...</div>
    </div>

    <script>
        // Replace with your published Google Sheet CSV URL
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTpuyTa17f_K_VMTCVBXO4bDPaPkiDf66w8OAXTPtyn1MTQR3yjuCORs91WPabAyjo5Wso_eXKNM1SS/pub?output=csv';

        fetch(csvUrl)
            .then(response => response.text())
            .then(data => {
                const rows = data.split('\n').map(row => row.split(','));
                let html = '<table>';
                rows.forEach((row, index) => {
                    html += '<tr>';
                    row.forEach(cell => {
                        html += index === 0 ? `<th>${cell}</th>` : `<td>${cell}</td>`;
                    });
                    html += '</tr>';
                });
                html += '</table>';
                document.getElementById('table-container').innerHTML = html;
                
                // Optional: Extract specific cells if you place medians in fixed coordinates
                // document.getElementById('curr-median').innerText = rows[1][1]; 
            })
            .catch(error => {
                document.getElementById('table-container').innerText = 'Failed to load sheet data.';
            });
    </script>
</body>
</html>
